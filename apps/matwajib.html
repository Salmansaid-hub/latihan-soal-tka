dal Rp5000000 menjadi Rp6050000 setelah dua tahun dengan bunga majemuk tetap r per tahun. Besar r adalah …%.", "options": ["21", "10", "5", "10,5", "11"], "key": [1], "kind": "pg", "why": "(1+r)²=6050000/5000000=1,21. Karena saldo positif dan bunga pertumbuhan, 1+r=1,1, sehingga r=0,1=10%.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A28", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-531", "cat": 1, "sub": "Program linear", "level": 3, "stem": "Daerah layak memenuhi x+y≤20, x≤10, x,y≥0. Fungsi tujuan Z=3x+2y.", "options": ["Titik (10,10) layak.", "Nilai maksimum Z adalah 50.", "Titik (0,20) memberi Z terbesar."], "key": [true, true, false], "kind": "bs", "why": "Titik pojoknya (0,0),(10,0),(10,10),(0,20). Nilai Z: 0,30,50,40. Maka maksimum di (10,10).", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A29", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-532", "cat": 1, "sub": "Pertidaksamaan linear", "level": 2, "stem": "Banyak bilangan bulat x yang memenuhi −5<x≤8 adalah ….", "options": ["14", "12", "15", "29", "13"], "key": [4], "kind": "pg", "why": "Bilangan bulat terkecil adalah -4 dan terbesar 8. Banyaknya = 8−(-4)+1=13.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A30", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-533", "cat": 2, "sub": "Sudut dan garis", "level": 2, "stem": "Dua sudut dalam segitiga masing-masing 35° dan 65°. Sudut luar pada titik sudut ketiga adalah …°.", "options": ["99", "102", "203", "100", "101"], "key": [3], "kind": "pg", "why": "Sudut luar segitiga sama dengan jumlah dua sudut dalam yang tidak berdekatan: 35+65=100°.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G23", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-534", "cat": 2, "sub": "Luas dan keliling", "level": 3, "stem": "Taman berbentuk persegi sisi 10 meter. Di dalamnya dibuat kolam lingkaran yang menyinggung keempat sisi. Luas taman di luar kolam adalah … m².", "options": ["50 − 25π", "100 + 25π", "100 − 25π", "100 − 50π", "100 − 100π"], "key": [2], "kind": "pg", "why": "Luas persegi=100. Diameter kolam=10, sehingga r=5 dan luas kolam=25π. Kurangkan luasnya.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G24", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-535", "cat": 2, "sub": "Volume dan luas permukaan", "level": 3, "stem": "Sebuah akuarium beralas 50 cm × 20 cm. Setelah sebuah benda seluruhnya dicelupkan, permukaan air naik 3 cm tanpa tumpah. Volume benda … cm³.", "options": ["6003", "3000", "3001", "2999", "3002"], "key": [1], "kind": "pg", "why": "Volume air yang dipindahkan sama dengan volume benda tercelup: luas alas×kenaikan air=(50×20)×3=3000 cm³.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G25", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-536", "cat": 2, "sub": "Transformasi titik", "level": 3, "stem": "Titik P(5,3) didilatasikan dengan pusat C(1,1) dan faktor 2. Koordinat bayangan P adalah ….", "options": ["(9, 5)", "(10, 6)", "(11, 7)", "(4, 2)", "(9, 3)"], "key": [0], "kind": "pg", "why": "P′=C+2(P−C)=(1+2(5−1),1+2(3−1))=(9,5).", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G26", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-537", "cat": 2, "sub": "Pythagoras dan jarak", "level": 3, "stem": "Segitiga siku-siku mempunyai kaki 15 cm dan 20 cm. Tinggi yang ditarik dari sudut siku-siku ke sisi miring panjangnya … cm.", "options": ["25/2", "15", "20", "25", "12"], "key": [4], "kind": "pg", "why": "Luas dengan dua kaki=½×15×20. Sisi miring=25. Samakan dengan ½×25×h, sehingga h=60/5=12.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G27", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-538", "cat": 2, "sub": "Kesebangunan", "level": 3, "stem": "Dua segitiga sebangun mempunyai perbandingan sisi 2:3. Luas segitiga kecil 20 cm². Luas segitiga besar … cm².", "options": ["44", "47", "93", "45", "46"], "key": [3], "kind": "pg", "why": "Perbandingan luas adalah kuadrat perbandingan sisi, yaitu 4:9. Luas besar=20×9/4=45 cm².", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G28", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-539", "cat": 2, "sub": "Pythagoras dan jarak", "level": 2, "stem": "Jarak titik P(5,3) ke titik Q(11,11) adalah … satuan.", "options": ["12", "14", "10", "6", "8"], "key": [2], "kind": "pg", "why": "Selisih koordinatnya 6 dan 8. Jarak=√(6²+8²)=√100=10.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G29", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-540", "cat": 2, "sub": "Volume dan luas permukaan", "level": 3, "stem": "Sebuah kubus bersisi 5 cm diperbesar sehingga setiap rusuknya 3 kali semula. Volume baru … kali volume semula.", "options": ["81", "27", "3", "6", "9"], "key": [1], "kind": "pg", "why": "Faktor volume=k³=3³=27. Nilai rusuk awal 5 cm tidak mengubah perbandingan ini.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G30", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-541", "cat": 3, "sub": "Rasio trigonometri", "level": 2, "stem": "Sudut lancip A memenuhi cos A=60/65. Nilai cot A adalah ….", "options": ["12/5", "5/12", "12/13", "13/5", "5/13"], "key": [0], "kind": "pg", "why": "Perbandingan samping:miring=12:13, sehingga depan=√(13²−12²)=5. cot A=samping/depan=12/5.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T09", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-542", "cat": 3, "sub": "Sudut istimewa", "level": 2, "stem": "Hasil 5 tan 45° + 4 sin²30° adalah ….", "options": ["7", "5", "8", "15", "6"], "key": [4], "kind": "pg", "why": "tan45°=1; sin30°=½, sehingga sin²30°=¼. Hasil=5×1+4×¼=6.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T10", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-543", "cat": 3, "sub": "Sudut dan kuadran", "level": 2, "stem": "Diketahui cos A=−15/25, dengan 90°<A<180°. Nilai tan A adalah ….", "options": ["-3/4", "3/4", "-4/5", "-4/3", "4/3"], "key": [3], "kind": "pg", "why": "Cos negatif di kuadran II, sedangkan sin positif. sin A=√(1−9/25)=4/5. tan A=(4/5)/(−3/5)=−4/3.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T11", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-544", "cat": 3, "sub": "Aplikasi trigonometri", "level": 3, "stem": "Jalan menanjak membentuk sudut 30° dengan bidang horizontal. Mobil menempuh 20 meter sepanjang jalan tersebut. Kenaikan ketinggiannya … meter.", "options": ["12", "23", "10", "11", "9"], "key": [2], "kind": "pg", "why": "Jarak sepanjang jalan adalah sisi miring. Kenaikan tinggi=20sin30°=20×½=10.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T12", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-545", "cat": 3, "sub": "Sudut dan kuadran", "level": 3, "stem": "Untuk sudut θ=45° yang lancip, tentukan kebenaran identitas berikut.", "options": ["sin(180°−θ)=sin θ", "cos(180°−θ)=cos θ", "tan(180°−θ)=−tan θ"], "key": [true, false, true], "kind": "bs", "why": "180°−45° berada di kuadran II: sinus tetap positif, kosinus berubah tanda, dan tangen berubah tanda.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T13", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-546", "cat": 3, "sub": "Aplikasi trigonometri", "level": 3, "stem": "Dari puncak tebing setinggi 50 meter, sudut depresi ke perahu adalah 45°. Permukaan air datar dan kaki tebing tegak di atas permukaan air. Jarak horizontal perahu ke kaki tebing … meter.", "options": ["50", "51", "49", "52", "103"], "key": [0], "kind": "pg", "why": "Sudut depresi sama dengan sudut elevasi perahu ke puncak. tan45°=tinggi/jarak=1, sehingga jarak=50 meter.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T14", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-547", "cat": 4, "sub": "Data tunggal", "level": 3, "stem": "Rata-rata lima bilangan adalah 11. Jika bilangan 7 dihapus, rata-rata empat bilangan sisanya adalah ….", "options": ["13", "11", "14", "27", "12"], "key": [4], "kind": "pg", "why": "Jumlah awal=5×11=55. Sisa=55−7=48. Rata-rata sisa=48/4=12.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D17", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-548", "cat": 4, "sub": "Data tunggal", "level": 2, "stem": "Data terurut: 5, 7, 9, 11, 13, 15, 17. Dengan median tidak diikutkan dalam kedua separuh data, jangkauan antarkuartil adalah ….", "options": ["6", "10", "12", "8", "4"], "key": [3], "kind": "pg", "why": "Median adalah 11. Q₁ median dari 5,7,9, yaitu 7. Q₃ median dari 13,15,17, yaitu 15. IQR=8.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D18", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-549", "cat": 4, "sub": "Peluang majemuk", "level": 3, "stem": "Tiga koin seimbang dilempar bersama dalam 40 percobaan. Frekuensi harapan muncul tepat dua sisi angka adalah ….", "options": ["17", "33", "15", "16", "14"], "key": [2], "kind": "pg", "why": "Ada 8 hasil sama mungkin. Tepat dua angka terjadi pada AAG, AGA, GAA, sehingga peluang=3/8. Frekuensi harapan=40×3/8=15.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D19", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-550", "cat": 4, "sub": "Peluang majemuk", "level": 3, "stem": "Kotak berisi 5 bola merah dan 6 bola biru. Dua bola diambil sekaligus. Peluang keduanya merah adalah ….", "options": ["6/11", "2/11", "5/11", "25/121", "1/2"], "key": [1], "kind": "pg", "why": "Banyak pasangan merah C(5,2)=10. Seluruh pasangan C(11,2)=55. Peluang=2/11.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D20", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-551", "cat": 4, "sub": "Peluang majemuk", "level": 3, "stem": "Peluang mesin bekerja baik dalam satu hari adalah 8/10. Kondisi pada dua hari berbeda independen. Peluang setidaknya satu dari dua hari mesin bekerja baik adalah ….", "options": ["24/25", "16/25", "4/5", "1/25", "1/5"], "key": [0], "kind": "pg", "why": "Peluang tidak bekerja baik sehari=(10−8)/10=2/10. Komplemen dua hari sama-sama gagal: 1−(2/10)²=24/25.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D21", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-552", "cat": 4, "sub": "Aturan pencacahan", "level": 3, "stem": "8 orang berbeda duduk mengelilingi meja bundar. Susunan yang hanya berbeda karena rotasi dianggap sama, tetapi pencerminan dianggap berbeda. Banyak susunan ….", "options": ["40320", "720", "2520", "10080", "5040"], "key": [4], "kind": "pg", "why": "Tetapkan posisi satu orang untuk menghilangkan pengulangan rotasi. Sisanya 7 orang dapat diatur dalam (7)!=5040 cara.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D22", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-553", "cat": 4, "sub": "Aturan pencacahan", "level": 3, "stem": "Kode terdiri dari 3 digit yang dipilih dari angka 1 sampai 8. Tidak boleh ada pengulangan. Banyak kode berbeda adalah ….", "options": ["56", "24", "341", "336", "512"], "key": [3], "kind": "pg", "why": "Tempat pertama mempunyai 8 pilihan, kedua 7, ketiga 6. Kalikan menjadi 336.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D23", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-554", "cat": 4, "sub": "Aturan pencacahan", "level": 3, "stem": "Sebuah tim 3 orang dipilih dari 7 putra dan 3 putri. Tim harus terdiri dari 2 putra dan 1 putri. Banyak tim berbeda adalah ….", "options": ["126", "68", "63", "120", "21"], "key": [2], "kind": "pg", "why": "Pilih 2 putra dalam C(7,2)=21 cara; pilih 1 putri dalam 3 cara. Kalikan: 63.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D24", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-555", "cat": 4, "sub": "Data tunggal", "level": 3, "stem": "Seluruh nilai data awal 5, 7, 9 dikalikan 2.", "options": ["Mean menjadi dua kali mean awal.", "Varians menjadi dua kali varians awal.", "Simpangan baku menjadi dua kali simpangan baku awal."], "key": [true, false, true], "kind": "bs", "why": "Perkalian setiap data dengan 2 mengalikan mean dengan 2. Simpangan dari mean ikut menjadi 2 kali, sehingga varians menjadi 4 kali dan simpangan baku 2 kali.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D25", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-556", "cat": 4, "sub": "Penyajian data", "level": 3, "stem": "Penjualan naik dari 200 unit menjadi 250 unit, lalu turun kembali ke 200 unit. Besar penurunan persentase pada tahap kedua adalah …%.", "options": ["20", "10", "15", "25", "30"], "key": [0], "kind": "pg", "why": "Tahap kedua memakai nilai dasar 250. Penurunan=(250−200)/250×100%=20%.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D26", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-557", "cat": 0, "sub": "Operasi bilangan", "level": 2, "stem": "Suatu wadah terisi 3/4 bagian. Sebanyak 6 liter dikeluarkan sehingga tersisa 1/2 bagian. Kapasitas wadah … liter.", "options": ["25", "23", "26", "51", "24"], "key": [4], "kind": "pg", "why": "Bagian yang dikeluarkan=3/4−1/2=1/4. Jadi seperempat kapasitas=6 liter, kapasitas total=24 liter.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B11", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-558", "cat": 0, "sub": "Persen dan perbandingan", "level": 3, "stem": "8 pekerja menyelesaikan proyek dalam 12 hari. Setelah 4 hari, 8 pekerja tambahan datang. Produktivitas sama dan pekerjaan dapat dibagi merata. Sisa waktu pengerjaan … hari.", "options": ["6", "8", "12", "4", "2"], "key": [3], "kind": "pg", "why": "Tersisa pekerjaan setara 8 hari bagi tim awal. Jumlah pekerja kini dua kali lipat, jadi sisa waktu 8/2=4 hari.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B12", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-559", "cat": 0, "sub": "Pangkat dan akar", "level": 2, "stem": "Sederhanakan 6/√2 dengan merasionalkan penyebut.", "options": ["6/2", "12√2", "6√2/2", "6√2", "√2/6"], "key": [2], "kind": "pg", "why": "Kalikan pembilang dan penyebut dengan √2: 6√2/(√2×√2)=6√2/2.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B13", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-560", "cat": 0, "sub": "Pangkat dan akar", "level": 2, "stem": "Jika 3^(x+1)=2187, nilai x adalah ….", "options": ["15", "6", "7", "5", "8"], "key": [1], "kind": "pg", "why": "2187=3^7. Basisnya sama dan 3≠1, maka x+1=7, sehingga x=6.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B14", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-561", "cat": 0, "sub": "Operasi bilangan", "level": 2, "stem": "Sebuah pita sepanjang 10 meter dipotong menjadi bagian sama panjang, masing-masing 3/4 meter. Panjang sisa pita setelah dibuat sebanyak mungkin potongan utuh adalah … meter.", "options": ["1/4", "3/4", "1", "5/4", "3/2"], "key": [0], "kind": "pg", "why": "Total pita=40 satuan seperempat meter. Tiap potongan memakai 3 satuan. Sisa pembagian 40 oleh 3 adalah 1, yaitu 1/4 meter.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B15", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-562", "cat": 0, "sub": "Sifat bilangan", "level": 3, "stem": "Untuk x=−6, nilai kebenaran pernyataan berikut adalah ….", "options": ["√(x²)=x", "|x|=−x", "x²>0"], "key": [false, true, true], "kind": "bs", "why": "Akar utama tidak negatif: √(x²)=6, berbeda dari x=−6. Nilai mutlak |x|=6=−x dan x²=36>0.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B16", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-563", "cat": 0, "sub": "Persen dan perbandingan", "level": 2, "stem": "Modal sebuah barang Rp480000. Penjual ingin laba 25% dari modal. Harga jualnya … rupiah.", "options": ["636000", "720000", "480000", "600000", "576000"], "key": [3], "kind": "pg", "why": "Laba=25%×480000=120000; harga jual=modal+laba=600000.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B17", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-564", "cat": 0, "sub": "Operasi bilangan", "level": 2, "stem": "Hasil (1/6) ÷ (2/7) adalah ….", "options": ["7/6", "1/7", "7/12", "12/7", "1/21"], "key": [2], "kind": "pg", "why": "Pembagian pecahan diubah menjadi perkalian dengan kebalikan: (1/6)×(7/2)=7/12.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B18", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-565", "cat": 0, "sub": "Persen dan perbandingan", "level": 3, "stem": "Larutan A sebanyak 6 liter mengandung 20% gula. Larutan B sebanyak 12 liter mengandung 50% gula. Kadar gula campuran …%. Anggap volume dijumlahkan.", "options": ["70", "40", "30", "35", "45"], "key": [1], "kind": "pg", "why": "Jumlah gula=0,2×6+0,5×12=7.2 liter ekuivalen. Volume=18. Kadarnya 1,2/3=0,4=40%.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B19", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-566", "cat": 0, "sub": "Pangkat dan akar", "level": 2, "stem": "Nilai (2^−6) × (2^9) adalah ….", "options": ["8", "2", "4", "16", "32"], "key": [0], "kind": "pg", "why": "Pangkat dijumlahkan: −6+9=3. Jadi hasilnya 2³=8.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B20", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-567", "cat": 1, "sub": "Persamaan linear", "level": 3, "stem": "Sebanyak 60 tiket terjual. Tiket dewasa Rp20.000 dan anak Rp10.000. Pendapatan Rp960000. Banyak tiket dewasa adalah ….", "options": ["37", "35", "38", "75", "36"], "key": [4], "kind": "pg", "why": "Andaikan semua tiket anak, pendapatan Rp600000. Kelebihan Rp360000 berasal dari selisih Rp10.000 per tiket dewasa. Jumlah dewasa=36.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A21", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-568", "cat": 1, "sub": "Fungsi kuadrat", "level": 3, "stem": "Sebuah persegi panjang mempunyai keliling 48 meter. Luas maksimumnya … m².", "options": ["143", "146", "291", "144", "145"], "key": [3], "kind": "pg", "why": "p+l=24. Luas p(24−p) mencapai maksimum saat p=l=12. Luas maksimal=12×12=144.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A22", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-569", "cat": 1, "sub": "Fungsi kuadrat", "level": 2, "stem": "Fungsi f(x)=x²−12x+27 memotong sumbu x di x₁ dan x₂. Jumlah kedua akar adalah ….", "options": ["14", "27", "12", "13", "11"], "key": [2], "kind": "pg", "why": "Jumlah akar persamaan ax²+bx+c=0 adalah −b/a. Di sini −(−12)/1=12. Akar realnya 3 dan 9.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A23", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-570", "cat": 1, "sub": "Domain dan range", "level": 2, "stem": "Domain f(x)=√(2x−12) adalah ….", "options": ["x ≠ 6", "x ≥ 6", "x > 6", "x ≤ 6", "x < 6"], "key": [1], "kind": "pg", "why": "Isi akar harus tidak negatif: 2x−12≥0. Maka x≥6.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A24", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-571", "cat": 1, "sub": "Invers dan komposisi", "level": 3, "stem": "g(x)=x−6 dan (f∘g)(x)=2x+1. Nilai f(3) adalah ….", "options": ["19", "20", "18", "21", "41"], "key": [0], "kind": "pg", "why": "Agar g(x)=3, pilih x=9. Maka f(3)=(f∘g)(9)=2×9+1=19.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A25", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-572", "cat": 1, "sub": "Barisan dan deret", "level": 3, "stem": "Barisan aritmetika memiliki U₃=12 dan U₈=27. Suku pertamanya adalah ….", "options": ["7", "5", "8", "15", "6"], "key": [4], "kind": "pg", "why": "U₈−U₃=5b=15, sehingga b=3. Lalu a=U₃−2b=12−6=6.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A26", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-573", "cat": 1, "sub": "Barisan dan deret", "level": 3, "stem": "Bola dijatuhkan dari tinggi 54 meter. Setiap pantulan mencapai 1/3 tinggi sebelumnya. Total lintasan hingga bola berhenti secara ideal … meter.", "options": ["72", "90", "162", "108", "54"], "key": [3], "kind": "pg", "why": "Jatuh awal=54. Total tinggi semua pantulan = 18/(1−1/3)=27. Setiap pantulan dilalui naik dan turun. Total=54+2×27=108.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A27", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-574", "cat": 1, "sub": "Pertumbuhan dan bunga", "level": 3, "stem": "Modal Rp6000000 menjadi Rp7260000 setelah dua tahun dengan bunga majemuk tetap r per tahun. Besar r adalah …%.", "options": ["11", "21", "10", "5", "10,5"], "key": [2], "kind": "pg", "why": "(1+r)²=7260000/6000000=1,21. Karena saldo positif dan bunga pertumbuhan, 1+r=1,1, sehingga r=0,1=10%.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A28", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-575", "cat": 1, "sub": "Program linear", "level": 3, "stem": "Daerah layak memenuhi x+y≤24, x≤12, x,y≥0. Fungsi tujuan Z=3x+2y.", "options": ["Titik (12,12) layak.", "Nilai maksimum Z adalah 60.", "Titik (0,24) memberi Z terbesar."], "key": [true, true, false], "kind": "bs", "why": "Titik pojoknya (0,0),(12,0),(12,12),(0,24). Nilai Z: 0,36,60,48. Maka maksimum di (12,12).", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A29", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-576", "cat": 1, "sub": "Pertidaksamaan linear", "level": 2, "stem": "Banyak bilangan bulat x yang memenuhi −6<x≤9 adalah ….", "options": ["15", "16", "14", "17", "33"], "key": [0], "kind": "pg", "why": "Bilangan bulat terkecil adalah -5 dan terbesar 9. Banyaknya = 9−(-5)+1=15.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A30", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-577", "cat": 2, "sub": "Sudut dan garis", "level": 2, "stem": "Dua sudut dalam segitiga masing-masing 36° dan 66°. Sudut luar pada titik sudut ketiga adalah …°.", "options": ["103", "101", "104", "207", "102"], "key": [4], "kind": "pg", "why": "Sudut luar segitiga sama dengan jumlah dua sudut dalam yang tidak berdekatan: 36+66=102°.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G23", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-578", "cat": 2, "sub": "Luas dan keliling", "level": 3, "stem": "Taman berbentuk persegi sisi 12 meter. Di dalamnya dibuat kolam lingkaran yang menyinggung keempat sisi. Luas taman di luar kolam adalah … m².", "options": ["144 − 144π", "72 − 36π", "144 + 36π", "144 − 36π", "144 − 72π"], "key": [3], "kind": "pg", "why": "Luas persegi=144. Diameter kolam=12, sehingga r=6 dan luas kolam=36π. Kurangkan luasnya.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G24", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-579", "cat": 2, "sub": "Volume dan luas permukaan", "level": 3, "stem": "Sebuah akuarium beralas 60 cm × 20 cm. Setelah sebuah benda seluruhnya dicelupkan, permukaan air naik 3 cm tanpa tumpah. Volume benda … cm³.", "options": ["3602", "7203", "3600", "3601", "3599"], "key": [2], "kind": "pg", "why": "Volume air yang dipindahkan sama dengan volume benda tercelup: luas alas×kenaikan air=(60×20)×3=3600 cm³.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G25", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-580", "cat": 2, "sub": "Transformasi titik", "level": 3, "stem": "Titik P(6,3) didilatasikan dengan pusat C(1,1) dan faktor 2. Koordinat bayangan P adalah ….", "options": ["(11, 3)", "(11, 5)", "(12, 6)", "(13, 7)", "(5, 2)"], "key": [1], "kind": "pg", "why": "P′=C+2(P−C)=(1+2(6−1),1+2(3−1))=(11,5).", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G26", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-581", "cat": 2, "sub": "Pythagoras dan jarak", "level": 3, "stem": "Segitiga siku-siku mempunyai kaki 18 cm dan 24 cm. Tinggi yang ditarik dari sudut siku-siku ke sisi miring panjangnya … cm.", "options": ["72/5", "15", "18", "24", "30"], "key": [0], "kind": "pg", "why": "Luas dengan dua kaki=½×18×24. Sisi miring=30. Samakan dengan ½×30×h, sehingga h=72/5=72/5.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G27", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-582", "cat": 2, "sub": "Kesebangunan", "level": 3, "stem": "Dua segitiga sebangun mempunyai perbandingan sisi 2:3. Luas segitiga kecil 24 cm². Luas segitiga besar … cm².", "options": ["55", "53", "56", "111", "54"], "key": [4], "kind": "pg", "why": "Perbandingan luas adalah kuadrat perbandingan sisi, yaitu 4:9. Luas besar=24×9/4=54 cm².", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G28", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-583", "cat": 2, "sub": "Pythagoras dan jarak", "level": 2, "stem": "Jarak titik P(6,3) ke titik Q(12,11) adalah … satuan.", "options": ["8", "12", "14", "10", "6"], "key": [3], "kind": "pg", "why": "Selisih koordinatnya 6 dan 8. Jarak=√(6²+8²)=√100=10.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G29", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-584", "cat": 2, "sub": "Volume dan luas permukaan", "level": 3, "stem": "Sebuah kubus bersisi 6 cm diperbesar sehingga setiap rusuknya 3 kali semula. Volume baru … kali volume semula.", "options": ["9", "81", "27", "3", "6"], "key": [2], "kind": "pg", "why": "Faktor volume=k³=3³=27. Nilai rusuk awal 6 cm tidak mengubah perbandingan ini.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G30", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-585", "cat": 3, "sub": "Rasio trigonometri", "level": 2, "stem": "Sudut lancip A memenuhi cos A=72/78. Nilai cot A adalah ….", "options": ["5/13", "12/5", "5/12", "12/13", "13/5"], "key": [1], "kind": "pg", "why": "Perbandingan samping:miring=12:13, sehingga depan=√(13²−12²)=5. cot A=samping/depan=12/5.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T09", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-586", "cat": 3, "sub": "Sudut istimewa", "level": 2, "stem": "Hasil 6 tan 45° + 4 sin²30° adalah ….", "options": ["7", "8", "6", "9", "17"], "key": [0], "kind": "pg", "why": "tan45°=1; sin30°=½, sehingga sin²30°=¼. Hasil=6×1+4×¼=7.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T10", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-587", "cat": 3, "sub": "Sudut dan kuadran", "level": 2, "stem": "Diketahui cos A=−18/30, dengan 90°<A<180°. Nilai tan A adalah ….", "options": ["4/3", "-3/4", "3/4", "-4/5", "-4/3"], "key": [4], "kind": "pg", "why": "Cos negatif di kuadran II, sedangkan sin positif. sin A=√(1−9/25)=4/5. tan A=(4/5)/(−3/5)=−4/3.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T11", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-588", "cat": 3, "sub": "Aplikasi trigonometri", "level": 3, "stem": "Jalan menanjak membentuk sudut 30° dengan bidang horizontal. Mobil menempuh 24 meter sepanjang jalan tersebut. Kenaikan ketinggiannya … meter.", "options": ["11", "14", "27", "12", "13"], "key": [3], "kind": "pg", "why": "Jarak sepanjang jalan adalah sisi miring. Kenaikan tinggi=24sin30°=24×½=12.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T12", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-589", "cat": 3, "sub": "Sudut dan kuadran", "level": 3, "stem": "Untuk sudut θ=50° yang lancip, tentukan kebenaran identitas berikut.", "options": ["sin(180°−θ)=sin θ", "cos(180°−θ)=cos θ", "tan(180°−θ)=−tan θ"], "key": [true, false, true], "kind": "bs", "why": "180°−50° berada di kuadran II: sinus tetap positif, kosinus berubah tanda, dan tangen berubah tanda.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T13", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-590", "cat": 3, "sub": "Aplikasi trigonometri", "level": 3, "stem": "Dari puncak tebing setinggi 60 meter, sudut depresi ke perahu adalah 45°. Permukaan air datar dan kaki tebing tegak di atas permukaan air. Jarak horizontal perahu ke kaki tebing … meter.", "options": ["123", "60", "61", "59", "62"], "key": [1], "kind": "pg", "why": "Sudut depresi sama dengan sudut elevasi perahu ke puncak. tan45°=tinggi/jarak=1, sehingga jarak=60 meter.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T14", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-591", "cat": 4, "sub": "Data tunggal", "level": 3, "stem": "Rata-rata lima bilangan adalah 12. Jika bilangan 8 dihapus, rata-rata empat bilangan sisanya adalah ….", "options": ["13", "14", "12", "15", "29"], "key": [0], "kind": "pg", "why": "Jumlah awal=5×12=60. Sisa=60−8=52. Rata-rata sisa=52/4=13.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D17", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-592", "cat": 4, "sub": "Data tunggal", "level": 2, "stem": "Data terurut: 6, 8, 10, 12, 14, 16, 18. Dengan median tidak diikutkan dalam kedua separuh data, jangkauan antarkuartil adalah ….", "options": ["4", "6", "10", "12", "8"], "key": [4], "kind": "pg", "why": "Median adalah 12. Q₁ median dari 6,8,10, yaitu 8. Q₃ median dari 14,16,18, yaitu 16. IQR=8.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D18", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-593", "cat": 4, "sub": "Peluang majemuk", "level": 3, "stem": "Tiga koin seimbang dilempar bersama dalam 48 percobaan. Frekuensi harapan muncul tepat dua sisi angka adalah ….", "options": ["17", "20", "39", "18", "19"], "key": [3], "kind": "pg", "why": "Ada 8 hasil sama mungkin. Tepat dua angka terjadi pada AAG, AGA, GAA, sehingga peluang=3/8. Frekuensi harapan=48×3/8=18.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D19", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-594", "cat": 4, "sub": "Peluang majemuk", "level": 3, "stem": "Kotak berisi 6 bola merah dan 7 bola biru. Dua bola diambil sekaligus. Peluang keduanya merah adalah ….", "options": ["1/2", "7/13", "5/26", "6/13", "36/169"], "key": [2], "kind": "pg", "why": "Banyak pasangan merah C(6,2)=15. Seluruh pasangan C(13,2)=78. Peluang=5/26.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D20", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-595", "cat": 4, "sub": "Peluang majemuk", "level": 3, "stem": "Peluang mesin bekerja baik dalam satu hari adalah 9/10. Kondisi pada dua hari berbeda independen. Peluang setidaknya satu dari dua hari mesin bekerja baik adalah ….", "options": ["1/10", "99/100", "81/100", "9/10", "1/100"], "key": [1], "kind": "pg", "why": "Peluang tidak bekerja baik sehari=(10−9)/10=1/10. Komplemen dua hari sama-sama gagal: 1−(1/10)²=99/100.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D21", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-596", "cat": 4, "sub": "Aturan pencacahan", "level": 3, "stem": "9 orang berbeda duduk mengelilingi meja bundar. Susunan yang hanya berbeda karena rotasi dianggap sama, tetapi pencerminan dianggap berbeda. Banyak susunan ….", "options": ["40320", "362880", "5040", "20160", "80640"], "key": [0], "kind": "pg", "why": "Tetapkan posisi satu orang untuk menghilangkan pengulangan rotasi. Sisanya 8 orang dapat diatur dalam (8)!=40320 cara.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D22", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-597", "cat": 4, "sub": "Aturan pencacahan", "level": 3, "stem": "Kode terdiri dari 3 digit yang dipilih dari angka 1 sampai 9. Tidak boleh ada pengulangan. Banyak kode berbeda adalah ….", "options": ["729", "84", "72", "27", "504"], "key": [4], "kind": "pg", "why": "Tempat pertama mempunyai 9 pilihan, kedua 8, ketiga 7. Kalikan menjadi 504.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D23", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-598", "cat": 4, "sub": "Aturan pencacahan", "level": 3, "stem": "Sebuah tim 3 orang dipilih dari 8 putra dan 3 putri. Tim harus terdiri dari 2 putra dan 1 putri. Banyak tim berbeda adalah ….", "options": ["28", "168", "24", "84", "165"], "key": [3], "kind": "pg", "why": "Pilih 2 putra dalam C(8,2)=28 cara; pilih 1 putri dalam 3 cara. Kalikan: 84.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D24", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-599", "cat": 4, "sub": "Data tunggal", "level": 3, "stem": "Seluruh nilai data awal 6, 8, 10 dikalikan 2.", "options": ["Mean menjadi dua kali mean awal.", "Varians menjadi dua kali varians awal.", "Simpangan baku menjadi dua kali simpangan baku awal."], "key": [true, false, true], "kind": "bs", "why": "Perkalian setiap data dengan 2 mengalikan mean dengan 2. Simpangan dari mean ikut menjadi 2 kali, sehingga varians menjadi 4 kali dan simpangan baku 2 kali.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D25", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-600", "cat": 4, "sub": "Penyajian data", "level": 3, "stem": "Penjualan naik dari 240 unit menjadi 300 unit, lalu turun kembali ke 240 unit. Besar penurunan persentase pada tahap kedua adalah …%.", "options": ["30", "20", "10", "15", "25"], "key": [1], "kind": "pg", "why": "Tahap kedua memakai nilai dasar 300. Penurunan=(300−240)/300×100%=20%.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D26", "variant": 5, "source": "Latihan pengembangan"}];</script><script>const CATS=[
{name:'Bilangan',icon:'ℝ',color:'#8672ce',bg:'#f0ebfa',desc:'Bilangan real, pangkat, akar, dan perbandingan.'},
{name:'Aljabar',icon:'ƒ',color:'#558db0',bg:'#eaf3fa',desc:'Persamaan, fungsi, program linear, dan barisan.'},
{name:'Geometri & Pengukuran',icon:'△',color:'#c29757',bg:'#fcf4e5',desc:'Bangun, transformasi, ukuran, dan jarak.'},
{name:'Trigonometri',icon:'θ',color:'#4a9b8a',bg:'#eaf6f1',desc:'Perbandingan sudut dan masalah kontekstual.'},
{name:'Data & Peluang',icon:'σ',color:'#bc7b8e',bg:'#faedf1',desc:'Statistika, pencacahan, dan kejadian majemuk.'}];
const CONCEPTS=[
[0,'Operasi bilangan','Dahulukan kurung, pangkat/akar, kali/bagi, lalu tambah/kurang. Operasi pada tingkat sama dikerjakan dari kiri ke kanan. Samakan penyebut saat menjumlahkan pecahan.','a/b + c/d = (ad + bc)/(bd)\na/b ÷ c/d = ad/(bc)','Penyebut pecahan tidak boleh nol. Pembagian pecahan berarti mengalikan dengan kebalikan.'],
[0,'Sifat bilangan','Rasional dapat ditulis p/q, dengan p dan q bilangan bulat serta q≠0. Irasional tidak dapat ditulis demikian. Penjumlahan dan perkalian komutatif serta asosiatif.','a + b = b + a\na(b + c) = ab + ac','Pengurangan dan pembagian tidak komutatif. √2 irasional, tetapi √4=2 rasional.'],
[0,'Pangkat dan akar','Pangkat pecahan menyatakan akar. Aturan pangkat bekerja dengan syarat basis dan domain yang sesuai; gunakan basis positif untuk pangkat real umum.','aᵐ × aⁿ = aᵐ⁺ⁿ\naᵐ/aⁿ = aᵐ⁻ⁿ  (a≠0)\na^(m/n) = (ⁿ√a)ᵐ  (a>0)\n√(a²) = |a|','√(a+b) tidak sama dengan √a+√b. Akar utama selalu tidak negatif.'],
[0,'Persen dan perbandingan','Tentukan nilai yang dijadikan dasar. Pada dua perubahan persentase berurutan, setiap perubahan diterapkan pada nilai terakhir.','Nilai akhir = awal × (1 ± r)\nDiskon d₁ lalu d₂: awal × (1−d₁)(1−d₂)\nBagian = rasio bagian / total rasio × total','Diskon 20% lalu 10% setara diskon 28%, bukan 30%.'],
[1,'Persamaan linear','Ubah cerita menjadi variabel dengan satuan yang jelas. Eliminasi satu variabel, lanjutkan substitusi, lalu uji hasil pada semua persamaan awal. SPLTV memakai tiga variabel.','ax + by = c\nEliminasi → substitusi → pemeriksaan','Satu persamaan dengan dua variabel biasanya belum menentukan satu pasangan unik.'],
[1,'Pertidaksamaan linear','Saat mengalikan atau membagi kedua ruas dengan bilangan negatif, balik arah tanda. Untuk dua variabel, gambar garis batas lalu uji satu titik.','a < b ⇒ −a > −b\nGaris penuh untuk ≤ atau ≥\nGaris putus untuk < atau >','Titik di garis batas memenuhi ≤ dan ≥, tetapi tidak memenuhi < atau >.'],
[1,'Program linear','Definisikan x dan y, susun batas sumber daya dan nonnegativitas. Tentukan daerah layak serta titik pojoknya, lalu bandingkan nilai fungsi tujuan. Untuk daerah layak terbatas, fungsi linear mencapai optimum di titik pojok.','Z = px + qy\nx ≥ 0, y ≥ 0\nUji Z pada semua titik pojok yang layak','Titik potong dua garis belum tentu memenuhi semua batas. Perhatikan apakah jumlah barang harus bulat.'],
[1,'Domain dan range','Domain ialah input yang diizinkan; kodomain ialah himpunan target yang ditetapkan; range ialah output yang benar-benar dihasilkan. Range selalu bagian dari kodomain.','f(x)=p(x)/q(x): q(x) ≠ 0\nf(x)=√g(x): g(x) ≥ 0\nf(x)=(x−h)²+k: range y ≥ k','Mencoret faktor pada fungsi rasional tidak mengembalikan titik yang semula terlarang dalam domain.'],
[1,'Fungsi kuadrat','Koefisien a menentukan arah buka parabola. Bentuk puncak memudahkan membaca titik minimum atau maksimum. Akar fungsi ialah titik potong dengan sumbu x.','f(x)=ax²+bx+c, a≠0\nx puncak = −b/(2a)\nD = b²−4ac\nf(x)=a(x−h)²+k → puncak (h,k)','a>0 berarti minimum; a<0 berarti maksimum. D<0 berarti tidak ada akar real.'],
[1,'Invers dan komposisi','Komposisi bekerja dari fungsi di bagian dalam. Invers membalik proses input-output, dengan domain yang sesuai agar fungsi satu-satu.','(f ∘ g)(x) = f(g(x))\nf(x)=ax+b ⇒ f⁻¹(y)=(y−b)/a, a≠0','f⁻¹(x) bukan 1/f(x). Pada umumnya f∘g tidak sama dengan g∘f.'],
[1,'Barisan dan deret','Barisan ialah urutan nilai, deret ialah penjumlahan suku. Aritmetika memiliki selisih tetap; geometri memiliki rasio tetap.','Aritmetika: Uₙ=a+(n−1)b\nSₙ=n[2a+(n−1)b]/2\nGeometri: Uₙ=arⁿ⁻¹\nSₙ=a(rⁿ−1)/(r−1), r≠1','Uₙ bukan Sₙ. Bila r=1, jumlah n suku geometri adalah na.'],
[1,'Pertumbuhan dan bunga','Bunga tunggal selalu dihitung dari modal awal. Bunga majemuk dihitung dari saldo terbaru. Pertumbuhan dan peluruhan berulang memakai model geometri.','Tunggal: Mₜ=M₀(1+rt)\nMajemuk: Mₙ=M₀(1+r)ⁿ\nPeluruhan: Mₙ=M₀(1−r)ⁿ','Satuan periode dan suku bunga harus sama. Bunga per tahun tidak langsung dipakai untuk jumlah bulan.'],
[2,'Sudut dan garis','Pada dua garis sejajar yang dipotong transversal, sudut sehadap dan berseberangan sama besar; sudut dalam sepihak berjumlah 180°. Garis pada ruang bisa berpotongan, sejajar, atau bersilangan.','Sudut segitiga berjumlah 180°\nSudut berpelurus berjumlah 180°\nSudut bertolak belakang sama besar','Garis bersilangan tidak berpotongan dan tidak sebidang. Tampak berpotongan pada gambar 2D belum tentu berpotongan di ruang.'],
[2,'Kesebangunan','Bangun sebangun mempunyai sudut bersesuaian sama dan sisi bersesuaian sebanding. Kongruen berarti bentuk sekaligus ukuran sama. Kriteria kongruen segitiga: SSS, SAS, ASA/AAS.','Skala panjang = k\nSkala luas = k²\nSkala volume = k³','AAA cukup untuk sebangun, belum cukup untuk kongruen. Cocokkan urutan titik yang bersesuaian.'],
[2,'Pythagoras dan jarak','Jarak berarti panjang terpendek. Pada titik ke garis/bidang, cari kaki proyeksi tegak lurus. Jarak dua garis bersilangan memakai tegak lurus bersama; bidang sejajar memakai ruas yang tegak lurus keduanya.','c²=a²+b² (segitiga siku-siku)\nd balok = √(p²+l²+t²)\nd titik = √[(x₂−x₁)²+(y₂−y₁)²]\nKubus: diagonal sisi s√2; ruang s√3','Sisi miring ialah sisi di depan sudut siku-siku. Jangan menggunakan diagonal ruang untuk semua pertanyaan jarak.'],
[2,'Transformasi titik','Translasi menggeser; refleksi mencerminkan; rotasi memutar; dilatasi mengubah skala. Pada komposisi, kerjakan urut sesuai perintah.','Translasi (a,b): (x,y)→(x+a,y+b)\nRefleksi sumbu x: (x,−y); sumbu y: (−x,y)\nRefleksi y=x: (y,x)\nRotasi 90° berlawanan jarum jam: (−y,x)\nDilatasi pusat O, skala k: (kx,ky)','Rumus rotasi di atas berpusat O. Untuk pusat (a,b), geser pusat ke O dahulu, transformasikan, lalu kembalikan.'],
[2,'Luas dan keliling','Pisahkan bangun gabungan menjadi bagian sederhana. Keliling hanya batas luar; sisi persekutuan di dalam tidak ikut dihitung. Luas dinyatakan dalam satuan kuadrat.','Segitiga: L=½at\nTrapesium: L=½(a+b)t\nLingkaran: L=πr²; K=2πr\nJuring: L=θ/360° × πr²','Diameter=2r. Jalan selebar w di bagian dalam persegi panjang mengurangi tiap dimensi sebanyak 2w.'],
[2,'Volume dan luas permukaan','Volume mengukur ruang yang terisi. Luas permukaan menjumlahkan bidang pembatas. Perhatikan apakah wadah terbuka atau tertutup.','Prisma: V=L alas × tinggi\nLimas/kerucut: V=⅓ L alas × tinggi\nTabung: V=πr²t; L tertutup=2πr(r+t)\nBola: V=4πr³/3; L=4πr²','Tinggi kerucut berbeda dari garis pelukis. Volume memakai tinggi tegak lurus alas.'],
[3,'Rasio trigonometri','Untuk sudut lancip pada segitiga siku-siku, identifikasi sisi depan, samping, dan miring relatif terhadap sudut yang ditanyakan.','sin θ=depan/miring\ncos θ=samping/miring\ntan θ=depan/samping\ncsc θ=1/sin θ; sec θ=1/cos θ\ncot θ=1/tan θ\nsin²θ+cos²θ=1','Sisi depan dan samping berganti saat sudut acuan berganti. Kebalikan hanya berlaku jika penyebutnya tidak nol.'],
[3,'Sudut istimewa','Hafalkan sin dan cos untuk 0°, 30°, 45°, 60°, 90°. Tan diperoleh dari sin/cos.','sin: 0, ½, √2/2, √3/2, 1\ncos: 1, √3/2, √2/2, ½, 0\ntan: 0, √3/3, 1, √3, tidak terdefinisi','Sudut soal memakai derajat. tan 90° tidak terdefinisi karena cos 90°=0.'],
[3,'Sudut dan kuadran','Pada lingkaran satuan, cos adalah koordinat x dan sin koordinat y. Tanda mengikuti kuadran. Sudut tumpul berada di kuadran II.','I: semua positif\nII: sin positif\nIII: tan positif\nIV: cos positif','Dari cos²A=16/25 hanya diperoleh cos A=±4/5. Informasi kuadran menentukan tanda.'],
[3,'Aplikasi trigonometri','Gambar segitiga, tandai sudut elevasi terhadap garis horizontal, lalu pilih rasio yang menghubungkan data dan target.','Selisih tinggi = jarak mendatar × tan θ\nTinggi ujung tangga = panjang tangga × sin θ','Tambahkan tinggi mata pengamat jika yang dicari tinggi bangunan dari tanah.'],
[4,'Penyajian data','Pada diagram batang/garis, baca sumbu dan satuannya. Peningkatan terbesar adalah selisih dua nilai berurutan terbesar, bukan batang paling tinggi.','Bagian sektor = sudut/360°\nJumlah kategori = proporsi × total\nPersentase perubahan = (baru−lama)/lama ×100%','Jika sumbu tidak dimulai dari nol, perbedaan tinggi visual dapat menyesatkan. Gunakan angka datanya.'],
[4,'Data tunggal','Urutkan data untuk mencari median dan kuartil. Mean memakai semua nilai, sehingga sensitif terhadap pencilan. Modus ialah nilai paling sering muncul.','Mean = Σx/n\nMean gabungan = Σ(nᵢ × meanᵢ)/Σnᵢ\nJangkauan = maksimum−minimum\nVarians populasi = Σ(x−mean)²/n\nSimpangan baku = √varians','Untuk varians sampel tak bias, pembaginya n−1. Pastikan soal menyebut populasi atau sampel.'],
[4,'Data kelompok','Gunakan titik tengah untuk memperkirakan mean. Untuk median/modus, gunakan tepi kelas, bukan sekadar batas bawah interval.','Mean ≈ Σ(fᵢxᵢ)/Σfᵢ\nMe=L+[(N/2−F)/f]p\nMo=L+[d₁/(d₁+d₂)]p','L=tepi bawah kelas target; p=lebar; F=frekuensi kumulatif sebelumnya; f=frekuensi kelas median. d₁,d₂=selisih frekuensi kelas modus dengan tetangganya.'],
[4,'Aturan pencacahan','Pilihan yang saling lepas dijumlahkan; proses bertahap dikalikan. Permutasi memperhatikan urutan, kombinasi tidak.','P(n,r)=n!/(n−r)!\nC(n,r)=n!/[r!(n−r)!]\nPermutasi unsur berulang=n!/(a!b!…)','Ketua–sekretaris berbeda dengan dua delegasi setara. Perhatikan boleh/tidaknya pengulangan.'],
[4,'Peluang majemuk','Pada ruang sampel berhingga dengan hasil sama mungkin, peluang adalah banyak hasil yang diinginkan dibagi total hasil. Untuk kejadian berurutan, cek ketergantungannya.','P(A)=n(A)/n(S)\nP(Aᶜ)=1−P(A)\nP(A∪B)=P(A)+P(B)−P(A∩B)\nP(A∩B)=P(A)P(B|A)\nIndependen: P(B|A)=P(B)','Tanpa pengembalian, jumlah objek total dan komposisinya berubah. Saling lepas tidak sama dengan independen.']
];
</script><script>/* Exact SVG teaching diagrams. No external images, fonts or libraries. */
const V={
 n:x=>Number(x.toFixed(3)).toLocaleString('id-ID'),
 text:(x,y,t,c='currentColor',size=13)=>`<text x="${x}" y="${y}" fill="${c}" font-size="${size}" text-anchor="middle" font-family="system-ui">${esc(t)}</text>`,
 line:(x,y,x2,y2,c='#6366f1',dash=false)=>`<path d="M${x} ${y}L${x2} ${y2}" stroke="${c}" stroke-width="2.5" fill="none" ${dash?'stroke-dasharray="6 5"':''}/>` ,
 rect:(x,y,w,h,c='#b8b3f0')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${c}"/>`,
 circle:(x,y,r,c='#9c91e8',fill='none')=>`<circle cx="${x}" cy="${y}" r="${r}" stroke="${c}" stroke-width="2" fill="${fill}"/>`,

'Program linear':{title:'Cari keuntungan terbesar di titik pojok',controls:[['a','Laba produk x',1,8,3],['b','Laba produk y',1,8,2]],draw:p=>{const pts=[[0,0],[7,0],[4,6],[0,10]],vals=pts.map(([x,y])=>p.a*x+p.b*y),mx=Math.max(...vals);return V.poly(pts.map(([x,y])=>[75+x*27,250-y*20]))+pts.map(([x,y],i)=>V.circle(75+x*27,250-y*20,5,vals[i]===mx?'#ec9b3b':'#7765cd',vals[i]===mx?'#ec9b3b':'#7765cd')+V.text(75+x*27+30,250-y*20-10,`(${x},${y}): ${vals[i]}`,undefined,11)).join('')+V.text(340,105,'x+y≤10')+V.text(340,130,'2x+y≤14')+V.text(340,155,'x,y≥0')},info:p=>{let pts=[[0,0],[7,0],[4,6],[0,10]],mx=Math.max(...pts.map(([x,y])=>p.a*x+p.b*y));return `Z=${p.a}x+${p.b}y. Maksimum=${mx}, dicapai pada ${pts.filter(([x,y])=>p.a*x+p.b*y===mx).map(v=>'('+v+')').join(' dan ')}. Jika dua titik pojok bertetangga sama optimal, ruas penghubungnya juga optimal.`}},

'Rasio trigonometri':{title:'Sin, cos, tan pada segitiga siku-siku',controls:[['a','Sudut θ (derajat)',10,75,30,5]],draw:p=>{const rad=p.a*Math.PI/180,w=220*Math.cos(rad),h=220*Math.sin(rad);return V.poly([[100,250],[100+w,250],[100,250-h]])+V.text(100+w/2,272,'samping')+V.text(65,250-h/2,'depan')+V.text(120+w/2,235-h/2,'miring = 1')+V.text(100+w-25,238,`${p.a}°`)},info:p=>`Untuk θ=${p.a}°: sin θ≈${V.n(Math.sin(p.a*Math.PI/180))}, cos θ≈${V.n(Math.cos(p.a*Math.PI/180))}, tan θ≈${V.n(Math.tan(p.a*Math.PI/180))}. Karena sisi miring dinormalisasi 1, panjang depan=sin dan samping=cos.`},

(q.id)}">${state.bookmarks.includes(q.id)?'★':'☆'}</button><button data-open="${q.id}">Kerjakan →</button></article>`).join(''):`<div class="empty"><h2>${page==='saved'?'Belum ada soal tersimpan yang cocok':'Tidak ada soal yang cocok'}</h2><p>${page==='saved'?'Tekan ikon bintang pada soal untuk menyimpannya.':'Ubah kata kunci atau filter untuk menemukan soal lain.'}</p><button data-action="resetfilters">Reset filter</button></div>`}<div class="pagination"><button data-action="prevpage" ${pageNum===1?'disabled':''}>← Sebelumnya</button><span>${pageNum} / ${pages}</span><button data-action="nextpage" ${pageNum===pages?'disabled':''}>Berikutnya →</button></div>`;}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function diverse(list,n){let first=[],later=[],seen=new Set;for(const q of shuffle(list)){if(seen.has(q.pattern))later.push(q);else{seen.add(q.pattern);first.push(q)}}return [...first,...later].slice(0,n)}
function start(ids,mode='practice',minutes=0){if(!ids.length){notify('Tidak ada soal pada pilihan ini.');return}const launch=()=>{state.active={ids,mode,pos:0,answers:{},checked:{},started:Date.now(),deadline:mode==='exam'?Date.now()+minutes*60000:null};persist();go('quiz')};if(state.active){confirmBox('Ganti sesi yang sedang berjalan?','Jawaban yang belum dinilai pada sesi sebelumnya tidak akan dilanjutkan. Progres soal yang sudah dinilai tetap tersimpan.',launch,'Mulai sesi baru')}else launch()}
function isComplete(q,a){return q.kind==='bs'?Array.isArray(a)&&a.length===q.options.length&&a.every(v=>typeof v==='boolean'):Array.isArray(a)&&a.length>0}
function isCorrect(q,a){if(!isComplete(q,a))return false;return q.kind==='bs'?q.key.every((v,i)=>a[i]===v):a.length===q.key.length&&q.key.every(i=>a.includes(i))}
function keyText(q){return q.kind==='bs'?q.key.map((v,i)=>`${i+1}. ${v?'Benar':'Salah'}`).join(' · '):q.key.map(i=>`${String.fromCharCode(65+i)}. ${q.options[i]}`).join('; ')}
function answerText(q,a){if(!a||!a.length)return 'Belum dijawab';return q.kind==='bs'?q.options.map((_,i)=>`${i+1}. ${typeof a[i]==='boolean'?(a[i]?'Benar':'Salah'):'—'}`).join(' · '):a.map(i=>`${String.fromCharCode(65+i)}. ${q.options[i]}`).join('; ')}
function record(q,a){const correct=isCorrect(q,a);state.attempts[q.id]={correct,answer:[...a],time:Date.now(),tries:(state.attempts[q.id]?.tries||0)+1};const day=dateKey();state.days[day]??=[];if(!state.days[day].includes(q.id))state.days[day].push(q.id);return correct}
function current(){const s=state.active;return s?QMAP[s.ids[s.pos]]:null}
function explanation(q,correct){return `<div class="explanation ${correct?'':'wrong'}" role="status"><h3>${correct?'✓ Tepat!':'Mari periksa langkahnya.'}</h3><div class="small">Kunci: ${esc(keyText(q))}</div><p style="margin-top:12px">${esc(q.why)}</p><div class="tip"><strong>Ingat:</strong> ${esc(q.tip)}</div></div>`}
function quiz(){const s=state.active;if(!s){page='home';return home()}const q=current(),a=s.answers[q.id]||[],checked=!!s.checked[q.id],correct=isCorrect(q,a),done=s.ids.filter(id=>isComplete(QMAP[id],s.answers[id])).length;return heading(s.mode==='exam'?'SIMULASI MANDIRI':'LATIHAN TERARAH',s.mode==='exam'?'Tenang, teliti, kerjakan.':'Pahami satu soal lagi.',`Soal ${s.pos+1} dari ${s.ids.length} · ${q.id} · Pola ${q.pattern}, varian ${q.variant}`,`<div class="buttons"><button data-action="focus">${focus?'Keluar fokus':'Mode fokus'}</button> <button data-action="pause">Simpan & keluar</button></div>`)+`<div class="quiz-layout"><section class="question-card">${badges(q)}<h2>${esc(q.stem)}</h2>${questionSketch(q)?`<div class="qvisual">${questionSketch(q)}</div>`:''}<div class="instruction">${q.kind==='pg'?'Pilih satu jawaban yang paling tepat.':q.kind==='multi'?'Pilih semua jawaban yang benar. Jawaban benar lebih dari satu.':'Tentukan Benar atau Salah untuk setiap pernyataan.'}</div><div id="options">${q.kind==='bs'?q.options.map((o,i)=>`<div class="truefalse"><span>${i+1}. ${esc(o)}</span>${[true,false].map(v=>`<button data-bs="${i}" data-value="${v}" class="${a[i]===v?'selected':''}" aria-pressed="${a[i]===v}" ${checked?'disabled':''}>${v?'Benar':'Salah'}${checked&&q.key[i]===v?' ✓':''}</button>`).join('')}</div>`).join(''):q.options.map((o,i)=>`<button class="option ${a.includes(i)?'selected':''} ${checked&&q.key.includes(i)?'correct':''} ${checked&&a.includes(i)&&!q.key.includes(i)?'incorrect':''}" data-option="${i}" aria-pressed="${a.includes(i)}" ${checked?'disabled':''}><span class="letter">${q.kind==='multi'?(a.includes(i)?'✓':String.fromCharCode(65+i)):String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join('')}</div>${checked?explanation(q,correct):''}<div class="answerbar"><button data-action="prevq" ${s.pos===0?'disabled':''}>← Sebelumnya</button><button class="bookmark ${state.bookmarks.includes(q.id)?'on':''}" data-bookmark="${q.id}">${state.bookmarks.includes(q.id)?'★ Tersimpan':'☆ Simpan'}</button>${s.mode==='practice'&&!checked?`<button class="primary" data-action="check" ${isComplete(q,a)?'':'disabled'}>Periksa jawaban</button>`:`<button class="primary" data-action="nextq">${s.pos===s.ids.length-1?'Selesaikan sesi':'Berikutnya →'}</button>`}</div>${s.mode==='practice'&&!checked?'<div style="text-align:right;margin-top:9px"><button class="textbutton" data-action="skip">Lewati dahulu →</button></div>':''}</section><aside class="quiz-side"><div class="panel"><h3>${s.mode==='exam'?'Sisa waktu':'Progres sesi'}</h3>${s.mode==='exam'?'<div class="timer" id="timer"></div><p>Waktu terus berjalan saat sesi ditutup.</p>':`<p>Pembahasan muncul setelah diperiksa.</p>`}<div class="progress" style="margin:15px 0 7px"><span style="width:${done/s.ids.length*100}%"></span></div><div class="small">${done} dari ${s.ids.length} terjawab</div><div class="navgrid">${s.ids.map((id,i)=>`<button data-jump="${i}" class="${isComplete(QMAP[id],s.answers[id])?'answered':''} ${s.pos===i?'current':''}" aria-label="Ke soal ${i+1}">${i+1}</button>`).join('')}</div><button class="full" data-action="finish">Akhiri sesi</button><p style="margin:12px 0 0">Skor latihan: 1 poin per soal benar penuh, tanpa pengurangan nilai.</p></div><div class="panel"><h3>Catatan kecil</h3><p>${s.mode==='exam'?'Kunci dan pembahasan tersedia setelah sesi berakhir.':'Baca kondisi pada soal. Beberapa jawaban terlihat benar, tetapi tidak memenuhi syaratnya.'}</p><p>Jawaban tersimpan otomatis di browser ini.</p></div></aside></div>`;}
function check(){const s=state.active,q=current(),a=s.answers[q.id];if(!isComplete(q,a)||s.checked[q.id])return;s.checked[q.id]=true;record(q,a);persist();render()}
function choose(i,v){const s=state.active,q=current();if(s.checked[q.id])return;let a=s.answers[q.id]||[];if(q.kind==='bs'){a=Array.from({length:q.options.length},(_,j)=>typeof a[j]==='boolean'?a[j]:null);a[i]=v}else if(q.kind==='multi'){a=a.includes(i)?a.filter(x=>x!==i):[...a,i].sort((x,y)=>x-y)}else a=[i];s.answers[q.id]=a;persist();render();}
function move(i){const s=state.active;if(!s)return;s.pos=Math.max(0,Math.min(s.ids.length-1,i));persist();render();window.scrollTo(0,0)}
function finish(force=false){const s=state.active;if(!s)return;const blank=s.ids.filter(id=>!isComplete(QMAP[id],s.answers[id])).length;const end=()=>{const active=state.active;if(!active)return;const entries=active.ids.map(id=>{const q=QMAP[id],a=active.answers[id]||[];if(isComplete(q,a)&&!active.checked[id])record(q,a);return {id,answer:a,correct:isCorrect(q,a)}});lastResult={entries,mode:active.mode,ended:Date.now(),duration:Math.floor((Date.now()-active.started)/1000),correct:entries.filter(e=>e.correct).length};state.sessions.unshift(lastResult);state.sessions=state.sessions.slice(0,30);state.active=null;persist();$('#overlay').innerHTML='';go('result')};if(force)end();else confirmBox('Selesaikan sesi ini?',`${blank?`${blank} soal belum dijawab lengkap dan akan bernilai 0. `:''}Sesudah selesai, kamu bisa membaca seluruh pembahasan dan mengulang soal yang belum tepat.`,end,'Selesaikan')}
function result(){const r=lastResult||state.sessions[0];if(!r)return '<div class="empty"><h2>Belum ada hasil latihan</h2><button data-action="quick">Mulai latihan</button></div>';lastResult=r;return heading('HASIL BELAJARMU','Setiap latihan membawa kemajuan.','Gunakan pembahasan untuk menemukan langkah yang perlu diperbaiki.')+`<div class="split"><div class="panel"><div class="small">Skor latihan mandiri · bukan skor resmi TKA</div><div class="score">${Math.round(r.correct/r.entries.length*100)}<span style="font-size:22px;color:var(--muted)"> / 100</span></div><div class="summary-stat"><div><strong>${r.correct}</strong><span class="small">benar penuh</span></div><div><strong>${r.entries.length-r.correct}</strong><span class="small">salah / kosong</span></div><div><strong>${r.entries.length}</strong><span class="small">total soal</span></div></div><button class="primary" data-action="retryresult" ${r.correct===r.entries.length?'disabled':''}>Ulangi soal belum tepat</button> <button data-action="bank">Ke bank soal</button></div><div class="panel"><h3>Gambaran per bab</h3>${CATS.map((c,i)=>{const es=r.entries.filter(e=>QMAP[e.id].cat===i);if(!es.length)return '';const ok=es.filter(e=>e.correct).length;return `<div style="margin:13px 0"><div class="topic-footer"><span>${c.name}</span><span>${ok}/${es.length}</span></div><div class="progress" style="margin-top:5px"><span style="width:${ok/es.length*100}%"></span></div></div>`}).join('')}</div></div><div class="panel"><h2>Pembahasan seluruh soal</h2><p style="font-size:12px">Buka setiap soal untuk membandingkan jawaban dan langkah penyelesaiannya.</p>${r.entries.map((e,i)=>{const q=QMAP[e.id];return `<details class="review-row"><summary>${e.correct?'✓':'○'} &nbsp; ${i+1}. ${esc(q.sub)} · ${q.id} <span class="small">${e.correct?'Benar':'Perlu diulang'}</span></summary><p>${esc(q.stem)}</p>${questionSketch(q)}<div class="small">Jawabanmu: ${esc(answerText(q,e.answer))}</div>${explanation(q,e.correct)}<button data-open="${q.id}" style="margin-top:13px">Latihan soal ini lagi</button></details>`}).join('')}</div>`;}
function exam(){return heading('UJI PEMAHAMAN DAN RITME','Simulasi mandiri','Atur sesi latihan sesuai kebutuhanmu. Durasi ini bukan ketentuan ujian resmi.')+`<div class="split"><div class="panel config"><h2>Rancang sesimu</h2><label for="examCount">Jumlah soal</label><select id="examCount" class="field"><option value="20">20 soal</option><option value="30" selected>30 soal</option><option value="40">40 soal</option></select><label for="examMinutes">Durasi</label><select id="examMinutes" class="field"><option value="30">30 menit</option><option value="45" selected>45 menit</option><option value="60">60 menit</option><option value="90">90 menit</option></select><label for="examLevel">Komposisi tingkat</label><select id="examLevel" class="field"><option value="all">Campuran dasar, aplikasi, penalaran</option><option value="3">Fokus penalaran</option></select><button class="primary full" style="margin-top:25px" data-action="startexam">Mulai simulasi →</button>${state.active?'<button class="full" style="margin-top:10px" data-action="resume">Lanjutkan sesi tersimpan</button>':''}</div><div class="panel"><h2>Cara sesi ini bekerja</h2><div class="mission"><span class="check">1</span><span>Soal dari lima bab<small>Diacak dengan pola berbeda terlebih dahulu.</small></span></div><div class="mission"><span class="check">2</span><span>Tiga bentuk soal<small>Pilihan ganda, kompleks, dan benar–salah.</small></span></div><div class="mission"><span class="check">3</span><span>Evaluasi di akhir<small>Pembahasan tidak ditampilkan saat ujian berjalan.</small></span></div><div class="mission"><span class="check">4</span><span>1 poin per soal benar penuh<small>PG kompleks harus tepat seluruh pilihannya.</small></span></div><p style="margin-top:25px">Timer terus berjalan meskipun keluar dari sesi atau menutup halaman. Saat waktu habis, jawaban yang tersimpan dinilai otomatis ketika aplikasi aktif atau dibuka kembali.</p><p>Jumlah soal, distribusi bab, durasi, dan skor pada fitur ini dirancang untuk latihan, bukan replika resmi ujian.</p></div></div>`;}
function startExam(){const n=+$('#examCount').value,minutes=+$('#examMinutes').value,level=$('#examLevel').value;let pool=QUESTIONS.filter(q=>level==='all'||q.level===+level),selected=[];for(let c=0;c<5;c++)selected.push(...diverse(pool.filter(q=>q.cat===c),Math.floor(n/5)));const remaining=pool.filter(q=>!selected.some(x=>x.id===q.id));selected.push(...diverse(remaining,n-selected.length));if(level==='all'&&!selected.some(q=>q.kind==='bs')){const q=pool.find(x=>x.kind==='bs');selected[selected.length-1]=q}if(level==='all'&&!selected.some(q=>q.kind==='multi')){const q=pool.find(x=>x.kind==='multi');selected[selected.length-2]=q}start(shuffle(selected).map(q=>q.id),'exam',minutes)}
function concepts(){return heading('PAHAMI SEBELUM MENGHAFAL','Konsep & rumus','Ringkasan inti, syarat penggunaan rumus, dan kesalahan yang perlu dihindari.')+`<div class="tabs">${CATS.map((c,i)=>`<button data-conceptcat="${i}" class="${i===conceptCat?'active':''}">${c.icon} &nbsp; ${c.name}</button>`).join('')}</div>${conceptCat===1?`<div class="chart-box"><div class="section-title" style="margin:0"><h2>Eksplorasi fungsi kuadrat</h2><span class="badge">Interaktif</span></div><p style="font-size:12px">Geser a, h, dan k. Perhatikan arah buka dan letak titik puncak y = a(x−h)² + k.</p><div class="split"><svg id="parabola" viewBox="0 0 480 280" role="img" aria-label="Grafik fungsi kuadrat"></svg><div><div class="sliders"><label>a = <output id="va">1</output><input id="pa" type="range" min="-3" max="3" step="1" value="1"></label><label>h = <output id="vh">0</output><input id="ph" type="range" min="-4" max="4" step="1" value="0"></label><label>k = <output id="vk">0</output><input id="pk" type="range" min="-4" max="4" step="1" value="0"></label></div><p id="parabolaNote" style="font-size:13px"></p></div></div></div>`:''}<div class="concepts">${CONCEPTS.map((r,i)=>r[0]!==conceptCat?'':`<article class="concept"><h3>${esc(r[1])}</h3><p>${esc(r[2])}</p><div class="formula">${esc(r[3])}</div><div class="pitfall"><strong>Perhatikan:</strong> ${esc(r[4])}</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button data-sub="${esc(r[1])}" style="font-size:11px">Latihan topik ini →</button><button data-read="${i}" style="font-size:11px;${state.read.includes(i)?'color:var(--green)':''}">${state.read.includes(i)?'✓ Sudah paham':'Tandai paham'}</button></div></article>`).join('')}</div>`;}
function drawParabola(){if(!$('#pa'))return;const a=+$('#pa').value,h=+$('#ph').value,k=+$('#pk').value;$('#va').textContent=a;$('#vh').textContent=h;$('#vk').textContent=k;let grid='';for(let i=-10;i<=10;i++){grid+=`<path d="M${240+i*22} 8V272" stroke="var(--line)"/>`}for(let i=-6;i<=6;i++){grid+=`<path d="M10 ${140+i*22}H470" stroke="var(--line)"/>`}let p=[];for(let x=-11;x<=11;x+=.035){let y=a*(x-h)**2+k;p.push(`${p.length?'L':'M'}${240+x*22},${140-y*22}`)}$('#parabola').innerHTML=`<defs><clipPath id="plotclip"><rect x="10" y="8" width="460" height="264"/></clipPath></defs>${grid}<path d="M10 140H470 M240 8V272" stroke="var(--muted)"/><g clip-path="url(#plotclip)"><path d="${p.join(' ')}" fill="none" stroke="var(--primary)" stroke-width="3"/>${a?`<circle cx="${240+h*22}" cy="${140-k*22}" r="5" fill="var(--green)"/>`:''}</g><text x="247" y="156" fill="var(--muted)" font-size="10">0</text><text x="452" y="156" fill="var(--muted)" font-size="10">x</text><text x="248" y="18" fill="var(--muted)" font-size="10">y</text><text x="18" y="263" fill="var(--muted)" font-size="10">Satu kotak = satu satuan</text>`;$('#parabolaNote').textContent=a===0?`a=0: fungsi menjadi konstan y=${k}, bukan fungsi kuadrat. Tidak ada satu titik puncak unik.`:`Titik puncak (${h}, ${k}). Grafik terbuka ke ${a>0?'atas':'bawah'}, dengan nilai ${a>0?'minimum':'maksimum'} ${k}. Range y ${a>0?'≥':'≤'} ${k}.`;}
function progress(){const s=stats();return heading('LIHAT PERJALANANMU','Progres belajar','Akurasi dihitung dari jawaban terakhir setiap soal, bukan skor resmi atau prediksi hasil TKA.')+`<div class="stats"><div class="stat"><div class="label">Soal unik dikerjakan</div><div class="number">${s.total} <small>/ ${QUESTIONS.length}</small></div></div><div class="stat"><div class="label">Jawaban terakhir benar</div><div class="number">${s.right}</div></div><div class="stat"><div class="label">Konsep ditandai paham</div><div class="number">${state.read.length} <small>/ ${CONCEPTS.length}</small></div></div></div><div class="split"><div class="panel"><h2>Penguasaan per bab</h2>${CATS.map((c,i)=>{const qs=QUESTIONS.filter(q=>q.cat===i),done=qs.filter(q=>state.attempts[q.id]),ok=done.filter(q=>state.attempts[q.id].correct);return `<div style="margin:20px 0"><div class="topic-footer" style="font-size:12px"><strong>${c.name}</strong><span>${ok.length}/${done.length} benar</span></div><div class="progress" style="margin:8px 0"><span style="width:${done.length/qs.length*100}%"></span></div><div class="small">${done.length} dari ${qs.length} soal dikerjakan${done.length?' · akurasi '+Math.round(ok.length/done.length*100)+'%':''}</div></div>`}).join('')}<button data-action="wrong" ${s.wrong?'':'disabled'}>Ulangi ${s.wrong} soal yang belum tepat →</button></div><div class="panel"><h2>Riwayat sesi</h2>${state.sessions.length?state.sessions.slice(0,8).map((r,i)=>`<div class="bank-row" style="padding:12px 0;border:0;border-bottom:1px solid var(--line);border-radius:0"><div class="rowbody"><h3>${r.mode==='exam'?'Simulasi mandiri':'Latihan'} · ${r.entries.length} soal</h3><div class="small">${new Date(r.ended).toLocaleString('id-ID')} · ${r.correct} benar</div></div><button data-history="${i}">${Math.round(r.correct/r.entries.length*100)}% ↗</button></div>`).join(''):'<p>Selesaikan sesi pertama untuk melihat riwayatnya di sini.</p>'}<p style="margin-top:18px">Maksimal 30 sesi terakhir disimpan. Progres berada pada perangkat dan browser ini, tidak tersinkron antarperangkat.</p></div></div>${!storageOK?'<div class="panel">Penyimpanan browser tidak tersedia. Jangan tutup halaman jika ingin menjaga progres sesi ini.</div>':''}`;}
function sources(){return heading('TRANSPARAN TENTANG MATERI','Sumber & panduan penggunaan','Acuan internet, cakupan bank soal, dan cara belajar dengan aplikasi ini.')+`<div class="panel"><h2>Acuan resmi</h2><p>Materi dan bentuk soal mengacu pada kisi-kisi yang Anda lampirkan serta laman TKA Matematika Wajib SMA/sederajat Pusmendik. Acuan diperiksa pada 15 Oktober 2026.</p><p><a href="https://pusmendik.kemdikbud.go.id/tka/tka/view/mata-pelajaran-wajib/sma" target="_blank" rel="noopener">Kerangka materi dan contoh soal Matematika Wajib Pusmendik ↗</a></p><p><a href="https://pusmendik.kemendikdasmen.go.id/tka/tka/view/mata-pelajaran-wajib/sma/" target="_blank" rel="noopener">Laman Pusmendik pada domain Kemendikdasmen ↗</a></p><p><a href="https://pusmendik.kemendikdasmen.go.id/tka/page/download_file/193184_44" target="_blank" rel="noopener">Dokumen kerangka TKA: termasuk pencacahan dan peluang ↗</a></p></div><div class="split"><div class="panel"><h2>Tentang ${QUESTIONS.length} soal di sini</h2><p>Seluruh soal aplikasi adalah latihan pengembangan baru, bukan salinan naskah ujian resmi atau bocoran. Ada 120 pola, masing-masing memiliki 5 varian angka. Varian memperkuat prosedur; untuk latihan lebih beragam, pemilih soal acak mengutamakan pola yang berbeda.</p><p>Soal memakai pilihan ganda, pilihan ganda kompleks (pilih semua yang benar), dan kategori benar–salah. Tingkat dasar, aplikasi, dan penalaran adalah pengelompokan internal latihan.</p><p>Foto kisi-kisi yang terpotong pada bagian data dilengkapi dengan aturan pencacahan dan peluang dari acuan resmi. Aplikasi ini membahas matematika wajib, tidak memasukkan materi kalkulus matematika tingkat lanjut.</p></div><div class="panel"><h2>Alur belajar yang disarankan</h2><ol style="padding-left:20px;font-size:13px;line-height:2"><li>Buka konsep dan rumus pada bab yang ingin dipelajari.</li><li>Kerjakan latihan dasar, lalu beralih ke aplikasi dan penalaran.</li><li>Baca pembahasan setelah menjawab, terutama pada soal yang salah.</li><li>Simpan soal sulit dan ulangi melalui bank soal.</li><li>Coba simulasi untuk melatih pengelolaan waktu.</li></ol><p>Simulasi memakai penilaian 1 poin untuk satu soal benar penuh. Semua pernyataan benar–salah harus tepat, dan semua pilihan PG kompleks harus sesuai kunci. Tidak ada pengurangan poin untuk jawaban salah.</p></div></div><div class="panel"><h2>Progres dan sesi</h2><p><button onclick="downloadApp()">Unduh aplikasi HTML untuk belajar offline ↓</button></p><p>Progres disimpan otomatis pada browser ini. Menghapus data browser dapat menghapus progres. Tombol Simpan & keluar mempertahankan sesi. Timer simulasi tetap berjalan meski aplikasi ditutup; sesi yang kedaluwarsa dinilai saat aplikasi aktif kembali.</p><p>Target harian menghitung soal unik yang dinilai hari ini. Mengerjakan ulang soal yang sama tidak menaikkan jumlah target harian.</p></div>`;}
