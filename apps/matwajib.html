</style></head><body><a href="#main" style="position:absolute;left:-9999px" onfocus="this.style.left='10px'" onblur="this.style.left='-9999px'">Lewati ke konten</a><header class="topbar"><button class="brand" onclick="go('home')" aria-label="Beranda Matematika ICG"><span class="brandmark">∑</span><div>MATEMATIKA<span class="title-accent">ICG</span><small>Konsep · Simulasi · 600 Latihan TKA</small></div></button><form class="search" id="topSearch"><span aria-hidden="true">⌕</span><input aria-label="Cari konsep atau soal" placeholder="Cari konsep, rumus, atau soal…"></form><div class="top-actions"><button onclick="openChapter(...state.lastChapter)">☰ Bab</button><button id="theme" aria-label="Pilihan tampilan">🎨 Tampilan</button><div id="settingsPanel" class="settings-panel hidden"></div></div><span id="crumb" class="breadcrumb"></span></header><div class="shell"><aside class="side"><nav class="nav" id="nav" aria-label="Bab dan fitur belajar"></nav></aside><div class="workspace"><main id="main" class="main" tabindex="-1"></main></div></div><div id="overlay"></div><div id="toast" aria-live="polite"></div><script>const QUESTIONS=[{"id": "MTK-001", "cat": 0, "sub": "Operasi bilangan", "level": 1, "stem": "Nilai 2 + 5 × 4 − 6 adalah ….", "options": ["16", "17", "15", "18", "35"], "key": [0], "kind": "pg", "why": "Kerjakan perkalian dahulu: 5 × 4 = 20. Lalu 2 + 20 − 6 = 16.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B01", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-002", "cat": 0, "sub": "Operasi bilangan", "level": 1, "stem": "Hasil 2/3 + 1/2 adalah ….", "options": ["4/3", "1", "13/6", "19/6", "7/6"], "key": [4], "kind": "pg", "why": "Samakan penyebut menjadi 6: 4/6 + 3/6 = 7/6.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B02", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-003", "cat": 0, "sub": "Pangkat dan akar", "level": 1, "stem": "Bentuk sederhana 2^5 ÷ 2^2 adalah ….", "options": ["4", "16", "32", "8", "2"], "key": [3], "kind": "pg", "why": "Untuk basis sama, kurangi pangkat: 2^(5 − 2) = 2³ = 8.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B03", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-004", "cat": 0, "sub": "Pangkat dan akar", "level": 2, "stem": "Nilai (8)^(2/3) adalah ….", "options": ["5", "6", "4", "2", "8"], "key": [2], "kind": "pg", "why": "Akar pangkat tiga dari 8 adalah 2; kuadratkan hasilnya: 2² = 4.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B04", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-005", "cat": 0, "sub": "Pangkat dan akar", "level": 2, "stem": "Bentuk paling sederhana √32 + √72 adalah ….", "options": ["10√3", "10√2", "2√2", "10√5", "12√2"], "key": [1], "kind": "pg", "why": "√32 = 4√2 dan √72 = 6√2. Jumlahnya 10√2.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B05", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-006", "cat": 0, "sub": "Persen dan perbandingan", "level": 2, "stem": "Sebuah tas berharga Rp200.000. Diskon 20% dilanjutkan diskon 10% dari harga setelah diskon pertama. Harga akhir (rupiah) adalah ….", "options": ["144000", "140000", "160000", "180000", "120000"], "key": [0], "kind": "pg", "why": "Harga setelah diskon pertama = 0,8 × 200000 = 160000. Diskon kedua diterapkan pada harga ini: 0,9 × 160000 = 144000.", "visual": "", "tip": "Diskon berurutan dikalikan, bukan dijumlahkan.", "pattern": "B06", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-007", "cat": 0, "sub": "Persen dan perbandingan", "level": 2, "stem": "Dalam campuran sirup dan air, perbandingan volumenya 2 : 5. Jika volume campuran 14 liter, banyak sirup adalah … liter.", "options": ["5", "3", "6", "11", "4"], "key": [4], "kind": "pg", "why": "Jumlah bagian = 2 + 5 = 7. Satu bagian = 14/7 = 2 liter. Sirup = 2 × 2 = 4 liter.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B07", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-008", "cat": 0, "sub": "Sifat bilangan", "level": 2, "stem": "Untuk a = 2 dan b = 3, tentukan benar atau salah.", "options": ["a + b = b + a", "a ÷ b = b ÷ a", "a(b + 2) = ab + 2a"], "key": [true, false, true], "kind": "bs", "why": "Penjumlahan komutatif. Pembagian tidak komutatif karena 2/3 ≠ 3/2. Perkalian distributif: a(b+2)=ab+2a.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B08", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-009", "cat": 0, "sub": "Sifat bilangan", "level": 1, "stem": "Pilih semua bilangan rasional berikut.", "options": ["√4", "√5", "2/7", "0,125", "π"], "key": [0, 2, 3], "kind": "multi", "why": "√4 = 2, 2/7, dan 0,125 = 1/8 adalah rasional. 5 bukan kuadrat sempurna; akarnya irasional. π juga irasional.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B09", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-010", "cat": 0, "sub": "Persen dan perbandingan", "level": 3, "stem": "Harga suatu barang naik 25% menjadi Rp250000. Agar kembali ke harga semula Rp200000, harga baru perlu diturunkan sebesar …%.", "options": ["40", "20", "15", "25", "30"], "key": [1], "kind": "pg", "why": "Penurunan = 50000. Persentase dihitung terhadap harga baru: 50000/250000 × 100% = 20%.", "visual": "", "tip": "Tentukan nilai dasar yang dipakai menghitung persen.", "pattern": "B10", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-011", "cat": 1, "sub": "Persamaan linear", "level": 2, "stem": "Dua roti dan tiga susu berharga Rp12000. Satu roti dan satu susu berharga Rp5000. Harga satu roti adalah … rupiah.", "options": ["3000", "2000", "4000", "5000", "2500"], "key": [0], "kind": "pg", "why": "Misalkan harga roti r dan susu s. Dari r+s=5000, diperoleh 2r+2s=10000. Kurangkan dari 2r+3s=12000: s=2000. Maka r=5000−2000=3000.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A01", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-012", "cat": 1, "sub": "Persamaan linear", "level": 2, "stem": "Diketahui x+y+z=9, x−y=1, dan z=4. Nilai x adalah ….", "options": ["4", "2", "5", "9", "3"], "key": [4], "kind": "pg", "why": "Substitusi z=4: x+y=5. Jumlahkan dengan x−y=1 sehingga 2x=6 dan x=3.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A02", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-013", "cat": 1, "sub": "Pertidaksamaan linear", "level": 1, "stem": "Himpunan penyelesaian −2x + 4 > 4 adalah ….", "options": ["x ≤ 0", "x ≥ 0", "x < 4", "x < 0", "x > 0"], "key": [3], "kind": "pg", "why": "−2x > 0. Pembagian oleh −2 membalik tanda pertidaksamaan sehingga x < 0.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A03", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-014", "cat": 1, "sub": "Pertidaksamaan linear", "level": 2, "stem": "Pilih semua titik yang memenuhi x ≥ 0, y ≥ 0, dan x+y ≤ 4.", "options": ["(2, 2)", "(0, 4)", "(4, 1)", "(−1, 2)", "(1, 2)"], "key": [0, 1, 4], "kind": "multi", "why": "Uji tiap koordinat. Jumlah x+y berturut-turut 4, 4, 5, 1, dan 3. Pilihan keempat gagal karena x negatif; pilihan ketiga melampaui batas.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A04", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-015", "cat": 1, "sub": "Program linear", "level": 3, "stem": "Usaha kerajinan membuat x paket A dan y paket B. Batasnya x+y ≤ 20, 2x+y ≤ 28, x,y ≥ 0. Laba A Rp3.000 dan B Rp2.000 per paket. Laba maksimum adalah … rupiah.", "options": ["56000", "48000", "42000", "40000", "60000"], "key": [1], "kind": "pg", "why": "Titik pojok: (0,0), (14,0), (8,12), (0,20). Laba berturut-turut 0, 42000, 48000, 40000. Maksimum Rp48000.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A05", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-016", "cat": 1, "sub": "Domain dan range", "level": 1, "stem": "Domain fungsi f(x) = (x+1)/(x−2) untuk x real adalah ….", "options": ["x ∈ ℝ, x ≠ 2", "x ∈ ℝ", "x ≥ 2", "x ≠ −2", "x ≤ 2"], "key": [0], "kind": "pg", "why": "Penyebut tidak boleh nol: x−2 ≠ 0, sehingga x ≠ 2.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A06", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-017", "cat": 1, "sub": "Domain dan range", "level": 2, "stem": "Fungsi f(x)=(x−2)²+3 memiliki domain ℝ. Range f adalah ….", "options": ["y > 3", "y ≥ 0", "y ≥ 5", "y ≤ 3", "y ≥ 3"], "key": [4], "kind": "pg", "why": "Kuadrat selalu ≥ 0 dan mencapai 0 saat x=2. Jadi nilai minimum f adalah 3, dan semua y ≥ 3 dapat dicapai.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A07", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-018", "cat": 1, "sub": "Invers dan komposisi", "level": 2, "stem": "Jika f(x)=2x+4, nilai f⁻¹(18) adalah ….", "options": ["5", "6", "8", "7", "4"], "key": [3], "kind": "pg", "why": "Balik operasi: f⁻¹(y)=(y−4)/2. Maka f⁻¹(18)=(18−4)/2=7.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A08", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-019", "cat": 1, "sub": "Invers dan komposisi", "level": 2, "stem": "Diketahui f(x)=2x+2 dan g(x)=x²−1. Nilai (f ∘ g)(3) adalah ….", "options": ["20", "39", "18", "19", "17"], "key": [2], "kind": "pg", "why": "(f ∘ g)(3)=f(g(3)). g(3)=9−1=8, sehingga f(8)=16+2=18.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A09", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-020", "cat": 1, "sub": "Invers dan komposisi", "level": 3, "stem": "Biaya sewa sepeda adalah f(t)=10000+8000t rupiah untuk t jam. Jika total biaya Rp58000, berapa lama sepeda disewa?", "options": ["8", "6", "4", "5", "7"], "key": [1], "kind": "pg", "why": "Kurangi biaya tetap: 58000−10000=48000. Bagi tarif per jam: 48000/8000=6 jam.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A10", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-021", "cat": 1, "sub": "Fungsi kuadrat", "level": 2, "stem": "Untuk f(x)=(x−2)²−4, tentukan benar atau salah.", "options": ["Grafik terbuka ke atas.", "Titik puncak grafik adalah (2, −4).", "Grafik tidak memotong sumbu x."], "key": [true, true, false], "kind": "bs", "why": "Koefisien x² positif. Bentuk puncak memberi titik (2,−4). Untuk f(x)=0, (x−2)²=4, jadi akar 0 dan 4; grafik memotong sumbu x.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A11", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-022", "cat": 1, "sub": "Barisan dan deret", "level": 1, "stem": "Barisan aritmetika memiliki suku pertama 2 dan beda 3. Suku ke-12 adalah ….", "options": ["36", "34", "37", "73", "35"], "key": [4], "kind": "pg", "why": "U₁₂ = a+(12−1)b = 2+11×3 = 35.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A12", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-023", "cat": 1, "sub": "Barisan dan deret", "level": 2, "stem": "Suatu aula memiliki 12 baris kursi. Baris pertama 12 kursi dan setiap baris berikutnya bertambah 2 kursi. Jumlah kursi adalah ….", "options": ["275", "278", "555", "276", "277"], "key": [3], "kind": "pg", "why": "S₁₂=12/2 × [2(12)+11×2] = 6×46 = 276. Ini jumlah, bukan suku terakhir.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A13", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-024", "cat": 1, "sub": "Barisan dan deret", "level": 2, "stem": "Suku pertama suatu barisan geometri adalah 2 dan rasionya 2. Jumlah lima suku pertama adalah ….", "options": ["64", "124", "62", "32", "60"], "key": [2], "kind": "pg", "why": "S₅=a(r⁵−1)/(r−1)=2(32−1)/(2−1)=62.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A14", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-025", "cat": 1, "sub": "Pertumbuhan dan bunga", "level": 2, "stem": "Koloni mula-mula berisi 200 sel. Jumlahnya menjadi dua kali lipat setiap 3 jam. Banyak sel setelah 9 jam adalah ….", "options": ["3200", "1600", "400", "800", "1200"], "key": [1], "kind": "pg", "why": "Ada 9/3=3 periode pelipatan. Jumlah akhir=200×2³=1600.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A15", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-026", "cat": 1, "sub": "Pertumbuhan dan bunga", "level": 2, "stem": "Modal Rp2000000 diberi bunga tunggal 6% per tahun selama 3 tahun. Total modal dan bunga adalah … rupiah.", "options": ["2360000", "2120000", "2240000", "2400000", "2382032"], "key": [0], "kind": "pg", "why": "Bunga = modal × 6% × 3 = 360000. Total = 2000000+360000=2360000.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A16", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-027", "cat": 1, "sub": "Pertumbuhan dan bunga", "level": 2, "stem": "Tabungan Rp200000 mendapat bunga majemuk 10% setahun. Tanpa penarikan dan biaya, saldo setelah dua tahun adalah … rupiah.", "options": ["220000", "240000", "244000", "280000", "242000"], "key": [4], "kind": "pg", "why": "Saldo akhir=M(1+r)²=200000×1,1²=242000. Bunga tahun kedua dihitung dari saldo tahun pertama.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A17", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-028", "cat": 1, "sub": "Barisan dan deret", "level": 3, "stem": "Produksi mingguan mengikuti barisan Uₘ=2+4(m−1), untuk m≥1.", "options": ["Minggu ke-6 menghasilkan 22 unit.", "Jumlah produksi 6 minggu pertama adalah 72 unit.", "Kenaikan persentase dari minggu ke minggu selalu sama."], "key": [true, true, false], "kind": "bs", "why": "U₆=2+20. S₆=6/2×(2×2+5×4)=72. Selisih tetap 4, tetapi persentase 4/Uₘ berubah karena penyebut bertambah.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A18", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-029", "cat": 2, "sub": "Sudut dan garis", "level": 1, "stem": "Dua sudut dalam sepihak pada dua garis sejajar besarnya (2x+10)° dan (2x+30)°. Nilai x adalah ….", "options": ["45", "25", "35", "36", "34"], "key": [2], "kind": "pg", "why": "Sudut dalam sepihak berjumlah 180°. (2+2)x+40=180, sehingga x=140/4=35.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G01", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-030", "cat": 2, "sub": "Kesebangunan", "level": 2, "stem": "Tiang setinggi 6 m memiliki bayangan 4 m. Pada waktu yang sama, bayangan sebuah pohon 12 m. Tinggi pohon adalah … m.", "options": ["39", "18", "19", "17", "20"], "key": [1], "kind": "pg", "why": "Pada sudut datang matahari yang sama, tinggi/bayangan tetap. h/12=6/4. Jadi h=18 m.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G02", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-031", "cat": 2, "sub": "Pythagoras dan jarak", "level": 1, "stem": "Segitiga siku-siku memiliki kaki 6 cm dan 8 cm. Sisi miringnya … cm.", "options": ["10", "14", "12", "8", "16"], "key": [0], "kind": "pg", "why": "c=√[(6)²+(8)²]=√100=10 cm.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G03", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-032", "cat": 2, "sub": "Pythagoras dan jarak", "level": 2, "stem": "Balok memiliki panjang 6, lebar 8, dan tinggi 24 cm. Panjang diagonal ruangnya … cm.", "options": ["10", "24", "30", "38", "26"], "key": [4], "kind": "pg", "why": "Diagonal ruang d=√(p²+l²+t²)=√676=26. Diagonal alasnya saja adalah 10.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G04", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-033", "cat": 2, "sub": "Transformasi titik", "level": 1, "stem": "Titik P(2, −3) ditranslasikan oleh vektor (4, 5). Bayangan P adalah ….", "options": ["(6, −8)", "(2, 2)", "(4, 7)", "(6, 2)", "(-2, 2)"], "key": [3], "kind": "pg", "why": "Tambahkan tiap komponen: x′=2+4=6; y′=−3+5=2.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G05", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-034", "cat": 2, "sub": "Transformasi titik", "level": 1, "stem": "Bayangan titik A(2, −5) oleh refleksi terhadap garis y=x adalah ….", "options": ["(−2, −5)", "(3, 5)", "(−5, 2)", "(2, 5)", "(2, −5)"], "key": [2], "kind": "pg", "why": "Refleksi terhadap y=x menukar koordinat: (x,y)→(y,x). Maka (2,−5)→(−5,2).", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G06", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-035", "cat": 2, "sub": "Transformasi titik", "level": 2, "stem": "Titik (2, 3) diputar 90° berlawanan arah jarum jam terhadap O(0,0). Hasilnya ….", "options": ["(3, −3)", "(−3, 2)", "(3, −2)", "(−2, −3)", "(3, 2)"], "key": [1], "kind": "pg", "why": "Rotasi 90° berlawanan arah jarum jam: (x,y)→(−y,x), jadi (2,3)→(−3,2).", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G07", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-036", "cat": 2, "sub": "Transformasi titik", "level": 3, "stem": "Titik (2, 1) ditranslasikan (2, −3), lalu didilatasikan berpusat O dengan faktor 2. Koordinat akhirnya ….", "options": ["(8, −4)", "(6, −1)", "(6, −5)", "(8, 4)", "(4, −4)"], "key": [0], "kind": "pg", "why": "Sesudah translasi: (4,−2). Dilatasi berpusat O mengalikan kedua koordinat dengan 2, menghasilkan (8,−4).", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G08", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-037", "cat": 2, "sub": "Luas dan keliling", "level": 2, "stem": "Taman berbentuk persegi panjang 8 m × 6 m. Jalan selebar 1 m dibuat di sekeliling bagian dalam taman. Luas bagian taman yang tidak menjadi jalan … m².", "options": ["48", "35", "25", "46", "24"], "key": [4], "kind": "pg", "why": "Jalan berada di dalam pada kedua sisi. Ukuran sisa = (8−2) × (6−2), sehingga luas = 24 m².", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G09", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-038", "cat": 2, "sub": "Luas dan keliling", "level": 2, "stem": "Sebuah lingkaran berjari-jari 14 cm memiliki juring 90°. Luas juring tersebut … cm². Gunakan π=22/7.", "options": ["616", "44", "196", "154", "308"], "key": [3], "kind": "pg", "why": "Luas juring=(90/360)×πr²=¼×22/7×(14)²=154 cm².", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G10", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-039", "cat": 2, "sub": "Volume dan luas permukaan", "level": 2, "stem": "Tabung tertutup berjari-jari 7 cm dan tinggi 2 cm. Luas permukaannya … cm². Gunakan π=22/7.", "options": ["704", "401", "396", "88", "308"], "key": [2], "kind": "pg", "why": "Luas dua alas dan selimut: 2πr²+2πrt=2×22/7×7×(7+2)=396 cm².", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G11", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-040", "cat": 2, "sub": "Volume dan luas permukaan", "level": 2, "stem": "Kerucut berjari-jari 6 cm dan tinggi 8 cm memiliki volume … π cm³.", "options": ["192", "96", "288", "36", "32"], "key": [1], "kind": "pg", "why": "V=⅓πr²t=⅓π×(6)²×8=96π cm³.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G12", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-041", "cat": 2, "sub": "Pythagoras dan jarak", "level": 3, "stem": "Pada kubus ABCD.EFGH dengan rusuk 2 cm, E tepat di atas A. Jarak titik E ke garis AC adalah … cm.", "options": ["2", "2√2", "2√3", "2/2", "2√2/2"], "key": [0], "kind": "pg", "why": "AE tegak lurus bidang ABCD, sehingga AE juga tegak lurus garis AC melalui A. Kaki proyeksi E pada AC adalah A. Jadi jarak E ke AC=EA=2 cm.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G13", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-042", "cat": 2, "sub": "Pythagoras dan jarak", "level": 3, "stem": "Kubus ABCD.EFGH memiliki rusuk 4 cm. Jarak titik A ke bidang BCGF adalah … cm.", "options": ["4√2", "4√3", "2", "6", "4"], "key": [4], "kind": "pg", "why": "Bidang BCGF adalah sisi tegak melalui BC. AB tegak lurus bidang tersebut dan B adalah kaki proyeksi. Jadi jaraknya AB=4 cm.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G14", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-043", "cat": 2, "sub": "Kesebangunan", "level": 3, "stem": "Sebuah model persegi bersisi 2 cm diperbesar dengan faktor skala 3.", "options": ["Sisi hasil pembesaran 6 cm.", "Luas hasil pembesaran 3 kali luas awal.", "Keliling hasil pembesaran 3 kali keliling awal."], "key": [true, false, true], "kind": "bs", "why": "Panjang dan keliling dikalikan 3. Luas dikalikan 3²=9: luas awal 4 cm² menjadi 36 cm².", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G15", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-044", "cat": 2, "sub": "Luas dan keliling", "level": 3, "stem": "Sebuah persegi panjang mempunyai keliling 24 cm. (1) Panjangnya 8 cm. (2) Lebarnya 4 cm. Untuk menentukan luasnya, informasi mana yang cukup?", "options": ["Harus memakai (1) dan (2) bersama.", "Keduanya tetap tidak cukup.", "Masing-masing pernyataan cukup.", "Hanya (1) cukup.", "Hanya (2) cukup."], "key": [2], "kind": "pg", "why": "Dari keliling diperoleh p+l=12. (1) memberi l=4; (2) memberi p=8. Masing-masing cukup untuk menghitung luas 32 cm².", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G16", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-045", "cat": 3, "sub": "Rasio trigonometri", "level": 1, "stem": "Segitiga siku-siku memiliki sisi depan sudut θ sepanjang 6 cm dan sisi miring 10 cm. Nilai sin θ adalah ….", "options": ["4/3", "3/5", "4/5", "3/4", "5/3"], "key": [1], "kind": "pg", "why": "sin θ=depan/miring=6/10=3/5.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T01", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-046", "cat": 3, "sub": "Rasio trigonometri", "level": 2, "stem": "Pada segitiga siku-siku, sisi depan sudut θ=10 dan sisi sampingnya=24. Nilai sec θ adalah ….", "options": ["13/12", "12/13", "5/13", "13/5", "12/5"], "key": [0], "kind": "pg", "why": "Sisi miring = √[(10)²+(24)²]=26. sec θ=1/cos θ=miring/samping=13/12.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T02", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-047", "cat": 3, "sub": "Sudut istimewa", "level": 2, "stem": "Nilai 2 sin 30° + 2 cos 60° adalah ….", "options": ["1", "4", "3", "7", "2"], "key": [4], "kind": "pg", "why": "sin 30°=cos 60°=½. Hasil=2×½+2×½=2.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T03", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-048", "cat": 3, "sub": "Sudut dan kuadran", "level": 2, "stem": "Diketahui sin A=6/10 dan A sudut tumpul. Nilai cos A adalah ….", "options": ["3/5", "-3/5", "-5/4", "-4/5", "4/5"], "key": [3], "kind": "pg", "why": "sin A=3/5. Dari sin²A+cos²A=1 diperoleh |cos A|=4/5. Sudut tumpul berada di kuadran II, sehingga cos A negatif.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T04", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-049", "cat": 3, "sub": "Aplikasi trigonometri", "level": 2, "stem": "Tangga sepanjang 4 m bersandar pada tembok dan membentuk sudut 60° terhadap lantai. Tinggi ujung tangga dari lantai adalah … m.", "options": ["2√2", "4", "2√3", "2", "4√3"], "key": [2], "kind": "pg", "why": "Tinggi adalah sisi depan sudut 60°. h=L sin 60°=4×√3/2=2√3 m.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T05", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-050", "cat": 3, "sub": "Aplikasi trigonometri", "level": 2, "stem": "Pengamat berada 20 m dari kaki menara di tanah datar. Sudut elevasi ke puncak 45°. Jika tinggi mata 1,5 m, tinggi menara adalah … m.", "options": ["11,5", "21,5", "20", "18,5", "40"], "key": [1], "kind": "pg", "why": "Selisih tinggi puncak dan mata = jarak × tan45°=20. Tinggi menara=20+1,5=21,5 m.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T06", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-051", "cat": 3, "sub": "Rasio trigonometri", "level": 2, "stem": "Untuk sudut lancip θ dengan tan θ=6/8, pilih semua pernyataan yang benar.", "options": ["sin θ = 3/5", "cos θ = 4/5", "cot θ = 3/4", "csc θ = 5/3", "sec θ = 4/5"], "key": [0, 1, 3], "kind": "multi", "why": "Gunakan segitiga sebanding 3–4–5. sin=3/5, cos=4/5, cot=4/3, csc=5/3, dan sec=5/4.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T07", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-052", "cat": 3, "sub": "Aplikasi trigonometri", "level": 3, "stem": "Dua titik pengamatan segaris dengan kaki menara. Titik dekat berjarak 2√3 m dari kaki menara dan sudut elevasinya 60°. Dari titik jauh sudut elevasinya 30°. Jarak kedua titik pengamatan adalah … m.", "options": ["2√3", "6√3", "8√3", "6", "4√3"], "key": [4], "kind": "pg", "why": "Tinggi menara=2√3×tan60°=6. Jarak titik jauh=6/tan30°=6√3. Selisih jarak=(6−2)√3=4√3.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T08", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-053", "cat": 4, "sub": "Data tunggal", "level": 1, "stem": "Rata-rata data 3, 5, 7, 9, 11 adalah ….", "options": ["6", "9", "17", "7", "8"], "key": [3], "kind": "pg", "why": "Jumlah data=35, banyak data=5. Rata-rata=35/5=7.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D01", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-054", "cat": 4, "sub": "Data tunggal", "level": 1, "stem": "Median data 2, 9, 4, 7, 3, 5 adalah ….", "options": ["5,5", "6", "4,5", "4", "5"], "key": [2], "kind": "pg", "why": "Urutkan: 2, 3, 4, 5, 7, 9. Median rata-rata data ke-3 dan ke-4: (4+5)/2=4,5.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D02", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-055", "cat": 4, "sub": "Data tunggal", "level": 2, "stem": "Data 2, 4, 6 dianggap sebagai seluruh populasi. Varians populasinya adalah ….", "options": ["2/3", "8/3", "4/3", "4", "8"], "key": [1], "kind": "pg", "why": "Rata-rata=4. Kuadrat simpangan: 4,0,4. Varians populasi=(4+0+4)/3=8/3.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D03", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-056", "cat": 4, "sub": "Data tunggal", "level": 2, "stem": "Rata-rata 10 siswa adalah 72; rata-rata 5 siswa lainnya 82. Rata-rata gabungan 15 siswa adalah ….", "options": ["226/3", "77", "72", "82", "229/3"], "key": [0], "kind": "pg", "why": "Jumlah nilai=10×72+5×82=1130. Bagi 15, diperoleh 226/3.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D04", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-057", "cat": 4, "sub": "Penyajian data", "level": 2, "stem": "Diagram menunjukkan jumlah pengunjung perpustakaan. Kenaikan terbesar dibanding hari sebelumnya terjadi pada ….", "options": ["Senin", "Selasa", "Rabu", "Jumat", "Kamis"], "key": [4], "kind": "pg", "why": "Perubahan harian: Selasa +4, Rabu −2, Kamis +12, Jumat +6. Kenaikan terbesar pada Kamis, bukan hari dengan jumlah pengunjung tertinggi.", "visual": "<svg viewBox=\"0 0 500 200\" role=\"img\" aria-label=\"Diagram jumlah pengunjung per hari\"><rect x=\"25\" y=\"83.33333333333334\" width=\"48\" height=\"76.66666666666666\" rx=\"6\" fill=\"#7870e8\"/><text x=\"49\" y=\"72.33333333333334\" text-anchor=\"middle\" fill=\"currentColor\">40</text><text x=\"49\" y=\"184\" text-anchor=\"middle\" fill=\"currentColor\">Sen</text><rect x=\"120\" y=\"75.66666666666667\" width=\"48\" height=\"84.33333333333333\" rx=\"6\" fill=\"#7870e8\"/><text x=\"144\" y=\"64.66666666666667\" text-anchor=\"middle\" fill=\"currentColor\">44</text><text x=\"144\" y=\"184\" text-anchor=\"middle\" fill=\"currentColor\">Sel</text><rect x=\"215\" y=\"79.5\" width=\"48\" height=\"80.5\" rx=\"6\" fill=\"#7870e8\"/><text x=\"239\" y=\"68.5\" text-anchor=\"middle\" fill=\"currentColor\">42</text><text x=\"239\" y=\"184\" text-anchor=\"middle\" fill=\"currentColor\">Rab</text><rect x=\"310\" y=\"56.5\" width=\"48\" height=\"103.5\" rx=\"6\" fill=\"#7870e8\"/><text x=\"334\" y=\"45.5\" text-anchor=\"middle\" fill=\"currentColor\">54</text><text x=\"334\" y=\"184\" text-anchor=\"middle\" fill=\"currentColor\">Kam</text><rect x=\"405\" y=\"45.0\" width=\"48\" height=\"115.0\" rx=\"6\" fill=\"#7870e8\"/><text x=\"429\" y=\"34.0\" text-anchor=\"middle\" fill=\"currentColor\">60</text><text x=\"429\" y=\"184\" text-anchor=\"middle\" fill=\"currentColor\">Jum</text></svg>", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D05", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-058", "cat": 4, "sub": "Penyajian data", "level": 2, "stem": "Diagram lingkaran menunjukkan 80 peserta memilih kegiatan. Sektor olahraga bersudut 90°. Banyak peserta yang memilih olahraga adalah ….", "options": ["19", "22", "43", "20", "21"], "key": [3], "kind": "pg", "why": "Bagian olahraga=90/360=¼. Jumlah peserta=¼×80=20.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D06", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-059", "cat": 4, "sub": "Data kelompok", "level": 2, "stem": "Tentukan perkiraan rata-rata dari tabel frekuensi berikut.", "options": ["49", "97", "47", "48", "46"], "key": [2], "kind": "pg", "why": "Titik tengah kelas: 42, 47, 52. Rata-rata=[2×42+6×47+2×52]/10=47.", "visual": "<div class=\"table-wrap\"><table><thead><tr><th>Nilai</th><th>Frekuensi</th></tr></thead><tbody><tr><td>40–44</td><td>2</td></tr><tr><td>45–49</td><td>6</td></tr><tr><td>50–54</td><td>2</td></tr></tbody></table></div>", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D07", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-060", "cat": 4, "sub": "Data kelompok", "level": 2, "stem": "Modus data berkelompok berikut, menggunakan interpolasi kelas, adalah ….", "options": ["59,5", "54,5", "49,5", "50", "55"], "key": [1], "kind": "pg", "why": "Kelas modus 50–59; tepi bawah 49.5; lebar kelas 10. d₁=8−4=4 dan d₂=8−4=4. Mo=49.5+[4/(4+4)]×10=54.5.", "visual": "<div class=\"table-wrap\"><table><thead><tr><th>Nilai</th><th>Frekuensi</th></tr></thead><tbody><tr><td>40–49</td><td>4</td></tr><tr><td>50–59</td><td>8</td></tr><tr><td>60–69</td><td>4</td></tr></tbody></table></div>", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D08", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-061", "cat": 4, "sub": "Aturan pencacahan", "level": 1, "stem": "Sebuah kantin menyediakan 4 jenis makanan dan 2 jenis minuman. Satu paket terdiri dari satu makanan dan satu minuman. Banyak paket berbeda adalah ….", "options": ["8", "6", "4", "16", "10"], "key": [0], "kind": "pg", "why": "Gunakan aturan perkalian: 4 pilihan makanan × 2 pilihan minuman = 8 paket.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D09", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-062", "cat": 4, "sub": "Aturan pencacahan", "level": 2, "stem": "Dari 6 siswa dipilih ketua dan sekretaris. Satu siswa tidak boleh memegang dua jabatan. Banyak susunan pengurus adalah ….", "options": ["15", "36", "6", "12", "30"], "key": [4], "kind": "pg", "why": "Jabatan berbeda sehingga urutan penting. Ketua punya 6 pilihan; sekretaris 5. Total=30.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D10", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-063", "cat": 4, "sub": "Aturan pencacahan", "level": 2, "stem": "Dari 7 anggota klub, dipilih 2 orang sebagai delegasi tanpa jabatan berbeda. Banyak pilihan delegasi adalah ….", "options": ["49", "7", "14", "21", "42"], "key": [3], "kind": "pg", "why": "Urutan tidak penting. C(7,2)=(7×6)/2=21.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D11", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-064", "cat": 4, "sub": "Peluang majemuk", "level": 2, "stem": "Kotak berisi 2 bola merah dan 4 bola biru. Dua bola diambil berurutan tanpa pengembalian. Peluang bola pertama merah dan kedua biru adalah ….", "options": ["2/3", "1/2", "4/15", "2/9", "1/3"], "key": [2], "kind": "pg", "why": "P(merah pertama)=2/6. Setelah merah terambil, tersisa 5 bola dan 4 di antaranya biru. Kalikan: 2/6 × 4/5 = 4/15.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D12", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-065", "cat": 4, "sub": "Peluang majemuk", "level": 2, "stem": "Peluang seorang atlet mengenai sasaran pada tiap tembakan adalah 2/10. Dua tembakan saling independen. Peluang keduanya mengenai sasaran adalah ….", "options": ["1/50", "1/25", "1/5", "2/5", "24/25"], "key": [1], "kind": "pg", "why": "Karena independen, P(keduanya kena)=(2/10)×(2/10)=1/25.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D13", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-066", "cat": 4, "sub": "Data tunggal", "level": 3, "stem": "Seluruh nilai data 2, 4, 6, 8 ditambah 5. Pilih semua pernyataan yang benar.", "options": ["Rata-rata bertambah 5.", "Median bertambah 5.", "Jangkauan bertambah 5.", "Simpangan baku tetap.", "Varians bertambah 25."], "key": [0, 1, 3], "kind": "multi", "why": "Penambahan konstanta menggeser pusat data: mean dan median naik 5. Selisih antarnilai tidak berubah; jangkauan, varians, dan simpangan baku tetap.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D14", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-067", "cat": 0, "sub": "Operasi bilangan", "level": 1, "stem": "Nilai 3 + 6 × 4 − 6 adalah ….", "options": ["22", "20", "23", "45", "21"], "key": [4], "kind": "pg", "why": "Kerjakan perkalian dahulu: 6 × 4 = 24. Lalu 3 + 24 − 6 = 21.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B01", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-068", "cat": 0, "sub": "Operasi bilangan", "level": 1, "stem": "Hasil 3/3 + 1/2 adalah ….", "options": ["4/3", "5/2", "7/2", "3/2", "5/3"], "key": [3], "kind": "pg", "why": "Samakan penyebut menjadi 6: 6/6 + 3/6 = 3/2.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B02", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-069", "cat": 0, "sub": "Pangkat dan akar", "level": 1, "stem": "Bentuk sederhana 2^6 ÷ 2^3 adalah ….", "options": ["16", "32", "8", "2", "4"], "key": [2], "kind": "pg", "why": "Untuk basis sama, kurangi pangkat: 2^(6 − 3) = 2³ = 8.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B03", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-070", "cat": 0, "sub": "Pangkat dan akar", "level": 2, "stem": "Nilai (27)^(2/3) adalah ….", "options": ["11", "9", "3", "27", "10"], "key": [1], "kind": "pg", "why": "Akar pangkat tiga dari 27 adalah 3; kuadratkan hasilnya: 3² = 9.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B04", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-071", "cat": 0, "sub": "Pangkat dan akar", "level": 2, "stem": "Bentuk paling sederhana √72 + √162 adalah ….", "options": ["15√2", "3√2", "15√5", "18√2", "15√3"], "key": [0], "kind": "pg", "why": "√72 = 6√2 dan √162 = 9√2. Jumlahnya 15√2.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B05", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-072", "cat": 0, "sub": "Persen dan perbandingan", "level": 2, "stem": "Sebuah tas berharga Rp300.000. Diskon 20% dilanjutkan diskon 10% dari harga setelah diskon pertama. Harga akhir (rupiah) adalah ….", "options": ["210000", "240000", "270000", "180000", "216000"], "key": [4], "kind": "pg", "why": "Harga setelah diskon pertama = 0,8 × 300000 = 240000. Diskon kedua diterapkan pada harga ini: 0,9 × 240000 = 216000.", "visual": "", "tip": "Diskon berurutan dikalikan, bukan dijumlahkan.", "pattern": "B06", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-073", "cat": 0, "sub": "Persen dan perbandingan", "level": 2, "stem": "Dalam campuran sirup dan air, perbandingan volumenya 2 : 5. Jika volume campuran 21 liter, banyak sirup adalah … liter.", "options": ["5", "8", "15", "6", "7"], "key": [3], "kind": "pg", "why": "Jumlah bagian = 2 + 5 = 7. Satu bagian = 21/7 = 3 liter. Sirup = 2 × 3 = 6 liter.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B07", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-074", "cat": 0, "sub": "Sifat bilangan", "level": 2, "stem": "Untuk a = 3 dan b = 4, tentukan benar atau salah.", "options": ["a + b = b + a", "a ÷ b = b ÷ a", "a(b + 2) = ab + 2a"], "key": [true, false, true], "kind": "bs", "why": "Penjumlahan komutatif. Pembagian tidak komutatif karena 3/4 ≠ 4/3. Perkalian distributif: a(b+2)=ab+2a.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B08", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-075", "cat": 0, "sub": "Sifat bilangan", "level": 1, "stem": "Pilih semua bilangan rasional berikut.", "options": ["√9", "√10", "3/7", "0,125", "π"], "key": [0, 2, 3], "kind": "multi", "why": "√9 = 3, 3/7, dan 0,125 = 1/8 adalah rasional. 10 bukan kuadrat sempurna; akarnya irasional. π juga irasional.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B09", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-076", "cat": 0, "sub": "Persen dan perbandingan", "level": 3, "stem": "Harga suatu barang naik 25% menjadi Rp375000. Agar kembali ke harga semula Rp300000, harga baru perlu diturunkan sebesar …%.", "options": ["20", "15", "25", "30", "40"], "key": [0], "kind": "pg", "why": "Penurunan = 75000. Persentase dihitung terhadap harga baru: 75000/375000 × 100% = 20%.", "visual": "", "tip": "Tentukan nilai dasar yang dipakai menghitung persen.", "pattern": "B10", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-077", "cat": 1, "sub": "Persamaan linear", "level": 2, "stem": "Dua roti dan tiga susu berharga Rp15500. Satu roti dan satu susu berharga Rp6500. Harga satu roti adalah … rupiah.", "options": ["2500", "5000", "6000", "3500", "4000"], "key": [4], "kind": "pg", "why": "Misalkan harga roti r dan susu s. Dari r+s=6500, diperoleh 2r+2s=13000. Kurangkan dari 2r+3s=15500: s=2500. Maka r=6500−2500=4000.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A01", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-078", "cat": 1, "sub": "Persamaan linear", "level": 2, "stem": "Diketahui x+y+z=12, x−y=1, dan z=5. Nilai x adalah ….", "options": ["3", "6", "11", "4", "5"], "key": [3], "kind": "pg", "why": "Substitusi z=5: x+y=7. Jumlahkan dengan x−y=1 sehingga 2x=8 dan x=4.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A02", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-079", "cat": 1, "sub": "Pertidaksamaan linear", "level": 1, "stem": "Himpunan penyelesaian −2x + 6 > 4 adalah ….", "options": ["x ≥ 1", "x < 5", "x < 1", "x > 1", "x ≤ 1"], "key": [2], "kind": "pg", "why": "−2x > -2. Pembagian oleh −2 membalik tanda pertidaksamaan sehingga x < 1.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A03", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-080", "cat": 1, "sub": "Pertidaksamaan linear", "level": 2, "stem": "Pilih semua titik yang memenuhi x ≥ 0, y ≥ 0, dan x+y ≤ 6.", "options": ["(3, 3)", "(0, 6)", "(6, 1)", "(−1, 3)", "(2, 3)"], "key": [0, 1, 4], "kind": "multi", "why": "Uji tiap koordinat. Jumlah x+y berturut-turut 6, 6, 7, 2, dan 5. Pilihan keempat gagal karena x negatif; pilihan ketiga melampaui batas.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A04", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-081", "cat": 1, "sub": "Program linear", "level": 3, "stem": "Usaha kerajinan membuat x paket A dan y paket B. Batasnya x+y ≤ 30, 2x+y ≤ 42, x,y ≥ 0. Laba A Rp3.000 dan B Rp2.000 per paket. Laba maksimum adalah … rupiah.", "options": ["72000", "63000", "60000", "90000", "84000"], "key": [0], "kind": "pg", "why": "Titik pojok: (0,0), (21,0), (12,18), (0,30). Laba berturut-turut 0, 63000, 72000, 60000. Maksimum Rp72000.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A05", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-082", "cat": 1, "sub": "Domain dan range", "level": 1, "stem": "Domain fungsi f(x) = (x+1)/(x−3) untuk x real adalah ….", "options": ["x ∈ ℝ", "x ≥ 3", "x ≠ −3", "x ≤ 3", "x ∈ ℝ, x ≠ 3"], "key": [4], "kind": "pg", "why": "Penyebut tidak boleh nol: x−3 ≠ 0, sehingga x ≠ 3.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A06", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-083", "cat": 1, "sub": "Domain dan range", "level": 2, "stem": "Fungsi f(x)=(x−3)²+3 memiliki domain ℝ. Range f adalah ….", "options": ["y ≥ 0", "y ≥ 6", "y ≤ 3", "y ≥ 3", "y > 3"], "key": [3], "kind": "pg", "why": "Kuadrat selalu ≥ 0 dan mencapai 0 saat x=3. Jadi nilai minimum f adalah 3, dan semua y ≥ 3 dapat dicapai.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A07", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-084", "cat": 1, "sub": "Invers dan komposisi", "level": 2, "stem": "Jika f(x)=3x+4, nilai f⁻¹(25) adalah ….", "options": ["6", "8", "7", "4", "5"], "key": [2], "kind": "pg", "why": "Balik operasi: f⁻¹(y)=(y−4)/3. Maka f⁻¹(25)=(25−4)/3=7.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A08", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-085", "cat": 1, "sub": "Invers dan komposisi", "level": 2, "stem": "Diketahui f(x)=2x+3 dan g(x)=x²−1. Nilai (f ∘ g)(3) adalah ….", "options": ["41", "19", "20", "18", "21"], "key": [1], "kind": "pg", "why": "(f ∘ g)(3)=f(g(3)). g(3)=9−1=8, sehingga f(8)=16+3=19.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A09", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-086", "cat": 1, "sub": "Invers dan komposisi", "level": 3, "stem": "Biaya sewa sepeda adalah f(t)=15000+8000t rupiah untuk t jam. Jika total biaya Rp63000, berapa lama sepeda disewa?", "options": ["6", "4", "5", "7", "8"], "key": [0], "kind": "pg", "why": "Kurangi biaya tetap: 63000−15000=48000. Bagi tarif per jam: 48000/8000=6 jam.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A10", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-087", "cat": 1, "sub": "Fungsi kuadrat", "level": 2, "stem": "Untuk f(x)=(x−3)²−4, tentukan benar atau salah.", "options": ["Grafik terbuka ke atas.", "Titik puncak grafik adalah (3, −4).", "Grafik tidak memotong sumbu x."], "key": [true, true, false], "kind": "bs", "why": "Koefisien x² positif. Bentuk puncak memberi titik (3,−4). Untuk f(x)=0, (x−3)²=4, jadi akar 1 dan 5; grafik memotong sumbu x.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A11", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-088", "cat": 1, "sub": "Barisan dan deret", "level": 1, "stem": "Barisan aritmetika memiliki suku pertama 3 dan beda 3. Suku ke-12 adalah ….", "options": ["35", "38", "75", "36", "37"], "key": [3], "kind": "pg", "why": "U₁₂ = a+(12−1)b = 3+11×3 = 36.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A12", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-089", "cat": 1, "sub": "Barisan dan deret", "level": 2, "stem": "Suatu aula memiliki 12 baris kursi. Baris pertama 13 kursi dan setiap baris berikutnya bertambah 2 kursi. Jumlah kursi adalah ….", "options": ["290", "579", "288", "289", "287"], "key": [2], "kind": "pg", "why": "S₁₂=12/2 × [2(13)+11×2] = 6×48 = 288. Ini jumlah, bukan suku terakhir.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A13", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-090", "cat": 1, "sub": "Barisan dan deret", "level": 2, "stem": "Suku pertama suatu barisan geometri adalah 3 dan rasionya 2. Jumlah lima suku pertama adalah ….", "options": ["186", "93", "48", "90", "96"], "key": [1], "kind": "pg", "why": "S₅=a(r⁵−1)/(r−1)=3(32−1)/(2−1)=93.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A14", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-091", "cat": 1, "sub": "Pertumbuhan dan bunga", "level": 2, "stem": "Koloni mula-mula berisi 300 sel. Jumlahnya menjadi dua kali lipat setiap 3 jam. Banyak sel setelah 9 jam adalah ….", "options": ["2400", "600", "1200", "1800", "4800"], "key": [0], "kind": "pg", "why": "Ada 9/3=3 periode pelipatan. Jumlah akhir=300×2³=2400.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A15", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-092", "cat": 1, "sub": "Pertumbuhan dan bunga", "level": 2, "stem": "Modal Rp3000000 diberi bunga tunggal 6% per tahun selama 3 tahun. Total modal dan bunga adalah … rupiah.", "options": ["3180000", "3360000", "3600000", "3573048", "3540000"], "key": [4], "kind": "pg", "why": "Bunga = modal × 6% × 3 = 540000. Total = 3000000+540000=3540000.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A16", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-093", "cat": 1, "sub": "Pertumbuhan dan bunga", "level": 2, "stem": "Tabungan Rp300000 mendapat bunga majemuk 10% setahun. Tanpa penarikan dan biaya, saldo setelah dua tahun adalah … rupiah.", "options": ["360000", "366000", "420000", "363000", "330000"], "key": [3], "kind": "pg", "why": "Saldo akhir=M(1+r)²=300000×1,1²=363000. Bunga tahun kedua dihitung dari saldo tahun pertama.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A17", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-094", "cat": 1, "sub": "Barisan dan deret", "level": 3, "stem": "Produksi mingguan mengikuti barisan Uₘ=3+4(m−1), untuk m≥1.", "options": ["Minggu ke-6 menghasilkan 23 unit.", "Jumlah produksi 6 minggu pertama adalah 78 unit.", "Kenaikan persentase dari minggu ke minggu selalu sama."], "key": [true, true, false], "kind": "bs", "why": "U₆=3+20. S₆=6/2×(2×3+5×4)=78. Selisih tetap 4, tetapi persentase 4/Uₘ berubah karena penyebut bertambah.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A18", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-095", "cat": 2, "sub": "Sudut dan garis", "level": 1, "stem": "Dua sudut dalam sepihak pada dua garis sejajar besarnya (3x+10)° dan (2x+30)°. Nilai x adalah ….", "options": ["20", "28", "29", "27", "36"], "key": [1], "kind": "pg", "why": "Sudut dalam sepihak berjumlah 180°. (3+2)x+40=180, sehingga x=140/5=28.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G01", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-096", "cat": 2, "sub": "Kesebangunan", "level": 2, "stem": "Tiang setinggi 9 m memiliki bayangan 6 m. Pada waktu yang sama, bayangan sebuah pohon 18 m. Tinggi pohon adalah … m.", "options": ["27", "28", "26", "29", "57"], "key": [0], "kind": "pg", "why": "Pada sudut datang matahari yang sama, tinggi/bayangan tetap. h/18=9/6. Jadi h=27 m.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G02", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-097", "cat": 2, "sub": "Pythagoras dan jarak", "level": 1, "stem": "Segitiga siku-siku memiliki kaki 9 cm dan 12 cm. Sisi miringnya … cm.", "options": ["21", "18", "12", "24", "15"], "key": [4], "kind": "pg", "why": "c=√[(9)²+(12)²]=√225=15 cm.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G03", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-098", "cat": 2, "sub": "Pythagoras dan jarak", "level": 2, "stem": "Balok memiliki panjang 9, lebar 12, dan tinggi 36 cm. Panjang diagonal ruangnya … cm.", "options": ["36", "45", "57", "39", "15"], "key": [3], "kind": "pg", "why": "Diagonal ruang d=√(p²+l²+t²)=√1521=39. Diagonal alasnya saja adalah 15.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G04", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-099", "cat": 2, "sub": "Transformasi titik", "level": 1, "stem": "Titik P(3, −3) ditranslasikan oleh vektor (4, 5). Bayangan P adalah ….", "options": ["(3, 2)", "(4, 8)", "(7, 2)", "(-1, 2)", "(7, −8)"], "key": [2], "kind": "pg", "why": "Tambahkan tiap komponen: x′=3+4=7; y′=−3+5=2.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G05", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-100", "cat": 2, "sub": "Transformasi titik", "level": 1, "stem": "Bayangan titik A(3, −5) oleh refleksi terhadap garis y=x adalah ….", "options": ["(4, 5)", "(−5, 3)", "(3, 5)", "(3, −5)", "(−3, −5)"], "key": [1], "kind": "pg", "why": "Refleksi terhadap y=x menukar koordinat: (x,y)→(y,x). Maka (3,−5)→(−5,3).", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G06", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-101", "cat": 2, "sub": "Transformasi titik", "level": 2, "stem": "Titik (3, 3) diputar 90° berlawanan arah jarum jam terhadap O(0,0). Hasilnya ….", "options": ["(−3, 3)", "(3, −3)", "(−3, −3)", "(3, 3)", "(4, −3)"], "key": [0], "kind": "pg", "why": "Rotasi 90° berlawanan arah jarum jam: (x,y)→(−y,x), jadi (3,3)→(−3,3).", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G07", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-102", "cat": 2, "sub": "Transformasi titik", "level": 3, "stem": "Titik (3, 1) ditranslasikan (2, −3), lalu didilatasikan berpusat O dengan faktor 2. Koordinat akhirnya ….", "options": ["(8, −1)", "(7, −5)", "(10, 4)", "(6, −4)", "(10, −4)"], "key": [4], "kind": "pg", "why": "Sesudah translasi: (5,−2). Dilatasi berpusat O mengalikan kedua koordinat dengan 2, menghasilkan (10,−4).", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G08", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-103", "cat": 2, "sub": "Luas dan keliling", "level": 2, "stem": "Taman berbentuk persegi panjang 12 m × 9 m. Jalan selebar 1 m dibuat di sekeliling bagian dalam taman. Luas bagian taman yang tidak menjadi jalan … m².", "options": ["88", "39", "106", "70", "108"], "key": [3], "kind": "pg", "why": "Jalan berada di dalam pada kedua sisi. Ukuran sisa = (12−2) × (9−2), sehingga luas = 70 m².", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G09", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-104", "cat": 2, "sub": "Luas dan keliling", "level": 2, "stem": "Sebuah lingkaran berjari-jari 21 cm memiliki juring 90°. Luas juring tersebut … cm². Gunakan π=22/7.", "options": ["66", "441", "693/2", "693", "1386"], "key": [2], "kind": "pg", "why": "Luas juring=(90/360)×πr²=¼×22/7×(21)²=693/2 cm².", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G10", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-105", "cat": 2, "sub": "Volume dan luas permukaan", "level": 2, "stem": "Tabung tertutup berjari-jari 7 cm dan tinggi 3 cm. Luas permukaannya … cm². Gunakan π=22/7.", "options": ["748", "440", "132", "308", "462"], "key": [1], "kind": "pg", "why": "Luas dua alas dan selimut: 2πr²+2πrt=2×22/7×7×(7+3)=440 cm².", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G11", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-106", "cat": 2, "sub": "Volume dan luas permukaan", "level": 2, "stem": "Kerucut berjari-jari 9 cm dan tinggi 12 cm memiliki volume … π cm³.", "options": ["324", "972", "81", "108", "648"], "key": [0], "kind": "pg", "why": "V=⅓πr²t=⅓π×(9)²×12=324π cm³.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G12", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-107", "cat": 2, "sub": "Pythagoras dan jarak", "level": 3, "stem": "Pada kubus ABCD.EFGH dengan rusuk 3 cm, E tepat di atas A. Jarak titik E ke garis AC adalah … cm.", "options": ["3√2", "3√3", "3/2", "3√2/2", "3"], "key": [4], "kind": "pg", "why": "AE tegak lurus bidang ABCD, sehingga AE juga tegak lurus garis AC melalui A. Kaki proyeksi E pada AC adalah A. Jadi jarak E ke AC=EA=3 cm.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G13", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-108", "cat": 2, "sub": "Pythagoras dan jarak", "level": 3, "stem": "Kubus ABCD.EFGH memiliki rusuk 6 cm. Jarak titik A ke bidang BCGF adalah … cm.", "options": ["6√3", "3", "9", "6", "6√2"], "key": [3], "kind": "pg", "why": "Bidang BCGF adalah sisi tegak melalui BC. AB tegak lurus bidang tersebut dan B adalah kaki proyeksi. Jadi jaraknya AB=6 cm.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G14", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-109", "cat": 2, "sub": "Kesebangunan", "level": 3, "stem": "Sebuah model persegi bersisi 3 cm diperbesar dengan faktor skala 3.", "options": ["Sisi hasil pembesaran 9 cm.", "Luas hasil pembesaran 3 kali luas awal.", "Keliling hasil pembesaran 3 kali keliling awal."], "key": [true, false, true], "kind": "bs", "why": "Panjang dan keliling dikalikan 3. Luas dikalikan 3²=9: luas awal 9 cm² menjadi 81 cm².", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G15", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-110", "cat": 2, "sub": "Luas dan keliling", "level": 3, "stem": "Sebuah persegi panjang mempunyai keliling 36 cm. (1) Panjangnya 12 cm. (2) Lebarnya 6 cm. Untuk menentukan luasnya, informasi mana yang cukup?", "options": ["Keduanya tetap tidak cukup.", "Masing-masing pernyataan cukup.", "Hanya (1) cukup.", "Hanya (2) cukup.", "Harus memakai (1) dan (2) bersama."], "key": [1], "kind": "pg", "why": "Dari keliling diperoleh p+l=18. (1) memberi l=6; (2) memberi p=12. Masing-masing cukup untuk menghitung luas 72 cm².", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G16", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-111", "cat": 3, "sub": "Rasio trigonometri", "level": 1, "stem": "Segitiga siku-siku memiliki sisi depan sudut θ sepanjang 9 cm dan sisi miring 15 cm. Nilai sin θ adalah ….", "options": ["3/5", "4/5", "3/4", "5/3", "4/3"], "key": [0], "kind": "pg", "why": "sin θ=depan/miring=9/15=3/5.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T01", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-112", "cat": 3, "sub": "Rasio trigonometri", "level": 2, "stem": "Pada segitiga siku-siku, sisi depan sudut θ=15 dan sisi sampingnya=36. Nilai sec θ adalah ….", "options": ["12/13", "5/13", "13/5", "12/5", "13/12"], "key": [4], "kind": "pg", "why": "Sisi miring = √[(15)²+(36)²]=39. sec θ=1/cos θ=miring/samping=13/12.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T02", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-113", "cat": 3, "sub": "Sudut istimewa", "level": 2, "stem": "Nilai 3 sin 30° + 2 cos 60° adalah ….", "options": ["5", "7/2", "4", "5/2", "3/2"], "key": [3], "kind": "pg", "why": "sin 30°=cos 60°=½. Hasil=3×½+2×½=5/2.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T03", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-114", "cat": 3, "sub": "Sudut dan kuadran", "level": 2, "stem": "Diketahui sin A=9/15 dan A sudut tumpul. Nilai cos A adalah ….", "options": ["-3/5", "-5/4", "-4/5", "4/5", "3/5"], "key": [2], "kind": "pg", "why": "sin A=3/5. Dari sin²A+cos²A=1 diperoleh |cos A|=4/5. Sudut tumpul berada di kuadran II, sehingga cos A negatif.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T04", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-115", "cat": 3, "sub": "Aplikasi trigonometri", "level": 2, "stem": "Tangga sepanjang 6 m bersandar pada tembok dan membentuk sudut 60° terhadap lantai. Tinggi ujung tangga dari lantai adalah … m.", "options": ["6", "3√3", "3", "6√3", "3√2"], "key": [1], "kind": "pg", "why": "Tinggi adalah sisi depan sudut 60°. h=L sin 60°=6×√3/2=3√3 m.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T05", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-116", "cat": 3, "sub": "Aplikasi trigonometri", "level": 2, "stem": "Pengamat berada 30 m dari kaki menara di tanah datar. Sudut elevasi ke puncak 45°. Jika tinggi mata 1,5 m, tinggi menara adalah … m.", "options": ["31,5", "30", "28,5", "60", "16,5"], "key": [0], "kind": "pg", "why": "Selisih tinggi puncak dan mata = jarak × tan45°=30. Tinggi menara=30+1,5=31,5 m.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T06", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-117", "cat": 3, "sub": "Rasio trigonometri", "level": 2, "stem": "Untuk sudut lancip θ dengan tan θ=9/12, pilih semua pernyataan yang benar.", "options": ["sin θ = 3/5", "cos θ = 4/5", "cot θ = 3/4", "csc θ = 5/3", "sec θ = 4/5"], "key": [0, 1, 3], "kind": "multi", "why": "Gunakan segitiga sebanding 3–4–5. sin=3/5, cos=4/5, cot=4/3, csc=5/3, dan sec=5/4.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T07", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-118", "cat": 3, "sub": "Aplikasi trigonometri", "level": 3, "stem": "Dua titik pengamatan segaris dengan kaki menara. Titik dekat berjarak 3√3 m dari kaki menara dan sudut elevasinya 60°. Dari titik jauh sudut elevasinya 30°. Jarak kedua titik pengamatan adalah … m.", "options": ["9√3", "12√3", "9", "6√3", "3√3"], "key": [3], "kind": "pg", "why": "Tinggi menara=3√3×tan60°=9. Jarak titik jauh=9/tan30°=9√3. Selisih jarak=(9−3)√3=6√3.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T08", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-119", "cat": 4, "sub": "Data tunggal", "level": 1, "stem": "Rata-rata data 4, 6, 8, 10, 12 adalah ….", "options": ["10", "19", "8", "9", "7"], "key": [2], "kind": "pg", "why": "Jumlah data=40, banyak data=5. Rata-rata=40/5=8.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D01", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-120", "cat": 4, "sub": "Data tunggal", "level": 1, "stem": "Median data 3, 10, 5, 8, 4, 6 adalah ….", "options": ["7", "5,5", "5", "6", "6,5"], "key": [1], "kind": "pg", "why": "Urutkan: 3, 4, 5, 6, 8, 10. Median rata-rata data ke-3 dan ke-4: (5+6)/2=5,5.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D02", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-121", "cat": 4, "sub": "Data tunggal", "level": 2, "stem": "Data 3, 5, 7 dianggap sebagai seluruh populasi. Varians populasinya adalah ….", "options": ["8/3", "4/3", "4", "8", "2/3"], "key": [0], "kind": "pg", "why": "Rata-rata=5. Kuadrat simpangan: 4,0,4. Varians populasi=(4+0+4)/3=8/3.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D03", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-122", "cat": 4, "sub": "Data tunggal", "level": 2, "stem": "Rata-rata 10 siswa adalah 73; rata-rata 5 siswa lainnya 83. Rata-rata gabungan 15 siswa adalah ….", "options": ["78", "73", "83", "232/3", "229/3"], "key": [4], "kind": "pg", "why": "Jumlah nilai=10×73+5×83=1145. Bagi 15, diperoleh 229/3.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D04", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-123", "cat": 4, "sub": "Penyajian data", "level": 2, "stem": "Diagram menunjukkan jumlah pengunjung perpustakaan. Kenaikan terbesar dibanding hari sebelumnya terjadi pada ….", "options": ["Selasa", "Rabu", "Jumat", "Kamis", "Senin"], "key": [3], "kind": "pg", "why": "Perubahan harian: Selasa +6, Rabu −3, Kamis +18, Jumat +9. Kenaikan terbesar pada Kamis, bukan hari dengan jumlah pengunjung tertinggi.", "visual": "<svg viewBox=\"0 0 500 200\" role=\"img\" aria-label=\"Diagram jumlah pengunjung per hari\"><rect x=\"25\" y=\"83.33333333333334\" width=\"48\" height=\"76.66666666666666\" rx=\"6\" fill=\"#7870e8\"/><text x=\"49\" y=\"72.33333333333334\" text-anchor=\"middle\" fill=\"currentColor\">60</text><text x=\"49\" y=\"184\" text-anchor=\"middle\" fill=\"currentColor\">Sen</text><rect x=\"120\" y=\"75.66666666666667\" width=\"48\" height=\"84.33333333333333\" rx=\"6\" fill=\"#7870e8\"/><text x=\"144\" y=\"64.66666666666667\" text-anchor=\"middle\" fill=\"currentColor\">66</text><text x=\"144\" y=\"184\" text-anchor=\"middle\" fill=\"currentColor\">Sel</text><rect x=\"215\" y=\"79.5\" width=\"48\" height=\"80.5\" rx=\"6\" fill=\"#7870e8\"/><text x=\"239\" y=\"68.5\" text-anchor=\"middle\" fill=\"currentColor\">63</text><text x=\"239\" y=\"184\" text-anchor=\"middle\" fill=\"currentColor\">Rab</text><rect x=\"310\" y=\"56.5\" width=\"48\" height=\"103.5\" rx=\"6\" fill=\"#7870e8\"/><text x=\"334\" y=\"45.5\" text-anchor=\"middle\" fill=\"currentColor\">81</text><text x=\"334\" y=\"184\" text-anchor=\"middle\" fill=\"currentColor\">Kam</text><rect x=\"405\" y=\"45.0\" width=\"48\" height=\"115.0\" rx=\"6\" fill=\"#7870e8\"/><text x=\"429\" y=\"34.0\" text-anchor=\"middle\" fill=\"currentColor\">90</text><text x=\"429\" y=\"184\" text-anchor=\"middle\" fill=\"currentColor\">Jum</text></svg>", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D05", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-124", "cat": 4, "sub": "Penyajian data", "level": 2, "stem": "Diagram lingkaran menunjukkan 120 peserta memilih kegiatan. Sektor olahraga bersudut 90°. Banyak peserta yang memilih olahraga adalah ….", "options": ["32", "63", "30", "31", "29"], "key": [2], "kind": "pg", "why": "Bagian olahraga=90/360=¼. Jumlah peserta=¼×120=30.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D06", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-125", "cat": 4, "sub": "Data kelompok", "level": 2, "stem": "Tentukan perkiraan rata-rata dari tabel frekuensi berikut.", "options": ["107", "52", "53", "51", "54"], "key": [1], "kind": "pg", "why": "Titik tengah kelas: 47, 52, 57. Rata-rata=[2×47+6×52+2×57]/10=52.", "visual": "<div class=\"table-wrap\"><table><thead><tr><th>Nilai</th><th>Frekuensi</th></tr></thead><tbody><tr><td>45–49</td><td>2</td></tr><tr><td>50–54</td><td>6</td></tr><tr><td>55–59</td><td>2</td></tr></tbody></table></div>", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D07", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-126", "cat": 4, "sub": "Data kelompok", "level": 2, "stem": "Modus data berkelompok berikut, menggunakan interpolasi kelas, adalah ….", "options": ["64,5", "59,5", "60", "65", "69,5"], "key": [0], "kind": "pg", "why": "Kelas modus 60–69; tepi bawah 59.5; lebar kelas 10. d₁=8−4=4 dan d₂=8−4=4. Mo=59.5+[4/(4+4)]×10=64.5.", "visual": "<div class=\"table-wrap\"><table><thead><tr><th>Nilai</th><th>Frekuensi</th></tr></thead><tbody><tr><td>50–59</td><td>4</td></tr><tr><td>60–69</td><td>8</td></tr><tr><td>70–79</td><td>4</td></tr></tbody></table></div>", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D08", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-127", "cat": 4, "sub": "Aturan pencacahan", "level": 1, "stem": "Sebuah kantin menyediakan 5 jenis makanan dan 3 jenis minuman. Satu paket terdiri dari satu makanan dan satu minuman. Banyak paket berbeda adalah ….", "options": ["8", "9", "25", "17", "15"], "key": [4], "kind": "pg", "why": "Gunakan aturan perkalian: 5 pilihan makanan × 3 pilihan minuman = 15 paket.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D09", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-128", "cat": 4, "sub": "Aturan pencacahan", "level": 2, "stem": "Dari 7 siswa dipilih ketua dan sekretaris. Satu siswa tidak boleh memegang dua jabatan. Banyak susunan pengurus adalah ….", "options": ["49", "7", "14", "42", "21"], "key": [3], "kind": "pg", "why": "Jabatan berbeda sehingga urutan penting. Ketua punya 7 pilihan; sekretaris 6. Total=42.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D10", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-129", "cat": 4, "sub": "Aturan pencacahan", "level": 2, "stem": "Dari 8 anggota klub, dipilih 2 orang sebagai delegasi tanpa jabatan berbeda. Banyak pilihan delegasi adalah ….", "options": ["8", "16", "28", "56", "64"], "key": [2], "kind": "pg", "why": "Urutan tidak penting. C(8,2)=(8×7)/2=28.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D11", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-130", "cat": 4, "sub": "Peluang majemuk", "level": 2, "stem": "Kotak berisi 3 bola merah dan 5 bola biru. Dua bola diambil berurutan tanpa pengembalian. Peluang bola pertama merah dan kedua biru adalah ….", "options": ["1/2", "15/56", "15/64", "3/8", "5/8"], "key": [1], "kind": "pg", "why": "P(merah pertama)=3/8. Setelah merah terambil, tersisa 7 bola dan 5 di antaranya biru. Kalikan: 3/8 × 5/7 = 15/56.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D12", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-131", "cat": 4, "sub": "Peluang majemuk", "level": 2, "stem": "Peluang seorang atlet mengenai sasaran pada tiap tembakan adalah 3/10. Dua tembakan saling independen. Peluang keduanya mengenai sasaran adalah ….", "options": ["9/100", "3/10", "3/5", "91/100", "9/200"], "key": [0], "kind": "pg", "why": "Karena independen, P(keduanya kena)=(3/10)×(3/10)=9/100.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D13", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-132", "cat": 4, "sub": "Data tunggal", "level": 3, "stem": "Seluruh nilai data 3, 5, 7, 9 ditambah 5. Pilih semua pernyataan yang benar.", "options": ["Rata-rata bertambah 5.", "Median bertambah 5.", "Jangkauan bertambah 5.", "Simpangan baku tetap.", "Varians bertambah 25."], "key": [0, 1, 3], "kind": "multi", "why": "Penambahan konstanta menggeser pusat data: mean dan median naik 5. Selisih antarnilai tidak berubah; jangkauan, varians, dan simpangan baku tetap.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D14", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-133", "cat": 0, "sub": "Operasi bilangan", "level": 1, "stem": "Nilai 4 + 7 × 4 − 6 adalah ….", "options": ["25", "28", "55", "26", "27"], "key": [3], "kind": "pg", "why": "Kerjakan perkalian dahulu: 7 × 4 = 28. Lalu 4 + 28 − 6 = 26.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B01", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-134", "cat": 0, "sub": "Operasi bilangan", "level": 1, "stem": "Hasil 4/3 + 1/2 adalah ….", "options": ["17/6", "23/6", "11/6", "2", "5/3"], "key": [2], "kind": "pg", "why": "Samakan penyebut menjadi 6: 8/6 + 3/6 = 11/6.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B02", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-135", "cat": 0, "sub": "Pangkat dan akar", "level": 1, "stem": "Bentuk sederhana 2^7 ÷ 2^4 adalah ….", "options": ["32", "8", "2", "4", "16"], "key": [1], "kind": "pg", "why": "Untuk basis sama, kurangi pangkat: 2^(7 − 4) = 2³ = 8.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B03", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-136", "cat": 0, "sub": "Pangkat dan akar", "level": 2, "stem": "Nilai (64)^(2/3) adalah ….", "options": ["16", "4", "64", "17", "18"], "key": [0], "kind": "pg", "why": "Akar pangkat tiga dari 64 adalah 4; kuadratkan hasilnya: 4² = 16.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B04", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-137", "cat": 0, "sub": "Pangkat dan akar", "level": 2, "stem": "Bentuk paling sederhana √128 + √288 adalah ….", "options": ["4√2", "20√5", "24√2", "20√3", "20√2"], "key": [4], "kind": "pg", "why": "√128 = 8√2 dan √288 = 12√2. Jumlahnya 20√2.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B05", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-138", "cat": 0, "sub": "Persen dan perbandingan", "level": 2, "stem": "Sebuah tas berharga Rp400.000. Diskon 20% dilanjutkan diskon 10% dari harga setelah diskon pertama. Harga akhir (rupiah) adalah ….", "options": ["320000", "360000", "240000", "288000", "280000"], "key": [3], "kind": "pg", "why": "Harga setelah diskon pertama = 0,8 × 400000 = 320000. Diskon kedua diterapkan pada harga ini: 0,9 × 320000 = 288000.", "visual": "", "tip": "Diskon berurutan dikalikan, bukan dijumlahkan.", "pattern": "B06", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-139", "cat": 0, "sub": "Persen dan perbandingan", "level": 2, "stem": "Dalam campuran sirup dan air, perbandingan volumenya 2 : 5. Jika volume campuran 28 liter, banyak sirup adalah … liter.", "options": ["10", "19", "8", "9", "7"], "key": [2], "kind": "pg", "why": "Jumlah bagian = 2 + 5 = 7. Satu bagian = 28/7 = 4 liter. Sirup = 2 × 4 = 8 liter.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B07", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-140", "cat": 0, "sub": "Sifat bilangan", "level": 2, "stem": "Untuk a = 4 dan b = 5, tentukan benar atau salah.", "options": ["a + b = b + a", "a ÷ b = b ÷ a", "a(b + 2) = ab + 2a"], "key": [true, false, true], "kind": "bs", "why": "Penjumlahan komutatif. Pembagian tidak komutatif karena 4/5 ≠ 5/4. Perkalian distributif: a(b+2)=ab+2a.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B08", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-141", "cat": 0, "sub": "Sifat bilangan", "level": 1, "stem": "Pilih semua bilangan rasional berikut.", "options": ["√16", "√17", "4/7", "0,125", "π"], "key": [0, 2, 3], "kind": "multi", "why": "√16 = 4, 4/7, dan 0,125 = 1/8 adalah rasional. 17 bukan kuadrat sempurna; akarnya irasional. π juga irasional.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B09", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-142", "cat": 0, "sub": "Persen dan perbandingan", "level": 3, "stem": "Harga suatu barang naik 25% menjadi Rp500000. Agar kembali ke harga semula Rp400000, harga baru perlu diturunkan sebesar …%.", "options": ["15", "25", "30", "40", "20"], "key": [4], "kind": "pg", "why": "Penurunan = 100000. Persentase dihitung terhadap harga baru: 100000/500000 × 100% = 20%.", "visual": "", "tip": "Tentukan nilai dasar yang dipakai menghitung persen.", "pattern": "B10", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-143", "cat": 1, "sub": "Persamaan linear", "level": 2, "stem": "Dua roti dan tiga susu berharga Rp19000. Satu roti dan satu susu berharga Rp8000. Harga satu roti adalah … rupiah.", "options": ["6000", "7000", "4500", "5000", "3000"], "key": [3], "kind": "pg", "why": "Misalkan harga roti r dan susu s. Dari r+s=8000, diperoleh 2r+2s=16000. Kurangkan dari 2r+3s=19000: s=3000. Maka r=8000−3000=5000.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A01", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-144", "cat": 1, "sub": "Persamaan linear", "level": 2, "stem": "Diketahui x+y+z=15, x−y=1, dan z=6. Nilai x adalah ….", "options": ["7", "13", "5", "6", "4"], "key": [2], "kind": "pg", "why": "Substitusi z=6: x+y=9. Jumlahkan dengan x−y=1 sehingga 2x=10 dan x=5.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A02", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-145", "cat": 1, "sub": "Pertidaksamaan linear", "level": 1, "stem": "Himpunan penyelesaian −2x + 8 > 4 adalah ….", "options": ["x < 6", "x < 2", "x > 2", "x ≤ 2", "x ≥ 2"], "key": [1], "kind": "pg", "why": "−2x > -4. Pembagian oleh −2 membalik tanda pertidaksamaan sehingga x < 2.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A03", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-146", "cat": 1, "sub": "Pertidaksamaan linear", "level": 2, "stem": "Pilih semua titik yang memenuhi x ≥ 0, y ≥ 0, dan x+y ≤ 8.", "options": ["(4, 4)", "(0, 8)", "(8, 1)", "(−1, 4)", "(3, 4)"], "key": [0, 1, 4], "kind": "multi", "why": "Uji tiap koordinat. Jumlah x+y berturut-turut 8, 8, 9, 3, dan 7. Pilihan keempat gagal karena x negatif; pilihan ketiga melampaui batas.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A04", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-147", "cat": 1, "sub": "Program linear", "level": 3, "stem": "Usaha kerajinan membuat x paket A dan y paket B. Batasnya x+y ≤ 40, 2x+y ≤ 56, x,y ≥ 0. Laba A Rp3.000 dan B Rp2.000 per paket. Laba maksimum adalah … rupiah.", "options": ["84000", "80000", "120000", "112000", "96000"], "key": [4], "kind": "pg", "why": "Titi
