 dan jarak", "level": 1, "stem": "Segitiga siku-siku memiliki kaki 18 cm dan 24 cm. Sisi miringnya … cm.", "options": ["48", "30", "42", "36", "24"], "key": [1], "kind": "pg", "why": "c=√[(18)²+(24)²]=√900=30 cm.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G03", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-296", "cat": 2, "sub": "Pythagoras dan jarak", "level": 2, "stem": "Balok memiliki panjang 18, lebar 24, dan tinggi 72 cm. Panjang diagonal ruangnya … cm.", "options": ["78", "30", "72", "90", "114"], "key": [0], "kind": "pg", "why": "Diagonal ruang d=√(p²+l²+t²)=√6084=78. Diagonal alasnya saja adalah 30.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G04", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-297", "cat": 2, "sub": "Transformasi titik", "level": 1, "stem": "Titik P(6, −3) ditranslasikan oleh vektor (4, 5). Bayangan P adalah ….", "options": ["(2, 2)", "(10, −8)", "(6, 2)", "(4, 11)", "(10, 2)"], "key": [4], "kind": "pg", "why": "Tambahkan tiap komponen: x′=6+4=10; y′=−3+5=2.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G05", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-298", "cat": 2, "sub": "Transformasi titik", "level": 1, "stem": "Bayangan titik A(6, −5) oleh refleksi terhadap garis y=x adalah ….", "options": ["(6, −5)", "(−6, −5)", "(7, 5)", "(−5, 6)", "(6, 5)"], "key": [3], "kind": "pg", "why": "Refleksi terhadap y=x menukar koordinat: (x,y)→(y,x). Maka (6,−5)→(−5,6).", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G06", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-299", "cat": 2, "sub": "Transformasi titik", "level": 2, "stem": "Titik (6, 3) diputar 90° berlawanan arah jarum jam terhadap O(0,0). Hasilnya ….", "options": ["(3, 6)", "(7, −3)", "(−3, 6)", "(3, −6)", "(−6, −3)"], "key": [2], "kind": "pg", "why": "Rotasi 90° berlawanan arah jarum jam: (x,y)→(−y,x), jadi (6,3)→(−3,6).", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G07", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-300", "cat": 2, "sub": "Transformasi titik", "level": 3, "stem": "Titik (6, 1) ditranslasikan (2, −3), lalu didilatasikan berpusat O dengan faktor 2. Koordinat akhirnya ….", "options": ["(12, −4)", "(16, −4)", "(14, −1)", "(10, −5)", "(16, 4)"], "key": [1], "kind": "pg", "why": "Sesudah translasi: (8,−2). Dilatasi berpusat O mengalikan kedua koordinat dengan 2, menghasilkan (16,−4).", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G08", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-301", "cat": 2, "sub": "Luas dan keliling", "level": 2, "stem": "Taman berbentuk persegi panjang 24 m × 18 m. Jalan selebar 1 m dibuat di sekeliling bagian dalam taman. Luas bagian taman yang tidak menjadi jalan … m².", "options": ["352", "432", "391", "81", "430"], "key": [0], "kind": "pg", "why": "Jalan berada di dalam pada kedua sisi. Ukuran sisa = (24−2) × (18−2), sehingga luas = 352 m².", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G09", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-302", "cat": 2, "sub": "Luas dan keliling", "level": 2, "stem": "Sebuah lingkaran berjari-jari 42 cm memiliki juring 90°. Luas juring tersebut … cm². Gunakan π=22/7.", "options": ["2772", "5544", "132", "1764", "1386"], "key": [4], "kind": "pg", "why": "Luas juring=(90/360)×πr²=¼×22/7×(42)²=1386 cm².", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G10", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-303", "cat": 2, "sub": "Volume dan luas permukaan", "level": 2, "stem": "Tabung tertutup berjari-jari 7 cm dan tinggi 6 cm. Luas permukaannya … cm². Gunakan π=22/7.", "options": ["308", "924", "880", "572", "264"], "key": [3], "kind": "pg", "why": "Luas dua alas dan selimut: 2πr²+2πrt=2×22/7×7×(7+6)=572 cm².", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G11", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-304", "cat": 2, "sub": "Volume dan luas permukaan", "level": 2, "stem": "Kerucut berjari-jari 18 cm dan tinggi 24 cm memiliki volume … π cm³.", "options": ["864", "5184", "2592", "7776", "324"], "key": [2], "kind": "pg", "why": "V=⅓πr²t=⅓π×(18)²×24=2592π cm³.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G12", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-305", "cat": 2, "sub": "Pythagoras dan jarak", "level": 3, "stem": "Pada kubus ABCD.EFGH dengan rusuk 6 cm, E tepat di atas A. Jarak titik E ke garis AC adalah … cm.", "options": ["6√2/2", "6", "6√2", "6√3", "6/2"], "key": [1], "kind": "pg", "why": "AE tegak lurus bidang ABCD, sehingga AE juga tegak lurus garis AC melalui A. Kaki proyeksi E pada AC adalah A. Jadi jarak E ke AC=EA=6 cm.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G13", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-306", "cat": 2, "sub": "Pythagoras dan jarak", "level": 3, "stem": "Kubus ABCD.EFGH memiliki rusuk 12 cm. Jarak titik A ke bidang BCGF adalah … cm.", "options": ["12", "12√2", "12√3", "6", "18"], "key": [0], "kind": "pg", "why": "Bidang BCGF adalah sisi tegak melalui BC. AB tegak lurus bidang tersebut dan B adalah kaki proyeksi. Jadi jaraknya AB=12 cm.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G14", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-307", "cat": 2, "sub": "Kesebangunan", "level": 3, "stem": "Sebuah model persegi bersisi 6 cm diperbesar dengan faktor skala 3.", "options": ["Sisi hasil pembesaran 18 cm.", "Luas hasil pembesaran 3 kali luas awal.", "Keliling hasil pembesaran 3 kali keliling awal."], "key": [true, false, true], "kind": "bs", "why": "Panjang dan keliling dikalikan 3. Luas dikalikan 3²=9: luas awal 36 cm² menjadi 324 cm².", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G15", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-308", "cat": 2, "sub": "Luas dan keliling", "level": 3, "stem": "Sebuah persegi panjang mempunyai keliling 72 cm. (1) Panjangnya 24 cm. (2) Lebarnya 12 cm. Untuk menentukan luasnya, informasi mana yang cukup?", "options": ["Hanya (2) cukup.", "Harus memakai (1) dan (2) bersama.", "Keduanya tetap tidak cukup.", "Masing-masing pernyataan cukup.", "Hanya (1) cukup."], "key": [3], "kind": "pg", "why": "Dari keliling diperoleh p+l=36. (1) memberi l=12; (2) memberi p=24. Masing-masing cukup untuk menghitung luas 288 cm².", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G16", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-309", "cat": 3, "sub": "Rasio trigonometri", "level": 1, "stem": "Segitiga siku-siku memiliki sisi depan sudut θ sepanjang 18 cm dan sisi miring 30 cm. Nilai sin θ adalah ….", "options": ["5/3", "4/3", "3/5", "4/5", "3/4"], "key": [2], "kind": "pg", "why": "sin θ=depan/miring=18/30=3/5.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T01", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-310", "cat": 3, "sub": "Rasio trigonometri", "level": 2, "stem": "Pada segitiga siku-siku, sisi depan sudut θ=30 dan sisi sampingnya=72. Nilai sec θ adalah ….", "options": ["12/5", "13/12", "12/13", "5/13", "13/5"], "key": [1], "kind": "pg", "why": "Sisi miring = √[(30)²+(72)²]=78. sec θ=1/cos θ=miring/samping=13/12.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T02", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-311", "cat": 3, "sub": "Sudut istimewa", "level": 2, "stem": "Nilai 6 sin 30° + 2 cos 60° adalah ….", "options": ["4", "3", "8", "5", "7"], "key": [0], "kind": "pg", "why": "sin 30°=cos 60°=½. Hasil=6×½+2×½=4.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T03", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-312", "cat": 3, "sub": "Sudut dan kuadran", "level": 2, "stem": "Diketahui sin A=18/30 dan A sudut tumpul. Nilai cos A adalah ….", "options": ["4/5", "3/5", "-3/5", "-5/4", "-4/5"], "key": [4], "kind": "pg", "why": "sin A=3/5. Dari sin²A+cos²A=1 diperoleh |cos A|=4/5. Sudut tumpul berada di kuadran II, sehingga cos A negatif.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T04", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-313", "cat": 3, "sub": "Aplikasi trigonometri", "level": 2, "stem": "Tangga sepanjang 12 m bersandar pada tembok dan membentuk sudut 60° terhadap lantai. Tinggi ujung tangga dari lantai adalah … m.", "options": ["12√3", "6√2", "12", "6√3", "6"], "key": [3], "kind": "pg", "why": "Tinggi adalah sisi depan sudut 60°. h=L sin 60°=12×√3/2=6√3 m.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T05", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-314", "cat": 3, "sub": "Aplikasi trigonometri", "level": 2, "stem": "Pengamat berada 60 m dari kaki menara di tanah datar. Sudut elevasi ke puncak 45°. Jika tinggi mata 1,5 m, tinggi menara adalah … m.", "options": ["120", "31,5", "61,5", "60", "58,5"], "key": [2], "kind": "pg", "why": "Selisih tinggi puncak dan mata = jarak × tan45°=60. Tinggi menara=60+1,5=61,5 m.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T06", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-315", "cat": 3, "sub": "Rasio trigonometri", "level": 2, "stem": "Untuk sudut lancip θ dengan tan θ=18/24, pilih semua pernyataan yang benar.", "options": ["sin θ = 3/5", "cos θ = 4/5", "cot θ = 3/4", "csc θ = 5/3", "sec θ = 4/5"], "key": [0, 1, 3], "kind": "multi", "why": "Gunakan segitiga sebanding 3–4–5. sin=3/5, cos=4/5, cot=4/3, csc=5/3, dan sec=5/4.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T07", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-316", "cat": 3, "sub": "Aplikasi trigonometri", "level": 3, "stem": "Dua titik pengamatan segaris dengan kaki menara. Titik dekat berjarak 6√3 m dari kaki menara dan sudut elevasinya 60°. Dari titik jauh sudut elevasinya 30°. Jarak kedua titik pengamatan adalah … m.", "options": ["12√3", "6√3", "18√3", "24√3", "18"], "key": [0], "kind": "pg", "why": "Tinggi menara=6√3×tan60°=18. Jarak titik jauh=18/tan30°=18√3. Selisih jarak=(18−6)√3=12√3.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T08", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-317", "cat": 4, "sub": "Data tunggal", "level": 1, "stem": "Rata-rata data 7, 9, 11, 13, 15 adalah ….", "options": ["12", "10", "13", "25", "11"], "key": [4], "kind": "pg", "why": "Jumlah data=55, banyak data=5. Rata-rata=55/5=11.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D01", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-318", "cat": 4, "sub": "Data tunggal", "level": 1, "stem": "Median data 6, 13, 8, 11, 7, 9 adalah ….", "options": ["9", "9,5", "10", "8,5", "8"], "key": [3], "kind": "pg", "why": "Urutkan: 6, 7, 8, 9, 11, 13. Median rata-rata data ke-3 dan ke-4: (8+9)/2=8,5.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D02", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-319", "cat": 4, "sub": "Data tunggal", "level": 2, "stem": "Data 6, 8, 10 dianggap sebagai seluruh populasi. Varians populasinya adalah ….", "options": ["8", "2/3", "8/3", "4/3", "4"], "key": [2], "kind": "pg", "why": "Rata-rata=8. Kuadrat simpangan: 4,0,4. Varians populasi=(4+0+4)/3=8/3.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D03", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-320", "cat": 4, "sub": "Data tunggal", "level": 2, "stem": "Rata-rata 10 siswa adalah 76; rata-rata 5 siswa lainnya 86. Rata-rata gabungan 15 siswa adalah ….", "options": ["241/3", "238/3", "81", "76", "86"], "key": [1], "kind": "pg", "why": "Jumlah nilai=10×76+5×86=1190. Bagi 15, diperoleh 238/3.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D04", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-321", "cat": 4, "sub": "Penyajian data", "level": 2, "stem": "Diagram menunjukkan jumlah pengunjung perpustakaan. Kenaikan terbesar dibanding hari sebelumnya terjadi pada ….", "options": ["Kamis", "Senin", "Selasa", "Rabu", "Jumat"], "key": [0], "kind": "pg", "why": "Perubahan harian: Selasa +12, Rabu −6, Kamis +36, Jumat +18. Kenaikan terbesar pada Kamis, bukan hari dengan jumlah pengunjung tertinggi.", "visual": "<svg viewBox=\"0 0 500 200\" role=\"img\" aria-label=\"Diagram jumlah pengunjung per hari\"><rect x=\"25\" y=\"83.33333333333334\" width=\" uan serta syarat pada soal.", "pattern": "D13", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-330", "cat": 4, "sub": "Data tunggal", "level": 3, "stem": "Seluruh nilai data 6, 8, 10, 12 ditambah 5. Pilih semua pernyataan yang benar.", "options": ["Rata-rata bertambah 5.", "Median bertambah 5.", "Jangkauan bertambah 5.", "Simpangan baku tetap.", "Varians bertambah 25."], "key": [0, 1, 3], "kind": "multi", "why": "Penambahan konstanta menggeser pusat data: mean dan median naik 5. Selisih antarnilai tidak berubah; jangkauan, varians, dan simpangan baku tetap.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D14", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-331", "cat": 1, "sub": "Pertumbuhan dan bunga", "level": 2, "stem": "Nilai mesin awal Rp2000000 menyusut 20% setiap tahun dari nilai tahun sebelumnya. Nilainya setelah 2 tahun adalah … rupiah.", "options": ["1280000", "1200000", "1600000", "800000", "1920000"], "key": [0], "kind": "pg", "why": "Faktor sisa tiap tahun adalah 1−0,2=0,8. Nilai setelah 2 tahun=2000000×0,8²=1280000.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A19", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-332", "cat": 1, "sub": "Invers dan komposisi", "level": 3, "stem": "Diberikan f(x)=(x+2)/(x−1), x≠1. Nilai f⁻¹(2) adalah ….", "options": ["5", "3", "6", "11", "4"], "key": [4], "kind": "pg", "why": "Misalkan y=(x+2)/(x−1). yx−y=x+2, sehingga x=(y+2)/(y−1). Substitusi y=2 menghasilkan x=4.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A20", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-333", "cat": 2, "sub": "Kesebangunan", "level": 2, "stem": "Segitiga ABC memiliki AB=6, BC=8, AC=10. Pilih data yang cukup untuk memastikan segitiga lain kongruen dengan ABC.", "opt
