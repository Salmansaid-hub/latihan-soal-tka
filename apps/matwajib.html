 adalah BC=6 cm.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G21", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-378", "cat": 2, "sub": "Volume dan luas permukaan", "level": 2, "stem": "Bola berjari-jari 18 cm memiliki volume … π cm³.", "options": ["2592", "1296", "23328", "7776", "5832"], "key": [3], "kind": "pg", "why": "V=4/3×πr³=4/3×π×(18)³=7776π cm³.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G22", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-379", "cat": 4, "sub": "Data kelompok", "level": 2, "stem": "Median data berkelompok berikut, dengan interpolasi kelas, adalah ….", "options": ["89,5", "79,5", "84,5", "80", "85"], "key": [2], "kind": "pg", "why": "Total frekuensi 20, sehingga N/2=10. Kelas median 80–89; tepi bawah=79.5; frekuensi sebelumnya=4; frekuensi kelas=12; lebar=10. Me=79.5+[(10−4)/12]×10=84.5.", "visual": "<div class=\"table-wrap\"><table><thead><tr><th>Nilai</th><th>Frekuensi</th></tr></thead><tbody><tr><td>70–79</td><td>4</td></tr><tr><td>80–89</td><td>12</td></tr><tr><td>90–99</td><td>4</td></tr></tbody></table></div>", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D15", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-380", "cat": 4, "sub": "Peluang majemuk", "level": 2, "stem": "Dari 60 siswa, 36 menyukai basket, 30 menyukai voli, dan 12 menyukai keduanya. Jika satu siswa dipilih acak, peluang ia menyukai basket atau voli adalah ….", "options": ["1/5", "9/10", "11/10", "3/5", "1/2"], "key": [1], "kind": "pg", "why": "Banyak anggota gabungan=36+30−12=54. Peluang=54/60=9/10. Irisan dikurangi agar tidak dihitung dua kali.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D16", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-381", "cat": 0, "sub": "Operasi bilangan", "level": 2, "stem": "Suatu wadah terisi 3/4 bagian. Sebanyak 2 liter dikeluarkan sehingga tersisa 1/2 bagian. Kapasitas wadah … liter.", "options": ["8", "9", "7", "10", "19"], "key": [0], "kind": "pg", "why": "Bagian yang dikeluarkan=3/4−1/2=1/4. Jadi seperempat kapasitas=2 liter, kapasitas total=8 liter.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B11", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-382", "cat": 0, "sub": "Persen dan perbandingan", "level": 3, "stem": "4 pekerja menyelesaikan proyek dalam 12 hari. Setelah 4 hari, 4 pekerja tambahan datang. Produktivitas sama dan pekerjaan dapat dibagi merata. Sisa waktu pengerjaan … hari.", "options": ["2", "6", "8", "12", "4"], "key": [4], "kind": "pg", "why": "Tersisa pekerjaan setara 8 hari bagi tim awal. Jumlah pekerja kini dua kali lipat, jadi sisa waktu 8/2=4 hari.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B12", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-383", "cat": 0, "sub": "Pangkat dan akar", "level": 2, "stem": "Sederhanakan 2/√2 dengan merasionalkan penyebut.", "options": ["√2/2", "2/2", "4√2", "2√2/2", "2√2"], "key": [3], "kind": "pg", "why": "Kalikan pembilang dan penyebut dengan √2: 2√2/(√2×√2)=2√2/2.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B13", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-384", "cat": 0, "sub": "Pangkat dan akar", "level": 2, "stem": "Jika 3^(x+1)=27, nilai x adalah ….", "options": ["4", "7", "2", "3", "1"], "key": [2], "kind": "pg", "why": "27=3^3. Basisnya sama dan 3≠1, maka x+1=3, sehingga x=2.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B14", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-385", "cat": 0, "sub": "Operasi bilangan", "level": 2, "stem": "Sebuah pita sepanjang 6 meter dipotong menjadi bagian sama panjang, masing-masing 3/4 meter. Panjang sisa pita setelah dibuat sebanyak mungkin potongan utuh adalah … meter.", "options": ["3/2", "0", "3/4", "1", "5/4"], "key": [1], "kind": "pg", "why": "Total pita=24 satuan seperempat meter. Tiap potongan memakai 3 satuan. Sisa pembagian 24 oleh 3 adalah 0, yaitu 0 meter.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B15", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-386", "cat": 0, "sub": "Sifat bilangan", "level": 3, "stem": "Untuk x=−2, nilai kebenaran pernyataan berikut adalah ….", "options": ["√(x²)=x", "|x|=−x", "x²>0"], "key": [false, true, true], "kind": "bs", "why": "Akar utama tidak negatif: √(x²)=2, berbeda dari x=−2. Nilai mutlak |x|=2=−x dan x²=4>0.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B16", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-387", "cat": 0, "sub": "Persen dan perbandingan", "level": 2, "stem": "Modal sebuah barang Rp160000. Penjual ingin laba 25% dari modal. Harga jualnya … rupiah.", "options": ["192000", "212000", "240000", "160000", "200000"], "key": [4], "kind": "pg", "why": "Laba=25%×160000=40000; harga jual=modal+laba=200000.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B17", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-388", "cat": 0, "sub": "Operasi bilangan", "level": 2, "stem": "Hasil (1/2) ÷ (2/3) adalah ….", "options": ["1/3", "3/2", "23/4", "3/4", "4/3"], "key": [3], "kind": "pg", "why": "Pembagian pecahan diubah menjadi perkalian dengan kebalikan: (1/2)×(3/2)=3/4.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B18", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-389", "cat": 0, "sub": "Persen dan perbandingan", "level": 3, "stem": "Larutan A sebanyak 2 liter mengandung 20% gula. Larutan B sebanyak 4 liter mengandung 50% gula. Kadar gula campuran …%. Anggap volume dijumlahkan.", "options": ["45", "70", "40", "30", "35"], "key": [2], "kind": "pg", "why": "Jumlah gula=0,2×2+0,5×4=2.4 liter ekuivalen. Volume=6. Kadarnya 1,2/3=0,4=40%.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B19", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-390", "cat": 0, "sub": "Pangkat dan akar", "level": 2, "stem": "Nilai (2^−2) × (2^5) adalah ….", "options": ["32", "8", "2", "4", "16"], "key": [1], "kind": "pg", "why": "Pangkat dijumlahkan: −2+5=3. Jadi hasilnya 2³=8.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B20", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-391", "cat": 1, "sub": "Persamaan linear", "level": 3, "stem": "Sebanyak 20 tiket terjual. Tiket dewasa Rp20.000 dan anak Rp10.000. Pendapatan Rp320000. Banyak tiket dewasa adalah ….", "options": ["12", "13", "11", "14", "27"], "key": [0], "kind": "pg", "why": "Andaikan semua tiket anak, pendapatan Rp200000. Kelebihan Rp120000 berasal dari selisih Rp10.000 per tiket dewasa. Jumlah dewasa=12.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A21", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-392", "cat": 1, "sub": "Fungsi kuadrat", "level": 3, "stem": "Sebuah persegi panjang mempunyai keliling 16 meter. Luas maksimumnya … m².", "options": ["17", "15", "18", "35", "16"], "key": [4], "kind": "pg", "why": "p+l=8. Luas p(8−p) mencapai maksimum saat p=l=4. Luas maksimal=4×4=16.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A22", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-393", "cat": 1, "sub": "Fungsi kuadrat", "level": 2, "stem": "Fungsi f(x)=x²−4x+-5 memotong sumbu x di x₁ dan x₂. Jumlah kedua akar adalah ….", "options": ["3", "6", "11", "4", "5"], "key": [3], "kind": "pg", "why": "Jumlah akar persamaan ax²+bx+c=0 adalah −b/a. Di sini −(−4)/1=4. Akar realnya -1 dan 5.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A23", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-394", "cat": 1, "sub": "Domain dan range", "level": 2, "stem": "Domain f(x)=√(2x−4) adalah ….", "options": ["x < 2", "x ≠ 2", "x ≥ 2", "x > 2", "x ≤ 2"], "key": [2], "kind": "pg", "why": "Isi akar harus tidak negatif: 2x−4≥0. Maka x≥2.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A24", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-395", "cat": 1, "sub": "Invers dan komposisi", "level": 3, "stem": "g(x)=x−2 dan (f∘g)(x)=2x+1. Nilai f(3) adalah ….", "options": ["25", "11", "12", "10", "13"], "key": [1], "kind": "pg", "why": "Agar g(x)=3, pilih x=5. Maka f(3)=(f∘g)(5)=2×5+1=11.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A25", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-396", "cat": 1, "sub": "Barisan dan deret", "level": 3, "stem": "Barisan aritmetika memiliki U₃=8 dan U₈=23. Suku pertamanya adalah ….", "options": ["2", "3", "1", "4", "7"], "key": [0], "kind": "pg", "why": "U₈−U₃=5b=15, sehingga b=3. Lalu a=U₃−2b=8−6=2.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A26", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-397", "cat": 1, "sub": "Barisan dan deret", "level": 3, "stem": "Bola dijatuhkan dari tinggi 18 meter. Setiap pantulan mencapai 1/3 tinggi sebelumnya. Total lintasan hingga bola berhenti secara ideal … meter.", "options": ["18", "24", "30", "54", "36"], "key": [4], "kind": "pg", "why": "Jatuh awal=18. Total tinggi semua pantulan = 6/(1−1/3)=9. Setiap pantulan dilalui naik dan turun. Total=18+2×9=36.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A27", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-398", "cat": 1, "sub": "Pertumbuhan dan bunga", "level": 3, "stem": "Modal Rp2000000 menjadi Rp2420000 setelah dua tahun dengan bunga majemuk tetap r per tahun. Besar r adalah …%.", "options": ["10,5", "11", "21", "10", "5"], "key": [3], "kind": "pg", "why": "(1+r)²=2420000/2000000=1,21. Karena saldo positif dan bunga pertumbuhan, 1+r=1,1, sehingga r=0,1=10%.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A28", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-399", "cat": 1, "sub": "Program linear", "level": 3, "stem": "Daerah layak memenuhi x+y≤8, x≤4, x,y≥0. Fungsi tujuan Z=3x+2y.", "options": ["Titik (4,4) layak.", "Nilai maksimum Z adalah 20.", "Titik (0,8) memberi Z terbesar."], "key": [true, true, false], "kind": "bs", "why": "Titik pojoknya (0,0),(4,0),(4,4),(0,8). Nilai Z: 0,12,20,16. Maka maksimum di (4,4).", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A29", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-400", "cat": 1, "sub": "Pertidaksamaan linear", "level": 2, "stem": "Banyak bilangan bulat x yang memenuhi −2<x≤5 adalah ….", "options": ["17", "7", "8", "6", "9"], "key": [1], "kind": "pg", "why": "Bilangan bulat terkecil adalah -1 dan terbesar 5. Banyaknya = 5−(-1)+1=7.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A30", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-401", "cat": 2, "sub": "Sudut dan garis", "level": 2, "stem": "Dua sudut dalam segitiga masing-masing 32° dan 62°. Sudut luar pada titik sudut ketiga adalah …°.", "options": ["94", "95", "93", "96", "191"], "key": [0], "kind": "pg", "why": "Sudut luar segitiga sama dengan jumlah dua sudut dalam yang tidak berdekatan: 32+62=94°.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G23", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-402", "cat": 2, "sub": "Luas dan keliling", "level": 3, "stem": "Taman berbentuk persegi sisi 4 meter. Di dalamnya dibuat kolam lingkaran yang menyinggung keempat sisi. Luas taman di luar kolam adalah … m².", "options": ["16 − 8π", "16 − 16π", "8 − 4π", "16 + 4π", "16 − 4π"], "key": [4], "kind": "pg", "why": "Luas persegi=16. Diameter kolam=4, sehingga r=2 dan luas kolam=4π. Kurangkan luasnya.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G24", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-403", "cat": 2, "sub": "Volume dan luas permukaan", "level": 3, "stem": "Sebuah akuarium beralas 20 cm × 20 cm. Setelah sebuah benda seluruhnya dicelupkan, permukaan air naik 3 cm tanpa tumpah. Volume benda … cm³.", "options": ["1199", "1202", "2403", "1200", "1201"], "key": [3], "kind": "pg", "why": "Volume air yang dipindahkan sama dengan volume benda tercelup: luas alas×kenaikan air=(20×20)×3=1200 cm³.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G25", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-404", "cat": 2, "sub": "Transformasi titik", "level": 3, "stem": "Titik P(2,3) didilatasikan dengan pusat C(1,1) dan faktor 2. Koordinat bayangan P adalah ….", "options": ["(1, 2)", "(3, 3)", "(3, 5)", "(4, 6)", "(5, 7)"], "key": [2], "kind": "pg", "why": "P′=C+2(P−C)=(1+2(2−1),1+2(3−1))=(3,5).", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G26", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-405", "cat": 2, "sub": "Pythagoras dan jarak", "level": 3, "stem": "Segitiga siku-siku mempunyai kaki 6 cm dan 8 cm. Tinggi yang ditarik dari sudut siku-siku ke sisi miring panjangnya … cm.", "options": ["10", "24/5", "5", "6", "8"], "key": [1], "kind": "pg", "why": "Luas dengan dua kaki=½×6×8. Sisi miring=10. Samakan dengan ½×10×h, sehingga h=24/5=24/5.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G27", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-406", "cat": 2, "sub": "Kesebangunan", "level": 3, "stem": "Dua segitiga sebangun mempunyai perbandingan sisi 2:3. Luas segitiga kecil 8 cm². Luas segitiga besar … cm².", "options": ["18", "19", "17", "20", "39"], "key": [0], "kind": "pg", "why": "Perbandingan luas adalah kuadrat perbandingan sisi, yaitu 4:9. Luas besar=8×9/4=18 cm².", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G28", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-407", "cat": 2, "sub": "Pythagoras dan jarak", "level": 2, "stem": "Jarak titik P(2,3) ke titik Q(8,11) adalah … satuan.", "options": ["6", "8", "12", "14", "10"], "key": [4], "kind": "pg", "why": "Selisih koordinatnya 6 dan 8. Jarak=√(6²+8²)=√100=10.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G29", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-408", "cat": 2, "sub": "Volume dan luas permukaan", "level": 3, "stem": "Sebuah kubus bersisi 2 cm diperbesar sehingga setiap rusuknya 3 kali semula. Volume baru … kali volume semula.", "options": ["6", "9", "81", "27", "3"], "key": [3], "kind": "pg", "why": "Faktor volume=k³=3³=27. Nilai rusuk awal 2 cm tidak mengubah perbandingan ini.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G30", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-409", "cat": 3, "sub": "Rasio trigonometri", "level": 2, "stem": "Sudut lancip A memenuhi cos A=24/26. Nilai cot A adalah ….", "options": ["13/5", "5/13", "12/5", "5/12", "12/13"], "key": [2], "kind": "pg", "why": "Perbandingan samping:miring=12:13, sehingga depan=√(13²−12²)=5. cot A=samping/depan=12/5.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T09", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-410", "cat": 3, "sub": "Sudut istimewa", "level": 2, "stem": "Hasil 2 tan 45° + 4 sin²30° adalah ….", "options": ["9", "3", "4", "2", "5"], "key": [1], "kind": "pg", "why": "tan45°=1; sin30°=½, sehingga sin²30°=¼. Hasil=2×1+4×¼=3.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T10", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-411", "cat": 3, "sub": "Sudut dan kuadran", "level": 2, "stem": "Diketahui cos A=−6/10, dengan 90°<A<180°. Nilai tan A adalah ….", "options": ["-4/3", "4/3", "-3/4", "3/4", "-4/5"], "key": [0], "kind": "pg", "why": "Cos negatif di kuadran II, sedangkan sin positif. sin A=√(1−9/25)=4/5. tan A=(4/5)/(−3/5)=−4/3.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T11", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-412", "cat": 3, "sub": "Aplikasi trigonometri", "level": 3, "stem": "Jalan menanjak membentuk sudut 30° dengan bidang horizontal. Mobil menempuh 8 meter sepanjang jalan tersebut. Kenaikan ketinggiannya … meter.", "options": ["5", "3", "6", "11", "4"], "key": [4], "kind": "pg", "why": "Jarak sepanjang jalan adalah sisi miring. Kenaikan tinggi=8sin30°=8×½=4.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T12", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-413", "cat": 3, "sub": "Sudut dan kuadran", "level": 3, "stem": "Untuk sudut θ=30° yang lancip, tentukan kebenaran identitas berikut.", "options": ["sin(180°−θ)=sin θ", "cos(180°−θ)=cos θ", "tan(180°−θ)=−tan θ"], "key": [true, false, true], "kind": "bs", "why": "180°−30° berada di kuadran II: sinus tetap positif, kosinus berubah tanda, dan tangen berubah tanda.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T13", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-414", "cat": 3, "sub": "Aplikasi trigonometri", "level": 3, "stem": "Dari puncak tebing setinggi 20 meter, sudut depresi ke perahu adalah 45°. Permukaan air datar dan kaki tebing tegak di atas permukaan air. Jarak horizontal perahu ke kaki tebing … meter.", "options": ["22", "43", "20", "21", "19"], "key": [2], "kind": "pg", "why": "Sudut depresi sama dengan sudut elevasi perahu ke puncak. tan45°=tinggi/jarak=1, sehingga jarak=20 meter.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T14", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-415", "cat": 4, "sub": "Data tunggal", "level": 3, "stem": "Rata-rata lima bilangan adalah 8. Jika bilangan 4 dihapus, rata-rata empat bilangan sisanya adalah ….", "options": ["21", "9", "10", "8", "11"], "key": [1], "kind": "pg", "why": "Jumlah awal=5×8=40. Sisa=40−4=36. Rata-rata sisa=36/4=9.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D17", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-416", "cat": 4, "sub": "Data tunggal", "level": 2, "stem": "Data terurut: 2, 4, 6, 8, 10, 12, 14. Dengan median tidak diikutkan dalam kedua separuh data, jangkauan antarkuartil adalah ….", "options": ["8", "4", "6", "10", "12"], "key": [0], "kind": "pg", "why": "Median adalah 8. Q₁ median dari 2,4,6, yaitu 4. Q₃ median dari 10,12,14, yaitu 12. IQR=8.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D18", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-417", "cat": 4, "sub": "Peluang majemuk", "level": 3, "stem": "Tiga koin seimbang dilempar bersama dalam 16 percobaan. Frekuensi harapan muncul tepat dua sisi angka adalah ….", "options": ["7", "5", "8", "15", "6"], "key": [4], "kind": "pg", "why": "Ada 8 hasil sama mungkin. Tepat dua angka terjadi pada AAG, AGA, GAA, sehingga peluang=3/8. Frekuensi harapan=16×3/8=6.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D19", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-418", "cat": 4, "sub": "Peluang majemuk", "level": 3, "stem": "Kotak berisi 2 bola merah dan 3 bola biru. Dua bola diambil sekaligus. Peluang keduanya merah adalah ….", "options": ["4/25", "1/2", "3/5", "1/10", "2/5"], "key": [3], "kind": "pg", "why": "Banyak pasangan merah C(2,2)=1. Seluruh pasangan C(5,2)=10. Peluang=1/10.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D20", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-419", "cat": 4, "sub": "Peluang majemuk", "level": 3, "stem": "Peluang mesin bekerja baik dalam satu hari adalah 5/10. Kondisi pada dua hari berbeda independen. Peluang setidaknya satu dari dua hari mesin bekerja baik adalah ….", "options": ["23/4", "43/4", "3/4", "1/4", "1/2"], "key": [2], "kind": "pg", "why": "Peluang tidak bekerja baik sehari=(10−5)/10=5/10. Komplemen dua hari sama-sama gagal: 1−(5/10)²=3/4.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D21", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-420", "cat": 4, "sub": "Aturan pencacahan", "level": 3, "stem": "5 orang berbeda duduk mengelilingi meja bundar. Susunan yang hanya berbeda karena rotasi dianggap sama, tetapi pencerminan dianggap berbeda. Banyak susunan ….", "options": ["48", "24", "120", "6", "12"], "key": [1], "kind": "pg", "why": "Tetapkan posisi satu orang untuk menghilangkan pengulangan rotasi. Sisanya 4 orang dapat diatur dalam (4)!=24 cara.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D22", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-421", "cat": 4, "sub": "Aturan pencacahan", "level": 3, "stem": "Kode terdiri dari 3 digit yang dipilih dari angka 1 sampai 5. Tidak boleh ada pengulangan. Banyak kode berbeda adalah ….", "options": ["60", "125", "10", "20", "15"], "key": [0], "kind": "pg", "why": "Tempat pertama mempunyai 5 pilihan, kedua 4, ketiga 3. Kalikan menjadi 60.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D23", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-422", "cat": 4, "sub": "Aturan pencacahan", "level": 3, "stem": "Sebuah tim 3 orang dipilih dari 4 putra dan 3 putri. Tim harus terdiri dari 2 putra dan 1 putri. Banyak tim berbeda adalah ….", "options": ["35", "6", "36", "12", "18"], "key": [4], "kind": "pg", "why": "Pilih 2 putra dalam C(4,2)=6 cara; pilih 1 putri dalam 3 cara. Kalikan: 18.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D24", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-423", "cat": 4, "sub": "Data tunggal", "level": 3, "stem": "Seluruh nilai data awal 2, 4, 6 dikalikan 2.", "options": ["Mean menjadi dua kali mean awal.", "Varians menjadi dua kali varians awal.", "Simpangan baku menjadi dua kali simpangan baku awal."], "key": [true, false, true], "kind": "bs", "why": "Perkalian setiap data dengan 2 mengalikan mean dengan 2. Simpangan dari mean ikut menjadi 2 kali, sehingga varians menjadi 4 kali dan simpangan baku 2 kali.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D25", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-424", "cat": 4, "sub": "Penyajian data", "level": 3, "stem": "Penjualan naik dari 80 unit menjadi 100 unit, lalu turun kembali ke 80 unit. Besar penurunan persentase pada tahap kedua adalah …%.", "options": ["25", "30", "20", "10", "15"], "key": [2], "kind": "pg", "why": "Tahap kedua memakai nilai dasar 100. Penurunan=(100−80)/100×100%=20%.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D26", "variant": 1, "source": "Latihan pengembangan"}, {"id": "MTK-425", "cat": 0, "sub": "Operasi bilangan", "level": 2, "stem": "Suatu wadah terisi 3/4 bagian. Sebanyak 3 liter dikeluarkan sehingga tersisa 1/2 bagian. Kapasitas wadah … liter.", "options": ["27", "12", "13", "11", "14"], "key": [1], "kind": "pg", "why": "Bagian yang dikeluarkan=3/4−1/2=1/4. Jadi seperempat kapasitas=3 liter, kapasitas total=12 liter.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B11", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-426", "cat": 0, "sub": "Persen dan perbandingan", "level": 3, "stem": "5 pekerja menyelesaikan proyek dalam 12 hari. Setelah 4 hari, 5 pekerja tambahan datang. Produktivitas sama dan pekerjaan dapat dibagi merata. Sisa waktu pengerjaan … hari.", "options": ["4", "2", "6", "8", "12"], "key": [0], "kind": "pg", "why": "Tersisa pekerjaan setara 8 hari bagi tim awal. Jumlah pekerja kini dua kali lipat, jadi sisa waktu 8/2=4 hari.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B12", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-427", "cat": 0, "sub": "Pangkat dan akar", "level": 2, "stem": "Sederhanakan 3/√2 dengan merasionalkan penyebut.", "options": ["3√2", "√2/3", "3/2", "6√2", "3√2/2"], "key": [4], "kind": "pg", "why": "Kalikan pembilang dan penyebut dengan √2: 3√2/(√2×√2)=3√2/2.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B13", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-428", "cat": 0, "sub": "Pangkat dan akar", "level": 2, "stem": "Jika 3^(x+1)=81, nilai x adalah ….", "options": ["2", "5", "9", "3", "4"], "key": [3], "kind": "pg", "why": "81=3^4. Basisnya sama dan 3≠1, maka x+1=4, sehingga x=3.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B14", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-429", "cat": 0, "sub": "Operasi bilangan", "level": 2, "stem": "Sebuah pita sepanjang 7 meter dipotong menjadi bagian sama panjang, masing-masing 3/4 meter. Panjang sisa pita setelah dibuat sebanyak mungkin potongan utuh adalah … meter.", "options": ["5/4", "3/2", "1/4", "3/4", "1"], "key": [2], "kind": "pg", "why": "Total pita=28 satuan seperempat meter. Tiap potongan memakai 3 satuan. Sisa pembagian 28 oleh 3 adalah 1, yaitu 1/4 meter.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B15", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-430", "cat": 0, "sub": "Sifat bilangan", "level": 3, "stem": "Untuk x=−3, nilai kebenaran pernyataan berikut adalah ….", "options": ["√(x²)=x", "|x|=−x", "x²>0"], "key": [false, true, true], "kind": "bs", "why": "Akar utama tidak negatif: √(x²)=3, berbeda dari x=−3. Nilai mutlak |x|=3=−x dan x²=9>0.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B16", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-431", "cat": 0, "sub": "Persen dan perbandingan", "level": 2, "stem": "Modal sebuah barang Rp240000. Penjual ingin laba 25% dari modal. Harga jualnya … rupiah.", "options": ["300000", "288000", "318000", "360000", "240000"], "key": [0], "kind": "pg", "why": "Laba=25%×240000=60000; harga jual=modal+laba=300000.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B17", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-432", "cat": 0, "sub": "Operasi bilangan", "level": 2, "stem": "Hasil (1/3) ÷ (2/4) adalah ….", "options": ["3/2", "1/6", "4/3", "1/4", "2/3"], "key": [4], "kind": "pg", "why": "Pembagian pecahan diubah menjadi perkalian dengan kebalikan: (1/3)×(4/2)=2/3.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B18", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-433", "cat": 0, "sub": "Persen dan perbandingan", "level": 3, "stem": "Larutan A sebanyak 3 liter mengandung 20% gula. Larutan B sebanyak 6 liter mengandung 50% gula. Kadar gula campuran …%. Anggap volume dijumlahkan.", "options": ["35", "45", "70", "40", "30"], "key": [3], "kind": "pg", "why": "Jumlah gula=0,2×3+0,5×6=3.6 liter ekuivalen. Volume=9. Kadarnya 1,2/3=0,4=40%.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B19", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-434", "cat": 0, "sub": "Pangkat dan akar", "level": 2, "stem": "Nilai (2^−3) × (2^6) adalah ….", "options": ["16", "32", "8", "2", "4"], "key": [2], "kind": "pg", "why": "Pangkat dijumlahkan: −3+6=3. Jadi hasilnya 2³=8.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B20", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-435", "cat": 1, "sub": "Persamaan linear", "level": 3, "stem": "Sebanyak 30 tiket terjual. Tiket dewasa Rp20.000 dan anak Rp10.000. Pendapatan Rp480000. Banyak tiket dewasa adalah ….", "options": ["39", "18", "19", "17", "20"], "key": [1], "kind": "pg", "why": "Andaikan semua tiket anak, pendapatan Rp300000. Kelebihan Rp180000 berasal dari selisih Rp10.000 per tiket dewasa. Jumlah dewasa=18.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A21", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-436", "cat": 1, "sub": "Fungsi kuadrat", "level": 3, "stem": "Sebuah persegi panjang mempunyai keliling 24 meter. Luas maksimumnya … m².", "options": ["36", "37", "35", "38", "75"], "key": [0], "kind": "pg", "why": "p+l=12. Luas p(12−p) mencapai maksimum saat p=l=6. Luas maksimal=6×6=36.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A22", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-437", "cat": 1, "sub": "Fungsi kuadrat", "level": 2, "stem": "Fungsi f(x)=x²−6x+0 memotong sumbu x di x₁ dan x₂. Jumlah kedua akar adalah ….", "options": ["7", "5", "8", "15", "6"], "key": [4], "kind": "pg", "why": "Jumlah akar persamaan ax²+bx+c=0 adalah −b/a. Di sini −(−6)/1=6. Akar realnya 0 dan 6.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A23", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-438", "cat": 1, "sub": "Domain dan range", "level": 2, "stem": "Domain f(x)=√(2x−6) adalah ….", "options": ["x ≤ 3", "x < 3", "x ≠ 3", "x ≥ 3", "x > 3"], "key": [3], "kind": "pg", "why": "Isi akar harus tidak negatif: 2x−6≥0. Maka x≥3.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A24", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-439", "cat": 1, "sub": "Invers dan komposisi", "level": 3, "stem": "g(x)=x−3 dan (f∘g)(x)=2x+1. Nilai f(3) adalah ….", "options": ["15", "29", "13", "14", "12"], "key": [2], "kind": "pg", "why": "Agar g(x)=3, pilih x=6. Maka f(3)=(f∘g)(6)=2×6+1=13.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A25", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-440", "cat": 1, "sub": "Barisan dan deret", "level": 3, "stem": "Barisan aritmetika memiliki U₃=9 dan U₈=24. Suku pertamanya adalah ….", "options": ["9", "3", "4", "2", "5"], "key": [1], "kind": "pg", "why": "U₈−U₃=5b=15, sehingga b=3. Lalu a=U₃−2b=9−6=3.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A26", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-441", "cat": 1, "sub": "Barisan dan deret", "level": 3, "stem": "Bola dijatuhkan dari tinggi 27 meter. Setiap pantulan mencapai 1/3 tinggi sebelumnya. Total lintasan hingga bola berhenti secara ideal … meter.", "options": ["54", "27", "36", "45", "81"], "key": [0], "kind": "pg", "why": "Jatuh awal=27. Total tinggi semua pantulan = 9/(1−1/3)=13.5. Setiap pantulan dilalui naik dan turun. Total=27+2×13.5=54.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A27", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-442", "cat": 1, "sub": "Pertumbuhan dan bunga", "level": 3, "stem": "Modal Rp3000000 menjadi Rp3630000 setelah dua tahun dengan bunga majemuk tetap r per tahun. Besar r adalah …%.", "options": ["5", "10,5", "11", "21", "10"], "key": [4], "kind": "pg", "why": "(1+r)²=3630000/3000000=1,21. Karena saldo positif dan bunga pertumbuhan, 1+r=1,1, sehingga r=0,1=10%.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A28", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-443", "cat": 1, "sub": "Program linear", "level": 3, "stem": "Daerah layak memenuhi x+y≤12, x≤6, x,y≥0. Fungsi tujuan Z=3x+2y.", "options": ["Titik (6,6) layak.", "Nilai maksimum Z adalah 30.", "Titik (0,12) memberi Z terbesar."], "key": [true, true, false], "kind": "bs", "why": "Titik pojoknya (0,0),(6,0),(6,6),(0,12). Nilai Z: 0,18,30,24. Maka maksimum di (6,6).", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A29", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-444", "cat": 1, "sub": "Pertidaksamaan linear", "level": 2, "stem": "Banyak bilangan bulat x yang memenuhi −3<x≤6 adalah ….", "options": ["11", "21", "9", "10", "8"], "key": [2], "kind": "pg", "why": "Bilangan bulat terkecil adalah -2 dan terbesar 6. Banyaknya = 6−(-2)+1=9.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A30", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-445", "cat": 2, "sub": "Sudut dan garis", "level": 2, "stem": "Dua sudut dalam segitiga masing-masing 33° dan 63°. Sudut luar pada titik sudut ketiga adalah …°.", "options": ["195", "96", "97", "95", "98"], "key": [1], "kind": "pg", "why": "Sudut luar segitiga sama dengan jumlah dua sudut dalam yang tidak berdekatan: 33+63=96°.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G23", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-446", "cat": 2, "sub": "Luas dan keliling", "level": 3, "stem": "Taman berbentuk persegi sisi 6 meter. Di dalamnya dibuat kolam lingkaran yang menyinggung keempat sisi. Luas taman di luar kolam adalah … m².", "options": ["36 − 9π", "36 − 18π", "36 − 36π", "18 − 9π", "36 + 9π"], "key": [0], "kind": "pg", "why": "Luas persegi=36. Diameter kolam=6, sehingga r=3 dan luas kolam=9π. Kurangkan luasnya.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G24", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-447", "cat": 2, "sub": "Volume dan luas permukaan", "level": 3, "stem": "Sebuah akuarium beralas 30 cm × 20 cm. Setelah sebuah benda seluruhnya dicelupkan, permukaan air naik 3 cm tanpa tumpah. Volume benda … cm³.", "options": ["1801", "1799", "1802", "3603", "1800"], "key": [4], "kind": "pg", "why": "Volume air yang dipindahkan sama dengan volume benda tercelup: luas alas×kenaikan air=(30×20)×3=1800 cm³.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G25", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-448", "cat": 2, "sub": "Transformasi titik", "level": 3, "stem": "Titik P(3,3) didilatasikan dengan pusat C(1,1) dan faktor 2. Koordinat bayangan P adalah ….", "options": ["(7, 7)", "(2, 2)", "(5, 3)", "(5, 5)", "(6, 6)"], "key": [3], "kind": "pg", "why": "P′=C+2(P−C)=(1+2(3−1),1+2(3−1))=(5,5).", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G26", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-449", "cat": 2, "sub": "Pythagoras dan jarak", "level": 3, "stem": "Segitiga siku-siku mempunyai kaki 9 cm dan 12 cm. Tinggi yang ditarik dari sudut siku-siku ke sisi miring panjangnya … cm.", "options": ["12", "15", "36/5", "15/2", "9"], "key": [2], "kind": "pg", "why": "Luas dengan dua kaki=½×9×12. Sisi miring=15. Samakan dengan ½×15×h, sehingga h=36/5=36/5.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G27", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-450", "cat": 2, "sub": "Kesebangunan", "level": 3, "stem": "Dua segitiga sebangun mempunyai perbandingan sisi 2:3. Luas segitiga kecil 12 cm². Luas segitiga besar … cm².", "options": ["57", "27", "28", "26", "29"], "key": [1], "kind": "pg", "why": "Perbandingan luas adalah kuadrat perbandingan sisi, yaitu 4:9. Luas besar=12×9/4=27 cm².", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G28", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-451", "cat": 2, "sub": "Pythagoras dan jarak", "level": 2, "stem": "Jarak titik P(3,3) ke titik Q(9,11) adalah … satuan.", "options": ["10", "6", "8", "12", "14"], "key": [0], "kind": "pg", "why": "Selisih koordinatnya 6 dan 8. Jarak=√(6²+8²)=√100=10.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G29", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-452", "cat": 2, "sub": "Volume dan luas permukaan", "level": 3, "stem": "Sebuah kubus bersisi 3 cm diperbesar sehingga setiap rusuknya 3 kali semula. Volume baru … kali volume semula.", "options": ["3", "6", "9", "81", "27"], "key": [4], "kind": "pg", "why": "Faktor volume=k³=3³=27. Nilai rusuk awal 3 cm tidak mengubah perbandingan ini.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G30", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-453", "cat": 3, "sub": "Rasio trigonometri", "level": 2, "stem": "Sudut lancip A memenuhi cos A=36/39. Nilai cot A adalah ….", "options": ["12/13", "13/5", "5/13", "12/5", "5/12"], "key": [3], "kind": "pg", "why": "Perbandingan samping:miring=12:13, sehingga depan=√(13²−12²)=5. cot A=samping/depan=12/5.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T09", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-454", "cat": 3, "sub": "Sudut istimewa", "level": 2, "stem": "Hasil 3 tan 45° + 4 sin²30° adalah ….", "options": ["6", "11", "4", "5", "3"], "key": [2], "kind": "pg", "why": "tan45°=1; sin30°=½, sehingga sin²30°=¼. Hasil=3×1+4×¼=4.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T10", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-455", "cat": 3, "sub": "Sudut dan kuadran", "level": 2, "stem": "Diketahui cos A=−9/15, dengan 90°<A<180°. Nilai tan A adalah ….", "options": ["-4/5", "-4/3", "4/3", "-3/4", "3/4"], "key": [1], "kind": "pg", "why": "Cos negatif di kuadran II, sedangkan sin positif. sin A=√(1−9/25)=4/5. tan A=(4/5)/(−3/5)=−4/3.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T11", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-456", "cat": 3, "sub": "Aplikasi trigonometri", "level": 3, "stem": "Jalan menanjak membentuk sudut 30° dengan bidang horizontal. Mobil menempuh 12 meter sepanjang jalan tersebut. Kenaikan ketinggiannya … meter.", "options": ["6", "7", "5", "8", "15"], "key": [0], "kind": "pg", "why": "Jarak sepanjang jalan adalah sisi miring. Kenaikan tinggi=12sin30°=12×½=6.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T12", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-457", "cat": 3, "sub": "Sudut dan kuadran", "level": 3, "stem": "Untuk sudut θ=35° yang lancip, tentukan kebenaran identitas berikut.", "options": ["sin(180°−θ)=sin θ", "cos(180°−θ)=cos θ", "tan(180°−θ)=−tan θ"], "key": [true, false, true], "kind": "bs", "why": "180°−35° berada di kuadran II: sinus tetap positif, kosinus berubah tanda, dan tangen berubah tanda.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T13", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-458", "cat": 3, "sub": "Aplikasi trigonometri", "level": 3, "stem": "Dari puncak tebing setinggi 30 meter, sudut depresi ke perahu adalah 45°. Permukaan air datar dan kaki tebing tegak di atas permukaan air. Jarak horizontal perahu ke kaki tebing … meter.", "options": ["29", "32", "63", "30", "31"], "key": [3], "kind": "pg", "why": "Sudut depresi sama dengan sudut elevasi perahu ke puncak. tan45°=tinggi/jarak=1, sehingga jarak=30 meter.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T14", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-459", "cat": 4, "sub": "Data tunggal", "level": 3, "stem": "Rata-rata lima bilangan adalah 9. Jika bilangan 5 dihapus, rata-rata empat bilangan sisanya adalah ….", "options": ["12", "23", "10", "11", "9"], "key": [2], "kind": "pg", "why": "Jumlah awal=5×9=45. Sisa=45−5=40. Rata-rata sisa=40/4=10.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D17", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-460", "cat": 4, "sub": "Data tunggal", "level": 2, "stem": "Data terurut: 3, 5, 7, 9, 11, 13, 15. Dengan median tidak diikutkan dalam kedua separuh data, jangkauan antarkuartil adalah ….", "options": ["12", "8", "4", "6", "10"], "key": [1], "kind": "pg", "why": "Median adalah 9. Q₁ median dari 3,5,7, yaitu 5. Q₃ median dari 11,13,15, yaitu 13. IQR=8.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D18", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-461", "cat": 4, "sub": "Peluang majemuk", "level": 3, "stem": "Tiga koin seimbang dilempar bersama dalam 24 percobaan. Frekuensi harapan muncul tepat dua sisi angka adalah ….", "options": ["9", "10", "8", "11", "21"], "key": [0], "kind": "pg", "why": "Ada 8 hasil sama mungkin. Tepat dua angka terjadi pada AAG, AGA, GAA, sehingga peluang=3/8. Frekuensi harapan=24×3/8=9.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D19", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-462", "cat": 4, "sub": "Peluang majemuk", "level": 3, "stem": "Kotak berisi 3 bola merah dan 4 bola biru. Dua bola diambil sekaligus. Peluang keduanya merah adalah ….", "options": ["3/7", "9/49", "1/2", "4/7", "1/7"], "key": [4], "kind": "pg", "why": "Banyak pasangan merah C(3,2)=3. Seluruh pasangan C(7,2)=21. Peluang=1/7.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D20", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-463", "cat": 4, "sub": "Peluang majemuk", "level": 3, "stem": "Peluang mesin bekerja baik dalam satu hari adalah 6/10. Kondisi pada dua hari berbeda independen. Peluang setidaknya satu dari dua hari mesin bekerja baik adalah ….", "options": ["3/5", "4/25", "2/5", "21/25", "9/25"], "key": [3], "kind": "pg", "why": "Peluang tidak bekerja baik sehari=(10−6)/10=4/10. Komplemen dua hari sama-sama gagal: 1−(4/10)²=21/25.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D21", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-464", "cat": 4, "sub": "Aturan pencacahan", "level": 3, "stem": "6 orang berbeda duduk mengelilingi meja bundar. Susunan yang hanya berbeda karena rotasi dianggap sama, tetapi pencerminan dianggap berbeda. Banyak susunan ….", "options": ["60", "240", "120", "720", "24"], "key": [2], "kind": "pg", "why": "Tetapkan posisi satu orang untuk menghilangkan pengulangan rotasi. Sisanya 5 orang dapat diatur dalam (5)!=120 cara.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D22", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-465", "cat": 4, "sub": "Aturan pencacahan", "level": 3, "stem": "Kode terdiri dari 3 digit yang dipilih dari angka 1 sampai 6. Tidak boleh ada pengulangan. Banyak kode berbeda adalah ….", "options": ["18", "120", "216", "20", "30"], "key": [1], "kind": "pg", "why": "Tempat pertama mempunyai 6 pilihan, kedua 5, ketiga 4. Kalikan menjadi 120.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D23", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-466", "cat": 4, "sub": "Aturan pencacahan", "level": 3, "stem": "Sebuah tim 3 orang dipilih dari 5 putra dan 3 putri. Tim harus terdiri dari 2 putra dan 1 putri. Banyak tim berbeda adalah ….", "options": ["30", "56", "10", "60", "15"], "key": [0], "kind": "pg", "why": "Pilih 2 putra dalam C(5,2)=10 cara; pilih 1 putri dalam 3 cara. Kalikan: 30.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D24", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-467", "cat": 4, "sub": "Data tunggal", "level": 3, "stem": "Seluruh nilai data awal 3, 5, 7 dikalikan 2.", "options": ["Mean menjadi dua kali mean awal.", "Varians menjadi dua kali varians awal.", "Simpangan baku menjadi dua kali simpangan baku awal."], "key": [true, false, true], "kind": "bs", "why": "Perkalian setiap data dengan 2 mengalikan mean dengan 2. Simpangan dari mean ikut menjadi 2 kali, sehingga varians menjadi 4 kali dan simpangan baku 2 kali.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D25", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-468", "cat": 4, "sub": "Penyajian data", "level": 3, "stem": "Penjualan naik dari 120 unit menjadi 150 unit, lalu turun kembali ke 120 unit. Besar penurunan persentase pada tahap kedua adalah …%.", "options": ["15", "25", "30", "20", "10"], "key": [3], "kind": "pg", "why": "Tahap kedua memakai nilai dasar 150. Penurunan=(150−120)/150×100%=20%.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D26", "variant": 2, "source": "Latihan pengembangan"}, {"id": "MTK-469", "cat": 0, "sub": "Operasi bilangan", "level": 2, "stem": "Suatu wadah terisi 3/4 bagian. Sebanyak 4 liter dikeluarkan sehingga tersisa 1/2 bagian. Kapasitas wadah … liter.", "options": ["18", "35", "16", "17", "15"], "key": [2], "kind": "pg", "why": "Bagian yang dikeluarkan=3/4−1/2=1/4. Jadi seperempat kapasitas=4 liter, kapasitas total=16 liter.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B11", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-470", "cat": 0, "sub": "Persen dan perbandingan", "level": 3, "stem": "6 pekerja menyelesaikan proyek dalam 12 hari. Setelah 4 hari, 6 pekerja tambahan datang. Produktivitas sama dan pekerjaan dapat dibagi merata. Sisa waktu pengerjaan … hari.", "options": ["12", "4", "2", "6", "8"], "key": [1], "kind": "pg", "why": "Tersisa pekerjaan setara 8 hari bagi tim awal. Jumlah pekerja kini dua kali lipat, jadi sisa waktu 8/2=4 hari.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B12", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-471", "cat": 0, "sub": "Pangkat dan akar", "level": 2, "stem": "Sederhanakan 4/√2 dengan merasionalkan penyebut.", "options": ["4√2/2", "4√2", "√2/4", "4/2", "8√2"], "key": [0], "kind": "pg", "why": "Kalikan pembilang dan penyebut dengan √2: 4√2/(√2×√2)=4√2/2.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B13", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-472", "cat": 0, "sub": "Pangkat dan akar", "level": 2, "stem": "Jika 3^(x+1)=243, nilai x adalah ….", "options": ["5", "3", "6", "11", "4"], "key": [4], "kind": "pg", "why": "243=3^5. Basisnya sama dan 3≠1, maka x+1=5, sehingga x=4.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B14", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-473", "cat": 0, "sub": "Operasi bilangan", "level": 2, "stem": "Sebuah pita sepanjang 8 meter dipotong menjadi bagian sama panjang, masing-masing 3/4 meter. Panjang sisa pita setelah dibuat sebanyak mungkin potongan utuh adalah … meter.", "options": ["1", "5/4", "3/2", "1/2", "3/4"], "key": [3], "kind": "pg", "why": "Total pita=32 satuan seperempat meter. Tiap potongan memakai 3 satuan. Sisa pembagian 32 oleh 3 adalah 2, yaitu 1/2 meter.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B15", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-474", "cat": 0, "sub": "Sifat bilangan", "level": 3, "stem": "Untuk x=−4, nilai kebenaran pernyataan berikut adalah ….", "options": ["√(x²)=x", "|x|=−x", "x²>0"], "key": [false, true, true], "kind": "bs", "why": "Akar utama tidak negatif: √(x²)=4, berbeda dari x=−4. Nilai mutlak |x|=4=−x dan x²=16>0.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B16", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-475", "cat": 0, "sub": "Persen dan perbandingan", "level": 2, "stem": "Modal sebuah barang Rp320000. Penjual ingin laba 25% dari modal. Harga jualnya … rupiah.", "options": ["320000", "400000", "384000", "424000", "480000"], "key": [1], "kind": "pg", "why": "Laba=25%×320000=80000; harga jual=modal+laba=400000.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B17", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-476", "cat": 0, "sub": "Operasi bilangan", "level": 2, "stem": "Hasil (1/4) ÷ (2/5) adalah ….", "options": ["5/8", "8/5", "1/10", "5/4", "1/5"], "key": [0], "kind": "pg", "why": "Pembagian pecahan diubah menjadi perkalian dengan kebalikan: (1/4)×(5/2)=5/8.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B18", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-477", "cat": 0, "sub": "Persen dan perbandingan", "level": 3, "stem": "Larutan A sebanyak 4 liter mengandung 20% gula. Larutan B sebanyak 8 liter mengandung 50% gula. Kadar gula campuran …%. Anggap volume dijumlahkan.", "options": ["30", "35", "45", "70", "40"], "key": [4], "kind": "pg", "why": "Jumlah gula=0,2×4+0,5×8=4.8 liter ekuivalen. Volume=12. Kadarnya 1,2/3=0,4=40%.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B19", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-478", "cat": 0, "sub": "Pangkat dan akar", "level": 2, "stem": "Nilai (2^−4) × (2^7) adalah ….", "options": ["4", "16", "32", "8", "2"], "key": [3], "kind": "pg", "why": "Pangkat dijumlahkan: −4+7=3. Jadi hasilnya 2³=8.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B20", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-479", "cat": 1, "sub": "Persamaan linear", "level": 3, "stem": "Sebanyak 40 tiket terjual. Tiket dewasa Rp20.000 dan anak Rp10.000. Pendapatan Rp640000. Banyak tiket dewasa adalah ….", "options": ["26", "51", "24", "25", "23"], "key": [2], "kind": "pg", "why": "Andaikan semua tiket anak, pendapatan Rp400000. Kelebihan Rp240000 berasal dari selisih Rp10.000 per tiket dewasa. Jumlah dewasa=24.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A21", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-480", "cat": 1, "sub": "Fungsi kuadrat", "level": 3, "stem": "Sebuah persegi panjang mempunyai keliling 32 meter. Luas maksimumnya … m².", "options": ["131", "64", "65", "63", "66"], "key": [1], "kind": "pg", "why": "p+l=16. Luas p(16−p) mencapai maksimum saat p=l=8. Luas maksimal=8×8=64.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A22", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-481", "cat": 1, "sub": "Fungsi kuadrat", "level": 2, "stem": "Fungsi f(x)=x²−8x+7 memotong sumbu x di x₁ dan x₂. Jumlah kedua akar adalah ….", "options": ["8", "9", "7", "10", "19"], "key": [0], "kind": "pg", "why": "Jumlah akar persamaan ax²+bx+c=0 adalah −b/a. Di sini −(−8)/1=8. Akar realnya 1 dan 7.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A23", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-482", "cat": 1, "sub": "Domain dan range", "level": 2, "stem": "Domain f(x)=√(2x−8) adalah ….", "options": ["x > 4", "x ≤ 4", "x < 4", "x ≠ 4", "x ≥ 4"], "key": [4], "kind": "pg", "why": "Isi akar harus tidak negatif: 2x−8≥0. Maka x≥4.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A24", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-483", "cat": 1, "sub": "Invers dan komposisi", "level": 3, "stem": "g(x)=x−4 dan (f∘g)(x)=2x+1. Nilai f(3) adalah ….", "options": ["14", "17", "33", "15", "16"], "key": [3], "kind": "pg", "why": "Agar g(x)=3, pilih x=7. Maka f(3)=(f∘g)(7)=2×7+1=15.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A25", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-484", "cat": 1, "sub": "Barisan dan deret", "level": 3, "stem": "Barisan aritmetika memiliki U₃=10 dan U₈=25. Suku pertamanya adalah ….", "options": ["6", "11", "4", "5", "3"], "key": [2], "kind": "pg", "why": "U₈−U₃=5b=15, sehingga b=3. Lalu a=U₃−2b=10−6=4.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A26", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-485", "cat": 1, "sub": "Barisan dan deret", "level": 3, "stem": "Bola dijatuhkan dari tinggi 36 meter. Setiap pantulan mencapai 1/3 tinggi sebelumnya. Total lintasan hingga bola berhenti secara ideal … meter.", "options": ["108", "72", "36", "48", "60"], "key": [1], "kind": "pg", "why": "Jatuh awal=36. Total tinggi semua pantulan = 12/(1−1/3)=18. Setiap pantulan dilalui naik dan turun. Total=36+2×18=72.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A27", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-486", "cat": 1, "sub": "Pertumbuhan dan bunga", "level": 3, "stem": "Modal Rp4000000 menjadi Rp4840000 setelah dua tahun dengan bunga majemuk tetap r per tahun. Besar r adalah …%.", "options": ["10", "5", "10,5", "11", "21"], "key": [0], "kind": "pg", "why": "(1+r)²=4840000/4000000=1,21. Karena saldo positif dan bunga pertumbuhan, 1+r=1,1, sehingga r=0,1=10%.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A28", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-487", "cat": 1, "sub": "Program linear", "level": 3, "stem": "Daerah layak memenuhi x+y≤16, x≤8, x,y≥0. Fungsi tujuan Z=3x+2y.", "options": ["Titik (8,8) layak.", "Nilai maksimum Z adalah 40.", "Titik (0,16) memberi Z terbesar."], "key": [true, true, false], "kind": "bs", "why": "Titik pojoknya (0,0),(8,0),(8,8),(0,16). Nilai Z: 0,24,40,32. Maka maksimum di (8,8).", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A29", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-488", "cat": 1, "sub": "Pertidaksamaan linear", "level": 2, "stem": "Banyak bilangan bulat x yang memenuhi −4<x≤7 adalah ….", "options": ["10", "13", "25", "11", "12"], "key": [3], "kind": "pg", "why": "Bilangan bulat terkecil adalah -3 dan terbesar 7. Banyaknya = 7−(-3)+1=11.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A30", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-489", "cat": 2, "sub": "Sudut dan garis", "level": 2, "stem": "Dua sudut dalam segitiga masing-masing 34° dan 64°. Sudut luar pada titik sudut ketiga adalah …°.", "options": ["100", "199", "98", "99", "97"], "key": [2], "kind": "pg", "why": "Sudut luar segitiga sama dengan jumlah dua sudut dalam yang tidak berdekatan: 34+64=98°.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G23", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-490", "cat": 2, "sub": "Luas dan keliling", "level": 3, "stem": "Taman berbentuk persegi sisi 8 meter. Di dalamnya dibuat kolam lingkaran yang menyinggung keempat sisi. Luas taman di luar kolam adalah … m².", "options": ["64 + 16π", "64 − 16π", "64 − 32π", "64 − 64π", "32 − 16π"], "key": [1], "kind": "pg", "why": "Luas persegi=64. Diameter kolam=8, sehingga r=4 dan luas kolam=16π. Kurangkan luasnya.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G24", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-491", "cat": 2, "sub": "Volume dan luas permukaan", "level": 3, "stem": "Sebuah akuarium beralas 40 cm × 20 cm. Setelah sebuah benda seluruhnya dicelupkan, permukaan air naik 3 cm tanpa tumpah. Volume benda … cm³.", "options": ["2400", "2401", "2399", "2402", "4803"], "key": [0], "kind": "pg", "why": "Volume air yang dipindahkan sama dengan volume benda tercelup: luas alas×kenaikan air=(40×20)×3=2400 cm³.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G25", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-492", "cat": 2, "sub": "Transformasi titik", "level": 3, "stem": "Titik P(4,3) didilatasikan dengan pusat C(1,1) dan faktor 2. Koordinat bayangan P adalah ….", "options": ["(8, 6)", "(9, 7)", "(3, 2)", "(7, 3)", "(7, 5)"], "key": [4], "kind": "pg", "why": "P′=C+2(P−C)=(1+2(4−1),1+2(3−1))=(7,5).", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G26", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-493", "cat": 2, "sub": "Pythagoras dan jarak", "level": 3, "stem": "Segitiga siku-siku mempunyai kaki 12 cm dan 16 cm. Tinggi yang ditarik dari sudut siku-siku ke sisi miring panjangnya … cm.", "options": ["12", "16", "20", "48/5", "10"], "key": [3], "kind": "pg", "why": "Luas dengan dua kaki=½×12×16. Sisi miring=20. Samakan dengan ½×20×h, sehingga h=48/5=48/5.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G27", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-494", "cat": 2, "sub": "Kesebangunan", "level": 3, "stem": "Dua segitiga sebangun mempunyai perbandingan sisi 2:3. Luas segitiga kecil 16 cm². Luas segitiga besar … cm².", "options": ["38", "75", "36", "37", "35"], "key": [2], "kind": "pg", "why": "Perbandingan luas adalah kuadrat perbandingan sisi, yaitu 4:9. Luas besar=16×9/4=36 cm².", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G28", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-495", "cat": 2, "sub": "Pythagoras dan jarak", "level": 2, "stem": "Jarak titik P(4,3) ke titik Q(10,11) adalah … satuan.", "options": ["14", "10", "6", "8", "12"], "key": [1], "kind": "pg", "why": "Selisih koordinatnya 6 dan 8. Jarak=√(6²+8²)=√100=10.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G29", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-496", "cat": 2, "sub": "Volume dan luas permukaan", "level": 3, "stem": "Sebuah kubus bersisi 4 cm diperbesar sehingga setiap rusuknya 3 kali semula. Volume baru … kali volume semula.", "options": ["27", "3", "6", "9", "81"], "key": [0], "kind": "pg", "why": "Faktor volume=k³=3³=27. Nilai rusuk awal 4 cm tidak mengubah perbandingan ini.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G30", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-497", "cat": 3, "sub": "Rasio trigonometri", "level": 2, "stem": "Sudut lancip A memenuhi cos A=48/52. Nilai cot A adalah ….", "options": ["5/12", "12/13", "13/5", "5/13", "12/5"], "key": [4], "kind": "pg", "why": "Perbandingan samping:miring=12:13, sehingga depan=√(13²−12²)=5. cot A=samping/depan=12/5.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T09", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-498", "cat": 3, "sub": "Sudut istimewa", "level": 2, "stem": "Hasil 4 tan 45° + 4 sin²30° adalah ….", "options": ["4", "7", "13", "5", "6"], "key": [3], "kind": "pg", "why": "tan45°=1; sin30°=½, sehingga sin²30°=¼. Hasil=4×1+4×¼=5.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T10", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-499", "cat": 3, "sub": "Sudut dan kuadran", "level": 2, "stem": "Diketahui cos A=−12/20, dengan 90°<A<180°. Nilai tan A adalah ….", "options": ["3/4", "-4/5", "-4/3", "4/3", "-3/4"], "key": [2], "kind": "pg", "why": "Cos negatif di kuadran II, sedangkan sin positif. sin A=√(1−9/25)=4/5. tan A=(4/5)/(−3/5)=−4/3.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T11", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-500", "cat": 3, "sub": "Aplikasi trigonometri", "level": 3, "stem": "Jalan menanjak membentuk sudut 30° dengan bidang horizontal. Mobil menempuh 16 meter sepanjang jalan tersebut. Kenaikan ketinggiannya … meter.", "options": ["19", "8", "9", "7", "10"], "key": [1], "kind": "pg", "why": "Jarak sepanjang jalan adalah sisi miring. Kenaikan tinggi=16sin30°=16×½=8.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T12", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-501", "cat": 3, "sub": "Sudut dan kuadran", "level": 3, "stem": "Untuk sudut θ=40° yang lancip, tentukan kebenaran identitas berikut.", "options": ["sin(180°−θ)=sin θ", "cos(180°−θ)=cos θ", "tan(180°−θ)=−tan θ"], "key": [true, false, true], "kind": "bs", "why": "180°−40° berada di kuadran II: sinus tetap positif, kosinus berubah tanda, dan tangen berubah tanda.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T13", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-502", "cat": 3, "sub": "Aplikasi trigonometri", "level": 3, "stem": "Dari puncak tebing setinggi 40 meter, sudut depresi ke perahu adalah 45°. Permukaan air datar dan kaki tebing tegak di atas permukaan air. Jarak horizontal perahu ke kaki tebing … meter.", "options": ["41", "39", "42", "83", "40"], "key": [4], "kind": "pg", "why": "Sudut depresi sama dengan sudut elevasi perahu ke puncak. tan45°=tinggi/jarak=1, sehingga jarak=40 meter.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T14", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-503", "cat": 4, "sub": "Data tunggal", "level": 3, "stem": "Rata-rata lima bilangan adalah 10. Jika bilangan 6 dihapus, rata-rata empat bilangan sisanya adalah ….", "options": ["10", "13", "25", "11", "12"], "key": [3], "kind": "pg", "why": "Jumlah awal=5×10=50. Sisa=50−6=44. Rata-rata sisa=44/4=11.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D17", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-504", "cat": 4, "sub": "Data tunggal", "level": 2, "stem": "Data terurut: 4, 6, 8, 10, 12, 14, 16. Dengan median tidak diikutkan dalam kedua separuh data, jangkauan antarkuartil adalah ….", "options": ["10", "12", "8", "4", "6"], "key": [2], "kind": "pg", "why": "Median adalah 10. Q₁ median dari 4,6,8, yaitu 6. Q₃ median dari 12,14,16, yaitu 14. IQR=8.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D18", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-505", "cat": 4, "sub": "Peluang majemuk", "level": 3, "stem": "Tiga koin seimbang dilempar bersama dalam 32 percobaan. Frekuensi harapan muncul tepat dua sisi angka adalah ….", "options": ["27", "12", "13", "11", "14"], "key": [1], "kind": "pg", "why": "Ada 8 hasil sama mungkin. Tepat dua angka terjadi pada AAG, AGA, GAA, sehingga peluang=3/8. Frekuensi harapan=32×3/8=12.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D19", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-506", "cat": 4, "sub": "Peluang majemuk", "level": 3, "stem": "Kotak berisi 4 bola merah dan 5 bola biru. Dua bola diambil sekaligus. Peluang keduanya merah adalah ….", "options": ["1/6", "4/9", "16/81", "1/2", "5/9"], "key": [0], "kind": "pg", "why": "Banyak pasangan merah C(4,2)=6. Seluruh pasangan C(9,2)=36. Peluang=1/6.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D20", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-507", "cat": 4, "sub": "Peluang majemuk", "level": 3, "stem": "Peluang mesin bekerja baik dalam satu hari adalah 7/10. Kondisi pada dua hari berbeda independen. Peluang setidaknya satu dari dua hari mesin bekerja baik adalah ….", "options": ["49/100", "7/10", "9/100", "3/10", "91/100"], "key": [4], "kind": "pg", "why": "Peluang tidak bekerja baik sehari=(10−7)/10=3/10. Komplemen dua hari sama-sama gagal: 1−(3/10)²=91/100.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D21", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-508", "cat": 4, "sub": "Aturan pencacahan", "level": 3, "stem": "7 orang berbeda duduk mengelilingi meja bundar. Susunan yang hanya berbeda karena rotasi dianggap sama, tetapi pencerminan dianggap berbeda. Banyak susunan ….", "options": ["120", "360", "1440", "720", "5040"], "key": [3], "kind": "pg", "why": "Tetapkan posisi satu orang untuk menghilangkan pengulangan rotasi. Sisanya 6 orang dapat diatur dalam (6)!=720 cara.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D22", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-509", "cat": 4, "sub": "Aturan pencacahan", "level": 3, "stem": "Kode terdiri dari 3 digit yang dipilih dari angka 1 sampai 7. Tidak boleh ada pengulangan. Banyak kode berbeda adalah ….", "options": ["42", "21", "210", "343", "35"], "key": [2], "kind": "pg", "why": "Tempat pertama mempunyai 7 pilihan, kedua 6, ketiga 5. Kalikan menjadi 210.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D23", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-510", "cat": 4, "sub": "Aturan pencacahan", "level": 3, "stem": "Sebuah tim 3 orang dipilih dari 6 putra dan 3 putri. Tim harus terdiri dari 2 putra dan 1 putri. Banyak tim berbeda adalah ….", "options": ["18", "45", "84", "15", "90"], "key": [1], "kind": "pg", "why": "Pilih 2 putra dalam C(6,2)=15 cara; pilih 1 putri dalam 3 cara. Kalikan: 45.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D24", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-511", "cat": 4, "sub": "Data tunggal", "level": 3, "stem": "Seluruh nilai data awal 4, 6, 8 dikalikan 2.", "options": ["Mean menjadi dua kali mean awal.", "Varians menjadi dua kali varians awal.", "Simpangan baku menjadi dua kali simpangan baku awal."], "key": [true, false, true], "kind": "bs", "why": "Perkalian setiap data dengan 2 mengalikan mean dengan 2. Simpangan dari mean ikut menjadi 2 kali, sehingga varians menjadi 4 kali dan simpangan baku 2 kali.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D25", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-512", "cat": 4, "sub": "Penyajian data", "level": 3, "stem": "Penjualan naik dari 160 unit menjadi 200 unit, lalu turun kembali ke 160 unit. Besar penurunan persentase pada tahap kedua adalah …%.", "options": ["10", "15", "25", "30", "20"], "key": [4], "kind": "pg", "why": "Tahap kedua memakai nilai dasar 200. Penurunan=(200−160)/200×100%=20%.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D26", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-513", "cat": 0, "sub": "Operasi bilangan", "level": 2, "stem": "Suatu wadah terisi 3/4 bagian. Sebanyak 5 liter dikeluarkan sehingga tersisa 1/2 bagian. Kapasitas wadah … liter.", "options": ["19", "22", "43", "20", "21"], "key": [3], "kind": "pg", "why": "Bagian yang dikeluarkan=3/4−1/2=1/4. Jadi seperempat kapasitas=5 liter, kapasitas total=20 liter.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B11", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-514", "cat": 0, "sub": "Persen dan perbandingan", "level": 3, "stem": "7 pekerja menyelesaikan proyek angan"}, {"id": "MTK-518", "cat": 0, "sub": "Sifat bilangan", "level": 3, "stem": "Untuk x=−5, nilai kebenaran pernyataan berikut adalah ….", "options": ["√(x²)=x", "|x|=−x", "x²>0"], "key": [false, true, true], "kind": "bs", "why": "Akar utama tidak negatif: √(x²)=5, berbeda dari x=−5. Nilai mutlak |x|=5=−x dan x²=25>0.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B16", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-519", "cat": 0, "sub": "Persen dan perbandingan", "level": 2, "stem": "Modal sebuah barang Rp400000. Penjual ingin laba 25% dari modal. Harga jualnya … rupiah.", "options": ["600000", "400000", "500000", "480000", "530000"], "key": [2], "kind": "pg", "why": "Laba=25%×400000=100000; harga jual=modal+laba=500000.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B17", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-520", "cat": 0, "sub": "Operasi bilangan", "level": 2, "stem": "Hasil (1/5) ÷ (2/6) adalah ….", "options": ["1/6", "3/5", "5/3", "1/15", "6/5"], "key": [1], "kind": "pg", "why": "Pembagian pecahan diubah menjadi perkalian dengan kebalikan: (1/5)×(6/2)=3/5.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B18", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-521", "cat": 0, "sub": "Persen dan perbandingan", "level": 3, "stem": "Larutan A sebanyak 5 liter mengandung 20% gula. Larutan B sebanyak 10 liter mengandung 50% gula. Kadar gula campuran …%. Anggap volume dijumlahkan.", "options": ["40", "30", "35", "45", "70"], "key": [0], "kind": "pg", "why": "Jumlah gula=0,2×5+0,5×10=6 liter ekuivalen. Volume=15. Kadarnya 1,2/3=0,4=40%.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B19", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-522", "cat": 0, "sub": "Pangkat dan akar", "level": 2, "stem": "Nilai (2^−5) × (2^8) adalah ….", "options": ["2", "4", "16", "32", "8"], "key": [4], "kind": "pg", "why": "Pangkat dijumlahkan: −5+8=3. Jadi hasilnya 2³=8.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B20", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-523", "cat": 1, "sub": "Persamaan linear", "level": 3, "stem": "Sebanyak 50 tiket terjual. Tiket dewasa Rp20.000 dan anak Rp10.000. Pendapatan Rp800000. Banyak tiket dewasa adalah ….", "options": ["29", "32", "63", "30", "31"], "key": [3], "kind": "pg", "why": "Andaikan semua tiket anak, pendapatan Rp500000. Kelebihan Rp300000 berasal dari selisih Rp10.000 per tiket dewasa. Jumlah dewasa=30.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A21", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-524", "cat": 1, "sub": "Fungsi kuadrat", "level": 3, "stem": "Sebuah persegi panjang mempunyai keliling 40 meter. Luas maksimumnya … m².", "options": ["102", "203", "100", "101", "99"], "key": [2], "kind": "pg", "why": "p+l=20. Luas p(20−p) mencapai maksimum saat p=l=10. Luas maksimal=10×10=100.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A22", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-525", "cat": 1, "sub": "Fungsi kuadrat", "level": 2, "stem": "Fungsi f(x)=x²−10x+16 memotong sumbu x di x₁ dan x₂. Jumlah kedua akar adalah ….", "options": ["23", "10", "11", "9", "12"], "key": [1], "kind": "pg", "why": "Jumlah akar persamaan ax²+bx+c=0 adalah −b/a. Di sini −(−10)/1=10. Akar realnya 2 dan 8.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A23", "variant": 4, "source": "Latihan pengembangan"},
