k pojok: (0,0), (28,0), (16,24), (0,40). Laba berturut-turut 0, 84000, 96000, 80000. Maksimum Rp96000.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A05", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-148", "cat": 1, "sub": "Domain dan range", "level": 1, "stem": "Domain fungsi f(x) = (x+1)/(x−4) untuk x real adalah ….", "options": ["x ≥ 4", "x ≠ −4", "x ≤ 4", "x ∈ ℝ, x ≠ 4", "x ∈ ℝ"], "key": [3], "kind": "pg", "why": "Penyebut tidak boleh nol: x−4 ≠ 0, sehingga x ≠ 4.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A06", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-149", "cat": 1, "sub": "Domain dan range", "level": 2, "stem": "Fungsi f(x)=(x−4)²+3 memiliki domain ℝ. Range f adalah ….", "options": ["y ≥ 7", "y ≤ 3", "y ≥ 3", "y > 3", "y ≥ 0"], "key": [2], "kind": "pg", "why": "Kuadrat selalu ≥ 0 dan mencapai 0 saat x=4. Jadi nilai minimum f adalah 3, dan semua y ≥ 3 dapat dicapai.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A07", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-150", "cat": 1, "sub": "Invers dan komposisi", "level": 2, "stem": "Jika f(x)=4x+4, nilai f⁻¹(32) adalah ….", "options": ["8", "7", "4", "5", "6"], "key": [1], "kind": "pg", "why": "Balik operasi: f⁻¹(y)=(y−4)/4. Maka f⁻¹(32)=(32−4)/4=7.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A08", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-151", "cat": 1, "sub": "Invers dan komposisi", "level": 2, "stem": "Diketahui f(x)=2x+4 dan g(x)=x²−1. Nilai (f ∘ g)(3) adalah ….", "options": ["20", "21", "19", "22", "43"], "key": [0], "kind": "pg", "why": "(f ∘ g)(3)=f(g(3)). g(3)=9−1=8, sehingga f(8)=16+4=20.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A09", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-152", "cat": 1, "sub": "Invers dan komposisi", "level": 3, "stem": "Biaya sewa sepeda adalah f(t)=20000+8000t rupiah untuk t jam. Jika total biaya Rp68000, berapa lama sepeda disewa?", "options": ["4", "5", "7", "8", "6"], "key": [4], "kind": "pg", "why": "Kurangi biaya tetap: 68000−20000=48000. Bagi tarif per jam: 48000/8000=6 jam.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A10", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-153", "cat": 1, "sub": "Fungsi kuadrat", "level": 2, "stem": "Untuk f(x)=(x−4)²−4, tentukan benar atau salah.", "options": ["Grafik terbuka ke atas.", "Titik puncak grafik adalah (4, −4).", "Grafik tidak memotong sumbu x."], "key": [true, true, false], "kind": "bs", "why": "Koefisien x² positif. Bentuk puncak memberi titik (4,−4). Untuk f(x)=0, (x−4)²=4, jadi akar 2 dan 6; grafik memotong sumbu x.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A11", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-154", "cat": 1, "sub": "Barisan dan deret", "level": 1, "stem": "Barisan aritmetika memiliki suku pertama 4 dan beda 3. Suku ke-12 adalah ….", "options": ["39", "77", "37", "38", "36"], "key": [2], "kind": "pg", "why": "U₁₂ = a+(12−1)b = 4+11×3 = 37.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A12", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-155", "cat": 1, "sub": "Barisan dan deret", "level": 2, "stem": "Suatu aula memiliki 12 baris kursi. Baris pertama 14 kursi dan setiap baris berikutnya bertambah 2 kursi. Jumlah kursi adalah ….", "options": ["603", "300", "301", "299", "302"], "key": [1], "kind": "pg", "why": "S₁₂=12/2 × [2(14)+11×2] = 6×50 = 300. Ini jumlah, bukan suku terakhir.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A13", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-156", "cat": 1, "sub": "Barisan dan deret", "level": 2, "stem": "Suku pertama suatu barisan geometri adalah 4 dan rasionya 2. Jumlah lima suku pertama adalah ….", "options": ["124", "64", "120", "128", "248"], "key": [0], "kind": "pg", "why": "S₅=a(r⁵−1)/(r−1)=4(32−1)/(2−1)=124.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A14", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-157", "cat": 1, "sub": "Pertumbuhan dan bunga", "level": 2, "stem": "Koloni mula-mula berisi 400 sel. Jumlahnya menjadi dua kali lipat setiap 3 jam. Banyak sel setelah 9 jam adalah ….", "options": ["800", "1600", "2400", "6400", "3200"], "key": [4], "kind": "pg", "why": "Ada 9/3=3 periode pelipatan. Jumlah akhir=400×2³=3200.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A15", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-158", "cat": 1, "sub": "Pertumbuhan dan bunga", "level": 2, "stem": "Modal Rp4000000 diberi bunga tunggal 6% per tahun selama 3 tahun. Total modal dan bunga adalah … rupiah.", "options": ["4480000", "4800000", "4764064", "4720000", "4240000"], "key": [3], "kind": "pg", "why": "Bunga = modal × 6% × 3 = 720000. Total = 4000000+720000=4720000.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A16", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-159", "cat": 1, "sub": "Pertumbuhan dan bunga", "level": 2, "stem": "Tabungan Rp400000 mendapat bunga majemuk 10% setahun. Tanpa penarikan dan biaya, saldo setelah dua tahun adalah … rupiah.", "options": ["488000", "560000", "484000", "440000", "480000"], "key": [2], "kind": "pg", "why": "Saldo akhir=M(1+r)²=400000×1,1²=484000. Bunga tahun kedua dihitung dari saldo tahun pertama.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A17", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-160", "cat": 1, "sub": "Barisan dan deret", "level": 3, "stem": "Produksi mingguan mengikuti barisan Uₘ=4+4(m−1), untuk m≥1.", "options": ["Minggu ke-6 menghasilkan 24 unit.", "Jumlah produksi 6 minggu pertama adalah 84 unit.", "Kenaikan persentase dari minggu ke minggu selalu sama."], "key": [true, true, false], "kind": "bs", "why": "U₆=4+20. S₆=6/2×(2×4+5×4)=84. Selisih tetap 4, tetapi persentase 4/Uₘ berubah karena penyebut bertambah.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A18", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-161", "cat": 2, "sub": "Sudut dan garis", "level": 1, "stem": "Dua sudut dalam sepihak pada dua garis sejajar besarnya (4x+10)° dan (2x+30)°. Nilai x adalah ….", "options": ["70/3", "73/3", "67/3", "30", "50/3"], "key": [0], "kind": "pg", "why": "Sudut dalam sepihak berjumlah 180°. (4+2)x+40=180, sehingga x=140/6=70/3.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G01", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-162", "cat": 2, "sub": "Kesebangunan", "level": 2, "stem": "Tiang setinggi 12 m memiliki bayangan 8 m. Pada waktu yang sama, bayangan sebuah pohon 24 m. Tinggi pohon adalah … m.", "options": ["37", "35", "38", "75", "36"], "key": [4], "kind": "pg", "why": "Pada sudut datang matahari yang sama, tinggi/bayangan tetap. h/24=12/8. Jadi h=36 m.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G02", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-163", "cat": 2, "sub": "Pythagoras dan jarak", "level": 1, "stem": "Segitiga siku-siku memiliki kaki 12 cm dan 16 cm. Sisi miringnya … cm.", "options": ["24", "16", "32", "20", "28"], "key": [3], "kind": "pg", "why": "c=√[(12)²+(16)²]=√400=20 cm.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G03", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-164", "cat": 2, "sub": "Pythagoras dan jarak", "level": 2, "stem": "Balok memiliki panjang 12, lebar 16, dan tinggi 48 cm. Panjang diagonal ruangnya … cm.", "options": ["60", "76", "52", "20", "48"], "key": [2], "kind": "pg", "why": "Diagonal ruang d=√(p²+l²+t²)=√2704=52. Diagonal alasnya saja adalah 20.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G04", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-165", "cat": 2, "sub": "Transformasi titik", "level": 1, "stem": "Titik P(4, −3) ditranslasikan oleh vektor (4, 5). Bayangan P adalah ….", "options": ["(4, 9)", "(8, 2)", "(0, 2)", "(8, −8)", "(4, 2)"], "key": [1], "kind": "pg", "why": "Tambahkan tiap komponen: x′=4+4=8; y′=−3+5=2.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G05", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-166", "cat": 2, "sub": "Transformasi titik", "level": 1, "stem": "Bayangan titik A(4, −5) oleh refleksi terhadap garis y=x adalah ….", "options": ["(−5, 4)", "(4, 5)", "(4, −5)", "(−4, −5)", "(5, 5)"], "key": [0], "kind": "pg", "why": "Refleksi terhadap y=x menukar koordinat: (x,y)→(y,x). Maka (4,−5)→(−5,4).", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G06", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-167", "cat": 2, "sub": "Transformasi titik", "level": 2, "stem": "Titik (4, 3) diputar 90° berlawanan arah jarum jam terhadap O(0,0). Hasilnya ….", "options": ["(3, −4)", "(−4, −3)", "(3, 4)", "(5, −3)", "(−3, 4)"], "key": [4], "kind": "pg", "why": "Rotasi 90° berlawanan arah jarum jam: (x,y)→(−y,x), jadi (4,3)→(−3,4).", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G07", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-168", "cat": 2, "sub": "Transformasi titik", "level": 3, "stem": "Titik (4, 1) ditranslasikan (2, −3), lalu didilatasikan berpusat O dengan faktor 2. Koordinat akhirnya ….", "options": ["(8, −5)", "(12, 4)", "(8, −4)", "(12, −4)", "(10, −1)"], "key": [3], "kind": "pg", "why": "Sesudah translasi: (6,−2). Dilatasi berpusat O mengalikan kedua koordinat dengan 2, menghasilkan (12,−4).", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G08", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-169", "cat": 2, "sub": "Luas dan keliling", "level": 2, "stem": "Taman berbentuk persegi panjang 16 m × 12 m. Jalan selebar 1 m dibuat di sekeliling bagian dalam taman. Luas bagian taman yang tidak menjadi jalan … m².", "options": ["53", "190", "140", "192", "165"], "key": [2], "kind": "pg", "why": "Jalan berada di dalam pada kedua sisi. Ukuran sisa = (16−2) × (12−2), sehingga luas = 140 m².", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G09", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-170", "cat": 2, "sub": "Luas dan keliling", "level": 2, "stem": "Sebuah lingkaran berjari-jari 28 cm memiliki juring 90°. Luas juring tersebut … cm². Gunakan π=22/7.", "options": ["784", "616", "1232", "2464", "88"], "key": [1], "kind": "pg", "why": "Luas juring=(90/360)×πr²=¼×22/7×(28)²=616 cm².", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G10", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-171", "cat": 2, "sub": "Volume dan luas permukaan", "level": 2, "stem": "Tabung tertutup berjari-jari 7 cm dan tinggi 4 cm. Luas permukaannya … cm². Gunakan π=22/7.", "options": ["484", "176", "308", "616", "792"], "key": [0], "kind": "pg", "why": "Luas dua alas dan selimut: 2πr²+2πrt=2×22/7×7×(7+4)=484 cm².", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G11", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-172", "cat": 2, "sub": "Volume dan luas permukaan", "level": 2, "stem": "Kerucut berjari-jari 12 cm dan tinggi 16 cm memiliki volume … π cm³.", "options": ["2304", "144", "256", "1536", "768"], "key": [4], "kind": "pg", "why": "V=⅓πr²t=⅓π×(12)²×16=768π cm³.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G12", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-173", "cat": 2, "sub": "Pythagoras dan jarak", "level": 3, "stem": "Pada kubus ABCD.EFGH dengan rusuk 4 cm, E tepat di atas A. Jarak titik E ke garis AC adalah … cm.", "options": ["4√3", "4/2", "4√2/2", "4", "4√2"], "key": [3], "kind": "pg", "why": "AE tegak lurus bidang ABCD, sehingga AE juga tegak lurus garis AC melalui A. Kaki proyeksi E pada AC adalah A. Jadi jarak E ke AC=EA=4 cm.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G13", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-174", "cat": 2, "sub": "Pythagoras dan jarak", "level": 3, "stem": "Kubus ABCD.EFGH memiliki rusuk 8 cm. Jarak titik A ke bidang BCGF adalah … cm.", "options": ["4", "12", "8", "8√2", "8√3"], "key": [2], "kind": "pg", "why": "Bidang BCGF adalah sisi tegak melalui BC. AB tegak lurus bidang tersebut dan B adalah kaki proyeksi. Jadi jaraknya AB=8 cm.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G14", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-175", "cat": 2, "sub": "Kesebangunan", "level": 3, "stem": "Sebuah model persegi bersisi 4 cm diperbesar dengan faktor skala 3.", "options": ["Sisi hasil pembesaran 12 cm.", "Luas hasil pembesaran 3 kali luas awal.", "Keliling hasil pembesaran 3 kali keliling awal."], "key": [true, false, true], "kind": "bs", "why": "Panjang dan keliling dikalikan 3. Luas dikalikan 3²=9: luas awal 16 cm² menjadi 144 cm².", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G15", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-176", "cat": 2, "sub": "Luas dan keliling", "level": 3, "stem": "Sebuah persegi panjang mempunyai keliling 48 cm. (1) Panjangnya 16 cm. (2) Lebarnya 8 cm. Untuk menentukan luasnya, informasi mana yang cukup?", "options": ["Masing-masing pernyataan cukup.", "Hanya (1) cukup.", "Hanya (2) cukup.", "Harus memakai (1) dan (2) bersama.", "Keduanya tetap tidak cukup."], "key": [0], "kind": "pg", "why": "Dari keliling diperoleh p+l=24. (1) memberi l=8; (2) memberi p=16. Masing-masing cukup untuk menghitung luas 128 cm².", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G16", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-177", "cat": 3, "sub": "Rasio trigonometri", "level": 1, "stem": "Segitiga siku-siku memiliki sisi depan sudut θ sepanjang 12 cm dan sisi miring 20 cm. Nilai sin θ adalah ….", "options": ["4/5", "3/4", "5/3", "4/3", "3/5"], "key": [4], "kind": "pg", "why": "sin θ=depan/miring=12/20=3/5.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T01", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-178", "cat": 3, "sub": "Rasio trigonometri", "level": 2, "stem": "Pada segitiga siku-siku, sisi depan sudut θ=20 dan sisi sampingnya=48. Nilai sec θ adalah ….", "options": ["5/13", "13/5", "12/5", "13/12", "12/13"], "key": [3], "kind": "pg", "why": "Sisi miring = √[(20)²+(48)²]=52. sec θ=1/cos θ=miring/samping=13/12.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T02", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-179", "cat": 3, "sub": "Sudut istimewa", "level": 2, "stem": "Nilai 4 sin 30° + 2 cos 60° adalah ….", "options": ["4", "5", "3", "2", "6"], "key": [2], "kind": "pg", "why": "sin 30°=cos 60°=½. Hasil=4×½+2×½=3.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T03", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-180", "cat": 3, "sub": "Sudut dan kuadran", "level": 2, "stem": "Diketahui sin A=12/20 dan A sudut tumpul. Nilai cos A adalah ….", "options": ["-5/4", "-4/5", "4/5", "3/5", "-3/5"], "key": [1], "kind": "pg", "why": "sin A=3/5. Dari sin²A+cos²A=1 diperoleh |cos A|=4/5. Sudut tumpul berada di kuadran II, sehingga cos A negatif.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T04", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-181", "cat": 3, "sub": "Aplikasi trigonometri", "level": 2, "stem": "Tangga sepanjang 8 m bersandar pada tembok dan membentuk sudut 60° terhadap lantai. Tinggi ujung tangga dari lantai adalah … m.", "options": ["4√3", "4", "8√3", "4√2", "8"], "key": [0], "kind": "pg", "why": "Tinggi adalah sisi depan sudut 60°. h=L sin 60°=8×√3/2=4√3 m.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T05", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-182", "cat": 3, "sub": "Aplikasi trigonometri", "level": 2, "stem": "Pengamat berada 40 m dari kaki menara di tanah datar. Sudut elevasi ke puncak 45°. Jika tinggi mata 1,5 m, tinggi menara adalah … m.", "options": ["40", "38,5", "80", "21,5", "41,5"], "key": [4], "kind": "pg", "why": "Selisih tinggi puncak dan mata = jarak × tan45°=40. Tinggi menara=40+1,5=41,5 m.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T06", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-183", "cat": 3, "sub": "Rasio trigonometri", "level": 2, "stem": "Untuk sudut lancip θ dengan tan θ=12/16, pilih semua pernyataan yang benar.", "options": ["sin θ = 3/5", "cos θ = 4/5", "cot θ = 3/4", "csc θ = 5/3", "sec θ = 4/5"], "key": [0, 1, 3], "kind": "multi", "why": "Gunakan segitiga sebanding 3–4–5. sin=3/5, cos=4/5, cot=4/3, csc=5/3, dan sec=5/4.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T07", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-184", "cat": 3, "sub": "Aplikasi trigonometri", "level": 3, "stem": "Dua titik pengamatan segaris dengan kaki menara. Titik dekat berjarak 4√3 m dari kaki menara dan sudut elevasinya 60°. Dari titik jauh sudut elevasinya 30°. Jarak kedua titik pengamatan adalah … m.", "options": ["16√3", "12", "8√3", "4√3", "12√3"], "key": [2], "kind": "pg", "why": "Tinggi menara=4√3×tan60°=12. Jarak titik jauh=12/tan30°=12√3. Selisih jarak=(12−4)√3=8√3.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T08", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-185", "cat": 4, "sub": "Data tunggal", "level": 1, "stem": "Rata-rata data 5, 7, 9, 11, 13 adalah ….", "options": ["21", "9", "10", "8", "11"], "key": [1], "kind": "pg", "why": "Jumlah data=45, banyak data=5. Rata-rata=45/5=9.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D01", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-186", "cat": 4, "sub": "Data tunggal", "level": 1, "stem": "Median data 4, 11, 6, 9, 5, 7 adalah ….", "options": ["6,5", "6", "7", "7,5", "8"], "key": [0], "kind": "pg", "why": "Urutkan: 4, 5, 6, 7, 9, 11. Median rata-rata data ke-3 dan ke-4: (6+7)/2=6,5.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D02", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-187", "cat": 4, "sub": "Data tunggal", "level": 2, "stem": "Data 4, 6, 8 dianggap sebagai seluruh populasi. Varians populasinya adalah ….", "options": ["4/3", "4", "8", "2/3", "8/3"], "key": [4], "kind": "pg", "why": "Rata-rata=6. Kuadrat simpangan: 4,0,4. Varians populasi=(4+0+4)/3=8/3.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D03", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-188", "cat": 4, "sub": "Data tunggal", "level": 2, "stem": "Rata-rata 10 siswa adalah 74; rata-rata 5 siswa lainnya 84. Rata-rata gabungan 15 siswa adalah ….", "options": ["74", "84", "235/3", "232/3", "79"], "key": [3], "kind": "pg", "why": "Jumlah nilai=10×74+5×84=1160. Bagi 15, diperoleh 232/3.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D04", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-189", "cat": 4, "sub": "Penyajian data", "level": 2, "stem": "Diagram menunjukkan jumlah pengunjung perpustakaan. Kenaikan terbesar dibanding hari sebelumnya terjadi pada ….", "options": ["Rabu", "Jumat", "Kamis", "Senin", "Selasa"], "key": [2], "kind": "pg", "why": "Perubahan harian: Selasa +8, Rabu −4, Kamis +24, Jumat +12. Kenaikan terbesar pada Kamis, bukan hari dengan jumlah pengunjung tertinggi.", "visual": "<svg viewBox=\"0 0 500 200\" role=\"img\" aria-label=\"Diagram jumlah pengunjung per hari\"><rect x=\"25\" y=\"83.33333333333334\" width=\"48\" height=\"76.66666666666666\" rx=\"6\" fill=\"#7870e8\"/><text x=\"49\" y=\"72.33333333333334\" text-anchor=\"middle\" fill=\"currentColor\">80</text><text x=\"49\" y=\"184\" text-anchor=\"middle\" fill=\"currentColor\">Sen</text><rect x=\"120\" y=\"75.66666666666667\" width=\"48\" height=\"84.33333333333333\" rx=\"6\" fill=\"#7870e8\"/><text x=\"144\" y=\"64.66666666666667\" text-anchor=\"middle\" fill=\"currentColor\">88</text><text x=\"144\" y=\"184\" text-anchor=\"middle\" fill=\"currentColor\">Sel</text><rect x=\"215\" y=\"79.5\" width=\"48\" height=\"80.5\" rx=\"6\" fill=\"#7870e8\"/><text x=\"239\" y=\"68.5\" text-anchor=\"middle\" fill=\"currentColor\">84</text><text x=\"239\" y=\"184\" text-anchor=\"middle\" fill=\"currentColor\">Rab</text><rect x=\"310\" y=\"56.5\" width=\"48\" height=\"103.5\" rx=\"6\" fill=\"#7870e8\"/><text x=\"334\" y=\"45.5\" text-anchor=\"middle\" fill=\"currentColor\">108</text><text x=\"334\" y=\"184\" text-anchor=\"middle\" fill=\"currentColor\">Kam</text><rect x=\"405\" y=\"45.0\" width=\"48\" height=\"115.0\" rx=\"6\" fill=\"#7870e8\"/><text x=\"429\" y=\"34.0\" text-anchor=\"middle\" fill=\"currentColor\">120</text><text x=\"429\" y=\"184\" text-anchor=\"middle\" fill=\"currentColor\">Jum</text></svg>", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D05", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-190", "cat": 4, "sub": "Penyajian data", "level": 2, "stem": "Diagram lingkaran menunjukkan 160 peserta memilih kegiatan. Sektor olahraga bersudut 90°. Banyak peserta yang memilih olahraga adalah ….", "options": ["83", "40", "41", "39", "42"], "key": [1], "kind": "pg", "why": "Bagian olahraga=90/360=¼. Jumlah peserta=¼×160=40.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D06", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-191", "cat": 4, "sub": "Data kelompok", "level": 2, "stem": "Tentukan perkiraan rata-rata dari tabel frekuensi berikut.", "options": ["57", "58", "56", "59", "117"], "key": [0], "kind": "pg", "why": "Titik tengah kelas: 52, 57, 62. Rata-rata=[2×52+6×57+2×62]/10=57.", "visual": "<div class=\"table-wrap\"><table><thead><tr><th>Nilai</th><th>Frekuensi</th></tr></thead><tbody><tr><td>50–54</td><td>2</td></tr><tr><td>55–59</td><td>6</td></tr><tr><td>60–64</td><td>2</td></tr></tbody></table></div>", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D07", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-192", "cat": 4, "sub": "Data kelompok", "level": 2, "stem": "Modus data berkelompok berikut, menggunakan interpolasi kelas, adalah ….", "options": ["69,5", "70", "75", "79,5", "74,5"], "key": [4], "kind": "pg", "why": "Kelas modus 70–79; tepi bawah 69.5; lebar kelas 10. d₁=8−4=4 dan d₂=8−4=4. Mo=69.5+[4/(4+4)]×10=74.5.", "visual": "<div class=\"table-wrap\"><table><thead><tr><th>Nilai</th><th>Frekuensi</th></tr></thead><tbody><tr><td>60–69</td><td>4</td></tr><tr><td>70–79</td><td>8</td></tr><tr><td>80–89</td><td>4</td></tr></tbody></table></div>", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D08", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-193", "cat": 4, "sub": "Aturan pencacahan", "level": 1, "stem": "Sebuah kantin menyediakan 6 jenis makanan dan 4 jenis minuman. Satu paket terdiri dari satu makanan dan satu minuman. Banyak paket berbeda adalah ….", "options": ["16", "36", "26", "24", "10"], "key": [3], "kind": "pg", "why": "Gunakan aturan perkalian: 6 pilihan makanan × 4 pilihan minuman = 24 paket.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D09", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-194", "cat": 4, "sub": "Aturan pencacahan", "level": 2, "stem": "Dari 8 siswa dipilih ketua dan sekretaris. Satu siswa tidak boleh memegang dua jabatan. Banyak susunan pengurus adalah ….", "options": ["8", "16", "56", "28", "64"], "key": [2], "kind": "pg", "why": "Jabatan berbeda sehingga urutan penting. Ketua punya 8 pilihan; sekretaris 7. Total=56.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D10", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-195", "cat": 4, "sub": "Aturan pencacahan", "level": 2, "stem": "Dari 9 anggota klub, dipilih 2 orang sebagai delegasi tanpa jabatan berbeda. Banyak pilihan delegasi adalah ….", "options": ["18", "36", "72", "81", "9"], "key": [1], "kind": "pg", "why": "Urutan tidak penting. C(9,2)=(9×8)/2=36.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D11", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-196", "cat": 4, "sub": "Peluang majemuk", "level": 2, "stem": "Kotak berisi 4 bola merah dan 6 bola biru. Dua bola diambil berurutan tanpa pengembalian. Peluang bola pertama merah dan kedua biru adalah ….", "options": ["4/15", "6/25", "2/5", "3/5", "1/2"], "key": [0], "kind": "pg", "why": "P(merah pertama)=4/10. Setelah merah terambil, tersisa 9 bola dan 6 di antaranya biru. Kalikan: 4/10 × 6/9 = 4/15.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D12", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-197", "cat": 4, "sub": "Peluang majemuk", "level": 2, "stem": "Peluang seorang atlet mengenai sasaran pada tiap tembakan adalah 4/10. Dua tembakan saling independen. Peluang keduanya mengenai sasaran adalah ….", "options": ["2/5", "4/5", "21/25", "2/25", "4/25"], "key": [4], "kind": "pg", "why": "Karena independen, P(keduanya kena)=(4/10)×(4/10)=4/25.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D13", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-198", "cat": 4, "sub": "Data tunggal", "level": 3, "stem": "Seluruh nilai data 4, 6, 8, 10 ditambah 5. Pilih semua pernyataan yang benar.", "options": ["Rata-rata bertambah 5.", "Median bertambah 5.", "Jangkauan bertambah 5.", "Simpangan baku tetap.", "Varians bertambah 25."], "key": [0, 1, 3], "kind": "multi", "why": "Penambahan konstanta menggeser pusat data: mean dan median naik 5. Selisih antarnilai tidak berubah; jangkauan, varians, dan simpangan baku tetap.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D14", "variant": 3, "source": "Latihan pengembangan"}, {"id": "MTK-199", "cat": 0, "sub": "Operasi bilangan", "level": 1, "stem": "Nilai 5 + 8 × 4 − 6 adalah ….", "options": ["33", "65", "31", "32", "30"], "key": [2], "kind": "pg", "why": "Kerjakan perkalian dahulu: 8 × 4 = 32. Lalu 5 + 32 − 6 = 31.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B01", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-200", "cat": 0, "sub": "Operasi bilangan", "level": 1, "stem": "Hasil 5/3 + 1/2 adalah ….", "options": ["25/6", "13/6", "7/3", "2", "19/6"], "key": [1], "kind": "pg", "why": "Samakan penyebut menjadi 6: 10/6 + 3/6 = 13/6.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B02", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-201", "cat": 0, "sub": "Pangkat dan akar", "level": 1, "stem": "Bentuk sederhana 2^8 ÷ 2^5 adalah ….", "options": ["8", "2", "4", "16", "32"], "key": [0], "kind": "pg", "why": "Untuk basis sama, kurangi pangkat: 2^(8 − 5) = 2³ = 8.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B03", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-202", "cat": 0, "sub": "Pangkat dan akar", "level": 2, "stem": "Nilai (125)^(2/3) adalah ….", "options": ["5", "125", "26", "27", "25"], "key": [4], "kind": "pg", "why": "Akar pangkat tiga dari 125 adalah 5; kuadratkan hasilnya: 5² = 25.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B04", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-203", "cat": 0, "sub": "Pangkat dan akar", "level": 2, "stem": "Bentuk paling sederhana √200 + √450 adalah ….", "options": ["25√5", "30√2", "25√3", "25√2", "5√2"], "key": [3], "kind": "pg", "why": "√200 = 10√2 dan √450 = 15√2. Jumlahnya 25√2.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B05", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-204", "cat": 0, "sub": "Persen dan perbandingan", "level": 2, "stem": "Sebuah tas berharga Rp500.000. Diskon 20% dilanjutkan diskon 10% dari harga setelah diskon pertama. Harga akhir (rupiah) adalah ….", "options": ["450000", "300000", "360000", "350000", "400000"], "key": [2], "kind": "pg", "why": "Harga setelah diskon pertama = 0,8 × 500000 = 400000. Diskon kedua diterapkan pada harga ini: 0,9 × 400000 = 360000.", "visual": "", "tip": "Diskon berurutan dikalikan, bukan dijumlahkan.", "pattern": "B06", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-205", "cat": 0, "sub": "Persen dan perbandingan", "level": 2, "stem": "Dalam campuran sirup dan air, perbandingan volumenya 2 : 5. Jika volume campuran 35 liter, banyak sirup adalah … liter.", "options": ["23", "10", "11", "9", "12"], "key": [1], "kind": "pg", "why": "Jumlah bagian = 2 + 5 = 7. Satu bagian = 35/7 = 5 liter. Sirup = 2 × 5 = 10 liter.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B07", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-206", "cat": 0, "sub": "Sifat bilangan", "level": 2, "stem": "Untuk a = 5 dan b = 6, tentukan benar atau salah.", "options": ["a + b = b + a", "a ÷ b = b ÷ a", "a(b + 2) = ab + 2a"], "key": [true, false, true], "kind": "bs", "why": "Penjumlahan komutatif. Pembagian tidak komutatif karena 5/6 ≠ 6/5. Perkalian distributif: a(b+2)=ab+2a.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B08", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-207", "cat": 0, "sub": "Sifat bilangan", "level": 1, "stem": "Pilih semua bilangan rasional berikut.", "options": ["√25", "√26", "5/7", "0,125", "π"], "key": [0, 2, 3], "kind": "multi", "why": "√25 = 5, 5/7, dan 0,125 = 1/8 adalah rasional. 26 bukan kuadrat sempurna; akarnya irasional. π juga irasional.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B09", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-208", "cat": 0, "sub": "Persen dan perbandingan", "level": 3, "stem": "Harga suatu barang naik 25% menjadi Rp625000. Agar kembali ke harga semula Rp500000, harga baru perlu diturunkan sebesar …%.", "options": ["25", "30", "40", "20", "15"], "key": [3], "kind": "pg", "why": "Penurunan = 125000. Persentase dihitung terhadap harga baru: 125000/625000 × 100% = 20%.", "visual": "", "tip": "Tentukan nilai dasar yang dipakai menghitung persen.", "pattern": "B10", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-209", "cat": 1, "sub": "Persamaan linear", "level": 2, "stem": "Dua roti dan tiga susu berharga Rp22500. Satu roti dan satu susu berharga Rp9500. Harga satu roti adalah … rupiah.", "options": ["8000", "5500", "6000", "3500", "7000"], "key": [2], "kind": "pg", "why": "Misalkan harga roti r dan susu s. Dari r+s=9500, diperoleh 2r+2s=19000. Kurangkan dari 2r+3s=22500: s=3500. Maka r=9500−3500=6000.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A01", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-210", "cat": 1, "sub": "Persamaan linear", "level": 2, "stem": "Diketahui x+y+z=18, x−y=1, dan z=7. Nilai x adalah ….", "options": ["15", "6", "7", "5", "8"], "key": [1], "kind": "pg", "why": "Substitusi z=7: x+y=11. Jumlahkan dengan x−y=1 sehingga 2x=12 dan x=6.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A02", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-211", "cat": 1, "sub": "Pertidaksamaan linear", "level": 1, "stem": "Himpunan penyelesaian −2x + 10 > 4 adalah ….", "options": ["x < 3", "x > 3", "x ≤ 3", "x ≥ 3", "x < 7"], "key": [0], "kind": "pg", "why": "−2x > -6. Pembagian oleh −2 membalik tanda pertidaksamaan sehingga x < 3.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A03", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-212", "cat": 1, "sub": "Pertidaksamaan linear", "level": 2, "stem": "Pilih semua titik yang memenuhi x ≥ 0, y ≥ 0, dan x+y ≤ 10.", "options": ["(5, 5)", "(0, 10)", "(10, 1)", "(−1, 5)", "(4, 5)"], "key": [0, 1, 4], "kind": "multi", "why": "Uji tiap koordinat. Jumlah x+y berturut-turut 10, 10, 11, 4, dan 9. Pilihan keempat gagal karena x negatif; pilihan ketiga melampaui batas.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A04", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-213", "cat": 1, "sub": "Program linear", "level": 3, "stem": "Usaha kerajinan membuat x paket A dan y paket B. Batasnya x+y ≤ 50, 2x+y ≤ 70, x,y ≥ 0. Laba A Rp3.000 dan B Rp2.000 per paket. Laba maksimum adalah … rupiah.", "options": ["100000", "150000", "140000", "120000", "105000"], "key": [3], "kind": "pg", "why": "Titik pojok: (0,0), (35,0), (20,30), (0,50). Laba berturut-turut 0, 105000, 120000, 100000. Maksimum Rp120000.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A05", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-214", "cat": 1, "sub": "Domain dan range", "level": 1, "stem": "Domain fungsi f(x) = (x+1)/(x−5) untuk x real adalah ….", "options": ["x ≠ −5", "x ≤ 5", "x ∈ ℝ, x ≠ 5", "x ∈ ℝ", "x ≥ 5"], "key": [2], "kind": "pg", "why": "Penyebut tidak boleh nol: x−5 ≠ 0, sehingga x ≠ 5.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A06", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-215", "cat": 1, "sub": "Domain dan range", "level": 2, "stem": "Fungsi f(x)=(x−5)²+3 memiliki domain ℝ. Range f adalah ….", "options": ["y ≤ 3", "y ≥ 3", "y > 3", "y ≥ 0", "y ≥ 8"], "key": [1], "kind": "pg", "why": "Kuadrat selalu ≥ 0 dan mencapai 0 saat x=5. Jadi nilai minimum f adalah 3, dan semua y ≥ 3 dapat dicapai.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A07", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-216", "cat": 1, "sub": "Invers dan komposisi", "level": 2, "stem": "Jika f(x)=5x+4, nilai f⁻¹(39) adalah ….", "options": ["7", "4", "5", "6", "8"], "key": [0], "kind": "pg", "why": "Balik operasi: f⁻¹(y)=(y−4)/5. Maka f⁻¹(39)=(39−4)/5=7.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A08", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-217", "cat": 1, "sub": "Invers dan komposisi", "level": 2, "stem": "Diketahui f(x)=2x+5 dan g(x)=x²−1. Nilai (f ∘ g)(3) adalah ….", "options": ["22", "20", "23", "45", "21"], "key": [4], "kind": "pg", "why": "(f ∘ g)(3)=f(g(3)). g(3)=9−1=8, sehingga f(8)=16+5=21.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A09", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-218", "cat": 1, "sub": "Invers dan komposisi", "level": 3, "stem": "Biaya sewa sepeda adalah f(t)=25000+8000t rupiah untuk t jam. Jika total biaya Rp73000, berapa lama sepeda disewa?", "options": ["5", "7", "8", "6", "4"], "key": [3], "kind": "pg", "why": "Kurangi biaya tetap: 73000−25000=48000. Bagi tarif per jam: 48000/8000=6 jam.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A10", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-219", "cat": 1, "sub": "Fungsi kuadrat", "level": 2, "stem": "Untuk f(x)=(x−5)²−4, tentukan benar atau salah.", "options": ["Grafik terbuka ke atas.", "Titik puncak grafik adalah (5, −4).", "Grafik tidak memotong sumbu x."], "key": [true, true, false], "kind": "bs", "why": "Koefisien x² positif. Bentuk puncak memberi titik (5,−4). Untuk f(x)=0, (x−5)²=4, jadi akar 3 dan 7; grafik memotong sumbu x.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A11", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-220", "cat": 1, "sub": "Barisan dan deret", "level": 1, "stem": "Barisan aritmetika memiliki suku pertama 5 dan beda 3. Suku ke-12 adalah ….", "options": ["79", "38", "39", "37", "40"], "key": [1], "kind": "pg", "why": "U₁₂ = a+(12−1)b = 5+11×3 = 38.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A12", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-221", "cat": 1, "sub": "Barisan dan deret", "level": 2, "stem": "Suatu aula memiliki 12 baris kursi. Baris pertama 15 kursi dan setiap baris berikutnya bertambah 2 kursi. Jumlah kursi adalah ….", "options": ["312", "313", "311", "314", "627"], "key": [0], "kind": "pg", "why": "S₁₂=12/2 × [2(15)+11×2] = 6×52 = 312. Ini jumlah, bukan suku terakhir.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A13", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-222", "cat": 1, "sub": "Barisan dan deret", "level": 2, "stem": "Suku pertama suatu barisan geometri adalah 5 dan rasionya 2. Jumlah lima suku pertama adalah ….", "options": ["80", "150", "160", "310", "155"], "key": [4], "kind": "pg", "why": "S₅=a(r⁵−1)/(r−1)=5(32−1)/(2−1)=155.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A14", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-223", "cat": 1, "sub": "Pertumbuhan dan bunga", "level": 2, "stem": "Koloni mula-mula berisi 500 sel. Jumlahnya menjadi dua kali lipat setiap 3 jam. Banyak sel setelah 9 jam adalah ….", "options": ["2000", "3000", "8000", "4000", "1000"], "key": [3], "kind": "pg", "why": "Ada 9/3=3 periode pelipatan. Jumlah akhir=500×2³=4000.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A15", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-224", "cat": 1, "sub": "Pertumbuhan dan bunga", "level": 2, "stem": "Modal Rp5000000 diberi bunga tunggal 6% per tahun selama 3 tahun. Total modal dan bunga adalah … rupiah.", "options": ["6000000", "5955080", "5900000", "5300000", "5600000"], "key": [2], "kind": "pg", "why": "Bunga = modal × 6% × 3 = 900000. Total = 5000000+900000=5900000.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A16", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-225", "cat": 1, "sub": "Pertumbuhan dan bunga", "level": 2, "stem": "Tabungan Rp500000 mendapat bunga majemuk 10% setahun. Tanpa penarikan dan biaya, saldo setelah dua tahun adalah … rupiah.", "options": ["700000", "605000", "550000", "600000", "610000"], "key": [1], "kind": "pg", "why": "Saldo akhir=M(1+r)²=500000×1,1²=605000. Bunga tahun kedua dihitung dari saldo tahun pertama.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A17", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-226", "cat": 1, "sub": "Barisan dan deret", "level": 3, "stem": "Produksi mingguan mengikuti barisan Uₘ=5+4(m−1), untuk m≥1.", "options": ["Minggu ke-6 menghasilkan 25 unit.", "Jumlah produksi 6 minggu pertama adalah 90 unit.", "Kenaikan persentase dari minggu ke minggu selalu sama."], "key": [true, true, false], "kind": "bs", "why": "U₆=5+20. S₆=6/2×(2×5+5×4)=90. Selisih tetap 4, tetapi persentase 4/Uₘ berubah karena penyebut bertambah.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A18", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-227", "cat": 2, "sub": "Sudut dan garis", "level": 1, "stem": "Dua sudut dalam sepihak pada dua garis sejajar besarnya (5x+10)° dan (2x+30)°. Nilai x adalah ….", "options": ["21", "19", "180/7", "100/7", "20"], "key": [4], "kind": "pg", "why": "Sudut dalam sepihak berjumlah 180°. (5+2)x+40=180, sehingga x=140/7=20.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G01", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-228", "cat": 2, "sub": "Kesebangunan", "level": 2, "stem": "Tiang setinggi 15 m memiliki bayangan 10 m. Pada waktu yang sama, bayangan sebuah pohon 30 m. Tinggi pohon adalah … m.", "options": ["44", "47", "93", "45", "46"], "key": [3], "kind": "pg", "why": "Pada sudut datang matahari yang sama, tinggi/bayangan tetap. h/30=15/10. Jadi h=45 m.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G02", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-229", "cat": 2, "sub": "Pythagoras dan jarak", "level": 1, "stem": "Segitiga siku-siku memiliki kaki 15 cm dan 20 cm. Sisi miringnya … cm.", "options": ["20", "40", "25", "35", "30"], "key": [2], "kind": "pg", "why": "c=√[(15)²+(20)²]=√625=25 cm.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G03", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-230", "cat": 2, "sub": "Pythagoras dan jarak", "level": 2, "stem": "Balok memiliki panjang 15, lebar 20, dan tinggi 60 cm. Panjang diagonal ruangnya … cm.", "options": ["95", "65", "25", "60", "75"], "key": [1], "kind": "pg", "why": "Diagonal ruang d=√(p²+l²+t²)=√4225=65. Diagonal alasnya saja adalah 25.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G04", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-231", "cat": 2, "sub": "Transformasi titik", "level": 1, "stem": "Titik P(5, −3) ditranslasikan oleh vektor (4, 5). Bayangan P adalah ….", "options": ["(9, 2)", "(1, 2)", "(9, −8)", "(5, 2)", "(4, 10)"], "key": [0], "kind": "pg", "why": "Tambahkan tiap komponen: x′=5+4=9; y′=−3+5=2.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G05", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-232", "cat": 2, "sub": "Transformasi titik", "level": 1, "stem": "Bayangan titik A(5, −5) oleh refleksi terhadap garis y=x adalah ….", "options": ["(5, 5)", "(5, −5)", "(−5, −5)", "(6, 5)", "(−5, 5)"], "key": [4], "kind": "pg", "why": "Refleksi terhadap y=x menukar koordinat: (x,y)→(y,x). Maka (5,−5)→(−5,5).", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G06", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-233", "cat": 2, "sub": "Transformasi titik", "level": 2, "stem": "Titik (5, 3) diputar 90° berlawanan arah jarum jam terhadap O(0,0). Hasilnya ….", "options": ["(−5, −3)", "(3, 5)", "(6, −3)", "(−3, 5)", "(3, −5)"], "key": [3], "kind": "pg", "why": "Rotasi 90° berlawanan arah jarum jam: (x,y)→(−y,x), jadi (5,3)→(−3,5).", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G07", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-234", "cat": 2, "sub": "Transformasi titik", "level": 3, "stem": "Titik (5, 1) ditranslasikan (2, −3), lalu didilatasikan berpusat O dengan faktor 2. Koordinat akhirnya ….", "options": ["(14, 4)", "(10, −4)", "(14, −4)", "(12, −1)", "(9, −5)"], "key": [2], "kind": "pg", "why": "Sesudah translasi: (7,−2). Dilatasi berpusat O mengalikan kedua koordinat dengan 2, menghasilkan (14,−4).", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G08", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-235", "cat": 2, "sub": "Luas dan keliling", "level": 2, "stem": "Taman berbentuk persegi panjang 20 m × 15 m. Jalan selebar 1 m dibuat di sekeliling bagian dalam taman. Luas bagian taman yang tidak menjadi jalan … m².", "options": ["298", "234", "300", "266", "67"], "key": [1], "kind": "pg", "why": "Jalan berada di dalam pada kedua sisi. Ukuran sisa = (20−2) × (15−2), sehingga luas = 234 m².", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G09", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-236", "cat": 2, "sub": "Luas dan keliling", "level": 2, "stem": "Sebuah lingkaran berjari-jari 35 cm memiliki juring 90°. Luas juring tersebut … cm². Gunakan π=22/7.", "options": ["1925/2", "1925", "3850", "110", "1225"], "key": [0], "kind": "pg", "why": "Luas juring=(90/360)×πr²=¼×22/7×(35)²=1925/2 cm².", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G10", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-237", "cat": 2, "sub": "Volume dan luas permukaan", "level": 2, "stem": "Tabung tertutup berjari-jari 7 cm dan tinggi 5 cm. Luas permukaannya … cm². Gunakan π=22/7.", "options": ["220", "308", "770", "836", "528"], "key": [4], "kind": "pg", "why": "Luas dua alas dan selimut: 2πr²+2πrt=2×22/7×7×(7+5)=528 cm².", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G11", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-238", "cat": 2, "sub": "Volume dan luas permukaan", "level": 2, "stem": "Kerucut berjari-jari 15 cm dan tinggi 20 cm memiliki volume … π cm³.", "options": ["225", "500", "3000", "1500", "4500"], "key": [3], "kind": "pg", "why": "V=⅓πr²t=⅓π×(15)²×20=1500π cm³.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G12", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-239", "cat": 2, "sub": "Pythagoras dan jarak", "level": 3, "stem": "Pada kubus ABCD.EFGH dengan rusuk 5 cm, E tepat di atas A. Jarak titik E ke garis AC adalah … cm.", "options": ["5/2", "5√2/2", "5", "5√2", "5√3"], "key": [2], "kind": "pg", "why": "AE tegak lurus bidang ABCD, sehingga AE juga tegak lurus garis AC melalui A. Kaki proyeksi E pada AC adalah A. Jadi jarak E ke AC=EA=5 cm.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G13", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-240", "cat": 2, "sub": "Pythagoras dan jarak", "level": 3, "stem": "Kubus ABCD.EFGH memiliki rusuk 10 cm. Jarak titik A ke bidang BCGF adalah … cm.", "options": ["15", "10", "10√2", "10√3", "5"], "key": [1], "kind": "pg", "why": "Bidang BCGF adalah sisi tegak melalui BC. AB tegak lurus bidang tersebut dan B adalah kaki proyeksi. Jadi jaraknya AB=10 cm.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G14", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-241", "cat": 2, "sub": "Kesebangunan", "level": 3, "stem": "Sebuah model persegi bersisi 5 cm diperbesar dengan faktor skala 3.", "options": ["Sisi hasil pembesaran 15 cm.", "Luas hasil pembesaran 3 kali luas awal.", "Keliling hasil pembesaran 3 kali keliling awal."], "key": [true, false, true], "kind": "bs", "why": "Panjang dan keliling dikalikan 3. Luas dikalikan 3²=9: luas awal 25 cm² menjadi 225 cm².", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G15", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-242", "cat": 2, "sub": "Luas dan keliling", "level": 3, "stem": "Sebuah persegi panjang mempunyai keliling 60 cm. (1) Panjangnya 20 cm. (2) Lebarnya 10 cm. Untuk menentukan luasnya, informasi mana yang cukup?", "options": ["Hanya (1) cukup.", "Hanya (2) cukup.", "Harus memakai (1) dan (2) bersama.", "Keduanya tetap tidak cukup.", "Masing-masing pernyataan cukup."], "key": [4], "kind": "pg", "why": "Dari keliling diperoleh p+l=30. (1) memberi l=10; (2) memberi p=20. Masing-masing cukup untuk menghitung luas 200 cm².", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G16", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-243", "cat": 3, "sub": "Rasio trigonometri", "level": 1, "stem": "Segitiga siku-siku memiliki sisi depan sudut θ sepanjang 15 cm dan sisi miring 25 cm. Nilai sin θ adalah ….", "options": ["3/4", "5/3", "4/3", "3/5", "4/5"], "key": [3], "kind": "pg", "why": "sin θ=depan/miring=15/25=3/5.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T01", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-244", "cat": 3, "sub": "Rasio trigonometri", "level": 2, "stem": "Pada segitiga siku-siku, sisi depan sudut θ=25 dan sisi sampingnya=60. Nilai sec θ adalah ….", "options": ["13/5", "12/5", "13/12", "12/13", "5/13"], "key": [2], "kind": "pg", "why": "Sisi miring = √[(25)²+(60)²]=65. sec θ=1/cos θ=miring/samping=13/12.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T02", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-245", "cat": 3, "sub": "Sudut istimewa", "level": 2, "stem": "Nilai 5 sin 30° + 2 cos 60° adalah ….", "options": ["6", "7/2", "5/2", "7", "9/2"], "key": [1], "kind": "pg", "why": "sin 30°=cos 60°=½. Hasil=5×½+2×½=7/2.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T03", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-246", "cat": 3, "sub": "Sudut dan kuadran", "level": 2, "stem": "Diketahui sin A=15/25 dan A sudut tumpul. Nilai cos A adalah ….", "options": ["-4/5", "4/5", "3/5", "-3/5", "-5/4"], "key": [0], "kind": "pg", "why": "sin A=3/5. Dari sin²A+cos²A=1 diperoleh |cos A|=4/5. Sudut tumpul berada di kuadran II, sehingga cos A negatif.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T04", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-247", "cat": 3, "sub": "Aplikasi trigonometri", "level": 2, "stem": "Tangga sepanjang 10 m bersandar pada tembok dan membentuk sudut 60° terhadap lantai. Tinggi ujung tangga dari lantai adalah … m.", "options": ["5", "10√3", "5√2", "10", "5√3"], "key": [4], "kind": "pg", "why": "Tinggi adalah sisi depan sudut 60°. h=L sin 60°=10×√3/2=5√3 m.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T05", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-248", "cat": 3, "sub": "Aplikasi trigonometri", "level": 2, "stem": "Pengamat berada 50 m dari kaki menara di tanah datar. Sudut elevasi ke puncak 45°. Jika tinggi mata 1,5 m, tinggi menara adalah … m.", "options": ["48,5", "100", "26,5", "51,5", "50"], "key": [3], "kind": "pg", "why": "Selisih tinggi puncak dan mata = jarak × tan45°=50. Tinggi menara=50+1,5=51,5 m.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T06", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-249", "cat": 3, "sub": "Rasio trigonometri", "level": 2, "stem": "Untuk sudut lancip θ dengan tan θ=15/20, pilih semua pernyataan yang benar.", "options": ["sin θ = 3/5", "cos θ = 4/5", "cot θ = 3/4", "csc θ = 5/3", "sec θ = 4/5"], "key": [0, 1, 3], "kind": "multi", "why": "Gunakan segitiga sebanding 3–4–5. sin=3/5, cos=4/5, cot=4/3, csc=5/3, dan sec=5/4.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T07", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-250", "cat": 3, "sub": "Aplikasi trigonometri", "level": 3, "stem": "Dua titik pengamatan segaris dengan kaki menara. Titik dekat berjarak 5√3 m dari kaki menara dan sudut elevasinya 60°. Dari titik jauh sudut elevasinya 30°. Jarak kedua titik pengamatan adalah … m.", "options": ["15", "10√3", "5√3", "15√3", "20√3"], "key": [1], "kind": "pg", "why": "Tinggi menara=5√3×tan60°=15. Jarak titik jauh=15/tan30°=15√3. Selisih jarak=(15−5)√3=10√3.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "T08", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-251", "cat": 4, "sub": "Data tunggal", "level": 1, "stem": "Rata-rata data 6, 8, 10, 12, 14 adalah ….", "options": ["10", "11", "9", "12", "23"], "key": [0], "kind": "pg", "why": "Jumlah data=50, banyak data=5. Rata-rata=50/5=10.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D01", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-252", "cat": 4, "sub": "Data tunggal", "level": 1, "stem": "Median data 5, 12, 7, 10, 6, 8 adalah ….", "options": ["7", "8", "8,5", "9", "7,5"], "key": [4], "kind": "pg", "why": "Urutkan: 5, 6, 7, 8, 10, 12. Median rata-rata data ke-3 dan ke-4: (7+8)/2=7,5.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D02", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-253", "cat": 4, "sub": "Data tunggal", "level": 2, "stem": "Data 5, 7, 9 dianggap sebagai seluruh populasi. Varians populasinya adalah ….", "options": ["4", "8", "2/3", "8/3", "4/3"], "key": [3], "kind": "pg", "why": "Rata-rata=7. Kuadrat simpangan: 4,0,4. Varians populasi=(4+0+4)/3=8/3.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D03", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-254", "cat": 4, "sub": "Data tunggal", "level": 2, "stem": "Rata-rata 10 siswa adalah 75; rata-rata 5 siswa lainnya 85. Rata-rata gabungan 15 siswa adalah ….", "options": ["85", "238/3", "235/3", "80", "75"], "key": [2], "kind": "pg", "why": "Jumlah nilai=10×75+5×85=1175. Bagi 15, diperoleh 235/3.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D04", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-255", "cat": 4, "sub": "Penyajian data", "level": 2, "stem": "Diagram menunjukkan jumlah pengunjung perpustakaan. Kenaikan terbesar dibanding hari sebelumnya terjadi pada ….", "options": ["Jumat", "Kamis", "Senin", "Selasa", "Rabu"], "key": [1], "kind": "pg", "why": "Perubahan harian: Selasa +10, Rabu −5, Kamis +30, Jumat +15. Kenaikan terbesar pada Kamis, bukan hari dengan jumlah pengunjung tertinggi.", "visual": "<svg viewBox=\"0 0 500 200\" role=\"img\" aria-label=\"Diagram jumlah pengunjung per hari\"><rect x=\"25\" y=\"83.33333333333334\" width=\"48\" height=\"76.66666666666666\" rx=\"6\" fill=\"#7870e8\"/><text x=\"49\" y=\"72.33333333333334\" text-anchor=\"middle\" fill=\"currentColor\">100</text><text x=\"49\" y=\"184\" text-anchor=\"middle\" fill=\"currentColor\">Sen</text><rect x=\"120\" y=\"75.66666666666667\" width=\"48\" height=\"84.33333333333333\" rx=\"6\" fill=\"#7870e8\"/><text x=\"144\" y=\"64.66666666666667\" text-anchor=\"middle\" fill=\"currentColor\">110</text><text x=\"144\" y=\"184\" text-anchor=\"middle\" fill=\"currentColor\">Sel</text><rect x=\"215\" y=\"79.5\" width=\"48\" height=\"80.5\" rx=\"6\" fill=\"#7870e8\"/><text x=\"239\" y=\"68.5\" text-anchor=\"middle\" fill=\"currentColor\">105</text><text x=\"239\" y=\"184\" text-anchor=\"middle\" fill=\"currentColor\">Rab</text><rect x=\"310\" y=\"56.5\" width=\"48\" height=\"103.5\" rx=\"6\" fill=\"#7870e8\"/><text x=\"334\" y=\"45.5\" text-anchor=\"middle\" fill=\"currentColor\">135</text><text x=\"334\" y=\"184\" text-anchor=\"middle\" fill=\"currentColor\">Kam</text><rect x=\"405\" y=\"45.0\" width=\"48\" height=\"115.0\" rx=\"6\" fill=\"#7870e8\"/><text x=\"429\" y=\"34.0\" text-anchor=\"middle\" fill=\"currentColor\">150</text><text x=\"429\" y=\"184\" text-anchor=\"middle\" fill=\"currentColor\">Jum</text></svg>", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D05", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-256", "cat": 4, "sub": "Penyajian data", "level": 2, "stem": "Diagram lingkaran menunjukkan 200 peserta memilih kegiatan. Sektor olahraga bersudut 90°. Banyak peserta yang memilih olahraga adalah ….", "options": ["50", "51", "49", "52", "103"], "key": [0], "kind": "pg", "why": "Bagian olahraga=90/360=¼. Jumlah peserta=¼×200=50.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D06", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-257", "cat": 4, "sub": "Data kelompok", "level": 2, "stem": "Tentukan perkiraan rata-rata dari tabel frekuensi berikut.", "options": ["63", "61", "64", "127", "62"], "key": [4], "kind": "pg", "why": "Titik tengah kelas: 57, 62, 67. Rata-rata=[2×57+6×62+2×67]/10=62.", "visual": "<div class=\"table-wrap\"><table><thead><tr><th>Nilai</th><th>Frekuensi</th></tr></thead><tbody><tr><td>55–59</td><td>2</td></tr><tr><td>60–64</td><td>6</td></tr><tr><td>65–69</td><td>2</td></tr></tbody></table></div>", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D07", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-258", "cat": 4, "sub": "Data kelompok", "level": 2, "stem": "Modus data berkelompok berikut, menggunakan interpolasi kelas, adalah ….", "options": ["80", "85", "89,5", "84,5", "79,5"], "key": [3], "kind": "pg", "why": "Kelas modus 80–89; tepi bawah 79.5; lebar kelas 10. d₁=8−4=4 dan d₂=8−4=4. Mo=79.5+[4/(4+4)]×10=84.5.", "visual": "<div class=\"table-wrap\"><table><thead><tr><th>Nilai</th><th>Frekuensi</th></tr></thead><tbody><tr><td>70–79</td><td>4</td></tr><tr><td>80–89</td><td>8</td></tr><tr><td>90–99</td><td>4</td></tr></tbody></table></div>", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D08", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-259", "cat": 4, "sub": "Aturan pencacahan", "level": 1, "stem": "Sebuah kantin menyediakan 7 jenis makanan dan 5 jenis minuman. Satu paket terdiri dari satu makanan dan satu minuman. Banyak paket berbeda adalah ….", "options": ["49", "37", "35", "12", "25"], "key": [2], "kind": "pg", "why": "Gunakan aturan perkalian: 7 pilihan makanan × 5 pilihan minuman = 35 paket.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D09", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-260", "cat": 4, "sub": "Aturan pencacahan", "level": 2, "stem": "Dari 9 siswa dipilih ketua dan sekretaris. Satu siswa tidak boleh memegang dua jabatan. Banyak susunan pengurus adalah ….", "options": ["18", "72", "36", "81", "9"], "key": [1], "kind": "pg", "why": "Jabatan berbeda sehingga urutan penting. Ketua punya 9 pilihan; sekretaris 8. Total=72.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D10", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-261", "cat": 4, "sub": "Aturan pencacahan", "level": 2, "stem": "Dari 10 anggota klub, dipilih 2 orang sebagai delegasi tanpa jabatan berbeda. Banyak pilihan delegasi adalah ….", "options": ["45", "90", "100", "10", "20"], "key": [0], "kind": "pg", "why": "Urutan tidak penting. C(10,2)=(10×9)/2=45.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D11", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-262", "cat": 4, "sub": "Peluang majemuk", "level": 2, "stem": "Kotak berisi 5 bola merah dan 7 bola biru. Dua bola diambil berurutan tanpa pengembalian. Peluang bola pertama merah dan kedua biru adalah ….", "options": ["35/144", "5/12", "7/12", "1/2", "35/132"], "key": [4], "kind": "pg", "why": "P(merah pertama)=5/12. Setelah merah terambil, tersisa 11 bola dan 7 di antaranya biru. Kalikan: 5/12 × 7/11 = 35/132.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D12", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-263", "cat": 4, "sub": "Peluang majemuk", "level": 2, "stem": "Peluang seorang atlet mengenai sasaran pada tiap tembakan adalah 5/10. Dua tembakan saling independen. Peluang keduanya mengenai sasaran adalah ….", "options": ["1", "3/4", "1/8", "1/4", "1/2"], "key": [3], "kind": "pg", "why": "Karena independen, P(keduanya kena)=(5/10)×(5/10)=1/4.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D13", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-264", "cat": 4, "sub": "Data tunggal", "level": 3, "stem": "Seluruh nilai data 5, 7, 9, 11 ditambah 5. Pilih semua pernyataan yang benar.", "options": ["Rata-rata bertambah 5.", "Median bertambah 5.", "Jangkauan bertambah 5.", "Simpangan baku tetap.", "Varians bertambah 25."], "key": [0, 1, 3], "kind": "multi", "why": "Penambahan konstanta menggeser pusat data: mean dan median naik 5. Selisih antarnilai tidak berubah; jangkauan, varians, dan simpangan baku tetap.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "D14", "variant": 4, "source": "Latihan pengembangan"}, {"id": "MTK-265", "cat": 0, "sub": "Operasi bilangan", "level": 1, "stem": "Nilai 6 + 9 × 4 − 6 adalah ….", "options": ["75", "36", "37", "35", "38"], "key": [1], "kind": "pg", "why": "Kerjakan perkalian dahulu: 9 × 4 = 36. Lalu 6 + 36 − 6 = 36.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B01", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-266", "cat": 0, "sub": "Operasi bilangan", "level": 1, "stem": "Hasil 6/3 + 1/2 adalah ….", "options": ["5/2", "8/3", "7/3", "7/2", "9/2"], "key": [0], "kind": "pg", "why": "Samakan penyebut menjadi 6: 12/6 + 3/6 = 5/2.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B02", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-267", "cat": 0, "sub": "Pangkat dan akar", "level": 1, "stem": "Bentuk sederhana 2^9 ÷ 2^6 adalah ….", "options": ["2", "4", "16", "32", "8"], "key": [4], "kind": "pg", "why": "Untuk basis sama, kurangi pangkat: 2^(9 − 6) = 2³ = 8.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B03", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-268", "cat": 0, "sub": "Pangkat dan akar", "level": 2, "stem": "Nilai (216)^(2/3) adalah ….", "options": ["216", "37", "38", "36", "6"], "key": [3], "kind": "pg", "why": "Akar pangkat tiga dari 216 adalah 6; kuadratkan hasilnya: 6² = 36.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B04", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-269", "cat": 0, "sub": "Pangkat dan akar", "level": 2, "stem": "Bentuk paling sederhana √288 + √648 adalah ….", "options": ["36√2", "30√3", "30√2", "6√2", "30√5"], "key": [2], "kind": "pg", "why": "√288 = 12√2 dan √648 = 18√2. Jumlahnya 30√2.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B05", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-270", "cat": 0, "sub": "Persen dan perbandingan", "level": 2, "stem": "Sebuah tas berharga Rp600.000. Diskon 20% dilanjutkan diskon 10% dari harga setelah diskon pertama. Harga akhir (rupiah) adalah ….", "options": ["360000", "432000", "420000", "480000", "540000"], "key": [1], "kind": "pg", "why": "Harga setelah diskon pertama = 0,8 × 600000 = 480000. Diskon kedua diterapkan pada harga ini: 0,9 × 480000 = 432000.", "visual": "", "tip": "Diskon berurutan dikalikan, bukan dijumlahkan.", "pattern": "B06", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-271", "cat": 0, "sub": "Persen dan perbandingan", "level": 2, "stem": "Dalam campuran sirup dan air, perbandingan volumenya 2 : 5. Jika volume campuran 42 liter, banyak sirup adalah … liter.", "options": ["12", "13", "11", "14", "27"], "key": [0], "kind": "pg", "why": "Jumlah bagian = 2 + 5 = 7. Satu bagian = 42/7 = 6 liter. Sirup = 2 × 6 = 12 liter.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B07", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-272", "cat": 0, "sub": "Sifat bilangan", "level": 2, "stem": "Untuk a = 6 dan b = 7, tentukan benar atau salah.", "options": ["a + b = b + a", "a ÷ b = b ÷ a", "a(b + 2) = ab + 2a"], "key": [true, false, true], "kind": "bs", "why": "Penjumlahan komutatif. Pembagian tidak komutatif karena 6/7 ≠ 7/6. Perkalian distributif: a(b+2)=ab+2a.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B08", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-273", "cat": 0, "sub": "Sifat bilangan", "level": 1, "stem": "Pilih semua bilangan rasional berikut.", "options": ["√36", "√37", "6/7", "0,125", "π"], "key": [0, 2, 3], "kind": "multi", "why": "√36 = 6, 6/7, dan 0,125 = 1/8 adalah rasional. 37 bukan kuadrat sempurna; akarnya irasional. π juga irasional.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "B09", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-274", "cat": 0, "sub": "Persen dan perbandingan", "level": 3, "stem": "Harga suatu barang naik 25% menjadi Rp750000. Agar kembali ke harga semula Rp600000, harga baru perlu diturunkan sebesar …%.", "options": ["30", "40", "20", "15", "25"], "key": [2], "kind": "pg", "why": "Penurunan = 150000. Persentase dihitung terhadap harga baru: 150000/750000 × 100% = 20%.", "visual": "", "tip": "Tentukan nilai dasar yang dipakai menghitung persen.", "pattern": "B10", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-275", "cat": 1, "sub": "Persamaan linear", "level": 2, "stem": "Dua roti dan tiga susu berharga Rp26000. Satu roti dan satu susu berharga Rp11000. Harga satu roti adalah … rupiah.", "options": ["6500", "7000", "4000", "8000", "9000"], "key": [1], "kind": "pg", "why": "Misalkan harga roti r dan susu s. Dari r+s=11000, diperoleh 2r+2s=22000. Kurangkan dari 2r+3s=26000: s=4000. Maka r=11000−4000=7000.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A01", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-276", "cat": 1, "sub": "Persamaan linear", "level": 2, "stem": "Diketahui x+y+z=21, x−y=1, dan z=8. Nilai x adalah ….", "options": ["7", "8", "6", "9", "17"], "key": [0], "kind": "pg", "why": "Substitusi z=8: x+y=13. Jumlahkan dengan x−y=1 sehingga 2x=14 dan x=7.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A02", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-277", "cat": 1, "sub": "Pertidaksamaan linear", "level": 1, "stem": "Himpunan penyelesaian −2x + 12 > 4 adalah ….", "options": ["x > 4", "x ≤ 4", "x ≥ 4", "x < 8", "x < 4"], "key": [4], "kind": "pg", "why": "−2x > -8. Pembagian oleh −2 membalik tanda pertidaksamaan sehingga x < 4.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A03", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-278", "cat": 1, "sub": "Pertidaksamaan linear", "level": 2, "stem": "Pilih semua titik yang memenuhi x ≥ 0, y ≥ 0, dan x+y ≤ 12.", "options": ["(6, 6)", "(0, 12)", "(12, 1)", "(−1, 6)", "(5, 6)"], "key": [0, 1, 4], "kind": "multi", "why": "Uji tiap koordinat. Jumlah x+y berturut-turut 12, 12, 13, 5, dan 11. Pilihan keempat gagal karena x negatif; pilihan ketiga melampaui batas.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A04", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-279", "cat": 1, "sub": "Program linear", "level": 3, "stem": "Usaha kerajinan membuat x paket A dan y paket B. Batasnya x+y ≤ 60, 2x+y ≤ 84, x,y ≥ 0. Laba A Rp3.000 dan B Rp2.000 per paket. Laba maksimum adalah … rupiah.", "options": ["180000", "168000", "144000", "126000", "120000"], "key": [2], "kind": "pg", "why": "Titik pojok: (0,0), (42,0), (24,36), (0,60). Laba berturut-turut 0, 126000, 144000, 120000. Maksimum Rp144000.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A05", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-280", "cat": 1, "sub": "Domain dan range", "level": 1, "stem": "Domain fungsi f(x) = (x+1)/(x−6) untuk x real adalah ….", "options": ["x ≤ 6", "x ∈ ℝ, x ≠ 6", "x ∈ ℝ", "x ≥ 6", "x ≠ −6"], "key": [1], "kind": "pg", "why": "Penyebut tidak boleh nol: x−6 ≠ 0, sehingga x ≠ 6.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A06", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-281", "cat": 1, "sub": "Domain dan range", "level": 2, "stem": "Fungsi f(x)=(x−6)²+3 memiliki domain ℝ. Range f adalah ….", "options": ["y ≥ 3", "y > 3", "y ≥ 0", "y ≥ 9", "y ≤ 3"], "key": [0], "kind": "pg", "why": "Kuadrat selalu ≥ 0 dan mencapai 0 saat x=6. Jadi nilai minimum f adalah 3, dan semua y ≥ 3 dapat dicapai.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A07", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-282", "cat": 1, "sub": "Invers dan komposisi", "level": 2, "stem": "Jika f(x)=6x+4, nilai f⁻¹(46) adalah ….", "options": ["4", "5", "6", "8", "7"], "key": [4], "kind": "pg", "why": "Balik operasi: f⁻¹(y)=(y−4)/6. Maka f⁻¹(46)=(46−4)/6=7.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A08", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-283", "cat": 1, "sub": "Invers dan komposisi", "level": 2, "stem": "Diketahui f(x)=2x+6 dan g(x)=x²−1. Nilai (f ∘ g)(3) adalah ….", "options": ["21", "24", "47", "22", "23"], "key": [3], "kind": "pg", "why": "(f ∘ g)(3)=f(g(3)). g(3)=9−1=8, sehingga f(8)=16+6=22.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A09", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-284", "cat": 1, "sub": "Invers dan komposisi", "level": 3, "stem": "Biaya sewa sepeda adalah f(t)=30000+8000t rupiah untuk t jam. Jika total biaya Rp78000, berapa lama sepeda disewa?", "options": ["7", "8", "6", "4", "5"], "key": [2], "kind": "pg", "why": "Kurangi biaya tetap: 78000−30000=48000. Bagi tarif per jam: 48000/8000=6 jam.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A10", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-285", "cat": 1, "sub": "Fungsi kuadrat", "level": 2, "stem": "Untuk f(x)=(x−6)²−4, tentukan benar atau salah.", "options": ["Grafik terbuka ke atas.", "Titik puncak grafik adalah (6, −4).", "Grafik tidak memotong sumbu x."], "key": [true, true, false], "kind": "bs", "why": "Koefisien x² positif. Bentuk puncak memberi titik (6,−4). Untuk f(x)=0, (x−6)²=4, jadi akar 4 dan 8; grafik memotong sumbu x.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A11", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-286", "cat": 1, "sub": "Barisan dan deret", "level": 1, "stem": "Barisan aritmetika memiliki suku pertama 6 dan beda 3. Suku ke-12 adalah ….", "options": ["39", "40", "38", "41", "81"], "key": [0], "kind": "pg", "why": "U₁₂ = a+(12−1)b = 6+11×3 = 39.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A12", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-287", "cat": 1, "sub": "Barisan dan deret", "level": 2, "stem": "Suatu aula memiliki 12 baris kursi. Baris pertama 16 kursi dan setiap baris berikutnya bertambah 2 kursi. Jumlah kursi adalah ….", "options": ["325", "323", "326", "651", "324"], "key": [4], "kind": "pg", "why": "S₁₂=12/2 × [2(16)+11×2] = 6×54 = 324. Ini jumlah, bukan suku terakhir.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A13", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-288", "cat": 1, "sub": "Barisan dan deret", "level": 2, "stem": "Suku pertama suatu barisan geometri adalah 6 dan rasionya 2. Jumlah lima suku pertama adalah ….", "options": ["180", "192", "372", "186", "96"], "key": [3], "kind": "pg", "why": "S₅=a(r⁵−1)/(r−1)=6(32−1)/(2−1)=186.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A14", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-289", "cat": 1, "sub": "Pertumbuhan dan bunga", "level": 2, "stem": "Koloni mula-mula berisi 600 sel. Jumlahnya menjadi dua kali lipat setiap 3 jam. Banyak sel setelah 9 jam adalah ….", "options": ["3600", "9600", "4800", "1200", "2400"], "key": [2], "kind": "pg", "why": "Ada 9/3=3 periode pelipatan. Jumlah akhir=600×2³=4800.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A15", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-290", "cat": 1, "sub": "Pertumbuhan dan bunga", "level": 2, "stem": "Modal Rp6000000 diberi bunga tunggal 6% per tahun selama 3 tahun. Total modal dan bunga adalah … rupiah.", "options": ["7146096", "7080000", "6360000", "6720000", "7200000"], "key": [1], "kind": "pg", "why": "Bunga = modal × 6% × 3 = 1080000. Total = 6000000+1080000=7080000.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A16", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-291", "cat": 1, "sub": "Pertumbuhan dan bunga", "level": 2, "stem": "Tabungan Rp600000 mendapat bunga majemuk 10% setahun. Tanpa penarikan dan biaya, saldo setelah dua tahun adalah … rupiah.", "options": ["726000", "660000", "720000", "732000", "840000"], "key": [0], "kind": "pg", "why": "Saldo akhir=M(1+r)²=600000×1,1²=726000. Bunga tahun kedua dihitung dari saldo tahun pertama.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A17", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-292", "cat": 1, "sub": "Barisan dan deret", "level": 3, "stem": "Produksi mingguan mengikuti barisan Uₘ=6+4(m−1), untuk m≥1.", "options": ["Minggu ke-6 menghasilkan 26 unit.", "Jumlah produksi 6 minggu pertama adalah 96 unit.", "Kenaikan persentase dari minggu ke minggu selalu sama."], "key": [true, true, false], "kind": "bs", "why": "U₆=6+20. S₆=6/2×(2×6+5×4)=96. Selisih tetap 4, tetapi persentase 4/Uₘ berubah karena penyebut bertambah.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "A18", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-293", "cat": 2, "sub": "Sudut dan garis", "level": 1, "stem": "Dua sudut dalam sepihak pada dua garis sejajar besarnya (6x+10)° dan (2x+30)°. Nilai x adalah ….", "options": ["33/2", "45/2", "25/2", "35/2", "37/2"], "key": [3], "kind": "pg", "why": "Sudut dalam sepihak berjumlah 180°. (6+2)x+40=180, sehingga x=140/8=35/2.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G01", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-294", "cat": 2, "sub": "Kesebangunan", "level": 2, "stem": "Tiang setinggi 18 m memiliki bayangan 12 m. Pada waktu yang sama, bayangan sebuah pohon 36 m. Tinggi pohon adalah … m.", "options": ["56", "111", "54", "55", "53"], "key": [2], "kind": "pg", "why": "Pada sudut datang matahari yang sama, tinggi/bayangan tetap. h/36=18/12. Jadi h=54 m.", "visual": "", "tip": "Tuliskan informasi yang diketahui dan periksa kembali satuan serta syarat pada soal.", "pattern": "G02", "variant": 5, "source": "Latihan pengembangan"}, {"id": "MTK-295", "cat": 2, "sub": "Pythagoras
