function chapterLessons(){return CONCEPTS.map((r,i)=>({r,i})).filter(x=>x.r[0]===conceptCat)}
function uniquePatterns(qs){const seen=new Set;return qs.filter(q=>{if(seen.has(q.pattern))return false;seen.add(q.pattern);return true})}
function stepExplanation(q){const parts=q.why.split(/(?<=[.!?])\s+/).filter(Boolean);return `<ol class="steps">${parts.map(t=>`<li>${esc(t)}</li>`).join('')}</ol><div class="cb l"><b>Jawaban:</b> ${esc(keyText(q))}</div>`}
function miniQuiz(q){const a=state.mini[q.id],answered=Array.isArray(a),correct=answered&&isCorrect(q,a);return `<article class="mini-quiz">${badges(q)}<h3>${esc(q.stem)}</h3>${questionSketch(q)}${q.kind==='pg'?q.options.map((o,i)=>`<button class="option ${answered&&q.key.includes(i)?'correct':''} ${answered&&a.includes(i)&&!q.key.includes(i)?'incorrect':''}" data-mini="${q.id}" data-mi="${i}" ${answered?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join(''):`<p class="small">${TYPE[q.kind]} · Buka latihan untuk memilih semua jawaban.</p><button data-open="${q.id}" class="primary">Kerjakan soal →</button>`}${answered?explanation(q,correct)+`<button data-resetmini="${q.id}" class="textbutton">↻ Coba ulang tanpa kunci</button>`:''}</article>`}
function concepts(){const ls=chapterLessons();chapterSub=Math.min(Math.max(chapterSub,0),ls.length-1);const {r,i}=ls[chapterSub],c=CATS[conceptCat],qs=QUESTIONS.filter(q=>q.cat===conceptCat&&q.sub===r[1]),unique=uniquePatterns(qs),ex=unique[0],quizQs=unique.filter(q=>q.id!==ex?.id).slice(0,3),done=state.read.includes(i);return `<section class="chapter-hero" style="--cc:${CHCOL[conceptCat]}"><span class="hero-emoji">${CHEMO[conceptCat]}</span><div><small>BAB ${conceptCat+1} DARI 5</small><h1>${c.name}</h1><p>${c.desc} Pahami konsep, coba simulasinya, lalu latih penalaranmu.</p></div></section><nav class="subnav" aria-label="Subbab">${ls.map(({r,i},j)=>`<button data-subindex="${j}" class="${j===chapterSub?'on':''}"><b>${conceptCat+1}.${j+1}</b> ${r[1]}${state.read.includes(i)?' ✓':''}</button>`).join('')}</nav><h2 class="sub-title"><span style="background:${CHCOL[conceptCat]}">${conceptCat+1}.${chapterSub+1}</span> ${r[1]}</h2><section class="learning-section"><h3 class="learning-label">📘 Materi & simulasi</h3><div class="material-grid"><div><div class="cb k"><strong>💡 Konsep inti</strong><p>${esc(r[2])}</p></div><div class="cb l"><strong>🧭 Langkah berpikir</strong><ol><li>Kenali informasi yang diketahui dan yang ditanyakan.</li><li>Pilih rumus dengan syarat yang sesuai. Periksa ilustrasi di samping.</li><li>Hitung bertahap, lalu uji apakah hasilnya masuk akal.</li></ol></div><div class="cb j"><strong>⚠️ Jebakan yang perlu dihindari</strong><p>${esc(r[4])}</p></div><button class="understood ${done?'yes':''}" data-read="${i}">${done?'✅ Sudah paham':'⬜ Tandai sudah paham'}</button></div>${simHTML(r[1])}</div></section><section class="learning-section"><h3 class="learning-label">📐 Rumus yang harus dikuasai</h3><div class="formula-grid">${r[3].split('\n').map(t=>`<div class="formula-tile">${esc(t)}</div>`).join('')}</div></section><section class="learning-section"><h3 class="learning-label">📝 Contoh soal berlangkah</h3>${ex?`<div class="concept-card"><div class="cb k"><strong>${ex.id} · ${LEVEL[ex.level]}</strong><p>${esc(ex.stem)}</p></div>${ex.kind!=='pg'?`<ol>${ex.options.map(o=>`<li>${esc(o)}</li>`).join('')}</ol>`:''}${questionSketch(ex)}<details class="example-details"><summary>👀 Lihat pembahasan langkah demi langkah</summary>${stepExplanation(ex)}</details></div>`:''}</section><section class="learning-section"><h3 class="learning-label">🎯 Kuis pemantapan & bank soal subbab</h3><div class="info-banner">Ada <b>${qs.length} soal</b> untuk subbab ini (${unique.length} pola berbeda). Kerjakan kuis singkat di bawah atau mulai paket latihan.</div><div class="continue-row"><button class="primary" data-chapterpractice>Latihan 10 soal subbab ini →</button><button data-sub="${r[1]}">Lihat seluruh ${qs.length} soal</button></div>${(quizQs.length?quizQs:unique.slice(0,1)).map(q=>`<div class="concept-card">${miniQuiz(q)}</div>`).join('')}</section><section class="learning-section"><h3 class="learning-label">🧠 Miskonsepsi & refleksi</h3><div class="cb j"><strong>Periksa pemahamanmu</strong><p>${esc(r[4])}</p></div><div class="cb p"><strong>✍️ Jelaskan dengan kata-katamu sendiri</strong><p>Mengapa syarat di atas penting? Tuliskan satu contoh kesalahan dan perbaikannya.</p><textarea id="reflection" rows="3" placeholder="Catatan belajarmu, tersimpan di browser ini…">${esc(state.notes?.[i]||'')}</textarea><small>Catatan pribadi, tanpa fitur Tanya AI.</small></div></section><div class="chapter-prevnext"><button data-previouschapter ${conceptCat===0&&chapterSub===0?'disabled':''}>← Materi sebelumnya</button><button class="primary" data-nextchapter ${conceptCat===4&&chapterSub===ls.length-1?'disabled':''}>Materi berikutnya →</button></div>`;}
function hub(){const list=page==='missions'?MISSIONS:TREES;return heading(page==='missions'?'INVESTIGASI MASALAH SEHARI-HARI':'PILIH JALUR SEBELUM BERHITUNG',page==='missions'?'🕵️ Misi studi kasus':'🌳 Pohon logika',page==='missions'?'Belajar matematika melalui lima situasi nyata.':'Setiap pilihan disertai alasan, termasuk pilihan yang keliru.')+`<div class="chapter-grid">${list.map((x,i)=>`<button class="chapter-tile" data-path="${i}" style="--cc:${CHCOL[x.cat]}"><span>${CHEMO[x.cat]} ${CATS[x.cat].name}</span><h3>${x.title}</h3><p>${x.intro}</p><small>${x.steps.length} langkah penalaran →</small></button>`).join('')}</div>${hubIndex>=0?pathHTML(list[hubIndex]):'<div class="info-banner">Pilih salah satu kasus di atas untuk memulai.</div>'}`}
function pathHTML(x){const step=x.steps[hubStep];return `<section class="concept-card path-card" id="pathPanel"><h2>${x.title}</h2><p>${x.intro}</p><div class="logic-path">${x.steps.slice(0,hubStep).map((s,i)=>`<div class="path-node"><b>✓ ${i+1}. ${s[1][s[2]]}</b><p>${s[3]}</p></div>`).join('')}</div>${hubDone?`<div class="cb l"><strong>🏁 Kesimpulan</strong><p>${x.end}</p></div><button data-restartpath>↻ Ulangi dari awal</button>`:`<div class="cb k"><strong>Langkah ${hubStep+1} dari ${x.steps.length}</strong><p>${step[0]}</p></div>${step[1].map((o,i)=>`<button class="option" data-pathanswer="${i}">${esc(o)}</button>`).join('')}${hubError?`<div class="cb j" role="status"><strong>Jalur ini belum tepat</strong><p>${hubError} Coba pilihan lain.</p></div>`:''}`}</section>`}
function applySkin(){document.body.dataset.skin=state.skin;document.body.style.setProperty('--fontscale',state.scale);document.body.classList.toggle('dark',['gelap','neon'].includes(state.skin));document.body.classList.toggle('study-focus',!!state.studyFocus);$('#theme').textContent='🎨 Tampilan';const pane=$('#settingsPanel');if(pane)pane.innerHTML=`<strong>Tema warna</strong><div class="skin-grid">${[['terang','☀️ Terang'],['gelap','🌙 Gelap'],['laut','🌊 Laut'],['hutan','🌿 Hutan'],['senja','🌅 Senja'],['neon','🔮 Neon']].map(([v,l])=>`<button onclick="setSkin('${v}')" class="${state.skin===v?'on':''}">${l}</button>`).join('')}</div><strong>Ukuran teks</strong><div class="skin-grid">${[.9,1,1.15].map((v,i)=>`<button onclick="setScale(${v})" class="${state.scale===v?'on':''}">${['A−','A','A+'][i]}</button>`).join('')}</div><button class="full" onclick="toggleStudyFocus()">${state.studyFocus?'Tampilkan navigasi bab':'🧘 Mode fokus'}</button>`;}
function setSkin(v){state.skin=v;state.theme=['gelap','neon'].includes(v)?'dark':'light';persist();render()}
function setScale(v){state.scale=v;persist();render()}
function toggleStudyFocus(){state.studyFocus=!state.studyFocus;persist();render()}
function render(){nav();let html=({home,bank,saved:bank,concepts,exam,progress,sources,quiz,result,missions:hub,trees:hub}[page]||home)();$('#main').innerHTML=html+footer();applySkin();bind();bindLearning();}
function bindLearning(){
$$('[data-openchapter]').forEach(b=>b.onclick=()=>openChapter(+b.dataset.openchapter));
$$('[data-subindex]').forEach(b=>b.onclick=()=>openChapter(conceptCat,+b.dataset.subindex));
$$('[data-continuechapter]').forEach(b=>b.onclick=()=>openChapter(...state.lastChapter));
$$('[data-hub]').forEach(b=>b.onclick=()=>{hubIndex=-1;go(b.dataset.hub)});
$$('[data-mini]').forEach(b=>b.onclick=()=>{const q=QMAP[b.dataset.mini];if(state.mini[q.id])return;const a=[+b.dataset.mi];state.mini[q.id]=a;record(q,a);persist();render()});
$$('[data-resetmini]').forEach(b=>b.onclick=()=>{delete state.mini[b.dataset.resetmini];persist();render()});
$$('[data-chapterpractice]').forEach(b=>b.onclick=()=>{const r=chapterLessons()[chapterSub].r;start(diverse(QUESTIONS.filter(q=>q.cat===conceptCat&&q.sub===r[1]),10).map(q=>q.id))});
$$('[data-previouschapter]').forEach(b=>b.onclick=()=>{if(chapterSub>0)openChapter(conceptCat,chapterSub-1);else{const c=conceptCat-1;openChapter(c,CONCEPTS.filter(r=>r[0]===c).length-1)}});
$$('[data-nextchapter]').forEach(b=>b.onclick=()=>{if(chapterSub<chapterLessons().length-1)openChapter(conceptCat,chapterSub+1);else openChapter(conceptCat+1,0)});
if($('#reflection'))$('#reflection').oninput=e=>{const i=chapterLessons()[chapterSub].i;state.notes??={};state.notes[i]=e.target.value;persist()};
if(page==='concepts')mountSim(chapterLessons()[chapterSub].r[1]);
$$('[data-path]').forEach(b=>b.onclick=()=>{hubIndex=+b.dataset.path;hubStep=0;hubError='';hubDone=false;render();$('#pathPanel')?.scrollIntoView({behavior:'smooth'})});
$$('[data-pathanswer]').forEach(b=>b.onclick=()=>{const x=(page==='missions'?MISSIONS:TREES)[hubIndex],s=x.steps[hubStep];if(+b.dataset.pathanswer===s[2]){hubStep++;hubError='';hubDone=hubStep>=x.steps.length}else hubError=s[3];render();$('#pathPanel')?.scrollIntoView({behavior:'smooth'})});
$$('[data-restartpath]').forEach(b=>b.onclick=()=>{hubStep=0;hubDone=false;hubError='';render()});
$('#theme').onclick=()=>$('#settingsPanel')?.classList.toggle('hidden');
}

setInterval(tick,1000);render();</script></body></html>
