const CH=[
{n:"Matriks",e:"🧮",c:"#5b5bf0",z:"",i:"Elemen 1 Aljabar — Operasi matriks, determinan, dan invers matriks berordo 2×2 atau 3×3 dengan elemen bilangan real.",S:[
["1.1 Ordo, Transpose & Kesamaan Matriks","<b>Konsep:</b> Matriks adalah susunan bilangan real dalam baris (mendatar) dan kolom (menurun). Ordo m×n menyatakan m baris dan n kolom. <b>Transpose</b> A^T diperoleh dengan menukar baris menjadi kolom (elemen a_(ij) berpindah ke a_(ji)). Dua matriks dikatakan <b>sama</b> (A = B) jika dan hanya jika ordonya sama dan setiap elemen seletak bernilai sama. <b>Langkah soal:</b> pada soal kesamaan matriks yang memuat variabel x dan y, pilih elemen seletak paling sederhana lebih dahulu untuk membentuk persamaan linear. <b>Jebakan:</b> menukar indeks baris dan kolom: a_(23) adalah baris ke-2 kolom ke-3, bukan sebaliknya. Matriks simetris memiliki A^T = A.","Ordo: A_(m×n) — m baris dan n kolom ; Transpose: (A^T)_(ij) = A_(ji) — baris jadi kolom ; (A^T)^T = A — sifat transpose ganda ; (A + B)^T = A^T + B^T — transpose penjumlahan ; (AB)^T = B^T A^T — urutan terbalik saat transpose hasil kali ; A = B ⇔ a_(ij) = b_(ij) — syarat kesamaan matriks",["mat_ordo","mat_sim"]],
["1.2 Penjumlahan, Pengurangan & Perkalian Skalar","<b>Konsep:</b> Penjumlahan dan pengurangan dua matriks hanya terdefinisi bila kedua matriks memiliki <b>ordo yang persis sama</b>, dilakukan dengan menjumlahkan atau mengurangkan elemen-elemen seletak. Perkalian matriks dengan skalar real k mengalikan <i>setiap</i> elemen di dalam matriks dengan k. <b>Langkah soal:</b> untuk persamaan kA − B = C, selesaikan per elemen seletak seperti persamaan aljabar biasa. <b>Jebakan:</b> saat menghitung det(kA), banyak siswa menulis k·det(A); padahal karena semua baris dikalikan k, berlaku det(kA) = k^n·det(A) dengan n ordo matriks!","(A ± B)_(ij) = a_(ij) ± b_(ij) — syarat: ordo A dan B sama ; (kA)_(ij) = k · a_(ij) — k dikalikan ke seluruh elemen ; k(A + B) = kA + kB — sifat distributif skalar ; det(kA) = k^2 det(A) — untuk matriks 2×2 ; det(kA) = k^3 det(A) — untuk matriks 3×3",["mat_add"]],
["1.3 Perkalian Dua Matriks & Pemodelan TKA","<b>Konsep:</b> Matriks A_(m×p) dapat dikalikan dengan B_(p×n) jika dan hanya jika <b>banyak kolom A sama dengan banyak baris B</b>, menghasilkan matriks C_(m×n). Elemen c_(ij) adalah hasil kali titik baris ke-i matriks A dengan kolom ke-j matriks B. <b>Poin TKA:</b> soal cerita TKA sering memodelkan tabel kapasitas kamar atau pesanan (baris = cabang atau produk, kolom = tipe atau bahan) dikalikan matriks kolom harga atau upah. <b>Jebakan:</b> perkalian matriks <b>tidak komutatif</b> (AB ≠ BA pada umumnya), sehingga (A + B)² = A² + AB + BA + B², bukan A² + 2AB + B².","Syarat: A_(m×p) · B_(p×n) = C_(m×n) — kolom A = baris B ; c_(ij) = Σ a_(ik) b_(kj) — baris i kali kolom j ; AB ≠ BA — tidak komutatif ; A(BC) = (AB)C — asosiatif ; AI = IA = A — I matriks identitas",["mat_mul","mat_konteks"]],
["1.4 Determinan Matriks 2×2 & Sifat Determinan","<b>Konsep:</b> Untuk matriks 2×2 A = [a, b ; c, d], determinan adalah selisih hasil kali diagonal utama dengan diagonal samping: det(A) = ad − bc. Secara geometris, |det(A)| menyatakan faktor perbesaran luas bangun datar yang ditransformasikan oleh matriks A. <b>Langkah soal:</b> jika ditanya determinan dari hasil kali atau pangkat matriks seperti det(A³B⁻¹), jangan kalikan matriksnya! Gunakan sifat determinan: det(AB) = det(A)·det(B) dan det(A⁻¹) = @frac{1}{det(A)}. <b>Jebakan:</b> det(A + B) ≠ det(A) + det(B); untuk penjumlahan, matriks harus dijumlahkan dahulu baru dihitung determinannya.","det(A) = |A| = ad − bc — determinan 2×2 ; |AB| = |A| · |B| — determinan hasil kali ; |A^n| = |A|^n — determinan pangkat ; |A^(−1)| = @frac{1}{|A|} — determinan invers ; |A^T| = |A| — determinan transpose tetap ; |kA| = k^n |A| — k skalar, n ordo matriks",["det2","det_sifat"]],
["1.5 Determinan Matriks 3×3 (Sarrus & Kofaktor)","<b>Konsep:</b> Sesuai kisi-kisi TKA, determinan diuji hingga ordo 3×3. Dengan <b>kaidah Sarrus</b>, salin 2 kolom pertama ke sebelah kanan matriks, lalu jumlahkan 3 hasil kali diagonal kanan-bawah dan kurangi dengan 3 hasil kali diagonal kiri-bawah. Alternatifnya adalah <b>ekspansi kofaktor</b> sepanjang baris atau kolom yang paling banyak memuat angka nol. <b>Langkah soal:</b> jika matriks berbentuk segitiga atas, segitiga bawah, atau diagonal, determinannya cukup hasil kali elemen diagonal utama! <b>Jebakan:</b> tanda kofaktor C_(ij) = (−1)^(i+j) M_(ij) berselang-seling (baris 1: + − +, baris 2: − + −, baris 3: + − +); lupa tanda minus pada elemen baris 1 kolom 2 adalah kesalahan paling sering.","Sarrus: |A| = (aei + bfg + cdh) − (ceg + afh + bdi) — matriks 3×3 ; Kofaktor: C_(ij) = (−1)^(i+j) M_(ij) — M_(ij) determinan submatriks 2×2 ; |A| = a_(11)C_(11) + a_(12)C_(12) + a_(13)C_(13) — ekspansi baris ke-1 ; Segitiga atau diagonal: |A| = a_(11) · a_(22) · a_(33) — hasil kali diagonal utama",["det3"]],
["1.6 Invers Matriks 2×2 & Matriks Singular","<b>Konsep:</b> Invers matriks A (ditulis A⁻¹) memenuhi AA⁻¹ = A⁻¹A = I. Untuk ordo 2×2, tukar posisi elemen diagonal utama (a dan d), beri tanda negatif pada diagonal samping (−b dan −c), lalu bagi dengan determinan ad − bc. Matriks yang tidak memiliki invers disebut <b>matriks singular</b>, terjadi tepat ketika det(A) = 0. <b>Poin TKA:</b> invers matriks diagonal [p, 0 ; 0, q] langsung diperoleh dengan membalik elemen diagonalnya: [@frac{1}{p}, 0 ; 0, @frac{1}{q}]. <b>Jebakan:</b> lupa membagi dengan determinan, atau terbalik antara menukar posisi (a, d) dan mengubah tanda (b, c).","A^(−1) = @frac{1}{ad − bc} [d, −b ; −c, a] — invers matriks 2×2 ; Singular: det(A) = ad − bc = 0 — tidak punya invers ; Diagonal: [p, 0 ; 0, q]^(−1) = [@frac{1}{p}, 0 ; 0, @frac{1}{q}] — p, q ≠ 0 ; (AB)^(−1) = B^(−1) A^(−1) — urutan berbalik ; (A^(−1))^(−1) = A — invers dari invers",["inv2","inv_graf"]],
["1.7 Invers 3×3, Persamaan AX = B & Pemodelan SPL","<b>Konsep:</b> Untuk matriks 3×3, A⁻¹ = (@frac{1}{det(A)}) · Adj(A), di mana adjoin Adj(A) adalah <i>transpose dari matriks kofaktor</i>. Dalam persamaan matriks, karena perkalian tidak komutatif, posisi pengali sangat menentukan: dari AX = B diperoleh X = A⁻¹B (kalikan A⁻¹ dari kiri), sedangkan dari XA = B diperoleh X = BA⁻¹ (kalikan A⁻¹ dari kanan). <b>Langkah soal:</b> untuk menyelesaikan SPL dua atau tiga variabel berbentuk AX = B, gunakan X = A⁻¹B atau aturan Cramer x = @frac{D_x}{D}, y = @frac{D_y}{D}. <b>Jebakan:</b> menulis X = BA⁻¹ untuk persamaan AX = B akan memberikan hasil yang salah total.","A^(−1) = (@frac{1}{|A|}) · Adj(A) — Adj(A) = C^T (transpose kofaktor) ; AX = B ⇒ X = A^(−1) B — A di kiri, A^(−1) di kiri ; XA = B ⇒ X = B A^(−1) — A di kanan, A^(−1) di kanan ; Cramer: x = @frac{D_x}{D}, y = @frac{D_y}{D} — D = det(A) ≠ 0",["inv3"]]]},
{n:"Polinomial",e:"📈",c:"#e5484d",z:"",i:"Elemen 1 Aljabar — Operasi, pemfaktoran, dan suku sisa polinomial berderajat maksimum 4 dengan koefisien real.",S:[
["2.1 Konsep, Derajat & Operasi Polinomial (Orde ≤ 4)","<b>Konsep:</b> Polinomial (suku banyak) berderajat n memiliki bentuk P(x) = a_n x^n + … + a₁x + a₀ dengan pangkat x berupa <b>bilangan cacah</b> (0, 1, 2, 3, 4) dan a_n ≠ 0. Dalam TKA, derajat polinomial dibatasi maksimum 4. Penjumlahan dan pengurangan dilakukan pada suku-suku sejenis (berpangkat sama), sedangkan perkalian menggunakan sifat distributif dan menambah derajat. <b>Langkah soal:</b> pada kesamaan dua polinomial P(x) ≡ Q(x), samakan koefisien dari pangkat x yang bersesuaian, atau substitusikan nilai x pembuat nol. <b>Jebakan:</b> bentuk yang memuat x^(−1) atau √x <i>bukan</i> polinomial karena eksponennya bukan bilangan cacah.","deg(P ± Q) ≤ max(deg P, deg Q) — derajat penjumlahan ; deg(P · Q) = deg P + deg Q — derajat hasil kali ; P(x) ≡ Q(x) ⇔ a_k = b_k — koefisien seletak sama ; P(1) = Σ a_k — jumlah seluruh koefisien ; P(0) = a_0 — suku tetap (konstanta)",["pol_op","pol_kali"]],
["2.2 Nilai Polinomial: Substitusi & Skema Horner","<b>Konsep:</b> Nilai P(k) adalah nilai suku banyak saat x = k (secara grafis merupakan ordinat titik (k, P(k))). Selain substitusi langsung, <b>skema Horner</b> menghitung P(k) secara berulang lewat operasi kali-tambah dari koefisien pangkat tertinggi ke terendah, yang sekaligus menghasilkan koefisien hasil bagi dan sisa pembagian oleh (x − k). <b>Langkah soal:</b> urutkan koefisien dari pangkat tertinggi hingga konstanta; jika ada suku yang melompat (misalnya x² tidak ada pada polinomial derajat 4), wajib tulis koefisien <b>0</b>! <b>Jebakan:</b> lupa menulis angka 0 untuk pangkat yang hilang pada baris atas tabel Horner.","Substitusi: P(k) = a_4 k^4 + a_3 k^3 + a_2 k^2 + a_1 k + a_0 — nilai fungsi di x = k ; Horner: b_n = a_n, b_(i−1) = a_(i−1) + k · b_i — langkah kali-tambah ; P(k) = b_0 — angka terakhir di pojok kanan bawah Horner",["horner","horner_graf"]],
["2.3 Pembagian Polinomial: Linear & Kuadrat","<b>Konsep:</b> Setiap pembagian polinomial memenuhi algoritma pembagian: <b>Yang Dibagi = Pembagi × Hasil Bagi + Sisa</b>, atau P(x) = B(x)·H(x) + S(x). Jika P(x) berderajat n dibagi oleh B(x) berderajat m (dengan n ≥ m), maka derajat hasil bagi H(x) adalah n − m, dan derajat sisa S(x) <b>maksimum m − 1</b>. <b>Langkah soal:</b> untuk pembagi ax + b, akar pembaginya x = −@frac{b}{a}. Jika memakai skema Horner dengan x = −@frac{b}{a}, koefisien hasil bagi yang keluar dari baris bawah Horner wajib <b>dibagi lagi dengan a</b>, sedangkan sisanya tetap! <b>Jebakan:</b> lupa membagi koefisien hasil bagi dengan a saat pembaginya berbentuk (ax + b) dengan a ≠ 1.","P(x) = B(x) · H(x) + S(x) — identitas pembagian ; deg H(x) = deg P − deg B — derajat hasil bagi ; deg S(x) ≤ deg B − 1 — derajat maksimum sisa ; Pembagi (ax + b): H(x) = @frac{H_(Horner)(x)}{a} — koefisien hasil bagi dibagi a, sisa tetap",["pol_div"]],
["2.4 Teorema Sisa (Suku Sisa Pembagian)","<b>Konsep:</b> Teorema Sisa memungkinkan kita mencari sisa pembagian tanpa membagi panjang! Jika P(x) dibagi (x − k), sisanya adalah konstanta S = P(k). Jika dibagi oleh pembagi berderajat 2 seperti (x − a)(x − b), maka sisanya berderajat paling tinggi 1, yaitu <b>S(x) = px + q</b>. Substitusikan x = a dan x = b sehingga diperoleh dua persamaan linear: P(a) = pa + q dan P(b) = pb + q. <b>Poin TKA:</b> jika pembagi kuadrat tidak mudah difaktorkan (misalnya x² + x + 1), gunakan reduksi pangkat x² ≡ −x − 1 (dan x³ ≡ 1)! <b>Jebakan:</b> menganggap sisa pembagian oleh polinomial kuadrat berupa konstanta, padahal umumnya berbentuk linear px + q.","Dibagi (x − k): S = P(k) — sisa berupa konstanta ; Dibagi (ax + b): S = P(−@frac{b}{a}) — pembuat nol pembagi ; Dibagi (x − a)(x − b): S(x) = px + q — dengan P(a) = pa + q dan P(b) = pb + q ; Rumus cepat: S(x) = @frac{(x−b)P(a) − (x−a)P(b)}{a − b} — sisa pembagi (x−a)(x−b)",["sisa","sisa_kongruen"]],
["2.5 Teorema Faktor & Pemfaktoran Orde ≤ 4","<b>Konsep:</b> Teorema Faktor adalah kasus khusus Teorema Sisa: (x − k) merupakan <b>faktor</b> dari P(x) jika dan hanya jika sisa pembagiannya nol, yakni <b>P(k) = 0</b>. Secara geometri, k adalah absis titik potong grafik y = P(x) dengan sumbu-X. Untuk mencari faktor bulat atau rasional dari P(x) = a_n x^n + … + a₀, uji faktor-faktor dari konstanta a₀ dibagi faktor a_n. <b>Langkah soal:</b> (1) cek jumlah koefisien: jika Σa_i = 0 maka x = 1 pasti akar; jika koefisien pangkat genap = pangkat ganjil maka x = −1 pasti akar; (2) reduksi derajat dengan Horner sampai tersisa kuadrat, lalu faktorkan. <b>Jebakan:</b> menulis faktor sebagai (x + k) padahal akarnya adalah x = k (seharusnya faktornya (x − k)).","(x − k) faktor P(x) ⇔ P(k) = 0 — Teorema Faktor ; Akar rasional: x = @frac{p}{q} — p faktor a_0, q faktor a_n ; Uji cepat x = 1: P(1) = a_n + … + a_0 = 0 — (x − 1) faktor ; Uji cepat x = −1: P(−1) = 0 — (x + 1) faktor",["faktor","faktor_ganda"]],
["2.6 Akar-Akar Polinomial & Teorema Vieta","<b>Konsep:</b> Tanpa mencari nilai masing-masing akar, <b>Teorema Vieta</b> menghubungkan jumlah dan hasil kali akar langsung dengan koefisien polinomial. Tanda rumusnya selalu berselang-seling: −@frac{b}{a}, +@frac{c}{a}, −@frac{d}{a}, +@frac{e}{a}. <b>Langkah soal:</b> untuk menghitung x₁² + x₂² + x₃², ubah ke bentuk simetris (x₁ + x₂ + x₃)² − 2(x₁x₂ + x₁x₃ + x₂x₃). <b>Jebakan:</b> lupa tanda minus pada rumus jumlah akar (−@frac{b}{a}) dan hasil kali tiga akar (−@frac{d}{a}), atau tidak menyamakan urutan pangkat ketika ada suku yang bernilai nol.","Derajat 3 (ax³+bx²+cx+d=0): x₁ + x₂ + x₃ = −@frac{b}{a} — jumlah satu-satu ; x₁x₂ + x₁x₃ + x₂x₃ = @frac{c}{a} — jumlah hasil kali dua-dua ; x₁ x₂ x₃ = −@frac{d}{a} — hasil kali tiga akar ; Derajat 4 (ax⁴+bx³+cx²+dx+e=0): Σx_i = −@frac{b}{a}, Σx_i x_j = @frac{c}{a}, Σx_i x_j x_k = −@frac{d}{a}, x₁x₂x₃x₄ = @frac{e}{a} ; Identitas: Σx_i² = (Σx_i)² − 2Σx_i x_j — jumlah kuadrat akar",["vieta"]]]},
{n:"Fungsi Lanjut",e:"📊",c:"#0ea5e9",z:"",i:"Elemen 1 Aljabar — Domain, kodomain, daerah hasil (range), dan grafik fungsi polinom, rasional, akar, eksponensial, logaritma, mutlak, dan trigonometri.",S:[
["3.1 Fungsi Polinom (Orde ≤ 4): Domain, Range & Grafik","<b>Konsep:</b> Setiap fungsi polinomial f(x) = a_n x^n + … + a₀ terdefinisi untuk seluruh bilangan real, sehingga <b>domain alaminya selalu D_f = ℝ</b>. Daerah hasil (range) bergantung pada apakah derajat n ganjil atau genap: untuk derajat ganjil (n = 1, 3), grafik membentang dari −∞ ke +∞ sehingga R_f = ℝ; untuk derajat genap (n = 2, 4), kedua ujung grafik mengarah ke arah yang sama sehingga range dibatasi oleh nilai ekstrem global (minimum jika a_n > 0, maksimum jika a_n < 0). <b>Poin TKA:</b> perhatikan kecekungan dan banyaknya titik potong sumbu-X (maksimum n titik). <b>Jebakan:</b> mengira fungsi kuadrat atau kuartik (derajat 4) memiliki range seluruh bilangan real ℝ.","Domain polinom: D_f = {x | x ∈ ℝ} — selalu seluruh bilangan real ; Derajat ganjil (n = 1, 3): R_f = ℝ — ujung kiri dan kanan berlawanan arah ; Derajat genap (n = 2, 4), a_n > 0: R_f = [y_min, ∞) — membuka ke atas ; Derajat genap (n = 2, 4), a_n < 0: R_f = (−∞, y_maks] — membuka ke bawah ; Titik potong sumbu-Y: (0, a_0) — substitusi x = 0",["fn_pol","fn_pol_ekstrem"]],
["3.2 Fungsi Rasional: Domain, Asimtot & Range","<b>Konsep:</b> Fungsi rasional berbentuk pecahan f(x) = @frac{P(x)}{Q(x)}. Syarat mutlak agar terdefinisi adalah <b>penyebut tidak boleh nol: Q(x) ≠ 0</b>. Pembuat nol penyebut (yang tidak habis dibagi pembilang) menjadi <b>asimtot tegak</b>. Untuk bentuk pecahan linear f(x) = @frac{ax + b}{cx + d}, asimtot tegaknya x = −@frac{d}{c} dan asimtot datarnya y = @frac{a}{c} (rasio koefisien x). <b>Langkah soal:</b> untuk mencari range dari fungsi pecahan linear, kecualikan nilai asimtot datarnya: R_f = {y ∈ ℝ | y ≠ @frac{a}{c}}. <b>Jebakan:</b> jika pembilang dan penyebut punya faktor persekutuan (x − k), maka di x = k grafik berlubang (<i>removable discontinuity</i>), bukan asimtot tegak, tetapi x = k tetap harus dikeluarkan dari domain!","f(x) = @frac{ax + b}{cx + d}: D_f = {x ∈ ℝ | x ≠ −@frac{d}{c}} — syarat penyebut ≠ 0 ; Asimtot tegak: x = −@frac{d}{c} — dari cx + d = 0 ; Asimtot datar: y = @frac{a}{c} — rasio koefisien utama ; Range: R_f = {y ∈ ℝ | y ≠ @frac{a}{c}} — semua real kecuali asimtot datar ; Invers: f^(−1)(x) = @frac{−dx + b}{cx − a} — tukar a dan d serta ubah tanda",["fn_ras","fn_ras_lubang"]],
["3.3 Fungsi Akar (Irasional): Domain & Range","<b>Konsep:</b> Fungsi akar f(x) = k + s·√(g(x)) (dengan s = ±1) pada bilangan real mensyaratkan ekspresi di dalam tanda akar pangkat genap <b>tidak boleh negatif: g(x) ≥ 0</b>. Karena nilai √(g(x)) selalu ≥ 0, maka untuk s > 0 nilai minimum f(x) adalah k, sedangkan untuk s < 0 nilai maksimumnya adalah k. <b>Langkah soal:</b> (1) selesaikan pertidaksamaan g(x) ≥ 0 untuk mendapatkan domain D_f; (2) periksa apakah g(x) bisa bernilai 0 dan tak terbatas untuk menentukan range R_f. <b>Jebakan:</b> untuk f(x) = √(9 − x²), domainnya [−3, 3], tetapi range-nya bukan [0, ∞) melainkan <b>[0, 3]</b> karena nilai maksimum di dalam akar hanya 9!","Syarat domain: f(x) = √(g(x)) ⇒ D_f = {x | g(x) ≥ 0} — dalam akar ≥ 0 ; Akar di penyebut: @frac{1}{√(g(x))} ⇒ D_f = {x | g(x) > 0} — tidak boleh nol ; Range f(x) = k + √(ax + b): R_f = [k, ∞) — karena √(…) ≥ 0 ; Range f(x) = √(r² − x²): D_f = [−r, r], R_f = [0, r] — setengah lingkaran atas",["fn_akar","fn_akar_ling"]],
["3.4 Fungsi Eksponensial (Basis Bilangan Asli)","<b>Konsep:</b> Sesuai batasan kisi-kisi TKA, fungsi eksponensial memiliki bentuk f(x) = a · b^(kx + d) + c dengan <b>bilangan pokok (basis) b berupa bilangan asli (b ≥ 2)</b>. Karena b^u > 0 untuk setiap u ∈ ℝ, domain fungsi eksponensial selalu seluruh bilangan real (D_f = ℝ), dan grafiknya tidak pernah memotong garis <b>asimtot datar y = c</b>. <b>Langkah soal:</b> jika a > 0, maka a·b^(…) > 0 sehingga daerah hasilnya R_f = (c, ∞); jika a < 0, maka R_f = (−∞, c). <b>Jebakan:</b> menulis range sebagai [c, ∞) dengan kurung siku, padahal b^x tidak pernah bernilai nol sehingga nilai y = c tidak pernah tercapai (harus kurung biasa).","f(x) = a · b^(kx) + c (b ∈ {2, 3, 4, …}): D_f = ℝ — terdefinisi di semua x ; Sifat positif: b^x > 0 — selalu positif untuk semua x real ; Asimtot datar: y = c — didekati grafik saatb^(kx) → 0 ; Range (a > 0): R_f = {y | y > c} = (c, ∞) ; Range (a < 0): R_f = {y | y < c} = (−∞, c)",["fn_exp","fn_exp_banding"]],
["3.5 Fungsi Logaritma: Domain, Asimtot & Grafik","<b>Konsep:</b> Fungsi logaritma f(x) = ^b log(g(x)) + c adalah invers dari fungsi eksponensial. Syarat terdefinisi: basis b > 0, b ≠ 1, dan <b>numerus wajib positif murni: g(x) > 0</b>. Garis batas g(x) = 0 merupakan <b>asimtot tegak</b> grafik logaritma. Untuk g(x) linear seperti x − p, saat x mendekati p dari kanan grafik turun menuju −∞ (jika b > 1), dan saat x → ∞ grafik naik terus sehingga range-nya seluruh bilangan real ℝ. <b>Jebakan:</b> memakai tanda ≥ 0 pada syarat numerus (seperti fungsi akar); padahal log(0) tidak terdefinisi, jadi numerus harus <b>> 0</b>.","f(x) = ^b log(g(x)) + c: D_f = {x | g(x) > 0} — numerus wajib positif ; Asimtot tegak: g(x) = 0 — batas domain ; Range logaritma linear: R_f = ℝ — membentang dari −∞ ke +∞ ; Hubungan invers: y = b^x ⇔ x = ^b log y — grafik simetris terhadap garis y = x",["fn_log","fn_log_kuadrat"]],
["3.6 Fungsi Nilai Mutlak: Grafik & Daerah Hasil","<b>Konsep:</b> Nilai mutlak |u| menyatakan jarak u dari nol, sehingga nilainya selalu ≥ 0. Fungsi f(x) = a|x − h| + k memiliki grafik berbentuk huruf V dengan <b>titik puncak (sudut tajam) di (h, k)</b>: membuka ke atas jika a > 0 (range [k, ∞)) dan membuka ke bawah jika a < 0 (range (−∞, k]). Untuk grafik y = |g(x)|, gambarlah grafik y = g(x) biasa lalu <b>cerminkan seluruh bagian yang berada di bawah sumbu-X ke atas sumbu-X</b>. <b>Jebakan:</b> mencari titik puncak y = |2x − 6| + 1 dengan mengambil h = 6; seharusnya samakan isi mutlak dengan nol: 2x − 6 = 0 ⇒ x = 3, sehingga puncaknya (3, 1).","Definisi: |u| = u jika u ≥ 0, dan −u jika u < 0 — selalu non-negatif ; f(x) = a|kx − b| + c: Puncak di (@frac{b}{k}, c) — saat isi mutlak = 0 ; Domain: D_f = ℝ — terdefinisi untuk semua x real ; Range (a > 0): R_f = [c, ∞) ; Range (a < 0): R_f = (−∞, c]",["fn_abs","fn_abs_lipat"]],
["3.7 Fungsi Trigonometri: Amplitudo, Periode & Range","<b>Konsep:</b> Fungsi gelombang sinus dan kosinus berbentuk f(x) = A sin(kx ± b) + c atau A cos(kx ± b) + c. Karena nilai sin(…) dan cos(…) selalu berada pada selang <b>[−1, 1]</b>, maka nilai maksimum fungsi adalah |A| + c dan nilai minimumnya −|A| + c. Besaran |A| adalah <b>amplitudo</b> (simpangan maksimum dari garis tengah y = c), sedangkan <b>periode</b> (panjang satu gelombang penuh) adalah T = @frac{2π}{k} atau @frac{360°}{k}. <b>Poin TKA:</b> fungsi tangen y = A tan(kx) + c memiliki periode @frac{π}{k} (@frac{180°}{k}), asimtot tegak saat cos(kx) = 0, dan range seluruh ℝ. <b>Jebakan:</b> lupa mengambil nilai mutlak |A| ketika koefisien A bernilai negatif saat menghitung nilai maksimum.","Domain sin & cos: D_f = ℝ ; Range sin & cos: R_f = [−|A| + c, |A| + c] — karena −1 ≤ sin, cos ≤ 1 ; Amplitudo = |A|, Garis tengah: y = c ; Periode sin & cos: T = @frac{2π}{k} = @frac{360°}{k} ; Periode tan: T = @frac{π}{k} = @frac{180°}{k}, R_f = ℝ ; Pergeseran fase: x = ∓@frac{b}{k} — dari kx ± b = 0",["fn_trig","fn_trig_geser"]]]},
{n:"Vektor",e:"🧭",c:"#10b981",z:"",i:"Elemen 2 Geometri & Pengukuran — Vektor pada bidang (ℝ²) dan ruang (ℝ³), panjang vektor, dan operasi vektor.",S:[
["4.1 Vektor pada Bidang (R²) & Ruang (R³)","<b>Konsep:</b> Vektor adalah besaran yang memiliki besar (panjang) dan arah. Sesuai kisi-kisi TKA, komponen vektor dibatasi maksimum tiga: pada bidang (ℝ²) dinyatakan sebagai u = (x, y) = xî + yĵ, dan pada ruang (ℝ³) sebagai u = (x, y, z) = xî + yĵ + zk̂. Jika diketahui titik pangkal A(x₁, y₁, z₁) dan titik ujung B(x₂, y₂, z₂), maka <b>vektor posisi AB diperoleh dari ujung dikurangi pangkal: AB = b − a</b>. <b>Jebakan:</b> menghitung vektor AB dengan mengurangi A − B (pangkal dikurangi ujung), sehingga semua tanda komponennya terbalik!","Vektor bidang (ℝ²): u = (x, y) = x î + y ĵ ; Vektor ruang (ℝ³): u = (x, y, z) = x î + y ĵ + z k̂ ; Vektor dua titik: AB = b − a = (x_B − x_A, y_B − y_A, z_B − z_A) — ujung kurangi pangkal ; BA = −AB — arah berlawanan",["vek_pos","vek_bidang"]],
["4.2 Panjang Vektor, Jarak & Vektor Satuan","<b>Konsep:</b> Panjang (modulus atau besar) vektor u = (x, y, z) dihitung dengan teorema Pythagoras tiga dimensi: |u| = √(x² + y² + z²). <b>Vektor satuan</b> û adalah vektor yang searah dengan u tetapi memiliki panjang tepat 1 satuan, diperoleh dengan membagi vektor u dengan panjangnya sendiri. <b>Poin TKA:</b> soal TKA sering memberikan panjang vektor yang memuat parameter m, misalnya AB = (2m, m+3, m) dengan |AB| = √29, lalu meminta nilai m melalui persamaan kuadrat. <b>Jebakan:</b> lupa mengkuadratkan tanda negatif (hasil kuadrat komponen real selalu ≥ 0) atau lupa mengakarkan jumlah kuadrat saat mencari |u|.","Panjang di ℝ²: |u| = √(x² + y²) ; Panjang di ℝ³: |u| = √(x² + y² + z²) ; Jarak A ke B: |AB| = √((x_B−x_A)² + (y_B−y_A)² + (z_B−z_A)²) ; Vektor satuan: û = @frac{u}{|u|} — panjang |û| = 1",["vek_len"]],
["4.3 Operasi Vektor, Kolinearitas & Perbandingan Ruas","<b>Konsep:</b> Penjumlahan u + v secara geometris mengikuti aturan segitiga (ujung u disambung pangkal v) atau jajargenjang, dan secara aljabar menjumlahkan komponen seletak. Dua vektor tak-nol dikatakan <b>sejajar atau kolinear</b> (atau tiga titik A, B, C segaris) jika dan hanya jika yang satu merupakan kelipatan skalar yang lain: AB = k·BC. Jika titik P membagi ruas garis AB dengan perbandingan AP : PB = m : n, maka vektor posisi P adalah rata-rata tertimbang silang: <b>p = @frac{m·b + n·a}{m + n}</b>. <b>Jebakan:</b> tidak mengalikan silang rasio m dan n (seharusnya m dikalikan ke titik B dan n dikalikan ke titik A).","u ± v = (u_x ± v_x, u_y ± v_y, u_z ± v_z) — operasi per komponen ; Kolinear (segaris): u = k · v ⇔ @frac{u_x}{v_x} = @frac{u_y}{v_y} = @frac{u_z}{v_z} = k ; Rumus titik bagi (AP : PB = m : n): p = @frac{m b + n a}{m + n} — kali silang ; Titik tengah M (m = n = 1): m = @frac{a + b}{2}",["vek_op","vek_jajar"]],
["4.4 Hasil Kali Titik (Dot Product) & Sudut Antarvektor","<b>Konsep:</b> Hasil kali titik (<i>dot product</i>) dua vektor menghasilkan <b>bilangan skalar</b>, bukan vektor! Ada dua rumus yang saling melengkapi: dari komponen u · v = u_x v_x + u_y v_y + u_z v_z, dan dari geometri u · v = |u||v| cosθ. Dengan menyamakan keduanya, kita dapat menentukan sudut θ antarvektor. <b>Poin TKA:</b> untuk menghitung panjang penjumlahan atau pengurangan |u ± v| jika diketahui |u|, |v|, dan sudut θ, kuadratkan dahulu: <b>|u ± v|² = |u|² + |v|² ± 2|u||v|cosθ</b>. <b>Jebakan:</b> pada rumus |u − v|², tanda di depan 2|u||v|cosθ adalah minus, berbeda dari aturan kosinus sisi segitiga biasa yang sering tertukar tanda.","u · v = u_x v_x + u_y v_y + u_z v_z — dari komponen ; u · v = |u| |v| cosθ — θ sudut ketika pangkal berimpit ; cosθ = @frac{u · v}{|u| |v|} — menentukan sudut ; Tegak lurus (ortogonal, θ = 90°): u · v = 0 ; |u + v|² = |u|² + |v|² + 2(u · v) ; |u − v|² = |u|² + |v|² − 2(u · v)",["vek_dot","vek_kos"]],
["4.5 Proyeksi Skalar & Proyeksi Vektor Ortogonal","<b>Konsep:</b> Bayangkan menyinari vektor u secara tegak lurus ke arah vektor v: bayangan yang terbentuk pada garis v disebut <b>proyeksi ortogonal u pada v</b>. <b>Proyeksi skalar ortogonal</b> menghasilkan bilangan bertanda s = @frac{u · v}{|v|} (positif jika sudut lancip, negatif jika tumpul), sedangkan <b>panjang proyeksi</b> adalah nilai mutlaknya |s|. <b>Proyeksi vektor ortogonal</b> menghasilkan vektor p = @frac{u · v}{|v|²} · v. <b>Langkah soal:</b> perhatikan kata setelah preposisi <b>'pada'</b>! Jika 'proyeksi u <i>pada</i> v', maka penyebutnya selalu milik v (|v| atau |v|²), bukan u. <b>Jebakan:</b> membagi dengan |u|² alih-alih |v|², atau lupa mengkuadratkan |v| pada rumus proyeksi vektor.","Proyeksi skalar u pada v: s = @frac{u · v}{|v|} — bisa negatif bila θ > 90° ; Panjang proyeksi u pada v: |s| = @frac{|u · v|}{|v|} — selalu ≥ 0 ; Proyeksi vektor u pada v: p = @frac{u · v}{|v|²} · v — hasil berupa vektor searah atau berlawanan v",["vek_proj"]]]},
{n:"Lingkaran & Transformasi",e:"⭕",c:"#f59e0b",z:"",i:"Elemen 2 Geometri & Pengukuran — Persamaan lingkaran, garis singgung, luas juring serta tembereng, dan transformasi geometri.",S:[
["5.1 Persamaan Lingkaran & Kedudukan Titik–Garis","<b>Konsep:</b> Lingkaran adalah tempat kedudukan titik-titik yang berjarak sama (jari-jari r) terhadap titik pusat P(a, b). Dari rumus jarak diperoleh bentuk baku (x − a)² + (y − b)² = r², yang bila dijabarkan menjadi bentuk umum x² + y² + Ax + By + C = 0 dengan pusat (−@frac{1}{2}A, −@frac{1}{2}B). Kedudukan garis terhadap lingkaran ditentukan dengan mensubstitusikan garis ke lingkaran lalu menghitung diskriminan D = b² − 4ac: memotong di 2 titik (D > 0), <b>menyinggung (D = 0)</b>, atau tidak memotong (D < 0). <b>Jebakan:</b> lupa mengubah tanda saat membaca pusat dari bentuk umum (pusatnya (−@frac{1}{2}A, −@frac{1}{2}B), bukan (@frac{1}{2}A, @frac{1}{2}B)).","Pusat (0, 0): x² + y² = r² ; Pusat (a, b): (x − a)² + (y − b)² = r² — bentuk baku ; Bentuk umum: x² + y² + Ax + By + C = 0 ; Pusat: (a, b) = (−@frac{1}{2}A, −@frac{1}{2}B), r = √(a² + b² − C) ; Kuasa titik K = (x₁−a)² + (y₁−b)² − r²: K < 0 di dalam, K = 0 pada, K > 0 di luar ; Garis singgung: D = b² − 4ac = 0",["ling_pers","ling_titik"]],
["5.2 Persamaan Garis Singgung Lingkaran (PGSL)","<b>Konsep:</b> Ada 3 tipe soal PGSL di TKA: (1) <b>Diketahui titik singgung T(x₁, y₁) pada lingkaran</b>: gunakan metode <i>bagi adil</i> (ganti x² → x₁x, y² → y₁y, x → @frac{x+x₁}{2}, y → @frac{y+y₁}{2}); (2) <b>Diketahui gradien m</b> (sejajar atau tegak lurus garis lain): gunakan y − b = m(x − a) ± r√(1 + m²); (3) <b>Melalui titik di luar lingkaran</b>: gunakan garis kutub (polar) atau jarak pusat ke garis = r. <b>Langkah soal:</b> selalu uji dulu apakah titik (x₁, y₁) terletak <i>pada</i> lingkaran sebelum memakai rumus bagi adil! <b>Jebakan:</b> memakai rumus bagi adil langsung untuk titik di luar lingkaran (hasilnya adalah garis polar atau tali busur singgung, bukan garis singgungnya).","Bagi adil di (x₁, y₁) pada x²+y²=r²: x₁x + y₁y = r² ; Bagi adil di (a, b): (x₁−a)(x−a) + (y₁−b)(y−b) = r² ; Bentuk umum: x₁x + y₁y + @frac{1}{2}A(x+x₁) + @frac{1}{2}B(y+y₁) + C = 0 ; Gradien m: y − b = m(x − a) ± r√(1 + m²) ; Tegak lurus garis m₁: m₂ = −@frac{1}{m₁}",["ling_pgsl","ling_pgsl_m"]],
["5.3 Busur, Juring & Tembereng Lingkaran","<b>Konsep:</b> Bagian daerah lingkaran yang diukur berdasarkan sudut pusat θ (dalam derajat atau radian) meliputi <b>panjang busur</b> (bagian keliling), <b>juring</b> (potongan pizza dari pusat), dan <b>tembereng</b> (daerah antara tali busur dan busur). Luas tembereng diperoleh dengan mengurangi luas juring dengan luas segitiga sama kaki OAB: L_tembereng = L_juring − @frac{1}{2}r² sinθ. <b>Poin TKA:</b> jika sudut θ dalam radian, rumus menjadi sangat ringkas: s = rθ, L_juring = @frac{1}{2}r²θ, dan L_tembereng = @frac{1}{2}r²(θ − sinθ). <b>Jebakan:</b> menghitung luas segitiga juring dengan @frac{1}{2}·alas·tinggi tanpa memperhatikan bahwa sisi miringnya r (luasnya adalah @frac{1}{2}r² sinθ).","Panjang busur: s = @frac{θ}{360°} · 2πr = rθ (θ rad) ; Luas juring: L_j = @frac{θ}{360°} · πr² = @frac{1}{2}r²θ ; Luas segitiga pusat: L_Δ = @frac{1}{2}r² sinθ ; Luas tembereng: L_t = L_j − L_Δ = @frac{1}{2}r²(θ_rad − sinθ) ; Panjang tali busur: d = 2r sin@frac{θ}{2}",["ling_juring"]],
["5.4 Translasi, Refleksi, Rotasi & Dilatasi","<b>Konsep:</b> Empat transformasi geometri dasar memindahkan titik (x, y) ke bayangan (x′, y′): (1) <b>Translasi T(a, b)</b> menggeser sejauh (x+a, y+b); (2) <b>Refleksi</b> mencerminkan terhadap sumbu atau garis; (3) <b>Rotasi R[P, θ]</b> memutar sebesar θ (positif = berlawanan jarum jam); (4) <b>Dilatasi D[P, k]</b> memperbesar atau memperkecil jarak dari pusat P dengan faktor k. <b>Langkah soal:</b> untuk mencari bayangan <i>garis atau kurva</i> y = f(x), nyatakan (x, y) dalam (x′, y′) (invers transformasi), lalu substitusikan ke persamaan kurva awal! <b>Jebakan:</b> langsung mensubstitusikan rumus x′ dan y′ ke dalam persamaan garis tanpa membalikkan rumusnya menjadi x = … dan y = ….","Translasi T(a, b): (x′, y′) = (x + a, y + b) ⇒ x = x′ − a, y = y′ − b ; Refleksi sumbu-X: (x, −y) ; sumbu-Y: (−x, y) ; garis y = x: (y, x) ; garis y = −x: (−y, −x) ; Refleksi x = h: (2h − x, y) ; garis y = k: (x, 2k − y) ; Rotasi [O, 90°]: (−y, x) ; [O, −90°]: (y, −x) ; [O, 180°]: (−x, −y) ; Dilatasi [O, k]: (kx, ky) ; Pusat (a, b): x′ − a = k(x − a)",["trans_dasar","trans_kurva"]],
["5.5 Matriks Transformasi, Komposisi & Luas Bayangan","<b>Konsep:</b> Setiap transformasi linear yang berpusat di O(0, 0) dapat diwakili oleh matriks 2×2 M sehingga (x′, y′)^T = M(x, y)^T. Jika transformasi T₁ (matriks M₁) dilanjutkan oleh T₂ (matriks M₂), ditulis <b>T₂ ∘ T₁</b>, maka matriks komposisinya adalah <b>M = M₂ · M₁</b> (transformasi yang dikerjakan belakangan berada di sebelah <i>kiri</i>!). Luas bangun datar hasil transformasi matriks M adalah <b>L′ = |det(M)| · L_awal</b>. <b>Jebakan:</b> mengalikan matriks komposisi dengan urutan M₁ · M₂ (dari kiri ke kanan), atau lupa mengambil nilai mutlak |det(M)| saat menghitung luas bayangan (determinan refleksi bernilai negatif, tetapi luas selalu positif).","Rotasi θ: M = [cosθ, −sinθ ; sinθ, cosθ] ; Komposisi T₂ ∘ T₁ (T₁ dilanjutkan T₂): M_total = M₂ · M₁ — urutan matriks dari kanan ke kiri ; Invers transformasi kurva: [x ; y] = M^(−1) [x′ ; y′] ; Luas bayangan: L′ = |det(M)| · L_awal — wajib nilai mutlak ; Dilatasi faktor k: L′ = k² · L_awal",["trans_mat"]]]},
{n:"Limit Fungsi",e:"∞",c:"#8b5cf6",z:"",i:"Elemen 3 Kalkulus — Limit fungsi aljabar (menuju konstanta dan tak hingga) serta limit fungsi trigonometri.",S:[
["6.1 Limit Fungsi Aljabar (x → c)","<b>Konsep:</b> Limit lim_(x→c) f(x) = L menyatakan nilai yang didekati f(x) saat x mendekati c dari kiri dan kanan (meskipun f(c) sendiri mungkin tidak terdefinisi). Langkah pertama selalu <b>substitusi langsung x = c</b>: jika menghasilkan bilangan tentu, itulah jawabannya. Jika menghasilkan <b>bentuk tak tentu @frac{0}{0}</b>, sederhanakan dengan (1) <b>pemfaktoran</b> untuk mencoret faktor pembuat nol (x − c), (2) <b>mengalikan sekawan akar</b> jika memuat bentuk √u − √v, atau (3) aturan L'Hôpital @frac{f′(c)}{g′(c)}. <b>Jebakan:</b> langsung memakai L'Hôpital tanpa memeriksa apakah bentuknya benar-benar @frac{0}{0}! Jika hasilnya @frac{k}{0} (dengan k ≠ 0), limitnya tidak ada (±∞), bukan diturunkan.","Syarat ada limit: lim_(x→c⁻) f(x) = lim_(x→c⁺) f(x) = L — limit kiri = limit kanan ; Bentuk @frac{0}{0} (polinom): faktorkan dan coret (x − c) ; Sekawan akar: (√A − √B)(√A + √B) = A − B ; L'Hôpital (khusus @frac{0}{0}): lim_(x→c) @frac{f(x)}{g(x)} = lim_(x→c) @frac{f′(x)}{g′(x)}",["lim_alj","lim_kiri_kanan"]],
["6.2 Limit Menuju Tak Hingga (x → ∞)","<b>Konsep:</b> Pada limit pecahan polinomial lim_(x→∞) @frac{a_n x^n + …}{b_m x^m + …}, bagi pembilang dan penyebut dengan x berpangkat tertinggi, sehingga yang menentukan hanyalah <b>perbandingan derajat tertinggi n dan m</b>: jika n = m hasilnya @frac{a_n}{b_m}; jika n < m hasilnya 0; jika n > m hasilnya ±∞. Untuk bentuk selisih akar kuadrat <b>lim_(x→∞) [√(ax²+bx+c) − √(px²+qx+r)]</b>, jika a = p maka nilainya adalah <b>@frac{b − q}{2√a}</b>. <b>Langkah soal:</b> jika bentuknya x − √(ax²+bx+c), ubah dahulu x menjadi √(x²) agar bisa memakai rumus @frac{b − q}{2√a}! <b>Jebakan:</b> untuk x + 2 − √(x² + 6x − 1), wajib kurung dahulu menjadi (x + 2) − √(…) = √(x² + 4x + 4) − √(x² + 6x − 1), jangan hanya mengubah x menjadi √(x²).","Pecahan x→∞: L = @frac{a_n}{b_m} (jika n = m) ; L = 0 (jika n < m) ; L = ±∞ (jika n > m) ; Selisih akar (a = p): lim_(x→∞) [√(ax²+bx+c) − √(ax²+qx+r)] = @frac{b − q}{2√a} ; Ubah bentuk linear: (x ± k) = √((x ± k)²) = √(x² ± 2kx + k²)",["lim_inf","lim_inf_ras"]],
["6.3 Limit Fungsi Trigonometri","<b>Konsep:</b> Sifat dasar limit trigonometri saat x → 0 (dalam radian) adalah <b>lim_(x→0) @frac{sin ax}{bx} = lim_(x→0) @frac{tan ax}{bx} = @frac{a}{b}</b>. Artinya, untuk perkalian maupun pembagian di sekitar u → 0, sin(u) dan tan(u) berperilaku setara dengan u. Namun, <b>cos(x) tidak bernilai 0 saat x → 0</b> (melainkan cos 0 = 1)! Jika muncul bentuk <b>1 − cos(ax)</b> yang menyebabkan @frac{0}{0}, ubah menggunakan identitas sudut rangkap menjadi <b>2 sin²(@frac{1}{2}ax)</b> yang setara dengan @frac{1}{2}a²x². <b>Jebakan:</b> mencoret @frac{cos(ax)}{bx} menjadi @frac{a}{b} (salah besar karena cos 0 = 1, bukan 0!), atau lupa kuadrat pada koefisien @frac{1}{2}a saat mengubah 1 − cos(ax) = 2 sin²(@frac{1}{2}ax).","lim_(x→0) @frac{sin ax}{bx} = lim_(x→0) @frac{tan ax}{bx} = @frac{a}{b} ; lim_(x→0) @frac{sin ax}{tan bx} = @frac{a}{b} ; Identitas wajib: 1 − cos(ax) = 2 sin²(@frac{1}{2}ax) ≈ @frac{1}{2}a²x² ; cos(ax) − 1 = −2 sin²(@frac{1}{2}ax) ≈ −@frac{1}{2}a²x² ; cos A − cos B = −2 sin(@frac{A+B}{2}) sin(@frac{A−B}{2})",["lim_trig"]]]}];

let FG='#000';
const AR=(x,a,b,c,d,col)=>{if(Math.hypot(c-a,d-b)<5)return;x.strokeStyle=x.fillStyle=col;x.lineWidth=2.8;x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke();const g=Math.atan2(d-b,c-a);x.beginPath();x.moveTo(c,d);x.lineTo(c-9*Math.cos(g-.4),d-9*Math.sin(g-.4));x.lineTo(c-9*Math.cos(g+.4),d-9*Math.sin(g+.4));x.fill()};
const CFR=(x,nu,de,cx,cy,col,fn='700 12px "STIX Two Text",serif')=>{x.save();x.fillStyle=x.strokeStyle=col||FG;x.font=fn;x.textAlign='center';const w=Math.max(x.measureText(nu).width,x.measureText(de).width)+8;x.fillText(nu,cx,cy-5);x.lineWidth=1.5;x.beginPath();x.moveTo(cx-w/2,cy-1);x.lineTo(cx+w/2,cy-1);x.stroke();x.fillText(de,cx,cy+12);x.restore()};
const TX=(x,s,a,b,col,al='left',fn='600 13px system-ui')=>{x.save();x.fillStyle=col||FG;x.font=fn;x.textAlign=al;x.fillText(s,a,b);x.restore()};
const BG=(x,w,h)=>{x.save();x.shadowBlur=0;x.strokeStyle=FG;x.globalAlpha=.07;x.lineWidth=1;x.beginPath();for(let i=0;i<w;i+=25){x.moveTo(i,0);x.lineTo(i,h)}for(let j=0;j<h;j+=25){x.moveTo(0,j);x.lineTo(w,j)}x.stroke();x.restore()};
const AX=(x,w,h,ox,oy,sc=25)=>{x.save();x.strokeStyle=FG;x.fillStyle=FG;x.font='600 10px system-ui';
 x.globalAlpha=.09;x.lineWidth=1;x.beginPath();
 for(let k=-14;k<=14;k++){if(!k)continue;const px=ox+k*sc,py=oy-k*sc;if(px>14&&px<w-14){x.moveTo(px,12);x.lineTo(px,h-12)}if(py>14&&py<h-14){x.moveTo(12,py);x.lineTo(w-12,py)}}
 x.stroke();
 x.globalAlpha=.48;x.lineWidth=1.8;x.beginPath();x.moveTo(12,oy);x.lineTo(w-12,oy);x.moveTo(ox,12);x.lineTo(ox,h-12);x.stroke();
 x.beginPath();x.moveTo(w-12,oy);x.lineTo(w-19,oy-4);x.lineTo(w-19,oy+4);x.closePath();x.fill();
 x.beginPath();x.moveTo(ox,12);x.lineTo(ox-4,19);x.lineTo(ox+4,19);x.closePath();x.fill();
 x.globalAlpha=.65;const st=sc<22?2:1;
 for(let k=-12;k<=12;k++){if(!k)continue;const px=ox+k*sc,py=oy-k*sc;
  if(px>22&&px<w-24){x.beginPath();x.moveTo(px,oy-3.5);x.lineTo(px,oy+3.5);x.stroke();if(k%st===0){x.textAlign='center';x.fillText(String(k),px,oy+13)}}
  if(py>22&&py<h-22){x.beginPath();x.moveTo(ox-3.5,py);x.lineTo(ox+3.5,py);x.stroke();if(k%st===0){x.textAlign='right';x.fillText(String(k),ox-6,py+3.5)}}
 }
 x.textAlign='right';x.fillText('0',ox-5,oy+12);x.font='700 11px system-ui';x.fillText('X',w-14,oy-7);x.textAlign='left';x.fillText('Y',ox+7,20);
 x.restore()};
const PT=(x,px,py,col,lbl,dy=-10)=>{x.save();x.fillStyle='#fff';x.beginPath();x.arc(px,py,6.5,0,7);x.fill();x.fillStyle=col;x.beginPath();x.arc(px,py,5,0,7);x.fill();if(lbl){x.font='700 12px system-ui';x.fillStyle=col;x.textAlign='center';x.fillText(lbl,px,py+dy)}x.restore()};
const BRK=(x,x0,y0,bw,bh,col)=>{x.save();x.strokeStyle=col||FG;x.lineWidth=2.5;x.beginPath();x.moveTo(x0+8,y0);x.lineTo(x0,y0);x.lineTo(x0,y0+bh);x.lineTo(x0+8,y0+bh);x.moveTo(x0+bw-8,y0);x.lineTo(x0+bw,y0);x.lineTo(x0+bw,y0+bh);x.lineTo(x0+bw-8,y0+bh);x.stroke();x.restore()};
const MBOX=(x,M,x0,y0,cw,ch,col,hlR=-1,hlC=-1,lbl='')=>{
 const r=M.length,c=M[0].length,bw=c*cw+12,bh=r*ch+10;
 if(lbl)TX(x,lbl,x0+bw/2,y0-8,col||FG,'center','700 13px system-ui');
 BRK(x,x0,y0,bw,bh,col||FG);
 for(let i=0;i<r;i++)for(let j=0;j<c;j++){
  const cx=x0+6+j*cw,cy=y0+5+i*ch;
  if(i===hlR||j===hlC){x.fillStyle=(col||'#5b5bf0')+'33';x.fillRect(cx+1,cy+1,cw-2,ch-2)}
  TX(x,String(M[i][j]),cx+cw/2,cy+ch/2+5,FG,'center','700 14px "STIX Two Text",serif');
 }
};

// ==================== BAB 2: POLINOMIAL ====================
pol_op:{t:'Grafik & Operasi Polinomial Derajat Maksimum 4',sl:[['a4','Koefisien x⁴ (a₄)',-1,1,1,1],['a3','Koefisien x³ (a₃)',-3,3,0,1],['a2','Koefisien x² (a₂)',-5,5,-3,1],['a0','Konstanta (a₀)',-4,4,1,1]],
 info:P=>{const deg=P.a4!==0?4:P.a3!==0?3:P.a2!==0?2:0,p1=P.a4+P.a3+P.a2+P.a0;return `P(x) = ${P.a4}x⁴ + ${P.a3}x³ + (${P.a2})x² + (${P.a0}) · Derajat = ${deg} · Jumlah koefisien P(1) = ${p1} · Suku tetap P(0) = ${P.a0}`},
 dr(x,w,h,t,P){
  const ox=w/2,oy=h*.55,sx=38,sy=18;AX(x,w,h,ox,oy,sx);

  x.strokeStyle='#e5484d';x.lineWidth=3;x.beginPath();
  for(let px=15;px<w-15;px+=2){const u=(px-ox)/sx,y=oy-f(u)*sy;px===15?x.moveTo(px,Math.max(-20,Math.min(h+20,y))):x.lineTo(px,Math.max(-20,Math.min(h+20,y)))}
  x.stroke();
  x.fillStyle='#5b5bf0';x.beginPath();x.arc(ox,oy-P.a0*sy,6,0,7);x.fill();
  x.fillStyle='#10b981';x.beginPath();x.arc(ox+sx,oy-f(1)*sy,6,0,7);x.fill();
  TX(x,`● Biru: P(0) = a₀ = ${P.a0}`,16,24,'#5b5bf0');
  TX(x,`● Hijau: P(1) = jumlah semua koefisien = ${f(1)}`,16,44,'#10b981');
 }},
horner:{t:'Simulasi Skema Horner: P(x) = 2x³ + a₂x² − 5x + 6',sl:[['k','Nilai x = k (pembagi x − k)',-3,4,2,1],['a2','Koefisien x² (a₂)',-4,4,-3,1]],
 info:P=>{const a=[2,P.a2,-5,6],b=[a[0]];for(let i=1;i<4;i++)b.push(a[i]+P.k*b[i-1]);return `Hasil bagi H(x) = ${b[0]}x² + (${b[1]})x + (${b[2]}) · Sisa = P(${P.k}) = ${b[3]}`+(b[3]===0?` → Karena sisa 0, (x − ${P.k}) adalah FAKTOR!`:'')},
 dr(x,w,h,t,P){
  const a=[2,P.a2,-5,6],b=[a[0]],kr=['',P.k*a[0]];
  for(let i=1;i<4;i++){const m=P.k*b[i-1];if(i>1)kr.push(m);b.push(a[i]+m)}
  const x0=75,y0=52,cw=68;
  TX(x,`k = ${P.k}`,24,y0+48,'#e5484d','left','800 16px system-ui');
  x.strokeStyle=FG;x.lineWidth=2.5;x.beginPath();x.moveTo(x0-10,y0+10);x.lineTo(x0-10,y0+85);x.lineTo(x0+4*cw,y0+85);x.stroke();
  TX(x,'+',x0+4*cw+8,y0+58,FG,'left','700 18px system-ui');
  ['x³','x²','x¹','x⁰'].forEach((s,i)=>{
   const cx=x0+i*cw+cw/2;
   TX(x,s,cx,y0-6,'#888','center','600 12px system-ui');
   TX(x,String(a[i]),cx,y0+28,FG,'center','700 16px "STIX Two Text",serif');
   if(i>0){
    TX(x,String(kr[i]),cx,y0+66,'#5b5bf0','center','700 15px "STIX Two Text",serif');
    AR(x,cx-cw+12,y0+108,cx-10,y0+68,'#10b981');
   }
   if(i===3){x.fillStyle='#f59e0b33';x.fillRect(cx-26,y0+92,52,30);x.strokeStyle='#f59e0b';x.strokeRect(cx-26,y0+92,52,30)}
   TX(x,String(b[i]),cx,y0+113,i===3?'#e5484d':'#10b981','center','800 16px "STIX Two Text",serif');
  });
  TX(x,'Panah hijau: kalikan dengan k · Baris bawah: koefisien H(x) · Kotak kanan: Sisa P(k)',18,220,FG);
  TX(x,'⚠️ Ingat: jika ada pangkat yang tidak muncul di soal, koefisiennya WAJIB ditulis 0!',18,252,'#e5484d');
 }},
pol_div:{t:'Pembagian oleh (ax + b): Mengapa Hasil Bagi Dibagi a?',sl:[['a','Koefisien pembagi a pada (ax − a)',1,4,2,1],['c','Konstanta suku banyak c',-5,5,3,1]],
 info:P=>`P(x) = 4x² − 2x + ${P.c} dibagi (${P.a}x − ${P.a}) [akar x = 1] · Baris Horner memberi [4, 2] · H(x) sebenarnya = @frac{4x + 2}{${P.a}} = ${(4/P.a).toFixed(1)}x + ${(2/P.a).toFixed(1)} · Sisa tetap = ${2+P.c}`,
 dr(x,w,h,t,P){
  const s=2+P.c;
  TX(x,`Yang dibagi: P(x) = 4x² − 2x + (${P.c})`,20,42,FG,'left','700 15px system-ui');
  TX(x,`Pembagi: B(x) = ${P.a}x − ${P.a} = ${P.a}(x − 1)  →  pembuat nol k = 1`,20,72,'#5b5bf0','left','700 14px system-ui');
  x.fillStyle='#5b5bf018';x.fillRect(20,90,w-40,56);
  TX(x,`1) Hasil bagi Horner (terhadap x − 1): H_Horner(x) = 4x + 2`,30,114,FG);
  TX(x,`2) Karena pembagi (${P.a}x − ${P.a}), bagi koefisien H dengan a = ${P.a}:  H(x) = ${(4/P.a).toFixed(2)}x + ${(2/P.a).toFixed(2)}`,30,136,'#10b981','left','700 14px system-ui');

  TX(x,`Bukti identitas: (${P.a}x − ${P.a})(${(4/P.a).toFixed(2)}x + ${(2/P.a).toFixed(2)}) + (${s}) = 4x² − 2x + (${P.c}) ✓`,20,248,FG);
 }},
sisa:{t:'Teorema Sisa Pembagi Kuadrat (x − 1)(x − 2) → S(x) = px + q',sl:[['p1','Nilai P(1) = sisa dibagi (x − 1)',-6,8,3,1],['p2','Nilai P(2) = sisa dibagi (x − 2)',-6,8,7,1]],
 info:P=>{const p=P.p2-P.p1,q=2*P.p1-P.p2;return `S(1) = p + q = ${P.p1} dan S(2) = 2p + q = ${P.p2} ⇒ eliminasi: p = ${p}, q = ${q} · Jadi sisa S(x) = ${p}x + (${q})`},
 dr(x,w,h,t,P){
  const p=P.p2-P.p1,q=2*P.p1-P.p2,ox=w*.38,oy=h*.62,sx=46,sy=14;AX(x,w,h,ox,oy,sx);
  const X=u=>ox+u*sx,Y=v=>oy-v*sy;
  x.strokeStyle='#8b5cf688';x.lineWidth=2.5;x.beginPath();
  for(let px=15;px<w-15;px+=2){const u=(px-ox)/sx,v=(u-1)*(u-2)*(u+1)+p*u+q;px===15?x.moveTo(px,Y(v)):x.lineTo(px,Y(v))}
  x.stroke();
  x.strokeStyle='#e5484d';x.lineWidth=3;x.beginPath();x.moveTo(15,Y(p*(15-ox)/sx+q));x.lineTo(w-15,Y(p*(w-15-ox)/sx+q));x.stroke();
  [[1,P.p1],[2,P.p2]].forEach(([u,v])=>{x.fillStyle='#10b981';x.beginPath();x.arc(X(u),Y(v),6.5,0,7);x.fill();TX(x,`(${u}, ${v})`,X(u)+8,Y(v)-6,'#10b981')});
  TX(x,`Garis merah: S(x) = ${p}x + (${q}) memotong P(x) (ungu) tepat di x = 1 dan x = 2!`,16,24,'#e5484d');
 }},
faktor:{t:'Teorema Faktor: P(x) = (x − r₁)(x − r₂)(x − r₃)',sl:[['r1','Akar r₁',-4,0,-2,1],['r2','Akar r₂',-1,2,1,1],['r3','Akar r₃',1,4,3,1]],
 info:P=>`Faktor: (x − (${P.r1}))(x − ${P.r2})(x − ${P.r3}) · Titik potong sumbu-X di x = ${P.r1}, ${P.r2}, ${P.r3} karena P(r_i) = 0`,
 dr(x,w,h,t,P){
  const ox=w/2,oy=h/2,sx=36,sy=10;AX(x,w,h,ox,oy,sx);
  const f=u=>(u-P.r1)*(u-P.r2)*(u-P.r3);
  x.strokeStyle='#5b5bf0';x.lineWidth=3;x.beginPath();
  for(let px=15;px<w-15;px+=2){const u=(px-ox)/sx,v=f(u);px===15?x.moveTo(px,oy-v*sy):x.lineTo(px,oy-v*sy)}
  x.stroke();
  [P.r1,P.r2,P.r3].forEach((r,i)=>{const px=ox+r*sx;x.fillStyle='#e5484d';x.beginPath();x.arc(px,oy,7,0,7);x.fill();TX(x,`r_${i+1}=${r}`,px,oy+(i%2?22:-12),'#e5484d','center')});
  TX(x,`P(k) = 0 ⇔ (x − k) faktor P(x) ⇔ grafik memotong sumbu-X di (k, 0)`,16,24,FG);
 }},
vieta:{t:'Teorema Vieta pada ax³ + bx² + cx + d = 0',sl:[['a','a (koefisien x³)',1,3,1,1],['b','b (koefisien x²)',-6,6,-6,1],['c','c (koefisien x)',-10,12,11,1],['d','d (konstanta)',-10,10,-6,1]],
 info:P=>{const s1=-P.b/P.a,s2=P.c/P.a,s3=-P.d/P.a,sq=s1*s1-2*s2;return `x₁+x₂+x₃ = −@frac{b}{a} = ${s1.toFixed(2)} · x₁x₂+x₁x₃+x₂x₃ = @frac{c}{a} = ${s2.toFixed(2)} · x₁x₂x₃ = −@frac{d}{a} = ${s3.toFixed(2)} · x₁²+x₂²+x₃² = ${sq.toFixed(2)}`},

   TX(x,`= ${c[2].toFixed(2)}`,bx+12,by+70,c[3],'left','800 16px system-ui');

fn_pol:{t:'Domain & Range Fungsi Polinom: Derajat Ganjil vs Genap',sl:[['n','Derajat n (2, 3, atau 4)',2,4,4,1],['a','Koefisien utama a_n',-2,2,1,1],['c','Pergeseran vertikal c',-4,4,-2,1]],
 info:P=>{if(P.a===0)return 'Koefisien utama a_n = 0 menurunkan derajat fungsi';if(P.n===3)return `Derajat 3 (ganjil): D_f = ℝ dan R_f = ℝ (ujung kiri & kanan berlawanan arah)`;const ym=P.n===2?P.c:P.c-P.a;return `Derajat ${P.n} (genap), a_n ${P.a>0?'> 0':'< 0'}: D_f = ℝ · Range dibatasi ekstrem: R_f = ${P.a>0?`[${ym.toFixed(1)}, ∞)`:`(−∞, ${ym.toFixed(1)}]`}`},
 dr(x,w,h,t,P){
  const ox=w/2,oy=h/2,sx=42,sy=18;AX(x,w,h,ox,oy,sx);
  const f=u=>P.n===2?P.a*u*u+P.c:P.n===3?P.a*(u**3-3*u)+P.c:P.a*(u**4-2*u*u)+P.c;
  x.strokeStyle='#0ea5e9';x.lineWidth=3.2;x.beginPath();
  for(let px=15;px<w-15;px+=2){const u=(px-ox)/sx,y=oy-f(u)*sy;px===15?x.moveTo(px,y):x.lineTo(px,y)}
  x.stroke();
  if(P.n%2===0&&P.a!==0){
   const ym=P.n===2?P.c:P.c-P.a,py=oy-ym*sy;
   x.setLineDash([5,5]);x.strokeStyle='#e5484d';x.beginPath();x.moveTo(15,py);x.lineTo(w-15,py);x.stroke();x.setLineDash([]);
   TX(x,`Batas Range y = ${ym}`,20,py-8,'#e5484d');
  }
  TX(x,`D_f = ℝ · ${P.n%2?'Derajat ganjil → R_f = ℝ':'Derajat genap → R_f terbatas di satu sisi'}`,16,24,FG);
 }},
fn_ras:{t:'Fungsi Rasional f(x) = @frac{ax + 1}{x − p}: Asimtot Tegak & Datar',sl:[['p','Asimtot tegak x = p (pembuat nol penyebut)',-4,4,2,1],['a','Asimtot datar y = a (rasio koefisien x)',-3,4,1,1]],
 info:P=>`f(x) = @frac{${P.a}x + 1}{x − ${P.p}} · Domain D_f = {x ∈ ℝ | x ≠ ${P.p}} · Asimtot tegak x = ${P.p} · Asimtot datar y = ${P.a} · Range R_f = {y ∈ ℝ | y ≠ ${P.a}}`,
 dr(x,w,h,t,P){
  const ox=w/2,oy=h/2,sc=28;AX(x,w,h,ox,oy,sc);
  const ax=ox+P.p*sc,ay=oy-P.a*sc;
  x.setLineDash([6,5]);x.strokeStyle='#e5484d';x.lineWidth=2;x.beginPath();x.moveTo(ax,10);x.lineTo(ax,h-10);x.stroke();
  x.strokeStyle='#10b981';x.beginPath();x.moveTo(10,ay);x.lineTo(w-10,ay);x.stroke();x.setLineDash([]);
  x.strokeStyle='#0ea5e9';x.lineWidth=3;
  [-1,1].forEach(sg=>{x.beginPath();let st=true;for(let d=.15;d<9;d+=.1){const u=P.p+sg*d,v=(P.a*u+1)/(u-P.p),px=ox+u*sc,py=oy-v*sc;if(px<10||px>w-10||py<8||py>h-8)continue;st?(x.moveTo(px,py),st=false):x.lineTo(px,py)}x.stroke()});
  TX(x,`Asimtot tegak x = ${P.p}`,ax+6,26,'#e5484d');
  TX(x,`Asimtot datar y = ${P.a}`,18,ay-8,'#10b981');
 }},
fn_akar:{t:'Fungsi Akar f(x) = k + √(a(x − h)): Titik Awal, Domain & Range',sl:[['h','Batas domain x = h',-4,4,-1,1],['k','Nilai awal y = k',-3,3,1,1],['a','Arah di dalam akar a (−1 = kiri, +1 = kanan)',-1,1,1,2]],
 info:P=>`f(x) = ${P.k} + √(${P.a===1?'':'−'}(x − (${P.h}))) · Syarat dalam akar ≥ 0 ⇒ D_f = ${P.a>0?`[${P.h}, ∞)`:`(−∞, ${P.h}]`} · Karena √(…) ≥ 0 maka R_f = [${P.k}, ∞)`,
 dr(x,w,h,t,P){
  const ox=w/2,oy=h*.62,sc=30;AX(x,w,h,ox,oy,sc);
  const sx=ox+P.h*sc,sy=oy-P.k*sc;
  x.fillStyle='#10b98122';x.fillRect(P.a>0?sx:12,12,P.a>0?w-12-sx:sx-12,sy-12);
  x.strokeStyle='#0ea5e9';x.lineWidth=3.5;x.beginPath();
  for(let d=0;d<=8;d+=.1){const u=P.h+P.a*d,v=P.k+Math.sqrt(d);d===0?x.moveTo(ox+u*sc,oy-v*sc):x.lineTo(ox+u*sc,oy-v*sc)}
  x.stroke();
  x.fillStyle='#e5484d';x.beginPath();x.arc(sx,sy,7,0,7);x.fill();
  TX(x,`Titik awal (${P.h}, ${P.k})`,sx+(P.a>0?10:-110),sy+18,'#e5484d');
  TX(x,'Daerah hijau = kuadran Domain × Range yang valid',16,24,'#10b981');
 }},
fn_exp:{t:'Fungsi Eksponensial f(x) = a · b^x + c (Basis Bilangan Asli)',sl:[['b','Basis bilangan asli b',2,4,2,1],['a','Koefisien a',-2,2,1,1],['c','Asimtot datar c',-4,3,-1,1]],
 info:P=>P.a===0?`a = 0 → fungsi konstan y = ${P.c}`:`f(x) = ${P.a}·${P.b}^x + (${P.c}) · D_f = ℝ · Asimtot datar y = ${P.c} · Range R_f = ${P.a>0?`(${P.c}, ∞)`:`(−∞, ${P.c})`} (kurung biasa, y = ${P.c} tak pernah disentuh!)`,
 dr(x,w,h,t,P){
  const ox=w/2,oy=h*.6,sc=32;AX(x,w,h,ox,oy,sc);
  const ay=oy-P.c*sc;
  x.setLineDash([6,5]);x.strokeStyle='#e5484d';x.lineWidth=2;x.beginPath();x.moveTo(12,ay);x.lineTo(w-12,ay);x.stroke();x.setLineDash([]);
  x.strokeStyle='#0ea5e9';x.lineWidth=3.2;x.beginPath();
  for(let px=14;px<w-14;px+=2){const u=(px-ox)/sc,v=P.a*Math.pow(P.b,u)+P.c,py=oy-v*sc;px===14?x.moveTo(px,Math.max(-20,Math.min(h+20,py))):x.lineTo(px,Math.max(-20,Math.min(h+20,py)))}
  x.stroke();
  const y0=P.a+P.c;x.fillStyle='#5b5bf0';x.beginPath();x.arc(ox,oy-y0*sc,6.5,0,7);x.fill();
  TX(x,`Potong sumbu-Y: (0, a+c) = (0, ${y0})`,ox+10,oy-y0*sc-6,'#5b5bf0');
  TX(x,`Asimtot datar y = ${P.c}`,18,ay-8,'#e5484d');
 }},
fn_log:{t:'Fungsi Logaritma f(x) = ²log(x − p) + q & Invers Eksponen',sl:[['p','Asimtot tegak x = p (batas numerus)',-4,3,-1,1],['q','Pergeseran vertikal q',-3,3,0,1],['inv','Tampilkan cermin y = x (invers): 0 = tidak, 1 = ya',0,1,1,1]],
 info:P=>`f(x) = ²log(x − (${P.p})) + (${P.q}) · Syarat numerus: x − (${P.p}) > 0 ⇒ D_f = (${P.p}, ∞) · Asimtot tegak x = ${P.p} · Range R_f = ℝ`,
 dr(x,w,h,t,P){
  const ox=w*.42,oy=h*.55,sc=28;AX(x,w,h,ox,oy,sc);
  const ax=ox+P.p*sc;
  x.setLineDash([6,5]);x.strokeStyle='#e5484d';x.lineWidth=2;x.beginPath();x.moveTo(ax,10);x.lineTo(ax,h-10);x.stroke();
  if(P.inv){x.strokeStyle='#8888';x.beginPath();x.moveTo(ox-5*sc,oy+5*sc);x.lineTo(ox+5*sc,oy-5*sc);x.stroke();TX(x,'y = x',ox+4*sc,oy-4*sc-6,'#888')}
  x.setLineDash([]);
  x.strokeStyle='#0ea5e9';x.lineWidth=3.2;x.beginPath();
  for(let d=.08;d<=8;d+=.08){const u=P.p+d,v=Math.log2(d)+P.q;d<.09?x.moveTo(ox+u*sc,oy-v*sc):x.lineTo(ox+u*sc,oy-v*sc)}
  x.stroke();
  const px=ox+(P.p+1)*sc,py=oy-P.q*sc;x.fillStyle='#10b981';x.beginPath();x.arc(px,py,6.5,0,7);x.fill();
  TX(x,`Titik kunci (${P.p+1}, ${P.q}) saat numerus = 1`,px+8,py+4,'#10b981');
  TX(x,`Asimtot tegak x = ${P.p} (numerus > 0)`,ax+6,24,'#e5484d');
 }},
fn_abs:{t:'Fungsi Nilai Mutlak f(x) = a|x − h| + k',sl:[['a','Kemiringan a',-3,3,2,1],['h','Absis puncak h',-4,4,1,1],['k','Ordinat puncak k',-4,4,-2,1]],
 info:P=>P.a===0?`Fungsi konstan y = ${P.k}`:`Puncak tajam di (h, k) = (${P.h}, ${P.k}) · D_f = ℝ · Range R_f = ${P.a>0?`[${P.k}, ∞)`:`(−∞, ${P.k}]`} · Sumbu simetri x = ${P.h}`,
 dr(x,w,h,t,P){
  const ox=w/2,oy=h/2,sc=26;AX(x,w,h,ox,oy,sc);
  x.strokeStyle='#0ea5e9';x.lineWidth=3.5;x.beginPath();
  for(let px=14;px<w-14;px+=2){const u=(px-ox)/sc,v=P.a*Math.abs(u-P.h)+P.k;px===14?x.moveTo(px,oy-v*sc):x.lineTo(px,oy-v*sc)}
  x.stroke();
  const vx=ox+P.h*sc,vy=oy-P.k*sc;
  x.fillStyle='#e5484d';x.beginPath();x.arc(vx,vy,7,0,7);x.fill();
  TX(x,`Puncak (${P.h}, ${P.k})`,vx+10,vy+(P.a>=0?16:-10),'#e5484d');
  TX(x,`Range: ${P.a>0?`[${P.k}, ∞)`:P.a<0?`(−∞, ${P.k}]`:`{${P.k}}`}`,16,24,'#5b5bf0');
 }},
fn_trig:{t:'Fungsi Trigonometri f(x) = A sin(kx) + c',sl:[['A','Koefisien A (Amplitudo = |A|)',-3,3,2,1],['k','Frekuensi sudut k (Periode = @frac{360°}{k})',1,4,2,1],['c','Garis tengah vertikal c',-2,2,1,1]],
 info:P=>{const amp=Math.abs(P.A),ymx=amp+P.c,ymn=-amp+P.c;return `Amplitudo |A| = ${amp} · Periode T = @frac{2π}{${P.k}} = ${360/P.k}° · Nilai maks = ${ymx}, nilai min = ${ymn} ⇒ Range R_f = [${ymn}, ${ymx}]`},
 dr(x,w,h,t,P){
  const ox=45,oy=h/2,sy=28,gw=w-70;AX(x,w,h,ox,oy,sy);
  const amp=Math.abs(P.A),ymx=oy-(amp+P.c)*sy,ymn=oy-(-amp+P.c)*sy,ymid=oy-P.c*sy;
  x.fillStyle='#10b9811a';x.fillRect(ox,ymx,gw,ymn-ymx);
  x.setLineDash([4,4]);x.strokeStyle='#f59e0b';x.beginPath();x.moveTo(ox,ymid);x.lineTo(ox+gw,ymid);x.stroke();x.setLineDash([]);
  x.strokeStyle='#0ea5e9';x.lineWidth=3.2;x.beginPath();
  for(let i=0;i<=gw;i+=2){const th=i/gw*2*Math.PI,v=P.A*Math.sin(P.k*th)+P.c;i===0?x.moveTo(ox+i,oy-v*sy):x.lineTo(ox+i,oy-v*sy)}
  x.stroke();
  TX(x,`y_maks = ${amp+P.c}`,ox+8,ymx-6,'#10b981');
  TX(x,`garis tengah y = ${P.c}`,ox+8,ymid-6,'#f59e0b');
  TX(x,`y_min = ${-amp+P.c}`,ox+8,ymn+15,'#e5484d');
  TX(x,'360° (2π)',ox+gw-36,oy+16,FG);
 }},

vek_pos:{t:'Vektor Ruang ℝ³ (x, y, z) & Proyeksi Isometrik',sl:[['vx','Komponen x (î)',-4,5,3,1],['vy','Komponen y (ĵ)',-4,5,4,1],['vz','Komponen z (k̂)',-4,5,2,1]],

vek_len:{t:'Panjang Vektor |AB|, Jarak Dua Titik & Vektor Satuan û',sl:[['ax','x_A',-4,4,-1,1],['ay','y_A',-4,4,1,1],['bx','x_B',-4,5,3,1],['by','y_B',-4,5,4,1]],

vek_proj:{t:'Proyeksi Skalar & Proyeksi Vektor Ortogonal u pada v',sl:[['ux','u_x',-4,5,3,1],['uy','u_y',-4,5,4,1],['vx','v_x',1,5,4,1],['vy','v_y',-3,4,0,1]],

trans_mat:{t:'Komposisi Transformasi M = M₂·M₁ & Perbesaran Luas |det M|',sl:[['a','Elemen m₁₁',-2,3,2,1],['b','Elemen m₁₂',-2,3,1,1],['c','Elemen m₂₁',-2,3,0,1],['d','Elemen m₂₂',-2,3,2,1]],
 info:P=>{const D=P.a*P.d-P.b*P.c;return `Matriks M = [${P.a}, ${P.b} ; ${P.c}, ${P.d}] · det(M) = ${D} · Persegi luas 4 dipetakan menjadi jajargenjang dengan luas L′ = |det M| × 4 = ${Math.abs(D)*4}`},

lim_alj:{t:'Limit Fungsi Aljabar x → c pada Bentuk Tak Tentu @frac{0}{0}',sl:[['c','Titik pendekatan x → c',-3,3,2,1],['dx','Jarak pendekatan Δx dari kiri & kanan',.05,1.5,.4,.05]],

 dr(x,w,h,t,P){
  const ox=w/2,oy=h*.58,sc=24;AX(x,w,h,ox,oy,sc);

 }},
lim_inf:{t:'Limit Menuju Tak Hingga: √(ax² + bx + 1) − √(ax² + qx + 2)',sl:[['a','Koefisien x² (a = p)',1,9,4,1],['b','Koefisien x pertama (b)',-8,10,6,1],['q','Koefisien x kedua (q)',-8,10,-2,1]],
 info:P=>{const L=(P.b-P.q)/(2*Math.sqrt(P.a));return `Karena koefisien x² sama (a = p = ${P.a}), nilai limit menuju ∞ adalah L = @frac{b − q}{2√a} = @frac{${P.b} − (${P.q})}{2√${P.a}} = ${L.toFixed(3)}`},
 dr(x,w,h,t,P){
  const ox=45,oy=h/2,sx=24,sy=24,L=(P.b-P.q)/(2*Math.sqrt(P.a));AX(x,w,h,ox,oy,sy);

  x.stroke();

 }},
lim_trig:{t:'Limit Trigonometri: lim_(x→0) @frac{sin ax}{bx} & @frac{1 − cos ax}{x²}',sl:[['a','Koefisien sudut a',1,6,4,1],['b','Koefisien penyebut b',1,6,2,1],['tp','Tipe: 0 = @frac{sin ax}{bx}, 1 = @frac{1 − cos ax}{bx²}',0,1,0,1]],
 info:P=>P.tp===0?`lim_(x→0) @frac{sin ${P.a}x}{${P.b}x} = @frac{a}{b} = @frac{${P.a}}{${P.b}} = ${(P.a/P.b).toFixed(2)}`:`1 − cos(${P.a}x) = 2 sin²(${P.a/2}x) ⇒ lim_(x→0) @frac{1 − cos ${P.a}x}{${P.b}x²} = @frac{a²}{2b} = ${(.5*P.a*P.a/P.b).toFixed(2)}`,

mat_sim:{t:'Ilustrasi Matriks Khusus: Identitas, Diagonal, Simetris & Segitiga Atas',sl:[['tp','Jenis: 0 Identitas (I), 1 Diagonal, 2 Simetris (A^T=A), 3 Segitiga Atas',0,3,2,1],['k','Nilai elemen k',-4,6,3,1]],

pol_kali:{t:'Grafik Penjumlahan P(x)+Q(x) vs Perkalian P(x)·Q(x)',sl:[['a','Akar P(x) = x − a',-3,3,-1,1],['b','Puncak Q(x) = x² − b',0,4,2,1],['op','Mode: 0 = P(x)+Q(x) (derajat 2), 1 = P(x)·Q(x) (derajat 3)',0,1,1,1]],

sisa_kongruen:{t:'Reduksi Pangkat Pembagi Kuadrat x² + x + 1 (di mana x³ ≡ 1)',sl:[['a','Koefisien x³ (a)',-4,5,2,1],['b','Koefisien x² (b)',-4,5,-3,1]],
 info:P=>`f(x) = x⁴ + (${P.a})x³ + (${P.b})x² + x − 6 dibagi (x²+x+1) · Ganti x³ ≡ 1 dan x² ≡ −x−1 ⇒ S(x) = (${2-P.b})x + (${P.a-P.b-6})`,

   ['1. Identitas Kunci','Karena (x − 1)(x² + x + 1) = x³ − 1, maka untuk x² + x + 1 = 0 berlaku:  x² ≡ −x − 1  dan  x³ ≡ 1','#5b5bf0'],
   ['2. Ubah Pangkat ≥ 2',`x⁴ = x·(x³) ≡ x(1) = x  ,   ${P.a}x³ ≡ ${P.a}(1) = ${P.a}  ,   ${P.b}x² ≡ ${P.b}(−x − 1) = ${-P.b}x + (${-P.b})`,'#10b981'],
   ['3. Gabungkan Suku Sisa',`S(x) = x + (${P.a}) + (${-P.b}x + (${-P.b})) + x − 6  =  (${p})x + (${q})`,'#e5484d']
  ];

   const by=28+i*84;x.fillStyle=s[2]+'18';x.strokeStyle=s[2];x.lineWidth=2;x.fillRect(18,by,w-36,70);x.strokeRect(18,by,w-36,70);

fn_ras_lubang:{t:'Asimtot Tegak vs Lubang Grafik (Removable Discontinuity)',sl:[['k','Titik x = k',-3,3,2,1],['tp','Tipe: 0 = @frac{x²−k²}{x−k} (Berlubang), 1 = @frac{1}{x−k} (Asimtot Tegak)',0,1,0,1]],
 info:P=>P.tp===0?`f(x) = @frac{x² − ${P.k*P.k}}{x − ${P.k}} memiliki faktor persekutuan (x − ${P.k}) → grafik berupa garis y = x + ${P.k} yang BERLUBANG di (${P.k}, ${2*P.k}); D_f = {x ≠ ${P.k}}, R_f = {y ≠ ${2*P.k}}`:`f(x) = @frac{1}{x − ${P.k}} tidak punya faktor persekutuan → di x = ${P.k} muncul ASIMTOT TEGAK (nilai menuju ±∞)`,
 dr(x,w,h,t,P){
  const ox=w/2,oy=h/2,sc=26;AX(x,w,h,ox,oy,sc);
  const X=u=>ox+u*sc,Y=v=>oy-v*sc;
  if(P.tp===0){
   x.strokeStyle='#0ea5e9';x.lineWidth=3.2;x.beginPath();x.moveTo(X(-6),Y(-6+P.k));x.lineTo(X(6),Y(6+P.k));x.stroke();
   x.setLineDash([4,4]);x.strokeStyle='#e5484d';x.beginPath();x.moveTo(X(P.k),oy);x.lineTo(X(P.k),Y(2*P.k));x.lineTo(ox,Y(2*P.k));x.stroke();x.setLineDash([]);
   x.fillStyle='#fff';x.strokeStyle='#e5484d';x.lineWidth=3;x.beginPath();x.arc(X(P.k),Y(2*P.k),7,0,7);x.fill();x.stroke();
   TX(x,`Lubang di (${P.k}, ${2*P.k}) — bukan asimtot tegak!`,16,24,'#e5484d');
  }else{
   x.setLineDash([6,5]);x.strokeStyle='#e5484d';x.beginPath();x.moveTo(X(P.k),12);x.lineTo(X(P.k),h-12);x.stroke();x.setLineDash([]);
   x.strokeStyle='#0ea5e9';x.lineWidth=3;[-1,1].forEach(sg=>{x.beginPath();for(let d=.15;d<7;d+=.1){const u=P.k+sg*d,v=1/(u-P.k);d<.16?x.moveTo(X(u),Y(v)):x.lineTo(X(u),Y(v))}x.stroke()});
   TX(x,`Asimtot tegak x = ${P.k} (pembilang tidak ikut nol)`,16,24,'#e5484d');
  }
 }},
fn_akar_ling:{t:'Fungsi Akar Kuadrat: y = √(r² − x²) vs y = √(x² − r²)',sl:[['r','Jari-jari atau batas r',1,4,3,1],['tp','Tipe: 0 = √(r² − x²) [Setengah Lingkaran], 1 = √(x² − r²) [Hiperbola Terbuka]',0,1,0,1]],
 info:P=>P.tp===0?`f(x) = √(${P.r*P.r} − x²) · Syarat ${P.r*P.r} − x² ≥ 0 ⇒ Domain D_f = [−${P.r}, ${P.r}] · Nilai maksimum di x = 0 adalah ${P.r} ⇒ Range R_f = [0, ${P.r}]`:`f(x) = √(x² − ${P.r*P.r}) · Syarat x² − ${P.r*P.r} ≥ 0 ⇒ Domain D_f = (−∞, −${P.r}] ∪ [${P.r}, ∞) · Range R_f = [0, ∞)`,
 dr(x,w,h,t,P){
  const ox=w/2,oy=h*.68,sc=32;AX(x,w,h,ox,oy,sc);
  const X=u=>ox+u*sc,Y=v=>oy-v*sc;
  x.strokeStyle='#0ea5e9';x.lineWidth=3.5;
  if(P.tp===0){
   x.fillStyle='#10b98122';x.fillRect(X(-P.r),Y(P.r),2*P.r*sc,P.r*sc);
   x.beginPath();for(let a=0;a<=Math.PI;a+=.04){const u=P.r*Math.cos(a),v=P.r*Math.sin(a);a===0?x.moveTo(X(u),Y(v)):x.lineTo(X(u),Y(v))}x.stroke();
   PT(x,X(-P.r),oy,'#e5484d',`−${P.r}`,18);PT(x,X(P.r),oy,'#e5484d',`${P.r}`,18);PT(x,ox,Y(P.r),'#10b981',`maks y=${P.r}`,-10);
  }else{
   [-1,1].forEach(sg=>{x.beginPath();for(let d=0;d<=5;d+=.08){const u=sg*(P.r+d),v=Math.sqrt(u*u-P.r*P.r);d===0?x.moveTo(X(u),Y(v)):x.lineTo(X(u),Y(v))}x.stroke();PT(x,X(sg*P.r),oy,'#e5484d',`${sg*P.r}`,18)});
  }
 }},
fn_exp_banding:{t:'Perbandingan Kurva Eksponensial: Pertumbuhan b^x vs Peluruhan b^(−x)',sl:[['b','Basis bilangan asli b',2,5,2,1],['m','Tampilkan: 0 = b^x dan (b+1)^x, 1 = b^x dan b^(−x) (simetri sumbu-Y)',0,1,1,1]],
 info:P=>P.m===0?`Semua grafik y = b^x memotong sumbu-Y di titik yang sama (0, 1) · Untuk x > 0, basis lebih besar (${P.b+1}^x) tumbuh lebih curam daripada ${P.b}^x`:`Grafik y = ${P.b}^(−x) adalah hasil pencerminan y = ${P.b}^x terhadap sumbu-Y (monoton turun menuju asimtot y = 0)`,
 dr(x,w,h,t,P){
  const ox=w/2,oy=h*.72,sc=32;AX(x,w,h,ox,oy,sc);
  const X=u=>ox+u*sc,Y=v=>oy-v*sc;
  const f1=u=>Math.pow(P.b,u),f2=u=>P.m===0?Math.pow(P.b+1,u):Math.pow(P.b,-u);
  [[f1,'#5b5bf0',`y = ${P.b}^x`],[f2,'#e5484d',P.m===0?`y = ${P.b+1}^x`:`y = ${P.b}^(−x)`]].forEach(([fn,col,lbl],idx)=>{
   x.strokeStyle=col;x.lineWidth=3;x.beginPath();
   for(let px=15;px<w-15;px+=2){const u=(px-ox)/sc,py=Y(fn(u));px===15?x.moveTo(px,Math.max(-20,Math.min(h+20,py))):x.lineTo(px,Math.max(-20,Math.min(h+20,py)))}
   x.stroke();TX(x,lbl,20+idx*130,24,col,'left','700 14px system-ui');
  });
  PT(x,ox,Y(1),'#10b981','(0, 1)',-10);
 }},
fn_log_kuadrat:{t:'Grafik & Garis Bilangan Domain Logaritma Kuadrat f(x) = ²log(x² − a²)',sl:[['a','Batas akar kuadrat a (pada x² − a² > 0)',1,4,2,1]],
 info:P=>`Syarat numerus positif: x² − ${P.a*P.a} > 0 ⇒ (x + ${P.a})(x − ${P.a}) > 0 · Domain terpisah di dua sayap: D_f = (−∞, −${P.a}) ∪ (${P.a}, ∞) · Dua asimtot tegak di x = −${P.a} dan x = ${P.a}`,
 dr(x,w,h,t,P){
  const ox=w/2,oy=h*.56,sc=28;AX(x,w,h,ox,oy,sc);
  const X=u=>ox+u*sc,Y=v=>oy-v*sc;
  x.fillStyle='#e5484d18';x.fillRect(X(-P.a),12,2*P.a*sc,h-24);
  x.setLineDash([6,5]);x.strokeStyle='#e5484d';x.lineWidth=2;
  [-P.a,P.a].forEach(u=>{x.beginPath();x.moveTo(X(u),12);x.lineTo(X(u),h-12);x.stroke()});x.setLineDash([]);
  x.strokeStyle='#0ea5e9';x.lineWidth=3.2;
  [-1,1].forEach(sg=>{x.beginPath();for(let d=.08;d<=5;d+=.08){const u=sg*(P.a+d),v=Math.log2(u*u-P.a*P.a);d<.09?x.moveTo(X(u),Y(v)):x.lineTo(X(u),Y(v))}x.stroke()});
  TX(x,`Zona merah [−${P.a}, ${P.a}] TERLARANG karena numerus ≤ 0`,ox,30,'#e5484d','center');
 }},
fn_abs_lipat:{t:'Grafik Nilai Mutlak Polinomial y = |x² − a| & Banyak Titik Potong y = c',sl:[['a','Konstanta a pada y = |x² − a|',1,6,4,1],['c','Garis mendatar y = c',-1,6,3,1]],
 info:P=>{const n=P.c<0?0:P.c===0?2:P.c<P.a?4:P.c===P.a?3:2;return `Kurva bawah x² − ${P.a} dicerminkan ke atas sumbu-X sehingga puncak lokalnya (0, ${P.a}) · Garis y = ${P.c} memotong grafik di ${n} TITIK!`},
 dr(x,w,h,t,P){
  const ox=w/2,oy=h*.72,sc=26;AX(x,w,h,ox,oy,sc);
  const X=u=>ox+u*sc,Y=v=>oy-v*sc;
  x.setLineDash([4,4]);x.strokeStyle='#8888';x.lineWidth=2;x.beginPath();
  for(let px=15;px<w-15;px+=2){const u=(px-ox)/sc;px===15?x.moveTo(px,Y(u*u-P.a)):x.lineTo(px,Y(u*u-P.a))}x.stroke();x.setLineDash([]);
  x.strokeStyle='#0ea5e9';x.lineWidth=3.4;x.beginPath();
  for(let px=15;px<w-15;px+=2){const u=(px-ox)/sc;px===15?x.moveTo(px,Y(Math.abs(u*u-P.a))):x.lineTo(px,Y(Math.abs(u*u-P.a)))}x.stroke();
  x.strokeStyle='#e5484d';x.lineWidth=2.2;x.beginPath();x.moveTo(15,Y(P.c));x.lineTo(w-15,Y(P.c));x.stroke();
  PT(x,ox,Y(P.a),'#5b5bf0',`(0, ${P.a})`,-10);
  TX(x,`Garis merah y = ${P.c}`,22,Y(P.c)-6,'#e5484d');
 }},
fn_trig_geser:{t:'Perbandingan Sinus, Kosinus, Tangen & Pergeseran Fase (Phase Shift)',sl:[['tp','Fungsi: 0 = sin & cos, 1 = tan(x) dan asimtotnya',0,1,0,1],['sh','Pergeseran fase θ₀ (°)',-90,90,30,15]],
 info:P=>P.tp===0?`y = sin(x − (${P.sh}°)) menggeser kurva sinus sebesar ${P.sh}° · Ingat: cos(x) = sin(x + 90°)`:`y = tan(x) memiliki periode 180° (π rad), Range seluruh ℝ, dan asimtot tegak di x = 90°, 270°, …`,
 dr(x,w,h,t,P){
  const ox=45,oy=h/2,sy=42,gw=w-70;AX(x,w,h,ox,oy,sy);
  const sh=P.sh*Math.PI/180;
  if(P.tp===0){
   x.setLineDash([4,4]);x.strokeStyle='#10b98188';x.lineWidth=2;x.beginPath();
   for(let i=0;i<=gw;i+=2){const th=i/gw*2*Math.PI;i===0?x.moveTo(ox+i,oy-Math.cos(th)*sy):x.lineTo(ox+i,oy-Math.cos(th)*sy)}x.stroke();x.setLineDash([]);
   x.strokeStyle='#5b5bf0';x.lineWidth=3.2;x.beginPath();
   for(let i=0;i<=gw;i+=2){const th=i/gw*2*Math.PI;i===0?x.moveTo(ox+i,oy-Math.sin(th-sh)*sy):x.lineTo(ox+i,oy-Math.sin(th-sh)*sy)}x.stroke();
   TX(x,`Biru: sin(x − (${P.sh}°)) · Hijau putus-putus: cos(x)`,16,24,'#5b5bf0');
  }else{
   [0.25,0.75].forEach(f=>{x.setLineDash([5,5]);x.strokeStyle='#e5484d';x.beginPath();x.moveTo(ox+gw*f,12);x.lineTo(ox+gw*f,h-12);x.stroke();x.setLineDash([])});
   x.strokeStyle='#f59e0b';x.lineWidth=3;x.beginPath();let st=true;
   for(let i=0;i<=gw;i+=2){const th=i/gw*2*Math.PI,c=Math.cos(th);if(Math.abs(c)<.08){st=true;continue}const py=oy-Math.sin(th)/c*sy*.45;st?(x.moveTo(ox+i,py),st=false):x.lineTo(ox+i,py)}x.stroke();
   TX(x,'Oranye: y = tan(x) · Garis merah: asimtot tegak di 90° dan 270°',16,24,'#e5484d');
  }
 }},
vek_bidang:{t:'Vektor Posisi Dua Titik pada Bidang ℝ²: AB = b − a',sl:[['ax','x_A',-4,3,-2,1],['ay','y_A',-3,3,1,1],['bx','x_B',-2,5,3,1],['by','y_B',-3,4,3,1]],
 info:P=>{const dx=P.bx-P.ax,dy=P.by-P.ay;return `Titik pangkal A(${P.ax}, ${P.ay}) dan ujung B(${P.bx}, ${P.by}) · Vektor AB = b − a = (${P.bx}−(${P.ax}), ${P.by}−(${P.ay})) = (${dx}, ${dy})`},

vek_jajar:{t:'Aturan Jajargenjang Vektor: Penjumlahan u + v vs Selisih u − v',sl:[['ux','u_x',1,5,3,1],['uy','u_y',-2,4,1,1],['vx','v_x',-2,4,1,1],['vy','v_y',1,4,3,1]],

vek_kos:{t:'Perbandingan Panjang |a + b| vs |a − b| Saat Sudut θ Berubah',sl:[['la','Panjang |a|',2,5,3,1],['lb','Panjang |b|',2,5,4,1],['th','Sudut antarvektor θ (°)',0,180,60,15]],

ling_titik:{t:'Kedudukan Titik T(x₁, y₁) & Kuasa Titik K terhadap Lingkaran',sl:[['x1','Absis titik T (x₁)',-4,5,3,1],['y1','Ordinat titik T (y₁)',-4,5,2,1],['r','Jari-jari lingkaran r',2,5,3,1]],

 }},
lim_kiri_kanan:{t:'Syarat Eksistensi Limit: Limit Kiri vs Limit Kanan pada Fungsi Sepenggal',sl:[['k','Konstanta potong kanan k (saat x ≥ 1)',-2,4,2,1]],
 info:P=>{const l1=3,l2=1+P.k;return `Di x = 1: limit kiri lim_(x→1⁻) (x + 2) = ${l1} · limit kanan lim_(x→1⁺) (x² + ${P.k}) = ${l2} → ${l1===l2?'SAMA! Maka lim_(x→1) f(x) = 3 ADA':'BERBEDA! Maka lim_(x→1) f(x) TIDAK ADA (lompatan grafik)'}`},
 dr(x,w,h,t,P){
  const ox=w/2,oy=h*.65,sc=28;AX(x,w,h,ox,oy,sc);
  const X=u=>ox+u*sc,Y=v=>oy-v*sc,l1=3,l2=1+P.k;
  x.strokeStyle='#5b5bf0';x.lineWidth=3.2;x.beginPath();x.moveTo(X(-5),Y(-3));x.lineTo(X(1),Y(3));x.stroke();
  x.strokeStyle='#10b981';x.lineWidth=3.2;x.beginPath();for(let u=1;u<=4;u+=.1){u===1?x.moveTo(X(u),Y(u*u+P.k)):x.lineTo(X(u),Y(u*u+P.k))}x.stroke();
  PT(x,X(1),Y(l1),'#5b5bf0',`kiri=${l1}`,-12);
  PT(x,X(1),Y(l2),'#10b981',`kanan=${l2}`,18);
  TX(x,l1===l2?'✅ Kurva menyambung di (1, 3) → Limit ADA':'❌ Kurva terputus (lompat) di x = 1 → Limit TIDAK ADA',16,24,l1===l2?'#10b981':'#e5484d');
 }},
lim_inf_ras:{t:'Grafik Limit Rasional x → ∞: Perbandingan Derajat Pembilang (n) vs Penyebut (m)',sl:[['tp','Kasus: 0 (n = m → L = @frac{a}{b}), 1 (n < m → L = 0), 2 (n > m → L = ∞)',0,2,0,1],['a','Koefisien utama pembilang a',1,4,3,1]],
 info:P=>P.tp===0?`Derajat sama (n = m = 2): f(x) = @frac{${P.a}x² + 1}{x² + 2} → saat x → ∞ kurva mendatar mendekati asimtot y = @frac{${P.a}}{1} = ${P.a}`:P.tp===1?`Derajat pembilang lebih kecil (n < m): f(x) = @frac{${P.a}x}{x² + 2} → saat x → ∞ kurva turun mendekati y = 0`:`Derajat pembilang lebih besar (n > m): f(x) = @frac{${P.a}x³}{x² + 2} → saat x → ∞ kurva terus naik menuju +∞`,
 dr(x,w,h,t,P){
  const ox=45,oy=h*.72,sx=28,sy=28;AX(x,w,h,ox,oy,sy);
  const f=u=>P.tp===0?(P.a*u*u+1)/(u*u+2):P.tp===1?(P.a*u)/(u*u+2):(P.a*u**3)/(u*u+2)/3;
  if(P.tp<2){
   const L=P.tp===0?P.a:0;x.setLineDash([6,5]);x.strokeStyle='#e5484d';x.lineWidth=2;x.beginPath();x.moveTo(ox,oy-L*sy);x.lineTo(w-14,oy-L*sy);x.stroke();x.setLineDash([]);
   TX(x,`Limit x → ∞ adalah L = ${L}`,ox+20,oy-L*sy-8,'#e5484d');
  }
  x.strokeStyle='#8b5cf6';x.lineWidth=3.2;x.beginPath();
  for(let i=0;i<=w-ox-20;i+=2){const u=i/sx,py=oy-f(u)*sy;i===0?x.moveTo(ox+i,py):x.lineTo(ox+i,Math.max(10,py))}
  x.stroke();
 }}

};
