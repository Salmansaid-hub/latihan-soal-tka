n, Fe, Co, Ni, Cu, Zn) mengisi subkulit **3d** dan memiliki sifat khas: bersifat logam, memiliki berbagai tingkat bilangan oksidasi, senyawanya berwarna, bersifat **paramagnetik** (jika punya elektron tak berpasangan pada orbital d), dan dapat membentuk **Ion Kompleks**. Pengecualian penting: **Sc^(3+)** (3d^0), **Ti^(4+)** (3d^0), **Cu^(+)** (3d^(10)), dan **Zn^(2+)** (3d^(10)) **TIDAK BERWARNA** dan bersifat **DIAMAGNETIK** karena subkulit 3d-nya kosong atau penuh! Ion kompleks tersusun atas **Ion Pusat** (asam Lewis) dan **Ligan** (basa Lewis penyumbang PEB, sebanyak **Bilangan Koordinasi**). <b>Langkah soal:</b> (1) Untuk menghitung muatan ion pusat: Muatan Kompleks = Muatan Ion Pusat + Sigma(Muatan Ligan). Ingat ligan netral (muatan 0): **H_2O (akua)**, **NH_3 (amina)**, **CO (karbonil)**; ligan bermuatan -1: **Cl^(-) (kloro)**, **CN^(-) (siano)**, **OH^(-) (hidrokso)**, **F^(-) (fluoro)**. (2) Dalam tata nama IUPAC ion kompleks: sebutkan jumlah ligan (di, tri, tetra, penta, heksa) + nama ligan (alfabetis) + nama ion pusat (jika ion kompleks bermuatan NEGATIF, nama logam diakhiri **-at** dengan angka Romawi biloksnya, misal Besi -> Ferat, Tembaga -> Kuprat, Kromium -> Kromat, Seng -> Zinkat). <b>Jebakan:</b> Menganggap Seng (Zn, Z = 30) memiliki senyawa berwarna dan banyak biloks seperti logam transisi lainnya, padahal Zn hanya punya biloks +2 dengan orbital 3d^(10) penuh sehingga senyawanya TAK BERWARNA dan diamagnetik! <b>Poin TKA:</b> Jika 1 mol senyawa kompleks CoCl_3.4NH_3 direaksikan dengan larutan AgNO_3 berlebih dan hanya menghasilkan **1 mol endapan AgCl**, berarti hanya ada 1 ion Cl^(-) di luar kurung koordinasi, sehingga rumus kompleksnya adalah **[Co(NH_3)_4Cl_2]Cl**!", "Muatan Kompleks = Biloks Pusat + Sigma Muatan Ligan ; 3d^0 & 3d^(10) -> Tak Berwarna & Diamagnetik ; 3d^1..3d^9 -> Berwarna & Paramagnetik", ["kompleks"]], ["6.3 Kelimpahan Mineral & Proses Industri Kimia", "<b>Konsep:</b> Logam dan unsur nonlogam di alam ditemukan dalam bentuk mineral atau bijih dan diolah melalui proses industri yang khas: (1) **Aluminium (Al)**: bijih utama **Bauksit (Al_2O_3.nH_2O)** dan **Kriolit (Na_3AlF_6)**; diolah dengan **Proses Hall-Heroult** (pemurnian bauksit lalu elektrolisis lelehan Al_2O_3 dalam kriolit cair untuk menurunkan titik leleh dari 2.000 °C menjadi ~950 °C). (2) **Besi (Fe)**: bijih **Hematit (Fe_2O_3)**, **Magnetit (Fe_3O_4)**, **Siderit (FeCO_3)**, **Pirit (FeS_2)**; direduksi dengan gas CO dalam **Tanur Tinggi (Blast Furnace)**. (3) **Tembaga (Cu)**: bijih **Kalkopirit (CuFeS_2)** dan **Malakit**; melalui flotasi, pemanggangan, dan pemurnian elektrolisis. (4) **Proses Industri Lainnya**: **Down** (elektrolisis lelehan NaCl -> logam Na), **Frasch** (penambangan Belerang S dengan air superpanas), **Haber-Bosch** (amonia NH_3), **Ostwald** (asam nitrat HNO_3), **Kontak atau Bilik Timbal** (asam sulfat H_2SO_4), dan **Wohler** (urea). <b>Langkah soal:</b> (1) Pasangkan nama unsur, nama mineral bijihnya, dan nama proses pengolahannya! (2) Ingat fungsi **Kriolit (Na_3AlF_6)** pada proses Hall-Heroult (sebagai pelarut lelehan Al_2O_3 dan penurun titik leleh) serta fungsi **Batu Kapur (CaCO_3)** pada Tanur Tinggi besi (mengikat pengotor pasir SiO_2 menjadi terak (slag) CaSiO_3 yang mengapung di atas besi cair). <b>Jebakan:</b> Tertukar antara proses pembuatan Amonia (**Haber-Bosch**), Asam Nitrat (**Ostwald**), Asam Sulfat (**Kontak**), dan Belerang (**Frasch**), atau mengira logam Natrium dibuat dari elektrolisis LARUTAN NaCl (padahal wajib dari **LELEHAN NaCl** pada sel Down!). <b>Poin TKA:</b> Tabel pasangan (Unsur - Mineral - Proses Pembuatan - Kegunaan) adalah soal langganan tetap TKA Kimia Unsur!", "Al: Bauksit (Hall-Heroult) ; Fe: Hematit (Tanur Tinggi) ; Na: Lelehan NaCl (Sel Down) ; S: Frasch ; NH_3: Haber-Bosch ; H_2SO_4: Kontak ; HNO_3: Ostwald", ["metalurgi"]], ["6.4 Radioaktivitas, Sinar Radioaktif & Kestabilan Inti", "<b>Konsep:</b> Inti atom yang tidak stabil mengalami peluruhan radioaktif secara spontan dengan memancarkan partikel atau radiasi untuk mencapai **Pita Kestabilan** (rasio neutron terhadap proton **⟦F:n¦p⟧**: untuk unsur ringan Z <= 20 stabil pada **⟦F:n¦p⟧ = 1,0**; untuk unsur berat hingga Z = 83 Bi stabil pada **⟦F:n¦p⟧ ~ 1,5**; semua unsur dengan **Z > 83** bersifat radioaktif). Partikel dasar radiokimia: **Alfa (^(4)_(2)He atau ^(4)_(2)alpha)**, **Beta (Elektron) (^(0)_(-1)e atau ^(0)_(-1)beta)**, **Positron (^(0)_(+1)e atau ^(0)_(+1)beta^(+))**, **Gamma (^(0)_(0)gamma)**, **Proton (^(1)_(1)p)**, dan **Neutron (^(1)_(0)n)**. Daya tembus: **gamma > beta > alfa**; Daya pengion: **alfa > beta > gamma**. <b>Langkah soal:</b> Cara menentukan jenis peluruhan nuklida tidak stabil agar masuk ke Pita Kestabilan: (1) **Di ATAS pita kestabilan (kelebihan neutron, rasio ⟦F:n¦p⟧ terlalu besar)**: inti mengubah neutron menjadi proton (**^(1)_(0)n -> ^(1)_(1)p + ^(0)_(-1)beta**) dengan **memancarkan partikel Beta (^(0)_(-1)e)** atau memancarkan neutron! (2) **Di BAWAH pita kestabilan (kelebihan proton, rasio ⟦F:n¦p⟧ terlalu kecil)**: inti mengubah proton menjadi neutron dengan **memancarkan Positron (^(0)_(+1)e)** atau melakukan **Tangkapan Elektron K**! (3) **Di KANAN pita kestabilan (inti terlalu berat, Z > 83)**: inti **memancarkan partikel Alfa (^(4)_(2)He)**! <b>Jebakan:</b> Tertukar antara pancaran Beta negatif (^(0)_(-1)beta, untuk inti di ATAS pita kestabilan yang kelebihan neutron) dengan Positron (^(0)_(+1)beta^(+), untuk inti di BAWAH pita kestabilan yang kelebihan proton)! <b>Poin TKA:</b> Pada persamaan reaksi inti, jumlah nomor massa (A, atas) dan jumlah nomor atom (Z, bawah) di ruas kiri dan kanan panah WAJIB SAMA! Gunakan ini untuk mencari partikel X yang belum diketahui.", "Sigma A_(kiri) = Sigma A_(kanan) ; Sigma Z_(kiri) = Sigma Z_(kanan) ; Atas Pita (n > p) -> Pancar ^(0)_(-1)beta ; Bawah Pita (p > n) -> Pancar ^(0)_(+1)e ; Z > 83 -> Pancar ^(4)_(2)alpha", ["radioaktif"]], ["6.5 Waktu Paruh (t_(⟦F:1¦2⟧)), Kinetika Peluruhan & Aplikasi Radioisotop", "<b>Konsep:</b> Peluruhan radioaktif mengikuti kinetika reaksi orde satu di mana laju peluruhan sebanding dengan jumlah inti radioaktif yang ada. **Waktu Paruh (t_(⟦F:1¦2⟧))** adalah waktu yang diperlukan agar jumlah atau aktivitas zat radioaktif meluruh hingga tersisa **SETENGAH (⟦F:1¦2⟧)** dari jumlah semula: **N_t = N_0 × (⟦F:1¦2⟧)^(⟦F:t¦t_(⟦F:1¦2⟧)⟧)**. Nilai waktu paruh bersifat konstan untuk setiap radioisotop dan TIDAK dipengaruhi oleh suhu, tekanan, maupun ikatan kimia! <b>Langkah soal:</b> (1) Hitung berapa kali peluruhan paruh terjadi: **n = ⟦F:t¦t_(⟦F:1¦2⟧)⟧**, lalu hitung massa atau aktivitas yang **TERSISA**: N_t = N_0 × (⟦F:1¦2⟧)^n. (2) Hati-hati membaca pertanyaan soal: apakah yang ditanyakan adalah jumlah zat yang **TERSISA (N_t)** ataukah jumlah zat yang **SUDAH MELURUH (N_(luruh) = N_0 - N_t)**! (3) Hafalkan aplikasi radioisotop penting: **C-14** (penanggalan umur fosil organik), **U-238** (umur batuan), **I-131** (kelenjar tiroid (gondok)), **Co-60** (radioterapi kanker), **Tc-99m** (pencitraan medis jantung dan tulang), **Na-24** (mendeteksi penyumbatan pembuluh darah & kebocoran pipa air). <b>Jebakan:</b> Jika dalam soal diketahui perbandingan isotop induk X terhadap isotop anak hasil peluruhan Y adalah 1 : 3, siswa sering mengira ⟦F:N_t¦N_0⟧ = ⟦F:1¦3.⟧ Padahal jumlah mula-mula adalah **N_0 = N_X + N_Y = 1 + 3 = 4 bagian**, sehingga fraksi yang tersisa adalah **⟦F:N_t¦N_0⟧ = ⟦F:1¦4⟧ = (⟦F:1¦2⟧)^2** (sudah 2 kali waktu paruh)! <b>Poin TKA:</b> Jebakan rasio inti induk : inti anak (N_X : N_Y = 1 : 3 berarti tersisa ⟦F:1¦1+3⟧ = ⟦F:1¦4,⟧ atau 1 : 7 berarti tersisa ⟦F:1¦8⟧) serta pasangan radioisotop dan kegunaannya adalah soal favorit TKA!", "N_t = N_0 xx (⟦F:1¦2⟧)^(⟦F:t¦t_(⟦F:1¦2⟧)⟧) ; n = ⟦F:t¦t_(⟦F:1¦2⟧)⟧ ; N_(meluruh) = N_0 - N_t ; lambda = ln⟦F:2¦t_(⟦F:1¦2⟧)⟧ = ⟦F:0,693¦t_(⟦F:1¦2⟧)⟧", ["waktuparuh"]], ["6.6 Kimia Lingkungan, Kesadahan Air & Kimia Hijau", "<b>Konsep:</b> Kimia lingkungan mempelajari dampak zat kimia terhadap ekosistem dan solusinya melalui **12 Prinsip Kimia Hijau (Green Chemistry)**: (1) **Kesadahan Air**: air yang mengandung kation **Ca^(2+)** dan **Mg^(2+)** tinggi sehingga sabun sukar berbusa (membentuk endapan buih sabun (*scum*)). **Kesadahan Sementara** mengandung ion bikarbonat **HCO_3^(-)** (Ca(HCO_3)⟦F:_2¦Mg(HCO_3)⟧_2) dan dapat dihilangkan cukup dengan **PEMANASAN (PENDIDIHAN)** (mengendap sebagai CaCO_3). **Kesadahan Tetap** mengandung ion **SO_4^(2-) atau Cl^(-)** (CaSO_4, MgCl_2) dan tidak hilang dengan pemanasan; harus dihilangkan dengan penambahan **Soda Abu (Na_2CO_3)** atau resin penukar ion (zeolit). (2) **Pencemaran Udara**: gas **CO** (berikatan kuat dengan hemoglobin membentuk karboksihemoglobin HbCO), **CO_2 & CH_4** (efek rumah ⟦F:kaca¦pemanasan⟧ global), **SO_2 & NO_x** (hujan asam H_2SO_4 dan HNO_3), serta **CFC (Freon)** (merusak lapisan ozon O_3 melalui radikal bebas Cl). (3) **Parameter Kualitas Air**: **DO** (*Dissolved Oxygen*, makin besar makin baik), **BOD** (*Biochemical Oxygen Demand*) & **COD** (*Chemical Oxygen Demand*, makin kecil makin bersih). <b>Langkah soal:</b> (1) Untuk soal kesadahan air: jika soal menanyakan cara menghilangkan kesadahan TETAP (atau kesadahan sementara sekaligus tetap), pilih penambahan **Na_2CO_3 (natrium karbonat)**! (2) Dalam **Ekonomi Atom (Atom Economy)** pada Kimia Hijau: % Ekonomi Atom = (⟦F:Mr Produk Target¦Sigma Mr Reaktan⟧) × 100% (reaksi adisi memiliki ekonomi atom 100% karena tidak ada limbah hasil samping!). <b>Jebakan:</b> Menganggap bahwa air sungai yang sehat harus memiliki nilai BOD dan COD yang tinggi. Padahal **BOD tinggi berarti pencemaran limbah organik tinggi**, sedangkan yang harus tinggi pada air bersih adalah **DO (oksigen terlarut)**! <b>Poin TKA:</b> Perbedaan Kesadahan Sementara (HCO_3^(-), hilang dengan dipanaskan) vs Kesadahan Tetap (SO_4^(2-) atau Cl^(-), hilang dengan ditambah Na_2CO_3) serta dampak gas polutan (CO vs CO_2 vs SO_2 vs CFC) sering keluar di TKA!", "Sadah Sementara: Ca(HCO_3)_2 --(panas)--> CaCO_3(s) + H_2O + CO_2 ; Sadah Tetap: CaSO_4 + Na_2CO_3 -> CaCO_3(s) + Na_2SO_4 ; %Ekonomi Atom = (⟦F:Mr_(target)¦Sigma⟧ Mr_(reaktan)) xx 100%", ["lingkungan"]]]}];
const EX={"0.0": {"x": ["Ion X^(3+) memiliki 10 elektron dan 14 neutron. Tentukan nomor atom, nomor massa, dan notasi nuklida unsur X, serta tentukan apakah X^(3+) isoelektron dengan ion O^(2-) (Z = 8)!", "Diketahui ion X^(3+) (muatan q = +3) memiliki jumlah elektron e = 10 dan neutron n = 14.||Dari rumus e = Z - q, maka 10 = Z - (+3) sehingga nomor atom Z = 13 (jumlah proton = 13).||Nomor massa A = Z + n = 13 + 14 = 27. Maka notasi nuklidanya adalah ^(27)_(13)X (Aluminium).||Ion O^(2-) dengan Z = 8 memiliki jumlah elektron e = 8 - (-2) = 10 elektron. Karena sama-sama memiliki 10 elektron, X^(3+) dan O^(2-) adalah pasangan isoelektron.", "Z = 13, A = 27 (^(27)_(13)X), dan keduanya merupakan pasangan isoelektron (10 elektron)."], "x2": ["Suatu unsur logam M memiliki tiga isotop stabil di alam: ^(24)M, ^(25)M, dan ^(26)M. Diketahui massa atom relatif rata-rata M adalah 24,3 dan perbandingan kelimpahan isotop ^(25)M terhadap ^(26)M adalah 1 : 1. Jika sebanyak 4,86 gram logam M murni direaksikan sempurna dengan asam menghasilkan ion M^(2+) (diketahui jumlah neutron pada isotop paling melimpah adalah 12), tentukan persentase kelimpahan masing-masing isotop dan jumlah total elektron yang terdapat dalam seluruh ion M^(2+) yang terbentuk! (L = 6,02 xx 10^(23))", "Misalkan kelimpahan ^(25)M = x% dan ^(26)M = x%, maka kelimpahan ^(24)M = (100 - 2x)%.||Gunakan rumus Ar rata-rata: 24,3 = ⟦F:24(100 - 2x) + 25x + 26x¦100⟧ -> 2430 = 2400 - 48x + 51x -> 3x = 30 -> x = 10%. Maka kelimpahan ^(24)M = 80%, ^(25)M = 10%, dan ^(26)M = 10%.||Isotop paling melimpah adalah ^(24)M (A = 24) dengan neutron n = 12, sehingga nomor atom Z = A - n = 24 - 12 = 12 (Magnesium). Ion M^(2+) memiliki jumlah elektron e = Z - 2 = 12 - 2 = 10 elektron per ion.||Mol logam M = ⟦F:4,86¦24,3⟧ = 0,20 mol. Maka jumlah total elektron dalam seluruh ion M^(2+) = 0,20 mol xx 10 xx 6,02 xx 10^(23) = 1,204 xx 10^(24) elektron.", "Kelimpahan ^(24)M = 80%, ^(25)M = 10%, ^(26)M = 10%; jumlah total elektron dalam ion M^(2+) = 2,0 mol elektron (1,204 xx 10^(24) elektron)."], "z": [["Diketahui nuklida ^(56)_(26)Fe. Jumlah proton, elektron, dan neutron pada ion Fe^(3+) berturut-turut adalah...", ["26, 26, 30", "26, 23, 30", "23, 26, 30", "26, 29, 30"], 1, "Proton tetap Z = 26. Ion Fe^(3+) melepas 3 elektron sehingga e = 26 - 3 = 23. Neutron n = A - Z = 56 - 26 = 30."], ["Unsur Klorin di alam terdiri atas dua isotop: ^(35)Cl (kelimpahan 75%) dan ^(37)Cl (kelimpahan 25%). Massa atom relatif (Ar) Cl adalah...", ["35,2", "35,5", "36,0", "36,5"], 1, "Ar Cl = ⟦F:75 × 35 + 25 × 37¦100⟧ = ⟦F:2625 + 925¦100⟧ = 35,5."], ["🔥 [HOTS] Ion poliatomik X_2O_7^(2-) memiliki total 106 elektron dan 112 neutron di dalam seluruh intinya. Jika diketahui nuklida oksigen adalah ^(16)_8O, maka notasi nuklida untuk satu atom netral X adalah...", ["^(50)_(24)X", "^(52)_(24)X", "^(55)_(25)X", "^(56)_(26)X"], 1, "Dalam X_2O_7^(2-) terdapat 2 atom X, 7 atom O (Z_O = 8, n_O = 8), dan 2 elektron tambahan (muatan -2). Dari total elektron: 2 Z_X + 7(8) + 2 = 106 -> 2 Z_X = 48 -> Z_X = 24. Dari total neutron: 2 n_X + 7(8) = 112 -> 2 n_X = 56 -> n_X = 28. Nomor massa A_X = Z_X + n_X = 24 + 28 = 52 (nuklida ^(52)_(24)X)."], ["🔥 [HOTS] Unsur Galium terdiri atas dua isotop yaitu ^(69)Ga dan ^(71)Ga. Jika 13,96 gram Galium murni tepat bereaksi dengan gas klorin berlebih membentuk 35,26 gram GaCl_3 (Ar Cl = 35,5), maka persentase kelimpahan isotop ^(69)Ga di alam adalah...", ["50%", "60%", "75%", "80%"], 1, "Massa Cl dalam GaCl_3 = 35,26 - 13,96 = 21,30 g -> mol Cl = ⟦F:21,30¦35,5⟧ = 0,60 mol. Karena dalam GaCl_3 rasio mol Ga : Cl = 1 : 3, maka mol Ga = ⟦F:0,60¦3⟧ = 0,20 mol. Ar Ga = ⟦F:13,96¦0,20⟧ = 69,8. Dari 69x + 71(1 - x) = 69,8 -> 2x = 1,2 -> x = 0,60 (60%)."]], "m": ["Ketika atom membentuk kation X^(2+), nomor atom Z ikut berkurang sebanyak 2.", "Menganggap muatan ion berasal dari perubahan jumlah proton di dalam inti atom.", "Proton terikat kuat di dalam inti oleh gaya inti kuat; ionisasi hanya melibatkan pelepasan atau penangkapan elektron di kulit terluar sehingga nomor atom Z selalu tetap."]}, "0.1": {"x": ["Tentukan konfigurasi elektron dan keempat bilangan kuantum dari elektron terakhir atom V (Z = 23), serta tuliskan konfigurasi elektron ion V^(3+)!", "Konfigurasi elektron atom netral V (Z = 23) menurut Aufbau: 1s^2 2s^2 2p^6 3s^2 3p^6 4s^2 3d^3 atau disingkat [Ar] 4s^2 3d^3.||Elektron terakhir berada pada subkulit 3d^3. Maka bilangan kuantum utama n = 3 dan azimut l = 2 (subkulit d).||Subkulit d memiliki 5 orbital dengan nilai m = -2, -1, 0, +1, +2. Pengisian 3 elektron pertama sejajar (aturan Hund) menempati m = -2, -1, dan 0. Jadi m = 0 dan spin s = +⟦F:1¦2⟧.||Untuk ion V^(3+) (melepas 3 elektron): lepas 2 elektron dari kulit terluar 4s terlebih dahulu, baru 1 elektron dari 3d. Hasilnya: [Ar] 3d^2.", "n = 3, l = 2, m = 0, s = +⟦F:1¦2⟧; konfigurasi V^(3+) adalah [Ar] 3d^2."], "x2": ["Suatu ion logam transisi M^(3+) memiliki momen magnetik spin murni mu_s = sqrt(n(n+2)) sebesar sqrt(35) Bohr Magneton (di mana n adalah jumlah elektron tak berpasangan pada orbital 3d) dan nomor atom M kurang dari 28. Tentukan: (a) jumlah elektron tak berpasangan pada M^(3+), (b) nomor atom M dan konfigurasi keadaan dasar atom netral M, serta (c) keempat bilangan kuantum elektron terakhir dari atom netral M!", "Dari persamaan mu_s = sqrt(n(n+2)) = sqrt(35), diperoleh n(n + 2) = 35 -> n^2 + 2n - 35 = 0 -> (n - 5)(n + 7) = 0, sehingga jumlah elektron tak berpasangan pada M^(3+) adalah n = 5 elektron.||Agar memiliki 5 elektron tak berpasangan pada subkulit 3d, konfigurasi ion M^(3+) haruslah [Ar] 3d^5 (setengah penuh).||Kembalikan 3 elektron yang dilepas (2 elektron ke 4s dan 1 elektron ke 3d) untuk memperoleh atom netral M: [Ar] 4s^2 3d^6, sehingga nomor atom Z = 18 + 2 + 6 = 26 (Besi, Fe).||Elektron terakhir (ke-26) masuk ke orbital pertama subkulit 3d^6 dengan arah spin ke bawah (berpasangan): n = 3, l = 2, m = -2, dan s = -⟦F:1¦2⟧.", "(a) 5 elektron tak berpasangan; (b) Z = 26 ([Ar] 4s^2 3d^6); (c) n = 3, l = 2, m = -2, s = -⟦F:1¦2⟧."], "z": [["Konfigurasi elektron yang tepat untuk atom Kromium (Z = 24) pada keadaan dasar adalah...", ["[Ar] 4s^2 3d^4", "[Ar] 4s^1 3d^5", "[Ar] 3d^6", "[Ar] 4s^2 4p^4"], 1, "Subkulit d cenderung mencapai kestabilan setengah penuh (d^5), sehingga 1 elektron dari 4s tereksitasi ke 3d menghasilkan [Ar] 4s^1 3d^5."], ["Keempat bilangan kuantum yang TIDAK mungkin dimiliki oleh suatu elektron dalam atom adalah...", ["n = 3, l = 2, m = -2, s = +⟦F:1¦2⟧", "n = 2, l = 1, m = 0, s = -⟦F:1¦2⟧", "n = 3, l = 3, m = -1, s = +⟦F:1¦2⟧", "n = 4, l = 0, m = 0, s = -⟦F:1¦2⟧"], 2, "Nilai bilangan kuantum azimut l maksimum adalah n - 1. Jika n = 3, nilai l hanya boleh 0, 1, atau 2 (tidak boleh l = 3)."], ["🔥 [HOTS] Elektron pada ion He^(+) (Z = 2) mengalami eksitasi dari keadaan dasar ke kulit ke-4. Jika tetapan Rydberg untuk atom hidrogen adalah R_H, maka panjang gelombang foton yang diserap pada transisi tersebut adalah...", ["⟦F:4¦15 R_H⟧", "⟦F:16¦15 R_H⟧", "⟦F:1¦15 R_H⟧", "⟦F:4¦3 R_H⟧"], 0, "Untuk ion 1 elektron berlaku ⟦F:1¦lambda⟧ = Z^2 R_H (⟦F:1¦n_1^2⟧ - ⟦F:1¦n_2^2⟧). Dengan Z = 2, n_1 = 1, dan n_2 = 4: ⟦F:1¦lambda⟧ = 4 R_H (1 - ⟦F:1¦16⟧) = 4 R_H (⟦F:15¦16⟧) = (⟦F:15¦4⟧) R_H. Maka lambda = ⟦F:4¦15 R_H⟧."], ["🔥 [HOTS] Jumlah maksimum elektron dalam suatu atom berkonfigurasi keadaan dasar Z = 29 (Tembaga) yang memiliki bilangan kuantum magnetik m = 0 adalah...", ["12 elektron", "13 elektron", "14 elektron", "15 elektron"], 1, "Konfigurasi Z = 29 (Cu) adalah 1s^2 2s^2 2p^6 3s^2 3p^6 4s^1 3d^(10). Setiap subkulit s, p, maupun d memiliki tepat SATU orbital dengan nilai m = 0. Orbital m = 0 pada 1s(2), 2s(2), 2p(2), 3s(2), 3p(2), 3d(2) semuanya terisi penuh (12 elektron), ditambah 4s^1(1 elektron) = 13 elektron!"]], "m": ["Konfigurasi ion Fe^(2+) (Z = 26) adalah [Ar] 4s^2 3d^4 karena 3d ditulis paling belakang.", "Melepas elektron dari subkulit yang energinya diisi terakhir (3d), bukan dari kulit dengan bilangan kuantum utama terbesar (4s).", "Saat ionisasi, elektron selalu lepas dari kulit terluar (n terbesar, yaitu 4s) lebih dulu, sehingga Fe^(2+) berkonfigurasi [Ar] 3d^6."]}, "0.2": {"x": ["Ion M^(2+) memiliki konfigurasi elektron [Ar] 3d^8. Tentukan nomor atom M serta letak golongan dan periodenya dalam Sistem Periodik Unsur!", "Ion M^(2+) terbentuk setelah atom M melepas 2 elektron dari kulit 4s. Jumlah elektron M^(2+) = 18 (Ar) + 8 = 26 elektron.||Kembalikan ke atom netral M: tambahkan kembali 2 elektron pada subkulit 4s sehingga konfigurasi atom M adalah [Ar] 4s^2 3d^8 (Z = 28, Nikel).||Nomor kulit terbesar adalah n = 4, sehingga unsur M terletak pada Periode 4.||Subkulit terakhir berada pada blok d dengan jumlah elektron valensi 4s^2 + 3d^8 = 10 elektron. Jumlah s + d = 8, 9, atau 10 termasuk ke dalam Golongan VIIIB (Golongan 10 IUPAC).", "Nomor atom Z = 28, terletak pada Golongan VIIIB (Golongan 10) dan Periode 4."], "x2": ["Sebanyak 1,12 gram suatu logam transisi periode 4 (logam L) dilarutkan dalam asam encer tanpa udara menghasilkan larutan garam LSO_4 dan 448 mL gas H_2 pada keadaan standar (STP). Diketahui inti atom L memiliki 30 neutron. Tentukan: (a) Ar dan nomor atom L, (b) konfigurasi elektron ion L^(2+), dan (c) golongan serta periode unsur L pada SPU!", "Reaksi: L(s) + H_2SO_4(aq) -> LSO_4(aq) + H_2(g). Mol H_2 = ⟦F:0,448¦22,4⟧ = 0,02 mol = mol L.||Massa atom relatif Ar L = ⟦F:1,12¦0,02⟧ = 56 ⟦F:g¦mol⟧.||Karena jumlah neutron n = 30, maka nomor atom Z = A - n = 56 - 30 = 26.||Konfigurasi atom netral L (Z = 26): [Ar] 4s^2 3d^6, sehingga terletak pada Periode 4 dan Golongan VIIIB (jumlah elektron s + d = 2 + 6 = 8). Konfigurasi ion L^(2+) setelah melepas 2 elektron 4s adalah [Ar] 3d^6.", "(a) Ar = 56, Z = 26; (b) L^(2+) = [Ar] 3d^6; (c) Golongan VIIIB (Golongan 8), Periode 4."], "z": [["Suatu unsur memiliki nomor atom Z = 35. Dalam Sistem Periodik Unsur, unsur tersebut terletak pada...", ["Golongan VA, Periode 4", "Golongan VIIA, Periode 4", "Golongan VIIB, Periode 4", "Golongan VIIA, Periode 3"], 1, "Z = 35 memiliki konfigurasi [Ar] 4s^2 3d^(10) 4p^5. Kulit terbesar n = 4 (Periode 4), elektron valensi blok p adalah 4s^2 4p^5 = 7 elektron (Golongan VIIA (Halogen))."], ["Ion X^(-) memiliki konfigurasi elektron 1s^2 2s^2 2p^6 3s^2 3p^6. Letak unsur X pada SPU adalah...", ["Golongan VIIIA, Periode 3", "Golongan VIIA, Periode 3", "Golongan IA, Periode 4", "Golongan VIA, Periode 3"], 1, "Ion X^(-) memiliki 18 elektron (menangkap 1 elektron), sehingga atom netral X memiliki Z = 17 ([Ne] 3s^2 3p^5), yaitu Golongan VIIA, Periode 3."], ["🔥 [HOTS] Suatu ion X^(3+) memiliki 5 elektron tak berpasangan pada subkulit 3d, sedangkan ion Y^(2-) bersifat isoelektron dengan atom Argon (Z = 18). Jika unsur X dan Y bersenyawa dengan X menggunakan biloks +3, maka letak unsur X dan rumus senyawanya adalah...", ["Golongan VIIIB Periode 4 ; X_2Y_3", "Golongan VIB Periode 4 ; X_2Y_3", "Golongan VIIB Periode 4 ; XY_2", "Golongan VIIIB Periode 3 ; X_3Y_2"], 0, "Ion X^(3+) berkonfigurasi [Ar] 3d^5 (23 elektron), sehingga atom netral X memiliki Z = 23 + 3 = 26 ([Ar] 4s^2 3d^6 -> Golongan VIIIB, Periode 4). Ion Y^(2-) memiliki 18 elektron -> atom Y memiliki Z = 16 (Golongan VIA, muatan -2). Rumus senyawa dari X^(3+) dan Y^(2-) adalah X_2Y_3."], ["🔥 [HOTS] Unsur-unsur dengan nomor atom Z = 26, Z = 27, dan Z = 28 ditempatkan dalam satu golongan tradisional yang sama pada SPU karena...", ["Ketiganya memiliki jari-jari atom yang sama persis dengan gas mulia", "Jumlah elektron pada subkulit ns dan (n-1)d ketiganya adalah 8, 9, dan 10 yang dikelompokkan sebagai triad Golongan VIIIB", "Ketiganya terletak pada blok f (Lantanida)", "Ketiganya hanya memiliki satu tingkat bilangan oksidasi yaitu +8"], 1, "Dalam sistem golongan A dan B, unsur blok d dengan jumlah elektron valensi ns + (n-1)d = 8 (Z=26), 9 (Z=27), dan 10 (Z=28) memiliki kemiripan sifat feromagnetik dan kimiawi sehingga disatukan dalam Golongan VIIIB."]], "m": ["Unsur dengan konfigurasi [Ar] 4s^2 3d^(10) 4p^3 memiliki elektron valensi 15 karena subkulit 3d ikut dijumlahkan.", "Menjumlahkan elektron pada subkulit d yang sudah penuh ketika konfigurasi berakhir di subkulit p.", "Jika konfigurasi berakhir di subkulit p (blok p), elektron valensi hanya dihitung dari ns dan np saja (4s^2 4p^3 = 5 elektron valensi -> Golongan VA)."]}, "0.3": {"x": ["Urutkan energi ionisasi pertama dari unsur periode 3 berikut dari yang terkecil hingga terbesar: _(11)Na, _(12)Mg, _(13)Al, _(15)P, _(16)S, dan _(17)Cl!", "Keenam unsur berada pada Periode 3 (n = 3): Na (IA), Mg (IIA), Al (IIIA), P (VA), S (VIA), Cl (VIIA).||Secara umum dari kiri ke kanan dalam satu periode, energi ionisasi meningkat karena Z_(eff) bertambah.||Namun terdapat 2 anomali kestabilan orbital: Mg (3s^2 penuh) lebih stabil daripada Al (3s^2 3p^1) sehingga EI Mg > Al; dan P (3s^2 3p^3 setengah penuh) lebih stabil daripada S (3s^2 3p^4) sehingga EI P > S.||Maka urutan energi ionisasi pertama dari terkecil ke terbesar adalah: Na < Al < Mg < S < P < Cl.", "Na < Al < Mg < S < P < Cl"], "x2": ["Data energi ionisasi bertingkat (EI_1 sampai EI_5 dalam ⟦F:kJ¦mol⟧) dari tiga unsur periode 3 (P, Q, dan R) adalah sebagai berikut: Unsur P: 738 ; 1.451 ; 7.733 ; 10.540 ; 13.630. Unsur Q: 578 ; 1.817 ; 2.745 ; 11.577 ; 14.842. Unsur R: 496 ; 4.562 ; 6.910 ; 9.543 ; 13.354. Analisis data tersebut untuk menentukan golongan P, Q, dan R, jelaskan mengapa EI_1 unsur P lebih tinggi daripada EI_1 unsur Q, serta tentukan rumus senyawa klorida dari unsur Q!", "Cari lonjakan drastis (rasio > 4 kali lipat) pada energi ionisasi bertingkat untuk menentukan jumlah elektron valensi (saat menembus kulit dalam oktet gas mulia).||Unsur P melonjak tajam dari EI_2 (1.451) ke EI_3 (7.733) -> punya 2 elektron valensi (Golongan IIA, Magnesium). Unsur Q melonjak dari EI_3 (2.745) ke EI_4 (11.577) -> punya 3 elektron valensi (Golongan IIIA, Aluminium). Unsur R melonjak dari EI_1 (496) ke EI_2 (4.562) -> punya 1 elektron valensi (Golongan IA, Natrium).||EI_1 P (738) > EI_1 Q (578) karena P (Mg: [Ne] 3s^2) memiliki subkulit 3s penuh yang stabil, sedangkan elektron terakhir Q (Al: [Ne] 3s^2 3p^1) berada di subkulit 3p yang energinya lebih tinggi dan terhalang oleh 3s^2.||Unsur Q (Al, Golongan IIIA) membentuk ion Q^(3+), sehingga rumus kloridanya adalah QCl_3 (AlCl_3).", "R = Golongan IA (Na), P = Golongan IIA (Mg), Q = Golongan IIIA (Al); rumus klorida Q adalah QCl_3."], "z": [["Di antara spesi isoelektron berikut: _(8)O^(2-), _(9)F^(-), _(11)Na^(+), dan _(12)Mg^(2+), urutan jari-jari ion dari yang terbesar ke terkecil adalah...", ["Mg^(2+) > Na^(+) > F^(-) > O^(2-)", "O^(2-) > F^(-) > Na^(+) > Mg^(2+)", "Na^(+) > Mg^(2+) > O^(2-) > F^(-)", "F^(-) > O^(2-) > Na^(+) > Mg^(2+)"], 1, "Keempat ion sama-sama memiliki 10 elektron. Makin besar jumlah proton (Z), makin kuat tarikan inti terhadap 10 elektron tersebut sehingga jari-jari makin kecil: O^(2-) (Z=8) > F^(-) (Z=9) > Na^(+) (Z=11) > Mg^(2+) (Z=12)."], ["Pernyataan yang tepat mengenai alasan energi ionisasi pertama Nitrogen (_(7)N) lebih besar daripada Oksigen (_(8)O) adalah...", ["Jari-jari atom N lebih kecil daripada O", "Nomor atom N lebih kecil sehingga elektron lebih dekat ke inti", "Subkulit 2p pada N terisi setengah penuh (2p^3) yang lebih stabil dibandingkan 2p^4 pada O", "Oksigen bersifat logam sedangkan Nitrogen nonlogam"], 2, "Konfigurasi N berakhir di 2p^3 (setengah penuh, simetris dan stabil), sedangkan O berakhir di 2p^4 (ada tolakan sepasang elektron dalam satu orbital p sehingga lebih mudah dilepas)."], ["🔥 [HOTS] Suatu unsur periode 3 memiliki data lima energi ionisasi pertama (dalam ⟦F:kJ¦mol⟧) berturut-turut: 578, 1.817, 2.745, 11.577, dan 14.842. Jika unsur X tersebut direaksikan dengan unsur Oksigen (Z = 8), rumus senyawa oksida yang terbentuk dan sifat asam-basa oksidanya adalah...", ["XO ; bersifat basa kuat", "X_2O_3 ; bersifat amfoter", "XO_2 ; bersifat asam lemah", "X_2O ; bersifat basa kuat"], 1, "Lonjakan terbesar terjadi antara EI_3 (2.745) ke EI_4 (11.577), artinya unsur X memiliki 3 elektron valensi (Golongan IIIA, Periode 3 = Aluminium). Al membentuk oksida Al_2O_3 (X_2O_3) yang bersifat amfoter."], ["🔥 [HOTS] Perhatikan empat spesi berikut: _(16)S^(2-), _(17)Cl^(-), _(19)K^(+), dan _(20)Ca^(2+). Pernyataan yang tepat mengenai keempat spesi tersebut adalah...", ["Urutan jari-jari: Ca^(2+) > K^(+) > Cl^(-) > S^(2-)", "Energi untuk melepas 1 elektron dari Ca^(2+) paling kecil di antara keempatnya", "Keempatnya memiliki konfigurasi 18 elektron dengan urutan jari-jari S^(2-) > Cl^(-) > K^(+) > Ca^(2+) dan energi ionisasi Ca^(2+) paling besar", "Muatan inti efektif (Z_(eff)) pada S^(2-) paling besar"], 2, "Keempat spesi bersifat isoelektron (18 elektron). Semakin besar nomor atom Z, semakin kuat tarikan inti terhadap 18 elektron sehingga jari-jari makin kecil (S^(2-) > Cl^(-) > K^(+) > Ca^(2+)) dan energi ionisasi Ca^(2+) (Z=20) paling besar."]], "m": ["Energi ionisasi Aluminium (_(13)Al) lebih tinggi daripada Magnesium (_(12)Mg) karena nomor atom Al lebih besar.", "Menerapkan tren umum periode secara kaku tanpa memeriksa kestabilan subkulit penuh ns^2 dan setengah penuh np^3.", "Elektron terakhir Al berada di subkulit 3p^1 yang lebih jauh dan terhalang (shielded) oleh 3s^2 penuh, sehingga lebih mudah dilepas dibandingkan elektron 3s^2 pada Mg."]}, "0.4": {"x": ["Senyawa P memiliki titik leleh 801 °C, lelehan dan larutannya dapat menghantarkan listrik. Senyawa Q memiliki titik didih -85 °C, lelehannya tidak menghantarkan listrik tetapi larutannya dalam air menghantarkan listrik dengan baik. Tentukan jenis ikatan pada P dan Q beserta contohnya!", "Senyawa P bertitik leleh tinggi (801 °C) dan menghantarkan listrik baik dalam wujud lelehan maupun larutan: ciri khas Senyawa Ionik (contoh: NaCl).||Senyawa Q bertitik didih rendah (-85 °C), lelehannya tidak menghantarkan listrik (tidak mengandung ion bebas saat murni), namun larutannya menghantarkan listrik karena terionisasi oleh air: ciri khas Senyawa Kovalen Polar (contoh: HCl).||Perbedaan kunci antara ionik dan kovalen polar terletak pada daya hantar listrik fase lelehannya.", "P adalah senyawa ionik (contoh NaCl) dan Q adalah senyawa kovalen polar (contoh HCl)."], "x2": ["Ion tiosianat (SCN^(-)) memiliki tiga kemungkinan struktur resonansi kerangka ikatan antara Karbon (pusat, EV=4), Nitrogen (EV=5), dan Belerang (EV=6): Struktur I ([S-C#N]^(-)), Struktur II ([S=C=N]^(-)), dan Struktur III ([S#C-N]^(-)). Hitunglah muatan formal masing-masing atom pada ketiga struktur tersebut dan tentukan struktur manakah yang paling berkontribusi (paling stabil)!", "Total elektron valensi SCN^(-) = 6(S) + 4(C) + 5(N) + 1(muatan) = 16 elektron (8 pasang elektron).||Struktur I ([S-C#N]^(-), S punya 3 PEB, N punya 1 PEB): MF(S) = 6 - 6 - 1 = -1; MF(C) = 4 - 0 - 4 = 0; MF(N) = 5 - 2 - 3 = 0.||Struktur II ([S=C=N]^(-), S punya 2 PEB, N punya 2 PEB): MF(S) = 6 - 4 - 2 = 0; MF(C) = 4 - 0 - 4 = 0; MF(N) = 5 - 4 - 2 = -1.||Struktur III ([S#C-N]^(-), S punya 1 PEB, N punya 3 PEB): MF(S) = 6 - 2 - 3 = +1; MF(C) = 0; MF(N) = 5 - 6 - 1 = -2 (tidak stabil). Antara Struktur I dan II, Struktur II menempatkan muatan formal -1 pada atom Nitrogen yang lebih elektronegatif daripada S, sehingga Struktur II ([S=C=N]^(-)) paling stabil!", "Struktur II ([S=C=N]^(-)) dengan muatan formal S = 0, C = 0, dan N = -1 paling stabil karena muatan negatif berada pada atom yang paling elektronegatif (N)."], "z": [["Pada molekul asam sulfat (H_2SO_4) dengan atom S (e_(val) = 6) dan O (e_(val) = 6) yang memenuhi kaidah oktet tanpa muatan formal (atau struktur oktet klasik), jumlah ikatan kovalen koordinasi pada struktur oktetnya adalah...", ["1 ikatan", "2 ikatan", "3 ikatan", "4 ikatan"], 1, "Dalam struktur oktet H_2SO_4 (H-O-S-O-H dengan dua atom O tambahan), atom S menyumbangkan 2 pasang elektron bebasnya kepada 2 atom O untuk membentuk 2 ikatan kovalen koordinasi."], ["Di antara molekul berikut: CO_2, BCl_3, NH_3, dan CCl_4, manakah yang bersifat kovalen polar?", ["CO_2", "BCl_3", "NH_3", "CCl_4"], 2, "NH_3 memiliki 3 pasangan elektron ikatan (PEI) dan 1 pasangan elektron bebas (PEB) pada atom pusat N (piramida trigonal, tidak simetris) sehingga momen dipol resultannya mu > 0 (polar)."], ["🔥 [HOTS] Di antara pasangan senyawa anhidrat berikut: BeCl_2, AlCl_3, MgCl_2, dan NaCl, pasangan senyawa yang meskipun tersusun atas logam dan nonlogam tetapi berikatan KOVALEN (sehingga lelehannya buruk menghantarkan listrik) adalah...", ["NaCl dan MgCl_2", "BeCl_2 dan AlCl_3", "MgCl_2 dan AlCl_3", "BeCl_2 dan NaCl"], 1, "Ion Be^(2+) dan Al^(3+) memiliki ukuran sangat kecil dan rapat muatan positif sangat tinggi (aturan Fajans), sehingga mempolarisasi awan elektron Cl^(-) membentuk ikatan kovalen pada BeCl_2 dan AlCl_3."], ["🔥 [HOTS] Dalam reaksi pembentukan kompleks amonium tetrafluoroborat: NH_3 + BF_3 -> H_3N->BF_3, perubahan jenis ikatan dan kelengkapan oktet pada atom Boron (Z = 5) adalah...", ["Terbentuk ikatan ionik karena serah terima elektron dari N ke B", "Terbentuk ikatan kovalen koordinasi di mana N menyumbangkan sepasang elektron bebas (PEB) kepada orbital kosong B sehingga B memenuhi kaidah oktet", "Atom B menyumbangkan PEB kepada atom N", "Atom B mengalami ekspansi oktet menjadi 10 elektron"], 1, "Dalam BF_3, atom B hanya memiliki 6 elektron di kulit valensinya (oktet tak lengkap). Atom N pada NH_3 menyumbangkan 1 PEB membentuk ikatan kovalen koordinasi sehingga B kini dikelilingi 8 elektron (oktet)."]], "m": ["Molekul CCl_4 dan CO_2 bersifat polar karena ikatan C-Cl dan C=O memiliki beda keelektronegatifan yang cukup besar.", "Menyamakan kepolaran ikatan dengan kepolaran molekul tanpa meninjau kesimetrisan geometri 3D.", "Meskipun ikatan C-Cl dan C=O bersifat polar, geometri CCl_4 (tetrahedral) dan CO_2 (linear) sangat simetris dan tidak memiliki PEB di atom pusat sehingga vektor dipolnya saling meniadakan (mu = 0, molekul nonpolar)."]}, "0.5": {"x": ["Tentukan tipe molekul, bentuk geometri, dan hibridisasi dari molekul XeF_4 (diketahui Xe golongan VIIIA dan F golongan VIIA)!", "Atom pusat Xe (golongan VIIIA) memiliki elektron valensi EV = 8.||Atom Xe mengikat 4 atom F (masing-masing butuh 1 elektron), sehingga domain ikatan X = 4 dan elektron yang dipakai berikatan = 4.||Jumlah PEB pada Xe: E = ⟦F:8 - 4¦2⟧ = 2 pasang elektron bebas. Tipe molekulnya adalah AX_4E_2.||Total domain = X + E = 4 + 2 = 6 domain -> hibridisasi sp^3d^2. Karena 2 PEB menempati posisi aksial yang berlawanan pada oktahedral, bentuk molekul AX_4E_2 adalah Segiempat Datar (Square Planar) dan bersifat nonpolar.", "Tipe AX_4E_2, bentuk Segiempat Datar (Square Planar), hibridisasi sp^3d^2."], "x2": ["Garam nitronium tetrafluoroborat (NO_2^(+) BF_4^(-)) adalah padatan kristal yang tersusun atas kation NO_2^(+) dan anion BF_4^(-) (diketahui EV: N = 5, O = 6, B = 3, F = 7). Tentukan tipe VSEPR, hibridisasi atom pusat, bentuk geometri, dan besar sudut ikatan dari masing-masing ion penyusun garam tersebut!", "Analisis kation NO_2^(+) (atom pusat N, EV = 5, muatan q = +1): elektron valensi efektif atom pusat = 5 - 1 = 4 elektron.||Atom N mengikat 2 atom O divalen (X = 2, membutuhkan 2 xx 2 = 4 elektron ikatan). Maka sisa PEB pada N: E = ⟦F:4 - 4¦2⟧ = 0. Tipe VSEPR NO_2^(+) adalah AX_2 -> hibridisasi sp, bentuk Linear, sudut ikatan 180°.||Analisis anion BF_4^(-) (atom pusat B, EV = 3, muatan q = -1): elektron valensi efektif atom pusat = 3 - (-1) = 4 elektron.||Atom B mengikat 4 atom F monovalen (X = 4, membutuhkan 4 elektron ikatan). Maka sisa PEB pada B: E = ⟦F:4 - 4¦2⟧ = 0. Tipe VSEPR BF_4^(-) adalah AX_4 -> hibridisasi sp^3, bentuk Tetrahedral, sudut ikatan 109,5°.", "NO_2^(+): AX_2, hibridisasi sp, Linear (180°); BF_4^(-): AX_4, hibridisasi sp^3, Tetrahedral (109,5°)."], "z": [["Molekul SF_4 (S golongan VIA, F golongan VIIA) memiliki tipe molekul dan bentuk ruang...", ["AX_4, Tetrahedral", "AX_4E, Bidang Empat Terdistorsi (⟦F:Jungkat-jungkit¦See-saw⟧)", "AX_4E_2, Segiempat Datar", "AX_3E, Piramida Trigonal"], 1, "Atom S (EV = 6) mengikat 4 atom F (X = 4). Sisa elektron = 6 - 4 = 2 elektron = 1 PEB (E = 1). Tipe AX_4E berbentuk Jungkat-jungkit (⟦F:See-saw¦Tetrahedral⟧ Terdistorsi)."], ["Urutan sudut ikatan dari yang terbesar ke terkecil untuk molekul CH_4, NH_3, dan H_2O adalah...", ["H_2O > NH_3 > CH_4", "CH_4 > NH_3 > H_2O", "NH_3 > CH_4 > H_2O", "CH_4 = NH_3 = H_2O"], 1, "Ketiganya memiliki 4 domain (sp^3), namun jumlah PEB berbeda: CH_4 (0 PEB, 109,5°), NH_3 (1 PEB, 107°), dan H_2O (2 PEB, 104,5°). Makin banyak PEB, tolakan makin kuat sehingga sudut ikatan makin menyempit."], ["🔥 [HOTS] Ion triiodida (I_3^(-)) terbentuk saat molekul I_2 larut dalam larutan KI (diketahui I adalah golongan VIIA). Tipe domain VSEPR, hibridisasi atom I pusat, dan bentuk geometri ion I_3^(-) adalah...", ["AX_2E_2 ; sp^3 ; Bentuk V", "AX_2E_3 ; sp^3d ; Linear", "AX_3E_2 ; sp^3d ; Bentuk T", "AX_2 ; sp ; Linear"], 1, "Atom I pusat memiliki EV = 7, ditambah 1 elektron dari muatan -1 menjadi 8 elektron. Mengikat 2 atom I ujung (X = 2, terpakai 2 elektron), sehingga tersisa 8 - 2 = 6 elektron = 3 PEB (E = 3). Tipe AX_2E_3 (5 domain -> sp^3d) menghasilkan bentuk Linear (180°)."], ["🔥 [HOTS] Perhatikan tiga spesi nitrogen berikut: NO_2^(+), NO_2, dan NO_2^(-). Urutan besar sudut ikatan O-N-O dari yang TERBESAR hingga TERKECIL adalah...", ["NO_2^(-) > NO_2 > NO_2^(+)", "NO_2^(+) > NO_2 > NO_2^(-)", "NO_2^(+) > NO_2^(-) > NO_2", "Ketiganya sama besar yaitu 120°"], 1, "NO_2^(+) tidak memiliki elektron bebas di N (linear 180°). NO_2 memiliki 1 elektron bebas tak berpasangan di N (~134°). NO_2^(-) memiliki 1 pasang PEB penuh (2 elektron bebas -> tolakan kuat menekan sudut menjadi ~115°). Maka NO_2^(+) > NO_2 > NO_2^(-)."]], "m": ["Molekul AX_4E_2 seperti XeF_4 bersifat polar karena memiliki 2 pasangan elektron bebas (PEB) pada atom pusat.", "Menganggap setiap molekul yang memiliki PEB di atom pusat pasti bersifat polar.", "Terdapat dua pengecualian penting di mana PEB saling meniadakan secara simetris (nonpolar): AX_2E_3 (Linear, contoh ⟦F:XeF_2¦I_3^(-)⟧) dan AX_4E_2 (Segiempat Datar, contoh XeF_4)."]}, "0.6": {"x": ["Jelaskan mengapa etanol (CH_3CH_2OH, Mr = 46) memiliki titik didih 78 °C, sedangkan isomer gugus fungsinya yaitu dimetil eter (CH_3-O-CH_3, Mr = 46) memiliki titik didih -24 °C!", "Kedua senyawa memiliki rumus molekul yang sama (C_2H_6O) dan Mr yang identik (46), sehingga kontribusi gaya London-nya setara.||Pada etanol (CH_3CH_2-O-H), terdapat atom H yang terikat langsung pada atom Oksigen (-OH), sehingga antarmolekul etanol dapat membentuk Ikatan Hidrogen yang kuat.||Pada dimetil eter (CH_3-O-CH_3), seluruh atom H terikat pada atom Karbon (C-H), tidak ada ikatan O-H langsung. Akibatnya antarmolekul eter hanya bekerja gaya dipol-dipol lemah.||Energi yang dibutuhkan untuk memutuskan ikatan hidrogen pada etanol jauh lebih besar sehingga titik didihnya jauh lebih tinggi (78 °C vs -24 °C).", "Etanol membentuk ikatan hidrogen antarmolekul (ada gugus -OH), sedangkan dimetil eter hanya memiliki gaya dipol-dipol."], "x2": ["Tiga senyawa isomer asam hidroksibenzoat yaitu asam orto-hidroksibenzoat (asam salisilat, posisi 1,2), asam meta-hidroksibenzoat (posisi 1,3), dan asam para-hidroksibenzoat (posisi 1,4) memiliki Mr yang persis sama (138 ⟦F:g¦mol⟧). Namun titik leleh asam para-hidroksibenzoat (215 °C) jauh lebih tinggi daripada asam orto-hidroksibenzoat (159 °C). Jelaskan fenomena ini dari sudut pandang ikatan hidrogen intramolekul vs antarmolekul!", "Ketiga isomer memiliki gugus -OH dan gugus -COOH pada cincin benzena yang dapat membentuk ikatan hidrogen.||Pada isomer orto (posisi 1,2 bersebelahan), gugus -OH dan gugus C=O dari -COOH berada sangat dekat dalam SATU molekul yang sama, sehingga membentuk Ikatan Hidrogen INTRAMOLEKUL (di dalam molekulnya sendiri).||Akibat ikatan hidrogen sudah terkunci di dalam molekul sendiri, kemampuan isomer orto untuk membentuk ikatan hidrogen ANTARMOLEKUL dengan molekul tetangganya berkurang drastis.||Sebaliknya, pada isomer para (posisi 1,4 berseberangan), gugus -OH dan -COOH berjauhan sehingga membentuk jaringan Ikatan Hidrogen ANTARMOLEKUL yang sangat kuat antar-molekul tetangga, menyebabkan titik lelehnya jauh lebih tinggi (215 °C).", "Isomer orto membentuk ikatan hidrogen intramolekul sehingga gaya tarik antarmolekulnya lebih lemah dibandingkan isomer para yang membentuk ikatan hidrogen antarmolekul penuh."], "z": [["Di antara senyawa hidrida golongan VIIA berikut: HF, HCl, HBr, dan HI, urutan titik didih dari yang TERTINGGI ke terendah adalah...", ["HF > HI > HBr > HCl", "HI > HBr > HCl > HF", "HF > HCl > HBr > HI", "HCl > HBr > HI > HF"], 0, "HF memiliki titik didih tertinggi karena adanya Ikatan Hidrogen. Untuk HCl, HBr, dan HI yang tidak memiliki ikatan hidrogen, titik didih ditentukan oleh gaya London yang meningkat seiring Mr: HI (Mr 128) > HBr (Mr 81) > HCl (Mr 36)."], ["Manakah di antara isomer pentana (C_5H_(12)) berikut yang memiliki titik didih paling rendah?", ["n-pentana (rantai lurus)", "2-metilbutana (1 cabang)", "2,2-dimetilpropana (neopentana, 2 cabang)", "Ketiganya memiliki titik didih sama karena Mr sama"], 2, "Semakin banyak cabang (2,2-dimetilpropana berbentuk hampir bulat), luas permukaan sentuh antarmolekul semakin kecil sehingga gaya dispersi London melemah dan titik didihnya paling rendah."], ["🔥 [HOTS] Pada suhu tepat di atas titik didihnya, uap asam etanoat (CH_3COOH, Mr = 60) ternyata memiliki massa molekul relatif terukur (Mr semu) sekitar 120 ⟦F:g¦mol⟧. Penyebab utama fenomena ini adalah...", ["Terjadi reaksi polimerisasi adisi membentuk rantai polietena", "Dua molekul CH_3COOH membentuk dimer siklik yang stabil melalui dua ikatan hidrogen antarmolekul antara gugus C=O dan H-O", "Terjadi penguraian CH_3COOH menjadi CH_4 dan CO_2", "Gaya dispersi London pada CH_3COOH menggandakan massa atom karbon"], 1, "Asam karboksilat seperti CH_3COOH membentuk dimer (gabungan 2 molekul) yang diikat oleh sepasang ikatan hidrogen kuat antara oksigen karbonil (C=O) satu molekul dengan hidrogen hidroksil (O-H) molekul pasangannya, sehingga Mr efektifnya menjadi 2 xx 60 = 120."], ["🔥 [HOTS] Perhatikan empat senyawa dengan Mr yang hampir setara berikut: (1) n-butana (Mr = 58), (2) propanon (Mr = 58), (3) 1-propanol (Mr = 60), dan (4) asam etanoat (Mr = 60). Urutan kenaikan titik didih dari yang TERENDAH ke TERTINGGI adalah...", ["(1) < (2) < (3) < (4)", "(4) < (3) < (2) < (1)", "(1) < (3) < (2) < (4)", "(2) < (1) < (3) < (4)"], 0, "n-butana (nonpolar, gaya London) < propanon (polar, dipol-dipol tanpa ikatan H) < 1-propanol (1 situs ikatan hidrogen -OH) < asam etanoat (ikatan hidrogen ganda membentuk dimer)."]], "m": ["Saat air (H_2O) mendidih menjadi uap air pada 100 °C, ikatan kovalen O-H di dalam molekul air terputus menghasilkan gas H_2 dan O_2.", "Mencampuradukkan ikatan intramolekul (kovalen O-H) dengan gaya antarmolekul (ikatan hidrogen H_2O...H_2O).", "Pendidihan adalah perubahan fisika yang hanya memisahkan jarak antarmolekul dengan memutus ikatan hidrogen antarmolekul air; molekul uap air tetap berwujud H_2O."]}, "0.7": {"x": ["Perbandingan massa besi (Fe) dan belerang (S) dalam senyawa besi(II) sulfida (FeS) adalah 7 : 4. Jika 28 gram Fe direaksikan dengan 20 gram S dalam wadah tertutup, tentukan massa FeS yang terbentuk dan massa zat yang tersisa!", "Rasio Proust Fe : S = 7 : 4. Uji kelipatan rasio dari massa yang tersedia: untuk Fe = ⟦F:28¦7⟧ = 4 kali; untuk S = ⟦F:20¦4⟧ = 5 kali.||Karena kelipatan Fe (4) lebih kecil daripada S (5), maka Fe habis bereaksi seluruhnya sebanyak 28 gram.||Massa S yang bereaksi = 4 × 4 gram = 16 gram. Massa S yang tersisa = 20 - 16 = 4 gram.||Massa FeS yang terbentuk = massa Fe bereaksi + massa S bereaksi = 28 + 16 = 44 gram (total massa akhir = 44 g FeS + 4 g S sisa = 48 g, sesuai Hukum Lavoisier).", "Terbentuk 44 gram FeS dan tersisa 4 gram belerang (S)."], "x2": ["Sebanyak 20 mL campuran gas metana (CH_4) dan etena (C_2H_4) dibakar sempurna dengan 60 mL gas oksigen berlebih pada suhu dan tekanan tetap. Setelah uap air diembunkan seluruhnya, gas yang tersisa dialirkan ke dalam larutan KOH pekat sehingga volumenya menyusut sebanyak 32 mL (diserap sebagai CO_2). Tentukan volume masing-masing gas CH_4 dan C_2H_4 di dalam campuran awal serta volume gas O_2 yang tersisa!", "Misalkan volume CH_4 = x mL, maka volume C_2H_4 = (20 - x) mL. Gas yang diserap oleh larutan KOH adalah gas CO_2 sebesar 32 mL.||Reaksi 1: CH_4(g) + 2O_2(g) -> CO_2(g) + 2H_2O(l) -> x mL CH_4 menghabiskan 2x mL O_2 dan menghasilkan x mL CO_2.||Reaksi 2: C_2H_4(g) + 3O_2(g) -> 2CO_2(g) + 2H_2O(l) -> (20 - x) mL C_2H_4 menghabiskan 3(20 - x) mL O_2 dan menghasilkan 2(20 - x) mL CO_2.||Dari total volume CO_2: x + 2(20 - x) = 32 -> 40 - x = 32 -> x = 8 mL CH_4, sehingga volume C_2H_4 = 20 - 8 = 12 mL. Total O_2 terpakai = 2(8) + 3(12) = 16 + 36 = 52 mL, sehingga O_2 yang tersisa = 60 - 52 = 8 mL.", "Volume CH_4 = 8 mL, volume C_2H_4 = 12 mL, dan volume O_2 sisa = 8 mL."], "z": [["Sebanyak 10 mL gas hidrokarbon C_xH_y tepat habis dibakar dengan 50 mL gas oksigen menghasilkan 30 mL gas CO_2 dan uap air pada P dan T yang sama. Rumus molekul hidrokarbon tersebut adalah...", ["C_2H_6", "C_3H_4", "C_3H_8", "C_4H_8"], 2, "Perbandingan volume C_xH_y : O_2 : CO_2 = 10 : 50 : 30 = 1 : 5 : 3. Dari koefisien C: x = 3. Dari atom O: 5 O_2 (10 atom O) = 3 CO_2 (6 atom O) + 4 H_2O (4 atom O), sehingga y = 4 × 2 = 8. Rumusnya C_3H_8."], ["Unsur Nitrogen dan Oksigen membentuk dua senyawa: NO dan NO_2. Jika massa Nitrogen pada kedua senyawa dibuat sama, perbandingan massa Oksigen pada NO : NO_2 adalah...", ["1 : 1", "1 : 2", "2 : 1", "2 : 3"], 1, "Sesuai Hukum Kelipatan Perbandingan Dalton, untuk 1 atom N (14 g) yang sama, massa O dalam NO (16 g) berbanding NO_2 (32 g) adalah 16 : 32 = 1 : 2."], ["🔥 [HOTS] Sebanyak 15 mL campuran gas metana (CH_4) dan propana (C_3H_8) tepat habis dibakar sempurna menghasilkan 27 mL gas CO_2 pada P dan T yang sama. Volume gas propana (C_3H_8) di dalam campuran awal adalah...", ["3 mL", "6 mL", "9 mL", "12 mL"], 1, "Misalkan V(C_3H_8) = x mL, maka V(CH_4) = (15 - x) mL. Dari kesetaraan atom Karbon (Gay-Lussac): 1(15 - x) + 3x = 27 -> 15 + 2x = 27 -> 2x = 12 -> x = 6 mL C_3H_8 (dan 9 mL CH_4)."], ["🔥 [HOTS] Unsur X dan Y membentuk dua senyawa: Senyawa I mengandung 50% massa X, sedangkan Senyawa II mengandung 40% massa X. Jika rumus kimia Senyawa I adalah XY_2, maka rumus kimia Senyawa II sesuai Hukum Dalton adalah...", ["XY", "XY_3", "X_2Y_3", "XY_4"], 1, "Untuk massa X dibuat tetap 1 gram: pada Senyawa I (50% X, 50% Y) massa Y = ⟦F:50¦50⟧ = 1,0 gram (untuk 2 atom Y pada XY_2, berarti 1 atom Y setara 0,5 gram). Pada Senyawa II (40% X, 60% Y) untuk 1 gram X terdapat massa Y = ⟦F:60¦40⟧ = 1,5 gram. Maka jumlah atom Y pada Senyawa II = ⟦F:1,5¦0,5⟧ = 3 -> rumusnya XY_3."]], "m": ["Jika 10 gram zat A direaksikan dengan 10 gram zat B, pasti selalu dihasilkan 20 gram senyawa AB.", "Menerapkan Hukum Lavoisier dengan menganggap semua pereaksi pasti habis tanpa menguji perbandingan tetap Hukum Proust.", "Total massa sistem di akhir memang tetap 20 gram, tetapi 20 gram tersebut terdiri atas massa senyawa AB yang terbentuk ditambah massa unsur pereaksi yang tidak habis bereaksi (zat sisa)."]}, "0.8": {"x": ["Pada suhu dan tekanan tertentu, 5,6 gram gas nitrogen (N_2, Ar N = 14) memiliki volume 6 liter. Pada suhu dan tekanan yang sama, berapakah volume dari 17,6 gram gas karbon dioksida (CO_2, Ar C = 12, O = 16)?", "Hitung Mr masing-masing gas: Mr N_2 = 2 × 14 = 28 ⟦F:g¦mol⟧; Mr CO_2 = 12 + 2(16) = 44 ⟦F:g¦mol⟧.||Hitung mol masing-masing gas: n(N_2) = ⟦F:5,6¦28⟧ = 0,2 mol; n(CO_2) = ⟦F:17,6¦44⟧ = 0,4 mol.||Sesuai Hipotesis Avogadro, pada P dan T yang sama berlaku ⟦F:V_2¦V_1⟧ = ⟦F:n_2¦n_1.⟧||Maka V(CO_2) = (⟦F:0,4¦0,2⟧) × 6 liter = 2 × 6 liter = 12 liter.", "12 liter"], "x2": ["Suatu tabung gas bervolume 10 liter pada suhu 27 °C dan tekanan 2,46 atm berisi campuran gas N_2 (Mr = 28) dan gas O_2 (Mr = 32). Jika massa total gas di dalam tabung tersebut adalah 29,6 gram (R = 0,082 ⟦F:L·atm¦mol·K⟧), tentukan jumlah mol masing-masing gas dan jumlah total elektron di dalam tabung tersebut! (Z_N = 7, Z_O = 8)", "Hitung mol total campuran gas dari persamaan gas ideal: n_(total) = ⟦F:P V¦R T⟧ = ⟦F:2,46 xx 10¦0,082 xx 300⟧ = ⟦F:24,6¦24,6⟧ = 1,0 mol.||Misalkan mol N_2 = x mol, maka mol O_2 = (1,0 - x) mol. Dari massa total: 28x + 32(1,0 - x) = 29,6 -> 32 - 4x = 29,6 -> 4x = 2,4 -> x = 0,6 mol N_2, dan mol O_2 = 0,4 mol.||Hitung jumlah elektron per molekul: 1 molekul N_2 memiliki 2(7) = 14 elektron; 1 molekul O_2 memiliki 2(8) = 16 elektron.||Total mol elektron = 0,6(14) + 0,4(16) = 8,4 + 6,4 = 14,8 mol elektron = 14,8 xx 6,02 xx 10^(23) elektron.", "0,6 mol N_2, 0,4 mol O_2, dan total 14,8 mol elektron (8,91 xx 10^(24) elektron)."], "z": [["Jumlah TOTAL atom yang terkandung dalam 8,8 gram gas propana (C_3H_8, Ar C = 12, H = 1; L = 6,02 × 10^(23)) adalah...", ["0,2 × 6,02 × 10^(23) atom", "0,6 × 6,02 × 10^(23) atom", "1,6 × 6,02 × 10^(23) atom", "2,2 × 6,02 × 10^(23) atom"], 3, "Mr C_3H_8 = 3(12) + 8(1) = 44. Mol molekul C_3H_8 = ⟦F:8,8¦44⟧ = 0,2 mol. Setiap 1 molekul C_3H_8 terdiri atas 3 + 8 = 11 atom, sehingga mol total atom = 11 × 0,2 = 2,2 mol atom = 2,2 × 6,02 × 10^(23) atom."], ["Massa dari 5,6 liter gas SO_3 (Mr = 80) yang diukur pada keadaan standar (0 °C, 1 atm) adalah...", ["10 gram", "20 gram", "40 gram", "64 gram"], 1, "Mol SO_3 pada STP = 5,6 ⟦F:L¦22,4⟧ ⟦F:L¦mol⟧ = 0,25 mol. Massa SO_3 = 0,25 mol × 80 ⟦F:g¦mol⟧ = 20 gram."], ["🔥 [HOTS] Sebanyak 1,90 gram ion XO_4^(3-) mengandung total 1,0 mol elektron (diketahui Z_O = 8 dan Ar O = 16). Jika nomor atom X adalah 15, maka massa atom relatif (Ar) X adalah...", ["28", "30", "31", "32"], 2, "Dalam 1 ion XO_4^(3-) dengan Z_X = 15 dan Z_O = 8, jumlah elektron per ion = 15 + 4(8) + 3 = 50 elektron. Karena total elektron = 1,0 mol, maka mol ion XO_4^(3-) = ⟦F:1,0¦50⟧ = 0,02 mol. Massa molar XO_4^(3-) = ⟦F:1,90¦0,02⟧ = 95 ⟦F:g¦mol⟧. Maka Ar X + 4(16) = 95 -> Ar X = 95 - 64 = 31."], ["🔥 [HOTS] Suatu hemoglobin mamalia mengandung 0,335% massa besi (Ar Fe = 56). Jika setiap 1 molekul hemoglobin mengandung tepat 4 atom besi, maka massa molekul relatif (Mr) hemoglobin tersebut adalah sekitar...", ["16.700", "33.400", "66.866", "133.700"], 2, "Dalam 1 mol hemoglobin terdapat 4 mol atom Fe dengan massa = 4 xx 56 = 224 gram. Karena 224 gram ini merupakan 0,335% dari Mr hemoglobin: 0,00335 xx Mr = 224 -> Mr = ⟦F:224¦0,00335⟧ = 66.866 ⟦F:g¦mol⟧."]], "m": ["Volume 1 mol air cair (H_2O(l)) pada suhu 0 °C dan tekanan 1 atm adalah 22,4 liter.", "Menerapkan volume molar STP (22,4 ⟦F:L¦mol⟧) pada zat berwujud cair atau padat.", "Rumus V = n × 22,4 L pada STP HANYA berlaku untuk zat berwujud GAS ideal. Satu mol air cair hanya bermassa 18 gram dengan volume sekitar 18 mL (0,018 L)!"]}, "0.9": {"x": ["Sebanyak 5,4 gram logam Aluminium (Ar Al = 27) dimasukkan ke dalam 200 mL larutan H_2SO_4 1,5 M menurut reaksi: 2Al(s) + 3H_2SO_4(aq) -> Al_2(SO_4)_3(aq) + 3H_2(g). Tentukan pereaksi pembatas dan volume gas H_2 yang dihasilkan pada keadaan STP!", "Hitung mol mula-mula kedua pereaksi: n(Al) = ⟦F:5,4¦27⟧ = 0,20 mol; n(H_2SO_4) = M × V = 1,5 M × 0,2 L = 0,30 mol.||Uji hasil bagi mol per koefisien: untuk Al = ⟦F:0,20¦2⟧ = 0,10; untuk H_2SO_4 = ⟦F:0,30¦3⟧ = 0,10.||Karena keduanya memiliki rasio ⟦F:n¦koefisien⟧ yang tepat sama (0,10), maka kedua pereaksi tepat habis bereaksi seluruhnya!||Mol gas H_2 yang terbentuk (koefisien 3) = 3 × 0,10 = 0,30 mol. Volume H_2 pada STP = 0,30 × 22,4 L = 6,72 liter.", "Kedua pereaksi tepat habis bereaksi (rasio ⟦F:mol¦koef⟧ = 0,10) dan menghasilkan 6,72 L gas H_2 (STP)."], "x2": ["Sebanyak 10,0 gram cuplikan paduan logam yang terdiri atas Seng (Ar Zn = 65), Aluminium (Ar Al = 27), dan pengotor inert sebesar 8% massa dilarutkan ke dalam larutan HCl berlebih. Jika pada akhir reaksi dihasilkan 5,60 liter gas H_2 pada keadaan STP, tentukan massa masing-masing logam Zn dan Al di dalam cuplikan tersebut!", "Massa pengotor inert = 8% xx 10,0 g = 0,8 gram. Maka massa campuran murni (Zn + Al) = 10,0 - 0,8 = 9,2 gram.||Misalkan mol Zn = x mol dan mol Al = y mol. Persamaan massa: 65x + 27y = 9,2 ... (Persamaan 1).||Reaksi dengan HCl: Zn + 2HCl -> ZnCl_2 + H_2 (1 mol Zn menghasilkan 1 mol H_2) dan 2Al + 6HCl -> 2AlCl_3 + 3H_2 (1 mol Al menghasilkan 1,5 mol H_2).||Total mol H_2 (STP) = ⟦F:5,60¦22,4⟧ = 0,25 mol, sehingga x + 1,5y = 0,25 -> x = 0,25 - 1,5y. Substitusikan ke Persamaan 1: 65(0,25 - 1,5y) + 27y = 9,2 -> 16,25 - 97,5y + 27y = 9,2 -> 70,5y = 7,05 -> y = 0,10 mol Al (2,70 gram), dan x = 0,25 - 0,15 = 0,10 mol Zn (6,50 gram).", "Massa Zn = 6,50 gram (0,10 mol) dan massa Al = 2,70 gram (0,10 mol)."], "z": [["Pemanasan 24,6 gram kristal garam Inggris MgSO_4.xH_2O (Mr MgSO_4 = 120, Mr H_2O = 18) menghasilkan 12,0 gram padatan MgSO_4 anhidrat. Nilai x pada rumus hidrat tersebut adalah...", ["5", "6", "7", "10"], 2, "Massa H_2O yang menguap = 24,6 - 12,0 = 12,6 gram. Perbandingan mol MgSO_4 : H_2O = (⟦F:12,0¦120⟧) : (⟦F:12,6¦18⟧) = 0,1 : 0,7 = 1 : 7. Jadi x = 7 (MgSO_4.7H_2O)."], ["Suatu senyawa organik mengandung 40% massa C, 6,67% massa H, dan sisanya Oksigen (Ar C=12, H=1, O=16). Jika Mr senyawa tersebut 180, rumus molekulnya adalah...", ["CH_2O", "C_3H_6O_3", "C_6H_(12)O_6", "C_6H_6O_6"], 2, "%O = 100 - 40 - 6,67 = 53,33%. Rasio mol C : H : O = (⟦F:40¦12⟧) : (⟦F:6,67¦1⟧) : (⟦F:53,33¦16⟧) = 3,33 : 6,67 : 3,33 = 1 : 2 : 1 (Rumus Empiris CH_2O, Mr RE = 30). Karena Mr = 180, maka n = ⟦F:180¦30⟧ = 6 -> C_6H_(12)O_6."], ["🔥 [HOTS] Sebanyak 9,2 gram campuran logam Zn (Ar = 65) dan Al (Ar = 27) dilarutkan sempurna dalam larutan H_2SO_4 encer berlebih menghasilkan 5,6 liter gas H_2 pada keadaan STP. Massa logam Aluminium di dalam campuran tersebut adalah...", ["1,35 gram", "2,70 gram", "5,40 gram", "6,50 gram"], 1, "Misalkan mol Zn = x dan mol Al = y. Maka 65x + 27y = 9,2 dan mol H_2 = x + 1,5y = ⟦F:5,6¦22,4⟧ = 0,25 mol -> x = 0,25 - 1,5y. Substitusikan: 65(0,25 - 1,5y) + 27y = 9,2 -> 70,5y = 7,05 -> y = 0,10 mol Al. Massa Al = 0,10 xx 27 = 2,70 gram."], ["🔥 [HOTS] Suatu bijih besi mengandung 80% massa Fe_2O_3 (Mr = 160). Jika 200 ton bijih besi tersebut direduksi dalam Tanur Tinggi menurut reaksi Fe_2O_3 + 3CO -> 2Fe + 3CO_2 dengan efisiensi (%Yield) proses sebesar 75%, maka massa besi murni (Ar Fe = 56) yang diperoleh adalah...", ["56 ton", "84 ton", "112 ton", "168 ton"], 1, "Massa Fe_2O_3 murni = 80% xx 200 ton = 160 ton. Secara teoritis (100%), dari 160 ton Fe_2O_3 dihasilkan 2 xx 56 = 112 ton Fe. Karena %Yield = 75%, maka massa Fe nyata = 75% xx 112 ton = 84 ton."]], "m": ["Dalam reaksi N_2 + 3H_2 -> 2NH_3, jika direaksikan 2 mol N_2 dan 3 mol H_2, maka N_2 adalah pereaksi pembatas karena jumlah molnya lebih sedikit.", "Menentukan pereaksi pembatas dari nilai mol mula-mula terkecil tanpa membaginya dengan koefisien reaksi.", "Uji ⟦F:n¦koefisien⟧: untuk N_2 = ⟦F:2¦1⟧ = 2, sedangkan untuk H_2 = ⟦F:3¦3⟧ = 1. Karena 1 < 2, maka H_2 yang habis lebih dulu (pereaksi pembatas) meskipun mol awalnya lebih besar!"]}, "0.10": {"x": ["Setarakan persamaan reaksi berikut: a Al(s) + b H_2SO_4(aq) -> c Al_2(SO_4)_3(aq) + d H_2(g), serta tuliskan persamaan ion bersihnya!", "Tetapkan koefisien senyawa paling kompleks c = 1 pada Al_2(SO_4)_3.||Setarakan atom Al: di kanan ada 2 atom Al, maka di kiri koefisien Al adalah a = 2.||Setarakan gugus sulfat (SO_4): di kanan ada 3 gugus SO_4, maka koefisien H_2SO_4 di kiri adalah b = 3.||Setarakan atom H: di kiri ada 3 × 2 = 6 atom H, maka koefisien H_2 di kanan adalah d = 3. Reaksi setara: 2Al(s) + 3H_2SO_4(aq) -> Al_2(SO_4)_3(aq) + 3H_2(g). Setelah mencoret ion penonton SO_4^(2-), persamaan ion bersihnya: 2Al(s) + 6H^(+)(aq) -> 2Al^(3+)(aq) + 3H_2(g).", "Koefisien a=2, b=3, c=1, d=3; persamaan ion bersih: 2Al(s) + 6H^(+)(aq) -> 2Al^(3+)(aq) + 3H_2(g)."], "x2": ["Setarakan reaksi redoks pelarutan tembaga dalam asam nitrat pekat berikut: a Cu(s) + b HNO_3(aq) -> c Cu(NO_3)_2(aq) + d NO_2(g) + e H_2O(l), lalu tentukan berapa mol HNO_3 yang berfungsi sebagai OKSIDATOR dan berapa mol yang berfungsi sebagai PEMBENTUK GARAM untuk setiap 1 mol Cu!", "Perubahan biloks: Cu naik dari 0 (pada Cu) menjadi +2 (pada Cu(NO_3)_2) -> melepas 2 elektron (dikali 1).||Atom N turun dari +5 (pada HNO_3) menjadi +4 (pada NO_2) -> menangkap 1 elektron (dikali 2 agar elektron setara).||Maka koefisien Cu = 1, Cu(NO_3)_2 = 1, dan NO_2 = 2.||Total atom N di ruas kanan = 2 (dalam Cu(NO_3)_2) + 2 (dalam 2 NO_2) = 4 atom N -> maka koefisien HNO_3 di kiri adalah b = 4, dan koefisien H_2O adalah e = 2. Dari 4 mol HNO_3 tersebut, hanya 2 mol yang berubah menjadi NO_2 (sebagai oksidator), sedangkan 2 mol lainnya tetap sebagai ion NO_3^(-) pengikat Cu^(2+) (pembentuk garam).", "Koefisien a=1, b=4, c=1, d=2, e=2; per 1 mol Cu terdapat 2 mol HNO_3 sebagai oksidator dan 2 mol HNO_3 sebagai pembentuk garam."], "z": [["Jika reaksi: a C_3H_8(g) + b O_2(g) -> c CO_2(g) + d H_2O(g) disetarakan dengan bilangan bulat terkecil, maka nilai a, b, c, dan d berturut-turut adalah...", ["1, 4, 3, 4", "1, 5, 3, 4", "2, 5, 6, 8", "1, 3, 3, 4"], 1, "Misalkan a = 1 (C_3H_8). Maka C di kanan c = 3 (3 CO_2), dan H di kanan 2d = 8 -> d = 4 (4 H_2O). Jumlah atom O di kanan = 3(2) + 4(1) = 10 atom O, sehingga b = ⟦F:10¦2⟧ = 5. Koefisien: 1, 5, 3, 4."], ["Persamaan ion bersih (net ionic equation) dari reaksi pencampuran larutan Pb(NO_3)_2(aq) dan larutan KI(aq) yang menghasilkan endapan kuning PbI_2(s) adalah...", ["Pb^(2+)(aq) + I^(-)(aq) -> PbI(s)", "Pb^(2+)(aq) + 2I^(-)(aq) -> PbI_2(s)", "K^(+)(aq) + NO_3^(-)(aq) -> KNO_3(s)", "Pb(NO_3)_2(aq) + 2I^(-)(aq) -> PbI_2(s) + 2NO_3^(-)(aq)"], 1, "Ion K^(+) dan NO_3^(-) tetap terlarut sebagai ion penonton di kedua ruas. Spesies yang benar-benar bereaksi membentuk endapan adalah Pb^(2+)(aq) + 2I^(-)(aq) -> PbI_2(s)."], ["🔥 [HOTS] Pada reaksi redoks suasana asam yang belum setara: a MnO_4^(-)(aq) + b C_2O_4^(2-)(aq) + c H^(+)(aq) -> d Mn^(2+)(aq) + e CO_2(g) + f H_2O(l), nilai koefisien a, b, c, dan e setelah disetarakan dengan bilangan bulat terkecil adalah...", ["2, 5, 16, dan 10", "2, 5, 8, dan 5", "1, 5, 8, dan 10", "2, 3, 16, dan 6"], 0, "Biloks Mn turun dari +7 ke +2 (5e^(-)), sedangkan 2 atom C pada C_2O_4^(2-) naik dari +3 ke +4 pada 2CO_2 (total 2e^(-)). Kali silang 2 dan 5: 2 MnO_4^(-) + 5 C_2O_4^(2-) + 16 H^(+) -> 2 Mn^(2+) + 10 CO_2 + 8 H_2O. Jadi a=2, b=5, c=16, e=10."], ["🔥 [HOTS] Reaksi disproporsionasi (autoredoks) gas klorin dalam larutan NaOH panas: a Cl_2(g) + b OH^(-)(aq) -> c Cl^(-)(aq) + d ClO_3^(-)(aq) + e H_2O(l). Perbandingan koefisien ion Cl^(-) terhadap ClO_3^(-) (nilai c : d) pada reaksi setara adalah...", ["1 : 1", "3 : 1", "5 : 1", "1 : 5"], 2, "Atom Cl (biloks 0) mengalami reduksi menjadi Cl^(-) (biloks -1, turun 1) dan oksidasi menjadi ClO_3^(-) (biloks +5, naik 5). Agar jumlah elektron yang dilepas dan diterima sama, Cl^(-) dikali 5 dan ClO_3^(-) dikali 1: 3Cl_2 + 6OH^(-) -> 5Cl^(-) + ClO_3^(-) + 3H_2O. Maka c : d = 5 : 1."]], "m": ["Reaksi ion Cu(s) + Ag^(+)(aq) -> Cu^(2+)(aq) + Ag(s) sudah setara karena jumlah atom Cu dan Ag di kiri dan kanan sama-sama 1.", "Hanya memeriksa kesetaraan jumlah atom tanpa memeriksa kesetaraan total muatan listrik pada persamaan ion.", "Pada reaksi tersebut muatan di kiri +1 sedangkan di kanan +2 (belum setara!). Agar muatan sama-sama +2, koefisien Ag^(+) dan Ag harus dikalikan 2: Cu(s) + 2Ag^(+)(aq) -> Cu^(2+)(aq) + 2Ag(s)."]}, "1.0": {"x": ["Sebanyak 0,2 mol asam lemah HA dilarutkan dalam air dan terionisasi sebagian menghasilkan 0,01 mol ion H^(+). Hitunglah derajat ionisasi (alpha) asam tersebut dan jelaskan hasil pengamatan uji elektrolitnya!", "Reaksi ionisasi: HA(aq) <=> H^(+)(aq) + A^(-)(aq). Karena koefisien HA dan H^(+) sama (1 : 1), maka mol HA yang terionisasi = mol H^(+) = 0,01 mol.||Derajat ionisasi alpha = ⟦F:n_(terionisasi)¦n_(mula-mula)⟧ = ⟦F:0,01¦0,20⟧ = 0,05 (atau 5%).||Karena 0 < alpha < 1 (alpha = 0,05 sangat kecil), larutan HA merupakan elektrolit lemah: pada uji elektrolit lampu redup atau tidak menyala, tetapi terdapat sedikit gelembung gas pada elektroda.", "Derajat ionisasi alpha = 0,05 (5%); lampu redup atau padam dengan sedikit gelembung gas pada elektroda."], "x2": ["Sebanyak 100 mL larutan Ba(OH)_2 0,1 M dititrasi secara konduktometri dengan menambahkan larutan H_2SO_4 0,1 M sedikit demi sedikit hingga mencapai 200 mL. Jelaskan bagaimana perubahan daya hantar listrik larutan (nyala lampu alat uji) pada: (a) awal sebelum dititrasi, (b) saat volume H_2SO_4 tepat 100 mL, dan (c) saat volume H_2SO_4 mencapai 200 mL!", "Tuliskan persamaan reaksi kimia antara kedua elektrolit kuat tersebut: Ba(OH)_2(aq) + H_2SO_4(aq) -> BaSO_4(s) + 2H_2O(l).||(a) Pada awal (0 mL H_2SO_4), Ba(OH)_2(aq) terionisasi sempurna menjadi Ba^(2+) dan 2OH^(-) sehingga daya hantar listrik sangat kuat (lampu menyala terang).||(b) Saat ditambahkan tepat 100 mL H_2SO_4 0,1 M (10 mmol Ba(OH)_2 tepat habis bereaksi dengan 10 mmol H_2SO_4), seluruh ion Ba^(2+) dan SO_4^(2-) mengendap sebagai padatan BaSO_4(s) dan ion H^(+) + OH^(-) menjadi air murni H_2O(l). Akibatnya hampir tidak ada ion bebas di larutan sehingga daya hantar listrik turun mendekati NOL (lampu padam)!||(c) Saat H_2SO_4 terus ditambahkan hingga 200 mL, terdapat kelebihan 10 mmol H_2SO_4(aq) yang terionisasi menjadi 2H^(+) dan SO_4^(2-), sehingga daya hantar listrik naik kembali dan lampu menyala terang lagi.", "(a) Kuat dan terang; (b) Turun drastis mendekati nol (padam) karena terbentuk endapan BaSO_4(s) dan H_2O(l); (c) Naik kembali (terang) karena kelebihan ion H_2SO_4."], "z": [["Pada konsentrasi yang sama (0,1 M), larutan manakah di bawah ini yang memiliki daya hantar listrik paling kuat?", ["CO(NH_2)_2 (Urea)", "CH_3COOH", "NaCl", "BaCl_2"], 3, "BaCl_2 dan NaCl sama-sama elektrolit kuat (alpha = 1), tetapi 1 molekul BaCl_2 terionisasi menjadi 3 ion (Ba^(2+) + 2Cl^(-)) sehingga konsentrasi total ionnya 0,1 × 3 = 0,3 M (lebih besar daripada NaCl yang menghasilkan 2 ion = 0,2 M)."], ["Hasil uji daya hantar listrik larutan X menunjukkan lampu tidak menyala, namun pada elektroda timbul gelembung-gelembung gas. Larutan X kemungkinan adalah...", ["Larutan glukosa (C_6H_(12)O_6)", "Larutan amonia (NH_3)", "Larutan asam sulfat (H_2SO_4)", "Larutan garam dapur (NaCl)"], 1, "Lampu padam tetapi ada gelembung gas merupakan ciri khas elektrolit lemah, yaitu larutan amonia (NH_3 (NH_4OH))."], ["🔥 [HOTS] Ke dalam gelas kimia berisi 100 mL larutan Ba(OH)_2 0,2 M ditambahkan 100 mL larutan H_2SO_4 0,2 M. Pernyataan yang tepat mengenai daya hantar listrik campuran setelah reaksi selesai adalah...", ["Menghantarkan listrik dua kali lebih kuat karena dua elektrolit kuat digabungkan", "Daya hantar listrik turun drastis mendekati nol karena produk reaksinya adalah endapan BaSO_4(s) dan air H_2O(l)", "Tetap sama kuat seperti larutan Ba(OH)_2 semula", "Menghasilkan gas H_2 di katoda secara spontan tanpa arus listrik"], 1, "Mol Ba(OH)_2 = 20 mmol dan mol H_2SO_4 = 20 mmol tepat habis bereaksi menurut Ba(OH)_2(aq) + H_2SO_4(aq) -> BaSO_4(s) + 2H_2O(l). Karena BaSO_4 mengendap dan H_2O nonelektrolit, konsentrasi ion bebas di larutan nyaris habis."], ["🔥 [HOTS] Larutan asam lemah monoprotik HA 0,1 M memiliki derajat ionisasi alpha_1 = 0,02. Jika larutan tersebut diencerkan dengan air hingga volumenya menjadi 4 kali volume semula pada suhu tetap, maka derajat ionisasi yang baru (alpha_2) adalah...", ["0,01", "0,02", "0,04", "0,08"], 2, "Menurut Hukum Pengenceran Ostwald, untuk asam lemah berlaku alpha = sqrt(⟦F:K_a¦M⟧). Jika volume dijadikan 4 kali semula, molaritas M menjadi ⟦F:1¦4⟧ kali semula, sehingga alpha_2 = 2 xx 0,02 = 0,04."]], "m": ["Jika lampu pada alat uji elektrolit tidak menyala, larutan tersebut pasti merupakan larutan nonelektrolit.", "Hanya melihat nyala lampu dan mengabaikan keberadaan gelembung gas pada elektroda.", "Elektrolit lemah atau elektrolit yang sangat encer sering kali tidak cukup kuat untuk menyalakan filamen lampu, namun adanya reaksi redoks ion yang menghasilkan gelembung gas di elektroda membuktikan larutan tersebut tetap bersifat elektrolit."]}, "1.1": {"x": ["Larutan asam sulfat (H_2SO_4, Mr = 98) pekat memiliki kadar 49% massa dengan massa jenis 1,4 ⟦F:g¦mL⟧. Hitunglah Molaritas (M), Normalitas (N), dan Molalitas (m) larutan tersebut!", "Molaritas: M = ⟦F:% × 10 × rho¦Mr⟧ = ⟦F:49 × 10 × 1,4¦98⟧ = ⟦F:490 × 1,4¦98⟧ = 5 × 1,4 = 7,0 M.||Normalitas: H_2SO_4 memiliki valensi asam a = 2 (melepas 2 ion H^(+)), sehingga N = M × a = 7,0 × 2 = 14,0 N.||Molalitas: Misalkan 100 gram larutan -> massa H_2SO_4 (g) = 49 gram, dan massa air pelarut (p) = 100 - 49 = 51 gram.||Maka m = (⟦F:49¦98⟧) × (⟦F:1000¦51⟧) = 0,5 × 19,61 = 9,80 molal.", "Molaritas = 7,0 M, Normalitas = 14,0 N, dan Molalitas = 9,80 m."], "x2": ["Untuk membuat 500 mL larutan HNO_3 2,0 M, seorang analis mencampurkan larutan HNO_3 pekat (kadar 63% massa, massa jenis 1,4 ⟦F:g¦mL⟧, Mr HNO_3 = 63) dengan larutan HNO_3 encer 0,5 M. Hitunglah berapa mL volume larutan HNO_3 pekat 63% dan berapa mL volume larutan HNO_3 0,5 M yang harus dicampurkan!", "Hitung terlebih dahulu Molaritas larutan HNO_3 pekat (M_1): M_1 = ⟦F:% xx 10 xx rho¦Mr⟧ = ⟦F:63 xx 10 xx 1,4¦63⟧ = 10 xx 1,4 = 14,0 M.||Misalkan volume HNO_3 pekat (14,0 M) = V_1 mL, maka volume HNO_3 encer (0,5 M) adalah V_2 = (500 - V_1) mL.||Gunakan persamaan pencampuran larutan: M_1 V_1 + M_2 V_2 = M_(akhir) V_(akhir) -> 14,0 V_1 + 0,5(500 - V_1) = 2,0 xx 500.||13,5 V_1 = 750 -> V_1 = ⟦F:750¦13,5⟧ = 55,56 mL, dan V_2 = 500 - 55,56 = 444,44 mL.", "55,56 mL HNO_3 pekat (14 M) dan 444,44 mL HNO_3 0,5 M."], "z": [["Sebanyak 100 mL larutan NaOH 0,5 M dicampurkan dengan 400 mL larutan NaOH 0,25 M. Konsentrasi larutan NaOH setelah pencampuran adalah...", ["0,30 M", "0,35 M", "0,375 M", "0,40 M"], 0, "M_(campuran) = ⟦F:M_1 V_1 + M_2 V_2¦V_1 + V_2⟧ = ⟦F:0,5 × 100 + 0,25 × 400¦100 + 400⟧ = ⟦F:50 + 100¦500⟧ = ⟦F:150¦500⟧ = 0,30 M."], ["Berapa gram glukosa (Mr = 180) yang harus dilarutkan ke dalam 90 gram air (Mr = 18) agar diperoleh larutan glukosa dengan fraksi mol terlarut (X_t) sebesar 0,1?", ["18 gram", "90 gram", "100 gram", "180 gram"], 2, "Mol air n_p = ⟦F:90¦18⟧ = 5 mol. Dari X_t = ⟦F:n_t¦n_t + n_p⟧ = 0,1 = ⟦F:1¦10,⟧ maka 10 n_t = n_t + 5 -> 9 n_t = 5 -> n_t = ⟦F:5¦9⟧ mol. Massa glukosa = (⟦F:5¦9⟧) × 180 = 100 gram."], ["🔥 [HOTS] Suatu larutan glukosa (Mr = 180) dalam air (Mr = 18) memiliki molalitas 2,5 m. Berapakah fraksi mol glukosa (X_t) di dalam larutan tersebut?", ["⟦F:1¦22,22⟧", "⟦F:1¦23,22⟧", "⟦F:2,5¦18⟧", "⟦F:1¦40⟧"], 1, "Molalitas 2,5 m artinya terdapat n_t = 2,5 mol glukosa di dalam 1.000 gram pelarut air. Mol air n_p = ⟦F:1000¦18⟧ = 55,56 mol. Maka X_t = ⟦F:2,5¦2,5 + 55,56⟧ = ⟦F:1¦23,22.⟧"], ["🔥 [HOTS] Larutan HCl pekat 36,5% massa (massa jenis 1,2 ⟦F:g¦mL⟧, Mr = 36,5) diambil sebanyak 25 mL lalu diencerkan dengan air hingga volume akhir 600 mL. Molaritas larutan HCl setelah pengenceran adalah...", ["0,25 M", "0,50 M", "1,00 M", "1,20 M"], 1, "Molaritas HCl pekat M_1 = ⟦F:36,5 xx 10 xx 1,2¦36,5⟧ = 12,0 M. Dari rumus pengenceran M_1 V_1 = M_2 V_2: 12,0 M xx 25 mL = M_2 xx 600 mL -> M_2 = ⟦F:300¦600⟧ = 0,50 M."]], "m": ["Larutan urea 10% massa memiliki massa terlarut 10 gram dan massa pelarut air 100 gram.", "Mengartikan persen massa sebagai perbandingan massa terlarut terhadap massa pelarut.", "Persen massa adalah massa terlarut per 100 gram LARUTAN total; jadi dalam 100 gram larutan 10%, terdapat 10 gram zat terlarut dan (100 - 10) = 90 gram pelarut air."]}, "1.2": {"x": ["Sebanyak 11,1 gram CaCl_2 (Mr = 111) dilarutkan dalam 500 gram air (K_f air = 1,86 ⟦F:°C¦m⟧). Jika CaCl_2 terionisasi sempurna (alpha = 1), tentukan titik beku larutan tersebut pada tekanan 1 atm!", "Hitung molalitas CaCl_2: m = (⟦F:11,1¦111⟧) × (⟦F:1000¦500⟧) = 0,1 × 2 = 0,2 molal.||CaCl_2 adalah garam elektrolit kuat yang terurai menjadi 3 ion: CaCl_2 -> Ca^(2+) + 2Cl^(-) (n = 3). Karena alpha = 1, maka faktor van't Hoff i = n = 3.||Penurunan titik beku: Delta T_f = K_f × m × i = 1,86 × 0,2 × 3 = 1,116 °C.||Titik beku larutan: T_f = 0 °C - Delta T_f = -1,116 °C.", "-1,116 °C"], "x2": ["Sebanyak 2,665 gram senyawa kompleks CrCl_3.6H_2O (Mr = 266,5) dilarutkan ke dalam 100 gram air (K_f = 1,86 ⟦F:°C¦m⟧). Larutan tersebut ternyata membeku pada suhu -0,558 °C. Dengan menganggap senyawa kompleks terionisasi sempurna (alpha = 1), tentukan faktor van't Hoff (i), jumlah ion per molekul kompleks, dan rumus struktur koordinasi senyawa tersebut!", "Mol kompleks = ⟦F:2,665¦266,5⟧ = 0,01 mol. Molalitas larutan kompleks: m = ⟦F:0,01¦0,100⟧ = 0,10 molal.||Penurunan titik beku terukur: Delta T_f = 0 - (-0,558) = 0,558 °C.||Gunakan rumus Delta T_f = K_f xx m xx i -> 0,558 = 1,86 xx 0,10 xx i -> i = ⟦F:0,558¦0,186⟧ = 3.||Karena alpha = 1, maka i = n = 3 ion per rumus molekul! Agar menghasilkan 3 ion dalam air (1 kation kompleks + 2 anion Cl^(-) bebas), harus ada 2 ion Cl^(-) di luar kurung siku dan 1 Cl^(-) + 5 H_2O di dalam kurung siku: [Cr(H_2O)_5Cl]Cl_2.H_2O.", "i = 3 (terurai menjadi 3 ion), rumus struktur koordinasinya adalah [Cr(H_2O)_5Cl]Cl_2.H_2O."], "z": [["Di antara keempat larutan berair dengan konsentrasi 0,1 m berikut, manakah yang memiliki titik beku PALING TINGGI (paling mendekati 0 °C)?", ["Glukosa (C_6H_(12)O_6) 0,1 m", "NaCl 0,1 m", "BaCl_2 0,1 m", "Al_2(SO_4)_3 0,1 m"], 0, "Titik beku paling tinggi dimiliki oleh larutan dengan penurunan titik beku (Delta T_f) terkecil, yaitu yang memiliki m × i paling kecil. Glukosa adalah nonelektrolit (i = 1) sehingga m × i = 0,1 (paling kecil)."], ["Tekanan osmotik larutan yang mengandung 3 gram urea (Mr = 60) dalam 500 mL larutan pada suhu 27 °C (R = 0,082 ⟦F:L·atm¦mol·K⟧) adalah...", ["1,23 atm", "2,46 atm", "4,92 atm", "0,22 atm"], 1, "Molaritas urea M = (⟦F:3¦60⟧) × (⟦F:1000¦500⟧) = 0,05 × 2 = 0,1 M. Suhu mutlak T = 27 + 273 = 300 K. Tekanan osmotik pi = M R T = 0,1 × 0,082 × 300 = 2,46 atm."], ["🔥 [HOTS] Larutan 6 gram urea (Mr = 60, nonelektrolit) dalam 500 mL larutan bersifat isotonik (memiliki tekanan osmotik yang sama pada suhu yang sama) dengan 500 mL larutan garam BaCl_2 0,08 M. Derajat ionisasi (alpha) larutan BaCl_2 tersebut adalah...", ["0,50", "0,60", "0,75", "0,80"], 2, "Molaritas urea M_1 = ⟦F:⟦F:6¦60⟧¦0,5⟧ = 0,20 M (i_1 = 1). Syarat isotonik pada suhu sama: M_1 i_1 = M_2 i_2 -> 0,20(1) = 0,08 xx i_2 -> i_2 = ⟦F:0,20¦0,08⟧ = 2,5. Untuk BaCl_2 (n = 3 ion), i = 1 + (3 - 1)alpha = 2,5 -> 2 alpha = 1,5 -> alpha = 0,75."], ["🔥 [HOTS] Sebanyak 18 gram glukosa (Mr = 180) dan 5,85 gram NaCl (Mr = 58,5; alpha = 1) dilarutkan bersama-sama ke dalam 500 gram air (K_b air = 0,52 ⟦F:°C¦m⟧). Titik didih larutan campuran tersebut pada tekanan 1 atm adalah...", ["100,156 °C", "100,312 °C", "100,520 °C", "100,624 °C"], 1, "Mol glukosa (i=1) = ⟦F:18¦180⟧ = 0,1 mol. Mol NaCl (i=2) = ⟦F:5,85¦58,5⟧ = 0,1 mol -> mol partikel efektif NaCl = 0,1 xx 2 = 0,2 mol. Total mol partikel terlarut = 0,1 + 0,2 = 0,3 mol dalam 0,5 kg air -> molalitas efektif = ⟦F:0,3¦0,5⟧ = 0,6 m. Maka Delta T_b = 0,52 xx 0,6 = 0,312 °C -> T_b = 100,312 °C."]], "m": ["Penambahan zat terlarut ke dalam air murni menyebabkan tekanan uap jenuh larutan menjadi lebih tinggi daripada air murni.", "Mengira partikel zat terlarut menambah dorongan molekul air untuk menguap.", "Partikel zat terlarut non-volatil justru menghalangi molekul air di permukaan untuk menguap dan menariknya dengan gaya antarmolekul, sehingga tekanan uap jenuh larutan selalu turun (P < P^0)."]}, "1.3": {"x": ["Sebanyak 100 mL larutan CH_3COOH 0,2 M (K_a = 10^(-5)) dicampurkan dengan 50 mL larutan NaOH 0,2 M. Tentukan pH campuran yang terbentuk!", "Hitung mmol mula-mula: n(CH_3COOH) = 100 mL × 0,2 M = 20 mmol (asam lemah); n(NaOH) = 50 mL × 0,2 M = 10 mmol (basa kuat).||Reaksi: CH_3COOH + NaOH -> CH_3COONa + H_2O. Karena NaOH lebih kecil (10 mmol), NaOH habis bereaksi.||Pada keadaan akhir (Sisa): tersisa CH_3COOH = 20 - 10 = 10 mmol, dan terbentuk garam CH_3COONa = 10 mmol. Campuran asam lemah sisa + garamnya membentuk Larutan Penyangga (Buffer) Asam!||[H^(+)] = K_a × (⟦F:n_(asam)¦n_(garam)⟧) = 10^(-5) × (⟦F:10¦10⟧) = 10^(-5) M. Maka pH = -log(10^(-5)) = 5.", "pH = 5 (Larutan Penyangga Asam)"], "x2": ["Sebanyak 200 mL larutan penyangga mengandung CH_3COOH 0,2 M dan CH_3COONa 0,2 M (K_a CH_3COOH = 10^(-5)). Hitunglah: (a) pH awal larutan penyangga, dan (b) pH larutan setelah ke dalamnya ditambahkan 10 mL larutan HCl 1,0 M! (Diketahui log 3 = 0,48 dan log 5 = 0,70)", "(a) Mol awal komponen penyangga: n(CH_3COOH) = 200 mL xx 0,2 M = 40 mmol; n(CH_3COO^(-)) = 200 mL xx 0,2 M = 40 mmol. Maka [H^(+)] awal = 10^(-5) xx (⟦F:40¦40⟧) = 10^(-5) M -> pH awal = 5,00.||(b) Penambahan 10 mL HCl 1,0 M berarti menambahkan ion H^(+) sebesar 10 mmol.||Ion H^(+) dari asam kuat akan dinetralkan oleh basa konjugasi CH_3COO^(-): CH_3COO^(-) + H^(+) -> CH_3COOH.||Setelah reaksi: mol CH_3COO^(-) berkurang menjadi 40 - 10 = 30 mmol, sedangkan mol CH_3COOH bertambah menjadi 40 + 10 = 50 mmol. Maka [H^(+)] baru = 10^(-5) xx (⟦F:50¦30⟧) = (⟦F:5¦3⟧) xx 10^(-5) M -> pH = 5 - log 5 + log 3 = 5 - 0,70 + 0,48 = 4,78.", "(a) pH awal = 5,00; (b) pH setelah ditambah HCl = 4,78."], "z": [["Pada reaksi kesetimbangan: HSO_4^(-)(aq) + H_2O(l) <=> H_3O^(+)(aq) + SO_4^(2-)(aq), yang merupakan pasangan asam-basa konjugasi menurut Bronsted-Lowry adalah...", ["HSO_4^(-) dan H_2O", "HSO_4^(-) dan SO_4^(2-)", "H_2O dan SO_4^(2-)", "HSO_4^(-) dan H_3O^(+)"], 1, "Pasangan asam-basa konjugasi adalah dua spesi yang rumus kimianya hanya berselisih 1 proton (H^(+)): HSO_4^(-) (asam) melepas H^(+) menjadi SO_4^(2-) (basa konjugasi)."], ["Pasangan campuran larutan berikut yang menghasilkan larutan penyangga (buffer) adalah...", ["100 mL HCl 0,2 M + 100 mL NaCl 0,2 M", "100 mL CH_3COOH 0,2 M + 100 mL NaOH 0,2 M", "100 mL NH_3 0,2 M + 50 mL HCl 0,2 M", "50 mL CH_3COOH 0,2 M + 100 mL NaOH 0,2 M"], 2, "100 mL NH_3 0,2 M (20 mmol basa lemah) + 50 mL HCl 0,2 M (10 mmol asam kuat) menyisakan 10 mmol NH_3 dan menghasilkan 10 mmol NH_4Cl, sehingga terbentuk buffer basa."], ["🔥 [HOTS] Berapa mL larutan NaOH 0,2 M yang harus ditambahkan ke dalam 100 mL larutan CH_3COOH 0,3 M (K_a = 10^(-5)) agar diperoleh larutan penyangga dengan pH = 5 - log 2?", ["25 mL", "50 mL", "75 mL", "100 mL"], 1, "pH = 5 - log 2 berarti [H^(+)] = 2 xx 10^(-5) M. Dari [H^(+)] = K_a (⟦F:n_a¦n_g⟧) -> ⟦F:n_a¦n_g⟧ = 2. Mol awal CH_3COOH = 30 mmol; misalkan mol NaOH = x mmol. Setelah reaksi: n_a sisa = (30 - x) dan n_g terbentuk = x. Maka ⟦F:30 - x¦x⟧ = 2 -> x = 10 mmol NaOH. Volume NaOH = ⟦F:10¦0,2⟧ = 50 mL."], ["🔥 [HOTS] Suatu tablet antasida bermassa 1,0 gram yang mengandung Mg(OH)_2 (Mr = 58) dilarutkan dalam 50 mL larutan HCl 0,5 M berlebih. Kelebihan HCl yang tidak bereaksi ternyata membutuhkan 50 mL larutan NaOH 0,1 M untuk mencapai titik ekivalen netralisasi. Persentase massa Mg(OH)_2 murni di dalam tablet antasida tersebut adalah...", ["29%", "43,5%", "58%", "87%"], 2, "Metode titrasi balik: Mol HCl total = 50 xx 0,5 = 25 mmol. Mol HCl sisa = mol NaOH = 50 xx 0,1 = 5 mmol. Maka mol HCl yang bereaksi dengan Mg(OH)_2 = 25 - 5 = 20 mmol. Karena Mg(OH)_2 + 2HCl -> MgCl_2 + 2H_2O, mol Mg(OH)_2 = ⟦F:20¦2⟧ = 10 mmol = 0,01 mol. Massa Mg(OH)_2 = 0,01 xx 58 = 0,58 gram -> kadar = 58%."]], "m": ["Campuran asam kuat HCl berlebih dengan basa kuat NaOH akan membentuk larutan penyangga karena ada asam sisa dan garam NaCl.", "Menganggap setiap campuran asam sisa dan garamnya pasti membentuk larutan penyangga.", "Syarat mutlak larutan penyangga adalah komponen yang bersisa haruslah ASAM LEMAH atau BASA LEMAH beserta konjugasinya; jika asam kuat yang bersisa, pH langsung ditentukan oleh konsentrasi asam kuat sisa tersebut."]}, "1.4": {"x": ["Sebanyak 50 mL larutan CH_3COOH 0,2 M (K_a = 10^(-5)) direaksikan dengan 50 mL larutan NaOH 0,2 M. Tentukan pH larutan yang dihasilkan!", "Mol mula-mula: n(CH_3COOH) = 50 × 0,2 = 10 mmol; n(NaOH) = 50 × 0,2 = 10 mmol.||Kedua pereaksi tepat habis bereaksi (masing-masing 10 mmol) dan membentuk 10 mmol garam CH_3COONa dalam volume total V_(total) = 50 + 50 = 100 mL.||Konsentrasi garam [CH_3COONa] = 10 ⟦F:mmol¦100⟧ mL = 0,1 M = 10^(-1) M. Karena berasal dari Basa Kuat (NaOH) + Asam Lemah (CH_3COOH), garam bersifat BASA.||[OH^(-)] = sqrt((⟦F:K_w¦K_a⟧) × [CH_3COO^(-)]) = sqrt((⟦F:10^(-14)¦10^(-5)⟧) × 10^(-1)) = sqrt(10^(-10)) = 10^(-5) M. Maka pOH = 5 dan pH = 14 - 5 = 9.", "pH = 9"], "x2": ["Sebanyak 100 mL larutan asam sianida HCN 0,2 M (K_a = 5 xx 10^(-10)) direaksikan dengan 100 mL larutan Kalsium Hidroksida Ca(OH)_2 0,1 M. Tentukan: (a) jenis sistem larutan yang terbentuk, (b) konsentrasi molar ion CN^(-) di dalam campuran, dan (c) pH larutan akhir! (Diketahui K_w = 10^(-14) dan log 2 = 0,3)", "Hitung mmol mula-mula: n(HCN) = 100 mL xx 0,2 M = 20 mmol; n(Ca(OH)_2) = 100 mL xx 0,1 M = 10 mmol.||Tulis persamaan reaksi setara: 2HCN(aq) + Ca(OH)_2(aq) -> Ca(CN)_2(aq) + 2H_2O(l). Sesuai rasio koefisien 2 : 1, sebanyak 20 mmol HCN dan 10 mmol Ca(OH)_2 TEPAT HABIS BEREAKSI menghasilkan 10 mmol garam Ca(CN)_2!||Volume total campuran V_(total) = 100 + 100 = 200 mL, sehingga [Ca(CN)_2] = ⟦F:10¦200⟧ = 0,05 M. Perhatikan jebakan valensi: Ca(CN)_2 -> Ca^(2+) + 2CN^(-), sehingga konsentrasi anion yang terhidrolisis [CN^(-)] = 2 xx 0,05 M = 0,10 M!||Hitung [OH^(-)] = sqrt((⟦F:K_w¦K_a⟧) xx [CN^(-)]) = sqrt((⟦F:10^(-14)¦5 xx 10^(-10)⟧) xx 0,1) = sqrt(2 xx 10^(-6)) = sqrt(2) xx 10^(-3) M. Maka pOH = 3 - 0,5 log 2 = 2,85 -> pH = 14 - 2,85 = 11,15.", "(a) Hidrolisis garam basa Ca(CN)_2; (b) [CN^(-)] = 0,10 M; (c) pH = 11,15."], "z": [["Berapakah pH larutan (NH_4)_2SO_4 0,05 M jika diketahui K_b NH_3 = 10^(-5) dan K_w = 10^(-14)?", ["5", "5,5", "8,5", "9"], 0, "(NH_4)_2SO_4 terurai menjadi 2 NH_4^(+) + SO_4^(2-). Konsentrasi kation yang terhidrolisis [NH_4^(+)] = 2 × 0,05 M = 0,1 M = 10^(-1) M. Maka [H^(+)] = sqrt((⟦F:10^(-14)¦10^(-5)⟧) × 10^(-1)) = sqrt(10^(-10)) = 10^(-5) M -> pH = 5."], ["Di antara garam berikut yang di dalam air mengalami hidrolisis parsial dan memerahkan kertas lakmus biru adalah...", ["CH_3COONa", "NaCl", "NH_4Cl", "K_2CO_3"], 2, "Memerahkan lakmus biru berarti bersifat asam (pH < 7), yaitu garam dari Asam Kuat (HCl) dan Basa Lemah (NH_3): NH_4Cl."], ["🔥 [HOTS] Berapakah massa kristal amonium klorida (NH_4Cl, Mr = 53,5) yang harus dilarutkan ke dalam air hingga volume 500 mL agar diperoleh larutan dengan pH = 5? (Diketahui K_b NH_3 = 10^(-5) dan K_w = 10^(-14))", ["1,3375 gram", "2,675 gram", "5,350 gram", "10,70 gram"], 1, "Garam asam NH_4Cl memiliki pH = 5 -> [H^(+)] = 10^(-5) M. Dari [H^(+)] = sqrt((⟦F:K_w¦K_b⟧) xx M) -> 10^(-10) = (⟦F:10^(-14)¦10^(-5)⟧) xx M -> M = 0,1 M. Mol NH_4Cl dalam 0,5 L = 0,1 xx 0,5 = 0,05 mol. Massa NH_4Cl = 0,05 xx 53,5 = 2,675 gram."], ["🔥 [HOTS] Garam amonium asetat (CH_3COONH_4) mengalami hidrolisis total di dalam air. Jika diketahui K_a CH_3COOH = 2 xx 10^(-5) dan K_b NH_3 = 5 xx 10^(-6) (log 2 = 0,3), maka pH larutan CH_3COONH_4 0,2 M adalah...", ["6,7", "7,0", "7,3", "6,4"], 0, "Untuk garam dari asam lemah dan basa lemah (hidrolisis total), pH tidak bergantung pada konsentrasi garam: [H^(+)] = sqrt(⟦F:K_w xx K_a¦K_b⟧) = sqrt(⟦F:10^(-14) xx 2 xx 10^(-5)¦5 xx 10^(-6)⟧) = sqrt(4 xx 10^(-14)) = 2 xx 10^(-7) M. Maka pH = 7 - log 2 = 6,7."]], "m": ["Karena diketahui K_a pada soal garam CH_3COONa, maka rumus sqrt((⟦F:K_w¦K_a⟧) × M) langsung menghasilkan konsentrasi [H^(+)].", "Berpikir bahwa adanya data K_a berarti hasil perhitungan akar otomatis adalah [H^(+)].", "CH_3COONa berasal dari Basa Kuat (NaOH) + Asam Lemah (CH_3COOH) sehingga larutannya bersifat BASA; oleh karena itu hasil akar sqrt((⟦F:K_w¦K_a⟧) × [CH_3COO^(-)]) adalah [OH^(-)], baru kemudian pH = 14 - pOH."]}, "1.5": {"x": ["Diketahui K_(sp) Ag_2CrO_4 pada suhu 25 °C adalah 4 × 10^(-12). Hitunglah: (a) kelarutan Ag_2CrO_4 dalam air murni, dan (b) kelarutan Ag_2CrO_4 dalam larutan AgNO_3 0,01 M!", "(a) Dalam air murni: Ag_2CrO_4(s) <=> 2Ag^(+)(aq) + CrO_4^(2-)(aq) (3 ion). Rumus K_(sp) = 4 s^3 = 4 × 10^(-12), sehingga s^3 = 10^(-12) -> s = 10^(-4) M.||(b) Dalam larutan AgNO_3 0,01 M terdapat ion senama [Ag^(+)
