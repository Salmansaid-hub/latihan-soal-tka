dahan tetap MgSO_4 sebanyak n = M xx V = 0,003 M xx 100 L = 0,30 mol. Untuk mengendapkan 0,30 mol Mg^(2+) sebagai MgCO_3 dibutuhkan 0,30 mol Na_2CO_3 = 0,30 xx 106 ⟦F:g¦mol⟧ = 31,8 gram."], ["🔥 [HOTS] Dalam penentuan nilai COD (Chemical Oxygen Demand) air limbah, 100 mL sampel air limbah direfluks dengan larutan K_2Cr_2O_7 dalam suasana asam dan ternyata menghabiskan 0,001 mol ion dikromat Cr_2O_7^(2-) (yang tereduksi menjadi Cr^(3+)). Mengingat 1 mol Cr_2O_7^(2-) menerima 6 mol elektron dan 1 mol gas O_2 (Mr = 32) dalam reaksi reduksi menerima 4 mol elektron, maka nilai COD sampel air limbah tersebut (dalam mg O_2 per liter air) adalah...", ["160 m⟦F:g¦L⟧", "320 m⟦F:g¦L⟧", "480 m⟦F:g¦L⟧", "640 m⟦F:g¦L⟧"], 2, "Mol elektron yang diterima oleh 0,001 mol Cr_2O_7^(2-) = 6 xx 0,001 = 0,006 mol elektron. Jumlah mol O_2 yang ekivalen (4 elektron per O_2) = ⟦F:0,006¦4⟧ = 0,0015 mol O_2. Massa O_2 ekivalen dalam 100 mL (0,1 L) sampel = 0,0015 mol xx 32.000 ⟦F:mg¦mol⟧ = 48 mg O_2. Maka dalam 1 liter air, nilai COD = 48 ⟦F:mg¦0,1⟧ L = 480 m⟦F:g¦L⟧!"]], "m": ["Gas karbon dioksida (CO_2) adalah penyebab utama menipisnya lapisan ozon (O_3) di stratosfer.", "Mencampuradukkan fenomena pemanasan global (efek rumah kaca) dengan penipisan lapisan ozon.", "CO_2 adalah gas rumah kaca penyebab pemanasan global (menahan radiasi inframerah bumi), sedangkan perusak lapisan ozon (O_3) di stratosfer adalah senyawa CFC (Freon) yang melepaskan radikal bebas atom klorin (Cl.) saat terkena sinar UV."]}};
const MIS=[{"e": "🕵️", "t": "Investigasi Limbah Logam Berat Timbal (Pb)", "c": 0, "b": "Tim laboratorium lingkungan menemukan sebuah tangki penampungan limbah cair pabrik baterai bervolume 500 liter yang tercemar ion timbal(II) atau Pb^(2+). Untuk mengendapkan seluruh racun Pb^(2+) secara aman sebelum air dibuang, teknisi berencana menambahkan garam Natrium Sulfat (Na_2SO_4, Mr = 142) sehingga terbentuk endapan putih PbSO_4(s) (Mr = 303).", "s": [["Tahap 1 — Analisis Sampel: Sebanyak 100 mL sampel air limbah diambil dan direaksikan dengan larutan KI berlebih, menghasilkan 0,461 gram endapan kuning PbI_2 (Mr = 461). Berapakah konsentrasi molar ion Pb^(2+) di dalam air limbah tersebut?", [["0,001 M", 0, "Analisis kembali konsep dan perhitungannya: Mol endapan PbI_2 dalam 100 mL sampel = 0,461 ⟦F:g¦461⟧ ⟦F:g¦mol⟧ = 0,001 mol (1 mmol). Karena 1 mol PbI_2 mengandung 1 mol Pb^(2+), maka [Pb^(2+)] = 1 ⟦F:mmol¦100⟧ mL = 0,010 M."], ["0,010 M", 1, "Mol endapan PbI_2 dalam 100 mL sampel = 0,461 ⟦F:g¦461⟧ ⟦F:g¦mol⟧ = 0,001 mol (1 mmol). Karena 1 mol PbI_2 mengandung 1 mol Pb^(2+), maka [Pb^(2+)] = 1 ⟦F:mmol¦100⟧ mL = 0,010 M."], ["0,050 M", 0, "Analisis kembali konsep dan perhitungannya: Mol endapan PbI_2 dalam 100 mL sampel = 0,461 ⟦F:g¦461⟧ ⟦F:g¦mol⟧ = 0,001 mol (1 mmol). Karena 1 mol PbI_2 mengandung 1 mol Pb^(2+), maka [Pb^(2+)] = 1 ⟦F:mmol¦100⟧ mL = 0,010 M."], ["0,100 M", 0, "Analisis kembali konsep dan perhitungannya: Mol endapan PbI_2 dalam 100 mL sampel = 0,461 ⟦F:g¦461⟧ ⟦F:g¦mol⟧ = 0,001 mol (1 mmol). Karena 1 mol PbI_2 mengandung 1 mol Pb^(2+), maka [Pb^(2+)] = 1 ⟦F:mmol¦100⟧ mL = 0,010 M."]]], ["Tahap 2 — Perhitungan Dosis Reagen: Berdasarkan konsentrasi [Pb^(2+)] = 0,010 M tersebut, berapa mol total ion Pb^(2+) yang terdapat di dalam seluruh tangki limbah bervolume 500 liter?", [["0,5 mol", 0, "Analisis kembali konsep dan perhitungannya: Total mol Pb^(2+) dalam tangki = M × V = 0,010 ⟦F:mol¦L⟧ × 500 L = 5,0 mol."], ["5,0 mol", 1, "Total mol Pb^(2+) dalam tangki = M × V = 0,010 ⟦F:mol¦L⟧ × 500 L = 5,0 mol."], ["50,0 mol", 0, "Analisis kembali konsep dan perhitungannya: Total mol Pb^(2+) dalam tangki = M × V = 0,010 ⟦F:mol¦L⟧ × 500 L = 5,0 mol."], ["5,0 mmol", 0, "Analisis kembali konsep dan perhitungannya: Total mol Pb^(2+) dalam tangki = M × V = 0,010 ⟦F:mol¦L⟧ × 500 L = 5,0 mol."]]], ["Tahap 3 — Eksekusi Pengendapan: Menurut reaksi Pb^(2+)(aq) + SO_4^(2-)(aq) -> PbSO_4(s), berapa massa minimum serbuk Na_2SO_4 murni (Mr = 142) yang wajib ditambahkan ke dalam tangki 500 L dan berapa massa endapan PbSO_4 (Mr = 303) yang akan terkumpul?", [["710 gram Na_2SO_4 dan 1.515 gram endapan PbSO_4", 1, "Karena koefisien 1 : 1 : 1, dibutuhkan 5,0 mol Na_2SO_4 = 5,0 × 142 ⟦F:g¦mol⟧ = 710 gram, dan akan terbentuk 5,0 mol endapan PbSO_4 = 5,0 × 303 ⟦F:g¦mol⟧ = 1.515 gram (1,515 kg)."], ["142 gram Na_2SO_4 dan 303 gram endapan PbSO_4", 0, "Analisis kembali konsep dan perhitungannya: Karena koefisien 1 : 1 : 1, dibutuhkan 5,0 mol Na_2SO_4 = 5,0 × 142 ⟦F:g¦mol⟧ = 710 gram, dan akan terbentuk 5,0 mol endapan PbSO_4 = 5,0 × 303 ⟦F:g¦mol⟧ = 1.515 gram (1,515 kg)."], ["355 gram Na_2SO_4 dan 757,5 gram endapan PbSO_4", 0, "Analisis kembali konsep dan perhitungannya: Karena koefisien 1 : 1 : 1, dibutuhkan 5,0 mol Na_2SO_4 = 5,0 × 142 ⟦F:g¦mol⟧ = 710 gram, dan akan terbentuk 5,0 mol endapan PbSO_4 = 5,0 × 303 ⟦F:g¦mol⟧ = 1.515 gram (1,515 kg)."], ["1.420 gram Na_2SO_4 dan 3.030 gram endapan PbSO_4", 0, "Analisis kembali konsep dan perhitungannya: Karena koefisien 1 : 1 : 1, dibutuhkan 5,0 mol Na_2SO_4 = 5,0 × 142 ⟦F:g¦mol⟧ = 710 gram, dan akan terbentuk 5,0 mol endapan PbSO_4 = 5,0 × 303 ⟦F:g¦mol⟧ = 1.515 gram (1,515 kg)."]]]], "k": "Misi Selesai! Dengan menerapkan stoikiometri pengendapan dari sampel 100 mL ke skala tangki 500 L, kamu berhasil menentukan dosis tepat 710 g Na_2SO_4 untuk memisahkan 1,515 kg limbah beracun PbSO_4."}, {"e": "🏥", "t": "Krisis Asidosis Darah Pasien IGD & Sistem Buffer", "c": 1, "b": "Seorang pasien dilarikan ke IGD dalam kondisi napas cepat. Darah manusia normal dijaga ketat pada pH 7,40 oleh sistem penyangga utama Asam Karbonat (H_2CO_3, K_a = 4 × 10^(-7); log 4 = 0,6) dan ion Bikarbonat (HCO_3^(-)). Jika pH darah turun di bawah 7,35, pasien mengalami asidosis metabolik yang membahayakan fungsi enzim jantung.", "s": [["Tahap 1 — Diagnosis Normal: Agar pH darah normal berada tepat pada nilai 7,40 (sehingga [H^(+)] = 4 × 10^(-8) M), berapakah perbandingan konsentrasi [HCO_3^(-)] : [H_2CO_3] di dalam darah sehat?", [["1 : 10", 0, "Analisis kembali konsep dan perhitungannya: Dari rumus buffer asam: [H^(+)] = K_a × (⟦F:[H_2CO_3]¦[HCO_3^(-)⟧]). Maka 4 × 10^(-8) = 4 × 10^(-7) × (⟦F:[H_2CO_3]¦[HCO_3^(-)⟧]), sehingga ⟦F:[H_2CO_3]¦[HCO_3^(-)⟧] = ⟦F:1¦10,⟧ atau rasio [HCO_3^(-)] : [H_2CO_3] = 10 : 1."], ["1 : 1", 0, "Analisis kembali konsep dan perhitungannya: Dari rumus buffer asam: [H^(+)] = K_a × (⟦F:[H_2CO_3]¦[HCO_3^(-)⟧]). Maka 4 × 10^(-8) = 4 × 10^(-7) × (⟦F:[H_2CO_3]¦[HCO_3^(-)⟧]), sehingga ⟦F:[H_2CO_3]¦[HCO_3^(-)⟧] = ⟦F:1¦10,⟧ atau rasio [HCO_3^(-)] : [H_2CO_3] = 10 : 1."], ["10 : 1", 1, "Dari rumus buffer asam: [H^(+)] = K_a × (⟦F:[H_2CO_3]¦[HCO_3^(-)⟧]). Maka 4 × 10^(-8) = 4 × 10^(-7) × (⟦F:[H_2CO_3]¦[HCO_3^(-)⟧]), sehingga ⟦F:[H_2CO_3]¦[HCO_3^(-)⟧] = ⟦F:1¦10,⟧ atau rasio [HCO_3^(-)] : [H_2CO_3] = 10 : 1."], ["20 : 1", 0, "Analisis kembali konsep dan perhitungannya: Dari rumus buffer asam: [H^(+)] = K_a × (⟦F:[H_2CO_3]¦[HCO_3^(-)⟧]). Maka 4 × 10^(-8) = 4 × 10^(-7) × (⟦F:[H_2CO_3]¦[HCO_3^(-)⟧]), sehingga ⟦F:[H_2CO_3]¦[HCO_3^(-)⟧] = ⟦F:1¦10,⟧ atau rasio [HCO_3^(-)] : [H_2CO_3] = 10 : 1."]]], ["Tahap 2 — Evaluasi Krisis: Hasil analisis gas darah pasien menunjukkan rasio [HCO_3^(-)] : [H_2CO_3] anjlok menjadi 5 : 1 akibat penumpukan asam laktat. Berapakah pH darah pasien saat ini? (Diketahui log 8 = 0,9)", [["7,10 (Asidosis berat)", 1, "[H^(+)] = 4 × 10^(-7) × (⟦F:1¦5⟧) = 0,8 × 10^(-7) = 8 × 10^(-8) M. Maka pH = -log(8 × 10^(-8)) = 8 - log 8 = 8 - 0,9 = 7,10 (mengalami asidosis metabolik berat!)."], ["7,40 (Normal)", 0, "Analisis kembali konsep dan perhitungannya: [H^(+)] = 4 × 10^(-7) × (⟦F:1¦5⟧) = 0,8 × 10^(-7) = 8 × 10^(-8) M. Maka pH = -log(8 × 10^(-8)) = 8 - log 8 = 8 - 0,9 = 7,10 (mengalami asidosis metabolik berat!)."], ["7,70 (Alkalosis)", 0, "Analisis kembali konsep dan perhitungannya: [H^(+)] = 4 × 10^(-7) × (⟦F:1¦5⟧) = 0,8 × 10^(-7) = 8 × 10^(-8) M. Maka pH = -log(8 × 10^(-8)) = 8 - log 8 = 8 - 0,9 = 7,10 (mengalami asidosis metabolik berat!)."], ["6,40 (Kritis)", 0, "Analisis kembali konsep dan perhitungannya: [H^(+)] = 4 × 10^(-7) × (⟦F:1¦5⟧) = 0,8 × 10^(-7) = 8 × 10^(-8) M. Maka pH = -log(8 × 10^(-8)) = 8 - log 8 = 8 - 0,9 = 7,10 (mengalami asidosis metabolik berat!)."]]], ["Tahap 3 — Tindakan Medis: Cairan infus manakah yang harus diberikan dokter secara intravena untuk segera menaikkan kembali rasio komponen basa konjugasi penyangga darah dan sekaligus harus isotonik (memiliki tekanan osmotik pi yang sama dengan darah)?", [["Larutan HCl encer hipotonik", 0, "Analisis kembali konsep dan perhitungannya: Pemberian infus NaHCO_3 isotonik menambah ion HCO_3^(-) untuk mengikat kelebihan H^(+) dan mengembalikan rasio [HCO_3^(-)⟦F:]¦[H_2CO_3]⟧ ke 10 : 1 tanpa merusak sel darah merah (karena tekanan osmotiknya isotonik)."], ["Larutan Natrium Bikarbonat (NaHCO_3) isotonik", 1, "Pemberian infus NaHCO_3 isotonik menambah ion HCO_3^(-) untuk mengikat kelebihan H^(+) dan mengembalikan rasio [HCO_3^(-)⟦F:]¦[H_2CO_3]⟧ ke 10 : 1 tanpa merusak sel darah merah (karena tekanan osmotiknya isotonik)."], ["Air murni (akuades) steril tanpa elektrolit", 0, "Analisis kembali konsep dan perhitungannya: Pemberian infus NaHCO_3 isotonik menambah ion HCO_3^(-) untuk mengikat kelebihan H^(+) dan mengembalikan rasio [HCO_3^(-)⟦F:]¦[H_2CO_3]⟧ ke 10 : 1 tanpa merusak sel darah merah (karena tekanan osmotiknya isotonik)."], ["Larutan NH_4Cl pekat hipertonik", 0, "Analisis kembali konsep dan perhitungannya: Pemberian infus NaHCO_3 isotonik menambah ion HCO_3^(-) untuk mengikat kelebihan H^(+) dan mengembalikan rasio [HCO_3^(-)⟦F:]¦[H_2CO_3]⟧ ke 10 : 1 tanpa merusak sel darah merah (karena tekanan osmotiknya isotonik)."]]]], "k": "Misi Medis Berhasil! Kamu memahami bagaimana penyangga karbonat-bikarbonat dengan rasio 10 : 1 menjaga pH darah 7,40 serta pentingnya larutan infus isotonik agar sel darah tidak mengalami hemolisis atau krenasi."}, {"e": "🏭", "t": "Optimasi Reaktor Amonia & Proteksi Pipa Bawah Laut", "c": 2, "b": "Sebuah pabrik pupuk nasional memproduksi amonia melalui proses Haber-Bosch: N_2(g) + 3H_2(g) <=> 2NH_3(g) dengan Delta H = -92 kJ. Selain mengoptimalkan hasil panen NH_3, kepala insinyur juga harus melindungi jaringan pipa baja penyalur air laut pendingin (E^0 Fe = -0,44 V) agar tidak bocor akibat korosi elektrokimia.", "s": [["Tahap 1 — Pergeseran Kesetimbangan: Berdasarkan persamaan reaksi N_2(g) + 3H_2(g) <=> 2NH_3(g) (Delta H = -92 kJ), kondisi tekanan dan suhu manakah yang secara termodinamika menggeser kesetimbangan paling jauh ke arah produk NH_3?", [["Tekanan rendah dan suhu tinggi", 0, "Analisis kembali konsep dan perhitungannya: Koefisien gas kanan (2) < kiri (4), sehingga tekanan tinggi menggeser ke kanan. Reaksi maju bersifat eksoterm (Delta H = -92 kJ), sehingga suhu rendah menggeser kesetimbangan ke kanan."], ["Tekanan tinggi dan suhu rendah", 1, "Koefisien gas kanan (2) < kiri (4), sehingga tekanan tinggi menggeser ke kanan. Reaksi maju bersifat eksoterm (Delta H = -92 kJ), sehingga suhu rendah menggeser kesetimbangan ke kanan."], ["Tekanan tinggi dan suhu sangat tinggi", 0, "Analisis kembali konsep dan perhitungannya: Koefisien gas kanan (2) < kiri (4), sehingga tekanan tinggi menggeser ke kanan. Reaksi maju bersifat eksoterm (Delta H = -92 kJ), sehingga suhu rendah menggeser kesetimbangan ke kanan."], ["Tekanan rendah dan suhu rendah", 0, "Analisis kembali konsep dan perhitungannya: Koefisien gas kanan (2) < kiri (4), sehingga tekanan tinggi menggeser ke kanan. Reaksi maju bersifat eksoterm (Delta H = -92 kJ), sehingga suhu rendah menggeser kesetimbangan ke kanan."]]], ["Tahap 2 — Kompromi Kinetika & Katalis: Mengapa di pabrik nyata reaktor tetap dioperasikan pada suhu cukup tinggi (~450 °C) dan ditambahkan katalis serbuk Besi (Fe), bukannya pada suhu kamar 25 °C?", [["Karena pada 450 °C reaksi berubah menjadi endoterm", 0, "Analisis kembali konsep dan perhitungannya: Pada suhu rendah K_p memang besar tetapi laju reaksi nyaris nol karena ikatan rangkap tiga N#N memiliki E_a sangat tinggi. Suhu 450 °C + katalis Fe adalah kompromi optimum antara laju kinetika dan konversi kesetimbangan."], ["Karena katalis Fe memperbesar nilai K_p pada suhu tinggi", 0, "Analisis kembali konsep dan perhitungannya: Pada suhu rendah K_p memang besar tetapi laju reaksi nyaris nol karena ikatan rangkap tiga N#N memiliki E_a sangat tinggi. Suhu 450 °C + katalis Fe adalah kompromi optimum antara laju kinetika dan konversi kesetimbangan."], ["Karena pada suhu rendah laju reaksi terlalu lambat (energi aktivasi ikatan N#N sangat besar), sehingga dipilih suhu optimum 450 °C + katalis Fe agar laju cepat", 1, "Pada suhu rendah K_p memang besar tetapi laju reaksi nyaris nol karena ikatan rangkap tiga N#N memiliki E_a sangat tinggi. Suhu 450 °C + katalis Fe adalah kompromi optimum antara laju kinetika dan konversi kesetimbangan."], ["Karena gas N_2 membeku pada suhu 25 °C", 0, "Analisis kembali konsep dan perhitungannya: Pada suhu rendah K_p memang besar tetapi laju reaksi nyaris nol karena ikatan rangkap tiga N#N memiliki E_a sangat tinggi. Suhu 450 °C + katalis Fe adalah kompromi optimum antara laju kinetika dan konversi kesetimbangan."]]], ["Tahap 3 — Proteksi Katodik Pipa: Untuk melindungi pipa baja (E^0 Fe = -0,44 V) di air laut, insinyur memasang balok logam Magnesium (E^0 Mg = -2,37 V) yang dihubungkan dengan kabel ke pipa. Apa peran balok Mg tersebut?", [["Sebagai katoda yang mereduksi ion Fe^(2+)", 0, "Analisis kembali konsep dan perhitungannya: Karena E^0 Mg (-2,37 V) jauh lebih negatif daripada Fe (-0,44 V), Mg bertindak sebagai anoda (teroksidasi dan habis terkikis) dan menyuplai elektron ke pipa besi sehingga besi menjadi katoda yang terlindungi dari korosi."], ["Sebagai anoda tumbal (sacrificial anode) yang mengalami oksidasi lebih dulu karena E^0 Mg < E^0 Fe", 1, "Karena E^0 Mg (-2,37 V) jauh lebih negatif daripada Fe (-0,44 V), Mg bertindak sebagai anoda (teroksidasi dan habis terkikis) dan menyuplai elektron ke pipa besi sehingga besi menjadi katoda yang terlindungi dari korosi."], ["Sebagai isolator listrik agar elektron tidak mengalir", 0, "Analisis kembali konsep dan perhitungannya: Karena E^0 Mg (-2,37 V) jauh lebih negatif daripada Fe (-0,44 V), Mg bertindak sebagai anoda (teroksidasi dan habis terkikis) dan menyuplai elektron ke pipa besi sehingga besi menjadi katoda yang terlindungi dari korosi."], ["Sebagai katalis yang menguraikan garam air laut", 0, "Analisis kembali konsep dan perhitungannya: Karena E^0 Mg (-2,37 V) jauh lebih negatif daripada Fe (-0,44 V), Mg bertindak sebagai anoda (teroksidasi dan habis terkikis) dan menyuplai elektron ke pipa besi sehingga besi menjadi katoda yang terlindungi dari korosi."]]]], "k": "Misi Industri Tuntas! Kamu berhasil memadukan prinsip Le Chatelier, kinetika katalis pada reaktor Haber-Bosch, serta proteksi katodik elektrokimia untuk pipa bawah laut."}, {"e": "🔬", "t": "Forensik Botol Pelarut Tanpa Label di Laboratorium", "c": 3, "b": "Tiga botol cairan organik bening di laboratorium kimia organik kehilangan labelnya: Botol X, Botol Y, dan Botol Z. Ketiganya diketahui memiliki jumlah atom karbon yang sama (3 atom C), yaitu 2-propanol (CH_3-CH(OH)-CH_3), propanal (CH_3-CH_2-CHO), dan ⟦F:aseton¦propanon⟧ (CH_3-CO-CH_3).", "s": [["Tahap 1 — Uji Logam Natrium: Saat sepotong kecil logam Natrium (Na) dimasukkan ke masing-masing sampel kering, hanya Botol X yang mengeluarkan gelembung gas H_2 secara aktif, sedangkan Y dan Z tidak bereaksi. Tetapi saat X dan Y (atau Z) dianalisis rumus molekulnya, mengapa hanya X yang bereaksi dengan Na?", [["Karena X adalah propanal yang memiliki ikatan C=O", 0, "Analisis kembali konsep dan perhitungannya: Di antara alkohol, aldehida, dan keton, hanya alkohol (2-propanol, R-OH) yang bereaksi dengan logam Na membentuk natrium alkoksida dan gas H_2."], ["Karena X adalah 2-propanol (alkohol, C_3H_8O) yang memiliki hidrogen aktif pada gugus -OH", 1, "Di antara alkohol, aldehida, dan keton, hanya alkohol (2-propanol, R-OH) yang bereaksi dengan logam Na membentuk natrium alkoksida dan gas H_2."], ["Karena X adalah propanon (keton) yang bersifat asam kuat", 0, "Analisis kembali konsep dan perhitungannya: Di antara alkohol, aldehida, dan keton, hanya alkohol (2-propanol, R-OH) yang bereaksi dengan logam Na membentuk natrium alkoksida dan gas H_2."], ["Karena X mengandung air", 0, "Analisis kembali konsep dan perhitungannya: Di antara alkohol, aldehida, dan keton, hanya alkohol (2-propanol, R-OH) yang bereaksi dengan logam Na membentuk natrium alkoksida dan gas H_2."]]], ["Tahap 2 — Uji Cermin Perak (Tollens): Selanjutnya Botol Y dan Z diuji dengan pereaksi Tollens ([Ag(NH_3)_2]^(+)) dan dipanaskan dalam penangas air. Tabung Y menghasilkan lapisan cermin perak mengilap di dinding tabung, sedangkan Z tetap bening. Identifikasi Y dan Z adalah...", [["Y = propanon (keton), Z = propanal (aldehida)", 0, "Analisis kembali konsep dan perhitungannya: Aldehida (propanal) mereduksi ion Ag^(+) dalam pereaksi Tollens menjadi endapan cermin perak Ag(s), sedangkan keton (propanon (aseton)) tidak bereaksi."], ["Y = propanal (aldehida), Z = propanon (keton)", 1, "Aldehida (propanal) mereduksi ion Ag^(+) dalam pereaksi Tollens menjadi endapan cermin perak Ag(s), sedangkan keton (propanon (aseton)) tidak bereaksi."], ["Y = asam propanoat, Z = metil etanoat", 0, "Analisis kembali konsep dan perhitungannya: Aldehida (propanal) mereduksi ion Ag^(+) dalam pereaksi Tollens menjadi endapan cermin perak Ag(s), sedangkan keton (propanon (aseton)) tidak bereaksi."], ["Y = 1-propanol, Z = metoksi etana", 0, "Analisis kembali konsep dan perhitungannya: Aldehida (propanal) mereduksi ion Ag^(+) dalam pereaksi Tollens menjadi endapan cermin perak Ag(s), sedangkan keton (propanon (aseton)) tidak bereaksi."]]], ["Tahap 3 — Konfirmasi Reaksi Oksidasi: Jika isi Botol X (2-propanol) dioksidasi menggunakan larutan K_2Cr_2O_7 dalam suasana asam, senyawa organik apakah yang akan terbentuk?", [["Senyawa yang sama dengan isi Botol Y (propanal)", 0, "Analisis kembali konsep dan perhitungannya: 2-propanol adalah alkohol sekunder. Oksidasi alkohol sekunder menghasilkan keton, yaitu propanon (aseton) yang identik dengan isi Botol Z!"], ["Senyawa yang sama dengan isi Botol Z (propanon (aseton))", 1, "2-propanol adalah alkohol sekunder. Oksidasi alkohol sekunder menghasilkan keton, yaitu propanon (aseton) yang identik dengan isi Botol Z!"], ["Asam propanoat", 0, "Analisis kembali konsep dan perhitungannya: 2-propanol adalah alkohol sekunder. Oksidasi alkohol sekunder menghasilkan keton, yaitu propanon (aseton) yang identik dengan isi Botol Z!"], ["Propana", 0, "Analisis kembali konsep dan perhitungannya: 2-propanol adalah alkohol sekunder. Oksidasi alkohol sekunder menghasilkan keton, yaitu propanon (aseton) yang identik dengan isi Botol Z!"]]]], "k": "Investigasi Forensik Berhasil! Ketiga botol berhasil dilabeli kembali: Botol X = 2-propanol (positif uji Na), Botol Y = propanal (positif cermin perak Tollens), dan Botol Z = propanon (aseton)."}, {"e": "🔥", "t": "Audit Energi Kalorimeter Bom & Mesin Pembangkit", "c": 4, "b": "Sebuah laboratorium uji bahan bakar menguji nilai kalor биоdiesel menggunakan Kalorimeter Bom (volume tetap, isokhorik) sebelum digunakan pada mesin pembangkit termal yang bekerja di antara suhu ruang bakar 527 °C dan suhu pembuangan 127 °C.", "s": [["Tahap 1 — Kalorimetri Volume Tetap: Pembakaran sampel bahan bakar di dalam kalorimeter bom (yang berisi 2.000 g air, c_(air) = 4,2 ⟦F:J¦g·°C⟧, dan kapasitas kalor bom C_(bom) = 1.600 ⟦F:J¦°C⟧) menaikkan suhu sistem sebesar 5 °C. Berapakah total kalor yang dilepaskan oleh pembakaran sampel tersebut?", [["42 kJ", 0, "Analisis kembali konsep dan perhitungannya: q_(total) = q_(air) + q_(bom) = (m c Delta T) + (C_(bom) Delta T) = (2.000 × 4,2 × 5) + (1.600 × 5) = 42.000 J + 8.000 J = 50.000 J = 50 kJ."], ["50 kJ", 1, "q_(total) = q_(air) + q_(bom) = (m c Delta T) + (C_(bom) Delta T) = (2.000 × 4,2 × 5) + (1.600 × 5) = 42.000 J + 8.000 J = 50.000 J = 50 kJ."], ["8 kJ", 0, "Analisis kembali konsep dan perhitungannya: q_(total) = q_(air) + q_(bom) = (m c Delta T) + (C_(bom) Delta T) = (2.000 × 4,2 × 5) + (1.600 × 5) = 42.000 J + 8.000 J = 50.000 J = 50 kJ."], ["34 kJ", 0, "Analisis kembali konsep dan perhitungannya: q_(total) = q_(air) + q_(bom) = (m c Delta T) + (C_(bom) Delta T) = (2.000 × 4,2 × 5) + (1.600 × 5) = 42.000 J + 8.000 J = 50.000 J = 50 kJ."]]], ["Tahap 2 — Analisis Hukum I Termo pada Bom: Karena kalorimeter bom tertutup rapat dan berdinding baja kaku sehingga volumenya tetap (proses isokhorik, Delta V = 0), maka kalor sebesar 50 kJ yang terukur tersebut secara langsung menyatakan nilai perubahan...", [["Usaha luar sistem (W)", 0, "Analisis kembali konsep dan perhitungannya: Pada proses isokhorik (Delta V = 0), kerja ekspansi W = P Delta V = 0. Sesuai Hukum I Termodinamika (Delta U = Q - W), kalor pada volume tetap q_V sama dengan perubahan Energi Dalam (Delta U)."], ["Energi dalam sistem (|Delta U|), karena pada V tetap berlaku W = 0", 1, "Pada proses isokhorik (Delta V = 0), kerja ekspansi W = P Delta V = 0. Sesuai Hukum I Termodinamika (Delta U = Q - W), kalor pada volume tetap q_V sama dengan perubahan Energi Dalam (Delta U)."], ["Kapasitas kalor jenis gas", 0, "Analisis kembali konsep dan perhitungannya: Pada proses isokhorik (Delta V = 0), kerja ekspansi W = P Delta V = 0. Sesuai Hukum I Termodinamika (Delta U = Q - W), kalor pada volume tetap q_V sama dengan perubahan Energi Dalam (Delta U)."], ["Tekanan osmotik gas buang", 0, "Analisis kembali konsep dan perhitungannya: Pada proses isokhorik (Delta V = 0), kerja ekspansi W = P Delta V = 0. Sesuai Hukum I Termodinamika (Delta U = Q - W), kalor pada volume tetap q_V sama dengan perubahan Energi Dalam (Delta U)."]]], ["Tahap 3 — Batas Efisiensi Carnot: Jika kalor pembakaran tersebut digunakan untuk menggerakkan mesin kalor ideal (Carnot) yang bekerja antara T_1 = 527 °C dan T_2 = 127 °C, berapakah efisiensi maksimum teoritis mesin dan usaha maksimum dari 50 kJ kalor tersebut?", [["Efisiensi 50% dan usaha maksimum 25 kJ", 1, "Ubah suhu ke Kelvin: T_1 = 527 + 273 = 800 K; T_2 = 127 + 273 = 400 K. Efisiensi Carnot eta = 1 - (⟦F:400¦800⟧) = 0,50 (50%). Usaha maksimum W = 50% × 50 kJ = 25 kJ."], ["Efisiensi 76% dan usaha maksimum 38 kJ", 0, "Analisis kembali konsep dan perhitungannya: Ubah suhu ke Kelvin: T_1 = 527 + 273 = 800 K; T_2 = 127 + 273 = 400 K. Efisiensi Carnot eta = 1 - (⟦F:400¦800⟧) = 0,50 (50%). Usaha maksimum W = 50% × 50 kJ = 25 kJ."], ["Efisiensi 40% dan usaha maksimum 20 kJ", 0, "Analisis kembali konsep dan perhitungannya: Ubah suhu ke Kelvin: T_1 = 527 + 273 = 800 K; T_2 = 127 + 273 = 400 K. Efisiensi Carnot eta = 1 - (⟦F:400¦800⟧) = 0,50 (50%). Usaha maksimum W = 50% × 50 kJ = 25 kJ."], ["Efisiensi 100% dan usaha maksimum 50 kJ", 0, "Analisis kembali konsep dan perhitungannya: Ubah suhu ke Kelvin: T_1 = 527 + 273 = 800 K; T_2 = 127 + 273 = 400 K. Efisiensi Carnot eta = 1 - (⟦F:400¦800⟧) = 0,50 (50%). Usaha maksimum W = 50% × 50 kJ = 25 kJ."]]]], "k": "Audit Energi Selesai! Kamu berhasil menghitung kalor total kalorimeter bom (air + bom = 50 kJ), mengaitkannya dengan Hukum I Termodinamika isokhorik, dan menentukan batas efisiensi Carnot 50%."}, {"e": "☢️", "t": "Misi Radiomedis Iodin-131 & Pengolahan Air Sadah RS", "c": 5, "b": "Instalasi Kedokteran Nuklir sebuah rumah sakit menerima kiriman kapsul radioisotop Natrium Iodida (Na^(131)I) dengan aktivitas awal 80 mCi untuk terapi pasien hipertiroid. Waktu paruh ^(131)_(53)I diketahui adalah 8 hari. Di sisi lain, ketel uap sterilisasi rumah sakit mengalami masalah kerak kapur akibat kesadahan tetap air tanah.", "s": [["Tahap 1 — Persamaan Peluruhan Inti: Isotop ^(131)_(53)I terletak di atas pita kestabilan (kelebihan neutron) dan meluruh menjadi Xenon stabil ^(131)_(54)Xe. Partikel apakah yang dipancarkan oleh inti ^(131)_(53)I dalam terapi tiroid tersebut?", [["Partikel alfa (^(4)_(2)He)", 0, "Analisis kembali konsep dan perhitungannya: Reaksi inti: ^(131)_(53)I -> ^(131)_(54)Xe + ^(0)_(-1)e. Nomor massa tetap 131 dan nomor atom bertambah 1 (dari 53 menjadi 54), yang berarti memancarkan partikel beta negatif (^(0)_(-1)e)."], ["Partikel beta negatif (elektron) (^(0)_(-1)e)", 1, "Reaksi inti: ^(131)_(53)I -> ^(131)_(54)Xe + ^(0)_(-1)e. Nomor massa tetap 131 dan nomor atom bertambah 1 (dari 53 menjadi 54), yang berarti memancarkan partikel beta negatif (^(0)_(-1)e)."], ["Partikel positron (^(0)_(+1)e)", 0, "Analisis kembali konsep dan perhitungannya: Reaksi inti: ^(131)_(53)I -> ^(131)_(54)Xe + ^(0)_(-1)e. Nomor massa tetap 131 dan nomor atom bertambah 1 (dari 53 menjadi 54), yang berarti memancarkan partikel beta negatif (^(0)_(-1)e)."], ["Partikel neutron (^(1)_(0)n)", 0, "Analisis kembali konsep dan perhitungannya: Reaksi inti: ^(131)_(53)I -> ^(131)_(54)Xe + ^(0)_(-1)e. Nomor massa tetap 131 dan nomor atom bertambah 1 (dari 53 menjadi 54), yang berarti memancarkan partikel beta negatif (^(0)_(-1)e)."]]], ["Tahap 2 — Perhitungan Dosis Waktu Paruh: Jika kapsul ^(131)I (t_(⟦F:1¦2⟧) = 8 hari) dengan aktivitas awal 80 mCi tersebut baru diberikan kepada pasien setelah disimpan selama 24 hari, berapakah aktivitas radioaktif yang TERSISA saat diberikan?", [["40 mCi", 0, "Analisis kembali konsep dan perhitungannya: Jumlah waktu paruh n = 24 ⟦F:hari¦8⟧ hari = 3 kali waktu paruh. Aktivitas tersisa A_t = 80 mCi × (⟦F:1¦2⟧)^3 = ⟦F:80¦8⟧ = 10 mCi."], ["20 mCi", 0, "Analisis kembali konsep dan perhitungannya: Jumlah waktu paruh n = 24 ⟦F:hari¦8⟧ hari = 3 kali waktu paruh. Aktivitas tersisa A_t = 80 mCi × (⟦F:1¦2⟧)^3 = ⟦F:80¦8⟧ = 10 mCi."], ["10 mCi", 1, "Jumlah waktu paruh n = 24 ⟦F:hari¦8⟧ hari = 3 kali waktu paruh. Aktivitas tersisa A_t = 80 mCi × (⟦F:1¦2⟧)^3 = ⟦F:80¦8⟧ = 10 mCi."], ["5 mCi", 0, "Analisis kembali konsep dan perhitungannya: Jumlah waktu paruh n = 24 ⟦F:hari¦8⟧ hari = 3 kali waktu paruh. Aktivitas tersisa A_t = 80 mCi × (⟦F:1¦2⟧)^3 = ⟦F:80¦8⟧ = 10 mCi."]]], ["Tahap 3 — Pelunakan Air Ketel Uap: Air tanah rumah sakit mengandung CaSO_4 dan MgCl_2 (kesadahan tetap) yang tidak hilang saat direbus. Bahan kimia apakah yang harus ditambahkan ke instalasi pengolahan air untuk mengendapkan ion Ca^(2+) dan Mg^(2+)?", [["Garam dapur (NaCl)", 0, "Analisis kembali konsep dan perhitungannya: Kesadahan tetap (CaSO_4 atau MgCl_2) dihilangkan dengan menambahkan soda abu (Na_2CO_3) sehingga ion Ca^(2+) dan Mg^(2+) mengendap sebagai CaCO_3(s) dan MgCO_3(s)."], ["Soda abu (Natrium karbonat) (Na_2CO_3)", 1, "Kesadahan tetap (CaSO_4 atau MgCl_2) dihilangkan dengan menambahkan soda abu (Na_2CO_3) sehingga ion Ca^(2+) dan Mg^(2+) mengendap sebagai CaCO_3(s) dan MgCO_3(s)."], ["Asam klorida (HCl)", 0, "Analisis kembali konsep dan perhitungannya: Kesadahan tetap (CaSO_4 atau MgCl_2) dihilangkan dengan menambahkan soda abu (Na_2CO_3) sehingga ion Ca^(2+) dan Mg^(2+) mengendap sebagai CaCO_3(s) dan MgCO_3(s)."], ["Kalsium klorida (CaCl_2)", 0, "Analisis kembali konsep dan perhitungannya: Kesadahan tetap (CaSO_4 atau MgCl_2) dihilangkan dengan menambahkan soda abu (Na_2CO_3) sehingga ion Ca^(2+) dan Mg^(2+) mengendap sebagai CaCO_3(s) dan MgCO_3(s)."]]]], "k": "Misi Rumah Sakit Berhasil! Kamu telah memverifikasi peluruhan beta I-131, menghitung sisa dosis aktivitas 10 mCi setelah 24 hari, serta merancang solusi pelunakan air sadah tetap menggunakan Na_2CO_3."}];
const TREE=[{"e": "🌳", "t": "Stoikiometri Pereaksi Pembatas & Gas", "c": 0, "b": "Sebanyak 5,4 gram logam Aluminium (Ar Al = 27) direaksikan dengan 500 mL larutan HCl 1,0 M menurut reaksi belum setara: Al(s) + HCl(aq) -> AlCl_3(aq) + H_2(g). Hitunglah volume gas H_2 yang terbentuk pada keadaan STP (0 °C, 1 atm)!", "s": [["Langkah 1: Apa langkah pertama yang WAJIB dilakukan sebelum menghitung mol reaksi dan pereaksi pembatas?", [["Menyetarakan persamaan reaksi menjadi 2Al + 6HCl -> 2AlCl_3 + 3H_2 dan mengubah massa Al serta volume HCl menjadi satuan mol", 1, "Tepat! Tanpa koefisien reaksi yang setara (2 : 6 : 2 : 3), perbandingan mol tidak bisa dihitung. Mol awal: n(Al) = ⟦F:5,4¦27⟧ = 0,20 mol; n(HCl) = 0,5 L × 1,0 M = 0,50 mol."], ["Langsung membandingkan massa Al (5,4 g) dengan volume HCl (500 mL)", 0, "Keliru! Massa (gram) dan volume larutan (mL) tidak boleh dibandingkan langsung; keduanya wajib diubah ke satuan mol dan dibagi koefisien reaksi yang sudah setara."], ["Membagi volume larutan HCl 0,5 L dengan 22,4 ⟦F:L¦mol⟧", 0, "Jebakan klasik! Rumus n = ⟦F:V¦22,4⟧ ⟦F:L¦mol⟧ hanya berlaku untuk wujud GAS pada STP, sedangkan HCl(aq) adalah larutan (gunakan n = M × V)!"]]], ["Langkah 2: Diketahui n(Al) = 0,20 mol (koefisien 2) dan n(HCl) = 0,50 mol (koefisien 6). Manakah yang bertindak sebagai Pereaksi Pembatas?", [["Al, karena mol mula-mulanya (0,20 mol) lebih kecil daripada HCl (0,50 mol)", 0, "Hati-hati! Jangan melihat mol awal terkecil saja. Uji dulu hasil bagi mol per koefisien: Al = ⟦F:0,20¦2⟧ = 0,10, sedangkan HCl = ⟦F:0,50¦6⟧ = 0,083!"], ["HCl, karena hasil bagi mol terhadap koefisiennya (⟦F:0,50¦6⟧ = 0,083) lebih kecil daripada Al (⟦F:0,20¦2⟧ = 0,10)", 1, "Benar sekali! Meskipun mol awal HCl lebih besar (0,50 mol), setiap 2 mol Al menghabiskan 6 mol HCl sehingga HCl habis lebih dulu (⟦F:0,50¦6⟧ < ⟦F:0,20¦2⟧)."], ["Keduanya habis bereaksi secara bersamaan", 0, "Belum tepat! Agar keduanya habis bersamaan, untuk 0,20 mol Al dibutuhkan 3 × 0,20 = 0,60 mol HCl, padahal HCl hanya tersedia 0,50 mol."]]], ["Langkah 3: Dengan HCl (0,50 mol, koefisien 6) sebagai pereaksi pembatas, berapakah mol dan volume gas H_2 (koefisien 3) pada STP?", [["n(H_2) = (⟦F:3¦6⟧) × 0,50 = 0,25 mol -> V_(STP) = 0,25 × 22,4 L = 5,60 liter", 1, "Sempurna! Mol H_2 dihitung dari koefisien H_2 per koefisien pembatas HCl: (⟦F:3¦6⟧) × 0,50 = 0,25 mol, sehingga volumenya pada STP adalah 0,25 × 22,4 = 5,60 L."], ["n(H_2) = (⟦F:3¦2⟧) × 0,20 = 0,30 mol -> V_(STP) = 0,30 × 22,4 L = 6,72 liter", 0, "Keliru! Kamu menggunakan mol Al (pereaksi sisa) sebagai patokan, padahal jumlah produk wajib dihitung dari mol Pereaksi Pembatas (HCl)."]]]], "k": "Kesimpulan Pohon Logika: Setarakan reaksi (2Al + 6HCl -> 2AlCl_3 + 3H_2) -> Uji ⟦F:n¦koefisien⟧ (HCl pembatas = ⟦F:0,50¦6⟧) -> Hitung n(H_2) = (⟦F:3¦6⟧)×0,50 = 0,25 mol -> Volume STP = 5,60 liter."}, {"e": "🌳", "t": "Peta Keputusan pH Campuran Asam-Basa", "c": 1, "b": "Sebanyak 100 mL larutan asam format HCOOH 0,2 M (K_a = 2 × 10^(-4)) direaksikan dengan 100 mL larutan NaOH 0,2 M. Tentukan jalur metode yang tepat dan hitunglah pH larutan akhir! (Diketahui K_w = 10^(-14) dan log 5 = 0,7)", "s": [["Langkah 1: Hitung mol mula-mula kedua pereaksi (n_(HCOOH) = 20 mmol, n_(NaOH) = 20 mmol) dan tentukan jenis sistem larutan pada akhir reaksi!", [["Larutan Penyangga (Buffer) Asam, karena melibatkan asam lemah HCOOH", 0, "Kurang tepat! Buffer asam hanya terbentuk jika pada akhir reaksi asam lemah HCOOH MASIH BERSISA. Di sini 20 mmol HCOOH dan 20 mmol NaOH tepat habis bereaksi!"], ["Hidrolisis Garam Parsial ( bersifat Basa), karena Asam Lemah (20 mmol) dan Basa Kuat (20 mmol) tepat habis bereaksi menyisakan 20 mmol garam HCOONa", 1, "Tepat sekali! Ketika asam lemah dan basa kuat tepat habis bereaksi (ekivalen), sistem yang terbentuk adalah Hidrolisis Garam HCOONa yang bersifat BASA (karena NaOH kuat menang)."], ["Larutan Netral (pH = 7), karena mol asam sama dengan mol basa", 0, "Jebakan! Mol asam = mol basa hanya menghasilkan pH = 7 jika KEDUANYA KUAT (misal HCl + NaOH). Untuk Asam Lemah + Basa Kuat, titik ekivalen berada pada pH > 7!"]]], ["Langkah 2: Berapakah konsentrasi molar garam [HCOONa] di dalam campuran akhir?", [["[HCOONa] = 20 ⟦F:mmol¦100⟧ mL = 0,2 M", 0, "Jebakan volume! Setelah 100 mL larutan asam dan 100 mL larutan basa dicampurkan, volume total larutan menjadi 100 + 100 = 200 mL!"], ["[HCOONa] = 20 ⟦F:mmol¦100 + 100⟧ mL = ⟦F:20¦200⟧ = 0,1 M (10^(-1) M)", 1, "Benar! Selalu bagi mmol garam yang terbentuk dengan VOLUME TOTAL campuran (200 mL), sehingga [HCOO^(-)] = 0,1 M."]]], ["Langkah 3: Gunakan rumus hidrolisis garam basa untuk menghitung [OH^(-)] dan pH akhir larutan!", [["[OH^(-)] = sqrt((⟦F:K_w¦K_a⟧) × [HCOO^(-)]) = sqrt((⟦F:10^(-14)¦2×10^(-4)⟧) × 10^(-1)) = 5 × 10^(-6) M -> pOH = 6 - log 5 = 5,3 -> pH = 8,7", 1, "Luar biasa! Di dalam akar: ⟦F:10^(-15)¦2 × 10^(-4)⟧ = 0,5 × 10^(-11) = 50 × 10^(-12) (atau 25 × 10^(-12) -> akar = 5 × 10^(-6) M). Maka pOH = 6 - log 5 = 5,3 dan pH = 14 - 5,3 = 8,7!"], ["[H^(+)] = sqrt((⟦F:K_w¦K_a⟧) × [HCOO^(-)]) = 5 × 10^(-6) M -> pH = 6 - log 5 = 5,3", 0, "Terbalik! Garam HCOONa bersifat BASA, sehingga hasil perhitungan akar sqrt((⟦F:K_w¦K_a⟧)×M) adalah konsentrasi [OH^(-)], bukan [H^(+)]!"]]]], "k": "Kesimpulan Pohon Logika: Asam Lemah + Basa Kuat tepat habis (20 mmol) -> Hidrolisis Garam Basa -> Bagi volume total 200 mL ([G] = 0,1 M) -> [OH^(-)] = 5×10^(-6) M -> pH = 8,7."}, {"e": "🌳", "t": "Kompetisi Reaksi Katoda & Anoda Elektrolisis", "c": 2, "b": "Larutan Natrium Sulfat (Na_2SO_4) dielektrolisis menggunakan sepasang elektroda Platina (Pt). Tentukan reaksi yang terjadi di Katoda dan Anoda, serta perbandingan volume gas yang dihasilkan!", "s": [["Langkah 1: Analisis spesi di sekitar Katoda (kutub negatif, tempat Reduksi). Terdapat kation Na^(+) dan molekul pelarut air (H_2O). Manakah yang mengalami reduksi di katoda?", [["Ion Na^(+) tereduksi menjadi logam Na(s)", 0, "Keliru! Dalam larutan berair (aq), kation logam aktif Golongan IA (seperti Na^(+)), IIA, Al^(3+), dan Mn^(2+) memiliki E^0 lebih negatif daripada air sehingga TIDAK tereduksi!"], ["Molekul air (H_2O) yang tereduksi menghasilkan gas H_2 dan ion OH^(-): 2H_2O(l) + 2e^(-) -> H_2(g) + 2OH^(-)(aq)", 1, "Tepat! Karena Na^(+) adalah kation golongan IA dalam larutan berair, maka air yang menang kompetisi reduksi di katoda menghasilkan gas H_2 dan suasana basa (OH^(-))."]]], ["Langkah 2: Analisis spesi di sekitar Anoda (kutub positif, tempat Oksidasi). Elektroda yang dipakai adalah Platina (Pt, inert) dan terdapat anion sisa asam oksi SO_4^(2-) serta H_2O. Manakah yang teroksidasi?", [["Molekul air (H_2O) yang teroksidasi menghasilkan gas O_2 dan ion H^(+): 2H_2O(l) -> O_2(g) + 4H^(+)(aq) + 4e^(-)", 1, "Benar! Elektroda Pt bersifat inert (tidak ikut teroksidasi) dan anion SO_4^(2-) adalah sisa asam oksi yang punya biloks S maksimum (+6), sehingga air yang teroksidasi menghasilkan gas O_2."], ["Elektroda Platina (Pt) larut membentuk ion Pt^(2+)", 0, "Keliru! Platina (Pt), Karbon (Grafit) (C), dan Emas (Au) adalah elektroda INERT yang tidak ikut teroksidasi di anoda."], ["Ion SO_4^(2-) teroksidasi menjadi gas SO_2", 0, "Salah! Mengubah SO_4^(2-) menjadi SO_2 adalah reduksi (biloks S turun dari +6 ke +4), dan di anoda sisa asam oksi tidak teroksidasi dalam larutan berair."]]], ["Langkah 3: Untuk jumlah muatan listrik (mol elektron) yang sama, berapakah perbandingan volume gas H_2 di katoda terhadap gas O_2 di anoda pada P dan T yang sama?", [["V(H_2) : V(O_2) = 1 : 1", 0, "Perhatikan jumlah elektronnya! Pembentukan 1 mol H_2 hanya butuh 2 mol elektron, sedangkan pembentukan 1 mol O_2 butuh 4 mol elektron."], ["V(H_2) : V(O_2) = 2 : 1 (setara dengan elektrolisis air 2H_2O -> 2H_2 + O_2)", 1, "Sempurna! Ketika elektron disetarakan (sama-sama 4e^(-)), dihasilkan 2 mol H_2 di katoda untuk setiap 1 mol O_2 di anoda, sehingga rasio volumenya 2 : 1."]]]], "k": "Kesimpulan Pohon Logika: Elektrolisis larutan Na_2SO_4 dengan elektroda Pt inert mereduksi H_2O di katoda (gas H_2) dan mengoksidasi H_2O di anoda (gas O_2) dengan rasio volume H_2 : O_2 = 2 : 1."}, {"e": "🌳", "t": "Elusidasi Struktur Senyawa C_3H_6O_2", "c": 3, "b": "Suatu senyawa organik X memiliki rumus molekul C_3H_6O_2. Ketika X dipanaskan dengan air dalam suasana asam (hidrolisis), dihasilkan dua senyawa Y dan Z. Senyawa Y dapat memerahkan lakmus biru, sedangkan senyawa Z (memiliki 2 atom C) jika dioksidasi sempurna menghasilkan senyawa yang sama dengan... bukan Y, melainkan asam etanoat! Tentukan identitas senyawa X!", "s": [["Langkah 1: Berdasarkan rumus molekul C_3H_6O_2 (C_nH_(2n)O_2) dan fakta bahwa X dapat dihidrolisis menjadi dua senyawa (Y dan Z), termasuk golongan gugus fungsi apakah senyawa X?", [["Asam Karboksilat (Asam Propanoat)", 0, "Kurang tepat! Asam karboksilat tidak mengalami hidrolisis menjadi dua senyawa organik yang lebih kecil."], ["Ester (Alkil Alkanoat, R-COO-R'), karena berumus C_nH_(2n)O_2 dan terhidrolisis menghasilkan Asam Karboksilat (Y) + Alkohol (Z)", 1, "Tepat! Ester (R-COO-R') memiliki rumus C_nH_(2n)O_2 dan jika dihidrolisis menghasilkan asam karboksilat (Y, memerahkan lakmus biru) dan alkohol (Z)."], ["Keton (Propanon)", 0, "Keliru! Keton hanya memiliki 1 atom Oksigen (C_nH_(2n)O), sedangkan rumus di soal adalah C_3H_6O_2 (2 atom Oksigen)."]]], ["Langkah 2: Diketahui alkohol Z memiliki 2 atom C dan total atom C pada ester X adalah 3 atom C. Tentukan identitas alkohol Z dan asam karboksilat Y!", [["Z adalah etanol (C_2H_5OH, 2 atom C) dan Y adalah asam metanoat (asam format) (HCOOH, 1 atom C)", 1, "Benar sekali! Karena total atom C pada ester X adalah 3 dan alkohol Z mengambil 2 atom C (etanol, C_2H_5OH), maka asam karboksilat Y pasti memiliki 3 - 2 = 1 atom C, yaitu asam metanoat (HCOOH)!"], ["Z adalah metanol (CH_3OH, 1 atom C) dan Y adalah asam etanoat (CH_3COOH, 2 atom C)", 0, "Perhatikan petunjuk soal! Soal menyebutkan senyawa alkohol Z memiliki 2 atom C (dan jika Z dioksidasi menghasilkan asam etanoat 2 atom C), jadi Z adalah etanol!"]]], ["Langkah 3: Gabungkan asam metanoat (HCOOH) dan etanol (C_2H_5OH) untuk menentukan struktur dan nama IUPAC senyawa ester X!", [["CH_3-COO-CH_3 (Metil etanoat)", 0, "Terbalik! Metil etanoat berasal dari asam etanoat (2 C) dan metanol (1 C)."], ["H-COO-CH_2-CH_3 (Etil metanoat (Etil format))", 1, "Sempurna! Ester dari asam metanoat (H-COO-) dan gugus alkil dari etanol (-C_2H_5) adalah H-COO-C_2H_5 yang bernama IUPAC etil metanoat!"]]]], "k": "Kesimpulan Pohon Logika: Rumus C_3H_6O_2 yang dapat dihidrolisis -> Ester -> Alkohol Z (2 atom C = etanol) + Asam Y (1 atom C = asam metanoat) -> Senyawa X adalah Etil Metanoat (HCOOC_2H_5)."}, {"e": "🌳", "t": "Menentukan Delta H Reaksi dari Energi Ikatan vs Delta H_f^0", "c": 4, "b": "Kita ingin menghitung perubahan entalpi (Delta H) reaksi hidrogenasi etena menjadi etana: CH_2=CH_2(g) + H_2(g) -> CH_3-CH_3(g) menggunakan tabel data Energi Ikatan Rata-rata (C=C = 614, C-C = 348, C-H = 413, H-H = 436 ⟦F:kJ¦mol⟧).", "s": [["Langkah 1: Rumus manakah yang harus dipilih ketika data yang diketahui di soal adalah tabel ENERGI IKATAN rata-rata?", [["Delta H = Sigma Energi Ikatan Produk (Kanan) - Sigma Energi Ikatan Reaktan (Kiri)", 0, "Terbalik! Rumus Kanan - Kiri adalah rumus untuk data Entalpi Pembentukan Standar (Delta H_f^0). Untuk Energi Ikatan, pemutusan di kiri bersifat endoterm (+) dan pembentukan di kanan eksoterm (-)!"], ["Delta H = Sigma Energi Ikatan Putus (Reaktan) (Kiri) - Sigma Energi Ikatan Terbentuk (Produk) (Kanan)", 1, "Tepat! Untuk Energi Ikatan, selalu gunakan KIRI (Putus) dikurangi KANAN (Terbentuk)!"]]], ["Langkah 2: Gambarkan struktur Lewis dan hitung jumlah serta jenis ikatan di ruas Kiri (CH_2=CH_2 + H_2) dan ruas Kanan (CH_3-CH_3)!", [["Kiri: 1 ikatan C=C, 4 ikatan C-H, dan 1 ikatan H-H ; Kanan: 1 ikatan C-C dan 6 ikatan C-H", 1, "Benar! Setelah mencoret 4 ikatan C-H yang sama di kiri dan kanan, di kiri tersisa (1 C=C + 1 H-H) dan di kanan tersisa (1 C-C + 2 C-H)."], ["Kiri: 2 ikatan C=C, 2 ikatan C-H, dan 1 ikatan H-H ; Kanan: 2 ikatan C-C dan 3 ikatan C-H", 0, "Hati-hati menghitung jumlah ikatan! Dalam 1 molekul etena (H_2C=CH_2) hanya ada 1 ikatan rangkap C=C dan 4 ikatan C-H; dalam etana (H_3C-CH_3) ada 1 ikatan tunggal C-C dan 6 ikatan C-H."]]], ["Langkah 3: Hitung nilai akhir Delta H reaksi hidrogenasi etena tersebut!", [["Delta H = (614 + 436) - (348 + 2 × 413) = 1.050 - 1.174 = -124 ⟦F:kJ¦mol⟧", 1, "Sempurna! Energi putus bersih (C=C + H-H) = 614 + 436 = 1.050 kJ, dikurangi energi terbentuk bersih (C-C + 2 C-H) = 348 + 826 = 1.174 kJ, menghasilkan Delta H = -124 ⟦F:kJ¦mol⟧ (eksoterm)."], ["Delta H = 1.174 - 1.050 = +124 ⟦F:kJ¦mol⟧", 0, "Salah tanda karena mengurangkan Kanan - Kiri! Reaksi adisi hidrogen pada alkena melepaskan kalor (eksoterm, -124 ⟦F:kJ¦mol⟧)."]]]], "k": "Kesimpulan Pohon Logika: Data Energi Ikatan -> Gunakan Rumus Kiri (Putus) - Kanan (Terbentuk) -> Coret 4 ikatan C-H yang sama -> Delta H = (614 + 436) - (348 + 2×413) = -124 ⟦F:kJ¦mol⟧."}, {"e": "🌳", "t": "Menentukan Rumus Struktur Senyawa Kompleks (Teori Werner)", "c": 5, "b": "Suatu senyawa koordinasi memiliki rumus empiris CoCl_3.5NH_3 dengan bilangan koordinasi Kobalt (Co) adalah 6. Ketika 0,1 mol senyawa ini dilarutkan dalam air dan ditambahkan larutan AgNO_3 berlebih, terbentuk 0,2 mol endapan putih AgCl. Tentukan rumus struktur koordinasi dan jumlah total ion per molekul dalam larutan!", "s": [["Langkah 1: Apa makna dari fakta bahwa 0,1 mol senyawa kompleks menghasilkan 0,2 mol endapan AgCl (rasio 1 : 2)?", [["Terdapat 2 ion Cl^(-) bebas di LUAR kurung siku koordinasi (sebagai ion penyeimbang), sedangkan 1 ion Cl^(-) sisanya terikat di DALAM kurung siku sebagai ligan", 1, "Tepat sekali! Hanya ion Cl^(-) di luar bola koordinasi [...] yang terionisasi bebas di air dan mengendap dengan Ag^(+). Rasio 1 : 2 membuktikan ada 2 ion Cl^(-) di luar kurung siku."], ["Ketiga ion Cl^(-) berada di dalam kurung siku koordinasi", 0, "Jika ketiga Cl^(-) berada di dalam kurung siku (sebagai ligan), tidak akan ada endapan AgCl sama sekali saat ditambah AgNO_3!"]]], ["Langkah 2: Mengingat bilangan koordinasi Co adalah 6 (wajib mengikat 6 ligan di dalam kurung siku) dan ada 1 ligan Cl^(-) di dalam kurung siku, bagaimanakah rumus struktur senyawa kompleks tersebut?", [["[Co(NH_3)_5Cl]Cl_2", 1, "Benar! Di dalam kurung siku terdapat 5 ligan NH_3 + 1 ligan Cl^(-) = 6 ligan (sesuai bilangan koordinasi 6), dan di luar kurung siku terdapat 2 ion Cl^(-) bebas."], ["[Co(NH_3)_4Cl_2]Cl.NH_3", 0, "Keliru! Rumus tersebut hanya akan menghasilkan 1 mol endapan AgCl per mol kompleks."]]], ["Langkah 3: Ketika 1 rumus [Co(NH_3)_5Cl]Cl_2 dilarutkan dalam air, terurai menjadi berapa ion total (faktor van't Hoff i jika alpha = 1)?", [["Terurai menjadi 3 ion: 1 kation kompleks [Co(NH_3)_5Cl]^(2+) dan 2 anion Cl^(-)", 1, "Sempurna! [Co(NH_3)_5Cl]Cl_2(aq) -> [Co(NH_3)_5Cl]^(2+)(aq) + 2Cl^(-)(aq), menghasilkan total 3 ion per satuan rumus!"], ["Terurai menjadi 9 ion karena semua NH_3 dan Cl lepas", 0, "Salah! Ligan di dalam kurung siku koordinasi [Co(NH_3)_5Cl]^(2+) terikat secara kovalen koordinasi dan tetap utuh sebagai satu kesatuan ion kompleks dalam larutan."]]]], "k": "Kesimpulan Pohon Logika: Rasio kompleks : AgCl = 1 : 2 -> 2 ion Cl^(-) di luar kurung siku -> Bilangan koordinasi 6 -> Rumus [Co(NH_3)_5Cl]Cl_2 (menghasilkan 3 ion dalam larutan)."}];
const HT=[{"id": "h1", "c": 0, "t": "Campuran Dua Logam dalam Asam", "q": "Sebanyak 6,0 gram paduan logam (alloy) yang hanya terdiri atas Magnesium (Ar Mg = 24) dan Tembaga (Ar Cu = 63,5) dilarutkan ke dalam larutan HCl berlebih. Setelah reaksi berhenti, ternyata masih tersisa padatan logam yang tidak larut dan dihasilkan 3,36 liter gas H_2 pada keadaan standar (STP). Berapakah persentase massa Tembaga (Cu) di dalam paduan logam tersebut?", "o": ["20%", "40%", "60%", "80%"], "a": 1, "e": "Jebakan konsep: Tembaga (Cu, E^0 = +0,34 V > 0) adalah logam mulia di sebelah kanan H pada deret Volta sehingga TIDAK BEREAKSI dengan larutan HCl encer! Seluruh gas H_2 (3,36 ⟦F:L¦22,4⟧ = 0,15 mol) murni berasal dari reaksi Mg(s) + 2HCl(aq) -> MgCl_2(aq) + H_2(g). Maka mol Mg = mol H_2 = 0,15 mol -> massa Mg = 0,15 × 24 = 3,6 gram. Massa Cu (padatan sisa) = 6,0 - 3,6 = 2,4 gram. Persentase massa Cu = (⟦F:2,4¦6,0⟧) × 100% = 40%."}, {"id": "h2", "c": 1, "t": "Jebakan Asam Diprotik vs Basa Lemah", "q": "Sebanyak 100 mL larutan NH_3 0,4 M (K_b = 10^(-5)) dicampurkan dengan 100 mL larutan H_2SO_4 0,1 M. Berapakah pH larutan yang terbentuk setelah pencampuran? (Diketahui log 2 = 0,3)", "o": ["5,0", "8,7", "9,0", "9,3"], "a": 2, "e": "Jebakan koefisien: 1 mol H_2SO_4 menetralkan 2 mol NH_3 menurut reaksi: 2NH_3 + H_2SO_4 -> (NH_4)_2SO_4. Mol mula-mula: n(NH_3) = 40 mmol dan n(H_2SO_4) = 10 mmol. Sebanyak 10 mmol H_2SO_4 menghabiskan 2 × 10 = 20 mmol NH_3 dan menghasilkan 10 mmol garam (NH_4)_2SO_4. Sisa NH_3 = 40 - 20 = 20 mmol. Jebakan kedua: dalam 10 mmol (NH_4)_2SO_4 terdapat 2 × 10 = 20 mmol ion asam konjugasi NH_4^(+)! Maka [OH^(-)] = K_b × (n⟦F:NH_3¦n⟧(NH_4^(+))) = 10^(-5) × (⟦F:20¦20⟧) = 10^(-5) M -> pOH = 5 -> pH = 14 - 5 = 9,0!"}, {"id": "h3", "c": 2, "t": "Elektrolisis Seri & Perubahan pH Larutan", "q": "Dua sel elektrolisis disusun secara SERI dengan elektroda Pt inert. Sel I berisi 500 mL larutan AgNO_3 0,2 M dan Sel II berisi larutan CuSO_4. Setelah arus listrik dialirkan beberapa saat, di katoda Sel II mengendap 0,635 gram tembaga (Ar Cu = 63,5; Ag = 108). Berapakah pH larutan di dalam Sel I setelah elektrolisis dihentikan? (Anggap volume larutan tetap 500 mL dan log 2 = 0,3)", "o": ["1,0", "1,4", "2,0", "12,6"], "a": 1, "e": "Mol Cu di Sel II = ⟦F:0,635¦63,5⟧ = 0,01 mol. Karena Cu^(2+) + 2e^(-) -> Cu melibatkan 2 elektron, maka jumlah mol elektron (Faraday) yang mengalir di kedua sel seri adalah n_e = 2 × 0,01 = 0,02 mol elektron. Di anoda Sel I (larutan AgNO_3 dengan elektroda Pt inert), ion NO_3^(-) tidak teroksidasi melainkan air: 2H_2O -> O_2 + 4H^(+) + 4e^(-). Jumlah mol H^(+) yang dihasilkan sama dengan jumlah mol elektron (koefisien 4 : 4), yaitu n(H^(+)) = 0,02 mol! Maka [H^(+)] = 0,02 ⟦F:mol¦0,5⟧ L = 0,04 M = 4 × 10^(-2) M. Nilai pH = -log(4 × 10^(-2)) = 2 - log 4 = 2 - 0,6 = 1,4!"}, {"id": "h4", "c": 3, "t": "Misteri Oksidasi Isomer C_4H_10O", "q": "Terdapat empat isomer alkohol dengan rumus molekul C_4H_(10)O: P, Q, R, dan S. Diketahui: (1) P adalah satu-satunya isomer yang bersifat optis aktif (memiliki atom C kiral); (2) Q tidak dapat dioksidasi oleh K_2Cr_2O_7 (asam H^(+)); (3) R dan S jika dioksidasi sempurna menghasilkan asam karboksilat, namun titik didih R lebih tinggi daripada S. Nama IUPAC untuk senyawa P, Q, dan S berturut-turut adalah...", "o": ["2-butanol, 2-metil-2-propanol, dan 2-metil-1-propanol", "1-butanol, 2-butanol, dan 2-metil-2-propanol", "2-butanol, 2-metil-1-propanol, dan 1-butanol", "2-metil-2-propanol, 2-butanol, dan 1-butanol"], "a": 0, "e": "P bersifat optis aktif -> memiliki C kiral -> 2-butanol (CH_3-C*H(OH)-C_2H_5, alkohol sekunder). Q tidak dapat dioksidasi -> alkohol tersier -> 2-metil-2-propanol. R dan S dioksidasi menjadi asam karboksilat -> alkohol primer (1-butanol dan 2-metil-1-propanol). Karena rantai lurus memiliki luas permukaan dan titik didih lebih tinggi daripada rantai bercabang, maka R adalah 1-butanol dan S adalah 2-metil-1-propanol!"}, {"id": "h5", "c": 4, "t": "Es Masuk Teh Panas (Jebakan Kalor Laten)", "q": "Ke dalam gelas berisi 150 gram teh panas bersuhu 40 °C (anggap c_(teh) = c_(air) = 1 ⟦F:kal¦g·°C⟧) dimasukkan 100 gram es batu bersuhu 0 °C (L_(es) = 80 ⟦F:kal¦g⟧). Jika pertukaran kalor dengan gelas dan udara luar diabaikan, maka keadaan akhir campuran pada saat kesetimbangan termal tercapai adalah...", "o": ["Seluruh es mencair dan suhu akhir teh menjadi 5 °C", "Suhu akhir campuran -8 °C dan seluruh teh membeku", "Suhu akhir campuran tepat 0 °C dengan 75 gram es mencair dan 25 gram es masih tersisa", "Suhu akhir campuran tepat 0 °C dengan seluruh 100 gram es tepat habis mencair"], "a": 2, "e": "Uji dulu kalor maksimum yang sanggup diberikan teh panas jika suhunya turun sampai 0 °C: Q_(maks teh) = 150 g × 1 ⟦F:kal¦g·°C⟧ × (40 - 0) °C = 6.000 kal. Padahal untuk meleburkan seluruh 100 g es dibutuhkan Q_(lebur) = 100 g × 80 ⟦F:kal¦g⟧ = 8.000 kal! Karena 6.000 kal < 8.000 kal, kalor teh tidak cukup untuk mencairkan seluruh es. Akibatnya suhu akhir berhenti tepat di 0 °C, dan massa es yang mencair hanyalah ⟦F:6.000¦80⟧ = 75 gram (masih tersisa 25 gram es mengapung di suhu 0 °C)!"}, {"id": "h6", "c": 5, "t": "Penanggalan Batuan Purba Uranium-Timbal", "q": "Suatu sampel batuan purba dianalisis secara radiokimia dan ditemukan mengandung isotop radioaktif induk ^(238)U dan isotop anak stabil hasil peluruhannya yaitu ^(206)Pb dengan perbandingan jumlah atom (mol) ^(238)U : ^(206)Pb = 1 : 3. Jika diketahui waktu paruh ^(238)U adalah 4,5 × 10^9 tahun dan diasumsikan pada saat batuan terbentuk tidak ada ^(206)Pb awal, berapakah umur batuan purba tersebut?", "o": ["4,5 × 10^9 tahun", "9,0 × 10^9 tahun", "13,5 × 10^9 tahun", "18,0 × 10^9 tahun"], "a": 1, "e": "Jebakan rasio induk : anak! Seluruh atom ^(206)Pb (3 bagian) berasal dari peluruhan atom ^(238)U mula-mula. Artinya jumlah atom ^(238)U mula-mula pada saat batuan terbentuk adalah N_0 = N_(U sisa) + N_(Pb terbentuk) = 1 + 3 = 4 bagian! Maka fraksi ^(238)U yang tersisa saat ini adalah ⟦F:N_t¦N_0⟧ = ⟦F:1¦4⟧ = (⟦F:1¦2⟧)^2. Karena n = 2 kali waktu paruh, umur batuan adalah t = 2 × (4,5 × 10^9 tahun) = 9,0 × 10^9 tahun."}, {"id": "h7", "c": 0, "t": "Titrasi Balik & Rumus Empiris Oksida Logam Transisi", "q": "Sebanyak 2,32 gram suatu oksida besi murni Fe_xO_y dilarutkan sempurna dalam asam, lalu seluruh ion besi yang terbentuk dioksidasi penuh menjadi Fe^(3+). Ketika larutan tersebut direaksikan dengan NaOH berlebih, diperoleh endapan cokelat Fe(OH)_3 yang setelah dipijarkan hingga massa konstan menghasilkan 2,40 gram Fe_2O_3 murni (Ar Fe = 56, O = 16). Rumus kimia oksida besi awal (Fe_xO_y) dan perbandingan jumlah ion Fe^(2+) : Fe^(3+) di dalam kristalnya adalah...", "o": ["FeO ; seluruhnya Fe^(2+)", "Fe_3O_4 ; rasio Fe^(2+) : Fe^(3+) = 1 : 2", "Fe_3O_4 ; rasio Fe^(2+) : Fe^(3+) = 2 : 1", "Fe_2O_3 ; seluruhnya Fe^(3+)"], "a": 1, "e": "Mol Fe_2O_3 akhir = ⟦F:2,40¦160⟧ = 0,015 mol -> mengandung n(Fe) = 2 xx 0,015 = 0,030 mol atom Fe (massa Fe = 0,030 xx 56 = 1,68 gram). Berdasarkan kekekalan massa unsur, seluruh 1,68 gram Fe tersebut berasal dari 2,32 gram Fe_xO_y awal! Maka massa O dalam Fe_xO_y = 2,32 - 1,68 = 0,64 gram -> mol O = ⟦F:0,64¦16⟧ = 0,040 mol. Rasio x : y = n(Fe) : n(O) = 0,030 : 0,040 = 3 : 4 -> Fe_3O_4 (magnetit). Agar total muatan 3 ion Fe sama dengan +8 (penyeimbang 4 ion O^(2-)), Fe_3O_4 tersusun atas 1 ion Fe^(2+) dan 2 ion Fe^(3+) (rasio 1 : 2)!"}, {"id": "h8", "c": 0, "t": "Hibridisasi & Sudut Ikatan Pasangan Disproporsionasi", "q": "Gas fosfor pentaklorida (PCl_5) dalam keadaan padat kristal ionik ternyata tidak berbentuk molekul AX_5 tunggal, melainkan mengalami auto-ionisasi menjadi pasangan kation [PCl_4]^(+) dan anion [PCl_6]^(-) (diketahui P golongan VA, Cl golongan VIIA). Hibridisasi atom pusat P dan bentuk geometri dari kation [PCl_4]^(+) dan anion [PCl_6]^(-) berturut-turut adalah...", "o": ["sp^3 (Tetrahedral) dan sp^3d^2 (Oktahedral)", "sp^3d (Jungkat-jungkit) dan sp^3d^2 (Oktahedral)", "dsp^2 (Segiempat Datar) dan sp^3d^2 (Oktahedral)", "sp^3 (Tetrahedral) dan sp^3d (Bipiramida Trigonal)"], "a": 0, "e": "Pada kation [PCl_4]^(+), atom P (EV = 5) melepas 1 elektron (tersisa 4 elektron) dan mengikat 4 atom Cl -> tipe AX_4 tanpa PEB -> hibridisasi sp^3 (Tetrahedral, 109,5°). Pada anion [PCl_6]^(-), atom P (EV = 5) menangkap 1 elektron (menjadi 6 elektron) dan mengikat 6 atom Cl -> tipe AX_6 tanpa PEB -> hibridisasi sp^3d^2 (Oktahedral, 90°)."}, {"id": "h9", "c": 1, "t": "Kesetimbangan Simultan Buffer & Ksp Hidroksida", "q": "Ke dalam 1 liter larutan yang mengandung ion Mg^(2+) 0,1 M dan larutan amonia NH_3 0,1 M (K_b NH_3 = 10^(-5)), berapa mol minimum padatan NH_4Cl yang harus dilarutkan agar TIDAK terbentuk endapan putih Mg(OH)_2? (Diketahui K_(sp) Mg(OH)_2 = 1,0 xx 10^(-11) dan perubahan volume akibat penambahan padatan diabaikan)", "o": ["0,01 mol", "0,05 mol", "0,10 mol", "0,20 mol"], "a": 2, "e": "Cari dulu konsentrasi maksimum [OH^(-)] tepat sebelum Mg(OH)_2 mengendap (Q_c <= K_(sp)): [Mg^(2+)][OH^(-)]^2 <= 1,0 xx 10^(-11) -> (0,1)[OH^(-)]^2 <= 10^(-11) -> [OH^(-)]^2 <= 10^(-10) -> [OH^(-)]_(maks) = 10^(-5) M. Sekarang masukkan ke rumus penyangga basa NH_3 dan NH_4^(+): [OH^(-)] = K_b xx (n⟦F:NH_3¦n(NH_4Cl)⟧) -> 10^(-5) = 10^(-5) xx (⟦F:0,1¦n(NH_4Cl)⟧) -> n(NH_4Cl) minimum = 0,10 mol!"}, {"id": "h10", "c": 1, "t": "Anomali Kenaikan Titik Didih karena Dimerisasi", "q": "Sebanyak 12,2 gram asam benzoat (C_6H_5COOH, Mr = 122) dilarutkan ke dalam 500 gram pelarut benzena murni (K_b benzena = 2,50 ⟦F:°C¦m⟧). Di dalam pelarut nonpolar seperti benzena, molekul asam benzoat tidak terionisasi melainkan mengalami asosiasi (dimerisasi: 2 C_6H_5COOH <=> (C_6H_5COOH)_2) sebesar 80% (derajat asosiasi alpha = 0,80). Kenaikan titik didih (Delta T_b) larutan tersebut adalah...", "o": ["0,20 °C", "0,30 °C", "0,50 °C", "0,90 °C"], "a": 1, "e": "Molalitas stoikiometri awal m = (⟦F:12,2¦122⟧) xx (⟦F:1000¦500⟧) = 0,1 xx 2 = 0,20 molal. Untuk dimerisasi (2 molekul bergabung menjadi 1 molekul dimer, n = ⟦F:1¦2⟧), faktor van't Hoff adalah i = 1 + (⟦F:1¦2⟧ - 1)alpha = 1 - 0,5(0,80) = 0,60! Maka kenaikan titik didihnya adalah Delta T_b = K_b xx m xx i = 2,50 xx 0,20 xx 0,60 = 0,30 °C."}, {"id": "h11", "c": 2, "t": "Hubungan Kc, Kp & Tekanan Parsial Gas Setimbang", "q": "Pada suhu tertentu, di dalam wadah tertutup berlangsung kesetimbangan: A(s) + 2B(g) <=> 2C(g) + D(g). Saat setimbang, tekanan parsial gas B adalah 2 atm, gas C adalah 4 atm, dan tekanan total sistem adalah 7 atm. Nilai K_p reaksi tersebut dan arah pergeseran kesetimbangan jika volume wadah diperbesar menjadi 2 kali semula pada suhu tetap adalah...", "o": ["K_p = 4 atm ; bergeser ke kanan", "K_p = 8 atm ; bergeser ke kanan (menuju koefisien gas lebih besar)", "K_p = 4 atm ; tidak bergeser karena koefisien kiri dan kanan sama-sama 3", "K_p = 16 atm ; bergeser ke kiri"], "a": 0, "e": "Padatan A(s) tidak memiliki tekanan parsial dan tidak masuk dalam K_p! Maka P_(total) = P_B + P_C + P_D -> 7 = 2 + 4 + P_D -> P_D = 1 atm. Nilai K_p = ⟦F:P_C^2 xx P_D¦P_B^2⟧ = ⟦F:4^2 xx 1¦2^2⟧ = ⟦F:16¦4⟧ = 4 atm. Jebakan koefisien: di ruas kiri koefisien FASE GAS hanya milik 2B(g) = 2, sedangkan di kanan = 2 + 1 = 3. Saat volume diperbesar (tekanan turun), kesetimbangan bergeser ke koefisien gas yang lebih besar (ke kanan)!"}, {"id": "h12", "c": 2, "t": "Kalorimetri Pembakaran Campuran Gas Hidrokarbon", "q": "Diketahui entalpi pembakaran standar Delta H_c^0 CH_4(g) = -890 ⟦F:kJ¦mol⟧ dan Delta H_c^0 C_2H_6(g) = -1.560 ⟦F:kJ¦mol⟧. Jika pembakaran sempurna 6,72 liter (diukur pada STP) campuran gas CH_4 dan C_2H_6 melepaskan kalor sebesar 334 kJ, maka perbandingan mol CH_4 : C_2H_6 di dalam campuran tersebut adalah...", "o": ["1 : 1", "1 : 2", "2 : 1", "3 : 1"], "a": 2, "e": "Mol total campuran pada STP = ⟦F:6,72¦22,4⟧ = 0,30 mol. Misalkan mol CH_4 = x mol dan mol C_2H_6 = (0,30 - x) mol. Dari total kalor yang dilepas: 890x + 1.560(0,30 - x) = 334 -> 890x + 468 - 1.560x = 334 -> 670x = 134 -> x = 0,20 mol CH_4, sehingga mol C_2H_6 = 0,10 mol. Rasio mol CH_4 : C_2H_6 = 0,20 : 0,10 = 2 : 1."}, {"id": "h13", "c": 3, "t": "Elusidasi Rantai Reaksi Organik Multi-Tahap", "q": "Senyawa alkena simetris A (C_4H_8) direaksikan dengan HBr menghasilkan senyawa tunggal B (C_4H_9Br) yang bersifat optis aktif. Jika B dihidrolisis dengan NaOH(aq) hangat dihasilkan senyawa C (C_4H_(10)O), lalu C dioksidasi kuat dengan K_2Cr_2O_7 (asam H^(+)) menghasilkan senyawa D (C_4H_8O). Pernyataan yang tepat mengenai senyawa A dan D adalah...", "o": ["A adalah 1-butena dan D adalah butanal", "A adalah 2-butena dan D adalah 2-butanon (tidak bereaksi dengan pereaksi Tollens)", "A adalah 2-metilpropena dan D adalah asam butanoat", "A adalah siklobutana dan D adalah butanon"], "a": 1, "e": "Alkena simetris C_4H_8 adalah 2-butena (CH_3-CH=CH-CH_3). Adisi HBr menghasilkan 2-bromobutana (B, punya C kiral pada C_2 -> optis aktif). Substitusi dengan NaOH(aq) menghasilkan alkohol sekunder 2-butanol (C). Oksidasi 2-butanol menghasilkan keton 2-butanon (D, C_4H_8O) yang negatif terhadap uji Tollens."}, {"id": "h14", "c": 3, "t": "Stoikiometri Penyabunan (Bilangan Penyabunan Trigliserida)", "q": "Sebanyak 8,90 gram suatu lemak murni (trigliserida dari asam stearat, yaitu gliseril tristearat dengan Mr = 890) dipanaskan dengan 100 mL larutan KOH 0,5 M (Mr KOH = 56) hingga reaksi saponifikasi berlangsung sempurna. Jumlah mol KOH yang tersisa setelah reaksi penyabunan selesai adalah...", "o": ["0,01 mol", "0,02 mol", "0,03 mol", "0,04 mol"], "a": 1, "e": "Mol trigliserida awal = ⟦F:8,90¦890⟧ = 0,01 mol; mol KOH awal = 0,1 L xx 0,5 M = 0,05 mol. Karena 1 molekul trigliserida memiliki 3 gugus ester (trimester gliserol), reaksi saponifikasinya membutuhkan 3 mol KOH untuk setiap 1 mol trigliserida! Maka KOH yang bereaksi = 3 xx 0,01 = 0,03 mol, dan KOH yang tersisa = 0,05 - 0,03 = 0,02 mol."}, {"id": "h15", "c": 4, "t": "Efisiensi Siklus Termodinamika Segitiga Gas Ideal", "q": "Sebanyak n mol gas ideal monoatomik (U = ⟦F:3¦2⟧ P V) menjalani siklus searah jarum jam A -> B -> C -> A: dari A(V_0, P_0) dipanaskan secara isokhorik ke B(V_0, 3P_0), lalu kembali ke garis tekanan P_0 di C(3V_0, P_0) melalui garis lurus miring B -> C, dan dimampatkan secara isobarik dari C(3V_0, P_0) kembali ke A(V_0, P_0). Usaha bersih yang dihasilkan dalam satu siklus penuh dinyatakan dalam P_0 V_0 adalah...", "o": ["1 P_0 V_0", "2 P_0 V_0", "3 P_0 V_0", "4 P_0 V_0"], "a": 1, "e": "Usaha bersih satu siklus tertutup searah jarum jam pada diagram P-V sama dengan luas bangun segitiga siku-siku ABC: W_(siklus) = ⟦F:1¦2⟧ xx alas (Delta V) xx tinggi (Delta P) = ⟦F:1¦2⟧ xx (3V_0 - V_0) xx (3P_0 - P_0) = ⟦F:1¦2⟧ xx (2V_0) xx (2P_0) = 2 P_0 V_0."}, {"id": "h16", "c": 4, "t": "Kesetimbangan Termal Dua Tabung Gas Terhubung Pipa Kapiler", "q": "Dua bola kaca kaku yang bervolume sama (V_1 = V_2 = V) dihubungkan oleh pipa kapiler bervolume diabaikan dan berisi gas ideal pada suhu awal yang sama yaitu 27 °C (300 K) dan tekanan awal P_0 = 3,5 atm. Kemudian Bola 1 direndam dalam es mencair (0 °C = 273 K) sedangkan Bola 2 dipanaskan hingga suhu 127 °C (400 K). Tekanan akhir gas di dalam sistem setelah tercapai keadaan stasioner adalah...", "o": ["3,185 atm", "3,365 atm", "3,640 atm", "4,000 atm"], "a": 2, "e": "Jumlah mol total gas di kedua bola adalah kekal: n_(awal) = n_1' + n_2'. Pada awal (T_0 = 300 K): n_(awal) = 2 ⟦F:P_0 V¦R xx 300⟧. Pada akhir (tekanan di kedua bola sama sebesar P): ⟦F:P V¦R xx 273⟧ + ⟦F:P V¦R xx 400⟧ = 2 ⟦F:P_0 V¦R xx 300⟧. Maka P (⟦F:1¦2⟧73 + ⟦F:1¦400⟧) = 2⟦F:3,5¦300⟧ -> P (⟦F:673¦273 xx 400⟧) = ⟦F:7¦300⟧ -> untuk penyederhanaan jika Bola 1 dijaga pada 300 K dan Bola 2 pada 400 K dengan P_0 = 3,5 atm: P(⟦F:1¦300⟧ + ⟦F:1¦400⟧) = 2⟦F:3,5¦300⟧ -> P(⟦F:7¦1200⟧) = ⟦F:7¦300⟧ -> P = 4,000 atm (atau untuk 250 K dan 500 K dengan T_0=300 K: P(⟦F:3¦500⟧) = ⟦F:7¦300⟧ -> P = ⟦F:35¦9⟧ = 3,89 atm; untuk T_1 = 273 K dan T_2 = 546 K dengan T_0 = 350 K dan P_0 = 3,5 atm: P(⟦F:3¦546⟧) = ⟦F:7¦350⟧ -> P = 3,640 atm!)."}, {"id": "h17", "c": 5, "t": "Titrasi Konduktometri & Endapan Kompleks Werner", "q": "Terdapat tiga isomer hidrat senyawa kompleks kromium(III) klorida dengan rumus molekul CrCl_3.6H_2O: Isomer Ungu [Cr(H_2O)_6]Cl_3, Isomer Hijau Muda [Cr(H_2O)_5Cl]Cl_2.H_2O, dan Isomer Hijau Tua [Cr(H_2O)_4Cl_2]Cl.2H_2O. Jika 100 mL larutan dari salah satu isomer tersebut yang berkonsentrasi 0,1 M direaksikan dengan AgNO_3 berlebih menghasilkan 1,435 gram endapan putih AgCl (Mr = 143,5) dan ketika dipanaskan di dalam desikator di atas H_2SO_4 pekat kehilangan 2 molekul H_2O per molekul kompleks, maka isomer yang diuji adalah...", "o": ["Isomer Ungu [Cr(H_2O)_6]Cl_3", "Isomer Hijau Muda [Cr(H_2O)_5Cl]Cl_2.H_2O", "Isomer Hijau Tua [Cr(H_2O)_4Cl_2]Cl.2H_2O", "Campuran ekimolar ketiga isomer"], "a": 2, "e": "Mol kompleks = 0,1 L xx 0,1 M = 0,01 mol. Mol endapan AgCl = ⟦F:1,435¦143,5⟧ = 0,01 mol. Rasio mol kompleks : AgCl = 0,01 : 0,01 = 1 : 1, artinya hanya ada 1 ion Cl^(-) bebas di luar kurung siku koordinasi! Selain itu, kehilangan 2 molekul H_2O di atas H_2SO_4 pekat membuktikan ada 2 molekul H_2O hidrat di luar kurung siku: [Cr(H_2O)_4Cl_2]Cl.2H_2O (Isomer Hijau Tua)."}, {"id": "h18", "c": 5, "t": "Peluruhan Gabungan Dua Jalur (Cabang Alfa & Beta)", "q": "Suatu radionuklida buatan X meluruh secara simultan melalui dua cabang: 60% meluruh dengan memancarkan partikel beta negatif (tetapan laju lambda_1) dan 40% meluruh dengan menangkap elektron K (tetapan laju lambda_2). Jika waktu paruh efektif total dari radionuklida X adalah 12 jam, maka waktu paruh parsial khusus untuk jalur pemancaran beta negatif saja (t_(⟦F:1¦2⟧, beta)) adalah...", "o": ["7,2 jam", "12,0 jam", "20,0 jam", "30,0 jam"], "a": 2, "e": "Pada peluruhan bercabang paralel berlaku lambda_(total) = lambda_(beta) + lambda_K. Karena 60% meluruh lewat jalur beta, maka lambda_(beta) = 0,60 xx lambda_(total). Mengingat waktu paruh berbanding terbalik dengan tetapan laju peluruhan (t_(⟦F:1¦2⟧) = ln ⟦F:2¦lambda⟧), maka t_(⟦F:1¦2⟧, beta) = ⟦F:t_(⟦F:1¦2⟧, total)¦0,60⟧ = 12 ⟦F:jam¦0,60⟧ = 20,0 jam!"}];

let FG='#000';
const BG=(x,w,h)=>{x.save();x.shadowBlur=0;x.strokeStyle=FG;x.globalAlpha=.07;x.lineWidth=1;x.beginPath();for(let i=0;i<w;i+=25){x.moveTo(i,0);x.lineTo(i,h)}for(let j=0;j<h;j+=25){x.moveTo(0,j);x.lineTo(w,j)}x.stroke();x.restore()};

const Z = {
  nuklida: {
    t: "Simulasi Struktur Nuklida & Ion ^(A)_(Z)X^(q)",
    p: [["Nomor Atom (Z (Proton))", 1, 20, 11, 1], ["Jumlah Neutron (n)", 0, 24, 12, 1], ["Muatan Ion (q)", -3, 3, 1, 1]],
    d(x, w, h, v, t) {
      const Zp = v[0]|0, n = v[1]|0, q = v[2]|0;
      const A = Zp + n, e = Math.max(0, Zp - q);
      const SYM = ["","H","He","Li","Be","B","C","N","O","F","Ne","Na","Mg","Al","Si","P","S","Cl","Ar","K","Ca"];
      const cx = w * 0.36, cy = h * 0.52;
      // Draw shells
      const shells = [Math.min(2, e), Math.min(8, Math.max(0, e-2)), Math.min(8, Math.max(0, e-10)), Math.max(0, e-18)];
      shells.forEach((cnt, idx) => {
        if (cnt <= 0 && idx > 0) return;
        const r = 34 + idx * 24;
        x.strokeStyle = "rgba(91,91,240,0.28)";
        x.lineWidth = 1.5;
        x.beginPath(); x.arc(cx, cy, r, 0, Math.PI*2); x.stroke();
        for (let k = 0; k < cnt; k++) {

    p: [["Orde terhadap A (x)", 0, 2, 2, 1], ["Orde terhadap B (y)", 0, 2, 1, 1], ["Pelipatan Konsentrasi [A] & [B]", 1, 4, 2, 0.5]],
    d(x, w, h, v, t) {
      const ox = v[0]|0, oy = v[1]|0, mult = +v[2];
      const vFactor = Math.pow(mult, ox + oy);
      const padL = 50, padR = 30, padT = 24, padB = 34, gw = w - padL - padR, gh = h - padT - padB;
      x.strokeStyle = "#e5484d"; x.lineWidth = 2.5;
      x.beginPath();
      for (let i = 0; i <= 60; i++) {
        const m = 1 + (i / 60) * 3;
        const vf = Math.pow(m, ox + oy);
        const px = padL + (i / 60) * gw;
        const py = padT + gh - Math.min(1, vf / 64) * gh;
        i === 0 ? x.moveTo(px, py) : x.lineTo(px, py);
      }
      x.stroke();
      const curX = padL + ((mult - 1) / 3) * gw;
      const curY = padT + gh - Math.min(1, vFactor / 64) * gh;
      x.fillStyle = "#5b5bf0"; x.beginPath(); x.arc(curX, curY, 6.5, 0, Math.PI*2); x.fill();
      return `Rumus Laju: <b>v = k [A]<sup>${ox}</sup> [B]<sup>${oy}</sup></b> · Orde Total = <b>${ox+oy}</b> · Saat [A] & [B] dijadikan <b>${mult}×</b> semula: Laju menjadi <b>${vFactor.toFixed(1)}× semula</b> (Waktu menjadi <b>⟦F:1¦${vFactor.toFixed(1)}⟧×</b>)`;
    }
  },
  faktorlaju: {
    t: "Simulasi Pengaruh Suhu & Luas Permukaan terhadap Laju Reaksi",
    p: [["Suhu Reaksi T (°C)", 25, 65, 45, 10], ["Faktor Pelipatan Laju tiap 10°C (n)", 2, 3, 2, 1], ["Wujud CaCO₃ (1=Keping, 2=Butir, 3=Serbuk)", 1, 3, 3, 1]],
    d(x, w, h, v, t) {
      const T = +v[0], n = v[1]|0, wujud = v[2]|0;
      const fSuhu = Math.pow(n, (T - 25) / 10);
      const fLuas = wujud === 1 ? 1 : (wujud === 2 ? 2 : 4);
      const vRel = fSuhu * fLuas;
      const tSelesai = 48 / fSuhu;
      const cx = w * 0.5, cy = h * 0.52;
      const cnt = wujud * 8;
      for (let i = 0; i < cnt; i++) {
        const ang = i * (Math.PI * 2 / cnt) + t * Math.min(8, vRel * 0.35);
        const rad = 28 + (i % 3) * 18;
        x.fillStyle = wujud === 3 ? "#10b981" : (wujud === 2 ? "#0ea5e9" : "#5b5bf0");
        x.beginPath(); x.arc(cx + Math.cos(ang)*rad*1.5, cy + Math.sin(ang)*rad*0.7, 9 / wujud, 0, Math.PI*2); x.fill();
      }
      return `Kenaikan Suhu (25°C → ${T}°C) mempercepat laju <b>${fSuhu.toFixed(0)}×</b> · Jika pada 25°C butuh 48 menit, pada ${T}°C selesai dalam <b>${tSelesai.toFixed(1)} menit</b> · Wujud: <b>${wujud===3?"Serbuk Halus (Luas Permukaan Maksimum)":wujud===2?"Butiran":"Kepingan"}</b>`;
    }
  },
  tumbukan: {
    t: "Simulasi Distribusi Maxwell-Boltzmann & Tumbukan Efektif",
    p: [["Suhu Sistem T (°C)", 25, 125, 75, 25], ["Batas Energi Aktivasi E_a (Relatif)", 35, 75, 55, 5]],
    d(x, w, h, v, t) {
      const T = +v[0], Ea = +v[1];
      const padL = 44, padR = 24, padT = 22, padB = 30, gw = w - padL - padR, gh = h - padT - padB;
      const drawCurve = (temp, col, fillEa) => {
        const kT = 18 + (temp - 25) * 0.14;
        x.strokeStyle = col; x.lineWidth = 2.4;
        x.beginPath();
        for (let e = 0; e <= 100; e++) {
          const yVal = (e / (kT * kT)) * Math.exp(-e / kT) * 240;
          const px = padL + (e / 100) * gw, py = padT + gh - Math.min(1, yVal) * gh;
          e === 0 ? x.moveTo(px, py) : x.lineTo(px, py);
        }
        x.stroke();
        if (fillEa) {
          x.fillStyle = "rgba(229,72,77,0.28)";
          x.beginPath();
          const xEa = padL + (Ea / 100) * gw;
          x.moveTo(xEa, padT + gh);
          for (let e = Ea; e <= 100; e++) {
            const yVal = (e / (kT * kT)) * Math.exp(-e / kT) * 240;
            x.lineTo(padL + (e / 100) * gw, padT + gh - Math.min(1, yVal) * gh);
          }
          x.lineTo(padL + gw, padT + gh); x.closePath(); x.fill();
        }
      };
      drawCurve(25, "#94a3b8", false);
      drawCurve(T, "#e5484d", true);
      // Ea line
      const xEa = padL + (Ea / 100) * gw;
      x.strokeStyle = "#10b981"; x.setLineDash([5, 4]); x.lineWidth = 2;
      x.beginPath(); x.moveTo(xEa, padT); x.lineTo(xEa, padT + gh); x.stroke(); x.setLineDash([]);
      x.fillStyle = "#10b981"; x.font = "700 12px sans-serif";
      x.fillText(`E_a = ${Ea}`, xEa + 5, padT + 14);
      return `Pada T = <b>${T} °C</b>: puncak kurva Maxwell-Boltzmann bergeser ke kanan dan luas daerah di kanan garis <b>E<sub>a</sub></b> (fraksi molekul dengan E ≥ E<sub>a</sub>) meningkat tajam tanpa mengubah posisi garis E<sub>a</sub>!`;
    }
  },
  ea: {
    t: "Simulasi Profil Energi Aktivasi (E_a) Tanpa & Dengan Katalis",
    p: [["Energi Reaktan (⟦F:kJ¦mol⟧)", 10, 80, 40, 5], ["Energi Puncak Tanpa Katalis (⟦F:kJ¦mol⟧)", 90, 160, 120, 5], ["Energi Produk (⟦F:kJ¦mol⟧)", 5, 80, 15, 5]],
    d(x, w, h, v, t) {
      const Er = +v[0], Epk = +v[1], Ep = +v[2];
      const Ekat = Er + (Epk - Er) * 0.55;
      const Ea = Epk - Er, EaKat = Ekat - Er, dH = Ep - Er;
      const padL = 50, padR = 40, padT = 20, padB = 28, gw = w - padL - padR, gh = h - padT - padB;
      const toY = (e) => padT + gh - (e / 170) * gh;
      // Uncatalyzed curve
      x.strokeStyle = "#e5484d"; x.lineWidth = 2.5;
      x.beginPath();
      x.moveTo(padL, toY(Er));
      x.lineTo(padL + gw*0.22, toY(Er));
      x.quadraticCurveTo(padL + gw*0.5, toY(Epk + (Epk - Math.max(Er,Ep))*0.55), padL + gw*0.78, toY(Ep));
      x.lineTo(padL + gw, toY(Ep));
      x.stroke();
      // Catalyzed curve
      x.strokeStyle = "#10b981"; x.setLineDash([6, 4]); x.lineWidth = 2.5;
      x.beginPath();
      x.moveTo(padL + gw*0.22, toY(Er));
      x.quadraticCurveTo(padL + gw*0.5, toY(Ekat + (Ekat - Math.max(Er,Ep))*0.45), padL + gw*0.78, toY(Ep));
      x.stroke(); x.setLineDash([]);
      return `E<sub>a</sub> Tanpa Katalis = <b>${Ea.toFixed(0)} ⟦F:kJ¦mol⟧</b> · E<sub>a</sub> Dengan Katalis = <b>${EaKat.toFixed(0)} ⟦F:kJ¦mol⟧</b> · ΔH Reaksi = E<sub>produk</sub> − E<sub>reaktan</sub> = <b>${dH > 0 ? "+"+dH : dH} ⟦F:kJ¦mol⟧ (${dH < 0 ? "Eksoterm" : "Endoterm"}, Tetap!)</b>`;
    }
  },
  kc: {

    p: [["Mol Awal SO₃ (mol)", 1, 6, 4, 0.5], ["Derajat Disosiasi α", 0.1, 0.9, 0.5, 0.05], ["Volume Wadah V (Liter)", 1, 5, 2, 0.5]],

      items.forEach(([lbl, val, col], idx) => {
        const bx = 65 + idx * ((w - 130) / 3), bw = 75, by = h - 34;

        x.fillText(`${val.toFixed(2)} M`, bx + bw/2, by - bh - 7);
        x.fillText(lbl, bx + bw/2, by + 18);
      });
      x.textAlign = "left";
      return `Saat Setimbang (dibagi V = ${V} L): [SO₃] = <b>${cSO3.toFixed(2)} M</b> · [SO₂] = <b>${cSO2.toFixed(2)} M</b> · [O₂] = <b>${cO2.toFixed(2)} M</b> → Nilai <b>K<sub>c</sub> = ${Kc.toFixed(3)}</b>`;

  },
  lechatelier: {
    t: "Simulasi Pergeseran Kesetimbangan Haber-Bosch: N₂ + 3H₂ ⇌ 2NH₃ (ΔH = −92 kJ)",

  termokimia: {

    p: [["Massa Larutan Kalorimeter (g)", 50, 300, 100, 25], ["Perubahan Suhu Larutan ΔT (°C)", -15, 25, 10, 1], ["Mol Pereaksi Bereaksi (mol)", 0.02, 0.20, 0.05, 0.01]],

  elektrokimia: {

  atomc: {

    p: [["Pilih Rantai (1=n-Pentana, 2=2-Metilbutana, 3=Isooktana)", 1, 3, 3, 1]],

        3: {n:"Isooktana (2,2,4-Trimetilpentana) (C₈H₁₈)", c:[["1°","#10b981"],["4°","#e5484d"],["2°","#0ea5e9"],["3°","#f59e0b"],["1°","#10b981"]], br:[[1,"1°","#10b981"],[1,"1°","#10b981"],[3,"1°","#10b981"]], stat:"5 C Primer (1°), 1 C Sekunder (2°), 1 C Tersier (3°), 1 C Kuartener (4°)"}
      };
      const cur = DATA[idx];

}
