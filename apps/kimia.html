["Suatu sampel makanan diuji di laboratorium: (1) dengan pereaksi Biuret menghasilkan warna ungu, (2) dengan asam nitrat pekat dipanaskan menghasilkan warna kuning yang berubah menjadi jingga saat ditambah NaOH, dan (3) dengan larutan Pb(CH_3COO)_2 dalam suasana basa tidak menghasilkan endapan hitam. Simpulkan kandungan sampel makanan tersebut!", "(1) Uji Biuret positif (warna ungu) membuktikan sampel mengandung Protein (memiliki ikatan peptida -CO-NH-).||(2) Uji Xantoproteat positif (warna kuning -> jingga) membuktikan protein tersebut mengandung asam amino bercincin aromatik (benzena) (seperti tirosin, fenilalanin, atau triptofan).||(3) Uji Timbal(II) Asetat negatif (tidak terbentuk endapan hitam PbS) menunjukkan bahwa protein tersebut TIDAK mengandung asam amino berunsur belerang (sistein atau metionin).", "Sampel mengandung protein dengan gugus cincin benzena (aromatik), tetapi tidak mengandung unsur belerang."], "x2": ["Suatu asam amino alanina (CH_3-CH(NH_2)-COOH) memiliki titik isoelektrik (pI) pada pH = 6,0. Tuliskan rumus struktur spesi alanina yang dominan di dalam larutan pada: (a) pH = 6,0, (b) pH = 1,0 (suasana sangat asam), dan (c) pH = 12,0 (suasana sangat basa), serta tentukan ke elektroda manakah alanina akan bergerak pada uji elektroforesis di masing-masing pH tersebut!", "(a) Pada pH = pI = 6,0 (titik isoelektrik), alanina berada dalam bentuk ion zwitter (dipolar): CH_3-CH(NH_3^(+))-COO^(-) yang memiliki muatan total NOL, sehingga tidak bergerak ke katoda maupun anoda pada elektroforesis.||(b) Pada pH = 1,0 (pH < pI, kaya ion H^(+)), gugus karboksilat -COO^(-) menerima proton menjadi -COOH, sehingga spesi dominannya adalah kation bermuatan positif: CH_3-CH(NH_3^(+))-COOH (muatan +1). Dalam elektroforesis, kation ini bergerak menuju KATODA (kutub negatif).||(c) Pada pH = 12,0 (pH > pI, kaya ion OH^(-)), gugus amonium -NH_3^(+) melepas proton menjadi -NH_2, sehingga spesi dominannya adalah anion bermuatan negatif: CH_3-CH(NH_2)-COO^(-) (muatan -1). Dalam elektroforesis, anion ini bergerak menuju ANODA (kutub positif).", "(a) pH 6,0: zwitter CH_3CH(NH_3^(+))COO^(-) (diam); (b) pH 1,0: kation CH_3CH(NH_3^(+))COOH (ke katoda -); (c) pH 12,0: anion CH_3CH(NH_2)COO^(-) (ke anoda +)."], "z": [["Di antara karbohidrat berikut yang termasuk disakarida NON-PEREDUKSI (tidak bereaksi dengan pereaksi Fehling, Benedict, maupun Tollens) adalah...", ["Glukosa", "Maltosa", "Laktosa", "Sukrosa"], 3, "Sukrosa tidak memiliki gugus hemiasetal atau hemiketal bebas karena karbon anomerik glukosa dan fruktosa saling terikat, sehingga sukrosa tidak mereduksi Fehling, Benedict, maupun Tollens."], ["Proses pengubahan minyak nabati cair (tak jenuh) menjadi margarin padat (jenuh) dengan menggunakan gas H_2 dan katalis logam Ni disebut reaksi...", ["Saponifikasi (penyabunan)", "Hidrogenasi (adisi hidrogen)", "Esterifikasi", "Oksidasi (ketengikan)"], 1, "Penjenuhan ikatan rangkap C=C pada asam lemak tak jenuh dalam minyak cair menggunakan gas H_2 disebut reaksi Hidrogenasi (adisi hidrogen)."], ["🔥 [HOTS] Hidrolisis sempurna suatu disakarida X dengan katalis asam menghasilkan dua monosakarida yang berbeda, yaitu D-glukosa dan D-fruktosa. Disakarida X tersebut diuji dengan pereaksi Benedict dan ternyata tidak menghasilkan endapan merah bata, namun setelah dihidrolisis barulah memberikan endapan merah bata dengan Benedict. Disakarida X adalah...", ["Maltosa (gula gandum)", "Laktosa (gula susu)", "Sukrosa (gula tebu, mengalami inversi saat dihidrolisis)", "Selobiosa"], 2, "Sukrosa adalah disakarida non-pereduksi (uji Benedict negatif sebelum hidrolisis). Namun setelah dihidrolisis menjadi glukosa + fruktosa (gula invert), kedua monosakarida hasil hidrolisisnya bersifat gula pereduksi sehingga memberikan uji Benedict positif!"], ["🔥 [HOTS] Sebanyak 1 mol molekul trigliserida (minyak nabati) yang tersusun atas 1 residu asam oleat (punya 1 ikatan C=C), 1 residu asam linoleat (punya 2 ikatan C=C), dan 1 residu asam linolenat (punya 3 ikatan C=C) dihidrogenasi sempurna menjadi lemak jenuh padat. Jumlah mol gas H_2 yang dibutuhkan untuk menjenuhkan 1 mol trigliserida tersebut adalah...", ["3 mol H_2", "4 mol H_2", "6 mol H_2", "9 mol H_2"], 2, "Total ikatan rangkap C=C pada ketiga rantai asam lemak dalam 1 molekul trigliserida tersebut adalah 1 + 2 + 3 = 6 ikatan C=C. Maka dibutuhkan tepat 6 mol gas H_2 per 1 mol trigliserida."]], "m": ["Fruktosa tidak dapat mereduksi pereaksi Fehling dan Tollens karena fruktosa memiliki gugus keton (ketosa).", "Menyamakan sifat keton sederhana (seperti aseton) dengan alfa-hidroksiketon pada fruktosa dalam suasana basa.", "Dalam larutan basa (seperti reagen Fehling dan Tollens), fruktosa mengalami tautomerisasi keto-endiol menjadi glukosa dan manosa (aldosa), sehingga fruktosa TETAP merupakan gula pereduksi (uji Fehling & Tollens positif!)."]}, "4.0": {"x": ["Sebuah termometer laboratorium kimia X memiliki titik beku air pada -20 °X dan titik didih air pada 130 °X. Jika suatu larutan reaksi bersuhu 60 °C, berapakah suhu yang ditunjukkan oleh termometer X dan berapakah nilainya dalam Kelvin?", "Rentang skala termometer X adalah X_d - X_b = 130 - (-20) = 150 skala, sedangkan Celcius memiliki rentang 100 - 0 = 100 skala.||Gunakan persamaan perbandingan: ⟦F:X - (-20)¦150⟧ = ⟦F:60¦100⟧ -> ⟦F:X + 20¦150⟧ = 0,6.||Maka X + 20 = 0,6 × 150 = 90 -> X = 90 - 20 = 70 °X.||Dalam skala mutlak Kelvin: T = 60 + 273 = 333 K.", "70 °X (atau 333 K)."], "x2": ["Dua buah termometer tak baku P dan Q dikalibrasi pada tekanan 1 atm. Termometer P memiliki titik lebur es pada -30 °P dan titik didih air pada 120 °P, sedangkan termometer Q memiliki titik lebur es pada 10 °Q dan titik didih air pada 90 °Q. Pada suhu berapa derajat Celcius kedua termometer P dan Q tersebut akan menunjukkan angka bacaan yang PERSIS SAMA (P = Q = x)?", "Rentang skala termometer P adalah 120 - (-30) = 150 skala; rentang skala termometer Q adalah 90 - 10 = 80 skala.||Gunakan rumus kesebandingan skala antara P dan Q ketika keduanya menunjukkan angka yang sama (P = Q = x): ⟦F:x - (-30)¦150⟧ = ⟦F:x - 10¦80.⟧||Sederhanakan penyebut dengan membagi 10: ⟦F:x + 30¦15⟧ = ⟦F:x - 10¦8⟧ -> kali silang: 8(x + 30) = 15(x - 10).||8x + 240 = 15x - 150 -> 7x = 390 -> x = ⟦F:390¦7⟧ = 55,71 (dalam skala P dan Q). Untuk mencari suhunya dalam Celcius: ⟦F:C¦100⟧ = ⟦F:x - 10¦80⟧ -> C = (⟦F:100¦80⟧) xx ((⟦F:390¦7⟧) - 10) = (⟦F:5¦4⟧) xx (⟦F:320¦7⟧) = ⟦F:400¦7⟧ = 57,14 °C.", "Keduanya menunjukkan angka yang sama yaitu ⟦F:390¦7⟧ (55,71°) pada suhu ⟦F:400¦7⟧ °C (57,14 °C)."], "z": [["Pada suhu berapakah skala Fahrenheit menunjukkan angka tepat DUA KALI angka yang ditunjukkan oleh skala Celcius (F = 2C)?", ["80 °C (160 °F)", "100 °C (200 °F)", "160 °C (320 °F)", "-40 °C (-40 °F)"], 2, "Dari rumus F = (⟦F:9¦5⟧)C + 32, substitusikan F = 2C: 2C = 1,8C + 32 -> 0,2C = 32 -> C = 160 °C (dan F = 320 °F)."], ["Suatu larutan dipanaskan dari suhu 27 °C menjadi 77 °C. Besar kenaikan suhu (Delta T) larutan tersebut dalam satuan Kelvin adalah...", ["50 K", "323 K", "300 K", "350 K"], 0, "Selisih suhu dalam Kelvin sama dengan selisih suhu dalam Celcius: Delta T = (77 + 273) - (27 + 273) = 350 - 300 = 50 K."], ["🔥 [HOTS] Pada suhu berapakah skala Fahrenheit dan skala Kelvin menunjukkan angka bacaan yang PERSIS SAMA (F = K = x)?", ["273,0", "301,4", "574,25", "-40,0"], 2, "Gunakan perbandingan ⟦F:F - 32¦9⟧ = ⟦F:K - 273¦5.⟧ Substitusikan F = K = x: 5(x - 32) = 9(x - 273) -> 5x - 160 = 9x - 2.457 -> 4x = 2.297 -> x = ⟦F:2.297¦4⟧ = 574,25 (574,25 °F = 574,25 K = 301,25 °C)."], ["🔥 [HOTS] Sebuah termometer hambatan platina memiliki hambatan listrik R_0 = 50 Ohm pada titik lebur es (0 °C) dan R_(100) = 70 Ohm pada titik didih air (100 °C). Jika hambatan berubah secara linear terhadap suhu, maka saat termometer dicelupkan ke dalam larutan reaksi yang memiliki hambatan R = 65 Ohm, suhu mutlak larutan tersebut adalah...", ["75 K", "338 K", "348 K", "358 K"], 2, "Dari kesebandingan linear: ⟦F:R - R_0¦R_(100) - R_0⟧ = ⟦F:C¦100⟧ -> ⟦F:65 - 50¦70 - 50⟧ = ⟦F:C¦100⟧ -> ⟦F:15¦20⟧ = ⟦F:C¦100⟧ -> C = 75 °C. Dalam skala mutlak Kelvin: T = 75 + 273 = 348 K."]], "m": ["Jika suhu gas dalam wadah naik dari 25 °C menjadi 50 °C, maka suhu mutlaknya meningkat dua kali lipat.", "Menghitung perbandingan suhu termodinamika menggunakan skala Celcius, bukan skala mutlak Kelvin.", "Dalam skala mutlak Kelvin, suhu naik dari 298 K menjadi 323 K (hanya naik sekitar 8,4%). Agar suhu mutlak menjadi 2 kali lipat dari 25 °C (298 K), suhu harus dinaikkan menjadi 596 K (323 °C)!"]}, "4.1": {"x": ["Sebanyak 200 gram air panas bersuhu 80 °C dicampurkan dengan 300 gram air dingin bersuhu 20 °C di dalam wadah terisolasi yang kapasitas kalornya diabaikan. Berapakah suhu akhir campuran pada saat setimbang termal?", "Karena kedua cairan adalah air (kalor jenis c_1 = c_2 = c_air), maka nilai c di kedua ruas saling meniadakan.||Terapkan Asas Black: Q_(lepas) = Q_(terima) -> m_1 (80 - T_c) = m_2 (T_c - 20).||200 (80 - T_c) = 300 (T_c - 20) -> bagi kedua ruas dengan 100: 2(80 - T_c) = 3(T_c - 20).||160 - 2T_c = 3T_c - 60 -> 5T_c = 220 -> T_c = 44 °C.", "44 °C"], "x2": ["Sebuah kalorimeter tembaga bermassa 200 gram (c_(Cu) = 0,4 ⟦F:J¦g·°C⟧) berisi 300 gram air (c_(air) = 4,2 ⟦F:J¦g·°C⟧) pada suhu awal 25 °C. Ke dalam kalorimeter tersebut dimasukkan 100 gram bola besi panas bersuhu 120 °C (c_(Fe) = 0,45 ⟦F:J¦g·°C⟧) dan secara bersamaan dimasukkan pula 50 gram keping perak bersuhu 90 °C (c_(Ag) = 0,24 ⟦F:J¦g·°C⟧). Hitunglah suhu kesetimbangan termal akhir (T_c) dari sistem 4 komponen tersebut!", "Identifikasi pelepas dan penerima kalor: kalorimeter Cu dan air awalnya bersuhu 25 °C (penerima kalor), sedangkan besi (120 °C) dan perak (90 °C) adalah pelepas kalor.||Kapasitas kalor total penerima (kalorimeter + air): C_(terima) = m_(Cu) c_(Cu) + m_(air) c_(air) = (200 xx 0,4) + (300 xx 4,2) = 80 + 1.260 = 1.340 ⟦F:J¦°C⟧.||Kapasitas kalor masing-masing pelepas: C_(Fe) = 100 xx 0,45 = 45 ⟦F:J¦°C⟧; C_(Ag) = 50 xx 0,24 = 12 ⟦F:J¦°C⟧.||Terapkan Asas Black (Q_(lepas) = Q_(terima)): 45(120 - T_c) + 12(90 - T_c) = 1.340(T_c - 25) -> 5.400 - 45 T_c + 1.080 - 12 T_c = 1.340 T_c - 33.500 -> 1.397 T_c = 39.980 -> T_c = ⟦F:39.980¦1.397⟧ = 28,62 °C.", "T_c = 28,62 °C."], "z": [["Sepotong logam bermassa 100 gram bersuhu 110 °C dimasukkan ke dalam 200 gram air (c_(air) = 4,2 ⟦F:J¦g·°C⟧) bersuhu 20 °C. Jika suhu akhir campuran menjadi 25 °C, maka kalor jenis logam tersebut adalah...", ["0,21 ⟦F:J¦g·°C⟧", "0,49 ⟦F:J¦g·°C⟧", "0,84 ⟦F:J¦g·°C⟧", "1,05 ⟦F:J¦g·°C⟧"], 1, "Q_(lepas logam) = Q_(terima air) -> 100 × c_L × (110 - 25) = 200 × 4,2 × (25 - 20) -> 8500 c_L = 4200 -> c_L = ⟦F:4200¦8500⟧ = 0,494 ⟦F:J¦g·°C⟧."], ["Konversi satuan energi: jika 1 kalori = 4,184 Joule, maka kalor sebesar 2,5 kkal setara dengan...", ["1.046 Joule", "10.460 Joule", "4.184 Joule", "597,5 Joule"], 1, "2,5 kkal = 2.500 kalori × 4,184 ⟦F:J¦kal⟧ = 10.460 Joule (10,46 kJ)."], ["🔥 [HOTS] Tiga cairan yang tidak saling bereaksi dicampurkan dalam wadah terisolasi: Cairan A (m_A = 100 g, c_A = 1 ⟦F:kal¦g·°C⟧, T_A = 20 °C), Cairan B (m_B = 200 g, c_B = 0,5 ⟦F:kal¦g·°C⟧, T_B = 40 °C), dan Cairan C (m_C = 100 g, c_C = 2 ⟦F:kal¦g·°C⟧, T_C = 80 °C). Suhu akhir campuran ketiga cairan tersebut adalah...", ["45 °C", "50 °C", "55 °C", "60 °C"], 2, "Hitung kapasitas kalor tiap cairan (C_i = m_i c_i): C_A = 100(1) = 100 ⟦F:kal¦°C⟧; C_B = 200(0,5) = 100 ⟦F:kal¦°C⟧; C_C = 100(2) = 200 ⟦F:kal¦°C⟧. Suhu akhir campuran adalah rata-rata tertimbang kapasitas kalor: T_c = ⟦F:100(20) + 100(40) + 200(80)¦100 + 100 + 200⟧ = ⟦F:2.000 + 4.000 + 16.000¦400⟧ = ⟦F:22.000¦400⟧ = 55 °C."], ["🔥 [HOTS] Sebanyak 100 mL larutan HCl 2 M bersuhu 25 °C dicampurkan dengan 100 mL larutan NaOH 2 M bersuhu 25 °C di dalam kalorimeter yang memiliki kapasitas kalor C_(kal) = 160 ⟦F:J¦°C⟧. Jika diketahui entalpi penetralan Delta H = -50 ⟦F:kJ¦mol⟧ H_2O dan kalor jenis larutan 4,2 ⟦F:J¦g·°C⟧ (rho = 1 ⟦F:g¦mL⟧), maka suhu akhir sistem adalah...", ["30 °C", "35 °C", "36,9 °C", "40 °C"], 1, "Mol H_2O yang terbentuk = 100 mL xx 2 M = 200 mmol = 0,20 mol. Kalor reaksi yang dilepas: Q = 0,20 mol xx 50.000 ⟦F:J¦mol⟧ = 10.000 Joule. Kalor ini diserap oleh larutan (m = 200 g) DAN kalorimeter: Q = (m c + C_(kal)) Delta T = (200 xx 4,2 + 160) Delta T = (840 + 160) Delta T = 1.000 Delta T. Maka Delta T = ⟦F:10.000¦1.000⟧ = 10 °C -> suhu akhir = 25 + 10 = 35 °C!"]], "m": ["Benda yang suhunya tinggi menyimpan banyak kalor di dalamnya.", "Menganggap kalor (Q) sebagai besaran keadaan yang dimiliki benda seperti energi dalam (U).", "Benda tidak 'memiliki' kalor; benda memiliki Energi Dalam (U). Kalor (Q) hanyalah energi yang sedang BERPINDAH melintasi batas sistem akibat adanya perbedaan suhu."]}, "4.2": {"x": ["Sebuah pemanas listrik berdaya 210 Watt (⟦F:J¦s⟧) digunakan untuk memanaskan 500 gram cairan X dari suhu 25 °C menjadi 65 °C dalam waktu 200 detik. Jika efisiensi pemanas 100%, tentukan kalor jenis (c) dan kapasitas kalor (C) cairan X tersebut!", "Hitung total energi kalor yang diberikan pemanas: Q = P × t = 210 W × 200 s = 42.000 Joule.||Kenaikan suhu: Delta T = 65 - 25 = 40 °C.||Kapasitas kalor cairan X: C = ⟦F:Q¦Delta⟧ T = 42.000 ⟦F:J¦40⟧ °C = 1.050 ⟦F:J¦°C⟧.||Kalor jenis cairan X: c = ⟦F:C¦m⟧ = ⟦F:1.050¦500⟧ g = 2,1 ⟦F:J¦g·°C⟧ (atau 2.100 ⟦F:J¦kg·°C⟧).", "Kalor jenis c = 2,1 ⟦F:J¦g·°C⟧ dan kapasitas kalor C = 1.050 ⟦F:J¦°C⟧."], "x2": ["Sebuah ketel listrik berdaya 600 Watt yang bekerja pada tegangan 220 V memiliki efisiensi konversi panas sebesar 84% (16% energi hilang ke udara sekitar). Ketel tersebut digunakan untuk memanaskan 1,2 kg air (c_(air) = 4.200 ⟦F:J¦kg·°C⟧) yang berada di dalam ketel (kapasitas kalor badan ketel C_(ketel) = 360 ⟦F:J¦°C⟧) dari suhu 25 °C hingga tepat mencapai 100 °C. Berapa menit waktu yang diperlukan?", "Hitung kapasitas kalor total yang harus dipanaskan (air + badan ketel): C_(total) = m_(air) c_(air) + C_(ketel) = (1,2 xx 4.200) + 360 = 5.040 + 360 = 5.400 ⟦F:J¦°C⟧.||Kenaikan suhu: Delta T = 100 - 25 = 75 °C. Maka kalor bersih yang dibutuhkan adalah Q_(butuh) = C_(total) xx Delta T = 5.400 xx 75 = 405.000 Joule.||Daya efektif pemanas (efisiensi 84%): P_(efektif) = 84% xx 600 W = 504 Watt (⟦F:J¦s⟧).||Waktu yang diperlukan: t = ⟦F:Q_(butuh)¦P_(efektif)⟧ = ⟦F:405.000¦504⟧ = 803,57 detik = 13,39 menit.", "803,6 detik (13,4 menit)."], "z": [["Jika massa sepotong besi dijadikan dua kali lipat dari semula, maka perubahan yang terjadi pada kalor jenis (c) dan kapasitas kalornya (C) adalah...", ["c menjadi 2 kali lipat, C tetap", "c tetap, C menjadi 2 kali lipat", "c dan C sama-sama menjadi 2 kali lipat", "c dan C sama-sama tetap"], 1, "Kalor jenis (c) hanya bergantung pada jenis zat (tetap untuk besi), sedangkan kapasitas kalor C = m × c berbanding lurus dengan massa sehingga menjadi 2 kali lipat."], ["Empat jenis logam (P, Q, R, S) bermassa sama dipanaskan dengan kalor yang sama besar. Jika kenaikan suhu keempatnya adalah Delta T_P > Delta T_Q > Delta T_R > Delta T_S, maka logam yang memiliki kalor jenis PALING BESAR adalah...", ["Logam P", "Logam Q", "Logam R", "Logam S"], 3, "Dari Q = m c Delta T, untuk Q dan m yang sama berlaku c berbanding terbalik dengan Delta T. Logam S mengalami kenaikan suhu terkecil, berarti kalor jenisnya paling besar."], ["🔥 [HOTS] Menurut Hukum Dulong-Petit, kapasitas kalor molar (C_m = Ar xx c) dari sebagian besar unsur logam padat pada suhu kamar bernilai hampir konstan yaitu sekitar 3R ≈ 25 ⟦F:J¦mol·K⟧. Berdasarkan aturan ini, perbandingan kalor jenis (c dalam ⟦F:J¦g·°C⟧) antara logam Aluminium (Ar = 27) dan logam Timbal (Ar = 207) adalah sekitar...", ["c_(Al) : c_(Pb) = 27 : 207 (Timbal memiliki kalor jenis lebih besar)", "c_(Al) : c_(Pb) = 207 : 27 ≈ 7,7 : 1 (Aluminium memiliki kalor jenis per gram jauh lebih besar karena Ar-nya lebih ringan)", "Keduanya memiliki kalor jenis per gram yang sama persis", "c_(Al) : c_(Pb) = 1 : 3"], 1, "Karena kapasitas kalor per mol (Ar xx c) hampir sama (~25 ⟦F:J¦mol·K⟧), maka kalor jenis per gram c = ⟦F:25¦Ar⟧ berbanding TERBALIK dengan massa atom relatif (Ar). Oleh sebab itu c_(Al) : c_(Pb) = Ar_(Pb) : Ar_(Al) = 207 : 27 ≈ 7,7 : 1!"], ["🔥 [HOTS] Dua cairan X dan Y dipanaskan dengan pemanas identik (daya P sama). Massa X adalah 2 kali massa Y (m_X = 2 m_Y), namun grafik kenaikan suhu terhadap waktu menunjukkan gradien (Delta ⟦F:T¦Delta⟧ t) cairan X adalah ⟦F:1¦3⟧ kali gradien cairan Y. Perbandingan kalor jenis c_X : c_Y adalah...", ["2 : 3", "3 : 2", "1 : 6", "6 : 1"], 1, "Dari Q = P Delta t = m c Delta T, diperoleh gradien g = Delta ⟦F:T¦Delta⟧ t = ⟦F:P¦m c⟧, sehingga c berbanding terbalik dengan (m xx g). Maka ⟦F:c_X¦c_Y⟧ = ⟦F:m_Y g_Y¦m_X g_X⟧ = (⟦F:1¦2⟧) xx (⟦F:3¦1⟧) = ⟦F:3¦2.⟧"]], "m": ["Logam terasa lebih dingin daripada kayu pada suhu ruang karena suhu logam lebih rendah daripada suhu kayu.", "Menyamakan sensasi laju perpindahan kalor di kulit dengan suhu benda.", "Pada suhu ruang yang sama, logam dan kayu memiliki suhu yang persis sama; logam terasa lebih dingin karena konduktivitas termalnya tinggi dan kalor jenisnya kecil sehingga cepat menyerap panas dari tangan."]}, "4.3": {"x": ["Sebanyak 100 gram es bersuhu 0 °C (L_(es) = 80 ⟦F:kal¦g⟧) dimasukkan ke dalam 100 gram air panas bersuhu 50 °C (c_(air) = 1 ⟦F:kal¦g·°C⟧). Tentukan suhu akhir campuran dan massa es yang mencair!", "Uji kalor maksimum yang dapat dilepas air panas jika turun hingga 0 °C: Q_(maks air) = m_(air) c_(air) (50 - 0) = 100 × 1 × 50 = 5.000 kal.||Hitung kalor yang dibutuhkan untuk meleburkan SELURUH 100 g es: Q_(butuh es) = m_(es) × L_(es) = 100 × 80 = 8.000 kal.||Karena Q_(maks air) (5.000 kal) < Q_(butuh es) (8.000 kal), maka es TIDAK mencair seluruhnya! Sistem berhenti pada titik lebur 0 °C.||Massa es yang mencair: m_(cair) = ⟦F:Q_(maks air)¦L_(es)⟧ = ⟦F:5.000¦80⟧ = 62,5 gram (tersisa 37,5 gram es pada suhu akhir 0 °C).", "Suhu akhir campuran = 0 °C, dengan 62,5 gram es mencair dan 37,5 gram es tersisa."], "x2": ["Ke dalam bejana terisolasi yang berisi 200 gram es bersuhu -10 °C (c_(es) = 0,5 ⟦F:kal¦g·°C⟧, L_(es) = 80 ⟦F:kal¦g⟧) dialirkan 20 gram uap air bersuhu 100 °C (L_(uap) = 540 ⟦F:kal¦g⟧, c_(air) = 1 ⟦F:kal¦g·°C⟧). Tentukan secara kuantitatif suhu akhir kesetimbangan dan komposisi wujud zat di dalam bejana pada keadaan akhir!", "Uji tahapan energi: (1) Kalor yang dibutuhkan untuk menaikkan suhu 200 g es dari -10 °C ke 0 °C adalah Q_1 = 200 xx 0,5 xx 10 = 1.000 kal.||(2) Kalor yang dibutuhkan untuk meleburkan SELURUH 200 g es pada 0 °C adalah Q_2 = 200 xx 80 = 16.000 kal. Jadi total kalor agar seluruh es tepat mencair menjadi air 0 °C adalah Q_(es->cair 0) = 1.000 + 16.000 = 17.000 kal.||(3) Sekarang hitung kalor maksimum yang dapat dilepas oleh 20 g uap air 100 °C jika mengembun seluruhnya lalu turun hingga menjadi air 0 °C: Q_(embun) = 20 xx 540 = 10.800 kal, dan Q_(turun ke 0) = 20 xx 1 xx (100 - 0) = 2.000 kal. Total Q_(maks uap) = 10.800 + 2.000 = 12.800 kal!||Bandingkan! Karena Q_(maks uap) (12.800 kal) > Q_1 (1.000 kal) tetapi < 17.000 kal, maka seluruh es berhasil naik ke 0 °C namun HANYA SEBAGIAN es yang mencair! Sisa kalor untuk mencairkan es = 12.800 - 1.000 = 11.800 kal -> massa es yang mencair = ⟦F:11.800¦80⟧ = 147,5 gram. Maka pada keadaan akhir suhu tepat 0 °C, terdapat air cair sebanyak 20 g (dari uap) + 147,5 g = 167,5 gram dan es tersisa sebanyak 200 - 147,5 = 52,5 gram!", "Suhu akhir tepat 0 °C, terdiri atas 167,5 gram air cair dan 52,5 gram es yang belum mencair."], "z": [["Berapakah kalor total yang diperlukan untuk mengubah 50 gram es bersuhu -10 °C menjadi air bersuhu 20 °C? (Diketahui c_(es) = 0,5 ⟦F:kal¦g·°C⟧, L_(es) = 80 ⟦F:kal¦g⟧, c_(air) = 1 ⟦F:kal¦g·°C⟧)", ["4.000 kal", "5.000 kal", "5.250 kal", "6.250 kal"], 2, "Q_1 (es -10 °C ke 0 °C) = 50 × 0,5 × 10 = 250 kal. Q_2 (lebur es di 0 °C) = 50 × 80 = 4.000 kal. Q_3 (air 0 °C ke 20 °C) = 50 × 1 × 20 = 1.000 kal. Total Q = 250 + 4.000 + 1.000 = 5.250 kal."], ["Selama proses air mendidih berubah menjadi uap air pada tekanan 1 atm, pernyataan yang tepat mengenai suhu dan energi molekulnya adalah...", ["Suhu naik terus dan energi kinetik rata-rata meningkat", "Suhu tetap 100 °C dan kalor digunakan untuk memperbesar energi potensial (memisahkan jarak antarmolekul)", "Suhu tetap 100 °C karena sistem tidak lagi menyerap kalor", "Suhu turun karena penguapan bersifat endoterm"], 1, "Pada perubahan wujud mendidih, suhu tetap 100 °C (energi kinetik rata-rata tetap), sedangkan kalor laten uap yang diserap digunakan untuk memutus ikatan hidrogen antarmolekul (menaikkan energi potensial)."], ["🔥 [HOTS] Berapa gram minimum uap air bersuhu 100 °C (L_(uap) = 540 ⟦F:kal¦g⟧, c_(air) = 1 ⟦F:kal¦g·°C⟧) yang harus dialirkan ke dalam 160 gram es bersuhu 0 °C (L_(es) = 80 ⟦F:kal¦g⟧) agar seluruh es tepat habis mencair menjadi air pada suhu 0 °C?", ["16 gram", "20 gram", "23,7 gram", "32 gram"], 1, "Agar seluruh 160 g es mencair di 0 °C, dibutuhkan kalor Q_(terima) = 160 xx 80 = 12.800 kal. Setiap m gram uap 100 °C yang mengembun (540 m) lalu mendingin dari 100 °C ke 0 °C (100 m) melepaskan kalor total Q_(lepas) = 640 m kal. Maka 640 m = 12.800 -> m = ⟦F:12.800¦640⟧ = 20 gram uap!"], ["🔥 [HOTS] Perbedaan mendasar antara diagram fase P-T dari Air (H_2O) dan Karbon Dioksida (CO_2) yang menjelaskan mengapa es biasa mencair saat ditekan (misalnya oleh pisau sepatu seluncur es) adalah...", ["Garis batas kesetimbangan padat-cair pada H_2O miring ke KIRI (gradien negatif, karena massa jenis es lebih kecil daripada air cair), sehingga peningkatan tekanan pada suhu tetap menggeser es menjadi fase cair", "Titik tripel H_2O berada di atas tekanan 5 atm", "Garis padat-cair H_2O miring ke kanan seperti CO_2", "Es menyublim langsung menjadi gas pada tekanan tinggi"], 0, "Akibat anomali air, volume molar air cair lebih kecil daripada es padat. Sesuai asas Le Chatelier, peningkatan tekanan menggeser kesetimbangan ke wujud yang volumenya lebih kecil (cair), sehingga garis lebur H_2O miring ke kiri (gradien ⟦F:dP¦dT⟧ negatif)."]], "m": ["Jika rumus m_(es) L + m_(es) c T_c = m_(air) c (T_(air) - T_c) menghasilkan T_c = -15 °C untuk campuran es 0 °C dan air 50 °C, maka suhu campurannya benar-benar -15 °C.", "Memaksakan persamaan dengan asumsi seluruh es mencair tanpa mengecek kecukupan kalor dari air panas.", "Campuran es 0 °C dan air 50 °C tidak mungkin menghasilkan suhu di bawah 0 °C (melanggar Hukum II Termodinamika); nilai negatif pada hitungan aljabar tersebut adalah tanda bahwa es belum mencair seluruhnya dan suhu berhenti di 0 °C."]}, "4.4": {"x": ["Sebuah bejana kaca (alpha_(kaca) = 9 × 10^(-6) ⟦F:1¦°C⟧) bervolume 1.000 mL diisi penuh dengan raksa (gamma_(raksa) = 1,8 × 10^(-4) ⟦F:1¦°C⟧) pada suhu 20 °C. Jika bejana beserta isinya dipanaskan hingga suhu 120 °C, berapa mL raksa yang tumpah?", "Hitung koefisien muai volume bejana kaca: gamma_(kaca) = 3 × alpha_(kaca) = 3 × 9 × 10^(-6) = 2,7 × 10^(-5) = 0,27 × 10^(-4) ⟦F:1¦°C⟧.||Kenaikan suhu: Delta T = 120 - 20 = 100 °C.||Volume raksa yang tumpah adalah selisih muai volume raksa dikurangi muai volume kaca: V_(tumpah) = V_0 (gamma_(raksa) - gamma_(kaca)) Delta T.||V_(tumpah) = 1.000 mL × (1,8 × 10^(-4) - 0,27 × 10^(-4)) × 100 = 1.000 × 1,53 × 10^(-4) × 100 = 15,3 mL.", "15,3 mL"], "x2": ["Sebuah silinder kaca Pyrex (koefisien muai panjang alpha_(kaca) = 3,0 xx 10^(-6) ⟦F:1¦°C⟧) memiliki kapasitas tepat 500 mL pada suhu 20 °C dan diisi penuh dengan gliserin (koefisien muai volume gamma_(glis) = 5,09 xx 10^(-4) ⟦F:1¦°C⟧, massa jenis pada 20 °C adalah rho_0 = 1,26 ⟦F:g¦mL⟧). Jika sistem dipanaskan hingga suhu 120 °C, tentukan: (a) volume gliserin yang tumpah, dan (b) massa gliserin yang tumpah!", "(a) Koefisien muai volume kaca: gamma_(kaca) = 3 xx alpha_(kaca) = 3 xx 3,0 xx 10^(-6) = 9,0 xx 10^(-6) = 0,09 xx 10^(-4) ⟦F:1¦°C⟧.||Kenaikan suhu: Delta T = 120 - 20 = 100 °C.||Volume gliserin yang tumpah (diukur pada suhu 120 °C): V_(tumpah) = V_0 (gamma_(glis) - gamma_(kaca)) Delta T = 500 xx (5,09 - 0,09) xx 10^(-4) xx 100 = 500 xx 5,00 xx 10^(-2) = 25,0 mL.||(b) Hati-hati menghitung massa yang tumpah! Pada suhu 120 °C, massa jenis gliserin telah berkurang menjadi rho_(120) = ⟦F:rho_0¦1 + gamma_(glis) Delta T⟧ = ⟦F:1,26¦1 + 0,0509⟧ = 1,20 ⟦F:g¦mL⟧. Maka massa yang tumpah = 25,0 mL xx 1,20 ⟦F:g¦mL⟧ = 30,0 gram.", "(a) Volume tumpah = 25,0 mL; (b) Massa gliserin tumpah ≈ 30,0 gram."], "z": [["Keping bimetal terdiri atas logam P (alpha_P = 1,9 × 10^(-5) ⟦F:1¦°C⟧) dan logam Q (alpha_Q = 1,1 × 10^(-5) ⟦F:1¦°C⟧). Jika keping bimetal tersebut DIPANASKAN, yang akan terjadi adalah...", ["Melengkung ke arah logam P karena P memuai lebih panjang", "Melengkung ke arah logam Q karena koefisien muai Q lebih kecil", "Tetap lurus tetapi bertambah tebal", "Melengkung ke arah logam P saat dipanaskan maupun didinginkan"], 1, "Saat dipanaskan, logam P (alpha lebih besar) memuai lebih panjang di sisi luar lengkungan, sehingga bimetal membengkok ke arah logam Q yang memiliki koefisien muai lebih kecil."], ["Jika sejumlah air murni dipanaskan secara perlahan dari suhu 0 °C hingga 10 °C, bagaimana perubahan volume air tersebut?", ["Volume terus bertambah dari 0 °C sampai 10 °C", "Volume terus menyusut dari 0 °C sampai 10 °C", "Volume menyusut dari 0 °C sampai 4 °C, lalu memuai dari 4 °C sampai 10 °C", "Volume memuai dari 0 °C sampai 4 °C, lalu menyusut setelah 4 °C"], 2, "Akibat sifat anomali air (runtuhnya struktur kerangka ikatan hidrogen es), volume air menyusut saat dipanaskan dari 0 °C hingga mencapai volume minimum (massa jenis maksimum) pada 4 °C, kemudian memuai normal di atas 4 °C."], ["🔥 [HOTS] Sebuah bola baja pejal berdiameter 10,02 cm pada suhu 25 °C ingin dimasukkan melewati lubang cincin kuningan yang berdiameter 10,00 cm pada suhu 25 °C. Jika koefisien muai panjang baja alpha_(baja) = 1,1 xx 10^(-5) ⟦F:1¦°C⟧ dan kuningan alpha_(kun) = 1,9 xx 10^(-5) ⟦F:1¦°C⟧, tindakan paling efisien agar bola baja dapat masuk melewati cincin apabila KEDUANYA dipanaskan bersama-sama adalah...", ["Tidak mungkin masuk jika keduanya dipanaskan bersama karena bola ikut membesar", "Memanaskan keduanya bersama-sama sebesar Delta T = 250 °C (hingga suhu 275 °C), karena kuningan memiliki alpha lebih besar sehingga lubang cincin membesar lebih cepat daripada bola baja", "Mendinginkan keduanya bersama-sama di dalam es", "Memanaskan bola baja saja dan mendinginkan cincin kuningan"], 1, "Karena alpha_(kun) (1,9 xx 10^(-5)) > alpha_(baja) (1,1 xx 10^(-5)), saat keduanya dipanaskan bersama, diameter lubang cincin bertambah lebih cepat daripada bola! Selisih diameter awal = 0,02 cm. Dari D_0 (alpha_(kun) - alpha_(baja)) Delta T = 0,02 -> 10 (0,8 xx 10^(-5)) Delta T = 0,02 -> Delta T = ⟦F:0,02¦8 xx 10^(-5)⟧ = 250 °C."], ["🔥 [HOTS] Apabila suatu cairan dipanaskan dari suhu T_1 ke T_2 (mengalami kenaikan suhu Delta T dan koefisien muai volume cairan adalah gamma), maka hubungan antara massa jenis akhir cairan (rho_2) terhadap massa jenis awalnya (rho_1) adalah...", ["rho_2 = rho_1 (1 + gamma Delta T)", "rho_2 = ⟦F:rho_1¦1 + gamma Delta T⟧", "rho_2 = rho_1 (1 - 3 gamma Delta T)", "rho_2 tetap sama dengan rho_1 karena massa kekal"], 1, "Massa cairan m tetap, sedangkan volumenya memuai menjadi V_2 = V_1 (1 + gamma Delta T). Karena rho = ⟦F:m¦V,⟧ maka rho_2 = ⟦F:m¦V_2⟧ = ⟦F:⟦F:m¦V_1⟧¦1 + gamma Delta T⟧ = ⟦F:rho_1¦1 + gamma Delta T⟧."]], "m": ["Ketika cincin logam dipanaskan, logam akan memuai ke segala arah termasuk ke arah dalam sehingga lubang cincin menyempit.", "Membayangkan pemuaian termal seperti pembengkakan adonan ke ruang kosong tanpa menjaga proporsi jarak antaratom.", "Pemuaian termal memperbesar seluruh dimensi secara proporsional seperti perbesaran foto (zoom in); keliling lingkar dalam cincin ikut memanjang sehingga diameter lubang cincin pasti ikut MEMBESAR."]}, "4.5": {"x": ["Dua batang logam P dan Q yang memiliki luas penampang dan panjang sama disambungkan secara seri. Konduktivitas termal logam P adalah 3 kali konduktivitas termal logam Q (k_P = 3 k_Q). Jika ujung bebas P bersuhu 100 °C dan ujung bebas Q bersuhu 20 °C, berapakah suhu tepat pada bidang sambungan kedua logam?", "Pada sambungan seri berlaku laju konduksi sama: H_P = H_Q -> ⟦F:k_P A (100 - T_s)¦L⟧ = ⟦F:k_Q A (T_s - 20)¦L.⟧||Karena luas A dan panjang L kedua batang sama, coret A dan L, serta substitusikan k_P = 3 k_Q:||3 k_Q (100 - T_s) = k_Q (T_s - 20) -> 300 - 3T_s = T_s - 20.||4T_s = 320 -> T_s = 80 °C (suhu sambungan lebih dekat ke suhu batang P yang konduktivitasnya lebih besar).", "80 °C"], "x2": ["Tiga batang logam P, Q, dan R yang memiliki panjang dan luas penampang identik disambungkan membentuk huruf Y (titik cabang di tengah bersuhu T_s). Ujung bebas batang P dipertahankan pada suhu 120 °C, ujung bebas batang Q pada suhu 60 °C, dan ujung bebas batang R pada suhu 10 °C. Jika perbandingan konduktivitas termal ketiganya adalah k_P : k_Q : k_R = 3 : 2 : 1 dan sistem terisolasi sempurna di bagian selimutnya, tentukan suhu pada titik sambungan tengah (T_s)!", "Menurut hukum kekekalan energi termal pada keadaan tunak (steady state), jumlah laju aliran kalor konduksi yang menuju titik sambungan sama dengan nol: H_P + H_Q + H_R = 0.||Karena panjang L dan luas penampang A ketiga batang sama, faktor ⟦F:A¦L⟧ dapat dicoret dari persamaan: k_P(120 - T_s) + k_Q(60 - T_s) + k_R(10 - T_s) = 0.||Substitusikan perbandingan k_P = 3, k_Q = 2, dan k_R = 1: 3(120 - T_s) + 2(60 - T_s) + 1(10 - T_s) = 0.||360 - 3 T_s + 120 - 2 T_s + 10 - T_s = 0 -> 490 = 6 T_s -> T_s = ⟦F:490¦6⟧ = 81,67 °C.", "T_s = ⟦F:490¦6⟧ °C = 81,67 °C."], "z": [["Sebuah benda hitam sempurna memancarkan daya radiasi sebesar P pada suhu 27 °C. Jika suhunya dinaikkan menjadi 327 °C, maka daya radiasi yang dipancarkan menjadi...", ["2 P", "4 P", "8 P", "16 P"], 3, "Ubah suhu ke Kelvin: T_1 = 27 + 273 = 300 K; T_2 = 327 + 273 = 600 K. Rasio suhu mutlak ⟦F:T_2¦T_1⟧ = ⟦F:600¦300⟧ = 2. Karena P sebanding T^4, maka P_2 = (2)^4 × P = 16 P."], ["Dinding termos air panas dilapisi perak mengilap dan dibuat hampa udara di antara dua dinding kaca. Tujuan utama ruang hampa udara dan lapisan perak mengilap berturut-turut adalah...", ["Mencegah radiasi dan mencegah konduksi", "Mencegah konduksi-konveksi dan mencegah radiasi", "Mempercepat konveksi dan memantulkan konduksi", "Menurunkan kalor jenis air dan mencegah penguapan"], 1, "Ruang hampa udara menghilangkan medium perantara sehingga mencegah perpindahan kalor secara konduksi dan konveksi, sedangkan lapisan perak mengilap (emisivitas e mendekati 0) memantulkan kembali gelombang inframerah untuk mencegah radiasi."], ["🔥 [HOTS] Dua bola logam hitam sempurna P dan Q terbuat dari bahan yang sama. Jari-jari bola P adalah 2 kali jari-jari bola Q (R_P = 2 R_Q), tetapi suhu mutlak permukaan bola Q adalah 2 kali suhu mutlak bola P (T_Q = 2 T_P). Perbandingan laju energi radiasi per detik yang dipancarkan oleh bola P terhadap bola Q (P_P : P_Q) adalah...", ["1 : 2", "1 : 4", "1 : 8", "4 : 1"], 1, "Luas permukaan bola A = 4 pi R^2 sebanding dengan R^2, sehingga ⟦F:A_P¦A_Q⟧ = (⟦F:2¦1⟧)^2 = ⟦F:4¦1.⟧ Menurut Hukum Stefan-Boltzmann P = e sigma A T^4, maka ⟦F:P_P¦P_Q⟧ = (⟦F:A_P¦A_Q⟧) xx (⟦F:T_P¦T_Q⟧)^4 = (⟦F:4¦1⟧) xx (⟦F:1¦2⟧)^4 = ⟦F:4¦16⟧ = 1 : 4."], ["🔥 [HOTS] Dua batang konduktor A dan B disambung secara seri. Panjang batang A adalah 2 kali panjang batang B (L_A = 2 L_B), tetapi konduktivitas termal A adalah 4 kali konduktivitas B (k_A = 4 k_B) dan luas penampangnya sama. Jika ujung bebas A bersuhu 110 °C dan ujung bebas B bersuhu 20 °C, maka suhu tepat pada bidang sambungan adalah...", ["50 °C", "65 °C", "80 °C", "90 °C"], 2, "Dari H_A = H_B: ⟦F:k_A A (110 - T_s)¦L_A⟧ = ⟦F:k_B A (T_s - 20)¦L_B.⟧ Substitusikan k_A = 4 k_B dan L_A = 2 L_B: (⟦F:4¦2⟧)(110 - T_s) = 1(T_s - 20) -> 2(110 - T_s) = T_s - 20 -> 220 - 2 T_s = T_s - 20 -> 3 T_s = 240 -> T_s = 80 °C."]], "m": ["Pada sambungan dua batang logam berbeda bahan dengan ukuran sama, suhu sambungan selalu merupakan rata-rata tengah ⟦F:T_1 + T_2¦2.⟧", "Mengabaikan perbedaan konduktivitas termal (k) antara kedua batang logam.", "Suhu sambungan selalu lebih condong mendekati suhu ujung logam yang memiliki konduktivitas termal (k) lebih besar; rata-rata tengah hanya berlaku jika k_1 = k_2."]}, "4.6": {"x": ["Dalam sebuah tabung terdapat campuran gas Hidrogen (H_2, Mr = 2) dan gas Oksigen (O_2, Mr = 32) pada suhu 27 °C. Tentukan: (a) perbandingan energi kinetik rata-rata molekul H_2 terhadap O_2, dan (b) perbandingan kelajuan efektif (v_(rms)) molekul H_2 terhadap O_2!", "(a) Energi kinetik translasi rata-rata molekul gas ideal hanya bergantung pada suhu mutlak T: E_k = (⟦F:3¦2⟧) k_B T. Karena kedua gas berada dalam tabung dan suhu yang sama (300 K), maka E_k(H_2) : E_k(O_2) = 1 : 1.||(b) Kelajuan efektif v_(rms) = sqrt(⟦F:3RT¦Mr⟧). Pada suhu T yang sama, v_(rms) berbanding terbalik dengan akar Mr:||⟦F:v_(rms, H2)¦v_(rms, O2)⟧ = sqrt(Mr⟦F:O_2¦Mr(H_2)⟧) = sqrt(⟦F:32¦2⟧) = sqrt(16) = 4 : 1.||Jadi molekul H_2 bergerak rata-rata 4 kali lebih cepat daripada molekul O_2 pada suhu yang sama.", "(a) Perbandingan E_k = 1 : 1; (b) Perbandingan v_(rms) H_2 : O_2 = 4 : 1."], "x2": ["Sebuah pipa kaca horizontal yang panjangnya 100 cm memiliki dua sumbat kapas di kedua ujungnya. Dari ujung kiri disuntikkan gas amonia (NH_3, Mr = 17) dan pada saat yang bersamaan dari ujung kanan disuntikkan gas hidrogen klorida (HCl, Mr = 36,5) pada suhu dan tekanan yang sama. Ketika kedua gas bertemu, terbentuk cincin kabut putih amonium klorida (NH_4Cl(s)). Pada jarak berapa cm dari ujung kiri (tempat masuknya NH_3) cincin putih NH_4Cl tersebut pertama kali terbentuk? (Gunakan pendekatan sqrt(⟦F:36,5¦17⟧) ≈ 1,465)", "Menurut Hukum Difusi Graham, pada suhu dan tekanan yang sama, laju difusi gas berbanding terbalik dengan akar massa molekul relatifnya: ⟦F:v_(NH3)¦v_(HCl)⟧ = sqrt(⟦F:Mr_(HCl)¦Mr_(NH3)⟧).||Karena kedua gas disuntikkan bersamaan (waktu tempuh t sama), perbandingan jarak tempuh ⟦F:x_(NH3)¦x_(HCl)⟧ sama dengan perbandingan lajunya: ⟦F:x_(NH3)¦x_(HCl)⟧ = sqrt(⟦F:36,5¦17⟧) = 1,465.||Misalkan jarak dari ujung kiri (NH_3) adalah x cm, maka jarak dari ujung kanan (HCl) adalah (100 - x) cm.||Maka ⟦F:x¦100 - x⟧ = 1,465 -> x = 146,5 - 1,465 x -> 2,465 x = 146,5 -> x = ⟦F:146,5¦2,465⟧ = 59,43 cm dari ujung NH_3 (lebih dekat ke ujung HCl karena molekul NH_3 lebih ringan dan bergerak lebih cepat!).", "59,43 cm dari ujung masuknya gas NH_3 (atau 40,57 cm dari ujung HCl)."], "z": [["Berapakah massa jenis (rho) dari gas metana (CH_4, Mr = 16) yang diukur pada suhu 27 °C dan tekanan 2,46 atm? (Diketahui R = 0,082 ⟦F:L·atm¦mol·K⟧)", ["0,8 ⟦F:g¦L⟧", "1,6 ⟦F:g¦L⟧", "3,2 ⟦F:g¦L⟧", "16,0 ⟦F:g¦L⟧"], 1, "Suhu T = 27 + 273 = 300 K. Gunakan rumus rho = ⟦F:P × Mr¦R × T⟧ = ⟦F:2,46 × 16¦0,082 × 300⟧ = ⟦F:2,46 × 16¦24,6⟧ = 0,1 × 16 = 1,6 ⟦F:g¦L⟧."], ["Suatu gas ideal dalam tabung tertutup dipanaskan sehingga kelajuan efektif (v_(rms)) partikelnya menjadi 2 kali semula. Jika volume tabung tetap, maka tekanan gas di dalam tabung menjadi...", ["sqrt(2) kali semula", "2 kali semula", "4 kali semula", "8 kali semula"], 2, "Karena v_(rms) sebanding dengan sqrt(T), jika v_(rms) menjadi 2 kali lipat berarti suhu mutlak T menjadi 2^2 = 4 kali lipat. Pada volume tetap (P sebanding T), tekanan P juga menjadi 4 kali semula."], ["🔥 [HOTS] Gas X yang belum diketahui identitasnya memiliki laju efusi sebesar setengah kali laju efusi gas metana (CH_4, Mr = 16) pada suhu dan tekanan yang sama. Gas X tersebut kemungkinan besar adalah...", ["Gas Oksigen (O_2, Mr = 32)", "Gas Karbon Dioksida (CO_2, Mr = 44)", "Gas Belerang Dioksida (SO_2, Mr = 64)", "Gas Hidrogen (H_2, Mr = 2)"], 2, "Menurut Hukum Graham: ⟦F:v_X¦v_(CH4)⟧ = sqrt(⟦F:Mr_(CH4)¦Mr_X⟧) = ⟦F:1¦2.⟧ Kuadratkan kedua ruas: ⟦F:16¦Mr_X⟧ = ⟦F:1¦4⟧ -> Mr_X = 16 xx 4 = 64 ⟦F:g¦mol⟧, yaitu gas SO_2 (Ar S = 32, O = 16 -> Mr = 64)."], ["🔥 [HOTS] Dua bejana kaku yang dihubungkan oleh keran sempit masing-masing berisi: Bejana A (volume 2 L, berisi gas He pada tekanan 3 atm) dan Bejana B (volume 3 L, berisi gas Ne pada tekanan 1 atm) pada suhu yang sama dan tetap. Jika keran penghubung dibuka hingga kedua gas bercampur merata, maka tekanan total campuran gas di dalam sistem adalah...", ["1,5 atm", "1,8 atm", "2,0 atm", "2,2 atm"], 1, "Sesuai Hukum Dalton pada suhu tetap: P_(total) V_(total) = P_A V_A + P_B V_B. Volume total V_(total) = 2 + 3 = 5 L. Maka P_(total) = ⟦F:3 xx 2 + 1 xx 3¦5⟧ = ⟦F:6 + 3¦5⟧ = ⟦F:9¦5⟧ = 1,8 atm."]], "m": ["Jika suhu mutlak gas dijadikan 2 kali lipat, maka kelajuan rata-rata molekul gas (v_(rms)) juga menjadi 2 kali lipat.", "Melupakan tanda akar kuadrat pada rumus v_(rms) = sqrt(⟦F:3RT¦Mr⟧).", "Kelajuan efektif sebanding dengan AKAR suhu mutlak (sqrt(T)); agar v_(rms) menjadi 2 kali lipat, suhu mutlak T harus dijadikan 4 kali lipat!"]}, "4.7": {"x": ["Suatu sistem gas ideal menyerap kalor sebesar 500 Joule dari lingkungan dan pada saat yang sama gas memuai (ber-ekspansi) mendorong piston pada tekanan tetap 10^5 Pa dari volume 2 liter menjadi 5 liter. Tentukan besar usaha yang dilakukan gas dan perubahan energi dalam (Delta U) sistem!", "Ubah perubahan volume ke satuan SI (m^3): Delta V = (5 - 2) liter = 3 L = 3 × 10^(-3) m^3.||Besar usaha ekspansi oleh gas: W = P × Delta V = 10^5 Pa × 3 × 10^(-3) m^3 = 300 Joule (dalam konvensi kimia w = -300 J karena sistem mengeluarkan energi untuk memuai).||Sistem menyerap kalor (+500 J) dan mengeluarkan energi untuk memuai (-300 J).||Maka perubahan energi dalam sistem: Delta U = 500 J - 300 J = +200 Joule (energi dalam gas bertambah 200 J).", "Besar usaha ekspansi = 300 J dan perubahan energi dalam Delta U = +200 J."], "x2": ["Sebanyak 1 mol cairan air (H_2O(l), Mr = 18, massa jenis 1 ⟦F:g¦mL⟧) diuapkan seluruhnya menjadi 1 mol uap air (H_2O(g)) pada suhu tetap 100 °C (373 K) dan tekanan luar tetap 1 atm. Jika diketahui kalor penguapan molar air pada 100 °C adalah Delta H_(uap) = +40,66 ⟦F:kJ¦mol⟧ dan R = 8,314 ⟦F:J¦mol·K⟧, hitunglah: (a) kerja ekspansi yang dilakukan sistem terhadap atmosfer (W), dan (b) perubahan energi dalam (Delta U) proses penguapan 1 mol air tersebut!", "(a) Volume 1 mol air cair (18 mL = 0,018 L) sangat kecil dibandingkan volume 1 mol uap air (~30,6 L), sehingga kerja ekspansi pada penguapan 1 mol zat cair menjadi 1 mol gas ideal pada suhu T tetap dapat dihitung dengan W = P Delta V = Delta n_(gas) R T.||Dengan Delta n_(gas) = 1 - 0 = 1 mol, R = 8,314 ⟦F:J¦mol·K⟧, dan T = 373 K: W = 1 xx 8,314 xx 373 = 3.101 Joule = +3,10 kJ (dalam konvensi kimia w = -3,10 kJ).||(b) Kalor yang diserap pada tekanan tetap adalah q_P = Delta H_(uap) = +40,66 kJ.||Sesuai Hukum I Termodinamika: Delta U = Q - W = 40,66 kJ - 3,10 kJ = +37,56 ⟦F:kJ¦mol⟧ (sekitar 92% energi kalor dipakai untuk memutus ikatan hidrogen antarmolekul, dan 8% dipakai untuk kerja ekspansi mendorong atmosfer!).", "(a) Kerja ekspansi W = 3,10 kJ (w = -3,10 kJ); (b) Perubahan energi dalam Delta U = +37,56 ⟦F:kJ¦mol⟧."], "z": [["Suatu gas dimampatkan (dikompresi) dengan usaha luar sebesar 400 J, sementara pada saat bersamaan gas tersebut melepaskan kalor sebesar 150 J ke lingkungan. Perubahan energi dalam (Delta U) gas adalah...", ["+550 J", "+250 J", "-250 J", "-550 J"], 1, "Gas dimampatkan berarti menerima energi usaha (+400 J) dan melepas kalor berarti kehilangan energi (-150 J). Maka Delta U = +400 - 150 = +250 J."], ["Pada reaksi kimia di dalam wadah terbuka yang menghasilkan gas: Zn(s) + 2HCl(aq) -> ZnCl_2(aq) + H_2(g), tanda kerja (w menurut IUPAC) yang dialami sistem akibat pembentukan gas H_2 adalah...", ["w = 0 karena tekanan atmosfer tetap", "w < 0 (negatif) karena sistem berekspansi mendorong udara luar (Delta V > 0)", "w > 0 (positif) karena gas H_2 terbentuk", "Delta U = 0 karena reaksi spontan"], 1, "Pembentukan 1 mol gas H_2 dari zat padat atau larutan menyebabkan volume sistem bertambah (Delta V > 0, ekspansi). Sesuai w = -P Delta V = -Delta n_(gas) R T, kerja sistem bernilai negatif (sistem melakukan kerja ke lingkungan)."], ["🔥 [HOTS] Hubungan umum antara perubahan entalpi reaksi (Delta H, kalor pada tekanan tetap) dan perubahan energi dalam reaksi (Delta U, kalor pada volume tetap) untuk reaksi yang melibatkan gas ideal pada suhu mutlak T adalah Delta H = Delta U + Delta n_(gas) R T. Untuk reaksi pembakaran karbon monoksida: 2CO(g) + O_2(g) -> 2CO_2(g) pada suhu 300 K, perbandingan nilai Delta H dan Delta U adalah...", ["Delta H = Delta U", "Delta H = Delta U - R T (nilai Delta H lebih negatif daripada Delta U karena Delta n_(gas) = -1)", "Delta H = Delta U + R T", "Delta H = Delta U + 2 R T"], 1, "Hitung selisih koefisien gas: Delta n_(gas) = koefisien gas kanan (2) - koefisien gas kiri (2 + 1 = 3) = -1. Maka Delta H = Delta U + (-1) R T = Delta U - R T."], ["🔥 [HOTS] Sebanyak 2 mol gas ideal monoatomik (C_V = ⟦F:3¦2⟧ R, C_P = ⟦F:5¦2⟧ R) dipanaskan pada tekanan tetap (isobarik) sehingga suhunya naik sebesar Delta T. Perbandingan antara perubahan energi dalam (Delta U) terhadap kalor yang diserap gas (Q_P) pada proses tersebut adalah...", ["2 : 5", "3 : 5", "5 : 3", "1 : 1"], 1, "Untuk gas ideal monoatomik pada proses isobarik: Delta U = n C_V Delta T = (⟦F:3¦2⟧) n R Delta T, sedangkan Q_P = n C_P Delta T = (⟦F:5¦2⟧) n R Delta T (dan usaha W = n R Delta T). Maka rasio Delta U : Q_P = 3 : 5 (60% kalor menjadi energi dalam dan 40% menjadi usaha ekspansi)."]], "m": ["Perubahan energi dalam (Delta U) suatu gas ideal bergantung pada jalur lintasan proses pada diagram P-V.", "Menyamakan sifat Energi Dalam (U, fungsi keadaan) dengan Kalor (Q) dan Usaha (W, fungsi lintasan).", "Energi dalam U adalah FUNGSI KEADAAN yang untuk gas ideal hanya bergantung pada suhu awal dan suhu akhir (Delta U sebanding Delta T), sedangkan Q dan W bergantung pada luas lintasan proses pada diagram P-V."]}, "4.8": {"x": ["Suatu gas ideal menjalani siklus tertutup berbentuk segitiga siku-siku A -> B -> C -> A pada diagram P-V: dari A(1 m^3, 4×10^5 Pa) turun secara isokhorik ke B(1 m^3, 1×10^5 Pa), lalu memuai secara isobarik ke C(5 m^3, 1×10^5 Pa), dan kembali ke A melalui garis lurus. Hitunglah besar usaha bersih dan perubahan energi dalam untuk satu siklus penuh!", "Karena siklus tertutup kembali ke keadaan awal A, suhu akhir sama dengan suhu awal sehingga perubahan energi dalam satu siklus adalah Delta U_(siklus) = 0.||Besar usaha bersih dalam satu siklus sama dengan luas bangun segitiga ABC pada diagram P-V.||Alas segitiga Delta V = 5 - 1 = 4 m^3; tinggi segitiga Delta P = (4 - 1) × 10^5 = 3 × 10^5 Pa.||Luas segitiga = ⟦F:1¦2⟧ × alas × tinggi = ⟦F:1¦2⟧ × 4 × 3 × 10^5 = 6 × 10^5 Joule (600 kJ). Karena arah siklus A->B->C->A berlawanan arah jarum jam, usaha bersih oleh gas bernilai -600 kJ (atau usaha dilakukan pada gas sebesar 600 kJ).", "Delta U_(siklus) = 0 dan besar usaha siklus |W| = 600 kJ."], "x2": ["Sebanyak 1 mol gas ideal monoatomik menjalani siklus persegi panjang A -> B -> C -> D -> A pada diagram P-V: A(V_1 = 2 L, P_1 = 1 atm) dipanaskan secara isokhorik ke B(2 L, 3 atm), lalu memuai secara isobarik ke C(6 L, 3 atm), kemudian didinginkan secara isokhorik ke D(6 L, 1 atm), dan akhirnya dimampatkan secara isobarik kembali ke A(2 L, 1 atm). Jika 1 L.atm = 101,3 Joule, hitunglah: (a) usaha pada masing-masing tahap, dan (b) usaha bersih satu siklus penuh dalam satuan L.atm dan Joule!", "(a) Tahap A -> B (isokhorik, V tetap = 2 L): W_(AB) = 0. Tahap B -> C (isobarik ekspansi pada P = 3 atm): W_(BC) = 3 atm xx (6 - 2) L = +12 L.atm.||Tahap C -> D (isokhorik, V tetap = 6 L): W_(CD) = 0. Tahap D -> A (isobarik kompresi pada P = 1 atm): W_(DA) = 1 atm xx (2 - 6) L = -4 L.atm.||(b) Usaha bersih satu siklus penuh: W_(siklus) = W_(AB) + W_(BC) + W_(CD) + W_(DA) = 0 + 12 + 0 - 4 = +8 L.atm (sama dengan luas persegi panjang: Delta P xx Delta V = (3 - 1) xx (6 - 2) = 8 L.atm).||Dalam satuan SI (Joule): W_(siklus) = 8 xx 101,3 J = +810,4 Joule.", "(a) W_(AB) = 0, W_(BC) = +12 L.atm, W_(CD) = 0, W_(DA) = -4 L.atm; (b) W_(siklus) = +8 L.atm (+810,4 J)."], "z": [["Pada proses pemuaian gas ideal secara ISOTERMAL (suhu tetap), pernyataan yang benar berdasarkan Hukum I Termodinamika adalah...", ["Q = 0 karena suhu gas tidak berubah", "W = 0 karena tekanan gas berubah", "Delta U = 0 sehingga seluruh kalor yang diserap gas diubah menjadi usaha luar (Q = W)", "Suhu gas turun karena melakukan usaha"], 2, "Pada proses isotermal, suhu T tetap (Delta T = 0) sehingga energi dalam gas tidak berubah (Delta U = 0). Dari Delta U = Q - W, diperoleh Q = W."], ["Ketika gas di dalam kaleng aerosol disemprotkan keluar dengan cepat (ekspansi adiabatik), badan kaleng terasa dingin. Hal ini terjadi karena...", ["Kalor mengalir keluar menembus dinding kaleng dengan sangat cepat", "Pada ekspansi adiabatik (Q = 0), gas melakukan usaha (W > 0) dengan mengambil energi dalamnya sendiri (Delta U < 0) sehingga suhu turun", "Tekanan udara luar lebih tinggi daripada tekanan di dalam kaleng", "Volume kaleng menyusut saat gas keluar"], 1, "Ekspansi berlangsung sangat cepat sehingga mendekati adiabatik (Q = 0). Karena gas melakukan kerja memuai (W > 0), maka Delta U = -W < 0, yang berarti energi dalam dan suhu gas turun drastis."], ["🔥 [HOTS] Sebanyak 2 mol gas ideal memuai secara ISOTERMAL (suhu tetap) pada suhu 27 °C dari volume 4 liter menjadi 8 liter. Jika diketahui R = 8,314 ⟦F:J¦mol·K⟧ dan ln 2 = 0,693, maka besar kalor (Q) yang diserap oleh gas selama proses tersebut adalah...", ["0 Joule", "1.728,5 Joule", "3.457,0 Joule", "4.988,4 Joule"], 2, "Pada proses isotermal berlaku Delta U = 0, sehingga Q = W = n R T ln(⟦F:V_2¦V_1⟧). Dengan n = 2 mol, T = 300 K, dan ⟦F:V_2¦V_1⟧ = ⟦F:8¦4⟧ = 2: Q = 2 xx 8,314 xx 300 xx 0,693 = 3.457,0 Joule."], ["🔥 [HOTS] Sejumlah gas ideal memiliki volume awal V_0 dan tekanan awal P_0. Gas tersebut dimampatkan hingga volumenya menjadi ⟦F:1¦2⟧ V_0 melalui dua cara berbeda: Cara I secara Isotermal, dan Cara II secara Adiabatik. Perbandingan tekanan akhir pada Cara I (P_I) dan Cara II (P_(II)) adalah...", ["P_I > P_(II) karena isotermal menyerap kalor", "P_(II) > P_I karena pada pemampatan adiabatik (P V^(gamma) = konstan dengan gamma > 1) suhu gas ikut naik sehingga tekanannya melonjak lebih tinggi daripada isotermal", "P_I = P_(II) = 2 P_0", "P_(II) = P_0"], 1, "Pada pemampatan isotermal, P_I = 2 P_0 (suhu tetap). Pada pemampatan adiabatik, usaha luar menambah energi dalam sehingga suhu gas naik dan P_(II) = 2^(gamma) P_0 > 2 P_0. Kurva adiabatik selalu lebih curam daripada isotermal!"]], "m": ["Dalam proses isotermal tidak ada kalor yang masuk atau keluar sistem (Q = 0) karena suhunya konstan.", "Menyamakan 'suhu tetap (isotermal)' dengan 'tanpa aliran kalor (adiabatik)'.", "Agar suhu gas tetap konstan saat memuai dan melakukan kerja keluar (W > 0), gas justru WAJIB menyerap kalor sebesar Q = W dari tandon suhu; proses tanpa aliran kalor (Q = 0) adalah proses Adiabatik."]}, "4.9": {"x": ["Sebuah mesin Carnot bekerja di antara tandon suhu rendah 27 °C dan tandon suhu tinggi 227 °C. (a) Hitunglah efisiensi mesin Carnot tersebut! (b) Jika suhu tandon rendah tetap 27 °C, harus dinaikkan menjadi berapa °C suhu tandon tinggi agar efisiensinya meningkat menjadi 60%?", "(a) Ubah suhu ke Kelvin: T_2 = 27 + 273 = 300 K; T_1 = 227 + 273 = 500 K.||Efisiensi awal: eta_1 = (1 - ⟦F:T_2¦T_1⟧) × 100% = (1 - ⟦F:300¦500⟧) × 100% = (1 - 0,6) × 100% = 40%.||(b) Agar efisiensi baru eta_2 = 60% (0,6) dengan T_2 tetap 300 K: 0,6 = 1 - (⟦F:300¦T_1'⟧) -> ⟦F:300¦T_1'⟧ = 1 - 0,6 = 0,4.||Maka T_1' = ⟦F:300¦0,4⟧ = 750 K. Dalam derajat Celcius: T_1' = 750 - 273 = 477 °C.", "(a) Efisiensi = 40%; (b) Suhu tandon tinggi harus menjadi 477 °C (750 K)."], "x2": ["Sebuah mesin kalor Carnot menyerap kalor dari tandon suhu tinggi T_1 = 600 K dan membuang kalor ke tandon suhu rendah T_2 = 300 K. Seluruh usaha mekanik (W) yang dihasilkan oleh mesin Carnot tersebut digunakan langsung untuk menggerakkan sebuah mesin pendingin (kulkas) Carnot yang mengambil kalor dari ruang pembeku bersuhu T_c = 250 K (-23 °C) dan membuangnya ke udara ruang bersuhu T_h = 300 K (27 °C). Jika mesin kalor menyerap kalor Q_1 = 1.200 Joule dari tandon 600 K, berapa Joule kalor (Q_c) yang berhasil disedot keluar dari ruang pembeku 250 K?", "Hitung dulu efisiensi dan usaha W dari Mesin Kalor Carnot (antara 600 K dan 300 K): eta = 1 - (⟦F:300¦600⟧) = 0,50 (50%).||Usaha mekanik yang dihasilkan mesin kalor: W = eta xx Q_1 = 0,50 xx 1.200 J = 600 Joule.||Sekarang tinjau Mesin Pendingin Carnot (antara T_c = 250 K dan T_h = 300 K) yang digerakkan oleh usaha W = 600 J tersebut: koefisien performansinya adalah COP = ⟦F:T_c¦T_h - T_c⟧ = ⟦F:250¦300 - 250⟧ = ⟦F:250¦50⟧ = 5,0.||Dari rumus COP = ⟦F:Q_c¦W,⟧ maka kalor yang berhasil disedot dari ruang pembeku adalah Q_c = COP xx W = 5,0 xx 600 J = 3.000 Joule!", "Usaha W = 600 J, COP pendingin = 5,0, sehingga kalor yang disedot dari ruang pembeku adalah Q_c = 3.000 Joule."], "z": [["Sebuah mesin Carnot menyerap kalor 1.000 J dari tandon bersuhu 527 °C dan membuang kalor ke tandon bersuhu 127 °C. Besar usaha mekanik (W) yang dihasilkan mesin dalam satu siklus adalah...", ["250 J", "400 J", "500 J", "750 J"], 2, "T_1 = 527 + 273 = 800 K; T_2 = 127 + 273 = 400 K. Efisiensi eta = 1 - ⟦F:400¦800⟧ = 0,5 (50%). Usaha W = eta × Q_1 = 0,5 × 1.000 J = 500 J."], ["Sebuah lemari es (mesin pendingin ideal) memiliki suhu ruang pendingin -13 °C dan membuang kalor ke udara kamar yang bersuhu 27 °C. Koefisien performansi (COP) lemari es tersebut adalah...", ["5,5", "6,5", "7,5", "10,0"], 1, "Ubah ke Kelvin: T_2 (rendah) = -13 + 273 = 260 K; T_1 (tinggi) = 27 + 273 = 300 K. COP = ⟦F:T_2¦T_1 - T_2⟧ = ⟦F:260¦300 - 260⟧ = ⟦F:260¦40⟧ = 6,5."], ["🔥 [HOTS] Sebuah mesin Carnot bekerja dengan suhu tandon rendah tetap T_2 = 300 K dan suhu tandon tinggi T_1 sehingga memiliki efisiensi 25%. Agar efisiensi mesin Carnot tersebut meningkat menjadi 50%, maka suhu tandon tinggi T_1 harus dinaikkan sebesar...", ["100 K", "150 K", "200 K", "300 K"], 2, "Saat eta_1 = 25% (0,25): 1 - (⟦F:300¦T_1⟧) = 0,25 -> ⟦F:300¦T_1⟧ = 0,75 = ⟦F:3¦4⟧ -> T_1 = 400 K. Saat eta_2 = 50% (0,50): 1 - (⟦F:300¦T_1'⟧) = 0,50 -> ⟦F:300¦T_1'⟧ = 0,50 -> T_1' = 600 K. Maka kenaikan suhu tandon tinggi adalah Delta T_1 = 600 - 400 = 200 K!"], ["🔥 [HOTS] Sebuah mesin pendingin ideal bekerja menjaga ruang beku pada suhu -13 °C (260 K) sementara suhu udara luar adalah 27 °C (300 K). Jika mesin pendingin tersebut menyerap kalor sebesar 1.300 J dari ruang beku, maka total kalor yang DIBUANG ke udara luar (Q_1) adalah...", ["200 J", "1.100 J", "1.300 J", "1.500 J"], 3, "Perbandingan kalor Carnot: ⟦F:Q_1¦Q_2⟧ = ⟦F:T_1¦T_2⟧ -> ⟦F:Q_1¦1.300⟧ = ⟦F:300¦260⟧ -> Q_1 = 1.300 xx (⟦F:30¦26⟧) = 50 xx 30 = 1.500 Joule (terdiri dari 1.300 J kalor ruang beku + 200 J usaha listrik kompresor)."]], "m": ["Jika teknologi mekanik mesin terus disempurnakan hingga gesekan nol, kita dapat membuat mesin kalor dengan efisiensi 100% pada suhu ruang.", "Menganggap batas efisiensi mesin kalor hanya disebabkan oleh gesekan mekanik.", "Bahkan tanpa gesekan sekalipun (mesin Carnot ideal), efisiensi tetap dibatasi oleh Hukum II Termodinamika sebesar eta = 1 - ⟦F:T_2¦T_1⟧; efisiensi 100% hanya mungkin jika suhu tandon dingin T_2 mencapai nol mutlak (0 K), yang tidak mungkin dicapai."]}, "5.0": {"x": ["Jelaskan apakah reaksi berikut dapat berlangsung spontan atau tidak, serta urutkan kekuatan asam dari HF, HCl, HBr, dan HI: (a) Cl_2(g) + 2KI(aq) -> ... dan (b) I_2(s) + 2NaBr(aq) -> ...!", "Urutan daya oksidator halogen dari atas ke bawah golongan VIIA: F_2 > Cl_2 > Br_2 > I_2. Halogen yang lebih atas dapat mengoksidasi (mendesak) ion halida di bawahnya.||(a) Cl_2 berada di atas I, sehingga Cl_2 dapat mendesak I^(-) dalam KI secara SPONTAN: Cl_2(g) + 2KI(aq) -> 2KCl(aq) + I_2(s).||(b) I_2 berada di bawah Br, sehingga I_2 TIDAK DAPAT mendesak Br^(-) dalam NaBr (reaksi tidak berlangsung).||Urutan kekuatan asam halida ditentukan oleh panjang dan kemudahan putusnya ikatan H-X dari atas ke bawah: HF (asam lemah) << HCl < HBr < HI (asam terkuat).", "(a) Spontan menghasilkan 2KCl + I_2; (b) Tidak bereaksi; urutan kekuatan asam: HF < HCl < HBr < HI."], "x2": ["Suatu larutan tak berwarna mengandung campuran ion halida Br^(-) dan I^(-). Ketika ke dalam larutan dialirkan gas Cl_2 terbatas dan dikocok dengan pelarut nonpolar CCl_4, lapisan organik CCl_4 berubah menjadi berwarna ungu (I_2) terlebih dahulu, baru setelah Cl_2 ditambahkan berlebih warna ungu berubah menjadi cokelat kemerahan (Br_2). Selain itu, terdapat empat asam oksi klorin: HClO, HClO_2, HClO_3, dan HClO_4. Jelaskan: (a) mengapa I^(-) teroksidasi lebih dulu daripada Br^(-), dan (b) urutkan kekuatan keasaman dari keempat asam oksi klorin tersebut beserta alasannya!", "(a) Dalam golongan VIIA dari atas ke bawah (F_2 > Cl_2 > Br_2 > I_2), daya pengoksidasi menurun, yang berarti daya pereduksi (kemudahan teroksidasi melepas elektron) dari ion halida meningkat dari atas ke bawah: I^(-) > Br^(-) > Cl^(-) > F^(-). Karena I^(-) adalah reduktor yang lebih kuat daripada Br^(-), gas Cl_2 mengoksidasi I^(-) menjadi I_2 (ungu dalam CCl_4) terlebih dahulu.||(b) Untuk asam oksi dari unsur pusat yang sama (HClO_n), semakin banyak jumlah atom Oksigen (semakin tinggi bilangan oksidasi Cl: +1, +3, +5, +7), penarikan kerapatan elektron menjauhi ikatan O-H semakin kuat dan anion konjugasinya (ClO_4^(-)) semakin terstabilkan oleh resonansi.||Akibatnya proton H^(+) semakin mudah lepas dan kekuatan asam meningkat tajam: HClO < HClO_2 < HClO_3 < HClO_4 (asam perklorat adalah asam terkuat).", "(a) Daya reduktor I^(-) > Br^(-) sehingga I^(-) dioksidasi lebih dulu oleh Cl_2; (b) Kekuatan asam oksi: HClO < HClO_2 < HClO_3 < HClO_4."], "z": [["Jika ke dalam larutan yang mengandung ion Mg^(2+), Ca^(2+), Sr^(2+), dan Ba^(2+) dengan konsentrasi sama ditambahkan larutan Na_2SO_4 tetes demi tetes, maka kation yang akan mengendap PALING DULU adalah...", ["Mg^(2+)", "Ca^(2+)", "Sr^(2+)", "Ba^(2+)"], 3, "Kelarutan garam sulfat alkali tanah (MSO_4) dari atas ke bawah semakin KECIL (K_(sp) BaSO_4 paling kecil). Oleh karena itu, BaSO_4 memiliki kelarutan terkecil dan mengendap paling dulu."], ["Kembang api yang menghasilkan warna nyala HIJAU terang dan KUNING keemasan berturut-turut mengandung garam dari unsur...", ["Barium (Ba) dan Natrium (Na)", "Stronsium (Sr) dan Kalium (K)", "Kalsium (Ca) dan Litium (Li)", "Tembaga (Cu) dan Barium (Ba)"], 0, "Uji nyala Barium (Ba) menghasilkan warna hijau apel terang, sedangkan Natrium (Na) menghasilkan warna kuning keemasan yang khas."], ["🔥 [HOTS] Logam Magnesium (Mg) yang dibakar di udara terbuka (mengandung ~78% N_2 dan ~21% O_2) menghasilkan serbuk putih yang terdiri atas campuran MgO dan senyawa X. Jika senyawa X tersebut ditetesi air hangat, timbul gas berbau menyengat yang membirukan kertas lakmus merah basah. Rumus senyawa X dan gas yang dihasilkan adalah...", ["Mg(NO_3)_2 dan gas NO_2", "Mg_3N_2 (magnesium nitrida) dan gas NH_3 (amonia)", "MgH_2 dan gas H_2", "MgCO_3 dan gas CO_2"], 1, "Magnesium sangat reaktif saat terbakar sehingga selain bereaksi dengan O_2 membentuk MgO, juga bereaksi langsung dengan gas N_2 di udara membentuk magnesium nitrida (Mg_3N_2). Saat dihidrolisis dengan air: Mg_3N_2(s) + 6H_2O(l) -> 3Mg(OH)_2(s) + 2NH_3(g) (gas amonia bersifat basa, membirukan lakmus merah)."], ["🔥 [HOTS] Tiga tabung reaksi masing-masing berisi larutan garam halida NaCl, NaBr, dan NaI. Jika ke dalam masing-masing tabung diteteskan larutan AgNO_3 kemudian diikuti larutan amonia (NH_3) encer, pengamatan yang tepat adalah...", ["Ketiganya membentuk endapan putih yang larut semua dalam NH_3 encer", "NaCl membentuk endapan putih AgCl yang mudah larut dalam NH_3 encer (membentuk kompleks [Ag(NH_3)_2]^(+)), NaBr membentuk endapan krem AgBr yang sukar larut dalam NH_3 encer, dan NaI membentuk endapan kuning AgI yang tidak larut dalam NH_3", "Hanya NaI yang mengendap dengan AgNO_3", "AgI larut mudah dalam NH_3 encer sedangkan AgCl tidak larut"], 1, "Nilai K_(sp) menurun tajam dari AgCl (putih, 10^(-10)) > AgBr (krem, 5 xx 10^(-13)) > AgI (kuning, 8 xx 10^(-17)). Oleh karena itu, hanya endapan putih AgCl yang mudah larut dalam NH_3 encer membentuk ion kompleks [Ag(NH_3)_2]^(+)."]], "m": ["Asam fluorida (HF) adalah asam halida paling kuat karena Fluorin memiliki keelektronegatifan tertinggi.", "Menilai kekuatan asam biner H-X dalam satu golongan dari keelektronegatifan, bukan dari kekuatan dan panjang ikatan H-X.", "Dalam satu golongan dari atas ke bawah (HF ke HI), ukuran jari-jari halida membesar drastis sehingga ikatan H-I paling panjang dan paling lemah (paling mudah melepas H^(+)); akibatnya HI adalah asam terkuat dan HF justru asam lemah."]}, "5.1": {"x": ["Tentukan bilangan koordinasi, bilangan oksidasi atom pusat, dan nama IUPAC dari ion kompleks: (a) [Cu(NH_3)_4]^(2+) dan (b) [Fe(CN)_6]^(3-)!", "(a) Pada [Cu(NH_3)_4]^(2+), ligannya adalah 4 molekul NH_3 (amina, muatan 0). Bilangan koordinasi = 4.||Biloks Cu + 4(0) = +2 -> Biloks Cu = +2. Karena ion kompleks bermuatan positif, namanya: ion tetraaminatembaga(II).||(b) Pada [Fe(CN)_6]^(3-), ligannya adalah 6 ion CN^(-) (siano, muatan -1). Bilangan koordinasi = 6.||Biloks Fe + 6(-1) = -3 -> Biloks Fe = +3. Karena ion kompleks bermuatan negatif, nama besi menjadi ferat: ion heksasianoferat(III).", "(a) Bilangan koordinasi 4, biloks +2, ion tetraaminatembaga(II); (b) Bilangan koordinasi 6, biloks +3, ion heksasianoferat(III)."], "x2": ["Bandingkan sifat kemagnetan dan geometri ruang dari dua ion kompleks nikel(II) (diketahui Z Ni = 28) yang keduanya memiliki bilangan koordinasi 4 berikut: (1) ion tetrakloronikelat(II), [NiCl_4]^(2-) (dengan ligan medan lemah Cl^(-)), dan (2) ion tetrasianonikelat(II), [Ni(CN)_4]^(2-) (dengan ligan medan kuat CN^(-))!", "Konfigurasi atom netral Ni (Z = 28) adalah [Ar] 4s^2 3d^8, sehingga ion pusat Ni^(2+) memiliki konfigurasi [Ar] 3d^8 (8 elektron pada 5 orbital 3d).||(1) Pada [NiCl_4]^(2-), ion Cl^(-) adalah ligan medan lemah yang tidak mampu memasangkan 2 elektron tunggal pada subkulit 3d^8. Keempat ligan Cl^(-) menggunakan orbital luar 4s dan tiga orbital 4p -> hibridisasi sp^3, geometri Tetrahedral, dan bersifat PARAMAGNETIK (memiliki 2 elektron tak berpasangan).||(2) Pada [Ni(CN)_4]^(2-), ion CN^(-) adalah ligan medan kuat yang mendesak 2 elektron tunggal pada 3d^8 agar berpasangan ke dalam 4 orbital 3d, sehingga mengosongkan 1 orbital 3d.||Keempat ligan CN^(-) mengisi 1 orbital 3d kosong, 1 orbital 4s, dan 2 orbital 4p -> hibridisasi dsp^2, geometri Segiempat Datar (Square Planar), dan bersifat DIAMAGNETIK (0 elektron tak berpasangan)!", "[NiCl_4]^(2-): sp^3, Tetrahedral, Paramagnetik (2 elektron tunggal); [Ni(CN)_4]^(2-): dsp^2, Segiempat Datar, Diamagnetik (0 elektron tunggal)."], "z": [["Di antara ion-ion unsur periode 4 berikut: _(21)Sc^(3+), _(24)Cr^(3+), _(26)Fe^(2+), dan _(30)Zn^(2+), pasangan ion yang larutannya TIDAK BERWARNA dan bersifat diamagnetik adalah...", ["Cr^(3+) dan Fe^(2+)", "Sc^(3+) dan Zn^(2+)", "Sc^(3+) dan Cr^(3+)", "Fe^(2+) dan Zn^(2+)"], 1, "Sc^(3+) memiliki konfigurasi [Ar] 3d^0 (orbital d kosong) dan Zn^(2+) memiliki konfigurasi [Ar] 3d^(10) (orbital d penuh). Keduanya tidak memiliki elektron tak berpasangan sehingga tidak mengalami transisi d-d (tak berwarna) dan bersifat diamagnetik."], ["Sebanyak 0,1 mol senyawa kompleks CrCl_3.5H_2O dilarutkan dalam air dan direaksikan dengan larutan AgNO_3 berlebih, menghasilkan 0,2 mol endapan putih AgCl. Rumus struktur senyawa kompleks tersebut yang benar adalah...", ["[Cr(H_2O)_5Cl]Cl_2", "[Cr(H_2O)_4Cl_2]Cl.H_2O", "[Cr(H_2O)_3Cl_3].2H_2O", "[Cr(H_2O)_5]Cl_3"], 0, "Perbandingan mol kompleks : endapan AgCl = 0,1 : 0,2 = 1 : 2. Artinya setiap 1 molekul kompleks melepaskan 2 ion Cl^(-) bebas (di luar kurung siku koordinasi), sedangkan 1 ion Cl^(-) sisanya terikat kuat sebagai ligan di dalam kurung siku: [Cr(H_2O)_5Cl]Cl_2."], ["🔥 [HOTS] Diketahui nomor atom Fe = 26. Ion kompleks heksasianoferat(II) ([Fe(CN)_6]^(4-)) dengan ligan medan kuat CN^(-) memiliki hibridisasi, bentuk geometri, dan sifat kemagnetan...", ["sp^3d^2 ; Oktahedral ; Paramagnetik", "d^2sp^3 ; Oktahedral ; Diamagnetik (semua 6 elektron pada 3d^6 berpasangan di 3 orbital d)", "dsp^2 ; Segiempat Datar ; Diamagnetik", "sp^3 ; Tetrahedral ; Paramagnetik"], 1, "Dalam [Fe(CN)_6]^(4-), biloks Fe adalah +2 -> Fe^(2+) berkonfigurasi [Ar] 3d^6. Karena CN^(-) adalah ligan medan kuat, keenam elektron pada 3d^6 dipaksa berpasangan penuh menempati 3 orbital 3d, menyisakan 2 orbital 3d kosong untuk membentuk hibridisasi dalam d^2sp^3 (Oktahedral, Diamagnetik)."], ["🔥 [HOTS] Nama IUPAC yang tepat untuk senyawa koordinasi K_4[Fe(CN)_6] dan [Cr(NH_3)_4Cl_2]Cl berturut-turut adalah...", ["Kalium heksasianoferat(II) dan tetraaminadiklorokromium(III) klorida", "Kalium heksasianoferat(III) dan diklorotetraaminakromium(II) klorida", "Tetrakalium heksasianoferat(II) dan tetraaminakromium(III) triklorida", "Kalium heksasianobesi(II) dan tetraaminadiklorokromat(III) klorida"], 0, "Pada K_4[Fe(CN)_6], kation adalah kalium (tanpa awalan tetra) dan anion [Fe(CN)_6]^(4-) memiliki Fe biloks +2 -> kalium heksasianoferat(II). Pada [Cr(NH_3)_4Cl_2]Cl, ligan diurutkan alfabetis (amina sebelum kloro) dan biloks Cr adalah +3 -> tetraaminadiklorokromium(III) klorida."]], "m": ["Semua ion Cl dalam senyawa [Co(NH_3)_4Cl_2]Cl dapat mengendap sebagai AgCl saat ditambahkan larutan AgNO_3.", "Tidak membedakan ion klorida yang terikat kovalen koordinasi sebagai ligan di dalam bola koordinasi [...] dengan ion klorida penyeimbang di luar kurung siku.", "Hanya ion Cl^(-) di luar tanda kurung siku yang terionisasi bebas di dalam air dan bereaksi dengan Ag^(+) membentuk endapan AgCl."]}, "5.2": {"x": ["Mengapa pada proses Hall-Heroult untuk memperoleh logam Aluminium dari bijih bauksit (Al_2O_3) harus ditambahkan kriolit (Na_3AlF_6) dan mengapa tidak menggunakan elektrolisis larutan AlCl_3 berair?", "Al_2O_3 murni memiliki titik leleh yang sangat tinggi (> 2.000 °C). Penambahan kriolit (Na_3AlF_6) berfungsi melarutkan Al_2O_3 dan menurunkan titik leleh campuran hingga sekitar 950 °C sehingga menghemat energi listrik.||Jika menggunakan larutan AlCl_3 dalam air, ion Al^(3+) (E^0 = -1,66 V) tidak akan tereduksi di katoda karena potensial reduksinya lebih negatif daripada air.||Dalam larutan berair, yang akan tereduksi di katoda adalah molekul air menghasilkan gas H_2 (2H_2O + 2e^(-) -> H_2 + 2OH^(-)), sehingga logam Al hanya bisa diperoleh dari elektrolisis fase LELEHAN.", "Kriolit menurunkan titik leleh Al_2O_3 dari >2000 °C ke ~950 °C; elektrolisis larutan berair tidak menghasilkan logam Al karena air yang akan tereduksi menjadi gas H_2."], "x2": ["Dalam pemurnian bijih bauksit kotor (mengandung Al_2O_3 yang bersifat amfoter dan pengotor Fe_2O_3 yang bersifat basa) melalui Proses Bayer sebelum dielektrolisis pada Proses Hall-Heroult, bijih bauksit dilarutkan dalam larutan NaOH pekat panas. Jelaskan: (a) bagaimana cara ini memisahkan Al_2O_3 dari pengotor Fe_2O_3, dan (b) mengapa pada tahap elektrolisis Hall-Heroult anoda karbon (grafit) harus diganti secara berkala!", "(a) Al_2O_3 bersifat AMFOTER sehingga larut dalam basa kuat NaOH pekat membentuk larutan natrium aluminat: Al_2O_3(s) + 2NaOH(aq) + 3H_2O(l) -> 2Na[Al(OH)_4](aq).||Sebaliknya, pengotor Fe_2O_3 bersifat oksida BASA sehingga tidak bereaksi dengan larutan basa NaOH dan dapat langsung dipisahkan dengan penyaringan (sebagai lumpur merah (red mud)). Setelah disaring, larutan aluminat diasamkan atau dialiri CO_2 untuk mengendapkan kembali Al(OH)_3 murni yang kemudian dipanaskan menjadi Al_2O_3 murni.||(b) Pada elektrolisis lelehan Al_2O_3 dalam kriolit (Proses Hall-Heroult), di katoda terbentuk logam Al(l), sedangkan di anoda grafit terbentuk gas oksigen panas: 2O^(2-) -> O_2(g) + 4e^(-).||Pada suhu operasi ~950 °C, gas O_2 yang terbentuk langsung membakar anoda karbon grafit menjadi gas CO dan CO_2 (C(s) + O_2(g) -> CO_2(g)), sehingga batang anoda grafit terus terkikis habis dan wajib diganti secara berkala!", "(a) Al_2O_3 amfoter larut dalam NaOH sedangkan Fe_2O_3 basa mengendap dan disaring; (b) Anoda grafit bereaksi dengan gas O_2 panas membentuk gas CO_2 sehingga habis terkikis."], "z": [["Pasangan yang tepat antara nama unsur, mineral bijihnya, dan nama proses pengolahannya adalah...", ["Aluminium – Hematit – Hall-Heroult", "Besi – Kalkopirit – Tanur Tinggi", "Belerang – Pirit – Proses Kontak", "Aluminium – Bauksit – Hall-Heroult"], 3, "Aluminium diperoleh dari bijih Bauksit (Al_2O_3.nH_2O) melalui proses Hall-Heroult. (Hematit adalah bijih besi; Kalkopirit adalah bijih tembaga; Proses Kontak adalah pembuatan H_2SO_4)."], ["Pada pengolahan besi di dalam Tanur Tinggi (Blast Furnace), fungsi penambahan batu kapur (CaCO_3) adalah...", ["Mereduksi bijih Fe_2O_3 menjadi besi cair", "Mengikat pengotor silika (pasir SiO_2) membentuk cairan terak (slag) CaSiO_3", "Menaikkan suhu pembakaran kokas", "Mencegah besi cair mengalami perkaratan"], 1, "CaCO_3 terurai menjadi CaO (oksida basa) yang kemudian bereaksi dengan pengotor asam SiO_2 membentuk terak CaSiO_3 yang mengapung di atas besi cair sehingga mudah dipisahkan."], ["🔥 [HOTS] Dalam pembuatan asam sulfat (H_2SO_4) melalui Proses Kontak, gas SO_3 hasil oksidasi katalitik TIDAK langsung dilarutkan ke dalam air murni, melainkan diserap ke dalam H_2SO_4 pekat 98% membentuk asam pirosulfat (oleum, H_2S_2O_7) baru kemudian diencerkan dengan air. Alasan teknis utama prosedur ini adalah...", ["Gas SO_3 tidak dapat bereaksi sama sekali dengan air murni", "Reaksi langsung SO_3(g) dengan H_2O(l) sangat eksotermik dan menghasilkan kabut asam sulfat halus yang sangat sulit mengembun dan berbahaya", "Untuk menghemat penggunaan katalis V_2O_5", "Agar terbentuk gas SO_2 kembali"], 1, "Reaksi SO_3(g) + H_2O(l) -> H_2SO_4 sangat eksoterm sehingga menguapkan air dan menciptakan aerosol (kabut) H_2SO_4 yang sukar dipisahkan dari aliran gas. Penyerapan dengan H_2SO_4 pekat menjadi oleum (H_2S_2O_7) berlangsung mulus tanpa kabut."], ["🔥 [HOTS] Pada ekstraksi logam Tembaga dari bijih kalkopirit (CuFeS_2), setelah pemanggangan diperoleh tembaga(I) sulfida (Cu_2S) yang kemudian direduksi menjadi tembaga lepuh (blister copper) hanya dengan meniupkan udara panas tanpa tambahan kokas karbon. Reaksi reduksi diri (auto-reduksi) yang terjadi adalah...", ["Cu_2S(l) + O_2(g) -> 2Cu(l) + SO_2(g) dilanjutkan 2Cu_2O + Cu_2S -> 6Cu(l) + SO_2(g)", "Cu_2S + 2C -> 2Cu + CS_2", "Cu_2S + H_2 -> 2Cu + H_2S", "Cu_2S + CaCO_3 -> 2Cu + CaS + CO_2"], 0, "Sebagian Cu_2S dioksidasi oleh udara menjadi Cu_2O, lalu Cu_2O bereaksi dengan sisa Cu_2S melalui reaksi redoks spontan: 2Cu_2O + Cu_2S -> 6Cu(l) + SO_2(g)."]], "m": ["Mineral Pirit (FeS_2) yang berwarna kuning keemasan adalah bijih utama untuk memproduksi besi di Tanur Tinggi.", "Melihat rumus kimia FeS_2 yang mengandung Fe tanpa mempertimbangkan kandungan belerangnya.", "Pirit (emas palsu (fool's gold)) jarang digunakan sebagai bijih besi utama karena kandungan belerangnya tinggi (membuat besi rapuh dan menghasilkan polusi gas SO_2); bijih utama besi adalah Hematit (Fe_2O_3) dan Magnetit (Fe_3O_4)."]}, "5.3": {"x": ["Nuklida karbon радиоaktif ^(14)_(6)C bersifat tidak stabil dibandingkan isotop stabilnya ^(12)_(6)C. Tentukan posisi ^(14)_(6)C terhadap pita kestabilan dan tuliskan persamaan reaksi peluruhannya untuk mencapai kestabilan!", "Pada ^(14)_(6)C terdapat proton p = 6 dan neutron n = 14 - 6 = 8, sehingga rasio ⟦F:n¦p⟧ = ⟦F:8¦6⟧ = 1,33 (lebih besar dari 1,0 untuk unsur ringan).||Karena kelebihan neutron (n > p), nuklida ^(14)_(6)C terletak di ATAS pita kestabilan.||Untuk menurunkan rasio ⟦F:n¦p,⟧ satu neutron diubah menjadi proton dengan memancarkan partikel beta negatif (^(0)_(-1)e).||Persamaan peluruhannya: ^(14)_(6)C -> ^(14)_(7)N + ^(0)_(-1)e (menghasilkan inti nitrogen-14 yang stabil dengan p = 7 dan n = 7, rasio ⟦F:n¦p⟧ = 1).", "Terletak di atas pita kestabilan (kelebihan neutron) dan meluruh dengan memancarkan partikel beta: ^(14)_(6)C -> ^(14)_(7)N + ^(0)_(-1)e."], "x2": ["Dalam deret peluruhan radioaktif Uranium-238 menuju isotop stabil Timbal-206: ^(238)_(92)U -> ^(206)_(82)Pb + x ^(4)_2alpha + y ^(0)_(-1)beta, sebuah inti induk melalui serangkaian tahapan peluruhan berurutan. Hitunglah: (a) nilai x (jumlah partikel alfa) dan nilai y (jumlah partikel beta), serta (b) jika pada 3 tahap pertama ^(238)_(92)U memancarkan berturut-turut 1 partikel alfa, lalu 1 beta, lalu 1 beta lagi, tentukan notasi nuklida hasil tahap ke-3 tersebut dan hubungannya dengan nuklida awal!", "(a) Dari kekekalan nomor massa (atas): 238 = 206 + 4x + 0y -> 4x = 32 -> x = 8 partikel alfa.||Dari kekekalan nomor atom (bawah): 92 = 82 + 2x - y -> 92 = 82 + 2(8) - y -> 92 = 98 - y -> y = 6 partikel beta.||(b) Tahap 1 (pancar alfa): ^(238)_(92)U -> ^(234)_(90)Th + ^(4)_2He. Tahap 2 (pancar beta): ^(234)_(90)Th -> ^(234)_(91)Pa + ^(0)_(-1)e.||Tahap 3 (pancar beta): ^(234)_(91)Pa -> ^(234)_(92)U + ^(0)_(-1)e. Nuklida hasil tahap ke-3 adalah ^(234)_(92)U yang memiliki nomor atom sama (Z = 92) dengan ^(238)_(92)U, sehingga keduanya merupakan pasangan ISOTOP!", "(a) 8 partikel alfa dan 6 partikel beta; (b) Hasil tahap ke-3 adalah ^(234)_(92)U yang merupakan isotop dari ^(238)_(92)U."], "z": [["Nuklida Thorium ^(234)_(90)Th meluruh menjadi Radium ^(226)_(88)Ra dengan memancarkan sejumlah partikel alfa (^(4)_(2)He) dan partikel beta (^(0)_(-1)e). Jumlah partikel alfa dan beta yang dipancarkan adalah...", ["1 alfa dan 2 beta", "2 alfa dan 2 beta", "2 alfa dan 1 beta", "3 alfa dan 4 beta"], 1, "Selisih nomor massa atas: Delta A = 234 - 226 = 8. Karena hanya alfa yang bermassa 4, jumlah alfa = ⟦F:8¦4⟧ = 2 partikel alfa. Dari nomor atom bawah: 90 = 88 + 2(2) + x(-1) -> 90 = 92 - x -> x = 2 partikel beta."], ["Suatu isotop ringan ^(23)_(12)Mg memiliki 12 proton dan 11 neutron (⟦F:n¦p⟧ < 1, di bawah pita kestabilan). Untuk mencapai kestabilan menjadi ^(23)_(11)Na, inti ^(23)_(12)Mg akan...", ["Memancarkan partikel alfa (^(4)_(2)He)", "Memancarkan ⟦F:elektron¦beta⟧ negatif (^(0)_(-1)e)", "Memancarkan positron (^(0)_(+1)e)", "Memancarkan neutron (^(1)_(0)n)"], 2, "Persamaan inti: ^(23)_(12)Mg -> ^(23)_(11)Na + ^(0)_(+1)e. Inti di bawah pita kestabilan (kelebihan proton) memancarkan positron (^(0)_(+1)e) untuk mengubah 1 proton menjadi neutron."], ["🔥 [HOTS] Reaksi transmutasi inti penemuan neutron oleh James Chadwick ditulis dengan notasi singkat: ^(9)_4Be(alpha, n)X. Notasi nuklida X yang terbentuk pada reaksi inti tersebut adalah...", ["^(12)_6C", "^(13)_6C", "^(12)_5B", "^(14)_7N"], 0, "Notasi ^(9)_4Be(alpha, n)X berarti: ^(9)_4Be + ^(4)_2He -> ^(1)_0n + ^(A)_ZX. Dari nomor massa: 9 + 4 = 1 + A -> A = 12. Dari nomor atom: 4 + 2 = 0 + Z -> Z = 6. Maka X adalah karbon-12 (^(12)_6C)."], ["🔥 [HOTS] Suatu inti radioaktif ^(A)_ZX mengalami tangkapan elektron kulit K (K-capture) disertai pemancaran satu partikel alfa. Inti baru yang dihasilkan memiliki nomor massa dan nomor atom...", ["Nomor massa (A - 4) dan nomor atom (Z - 3)", "Nomor massa (A - 4) dan nomor atom (Z - 1)", "Nomor massa (A - 4) dan nomor atom (Z - 2)", "Nomor massa A dan nomor atom (Z - 1)"], 0, "Persamaan reaksi: ^(A)_ZX + ^(0)_(-1)e -> ^(A')_(Z')Y + ^(4)_2He. Atas: A + 0 = A' + 4 -> A' = A - 4. Bawah: Z + (-1) = Z' + 2 -> Z' = Z - 3."]], "m": ["Sinar gamma (gamma) yang dipancarkan oleh inti radioaktif akan dibelokkan ke arah keping bermuatan negatif dalam medan listrik.", "Menganggap sinar gamma adalah partikel bermuatan listrik seperti alfa (+2) dan beta (-1).", "Sinar gamma (^(0)_(0)gamma) adalah gelombang elektromagnetik berenergi tinggi yang tidak bermassa dan tidak bermuatan listrik, sehingga lintasannya tetap lurus di dalam medan listrik maupun medan magnet."]}, "5.4": {"x": ["Fosil kayu purba ditemukan memiliki aktivitas Karbon-14 (^(14)C) hanya tinggal 12,5% dibandingkan aktivitas ^(14)C pada pohon yang masih hidup. Jika waktu paruh ^(14)C adalah 5.730 tahun, berapakah perkiraan umur fosil kayu tersebut?", "Fraksi radioisotop ^(14)C yang tersisa adalah ⟦F:N_t¦N_0⟧ = 12,5% = ⟦F:12,5¦100⟧ = ⟦F:1¦8.⟧||Dari rumus ⟦F:N_t¦N_0⟧ = (⟦F:1¦2⟧)^n, maka ⟦F:1¦8⟧ = (⟦F:1¦2⟧)^n -> (⟦F:1¦2⟧)^3 = (⟦F:1¦2⟧)^n, sehingga jumlah waktu paruh n = 3.||Hubungan waktu peluruhan t = n × t_(⟦F:1¦2⟧) = 3 × 5.730 tahun = 17.190 tahun.", "17.190 tahun"], "x2": ["Suatu sediaan radiomedis mengandung dua radioisotop P dan Q yang meluruh secara independen. Waktu paruh radioisotop P adalah 3 jam, sedangkan waktu paruh radioisotop Q adalah 6 jam. Pada saat t = 0, jumlah atom (mol) radioisotop P adalah 4 kali jumlah atom radioisotop Q (N_(P,0) = 4 N_(Q,0)). Hitunglah: (a) setelah berapa jam jumlah atom P dan Q yang tersisa menjadi sama banyak (N_P = N_Q), dan (b) setelah berapa jam AKTIVITAS peluruhan (A = lambda N) dari P dan Q menjadi sama besar!", "(a) Setelah waktu t jam, jumlah waktu paruh untuk P adalah n_P = ⟦F:t¦3⟧ dan untuk Q adalah n_Q = ⟦F:t¦6.⟧ Persamaan jumlah atom tersisa: N_P(t) = 4 N_0 (⟦F:1¦2⟧)^(⟦F:t¦3⟧) dan N_Q(t) = N_0 (⟦F:1¦2⟧)^(⟦F:t¦6⟧).||Samakan N_P(t) = N_Q(t): 4 xx (⟦F:1¦2⟧)^(⟦F:t¦3⟧) = (⟦F:1¦2⟧)^(⟦F:t¦6⟧) -> (⟦F:1¦2⟧)^(-2) xx (⟦F:1¦2⟧)^(⟦F:2t¦6⟧) = (⟦F:1¦2⟧)^(⟦F:t¦6⟧) -> -2 + (⟦F:2t¦6⟧) = ⟦F:t¦6⟧ -> ⟦F:t¦6⟧ = 2 -> t = 12 jam!||(b) Aktivitas radioaktif adalah A = lambda N = (ln ⟦F:2¦t_(⟦F:1¦2⟧)⟧) N. Karena t_(⟦F:1¦2⟧, P) = 3 jam dan t_(⟦F:1¦2⟧, Q) = 6 jam, maka lambda_P = 2 lambda_Q.||Agar aktivitasnya sama (A_P = A_Q), haruslah lambda_P N_P = lambda_Q N_Q -> 2 N_P = N_Q -> 2 xx 4 N_0 (⟦F:1¦2⟧)^(⟦F:t¦3⟧) = N_0 (⟦F:1¦2⟧)^(⟦F:t¦6⟧) -> 8 (⟦F:1¦2⟧)^(⟦F:2t¦6⟧) = (⟦F:1¦2⟧)^(⟦F:t¦6⟧) -> -3 + (⟦F:2t¦6⟧) = ⟦F:t¦6⟧ -> ⟦F:t¦6⟧ = 3 -> t = 18 jam!", "(a) Jumlah inti sama (N_P = N_Q) setelah 12 jam; (b) Aktivitas sama (A_P = A_Q) setelah 18 jam."], "z": [["Suatu radioisotop memiliki waktu paruh 8 hari. Jika mula-mula disimpan 64 gram radioisotop tersebut, maka massa radioisotop yang SUDAH MELURUH setelah 24 hari adalah...", ["8 gram", "16 gram", "48 gram", "56 gram"], 3, "Jumlah waktu paruh n = ⟦F:24¦8⟧ = 3 kali. Massa yang TERSISA setelah 24 hari: N_t = 64 × (⟦F:1¦2⟧)^3 = ⟦F:64¦8⟧ = 8 gram. Maka massa yang SUDAH MELURUH = 64 - 8 = 56 gram!"], ["Pasangan radioisotop yang digunakan untuk mendeteksi gangguan kelenjar gondok (tiroid) dan untuk melacak penyumbatan peredaran darah berturut-turut adalah...", ["I-131 dan Na-24", "Co-60 dan C-14", "Na-24 dan P-32", "U-235 dan I-131"], 0, "Iodin-131 (I-131) diserap spesifik oleh kelenjar tiroid (gondok), sedangkan Natrium-24 (Na-24, dalam bentuk larutan NaCl) digunakan sebagai perunut aliran darah maupun kebocoran pipa."], ["🔥 [HOTS] Suatu sampel mineral batuan mengandung radioisotop induk X dan isotop anak stabil Y. Setelah dianalisis, ternyata massa isotop Y yang terbentuk sudah mencapai 87,5% dari total mol inti (X + Y) di dalam batuan tersebut. Jika waktu paruh X adalah 2,0 xx 10^8 tahun, maka umur batuan tersebut adalah...", ["2,0 xx 10^8 tahun", "4,0 xx 10^8 tahun", "6,0 xx 10^8 tahun", "8,0 xx 10^8 tahun"], 2, "Jika 87,5% telah meluruh menjadi inti anak Y, maka fraksi inti induk X yang MASIH TERSISA adalah 100% - 87,5% = 12,5% = ⟦F:1¦8⟧ = (⟦F:1¦2⟧)^3. Maka n = 3 kali waktu paruh -> umur batuan t = 3 xx (2,0 xx 10^8 tahun) = 6,0 xx 10^8 tahun."], ["🔥 [HOTS] Pencacah Geiger-Muller mencatat aktivitas suatu sampel radioisotop sebesar 1.600 Bq pada pukul 08.00 pagi (termasuk radiasi latar (background) konstan sebesar 100 Bq dari lingkungan). Pada pukul 11.00 siang di hari yang sama, alat mencatat angka 475 Bq. Waktu paruh radioisotop murni tersebut adalah...", ["60 menit", "90 menit", "120 menit", "180 menit"], 1, "Jebakan radiasi latar! Kurangi dulu bacaan alat dengan radiasi latar (100 Bq): Aktivitas murni awal (08.00) A_0 = 1.600 - 100 = 1.500 Bq. Aktivitas murni akhir (11.00, selang t = 3 jam = 180 menit) A_t = 475 - 100 = 375 Bq. Rasio ⟦F:A_t¦A_0⟧ = ⟦F:375¦1.500⟧ = ⟦F:1¦4⟧ = (⟦F:1¦2⟧)^2 -> n = 2 kali waktu paruh. Maka t_(⟦F:1¦2⟧) = 180 ⟦F:menit¦2⟧ = 90 menit (1,5 jam)!"]], "m": ["Jika waktu paruh suatu zat radioaktif adalah 10 menit, maka setelah 20 menit zat tersebut akan habis hoàn toàn (tersisa 0 gram).", "Menganggap peluruhan radioaktif berkurang secara linear (50% + 50% = 100% habis).", "Peluruhan bersifat eksponensial: pada 10 menit pertama berkurang setengahnya (sisa 50%), dan pada 10 menit kedua berkurang setengah dari sisanya (sisa ⟦F:1¦2⟧ × 50% = 25%), bukan habis menjadi nol."]}, "5.5": {"x": ["Air sumur di suatu daerah kapur menyebabkan sabun sukar berbusa dan meninggalkan kerak putih di dasar ketel saat direbus. Namun, sampel air sumur lain tetap membuat sabun sukar berbusa meskipun sudah direbus mendidih. Jelaskan jenis kesadahan pada kedua sampel air tersebut dan cara mengatasinya!", "Sampel pertama meninggalkan kerak putih (CaCO_3) saat direbus dan kesadahannya hilang setelah pemanasan: merupakan Air Sadah Sementara yang mengandung garam bikarbonat Ca(HCO_3)_2 atau Mg(HCO_3)_2.||Reaksi saat direbus: Ca(HCO_3)_2(aq) --(panas)--> CaCO_3(s) + H_2O(l) + CO_2(g). Ion Ca^(2+) terendapkan sehingga air menjadi lunak.||Sampel kedua tetap sadah meskipun sudah direbus: merupakan Air Sadah Tetap yang mengandung garam sulfat atau klorida (CaSO_4, MgSO_4, CaCl_2).||Cara mengatasi kesadahan tetap adalah dengan menambahkan soda abu (Na_2CO_3) agar ion ⟦F:Ca^(2+)¦Mg^(2+)⟧ mengendap sebagai karbonat: CaSO_4(aq) + Na_2CO_3(aq) -> CaCO_3(s) + Na_2SO_4(aq).", "Sampel 1 adalah sadah sementara (Ca(HCO_3)_2, diatasi dengan pemanasan); Sampel 2 adalah sadah tetap (CaSO_4 atau CaCl_2, diatasi dengan penambahan Na_2CO_3)."], "x2": ["Sebuah pabrik kimia memproduksi etilen oksida (C_2H_4O, Mr = 44) melalui dua jalur reaksi alternatif:\nJalur I (Proses Klorohidrin Klasik): C_2H_4 + Cl_2 + Ca(OH)_2 -> C_2H_4O + CaCl_2 + H_2O (Mr C_2H_4=28, Cl_2=71, Ca(OH)_2=74, CaCl_2=111, H_2O=18).\nJalur II (Proses Oksidasi Katalitik Modern): C_2H_4 + ⟦F:1¦2⟧ O_2 --(katalis Ag)--> C_2H_4O (Mr O_2=32).\nHitunglah persentase Ekonomi Atom (%Atom Economy) dari Jalur I dan Jalur II, lalu jelaskan mengapa Jalur II jauh lebih unggul menurut prinsip Kimia Hijau!", "Rumus Ekonomi Atom: %EA = (⟦F:Mr Produk Target¦Total Mr Reaktan⟧) xx 100%.||Pada Jalur I: produk target adalah C_2H_4O (Mr = 44). Total Mr reaktan = 28 (C_2H_4) + 71 (Cl_2) + 74 (Ca(OH)_2) = 173 ⟦F:g¦mol⟧ (sama dengan 44 + 111 + 18 = 173).||Maka %EA Jalur I = (⟦F:44¦173⟧) xx 100% = 25,43% (hampir 75% massa reaktan terbuang menjadi limbah garam CaCl_2 dan air!).||Pada Jalur II (reaksi adisi langsung dengan katalis Ag): total Mr reaktan = 28 (C_2H_4) + ⟦F:1¦2⟧(32) = 44 ⟦F:g¦mol⟧, dan seluruh atom masuk menjadi C_2H_4O (Mr = 44) tanpa produk samping -> %EA Jalur II = (⟦F:44¦44⟧) xx 100% = 100%!", "%Ekonomi Atom Jalur I = 25,4% sedangkan Jalur II = 100% (bebas limbah hasil samping dan menggunakan katalis)."], "z": [["Gas pencemar udara hasil pembakaran tidak sempurna bahan bakar kendaraan bermotor yang sangat berbahaya karena memiliki daya ikat terhadap hemoglobin (Hb) 200 kali lebih kuat daripada oksigen adalah...", ["Karbon dioksida (CO_2)", "Karbon monoksida (CO)", "Belerang dioksida (SO_2)", "Klorofluorokarbon (CFC)"], 1, "Gas karbon monoksida (CO) tidak berwarna dan tidak berbau, serta mengikat Hb membentuk karboksihemoglobin (HbCO) yang menghambat pengangkutan O_2 ke jaringan tubuh."], ["Berdasarkan 12 prinsip Kimia Hijau (Green Chemistry), jenis reaksi organik yang memiliki nilai Ekonomi Atom (Atom Economy) paling ideal (mencapai 100% tanpa produk sampingan) adalah...", ["Reaksi substitusi", "Reaksi eliminasi", "Reaksi adisi", "Reaksi kondensasi"], 2, "Pada reaksi adisi (A + B -> AB), seluruh atom dari reaktan bergabung masuk ke dalam satu produk tunggal yang diinginkan tanpa menghasilkan produk samping (limbah), sehingga ekonomi atomnya 100%."], ["🔥 [HOTS] Sebanyak 100 liter sampel air sumur di daerah industri mengandung kesadahan sementara berupa Ca(HCO_3)_2 0,002 M dan kesadahan tetap berupa MgSO_4 0,003 M. Jika kesadahan sementara dihilangkan terlebih dahulu dengan pendidihan sempurna, maka massa minimum soda abu (Na_2CO_3, Mr = 106) yang masih perlu ditambahkan untuk menghilangkan sisa kesadahan tetapnya adalah...", ["21,2 gram", "31,8 gram", "53,0 gram", "10,6 gram"], 1, "Kesadahan sementara Ca(HCO_3)_2 telah hilang mengendap sebagai CaCO_3 saat pendidihan. Yang tersisa hanyalah kesa
