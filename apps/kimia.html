<header class="top"><div class="brand" onclick="home()" style="cursor:pointer"><svg class="atom" viewBox="0 0 64 64" aria-hidden="true"><g class="orb" fill="none" stroke="#fff" stroke-width="2.2"><ellipse cx="32" cy="32" rx="28" ry="11"/><ellipse cx="32" cy="32" rx="28" ry="11" transform="rotate(60 32 32)"/><ellipse cx="32" cy="32" rx="28" ry="11" transform="rotate(-60 32 32)"/><circle cx="56" cy="18" r="3.6" fill="#fde047" stroke="none"/><circle cx="8" cy="46" r="3.6" fill="#fb923c" stroke="none"/><circle cx="48" cy="52" r="3.6" fill="#7dd3fc" stroke="none"/></g><circle cx="32" cy="32" r="7" fill="#fde047"/></svg><div class="bt"><b>KIMIA<span>ICG</span></b><small>Konsep · Simulasi · Latihan TKA</small></div></div><div class="sb2"><input id="q" placeholder="🔎 Cari atom, stoikiometri, buffer, Ksp, laju, elektrokimia…"></div><div class="act"><button class="mnb" onclick="openMenu()">☰ Bab</button><div class="thw"><button id="thb">🎨 Tampilan</button><div id="thp"></div></div></div></header>

<script>
const CH=[{"n": "Kimia Dasar", "e": "⚛️", "c": "#5b5bf0", "z": "", "i": "Fondasi struktur atom, sistem periodik, ikatan kimia, geometri molekul, hingga stoikiometri reaksi.", "S": [["1.1 Struktur Atom", "<b>Konsep:</b> Atom tersusun atas inti atom (proton bermuatan +1 dan neutron tak bermuatan) serta elektron bermuatan -1 yang bergerak mengelilingi inti. Notasi nuklida ditulis ^(A)_(Z)X, di mana Z adalah nomor atom (jumlah proton) dan A adalah nomor massa (proton + neutron). Pada atom netral, jumlah elektron sama dengan jumlah proton (e = Z). Pada ion bermuatan q, jumlah elektron adalah e = Z - q. <b>Langkah soal:</b> (1) Identifikasi nomor atom Z dan nomor massa A dari notasi unsur atau ion. (2) Hitung jumlah proton p = Z dan neutron n = A - Z. (3) Untuk ion positif (kation X^(+q)), kurangi elektron: e = Z - q; untuk ion negatif (anion X^(-q)), tambahkan elektron: e = Z + |q|. (4) Kelompokkan pasangan spesi ke dalam isotop (Z sama, A beda), isobar (A sama, Z beda), atau isoton (n = A - Z sama), serta isoelektron (jumlah elektron e sama). <b>Jebakan:</b> Siswa sering menambah elektron pada ion positif seperti Fe^(3+) atau lupa bahwa melepas elektron sama sekali tidak mengubah jumlah proton di dalam inti atom. <b>Poin TKA:</b> Soal TKA sering menguji pasangan isoelektron (misal Na^(+), Mg^(2+), F^(-), Ne yang sama-sama memiliki 10 elektron) dan dikaitkan dengan ukuran jari-jari ionnya.", "A = Z + n ; n = A - Z ; e = Z - q ; m_(rata) = ⟦F:x_1 A_1 + x_2 A_2¦100⟧", ["nuklida"]], ["1.2 Teori Model Atom", "<b>Konsep:</b> Perkembangan model atom dimulai dari Dalton (bola pejal tak terbagi), Thomson (roti kismis: bola bermuatan positif dengan elektron tersebar), Rutherford (inti atom kecil bermuatan positif dari hamburan sinar alfa pada lempeng emas), Bohr (elektron mengorbit pada lintasan stasioner dengan tingkat energi terkuantisasi), hingga Mekanika Kuantum (Schrodinger, de Broglie, Heisenberg: orbital sebagai daerah kebolehjadian menemukan elektron yang dinyatakan dengan 4 bilangan kuantum n, l, m, s). <b>Langkah soal:</b> (1) Tulis konfigurasi elektron berdasarkan prinsip Aufbau (urutan tingkat energi 1s, 2s, 2p, 3s, 3p, 4s, 3d, dst.), aturan Hund, dan larangan Pauli. (2) Ingat pengecualian kestabilan setengah penuh dan penuh pada subkulit d: Cr (Z=24: [Ar] 4s^1 3d^5) dan Cu (Z=29: [Ar] 4s^1 3d^(10)). (3) Untuk menentukan 4 bilangan kuantum elektron terakhir: n = nomor kulit, l = subkulit (s=0, p=1, d=2, f=3), m = posisi orbital (-l sampai +l), dan s = arah spin (+⟦F:1¦2⟧ atau -⟦F:1¦2⟧). <b>Jebakan:</b> Saat mengonfigurasi ion logam transisi (misal Fe^(2+) atau Ti^(2+)), elektron yang dilepas lebih dulu adalah elektron pada kulit terluar (4s), BUKAN subkulit 3d! <b>Poin TKA:</b> TKA sangat sering menanyakan keempat bilangan kuantum elektron terakhir dari atom netral maupun konfigurasi elektron ion logam transisi.", "E_n = ⟦F:-13,6¦n^2⟧ eV ; Delta E = h ⟦F:c¦lambda⟧ ; l = 0..(n-1) ; m = -l..+l", ["bohr"]], ["1.3 Sistem Periodik Unsur (SPU)", "<b>Konsep:</b> Sistem Periodik Modern disusun berdasarkan kenaikan nomor atom (Henry Moseley) dan kemiripan konfigurasi elektron valensi. Baris horizontal disebut Periode (menunjukkan nomor kulit terbesar n), sedangkan kolom vertikal disebut Golongan (menunjukkan jumlah elektron valensi). Unsur dikelompokkan menjadi blok s dan p (Golongan Utama (A)), blok d (Logam Transisi (Golongan B)), serta blok f (Lantanida pada periode 6 dan Aktinida pada periode 7). <b>Langkah soal:</b> (1) Buat konfigurasi elektron atom netral (bukan ion!). (2) Tentukan Periode = nilai n terbesar dalam konfigurasi tersebut. (3) Tentukan Golongan dari subkulit elektron valensi: jika berakhir di ns^x -> Golongan xA; ns^2 np^y -> Golongan (2+y)A; ns^x (n-1)d^y -> Golongan B dengan menjumlahkan elektron s + d (jumlah 8, 9, 10 masuk Golongan VIIIB; jumlah 11 masuk IB; jumlah 12 masuk IIB). <b>Jebakan:</b> Menentukan golongan dan periode langsung dari jumlah elektron ion (misal mencari letak Ca^(2+) dari 18 elektron sehingga dikira golongan VIIIA). <b>Poin TKA:</b> Kembalikan dulu jumlah elektron ion ke kondisi atom netral (Z) sebelum menentukan letak periode dan golongan pada SPU!", "Periode = n_(maks) ; Gol A = e_(val) (ns + np) ; Gol B = e_(val) (ns + (n-1)d)", ["spu"]], ["1.4 Sifat Periodik Unsur", "<b>Konsep:</b> Sifat periodik unsur ditentukan oleh tarik-menarik antara muatan inti efektif (Z_(eff)) dan jumlah kulit elektron: (1) Jari-jari atom (r): jarak inti ke kulit terluar; dalam satu golongan dari atas ke bawah makin besar (kulit bertambah), dalam satu periode dari kiri ke kanan makin kecil (Z_(eff) membesar sehingga kulit tertarik ke dalam). (2) Energi Ionisasi (EI): energi minimum untuk melepas 1 elektron dari atom fase gas. (3) Afinitas Elektron (AE): perubahan energi saat atom fase gas menangkap 1 elektron. (4) Keelektronegatifan (EN): kecenderungan atom menarik pasangan elektron ikatan. <b>Langkah soal:</b> (1) Kelompokkan unsur berdasarkan periode dan golongannya. (2) Ingat aturan umum dari kiri ke kanan dalam satu periode: Jari-jari dan sifat logam TURUN, sedangkan EI, AE, dan EN NAIK. (3) Waspadai anomali Energi Ionisasi pertama dalam satu periode antara Golongan IIA vs IIIA dan Golongan VA vs VIA! <b>Jebakan:</b> Menganggap grafik energi ionisasi periode 2 dan 3 selalu naik lurus dari kiri ke kanan. Padahal EI Golongan IIA > IIIA (misal Be > B, Mg > Al) karena subkulit ns^2 penuh, dan EI Golongan VA > VIA (misal N > O, P > S) karena subkulit np^3 setengah penuh yang stabil! <b>Poin TKA:</b> Selain anomali EI (IIA > IIIA dan VA > VIA), perhatikan bahwa Gas Mulia (VIIIA) memiliki EI tertinggi di periodenya tetapi TIDAK memiliki nilai keelektronegatifan terbesar (EN terbesar adalah Golongan VIIA (Fluorin)).", "Z_(eff) = Z - sigma ; r: Kiri-Bawah Besar ; EI, EN: Kanan-Atas Besar ; Anomali EI: IIA > IIIA & VA > VIA", ["periodik"]], ["1.5 Ikatan Kimia", "<b>Konsep:</b> Atom berikatan untuk mencapai kestabilan konfigurasi gas mulia (kaidah duplet 2 elektron untuk H, He, Li, atau Be atau oktet 8 elektron valensi). (1) Ikatan Ionik: serah-terima elektron antara logam (elektropositif, melepas e^(-)) dan nonlogam (elektronegatif, menangkap e^(-)), menghasilkan gaya elektrostatik kuat. (2) Ikatan Kovalen: pemakaian bersama pasangan elektron antar-nonlogam (tunggal, rangkap 2, rangkap 3, atau kovalen koordinasi di mana PEI berasal dari satu atom saja). (3) Ikatan Logam: lautan elektron valensi yang terdelokalisasi di sekitar ion-ion positif logam. <b>Langkah soal:</b> (1) Cek jenis unsur penyusunnya: Logam + Nonlogam umumnya ionik (kecuali BeCl_2 dan AlCl_3 yang kovalen!), Nonlogam + Nonlogam adalah kovalen. (2) Gambar struktur Lewis dengan menghitung total elektron valensi dan menempatkan atom dengan keelektronegatifan lebih rendah (selain H) sebagai atom pusat. (3) Periksa kepolaran molekul: senyawa kovalen bersifat POLAR jika memiliki PEB pada atom pusat atau bentuk molekulnya tidak simetris (momen dipol mu != 0). <b>Jebakan:</b> Menganggap semua senyawa ionik hanya menghantarkan listrik dalam fase lelehan maupun larutan DAN semua senyawa kovalen tidak dapat menghantarkan listrik. Padahal senyawa kovalen polar (seperti HCl, H_2SO_4) dalam air mengalami ionisasi sehingga larutannya menghantarkan listrik (tetapi lelehannya tidak!). <b>Poin TKA:</b> Cara membedakan senyawa Ionik vs Kovalen Polar dari tabel data daya hantar listrik: Ionik menghantarkan listrik pada fase LELEHAN maupun LARUTAN, sedangkan Kovalen Polar HANYA menghantarkan listrik pada fase LARUTAN (lelehan murninya tidak menghantarkan listrik).", "Q_(formal) = e_(val) - e_(bebas) - ⟦F:1¦2⟧ e_(ikatan) ; mu = q xx d ; Delta EN > 1,7 -> Ionik", ["ikatan"]], ["1.6 Bentuk Molekul", "<b>Konsep:</b> Teori Domain Elektron (VSEPR) (Valence Shell Electron Pair Repulsion) menyatakan bahwa pasangan elektron di sekitar atom pusat akan saling menolak sejauh mungkin untuk meminimalkan tolakan. Kekuatan tolakan: PEB-PEB > PEB-PEI > PEI-PEI. Rumus tipe molekul ditulis AX_mE_n dengan A = atom pusat, X = jumlah domain ikatan (PEI), dan E = jumlah pasangan elektron bebas (PEB). <b>Langkah soal:</b> (1) Tentukan elektron valensi atom pusat (EV). (2) Hitung jumlah domain ikatan X = jumlah atom yang diikat. (3) Hitung elektron yang dipakai berikatan: untuk atom monovalen (H, F, Cl, Br, I) masing-masing butuh 1 elektron; untuk atom divalen seperti O butuh 2 elektron per atom O. (4) Hitung PEB (E) = ⟦F:EV - elektron terpakai - muatan ion¦2.⟧ (5) Tentukan hibridisasi dari total domain (X + E): 2 = sp, 3 = sp^2, 4 = sp^3, 5 = sp^3d, 6 = sp^3d^2. <b>Jebakan:</b> Menghitung ikatan rangkap dua (seperti pada CO_2 atau SO_2) sebagai 2 domain ikatan. Dalam teori VSEPR, ikatan rangkap 2 atau rangkap 3 tetap dihitung sebagai SATU domain elektron ikatan (X = 1), tetapi memakan 2 atau 3 elektron valensi atom pusat saat menghitung sisa PEB! <b>Poin TKA:</b> Hafalkan turunan geometri dari domain 4 (AX_4 tetrahedral 109,5°, AX_3E piramida trigonal ~107°, AX_2E_2 bentuk V ~104,5°), domain 5 (AX_5 bipiramida trigonal, AX_4E jungkat-jungkit, AX_3E_2 bentuk T, AX_2E_3 linear), dan domain 6 (AX_6 oktahedral, AX_5E piramida segiempat, AX_4E_2 segiempat datar).", "E = ⟦F:EV_(pusat) - e_(ikatan) - q¦2⟧ ; Domain = X + E ; Sudut: AX_4 (109,5°) > AX_3E (107°) > AX_2E_2 (104,5°)", ["vsepr"]], ["1.7 Gaya Antarmolekul", "<b>Konsep:</b> Gaya antarmolekul adalah gaya tarik-menarik fisika ANTAR-molekul yang menentukan sifat fisik zat seperti titik didih, titik leleh, tekanan uap, dan viskositas. Urutan kekuatan gaya antarmolekul dari terkuat ke terlemah: (1) Ikatan Hidrogen: gaya tarik sangat kuat antara atom H yang terikat langsung pada atom sangat elektronegatif berukuran kecil (F, O, atau N) dengan PEB atom F, O, atau N molekul tetangga (contoh: HF, H_2O, NH_3, alkohol R-OH, asam karboksilat R-COOH). (2) Gaya Dipol-Dipol: antar-molekul kovalen polar (contoh: HCl, H_2S, SO_2). (3) Gaya Dispersi London: antar-molekul nonpolar akibat dipol sesaat-dipol terimbas; kekuatannya meningkat seiring bertambahnya massa molekul relatif (Mr) dan luas permukaan molekul (rantai lurus > rantai bercabang). <b>Langkah soal:</b> (1) Cek apakah molekul memiliki ikatan H-F, H-O, atau H-N (jika ya -> Ikatan Hidrogen, titik didih melonjak tinggi!). (2) Jika tidak ada ikatan hidrogen, cek kepolaran molekul (polar -> Dipol-Dipol; nonpolar -> Gaya London). (3) Untuk sesama gaya London, bandingkan Mr (Mr lebih besar -> titik didih lebih tinggi). Jika Mr sama (isomer hidrokarbon), rantai lurus memiliki titik didih lebih tinggi daripada rantai bercabang. <b>Jebakan:</b> Menganggap senyawa yang mengandung atom H dan F, O, atau N otomatis memiliki ikatan hidrogen antarmolekulnya (misal CH_3F atau eter CH_3-O-CH_3). Padahal atom H pada eter dan CH_3F terikat pada atom C, bukan langsung pada O atau F! <b>Poin TKA:</b> Grafik titik didih hidrida golongan IVA (CH_4 < SiH_4 < GeH_4 < SnH_4 naik teratur karena Mr), sedangkan golongan VA (NH_3), VIA (H_2O), dan VIIA (HF) memiliki titik didih jauh lebih tinggi daripada unsur periode 3 di bawahnya karena adanya Ikatan Hidrogen.", "Kekuatan: Ikatan Hidrogen (H-F, O, atau N) > Dipol-Dipol > Gaya London (sebanding Mr) ; Rantai Lurus > Cabang", ["imf"]], ["1.8 Hukum-Hukum Dasar Kimia", "<b>Konsep:</b> Lima hukum dasar kimia menjadi fondasi perhitungan stoikiometri: (1) Hukum Lavoisier (Kekekalan Massa): dalam sistem tertutup, total massa zat sebelum reaksi sama dengan total massa zat sesudah reaksi. (2) Hukum Proust (Perbandingan Tetap): perbandingan massa unsur-unsur penyusun suatu senyawa selalu tetap. (3) Hukum Dalton (Kelipatan Perbandingan): jika dua unsur membentuk lebih dari satu senyawa dan massa salah satu unsur dibuat tetap, maka perbandingan massa unsur lainnya merupakan bilangan bulat sederhana. (4) Hukum Gay-Lussac (Perbandingan Volume): pada P dan T yang sama, perbandingan volume gas-gas yang bereaksi dan hasil reaksi berbanding sebagai koefisien reaksinya. (5) Hipotesis Avogadro: pada P dan T yang sama, gas-gas bervolume sama memiliki jumlah molekul (mol) yang sama. <b>Langkah soal:</b> (1) Untuk soal Hukum Proust (pembentukan senyawa dari unsur A + B -> AB): bagi massa tersedia dengan rasio Proust masing-masing unsur; hasil bagi terkecil adalah pereaksi yang habis! (2) Untuk soal pembakaran gas hidrokarbon C_xH_y (Gay-Lussac): gunakan perbandingan volume = perbandingan koefisien: ⟦F:V_(CO2)¦V_(CxHy)⟧ = x dan ⟦F:V_(H2O)¦V_(CxHy)⟧ = ⟦F:y¦2.⟧ <b>Jebakan:</b> Menjumlahkan langsung massa unsur A dan massa unsur B yang dicampurkan sebagai massa senyawa AB yang terbentuk tanpa memeriksa apakah ada salah satu unsur yang bersisa (berlebih)! <b>Poin TKA:</b> Kombinasi Hukum Lavoisier + Proust (mencari massa senyawa dan zat sisa) serta Hukum Gay-Lussac untuk menentukan rumus molekul gas hidrokarbon C_xH_y hampir selalu keluar di TKA.", "m_(awal) = m_(akhir) ; m_A : m_B = tetap ; ⟦F:V_1¦n_1⟧ = ⟦F:V_2¦n_2⟧ (P, T tetap)", ["proust"]], ["1.9 Konsep Mol", "<b>Konsep:</b> Mol (n) adalah satuan jumlah zat dalam SI yang menjembatani massa zat (gram), jumlah partikel (atom, molekul, atau ion), volume gas, dan molaritas larutan. Satu mol zat apa pun mengandung tepat 6,02 × 10^(23) partikel elementer (Bilangan Avogadro, L). Untuk gas: pada keadaan standar STP (0 °C, 1 atm), volume molar V_m = 22,4 ⟦F:L¦mol⟧; pada keadaan kamar RTP (25 °C, 1 atm), V_m = 24,4 ⟦F:L¦mol⟧; pada P dan T sembarang berlaku persamaan gas ideal P V = n R T. <b>Langkah soal:</b> (1) Ubah semua besaran yang diketahui di soal menjadi satuan MOL (n = ⟦F:m¦Mr,⟧ n = ⟦F:N¦L,⟧ n = ⟦F:V¦22,4,⟧ atau n = M × V). (2) Perhatikan perbedaan antara jumlah molekul senyawa vs jumlah atom penyusunnya: dalam n mol molekul C_xH_y terdapat (x + y) × n mol atom total! (3) Untuk membandingkan dua gas pada P dan T yang sama namun bukan STP, gunakan rumus perbandingan ⟦F:n_1¦V_1⟧ = ⟦F:n_2¦V_2.⟧ <b>Jebakan:</b> Menggunakan angka 22,4 ⟦F:L¦mol⟧ untuk menghitung volume gas padahal soal menyebutkan suhu 27 °C atau dibandingkan dengan gas lain pada P dan T tertentu! <b>Poin TKA:</b> Hati-hati membedakan istilah 'jumlah molekul' dengan 'jumlah atom'. Misalnya 1 mol gas amonia (NH_3) mengandung L molekul NH_3, tetapi mengandung 4 × L atom (1 L atom N dan 3 L atom H)!", "n = ⟦F:m¦Mr⟧ ; n = ⟦F:N¦6,02 xx 10^(23)⟧ ; V_(STP) = n xx 22,4 L ; P V = n R T ; ⟦F:n_1¦V_1⟧ = ⟦F:n_2¦V_2⟧", ["mol"]], ["1.10 Stoikiometri", "<b>Konsep:</b> Stoikiometri membahas hubungan kuantitatif zat-zat dalam rumus kimia dan reaksi kimia, mencakup: (1) Rumus Empiris (RE, perbandingan bulat paling sederhana mol atom) dan Rumus Molekul (RM = (RE)_n). (2) Pereaksi Pembatas (Limiting Reactant): pereaksi yang habis lebih dulu dan menentukan jumlah produk yang dihasilkan. (3) Air Kristal (Senyawa Hidrat, misal CuSO_4.xH_2O) serta Persen Kemurnian (kadar) dan Persen Hasil (Yield = ⟦F:hasil nyata¦hasil teoritis⟧ × 100%). <b>Langkah soal:</b> (1) Setarakan persamaan reaksi terlebih dahulu! (2) Jika diketahui mol dari dua atau lebih pereaksi, cari Pereaksi Pembatas dengan membagi mol mula-mula dengan koefisien masing-masing (⟦F:n¦koefisien⟧). Nilai hasil bagi TERKECIL adalah Pereaksi Pembatas! (3) Susun tabel MRS (Mula-mula, Reaksi, Sisa) menggunakan mol Pereaksi Pembatas sebagai patokan: n_(dicari) = (⟦F:koef_(dicari)¦koef_(pembatas)⟧) × n_(pembatas). <b>Jebakan:</b> Memilih zat dengan massa atau mol terkecil langsung sebagai pereaksi pembatas tanpa membaginya dengan koefisien reaksi terlebih dahulu! <b>Poin TKA:</b> Pada soal pemanasan senyawa hidrat MSO_4.xH_2O(s) -> MSO_4(s) + xH_2O(g), selisih massa sebelum dan sesudah pemanasan adalah massa air (H_2O) yang menguap, sedangkan massa padatan akhir adalah massa garam anhidrat (MSO_4).", "Pembatas = min(⟦F:n_(awal)¦koef⟧) ; n_(produk) = (⟦F:koef_(produk)¦koef_(pembatas)⟧) xx n_(pembatas) ; %Yield = (⟦F:m_(nyata)¦m_(teori)⟧) xx 100%", ["stoik"]], ["1.11 Persamaan Reaksi Kimia", "<b>Konsep:</b> Persamaan reaksi kimia melambangkan perubahan reaktan menjadi produk dengan jumlah atom setiap unsur di ruas kiri dan kanan yang wajib setara (manifestasi Hukum Kekekalan Massa Lavoisier). Wujud zat ditulis dalam tanda kurung: (s) padat, (l) cair murni, (g) gas, dan (aq) larutan berair. Dalam larutan elektrolit, reaksi dapat ditulis sebagai Persamaan Molekuler, Persamaan Ion Lengkap, dan Persamaan Ion Bersih (Net Ionic Equation) setelah mencoret ion-ion penonton (spectator ions). <b>Langkah soal:</b> (1) Untuk menyetarakan reaksi kompleks dengan cepat, tetapkan koefisien 1 pada senyawa yang memiliki rumus paling rumit (paling banyak jenis dan jumlah atomnya). (2) Setarakan atom logam terlebih dahulu, diikuti nonlogam selain H dan O, kemudian atom H, dan terakhir atom O sebagai pengecek! (3) Pada persamaan reaksi ion, pastikan BUKAN hanya jumlah atom yang setara, melainkan TOTAL MUATAN LISTRIK di ruas kiri dan kanan juga wajib sama! <b>Jebakan:</b> Mengubah angka indeks (subskrip rumus kimia, misal mengubah H_2O menjadi H_2O_2) demi menyamakan jumlah atom, atau lupa menyetarakan total muatan pada reaksi ion. <b>Poin TKA:</b> TKA sering menguji penyetaraan reaksi dengan metode aljabar (a, b, c, d) pada reaksi pelarutan logam dalam asam oksidator (seperti Cu + HNO_3) dan penentuan persamaan ion bersih pada reaksi pengendapan.", "Sigma Atom_(kiri) = Sigma Atom_(kanan) ; Sigma Muatan_(kiri) = Sigma Muatan_(kanan)", ["setara"]]]}, {"n": "Kimia Analitik", "e": "🧪", "c": "#0ea5e9", "z": "", "i": "Larutan elektrolit, konsentrasi, sifat koligatif, keseimbangan asam-basa, buffer, hidrolisis garam, Ksp, dan koloid.", "S": [["2.1 Larutan & Daya Hantar Listrik", "<b>Konsep:</b> Larutan adalah campuran homogen yang terdiri atas zat terlarut (solute) dan pelarut (solvent). Berdasarkan daya hantar listriknya, larutan dibagi menjadi: (1) Elektrolit Kuat (derajat ionisasi alpha = 1, terionisasi sempurna, lampu menyala terang dan banyak gelembung gas: asam kuat HCl, HBr, HI, HNO_3, H_2SO_4, HClO_4; basa kuat golongan IA dan IIA seperti NaOH, KOH, Ba(OH)_2; serta garam mudah larut seperti NaCl, K_2SO_4). (2) Elektrolit Lemah (0 < alpha < 1, terionisasi sebagian, lampu redup atau padam tetapi masih ada sedikit gelembung gas: asam lemah CH_3COOH, HF, HCN, H_2CO_3; basa lemah NH_3 (NH_4OH)). (3) Nonelektrolit (alpha = 0, tidak terionisasi, lampu mati dan tidak ada gelembung gas: glukosa C_6H_(12)O_6, sukrosa, urea CO(NH_2)_2, etanol C_2H_5OH). <b>Langkah soal:</b> (1) Perhatikan tabel pengamatan uji nyala lampu dan gelembung gas pada elektroda. (2) Ingat bahwa indikator paling sensitif adanya ion di larutan adalah GELEMBUNG GAS pada elektroda: jika lampu padam tetapi ada gelembung gas, larutan tersebut adalah Elektrolit Lemah (bukan nonelektrolit!). (3) Hitung derajat ionisasi alpha = ⟦F:n_(terurai)¦n_(mula-mula)⟧. <b>Jebakan:</b> Menganggap senyawa yang memiliki gugus -OH seperti etanol (C_2H_5OH) atau glikol sebagai larutan basa elektrolit, padahal alkohol adalah senyawa organik kovalen nonelektrolit (alpha = 0)! <b>Poin TKA:</b> Bandingkan kekuatan daya hantar listrik pada konsentrasi yang sama melalui jumlah total partikel ion terlarut: makin besar nilai M × [1 + (n - 1)alpha], makin kuat daya hantar listriknya.", "alpha = ⟦F:n_(terionisasi)¦n_(mula)⟧ ; i = 1 + (n - 1) alpha ; C_(ion) = M xx i", ["elektrolit"]], ["2.2 Konsentrasi Larutan (Molaritas, Molalitas, Normalitas)", "<b>Konsep:</b> Konsentrasi menyatakan kepekatan zat terlarut di dalam pelarut atau larutan: (1) Molaritas (M): jumlah mol zat terlarut per liter LARUTAN (bergantung suhu karena volume memuai). (2) Molalitas (m): jumlah mol zat terlarut per kilogram PELARUT murni (tidak bergantung suhu, dipakai pada sifat koligatif). (3) Normalitas (N): jumlah ekivalen zat terlarut per liter larutan (N = M × a, di mana a = valensi asam, basa, atau elektron redoks). (4) Fraksi Mol (X): perbandingan mol suatu komponen terhadap total mol seluruh komponen (X_t + X_p = 1). <b>Langkah soal:</b> (1) Untuk mengubah kadar (% massa) dan massa jenis (rho, ⟦F:g¦mL⟧) menjadi Molaritas, gunakan rumus cepat: M = ⟦F:% × 10 × rho¦Mr.⟧ (2) Untuk mengubah % massa menjadi Molalitas, misalkan massa larutan = 100 gram, maka massa terlarut g = % gram dan massa pelarut p = (100 - %) gram. (3) Pada pengenceran atau pencampuran zat sejenis: mol zat terlarut tetap (M_1 V_1 = M_2 V_2). <b>Jebakan:</b> Memasukkan massa total larutan sebagai pembagi pada rumus molalitas (m = (⟦F:g¦Mr⟧) × (⟦F:1000¦p⟧)), padahal p pada rumus molalitas wajib merupakan massa PELARUT murni saja! <b>Poin TKA:</b> Hati-hati pada kalimat soal pengenceran: 'ditambahkan air sebanyak 400 mL ke dalam 100 mL larutan' berarti volume akhir V_2 = 100 + 400 = 500 mL (bukan V_2 = 400 mL!).", "M = (⟦F:g¦Mr⟧) xx (⟦F:1000¦V_(mL)⟧) ; M = ⟦F:% xx 10 xx rho¦Mr⟧ ; m = (⟦F:g¦Mr⟧) xx (⟦F:1000¦p_(gram)⟧) ; N = M xx a ; X_t = ⟦F:n_t¦n_t + n_p⟧", ["konsentrasi"]], ["2.3 Sifat Koligatif Larutan", "<b>Konsep:</b> Sifat koligatif larutan adalah sifat fisik larutan yang HANYA bergantung pada jumlah partikel zat terlarut (konsentrasi), bukan pada jenis zatnya: (1) Penurunan Tekanan Uap (Delta P = X_t × P^0). (2) Kenaikan Titik Didih (Delta T_b = K_b × m × i, sehingga T_b = T_b^0 + Delta T_b). (3) Penurunan Titik Beku (Delta T_f = K_f × m × i, sehingga T_f = T_f^0 - Delta T_f). (4) Tekanan Osmotik (pi = M × R × T × i). Untuk larutan elektrolit, jumlah partikel berlipat sebesar Faktor van't Hoff: i = 1 + (n - 1)alpha. <b>Langkah soal:</b> (1) Identifikasi apakah zat terlarut bersifat nonelektrolit (i = 1) atau elektrolit (hitung i = 1 + (n - 1)alpha; jika tidak disebut alpha pada garam, asam kuat, atau basa kuat, gunakan alpha = 1 sehingga i = n). (2) Untuk tekanan uap larutan elektrolit, kalikan mol terlarut dengan faktor i pada rumus fraksi mol: X_t = ⟦F:n_t × i¦n_t × i + n_p⟧. (3) Ingat bahwa semakin besar konsentrasi partikel efektif (m × i), maka titik didih dan tekanan osmotik makin TINGGI, sedangkan titik beku dan tekanan uap jenuh makin RENDAH! <b>Jebakan:</b> Menambahkan Delta T_f ke titik beku pelarut (0 + Delta T_f) sehingga titik beku larutan air menjadi positif, atau lupa mengalikan faktor van't Hoff (i) untuk larutan garam seperti NaCl (i=2) dan CaCl_2 (i=3)! <b>Poin TKA:</b> Jika ditanya 'larutan manakah yang memiliki titik beku PALING TINGGI', carilah larutan dengan jumlah partikel terlarut (m × i) PALING KECIL (karena titik bekunya paling sedikit turun dari 0 °C)!", "Delta P = X_t P^0 ; Delta T_b = K_b m i ; Delta T_f = K_f m i ; pi = M R T i ; i = 1 + (n - 1) alpha", ["koligatif"]], ["2.4 Asam, Basa & Larutan Penyangga (Buffer)", "<b>Konsep:</b> Tiga teori asam-basa: (1) Arrhenius: Asam melepas H^(+) dalam air, Basa melepas OH^(-). (2) Bronsted-Lowry: Asam = donor proton (H^(+)), Basa = akseptor proton (pasangan asam-basa konjugasi berselisih tepat 1 H^(+)). (3) Lewis: Asam = akseptor pasangan elektron (punya orbital kosong, misal BF_3, AlCl_3, H^(+)), Basa = donor pasangan elektron (punya PEB, misal NH_3, OH^(-)). Derajat keasaman: pH = -log[H^(+)], pOH = -log[OH^(-)], dan pH + pOH = 14 (pada 25 °C, K_w = 10^(-14)). Larutan Penyangga (Buffer) mempertahankan pH saat ditambah sedikit asam, basa, atau diencerkan, dan terdiri atas pasangan Asam Lemah + Basa Konjugasinya (garamnya) ATAU Basa Lemah + Asam Konjugasinya. <b>Langkah soal:</b> (1) Jika hanya ada 1 zat: cek apakah Asam atau Basa Kuat ([H^(+)] = a × M) atau Asam atau Basa Lemah ([H^(+)] = sqrt(K_a × M)). (2) Jika dua larutan dicampur (Asam + Basa), buat tabel MRS dalam satuan mol (mmol). (3) Jika di akhir reaksi TERSISA Asam Lemah dan Garamnya, gunakan rumus Buffer Asam: [H^(+)] = K_a × (⟦F:n_(asam sisa)¦n_(basa konjugasi)⟧). <b>Jebakan:</b> Pada buffer yang mengandung garam divalen seperti (CH_3COO)_2Ca atau (NH_4)_2SO_4, siswa sering lupa mengalikan mol garam dengan indeks ion konjugasinya (2 × n_(garam))! <b>Poin TKA:</b> Buffer dapat dibuat dengan 2 cara: Cara Langsung (mencampur asam lemah + garamnya) atau Cara Tidak Langsung (mereaksikan asam lemah BERLEBIH dengan basa kuat sehingga di akhir reaksi asam lemah bersisa dan basa kuat habis).", "Kuat: [H^(+)] = a M ; Lemah: [H^(+)] = sqrt(K_a M) ; Buffer: [H^(+)] = K_a (⟦F:n_a¦n_(bk)⟧) ; pH = -log[H^(+)] ; pH + pOH = 14", ["asambasa"]], ["2.5 Hidrolisis Garam", "<b>Konsep:</b> Hidrolisis garam adalah reaksi penguraian ion garam oleh air. Hanya ion yang berasal dari ASAM LEMAH atau BASA LEMAH yang mengalami hidrolisis oleh air: (1) Garam dari Asam Kuat + Basa Kuat (misal NaCl, K_2SO_4): tidak terhidrolisis, bersifat Netral (pH = 7). (2) Garam dari Asam Kuat + Basa Lemah (misal NH_4Cl, (NH_4)_2SO_4): terhidrolisis parsial (kation), bersifat Asam (pH < 7) dengan [H^(+)] = sqrt((⟦F:K_w¦K_b⟧) × [Kation]). (3) Garam dari Asam Lemah + Basa Kuat (misal CH_3COONa, KCN): terhidrolisis parsial (anion), bersifat Basa (pH > 7) dengan [OH^(-)] = sqrt((⟦F:K_w¦K_a⟧) × [Anion]). (4) Garam dari Asam Lemah + Basa Lemah (misal CH_3COONH_4): terhidrolisis total, sifat pH bergantung pada perbandingan K_a dan K_b ([H^(+)] = sqrt(K_w × ⟦F:K_a¦K_b⟧)). <b>Langkah soal:</b> (1) Jika asam lemah dan basa kuat (atau sebaliknya) dicampur dan KEDUANYA TEPAT HABIS BEREAKSI di tabel MRS, maka sistem tersebut adalah Hidrolisis Garam! (2) Hitung konsentrasi molar garam [G] = mmol ⟦F:garam¦Volume⟧ TOTAL campuran (V_1 + V_2). (3) Kalikan [G] dengan valensi ion yang terhidrolisis (misal pada (CH_3COO)_2Ba atau (NH_4)_2SO_4, konsentrasi ion terhidrolisis = 2 × [G]) sebelum dimasukkan ke dalam akar! <b>Jebakan:</b> Lupa membagi mol garam yang terbentuk dengan VOLUME TOTAL campuran (V_1 + V_2) sehingga konsentrasi garam menjadi dua kali lipat lebih besar dari seharusnya! <b>Poin TKA:</b> Hafalkan jembatan keledai sifat garam: 'Yang KUAT yang MENANG!' Jika Basa Kuat + Asam Lemah -> Garam bersifat BASA (pH > 7) sehingga dalam rumus yang dicari lebih dulu adalah [OH^(-)] (menggunakan K_a), bukan [H^(+)]!", "Garam Basa (BK+AL): [OH^(-)] = sqrt((⟦F:K_w¦K_a⟧) xx [A^(-)]) ; Garam Asam (AK+BL): [H^(+)] = sqrt((⟦F:K_w¦K_b⟧) xx [BH^(+)])", ["hidrolisis"]], ["2.6 Kelarutan & Hasil Kali Kelarutan (Ksp)", "<b>Konsep:</b> Kelarutan (s, ⟦F:mol¦L⟧) adalah konsentrasi maksimum zat yang dapat larut membentuk larutan jenuh pada suhu tertentu. Hasil Kali Kelarutan (K_(sp)) adalah hasil kali konsentrasi ion-ion dipangkatkan koefisiennya dalam larutan jenuh elektrolit sukar larut. Hubungan s dan K_(sp) berdasarkan jumlah ion (n): 2 ion (AB, misal AgCl, BaSO_4): K_(sp) = s^2; 3 ion (A_2B atau AB_2, misal Ag_2CrO_4, PbCl_2, Mg(OH)_2): K_(sp) = 4 s^3; 4 ion (A_3B atau AB_3, misal Ag_3PO_4, Al(OH)_3): K_(sp) = 27 s^4. <b>Langkah soal:</b> (1) Untuk menentukan apakah pencampuran dua larutan menghasilkan endapan, hitung hasil kali konsentrasi ion sesaat setelah dicampur (Q_c) dengan menggunakan konsentrasi setelah dibagi volume total! (2) Bandingkan Q_c dengan K_(sp): jika Q_c < K_(sp) (belum jenuh, belum mengendap); Q_c = K_(sp) (tepat jenuh); Q_c > K_(sp) (lewat jenuh, TERBENTUK ENDAPAN). (3) Pada pengaruh ion senama (common ion effect): substitusikan konsentrasi ion dari elektrolit kuat sebagai konsentrasi ion senama karena nilai s jauh lebih kecil. <b>Jebakan:</b> Membandingkan nilai K_(sp) secara langsung untuk mengurutkan kelarutan (s) berbagai garam yang jumlah ionnya berbeda (misal membandingkan AgCl 2 ion dengan Ag_2CrO_4 3 ion)! <b>Poin TKA:</b> Penambahan ion senama selalu memperkecil kelarutan (s), tetapi TIDAK mengubah nilai K_(sp) selama suhu tetap! Untuk basa sukar larut seperti Mg(OH)_2 dalam larutan penyangga pH tertentu, ubah pH menjadi pOH lalu masukkan [OH^(-)] = 10^(-pOH) ke persamaan K_(sp).", "AB: K_(sp) = s^2 ; A_2B atau AB_2: K_(sp) = 4 s^3 ; A_3B atau AB_3: K_(sp) = 27 s^4 ; Q_c > K_(sp) -> Mengendap", ["ksp"]], ["2.7 Sistem Koloid", "<b>Konsep:</b> Koloid adalah campuran metastabil yang ukurannya berada di antara larutan sejati (< 1 nm) dan suspensi kasar (> 100 nm), yaitu 1–100 nm. Koloid terdiri atas Fase Terdispersi dan Medium Pendispersi (8 jenis: Sol, Emulsi, Buih, Aerosol padat atau cair, Gel). Sifat-sifat khas koloid: (1) Efek Tyndall: penghamburan berkas cahaya oleh partikel koloid (misal sorot lampu mobil di kabut). (2) Gerak Brown: gerak zig-zag acak partikel koloid akibat tumbukan medium pendispersi (menjaga koloid tidak mengendap). (3) Adsorpsi: penyerapan ion pada permukaan koloid sehingga koloid bermuatan listrik (misal Fe(OH)_3 bermuatan positif, As_2S_3 bermuatan negatif; dimanfaatkan pada pemutihan gula dan norit). (4) Koagulasi: penggumpalan koloid akibat penetralan muatan oleh elektrolit (misal pembentukan delta sungai, penggumpalan lateks dengan asam semut, penjernihan air dengan tawas Al_2(SO_4)_3). (5) Elektroforesis (identifikasi muatan koloid atau DNA) & Dialisis (cuci darah dengan membran semipermeabel). <b>Langkah soal:</b> (1) Pasangkan aplikasi sehari-hari dengan sifat koloid yang tepat! (2) Untuk koagulasi oleh elektrolit (Aturan Schulze-Hardy): koloid bermuatan NEGATIF paling efektif digumpalkan oleh KATION yang muatannya paling besar (Al^(3+) > Ba^(2+) > Na^(+)), sedangkan koloid bermuatan POSITIF paling efektif digumpalkan oleh ANION yang muatannya paling besar (PO_4^(3-) > SO_4^(2-) > Cl^(-)). (3) Bedakan pembuatan koloid cara Dispersi (partikel kasar -> koloid: mekanik, peptisasi, busur Bredig) vs Kondensasi (larutan sejati -> koloid: reaksi hidrolisis FeCl_3, redoks, dekomposisi rangkap). <b>Jebakan:</b> Tertukar antara Adsorpsi (penyerapan di PERMUKAAN, sifat koloid) dengan Absorpsi (penyerapan hingga ke seluruh bagian dalam), atau mengira pembuatan sol Fe(OH)_3 dari FeCl_3 + air panas adalah dispersi padahal itu adalah Kondensasi (reaksi hidrolisis)! <b>Poin TKA:</b> Pasangan fenomena dan sifat koloid hampir selalu muncul di TKA: Delta muara sungai & karet + asam = Koagulasi; Sorot lampu di bioskop atau kabut = Efek Tyndall; Deodoran, Norit, dan Pemutihan gula = Adsorpsi; Cuci darah = Dialisis; Pengendap Cottrell = Elektroforesis.", "Ukuran Koloid: 1 - 100 nm ; Schulze-Hardy: Efektivitas Koagulasi sebanding |Muatan Ion Lawan|^n", ["koloid"]]]}, {"n": "Kimia Fisik", "e": "⚡", "c": "#e5484d", "z": "", "i": "Kinetika dan laju reaksi, teori tumbukan, kesetimbangan kimia, termokimia, serta elektrokimia (sel Volta & elektrolisis).", "S": [["3.1 Laju Reaksi & Persamaan Laju", "<b>Konsep:</b> Laju reaksi (v) menyatakan berkurangnya konsentrasi pereaksi atau bertambahnya konsentrasi produk tiap satuan waktu (⟦F:M¦s⟧). Perbandingan laju antar-spesi dalam reaksi sebanding dengan perbandingan koefisien reaksinya. Hukum Laju Reaksi untuk pA + qB -> Produk dinyatakan sebagai v = k [A]^x [B]^y, di mana k adalah tetapan laju reaksi, x adalah orde reaksi terhadap A, y adalah orde reaksi terhadap B, dan (x + y) adalah orde reaksi total. <b>Langkah soal:</b> (1) Untuk mencari orde terhadap A (x), pilih dua data percobaan di mana konsentrasi [B] TETAP, lalu bandingkan: (⟦F:[A]_2¦[A]_1⟧)^x = ⟦F:v_2¦v_1.⟧ (2) Jika tabel memberikan data WAKTU reaksi (t) dan bukan laju (v), ingat bahwa laju berbanding terbalik dengan waktu (v = ⟦F:1¦t⟧), sehingga (⟦F:[A]_2¦[A]_1⟧)^x = ⟦F:t_1¦t_2⟧! (3) Setelah mendapatkan nilai x dan y, substitusikan salah satu baris data percobaan untuk menghitung nilai tetapan laju k. <b>Jebakan:</b> Langsung menyamakan orde reaksi (x dan y) dengan koefisien stoikiometri reaksi (p dan q), atau lupa membalik rasio waktu (⟦F:t_1¦t_2⟧) ketika tabel percobaan menyajikan kolom waktu (detik) dan bukan laju (⟦F:M¦s⟧)! <b>Poin TKA:</b> Orde reaksi hanya dapat ditentukan dari DATA EKSPERIMEN (kecuali disebutkan sebagai tahap elementer (tahap) paling lambat dalam mekanisme reaksi).", "v = ⟦F:-Delta[R]¦Delta⟧ t = ⟦F:+Delta[P]¦Delta⟧ t ; v = k [A]^x [B]^y ; (⟦F:[A]_2¦[A]_1⟧)^x = ⟦F:v_2¦v_1⟧ = ⟦F:t_1¦t_2⟧", ["laju"]], ["3.2 Faktor yang Mempengaruhi Laju Reaksi", "<b>Konsep:</b> Empat faktor utama yang mempercepat laju reaksi kimia: (1) ⟦F:Konsentrasi¦Tekanan⟧ Gas: semakin besar konsentrasi atau tekanan, jumlah partikel per satuan volume makin rapat sehingga frekuensi tumbukan meningkat. (2) Luas Permukaan Sentuh (pada zat padat): serbuk halus memiliki luas permukaan total JAUH LEBIH BESAR daripada kepingan atau bongkahan dengan massa yang sama, sehingga laju reaksi serbuk > butiran > kepingan. (3) Suhu (T): kenaikan suhu meningkatkan energi kinetik rata-rata molekul dan fraksi molekul yang melampaui energi aktivasi. (4) Katalis: mempercepat reaksi dengan menyediakan jalur mekanisme alternatif yang memiliki Energi Aktivasi (E_a) lebih rendah. <b>Langkah soal:</b> (1) Untuk menentukan variabel bebas, variabel terikat, dan variabel kontrol pada gambar percobaan laju reaksi: carilah dua tabung yang HANYA berbeda pada SATU kondisi (misal konsentrasi sama, suhu sama, tetapi satu serbuk dan satu kepingan -> variabel bebas = luas permukaan). (2) Gunakan rumus empiris pengaruh suhu terhadap laju dan waktu: v_2 = v_1 × n^(⟦F:T_2 - T_1¦Delta⟧ T) dan t_2 = t_1 × (⟦F:1¦n⟧)^(⟦F:T_2 - T_1¦Delta⟧ T). <b>Jebakan:</b> Menganggap bahwa kepingan pualam besar memiliki luas permukaan lebih besar daripada serbuk pualam halus dengan massa yang sama! <b>Poin TKA:</b> Soal gambar 5 gelas kimia (CaCO_3 + HCl atau pita Mg + HCl) yang menanyakan 'percobaan manakah yang hanya dipengaruhi oleh luas permukaan atau suhu' adalah soal langganan tetap TKA Kimia!", "v_2 = v_1 xx n^(⟦F:T_2 - T_1¦Delta⟧ T) ; t_2 = ⟦F:t_1¦n^(⟦F:T_2 - T_1¦Delta⟧ T)⟧ ; Luas Permukaan: Serbuk > Butiran > Bongkahan", ["faktorlaju"]], ["3.3 Teori Tumbukan", "<b>Konsep:</b> Teori Tumbukan menjelaskan bahwa reaksi kimia terjadi akibat tumbukan antar-partikel pereaksi. Namun, TIDAK SEMUA tumbukan menghasilkan reaksi! Agar menghasilkan reaksi (disebut Tumbukan Efektif), dua syarat mutlak harus dipenuhi sekaligus: (1) Orientasi (arah) tumbukan antar-molekul harus tepat sehingga atom-atom yang akan berikatan baru saling berhadapan langsung. (2) Energi kinetik partikel yang bertumbukan harus sama dengan atau melampaui Energi Aktivasi (E >= E_a). <b>Langkah soal:</b> (1) Analisis gambar tumbukan molekul (misal reaksi 2HI -> H_2 + I_2 atau NO + O_3 -> NO_2 + O_2): pastikan atom yang akan membentuk ikatan produk saling bertumbukan secara langsung. (2) Pada grafik distribusi energi Maxwell-Boltzmann, pahami bahwa saat suhu dinaikkan dari T_1 ke T_2, puncak kurva bergeser ke kanan dan merendah (luas total di bawah kurva tetap karena jumlah molekul tetap), tetapi luas daerah di kanan garis E_a meningkat drastis! <b>Jebakan:</b> Mengira bahwa kenaikan suhu mempercepat reaksi terutama karena 'menurunkan energi aktivasi E_a'. Suhu sama sekali TIDAK mengubah nilai E_a; suhu memperbesar fraksi molekul yang memiliki energi E >= E_a! <b>Poin TKA:</b> Bedakan peran Suhu vs Katalis pada kurva Maxwell-Boltzmann: Kenaikan Suhu menggeser kurva distribusi energi ke kanan (E_a tetap), sedangkan Katalis menggeser batas garis E_a ke kiri (kurva energi molekul tetap).", "k = A xx e^(⟦F:-E_a¦R T⟧) ; Syarat Tumbukan Efektif: (1) Orientasi Tepat + (2) E_(kinetik) >= E_a", ["tumbukan"]], ["3.4 Energi Aktivasi & Peran Katalis", "<b>Konsep:</b> Energi Aktivasi (E_a) adalah energi minimum yang harus diserap oleh pereaksi untuk mencapai keadaan transisi (kompleks teraktivasi) di puncak bukit profil energi sebelum berubah menjadi produk. Semakin tinggi nilai E_a, semakin lambat reaksi berlangsung pada suhu kamar. Katalis adalah zat yang mempercepat laju reaksi dengan mengubah mekanisme reaksi menjadi jalur baru yang memiliki puncak Energi Aktivasi lebih rendah (E_(a,katalis) < E_(a,tanpa)), dan katalis terbentuk kembali di akhir reaksi. <b>Langkah soal:</b> (1) Pada diagram profil energi reaksi, ukur Energi Aktivasi reaksi maju (E_a) dari garis aras energi REAKTAN hingga ke PUNCAK bukit tertinggi (keadaan transisi)! (2) Ukur Perubahan Entalpi reaksi (Delta H) dari selisih energi Produk dikurangi Reaktan (Delta H = E_(produk) - E_(reaktan)): jika posisi Produk lebih rendah dari Reaktan -> Eksoterm (Delta H < 0); jika Produk lebih tinggi -> Endoterm (Delta H > 0). (3) Untuk reaksi bertahap (memiliki beberapa puncak), tahap penentu laju adalah tahap dengan bukit E_a paling tinggi! <b>Jebakan:</b> Mengukur nilai E_a dari dasar sumbu nol atau dari garis produk, atau mengira bahwa penambahan katalis ikut mengubah nilai Delta H reaksi! <b>Poin TKA:</b> Katalis menurunkan E_a reaksi maju DAN E_a reaksi balik dengan jumlah penurunan yang SAMA BESAR, sehingga selisih energi awal-akhir (Delta H) dan posisi tetapan kesetimbangan (K) sama sekali TIDAK BERUBAH!", "E_a = E_(puncak) - E_(reaktan) ; Delta H = E_(produk) - E_(reaktan) = E_(a,maju) - E_(a,balik)", ["ea"]], ["3.5 Kesetimbangan Kimia (Kc, Kp & Derajat Disosiasi)", "<b>Konsep:</b> Kesetimbangan dinamis tercapai dalam sistem tertutup ketika laju reaksi maju sama dengan laju reaksi balik (v_(kanan) = v_(kiri)) dan konsentrasi seluruh spesi tetap terhadap waktu. Tetapan kesetimbangan konsentrasi (K_c) hanya memasukkan spesi berwujud GAS (g) dan LARUTAN (aq), sedangkan padatan murni (s) dan cairan murni (l) diabaikan (bernilai 1). Tetapan kesetimbangan tekanan parsial (K_p) HANYA memasukkan spesi berwujud GAS (g). Hubungan keduanya: K_p = K_c (R T)^(Delta n), dengan Delta n = jumlah koefisien gas kanan - jumlah koefisien gas kiri. <b>Langkah soal:</b> (1) Buat tabel MRS dalam satuan mol, lalu pada baris Sisa (Setimbang): JANGAN LUPA membagi mol masing-masing spesi dengan VOLUME WADAH (V liter) untuk memperoleh konsentrasi [M] sebelum menghitung K_c! (2) Untuk menghitung K_p, hitung tekanan parsial masing-masing gas: P_i = (⟦F:n_i¦n_(total gas saat setimbang)⟧) × P_(total). (3) Jika persamaan reaksi dibalik -> nilai K menjadi ⟦F:1¦K⟧; jika dikali n -> nilai K dipangkatkan n (K^n); jika dua reaksi dijumlahkan -> nilai K dikalikan (K_1 × K_2). <b>Jebakan:</b> Memasukkan zat berwujud padat (s) atau cair murni (l) ke dalam rumus K_c maupun K_p, atau langsung memasukkan mol saat setimbang ke rumus K_c tanpa membaginya dengan volume wadah V! <b>Poin TKA:</b> Manipulasi aljabar nilai K (dibalik = ⟦F:1¦K,⟧ dikali 2 = K^2, dibagi 2 = sqrt(K)) serta perhitungan K_c dan K_p dari derajat disosiasi alpha hampir selalu keluar di TKA Kimia.", "K_c = ⟦F:[Produk]^(koef)¦[Reaktan]^(koef)⟧ (fase g, aq) ; K_p = P_(produk)⟦F:^(koef)¦P_(reaktan)⟧^(koef) (fase g) ; K_p = K_c (R T)^(Delta n)", ["kc"]], ["3.6 Pergeseran Kesetimbangan (Asas Le Chatelier)", "<b>Konsep:</b> Asas Le Chatelier menyatakan bahwa jika suatu sistem kesetimbangan menerima aksi (gangguan luar), sistem akan bergeser untuk meminimalkan pengaruh aksi tersebut: (1) Konsentrasi: ditambah zat -> bergeser menjauhi zat itu; dikurangi zat -> bergeser mendekati zat itu. (2) Tekanan & Volume (khusus spesi gas): Tekanan diperbesar (Volume diperkecil) -> bergeser ke ruas dengan JUMLAH KOEFISIEN GAS LEBIH KECIL; Tekanan diperkecil (Volume diperbesar) -> bergeser ke jumlah koefisien gas lebih besar. (3) Suhu: Suhu dinaikkan -> bergeser ke arah reaksi ENDOTERM (Delta H > 0, menyerap panas); Suhu diturunkan -> bergeser ke arah reaksi EKSOTERM (Delta H < 0, melepas panas). <b>Langkah soal:</b> (1) Hitung jumlah koefisien FASE GAS (g) di ruas kiri dan kanan sebelum menganalisis pengaruh perubahan tekanan atau volume (jika jumlah koefisien gas kiri = kanan, perubahan tekanan atau volume TIDAK menggeser kesetimbangan!). (2) Perhatikan tanda Delta H reaksi maju: jika Delta H = negatif (-), berarti arah KANAN adalah Eksoterm dan arah KIRI adalah Endoterm. (3) Ingat: HANYA perubahan SUHU yang dapat mengubah nilai tetapan kesetimbangan K_c dan K_p! <b>Jebakan:</b> Menganggap bahwa memperbesar tekanan atau menambah konsentrasi reaktan akan memperbesar nilai tetapan kesetimbangan K_c, atau ikut menjumlahkan koefisien zat padat (s) saat menentukan pergeseran akibat volume atau tekanan! <b>Poin TKA:</b> Aplikasi industri seperti Proses Haber-Bosch (pembuatan NH_3: N_2 + 3H_2 <=> 2NH_3, Delta H = -92 kJ) dan Proses Kontak (pembuatan H_2SO_4: 2SO_2 + O_2 <=> 2SO_3, Delta H = -197 kJ) membutuhkan tekanan tinggi dan suhu optimum!", "P naik (V turun) -> Geser ke Sigma koef_(gas) Kecil ; T naik -> Geser ke Endoterm (+Delta H) ; T turun -> Geser ke Eksoterm (-Delta H)", ["lechatelier"]], ["3.7 Termokimia (Entalpi, Hukum Hess & Energi Ikatan)", "<b>Konsep:</b> Termokimia mempelajari perubahan kalor pada tekanan tetap yang dinyatakan sebagai Perubahan Entalpi (Delta H): (1) Reaksi Eksoterm: sistem melepas kalor ke lingkungan, suhu lingkungan NAIK, H_(produk) < H_(reaktan), bertanda Delta H = NEGATIF (-). (2) Reaksi Endoterm: sistem menyerap kalor dari lingkungan, suhu lingkungan TURUN, H_(produk) > H_(reaktan), bertanda Delta H = POSITIF (+). Entalpi standar mencakup: Pembentukan Standar (Delta H_f^0: membentuk 1 mol senyawa dari unsur-unsurnya), Penguraian Standar (Delta H_d^0 = -Delta H_f^0), dan Pembakaran Standar (Delta H_c^0: membakar 1 mol zat dengan O_2 berlebih). <b>Langkah soal:</b> Hafalkan perbedaan rumus Kanan-Kiri vs Kiri-Kanan untuk menghitung Delta H reaksi: (1) Jika diketahui data **Entalpi Pembentukan Standar (Delta H_f^0)**: gunakan **KANAN - KIRI** (Delta H = Sigma n Delta H_f^0(Produk) - Sigma n Delta H_f^0(Reaktan); ingat Delta H_f^0 unsur bebas seperti O_2, N_2, C(s), Fe(s) = 0!). (2) Jika diketahui data **Energi Ikatan Rata-rata (D)**: gunakan **KIRI - KANAN** (Delta H = Sigma Energi Ikatan Putus (Reaktan) - Sigma Energi Ikatan Terbentuk (Produk)). (3) Jika menggunakan **Kalorimeter**: q_(reaksi) = -(m c Delta T + C Delta T), lalu Delta H = ⟦F:q_(reaksi)¦n⟧ (perhatikan tanda minus jika suhu larutan naik!). <b>Jebakan:</b> Terbalik menggunakan rumus Kanan - Kiri saat soal memberikan tabel Energi Ikatan, atau lupa menggambar struktur Lewis molekul sehingga salah menghitung jumlah ikatan (misal dalam 1 molekul H_2O ada 2 ikatan O-H, dalam CH_4 ada 4 ikatan C-H, dalam CO_2 ada 2 ikatan rangkap C=O)! <b>Poin TKA:</b> Perbedaan rumus Delta H_f^0 (Produk - Reaktan) vs Energi Ikatan (Reaktan - Produk) serta perhitungan kalorimetri penetralan asam-basa adalah soal wajib di setiap paket TKA Kimia!", "Delta H = Sigma Delta H_f^0(Ka) - Sigma Delta H_f^0(Ki) ; Delta H = Sigma D_(putus,kiri) - Sigma D_(terbentuk,kanan) ; Delta H = -⟦F:m c Delta T¦n⟧", ["termokimia"]], ["3.8 Elektrokimia (Redoks, Sel Volta & Elektrolisis)", "<b>Konsep:</b> Elektrokimia menghubungkan reaksi redoks (reduksi-oksidasi) dengan energi listrik. Hafalkan jembatan keledai universal untuk SEMUA sel elektrokimia: **KRAO** (**Katoda = Reduksi**, **Anoda = Oksidasi**). Perbedaan kutubnya (**KNAP**): pada **Sel Volta (Galvani)** (reaksi spontan menghasilkan listrik, E_(sel)^0 > 0), **Katoda bermuatan Positif (+)** dan **Anoda Negatif (-)**; sedangkan pada **Sel Elektrolisis** (arus listrik memaksa reaksi tak spontan), **Katoda bermuatan Negatif (-)** dan **Anoda Positif (+)**. <b>Langkah soal:</b> (1) Pada Sel Volta: spesi dengan potensial reduksi standar E^0 LEBIH BESAR mengalami Reduksi di Katoda, sedangkan E^0 lebih kecil mengalami Oksidasi di Anoda. Rumus: E_(sel)^0 = E_(katoda)^0 - E_(anoda)^0. (2) Pada Sel Elektrolisis larutan berair, perhatikan kompetisi di Katoda dan Anoda: di Katoda, kation golongan IA, IIA, Al^(3+), dan Mn^(2+) TIDAK tereduksi dalam larutan (yang tereduksi adalah air: 2H_2O + 2e^(-) -> H_2 + 2OH^(-)); di Anoda inert (Pt, C, Au), sisa asam oksi (SO_4^(2-), NO_3^(-)) tidak teroksidasi (yang teroksidasi adalah air: 2H_2O -> O_2 + 4H^(+) + 4e^(-)). (3) Gunakan Hukum Faraday I (w = ⟦F:e × i × t¦96500,⟧ dengan e = ⟦F:Ar¦valensi⟧) dan Hukum Faraday II untuk sel seri (n_1 × val_1 = n_2 × val_2). <b>Jebakan:</b> Mengalikan nilai E^0 dengan koefisien reaksi saat menghitung E_(sel)^0! Potensial sel (E^0) adalah sifat intensif, sehingga nilainya TIDAK PERNAH dikalikan dengan koefisien stoikiometri! <b>Poin TKA:</b> Proteksi katodik (perlindungan pipa besi dari korosi dengan menghubungkannya ke logam yang punya E^0 lebih negatif seperti Mg atau Zn sebagai anoda tumbal) serta perhitungan Hukum Faraday I & II selalu muncul di TKA.", "E_(sel)^0 = E_(katoda)^0 - E_(anoda)^0 ; w = (⟦F:Ar¦val⟧) xx ⟦F:i xx t¦96500⟧ ; Faraday II: n_1 xx val_1 = n_2 xx val_2", ["elektrokimia"]]]}, {"n": "Kimia Organik", "e": "🧬", "c": "#10b981", "z": "", "i": "Kekhasan atom karbon, hidrokarbon, keisomeran, gugus fungsi, tata nama IUPAC, reaksi organik, polimer, dan biomolekul.", "S": [["4.1 Senyawa Karbon & Kedudukan Atom C", "<b>Konsep:</b> Kekhasan atom karbon (Z = 6, konfigurasi 1s^2 2s^2 2p^2) terletak pada kemampuannya membentuk 4 ikatan kovalen yang kuat dan melakukan katenasi (rantai lurus, bercabang, maupun siklik dengan ikatan tunggal, rangkap dua, atau rangkap tiga). Berdasarkan jumlah atom C lain yang diikat secara langsung pada rantai karbon, atom C dibedakan menjadi 4 jenis: (1) Atom C Primer (1°): mengikat 1 atom C lain (biasanya gugus ujung -CH_3). (2) Atom C Sekunder (2°): mengikat 2 atom C lain (-CH_2-). (3) Atom C Tersier (3°): mengikat 3 atom C lain (-CH-). (4) Atom C Kuartener (4°): mengikat 4 atom C lain (-C-). <b>Langkah soal:</b> (1) Uraikan struktur rantai karbon yang diringkas (seperti (CH_3)_3C-CH_2-CH(CH_3)_2) menjadi kerangka ikatan C-C yang jelas. (2) Hitung berapa banyak tetangga atom C yang terikat langsung pada setiap atom C (hanya hitung tetangga atom Karbon, atom H atau gugus -OH atau -Cl tidak dihitung sebagai ikatan C-C!). (3) Tentukan hibridisasi masing-masing atom C: jika semua ikatannya tunggal -> sp^3 (tetrahedral); jika punya 1 ikatan rangkap dua (C=C) -> sp^2 (datar trigonal); jika punya 1 ikatan rangkap tiga atau 2 ikatan rangkap dua -> sp (linear). <b>Jebakan:</b> Menghitung gugus etil (-C_2H_5) sebagai satu atom C tunggal, padahal -C_2H_5 adalah -CH_2-CH_3 yang terdiri dari 1 atom C sekunder dan 1 atom C primer! <b>Poin TKA:</b> Soal menghitung jumlah atom C primer, sekunder, tersier, dan kuartener pada struktur isooktana (2,2,4-trimetilpentana) sangat sering keluar sebagai pembuka soal Kimia Organik TKA.", "C Primer (1°): -CH_3 ; C Sekunder (2°): -CH_2- ; C Tersier (3°): >CH- ; C Kuartener (4°): >C<", ["atomc"]], ["4.2 Hidrokarbon (Alkana, Alkena, Alkuna & Fraksi Minyak Bumi)", "<b>Konsep:</b> Hidrokarbon hanya tersusun atas atom Karbon (C) dan Hidrogen (H): (1) Alkana (C_nH_(2n+2)): hidrokarbon jenuh (semua ikatan tunggal C-C, deret homolog metana sampai dekana). (2) Alkena (C_nH_(2n)): hidrokarbon tak jenuh dengan 1 ikatan rangkap dua (C=C). (3) Alkuna (C_nH_(2n-2)): hidrokarbon tak jenuh dengan 1 ikatan rangkap tiga (C#C). Minyak bumi dipisahkan melalui Destilasi Bertingkat berdasarkan perbedaan titik didih fraksi-fraksinya (dari atas ke bawah menara: Gas LPG C_1-C_4, Petrol (Bensin) C_5-C_(12), Nafta, Kerosin (Avtur), Solar (Diesel), Pelumas, Parafin, hingga ⟦F:Aspal¦Residu⟧). <b>Langkah soal:</b> (1) Identifikasi deret homolog dari rumus molekulnya: jumlah H = 2n + 2 (alkana), 2n (alkena atau sikloalkana), 2n - 2 (alkuna atau alkadiena). (2) Uji ketidakjenuhan menggunakan air bromin (Br_2 berwarna cokelat merah): Alkena dan Alkuna melunturkan warna air bromin menjadi tak berwarna (reaksi adisi), sedangkan Alkana tidak bereaksi di tempat gelap. (3) Mutu bensin dinyatakan dengan Bilangan Oktan (persentase isooktana 2,2,4-trimetilpentana bernilai oktan 100 terhadap n-heptana bernilai oktan 0). <b>Jebakan:</b> Menganggap bahwa rumus C_nH_(2n) pasti hanya dimiliki oleh Alkena, padahal Sikloalkana (rantai tertutup ikatan tunggal seperti sikloheksana) juga berumus C_nH_(2n)! <b>Poin TKA:</b> Untuk meningkatkan bilangan oktan bensin tanpa pencemaran timbal (TEL Pb(C_2H_5)_4 sudah dilarang), digunakan zat aditif oksigenat ramah lingkungan seperti MTBE (Metil Tersier Butil Eter) atau Etanol, serta proses Reforming (mengubah rantai lurus menjadi bercabang).", "Alkana: C_nH_(2n+2) ; Alkena & Sikloalkana: C_nH_(2n) ; Alkuna & Alkadiena: C_nH_(2n-2)", ["hidrokarbon"]], ["4.3 Keisomeran (Struktur, Geometri & Optis)", "<b>Konsep:</b> Isomer adalah senyawa-senyawa yang memiliki Rumus Molekul SAMA tetapi struktur atau konfigurasi ruangnya berbeda: 1. **Isomer Struktur**: (a) Isomer Kerangka (Rantai) (bentuk rantai lurus vs cabang berbeda); (b) Isomer Posisi (letak ikatan rangkap atau gugus fungsi pada nomor C berbeda); (c) Isomer Gugus Fungsi (rumus molekul sama tetapi gugus fungsi berbeda). 2. **Isomer Ruang (Stereoisomer)**: (a) Isomer Geometri (*cis-trans* (*E-Z*) pada alkena C=C): syaratnya kedua atom C pada ikatan C=C masing-masing wajib mengikat DUA GUGUS YANG BERBEDA (abC=Cab); (b) Isomer Optis Aktif: memiliki **Atom C Kiral (Asimetris)**, yaitu atom C sp^3 yang mengikat **4 gugus yang semuanya berbeda**! <b>Langkah soal:</b> (1) Untuk menguji apakah suatu alkena memiliki isomer *cis-trans*, periksa ujung kiri dan ujung kanan ikatan C=C: jika salah satu atom C pada C=C mengikat 2 atom atau gugus yang sama (seperti CH_2=CH-CH_3 atau (CH_3)_2C=CH-CH_3), senyawa tersebut TIDAK punya isomer *cis-trans*! (2) Untuk menghitung jumlah isomer optis aktif dari molekul yang memiliki n atom C kiral tak-identik, gunakan rumus 2^n. <b>Jebakan:</b> Menganggap semua alkena pasti memiliki isomer geometri *cis-trans* (misal 1-butena CH_2=CH-CH_2-CH_3 dikira punya cis-trans, padahal C_1 mengikat dua atom H yang sama!). <b>Poin TKA:</b> Syarat *cis-trans* (tiap C pada C=C mengikat 2 gugus berbeda) dan syarat Optis Aktif (atom C kiral mengikat 4 gugus berbeda, seperti pada 2-butanol atau asam laktat) sangat sering keluar di TKA!", "Syarat cis-trans: (a != b)C = C(c != d) ; Syarat C Kiral (Optis): C mengikat 4 gugus berbeda ; Jumlah Isomer Optis = 2^n", ["isomer"]], ["4.4 Gugus Fungsi & Pasangan Isomer Fungsi", "<b>Konsep:</b> Gugus fungsi adalah atom atau kelompok atom yang menentukan sifat kimia khas senyawa turunan alkana. Tiga pasangan utama **Isomer Gugus Fungsi** yang wajib dikuasai untuk TKA: (1) Rumus **C_nH_(2n+2)O**: pasangan **Alkohol (Alkanol) (R-OH)** dengan **Eter (Alkoksi Alkana) (R-O-R')**. (2) Rumus **C_nH_(2n)O**: pasangan **Aldehida (Alkanal) (R-CHO)** dengan **Keton (Alkanon) (R-CO-R')**. (3) Rumus **C_nH_(2n)O_2**: pasangan **Asam Karboksilat (Asam Alkanoat) (R-COOH)** dengan **Ester (Alkil Alkanoat) (R-COO-R')**. <b>Langkah soal:</b> (1) Hitung dulu rumus molekul senyawa dari soal untuk langsung mengerucutkan kemungkinan ke salah satu dari 3 pasangan di atas! (2) Gunakan uji reagen pembeda pasangan isomer fungsi: **Alkohol vs Eter (C_nH_(2n+2)O)**: Alkohol bereaksi dengan logam **Na** menghasilkan gas H_2 (dan bereaksi dengan PCl_5 menghasilkan gas HCl), sedangkan Eter TIDAK bereaksi dengan logam Na! **Aldehida vs Keton (C_nH_(2n)O)**: Aldehida mereduksi pereaksi **Fehling** (endapan merah bata Cu_2O) dan **Tollens** (cermin perak Ag), sedangkan Keton TIDAK bereaksi! <b>Jebakan:</b> Mengira baik Alkohol maupun Eter bereaksi dengan PCl_5 dengan hasil yang sama. Padahal Alkohol + PCl_5 menghasilkan uap putih HCl, sedangkan Eter + PCl_5 bereaksi tanpa menghasilkan gas HCl (karena eter tidak punya gugus -OH)! <b>Poin TKA:</b> Hampir setiap tahun TKA menyajikan soal teka-teki identifikasi senyawa: 'Senyawa X berumus C_3H_8O tidak bereaksi dengan logam Na...' (pasti Eter!) atau 'Senyawa Y berumus C_3H_6O menghasilkan cermin perak dengan pereaksi Tollens...' (pasti Aldehida!).", "C_nH_(2n+2)O: Alkohol (-OH) & Eter (-O-) ; C_nH_(2n)O: Aldehida (-CHO) & Keton (-CO-) ; C_nH_(2n)O_2: Asam (-COOH) & Ester (-COO-)", ["gugus"]], ["4.5 Tata Nama Senyawa Organik (IUPAC & Trivial)", "<b>Konsep:</b> Tata nama IUPAC senyawa organik mengikuti 4 urutan baku: **[Nomor & Nama Cabang (Alfabetis)] + [Rantai Utama Terpanjang yang Memuat Gugus Fungsi] + [Nomor Gugus Fungsi Terkecil] + [Akhiran Gugus Fungsi]**. Urutan prioritas gugus fungsi dari tertinggi ke terendah: **-COOH (Asam -oat) > -SO_3H > -COOR (-oat) > -CHO (-al) > -CO- (-on) > -OH (-ol) > -NH_2 > C=C (-ena) > C#C (-una) > -OR (alkoksi) > -X (halo) > -R (alkil)**. <b>Langkah soal:</b> (1) Pilih rantai karbon TERPANJANG yang mengandung gugus fungsi utama (perhatikan jebakan cabang -C_2H_5 dekat ujung rantai yang sering memperpanjang rantai utama!). (2) Beri nomor rantai utama dari ujung yang memberikan NOMOR TERKECIL pada gugus fungsi utama (bukan dari cabang alkil!). (3) Pada Ester (R-COO-R'): gugus R' yang terikat pada atom O tunggal selalu disebut di depan sebagai **Alkil**, sedangkan rantai R-COO- yang mengandung C=O disebut di belakang sebagai **Alkanoat** (Alkil Alkanoat)! <b>Jebakan:</b> Tertukar menamai Ester CH_3-CH_2-COO-CH_3 sebagai 'etil etanoat' atau 'propil metanoat', padahal yang terikat pada O adalah metil (-CH_3) dan rantai berkarbonil memiliki 3 atom C (propanoat) -> **metil propanoat**! <b>Poin TKA:</b> Selain tata nama rantai bercabang dan ester, kuasai juga tata nama benzena disubstitusi: posisi 1,2 = *orto* (o-), posisi 1,3 = *meta* (m-), dan posisi 1,4 = *para* (p-).", "IUPAC: (Cabang Alfabetis) + (Rantai Utama) + (Nomor Gugus Terkecil) + (Akhiran) ; Ester: R-COO-R' = R'(alkil) R(alkanoat)", ["tatanama"]], ["4.6 Reaksi Senyawa Organik", "<b>Konsep:</b> Jenis reaksi utama dalam kimia organik: (1) **Substitusi**: pergantian atom atau gugus tanpa perubahan ikatan rangkap (semua ikatan tetap jenuh atau tak jenuh seperti semula, misal Alkana + Cl_2 --(UV)--> Haloalkana + HCl). (2) **Adisi**: pemutusan ikatan rangkap (C=C, C#C, atau C=O) menjadi ikatan tunggal (Tak Jenuh -> Jenuh). Untuk adisi HX pada alkena asimetris berlaku **Aturan Markovnikov**: atom H masuk ke C ikatan rangkap yang sudah memiliki LEBIH BANYAK atom H ('yang kaya makin kaya')! (3) **Eliminasi**: pelepasan atom atau gugus dari ikatan tunggal membentuk ikatan rangkap (Jenuh -> Tak Jenuh, misal dehidrasi alkohol dengan H_2SO_4 pekat pada suhu 180 °C menghasilkan alkena + H_2O; berlaku **Aturan Zaitsev**: atom H dilepas dari C tetangga yang memiliki lebih sedikit H). (4) **Oksidasi Alkohol**: Alkohol Primer -> Aldehida -> Asam Karboksilat; Alkohol Sekunder -> Keton; Alkohol Tersier -> TIDAK dapat dioksidasi! (5) **Esterifikasi** (Asam Karboksilat + Alkohol <=> Ester + Air) & **Saponifikasi (Penyabunan)** (Ester atau Lemak + NaOH -> Garam Karboksilat (Sabun) + Alkohol (Gliserol)). <b>Langkah soal:</b> (1) Lihat perubahan ikatan antara kiri dan kanan panah reaksi: Tunggal -> Tunggal = Substitusi; Rangkap -> Tunggal = Adisi; Tunggal -> Rangkap = Eliminasi! (2) Perhatikan suhu pada reaksi alkohol + H_2SO_4 pekat: pada suhu **130–140 °C** terbentuk **Eter**, sedangkan pada suhu **170–180 °C** terjadi eliminasi membentuk **Alkena**! <b>Jebakan:</b> Salah menempatkan atom Cl atau Br pada reaksi adisi propena + HBr di ujung CH_2 (menghasilkan 1-bromopropana), padahal menurut aturan Markovnikov atom H masuk ke CH_2 dan Br masuk ke CH tengah menghasilkan **2-bromopropana**! <b>Poin TKA:</b> Pasangan 3 jenis reaksi berurutan (Substitusi, Adisi, Eliminasi) serta membedakan hasil oksidasi alkohol primer, sekunder, dan tersier adalah soal paling populer di TKA Kimia Organik.", "Adisi: Rangkap -> Tunggal (Markovnikov) ; Eliminasi: Tunggal -> Rangkap (Zaitsev) ; Oksidasi: 1° -> Aldehida -> Asam, 2° -> Keton, 3° -> X", ["reaksiorganik"]], ["4.7 Polimer", "<b>Konsep:</b> Polimer adalah makromolekul raksasa yang tersusun dari pengulangan unit-unit molekul kecil yang disebut monomer. Berdasarkan reaksi pembentukannya, polimer dibagi menjadi dua kelompok besar: (1) **Polimer Adisi**: terbentuk dari monomer yang memiliki **ikatan rangkap C=C** tanpa melepaskan molekul kecil sampingan (Mr polimer = n × Mr monomer). Contoh: Polietilena (PE, dari etena), Polipropilena (PP), PVC (dari vinil klorida), Teflon (PTFE, dari tetrafluoroetena), Polistirena (PS, dari stirena), Karet Alam (poliisoprena), Orlon, dan PMMA (kaca akrilik). (2) **Polimer Kondensasi**: terbentuk dari monomer yang memiliki minimal dua gugus fungsi reaktif (-OH, -COOH, -NH_2) dan **melepaskan molekul kecil seperti H_2O atau HCl**. Contoh: **Nilon-6,6** (poliamida), **Dakron (PET)** (poliester), **Bakelit** (fenol + formaldehida), **Kevlar**, serta polimer alam: **Protein** (dari asam amino), **Amilum dan Selulosa** (dari glukosa), dan **DNA dan RNA** (dari nukleotida). <b>Langkah soal:</b> (1) Untuk membedakan Polimer Adisi vs Kondensasi dengan cepat: jika nama monomernya berakhiran **-ena** (etena, propena, kloroetena (vinil klorida), tetrafluoroetena, stirena (feniletena), isoprena), maka 100% pasti **Polimer Adisi**! (2) Jika monomernya mengandung gugus asam dikarboksilat + diol atau diamina, atau merupakan karbohidrat, protein, nilon, dakron, atau bakelit, maka pasti **Polimer Kondensasi**! <b>Jebakan:</b> Menganggap Nilon-6,6 dan Dakron (PET) sebagai polimer adisi karena merupakan plastik atau serat sintetis, atau mengira Polistirena adalah polimer kondensasi karena memiliki cincin benzena! <b>Poin TKA:</b> Tabel 5 baris berisi (Nama Polimer, Monomer, Jenis Polimerisasi, dan Kegunaan) yang menanyakan pasangan data yang tepat adalah soal pasti keluar di TKA!", "Polimer Adisi: n (CH_2=CHX) -> -(-CH_2-CHX-)_n- (Tanpa hasil samping) ; Kondensasi: Monomer A + B -> Polimer + H_2O", ["polimer"]], ["4.8 Biomolekul Dasar (Karbohidrat, Protein & Lemak)", "<b>Konsep:</b> Tiga makromolekul biologis utama dan uji kimianya: 1. **Karbohidrat**: Monosakarida (Glukosa & Galaktosa = aldosa; Fruktosa = ketosa), Disakarida (**Sukrosa** = glukosa + fruktosa; **Maltosa** = 2 glukosa; **Laktosa** = glukosa + galaktosa), Polisakarida (Amilum, Glikogen, Selulosa). 2. **Protein**: polimer asam amino (punya gugus -NH_2 basa dan -COOH asam -> bersifat **⟦F:amfoter¦ion⟧ zwitter**) yang dihubungkan oleh **ikatan peptida (-CO-NH-)**. 3. **Lemak & Minyak**: trimester dari gliserol dan asam lemak (Lemak padat = asam lemak jenuh; Minyak cair = asam lemak tak jenuh C=C, dapat dipadatkan menjadi margarin melalui **hidrogenasi**). <b>Langkah soal:</b> Hafalkan reagen uji laboratorium biomolekul untuk TKA: **Uji Karbohidrat**: **Molisch** (cincin ungu = uji umum semua karbohidrat); **Fehling atau Benedict** (merah bata) & **Tollens** (cermin perak) = positif untuk semua gula pereduksi KECUALI **Sukrosa** dan Polisakarida; **Seliwanoff** (merah ceri cepat = khusus ketosa (Fruktosa)); **Iodin** (biru-ungu = khusus **Amilum**). **Uji Protein**: **Biuret** (CuSO_4 + NaOH -> warna **Ungu** = uji ikatan peptida); **Xantoproteat** (HNO_3 pekat + NaOH -> warna **Jingga** = uji cincin benzena pada Tirosin, Triptofan, Fenilalanin); **Timbal(II) Asetat** (Pb(CH_3COO)_2 + NaOH -> **Endapan Hitam PbS** = uji belerang pada Sistein & Metionin). <b>Jebakan:</b> Menganggap Sukrosa (gula tebu) memberikan hasil positif pada uji Fehling atau Benedict dan Tollens. Padahal **Sukrosa adalah GULA NON-PEREDUKSI** (karena kedua karbon anomerik glukosa dan fruktosa saling berikatan glikosidik)! <b>Poin TKA:</b> Kombinasi 3 uji protein (**Biuret = Ungu = Ikatan Peptida**, **Xantoproteat = Jingga = Inti Benzena**, **Pb-Asetat = Hitam = Belerang**) dan sifat non-pereduksi Sukrosa adalah soal wajib TKA!", "Gula Non-Pereduksi: Sukrosa & Polisakarida ; Protein: Biuret (Ungu - Ikatan Peptida), Xantoproteat (Jingga - Inti Benzena), Pb-Asetat (Hitam - Belerang)", ["biomolekul"]]]}, {"n": "Kalor & Termodinamika", "e": "🔥", "c": "#f59e0b", "z": "", "i": "Suhu, kalorimetri, kalor jenis, perubahan wujud zat, pemuaian, perpindahan kalor, gas ideal, Hukum I Termo, proses gas, dan efisiensi Carnot.", "S": [["5.1 Suhu dan Skala Suhu", "<b>Konsep:</b> Suhu adalah derajat panas atau ukuran energi kinetik translasi rata-rata partikel dalam suatu zat. Empat skala termometer klasik memiliki perbandingan rentang titik tetap atas (titik didih air pada 1 atm) dan titik tetap bawah (titik lebur es murni): **Celcius (C : 0°–100°)**, **Reamur (R : 0°–80°)**, **Fahrenheit (F : 32°–212°)**, dan **Kelvin (K : 273–373)** dengan rasio skala **Delta C : Delta R : Delta F : Delta K = 5 : 4 : 9 : 5**. <b>Langkah soal:</b> (1) Dalam semua persamaan kimia fisik dan gas ideal (PV = nRT, tekanan osmotik pi = MRT, persamaan Arrhenius), suhu WAJIB dinyatakan dalam skala mutlak **Kelvin**: T(K) = T(°C) + 273. (2) Untuk konversi termometer berskala sembarang X dan Y, samakan fraksi posisi terhadap titik beku (T_b) dan titik didih (T_d): ⟦F:X - X_b¦X_d - X_b⟧ = ⟦F:Y - Y_b¦Y_d - Y_b⟧. <b>Jebakan:</b> Mengubah selisih suhu (Delta T) dari Celcius ke Kelvin dengan menambahkan 273! Ingat: untuk SELISIH suhu, **Delta T (K) = Delta T (°C)** karena rentang skalanya sama-sama 100 bagian! <b>Poin TKA:</b> Hati-hati membedakan suhu mutlak T (wajib + 273) pada rumus gas ideal PV = nRT dengan perubahan suhu Delta T (tidak ditambah 273) pada rumus kalor q = m c Delta T.", "C : R : (F - 32) : (K - 273) = 5 : 4 : 9 : 5 ; ⟦F:X - X_b¦X_d - X_b⟧ = ⟦F:C¦100⟧ ; Delta T(K) = Delta T(°C)", ["termo"]], ["5.2 Kalor dan Asas Black", "<b>Konsep:</b> Kalor (Q) adalah energi termal yang berpindah dari benda bersuhu tinggi ke benda bersuhu rendah. Dalam sistem terisolasi (seperti di dalam kalorimeter), berlaku **Asas Black** (Hukum Kekekalan Energi Termal): jumlah kalor yang dilepas oleh zat bersuhu lebih tinggi sama dengan jumlah kalor yang diterima oleh zat bersuhu lebih rendah (**Q_(lepas) = Q_(terima)**) hingga tercapai suhu kesetimbangan termal (T_c). <b>Langkah soal:</b> (1) Buat garis suhu vertikal: letakkan suhu zat panas T_1 di atas, suhu zat dingin T_2 di bawah, dan suhu campuran T_c di antaranya (T_2 < T_c < T_1). (2) Selalu tulis selisih suhu sebagai nilai POSITIF (besar dikurangi kecil): pada ruas Q_(lepas) gunakan (T_1 - T_c), dan pada ruas Q_(terima) gunakan (T_c - T_2). (3) Jika dua zat berwujud cair yang sejenis (kalor jenis c sama) dicampurkan tanpa perubahan wujud, suhu akhirnya dapat dihitung cepat dengan rata-rata tertimbang massa: T_c = ⟦F:m_1 T_1 + m_2 T_2¦m_1 + m_2⟧. <b>Jebakan:</b> Menggunakan (T_c - T_1) pada kedua ruas Q_(lepas) = Q_(terima) tanpa tanda minus, sehingga salah tanda aljabar saat mencari T_c! <b>Poin TKA:</b> Jika wadah atau kalorimeter memiliki kapasitas kalor C (⟦F:J¦°C⟧) yang tidak diabaikan, tambahkan suku C × (T_c - T_(wadah)) pada ruas penerima atau pelepas kalor sesuai suhu awal wadah!", "Q = m c Delta T ; Q_(lepas) = Q_(terima) ; m_1 c_1 (T_1 - T_c) = m_2 c_2 (T_c - T_2)", ["black"]], ["5.3 Kalor Jenis dan Kapasitas Kalor", "<b>Konsep:</b> (1) **Kalor Jenis (c, ⟦F:J¦g·°C⟧ atau ⟦F:J¦kg·K⟧)**: jumlah kalor yang diperlukan untuk menaikkan suhu **1 satuan massa (1 gram atau 1 kg)** suatu zat sebesar 1 °C (merupakan sifat **intensif** yang menjadi ciri khas jenis zat: c_(air) = 4,2 ⟦F:J¦g·°C⟧ sangat besar, sedangkan logam seperti Cu atau Fe memiliki c kecil ~0,4 ⟦F:J¦g·°C⟧). (2) **Kapasitas Kalor (C, ⟦F:J¦°C⟧ atau ⟦F:J¦K⟧)**: jumlah kalor yang diperlukan untuk menaikkan suhu **seluruh massa suatu benda atau alat** sebesar 1 °C (sifat **ekstensif**, C = m × c). <b>Langkah soal:</b> (1) Perhatikan satuan yang diberikan di soal: jika satuannya mengandung massa di penyebut (⟦F:J¦g·°C⟧ atau ⟦F:kal¦g·°C⟧), itu adalah Kalor Jenis (c -> rumus Q = m c Delta T). (2) Jika satuannya TIDAK mengandung satuan massa (hanya ⟦F:J¦°C⟧ atau ⟦F:J¦K⟧, misalnya pada kalorimeter bom), itu adalah Kapasitas Kalor (C -> rumus Q = C Delta T, jangan dikalikan massa lagi!). (3) Ingat bahwa zat dengan kalor jenis (c) KECIL akan sangat cepat panas dan cepat dingin, sedangkan zat dengan c BESAR (seperti air) lambat panas dan lambat dingin. <b>Jebakan:</b> Mengalikan kapasitas kalor kalorimeter C (⟦F:J¦°C⟧) dengan massa larutan m, sehingga satuannya menjadi J.g dan nilainya ratusan kali lipat terlalu besar! <b>Poin TKA:</b> Grafik suhu T terhadap waktu pemanasan t (dengan daya pemanas P konstan, Q = P × t): kemiringan (gradien) garis Delta ⟦F:T¦Delta⟧ t berbanding TERBALIK dengan kapasitas kalor C! Garis yang curam = c kecil (cepat panas); garis yang landai = c besar.", "C = m xx c ; Q = C Delta T = m c Delta T ; Q = P xx t ; Gradien (Delta ⟦F:T¦Delta⟧ t) = ⟦F:P¦m c⟧", ["kalorjenis"]], ["5.4 Perubahan Wujud Zat & Kalor Laten", "<b>Konsep:</b> Saat zat mengalami perubahan wujud (melebur atau mencair, membeku, menguap, mengembun, menyublim) pada tekanan tetap, **suhu zat TIDAK BERUBAH (Delta T = 0)** karena seluruh energi kalor digunakan untuk memutus atau membentuk gaya antarmolekul (disebut **Kalor Laten**, Q = m × L). (1) **Kalor Lebur atau Beku (L_f)**: untuk es pada 0 °C, L_f = 80 ⟦F:kal¦g⟧ = 336 ⟦F:J¦g⟧. (2) **Kalor Uap atau Embun (L_v)**: untuk air pada 100 °C, L_v = 540 ⟦F:kal¦g⟧ = 2.260 ⟦F:J¦g⟧. <b>Langkah soal:</b> (1) Pada grafik pemanasan Es (-T °C) -> Uap Air (>100 °C), pisahkan perhitungan menjadi beberapa tahap berurutan: Q_1 (menaikkan suhu es ke 0 °C: m c_(es) Delta T), Q_2 (meleburkan es di 0 °C: m L_f), Q_3 (menaikkan suhu air 0 °C ke 100 °C: m c_(air) Delta T), dan Q_4 (menguapkan air di 100 °C: m L_v). (2) Untuk soal pencampuran **Es 0 °C + Air Panas**: uji dulu apakah kalor maksimum dari air panas (saat turun ke 0 °C) cukup untuk meleburkan SELURUH es! Jika Q_(air->0) < m_(es) L_f, berarti es hanya mencair sebagian dan suhu akhir campuran pasti **0 °C**! <b>Jebakan:</b> Langsung memasukkan es 0 °C dan air panas ke rumus suhu campuran tanpa memeriksa apakah seluruh es mencair, sehingga diperoleh suhu akhir negatif yang mustahil! <b>Poin TKA:</b> Jebakan paling terkenal di TKA (Fisika maupun Kimia): jika kalor yang dilepas air panas untuk turun ke 0 °C LEBIH KECIL atau SAMA DENGAN kalor yang dibutuhkan untuk meleburkan seluruh es (m_(air) c_(air) T_(air) <= m_(es) L_f), maka suhu akhir campuran adalah tepat **0 °C** (campuran es dan air)!", "Melebur: Q = m L_f (L_(es) = 80 ⟦F:kal¦g⟧) ; Menguap: Q = m L_v (L_(uap) = 540 ⟦F:kal¦g⟧) ; Saat Ubah Wujud: Delta T = 0", ["wujud"]], ["5.5 Pemuaian Zat (Panjang, Luas & Volume)", "<b>Konsep:</b> Pemuaian termal terjadi karena kenaikan suhu memperbesar amplitudo getaran atom atau molekul sehingga jarak rata-rata antarpartikel bertambah: (1) **Muai Panjang (1D, zat padat)**: Delta L = L_0 × alpha × Delta T, sehingga L = L_0 (1 + alpha Delta T). (2) **Muai Luas (2D, zat padat)**: Delta A = A_0 × beta × Delta T, dengan koefisien muai luas **beta = 2 alpha**. (3) **Muai Volume (3D, padat & cair)**: Delta V = V_0 × gamma × Delta T, dengan koefisien muai ruang zat padat **gamma = 3 alpha**. Pada keping **Bimetal** (dua logam dengan alpha berbeda yang dikeling menjadi satu): saat **dipanaskan**, bimetal melengkung ke arah logam yang koefisien muainya **LEBIH KECIL**; saat **didinginkan**, melengkung ke arah logam yang koefisien muainya **LEBIH BESAR**. <b>Langkah soal:</b> (1) Untuk soal cairan yang tumpah ketika bejana berisi penuh cairan dipanaskan bersama-sama: gunakan selisih koefisien muai volume cairan dikurangi muai volume bejana (**Delta V_(tumpah) = V_0 (gamma_(cair) - 3 alpha_(bejana)) Delta T**). (2) Ingat **Anomali Air pada 0 °C – 4 °C**: saat dipanaskan dari 0 °C ke 4 °C, volume air justru MENYUSUT dan mencapai massa jenis maksimum (volume minimum) tepat pada suhu **4 °C**! <b>Jebakan:</b> Mengira lubang di tengah pelat logam akan menyempit ketika pelat dipanaskan, atau lupa mengalikan alpha bejana dengan 3 (gamma_(bejana) = 3 alpha) saat menghitung volume cairan yang tumpah! <b>Poin TKA:</b> Saat pelat berlubang dipanaskan, diameter lubang ikut MEMBESAR persis seolah-olah lubang tersebut terisi oleh logam yang sama!", "Delta L = L_0 alpha Delta T ; beta = 2 alpha ; gamma = 3 alpha ; V_(tumpah) = V_0 (gamma_(cair) - 3 alpha_(wadah)) Delta T", ["muai"]], ["5.6 Perpindahan Kalor (Konduksi, Konveksi & Radiasi)", "<b>Konsep:</b> Tiga mekanisme perpindahan kalor: (1) **Konduksi (Hantaran)**: melalui zat padat tanpa disertai perpindahan partikel zatnya: H = ⟦F:Q¦t⟧ = ⟦F:k × A × Delta T¦L.⟧ (2) **Konveksi (Aliran)**: melalui fluida (cair atau gas) yang disertai perpindahan massa partikel akibat perbedaan massa jenis: H = h × A × Delta T. (3) **Radiasi (Pancaran)**: melalui gelombang elektromagnetik tanpa memerlukan medium perantara (Hukum Stefan-Boltzmann): P = e × sigma × A × T^4 (suhu T wajib dalam **Kelvin**!). <b>Langkah soal:</b> (1) Untuk **Sambungan Dua Batang Konduktor Seri** (batang 1 dan batang 2 disambung ujung ke ujung), laju aliran kalor pada keadaan tunak adalah sama: **H_1 = H_2**, yaitu ⟦F:k_1 A_1 (T_1 - T_s)¦L_1⟧ = ⟦F:k_2 A_2 (T_s - T_2)¦L_2.⟧ (2) Untuk soal perbandingan laju radiasi termal pada dua suhu berbeda, ubah dulu suhu ke Kelvin lalu pangkatkan empat: ⟦F:P_2¦P_1⟧ = (⟦F:T_2¦T_1⟧)^4! <b>Jebakan:</b> Menghitung perbandingan daya radiasi ⟦F:P_2¦P_1⟧ menggunakan suhu dalam derajat Celcius (misal 200 °C dan 100 °C dikira rasionya 2^4 = 16, padahal harus (⟦F:473¦373⟧)^4)! <b>Poin TKA:</b> Soal menentukan suhu sambungan (T_s) antara dua batang logam yang memiliki luas dan panjang sama (T_s = ⟦F:k_1 T_1 + k_2 T_2¦k_1 + k_2⟧) adalah soal favorit nomor satu pada sub-topik perpindahan kalor!", "Konduksi: H = ⟦F:k A Delta T¦L⟧ ; Sambungan: H_1 = H_2 ; Konveksi: H = h A Delta T ; Radiasi: P = e sigma A T^4", ["perpindahan"]], ["5.7 Gas Ideal & Teori Kinetik Gas", "<b>Konsep:</b> Persamaan keadaan Gas Ideal menghubungkan tekanan (P), volume (V), jumlah mol (n), dan suhu mutlak (T): **P V = n R T = N k_B T**. Dengan mensubstitusikan n = ⟦F:m¦Mr⟧ dan massa jenis rho = ⟦F:m¦V,⟧ diperoleh rumus massa jenis gas ideal: **rho = ⟦F:P × Mr¦R × T⟧**. Menurut Teori Kinetik Gas: energi kinetik translasi rata-rata tiap molekul gas HANYA bergantung pada suhu mutlaknya (**E_k = (⟦F:3¦2⟧) k_B T**), dan kelajuan efektif molekul (root-mean-square speed) adalah **v_(rms) = sqrt(⟦F:3 R T¦Mr⟧)**. <b>Langkah soal:</b> (1) Perhatikan satuan R yang digunakan: jika P dalam atm dan V dalam Liter, gunakan **R = 0,082 ⟦F:L·atm¦mol·K⟧**; jika dalam satuan SI (P dalam Pa = ⟦F:N¦m^2⟧ dan V dalam m^3), gunakan **R = 8,314 ⟦F:J¦mol·K⟧**. (2) Pada suhu yang sama, dua gas yang berbeda jenis (misal H_2 dengan Mr = 2 dan O_2 dengan Mr = 32) memiliki **energi kinetik rata-rata molekul yang SAMA BESAR**, tetapi molekul gas yang Mr-nya lebih kecil bergerak jauh lebih cepat (v_(rms) berbanding terbalik dengan sqrt(Mr), sesuai Hukum Difusi Graham)! <b>Jebakan:</b> Menganggap bahwa pada suhu yang sama, molekul gas yang lebih berat (Mr besar seperti O_2) memiliki energi kinetik rata-rata lebih besar daripada molekul gas ringan (H_2)! <b>Poin TKA:</b> Perbandingan kelajuan efektif atau laju difusi dua gas pada suhu yang sama: ⟦F:v_1¦v_2⟧ = sqrt(⟦F:Mr_2¦Mr_1⟧) (terbalik di dalam akar!).", "P V = n R T ; ⟦F:P_1 V_1¦T_1⟧ = ⟦F:P_2 V_2¦T_2⟧ ; rho = ⟦F:P xx Mr¦R T⟧ ; E_k = ⟦F:3¦2⟧ k_B T ; v_(rms) = sqrt(⟦F:3 R T¦Mr⟧)", ["gasideal"]], ["5.8 Hukum I Termodinamika", "<b>Konsep:</b> Hukum I Termodinamika adalah hukum kekekalan energi pada proses termal yang menghubungkan Perubahan Energi Dalam (**Delta U**), Kalor (**Q**), dan Kerja (Usaha) (**W**). Terdapat dua konvensi tanda yang keduanya menghasilkan nilai fisik **Delta U** yang persis sama: (1) **Konvensi Fisika (W = usaha oleh gas)**: **Delta U = Q - W**, di mana W = +P Delta V jika gas **memuai (ekspansi)** (melakukan usaha) dan W = -P Delta V jika gas **dimampatkan (kompresi)**. (2) **Konvensi Kimia IUPAC (w = usaha pada sistem)**: **Delta U = q + w**, di mana **w = -P_(luar) Delta V** (jika gas memuai Delta V > 0 maka w bernilai negatif karena sistem kehilangan energi untuk mendorong piston!). <b>Langkah soal:</b> (1) Jangan bingung dengan rumus plus atau minus: tanyakan saja pada diri sendiri **'Apakah aksi ini menambah atau mengurangi energi tabungan sistem (U)?'** **Sistem menyerap kalor** -> menambah energi (+Q); **Sistem melepas kalor** -> mengurangi energi (-Q); **Gas dimampatkan (kompresi, V turun)** -> menambah energi sistem (+|P Delta V|); **Gas memuai (ekspansi, V naik)** -> menguras energi sistem (-|P Delta V|)! (2) Untuk gas ideal monoatomik (He, Ne, Ar), perubahan energi dalam adalah **Delta U = (⟦F:3¦2⟧) n R Delta T**. <b>Jebakan:</b> Salah memberi tanda pada usaha ekspansi (memuai) vs kompresi (dimampatkan) sehingga menjumlahkan usaha ekspansi ke dalam energi dalam! <b>Poin TKA:</b> Gunakan logika saldo tabungan energi: **Delta U = (Kalor Masuk - Kalor Keluar) + (Usaha Kompresi Masuk - Usaha Ekspansi Keluar)**. Dengan logika ini kamu tidak akan pernah tertukar antara konvensi Fisika maupun Kimia!", "Fisika: Delta U = Q - W (W_(ekspansi) = +P Delta V) ; Kimia: Delta U = q + w (w_(ekspansi) = -P Delta V) ; Gas Mono: Delta U = ⟦F:3¦2⟧ n R Delta T", ["termo1"]], ["5.9 Proses Isobarik, Isokhorik, Isotermal & Adiabatik", "<b>Konsep:</b> Empat proses termodinamika khusus pada gas ideal dan ciri khasnya pada diagram P–V: (1) **Isobarik (Tekanan Tetap, P konstan, garis mendatar)**: berlaku ⟦F:V_1¦T_1⟧ = ⟦F:V_2¦T_2⟧; usaha **W = P (V_2 - V_1)**, dan **Q = Delta U + W**. (2) **Isokhorik (Isovolumetrik) (Volume Tetap, V konstan, garis vertikal)**: berlaku ⟦F:P_1¦T_1⟧ = ⟦F:P_2¦T_2⟧; karena Delta V = 0 maka **usaha W = 0**, sehingga **Q = Delta U**! (3) **Isotermal (Suhu Tetap, T konstan, kurva hiperbola P V = konstan)**: karena Delta T = 0 maka **Delta U = 0**, sehingga seluruh kalor diubah menjadi usaha: **Q = W = n R T ln(⟦F:V_2¦V_1⟧)**! (4) **Adiabatik (Tanpa Pertukaran Kalor, Q = 0, kurva lebih curam dari isotermal: P V^(gamma) = konstan)**: karena **Q = 0**, maka **Delta U = -W** (saat memuai adiabatik, suhu gas turun drastis!). <b>Langkah soal:</b> (1) Pada grafik diagram P–V, besar usaha W sama dengan **LUAS DAERAH di bawah kurva lintasan terhadap sumbu Volume (V)**! (2) Untuk **Proses Siklus Tertutup** (kembali ke titik awal A -> B -> C -> A): perubahan energi dalam satu siklus penuh adalah **Delta U_(siklus) = 0**, dan usaha total satu siklus sama dengan **LUAS BANGUN TERTUTUP** siklus tersebut (positif jika searah jarum jam, negatif jika berlawanan arah jarum jam). <b>Jebakan:</b> Menganggap proses Isotermal memiliki Q = 0 karena 'suhunya tidak berubah'. Padahal Isotermal berarti **Delta T = 0 (sehingga Delta U = 0)**, sedangkan yang memiliki **Q = 0** adalah proses **Adiabatik**! <b>Poin TKA:</b> Hafalkan pasangan nol pada keempat proses: **Isokhorik -> W = 0**; **Isotermal -> Delta U = 0**; **Adiabatik -> Q = 0**; **Siklus -> Delta U_(siklus) = 0**!", "Isobarik: W = P Delta V ; Isokhorik: W = 0 (Q = Delta U) ; Isotermal: Delta U = 0 (Q = W = nRT ln(⟦F:V_2¦V_1⟧)) ; Adiabatik: Q = 0", ["prosesgas"]], ["5.10 Mesin Kalor, Siklus Carnot & Efisiensi", "<b>Konsep:</b> Hukum II Termodinamika menyatakan bahwa tidak mungkin membuat mesin kalor yang bekerja dalam siklus dan mengubah 100% kalor yang diserap menjadi usaha tanpa membuang sebagian kalor ke tandon suhu rendah. Pada **Mesin Kalor Carnot** (siklus reversibel paling ideal yang terdiri dari 2 proses isotermal dan 2 proses adiabatik): sistem menyerap kalor **Q_1** dari tandon suhu tinggi **T_1**, menghasilkan usaha **W = Q_1 - Q_2**, dan membuang kalor **Q_2** ke tandon suhu rendah **T_2**. Efisiensi maksimum Carnot: **eta = (⟦F:W¦Q_1⟧) × 100% = (1 - ⟦F:T_2¦T_1⟧) × 100%** (dengan T_1 dan T_2 wajib dalam **Kelvin**!). <b>Langkah soal:</b> (1) Ubah segera suhu tandon tinggi T_1 dan suhu tandon rendah T_2 dari °C menjadi **Kelvin (+273)**! (2) Jika soal meminta 'berapa suhu tandon tinggi T_1' baru agar efisiensi naik dari eta_1 menjadi eta_2 pada suhu rendah T_2 yang tetap, gunakan rumus cepat: **(1 - eta_1) T_1 = (1 - eta_2) T_1'** (dalam Kelvin)! (3) Untuk **Mesin Pendingin (Kulkas atau AC)**: ukurannya adalah Koefisien Performansi **COP = ⟦F:Q_2¦W⟧ = ⟦F:T_2¦T_1 - T_2⟧**. <b>Jebakan:</b> Memasukkan suhu dalam satuan °C langsung ke rumus efisiensi Carnot eta = 1 - ⟦F:T_2¦T_1,⟧ atau menggunakan rumus COP = ⟦F:T_1¦T_1 - T_2⟧ untuk mesin pendingin (seharusnya pembilangnya adalah suhu rendah **T_2**)! <b>Poin TKA:</b> Soal 'menaikkan efisiensi mesin Carnot dari 40% menjadi 50% dengan mengubah suhu tandon tinggi T_1' adalah soal klasik yang hampir selalu muncul!", "W = Q_1 - Q_2 ; eta = ⟦F:W¦Q_1⟧ = 1 - ⟦F:Q_2¦Q_1⟧ = 1 - ⟦F:T_2¦T_1⟧ (Kelvin!) ; COP_(pendingin) = ⟦F:Q_2¦W⟧ = ⟦F:T_2¦T_1 - T_2⟧", ["carnot"]]]}, {"n": "Kimia Unsur & Radiokimia", "e": "☢️", "c": "#8b5cf6", "z": "", "i": "Kimia unsur golongan utama, logam transisi & ion kompleks, pengolahan mineral, radioaktivitas, waktu paruh, dan kimia lingkungan.", "S": [["6.1 Unsur Golongan Utama (Alkali, Alkali Tanah, Halogen, Gas Mulia)", "<b>Konsep:</b> Sifat khas unsur golongan utama dalam SPU: (1) **Logam Alkali (IA: Li, Na, K, Rb, Cs)**: reduktor sangat kuat, kereaktifan dengan air MENINGKAT dari atas ke bawah, semua garamnya mudah larut. **Warna nyala api**: Li (merah tua), Na (kuning), K (ungu), Rb (merah ungu), Cs (biru). (2) **Logam Alkali Tanah (IIA: Be, Mg, Ca, Sr, Ba)**: **Warna nyala**: Ca (jingga-merah), Sr (merah), Ba (hijau). Kelarutan basa **M(OH)_2** dari atas ke bawah **MAKIN BESAR** (Ba(OH)_2 mudah larut), sedangkan kelarutan garam sulfat **MSO_4** dan kromat **MCrO_4** dari atas ke bawah **MAKIN KECIL** (BaSO_4 sukar larut atau mengendap)! (3) **Halogen (VIIA: F_2, Cl_2, Br_2, I_2)**: oksidator kuat dengan daya pengoksidasi **F_2 > Cl_2 > Br_2 > I_2** (halogen di atas mampu mendesak (mengusir) ion halida di bawahnya!). (4) **Gas Mulia (VIIIA)**: stabil, namun **Xenon (Xe)** dapat membentuk senyawa seperti XeF_2, XeF_4, XeF_6 karena energi ionisasi Xe cukup rendah. <b>Langkah soal:</b> (1) Untuk reaksi pendesakan halogen X_2 + 2Y^(-) -> 2X^(-) + Y_2: reaksi berlangsung SPONTAN jika X terletak LEBIH ATAS daripada Y di golongan VIIA (misal Cl_2 + 2Br^(-) -> 2Cl^(-) + Br_2 berlangsung, tetapi Br_2 + 2Cl^(-) TIDAK bereaksi!). (2) Untuk membedakan kation Ca^(2+) dan Ba^(2+), teteskan larutan Na_2SO_4 atau K_2CrO_4: ion Ba^(2+) akan segera mengendap sebagai BaSO_4 (putih) atau BaCrO_4 (kuning). <b>Jebakan:</b> Menganggap HF adalah asam halida paling kuat karena F paling elektronegatif. Padahal urutan kekuatan asam halida adalah **HI > HBr > HCl >> HF** (HF adalah asam lemah karena ikatan H-F sangat pendek dan sangat kuat sehingga sulit melepas H^(+))! <b>Poin TKA:</b> Tren kelarutan Alkali Tanah yang berlawanan (M(OH)_2 makin larut ke bawah vs MSO_4 makin mengendap ke bawah), urutan keasaman HI > HBr > HCl > HF, dan warna uji nyala selalu muncul di TKA!", "Oksidator VIIA: F_2 > Cl_2 > Br_2 > I_2 ; Kekuatan Asam: HI > HBr > HCl >> HF & HClO_4 > HClO_3 > HClO_2 > HClO", ["unsurutama"]], ["6.2 Unsur Transisi Periode 4 & Ion Kompleks", "<b>Konsep:</b> Unsur transisi periode 4 (Sc, Ti, V, Cr, M
