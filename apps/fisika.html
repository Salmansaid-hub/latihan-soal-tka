 m:["Arus yang makin deras membuat waktu menyeberang makin lama.","Arus sejajar tepi tidak mengubah komponen tegak lurus tepi. Akar kesalahannya: tidak memisahkan dua gerak yang saling bebas.","Arus hanya mengubah jarak hanyut (v_arus·t), bukan waktu menyeberang."]},
'0.6':{x:["Bola ditendang dengan laju 20 m/s pada sudut 30° (g = 10). Tentukan tinggi maksimum, waktu di udara, dan jarak mendatar.","Uraikan: v₀ᵧ = 20 sin30° = 10 m/s; v₀ₓ = 20 cos30° ≈ 17,3 m/s.||h maks = v₀ᵧ²/2g = 100/20 = 5 m.||Waktu di udara = 2v₀ᵧ/g = 2 s.||Jarak mendatar = v₀ₓ · t = 17,3 × 2 ≈ 34,6 m (sama dengan v₀² sin2θ/g).","h maks 5 m, waktu 2 s, jarak ≈ 34,6 m."],
 z:[["Dua peluru ditembakkan dengan laju sama pada sudut 30° dan 60°. Pernyataan yang benar…",["Jangkauan sama dan tinggi maksimum sama","Jangkauan sama, tinggi maksimum peluru 60° lebih besar","Jangkauan peluru 60° lebih jauh","Waktu di udara kedua peluru sama"],1,"R ∝ sin2θ sama untuk 30° dan 60°. H ∝ sin²θ dan T ∝ sinθ, keduanya lebih besar untuk 60°."],["Di titik tertinggi lintasan parabola, kecepatan benda…",["nol","sama dengan v₀","v₀ cosθ","v₀ sinθ"],2,"Di puncak v_y = 0 tetapi v_x = v₀ cosθ tetap karena tidak ada gaya mendatar."]],
 m:["Di puncak lintasan parabola kecepatan benda nol.","Yang nol hanya komponen vertikal. Komponen mendatar tidak berubah. Akar kesalahannya: memperlakukan kecepatan sebagai satu angka, bukan dua komponen.","Di puncak v = v₀ cosθ, dan percepatannya tetap g ke bawah."]},
'0.7':{x:["Roda berjari-jari 0,5 m berputar 120 rpm. Tentukan frekuensi, periode, kecepatan sudut, laju linear tepi, dan percepatan sentripetal.","f = 120 putaran/60 s = 2 Hz; T = 1/f = 0,5 s.||ω = 2πf = 4π ≈ 12,6 rad/s.||v = ωR = 4π × 0,5 = 2π ≈ 6,3 m/s.||a_s = ω²R = (4π)² × 0,5 = 8π² ≈ 79 m/s², mengarah ke pusat.","f = 2 Hz, T = 0,5 s, ω ≈ 12,6 rad/s, v ≈ 6,3 m/s, a_s ≈ 79 m/s²."],
 z:[["Pada gerak melingkar beraturan, besaran yang tetap adalah…",["kecepatan","percepatan","kelajuan","gaya sentripetal (sebagai vektor)"],2,"Kelajuan (besar kecepatan) tetap. Kecepatan, percepatan, dan gaya sentripetal arahnya terus berubah."],["Jari-jari dua kali dengan ω tetap. Laju linear menjadi…",["setengah kali","tetap","2 kali","4 kali"],2,"v = ωR, sehingga v sebanding R."]],
 m:["GMB tidak punya percepatan karena lajunya tetap.","Percepatan adalah perubahan vektor kecepatan, termasuk perubahan arah. Akar kesalahannya: menyamakan percepatan dengan perubahan laju.","GMB punya percepatan sentripetal a_s = v²/R yang selalu menuju pusat."]},
'0.8':{x:["Roda A (R = 20 cm) bersinggungan dengan roda B (R = 10 cm). Roda C (R = 30 cm) sepusat dengan B. Jika ω_A = 5 rad/s, hitung laju tepi roda C.","Bersinggungan: v_A = v_B. v_A = ω_A·R_A = 5 × 20 = 100 cm/s, jadi v_B = 100 cm/s.||ω_B = v_B/R_B = 100/10 = 10 rad/s.||C sepusat dengan B: ω_C = ω_B = 10 rad/s.||v_C = ω_C·R_C = 10 × 30 = 300 cm/s = 3 m/s.","v_C = 3 m/s (tiga kali v_A)."],
 z:[["Dua roda dihubungkan rantai. Roda kecil berjari-jari R, roda besar 3R. Perbandingan ω roda kecil : roda besar…",["1 : 3","3 : 1","1 : 9","9 : 1"],1,"Rantai membuat v sama: ω_kecil·R = ω_besar·3R, sehingga ω_kecil : ω_besar = 3 : 1."],["Pada dua roda sepusat, besaran yang sama adalah…",["laju linear tepi","kecepatan sudut","percepatan sentripetal","jari-jari"],1,"Satu poros berarti satu kecepatan sudut."]],
 m:["Dua roda yang bersinggungan memiliki kecepatan sudut yang sama.","Yang sama adalah laju linear di titik singgung. Karena v = ωR, roda lebih kecil berputar lebih cepat.","Singgung/rantai: v sama. Sepusat: ω sama."]},
'1.0':{x:["Balok 5 kg di lantai mendatar kasar (μ = 0,2) ditarik gaya mendatar 30 N. Tentukan percepatan balok (g = 10 m/s²).","Gambar diagram benda bebas: w = mg = 50 N ke bawah, N ke atas, F = 30 N ke kanan, gesekan f ke kiri.||Sumbu vertikal: tidak ada percepatan, sehingga N = w = 50 N.||Gesekan maksimum = μN = 0,2 × 50 = 10 N. Karena F = 30 N > 10 N, balok bergerak dan f = 10 N.||Sumbu mendatar: ΣF = F − f = 30 − 10 = 20 N, sehingga a = ΣF/m = 20/5 = 4 m/s².","a = 4 m/s² ke arah tarikan."],
 z:[["Balok 2 kg diam di lantai datar. Gaya normal pada balok adalah… (g = 10 m/s²)",["0 N","10 N","20 N","40 N"],2,"Balok tidak bergerak vertikal, jadi ΣFᵧ = 0 dan N = w = mg = 20 N."],["Balok ditarik gaya mendatar 12 N tetapi tetap diam. Gaya gesek statis pada balok adalah…",["0 N","12 N","lebih besar dari 12 N","μN"],1,"Balok diam berarti ΣF = 0, sehingga gesekan statis menyesuaikan diri menjadi 12 N, melawan tarikan. μN hanya batas maksimumnya."]],
 m:["Gaya normal selalu sama dengan berat benda.","N adalah gaya tegak lurus permukaan yang menyesuaikan diri agar benda tidak menembus bidang. Akar kesalahannya: menghafal N = mg tanpa melihat gaya lain yang tegak lurus bidang.","Tentukan N dari ΣF tegak lurus bidang = 0. Pada bidang miring N = mg cosθ; bila benda ditarik ke atas dengan F, N = mg − F."]},
'1.1':{x:["Mobil 1200 kg dari diam mencapai 20 m/s dalam 10 s dengan percepatan tetap. Berapa gaya total yang bekerja pada mobil?","Cari percepatan: a = Δv/Δt = (20 − 0)/10 = 2 m/s².||Hukum II Newton: ΣF = ma = 1200 × 2 = 2400 N.","Gaya total 2400 N searah gerak."],
 z:[["Pasangan gaya aksi–reaksi memiliki ciri…",["sama besar, berlawanan arah, bekerja pada benda yang sama","sama besar, berlawanan arah, bekerja pada benda yang berbeda","berbeda besar, berlawanan arah, benda berbeda","sama besar, searah, benda berbeda"],1,"Hukum III: F_aksi = −F_reaksi dan bekerja pada dua benda yang berbeda, itulah sebabnya keduanya tidak saling meniadakan."],["Benda 4 kg dikenai gaya total 12 N. Percepatannya…",["0,33 m/s²","3 m/s²","8 m/s²","48 m/s²"],1,"a = ΣF/m = 12/4 = 3 m/s²."]],
 m:["Karena aksi sama dengan reaksi, gaya-gayanya saling meniadakan sehingga benda tidak pernah bergerak.","Pasangan aksi–reaksi bekerja pada dua benda berbeda, jadi tidak bisa dijumlahkan pada satu benda. Akar kesalahannya: menjumlahkan gaya yang bekerja pada benda yang berbeda.","Gerak satu benda ditentukan oleh ΣF yang bekerja pada benda itu saja."]},
'1.2':{x:["Balok 10 kg diam di lantai (μₛ = 0,4; μₖ = 0,3). (a) Apakah balok bergerak bila ditarik 35 N? (b) Berapa percepatannya bila ditarik 45 N? (g = 10)","N = mg = 100 N. Gesekan statis maksimum = μₛN = 0,4 × 100 = 40 N.||(a) F = 35 N < 40 N → balok masih diam, gesekan statis = 35 N.||(b) F = 45 N > 40 N → balok bergerak, gesekan berubah menjadi kinetis: f = μₖN = 30 N.||ΣF = 45 − 30 = 15 N → a = 15/10 = 1,5 m/s².","(a) tetap diam, f = 35 N; (b) a = 1,5 m/s²."],
 z:[["Pegas k = 200 N/m ditarik sejauh 5 cm. Gaya pegas…",["1 N","10 N","100 N","1000 N"],1,"F = kx = 200 × 0,05 = 10 N (ingat mengubah cm ke m)."],["Dibandingkan gesekan statis maksimum, gesekan kinetis pada permukaan yang sama biasanya…",["lebih besar","sama besar","lebih kecil","nol"],2,"Umumnya μₖ < μₛ, sehingga benda terasa lebih ringan digerakkan setelah mulai meluncur."]],
 m:["Gaya gesek selalu dihitung dengan f = μN.","Rumus itu hanya berlaku untuk gesekan kinetis, atau sebagai batas maksimum gesekan statis. Saat benda diam, gesekan menyesuaikan gaya luar. Akar kesalahannya: memakai rumus batas sebagai nilai.","Periksa dahulu apakah F melebihi μₛN. Jika tidak, f = F (diam). Jika ya, f = μₖN."]},
'1.3':{x:["Balok 2 kg meluncur pada bidang miring 37° dengan μₖ = 0,5. Hitung percepatannya (sin37° = 0,6; cos37° = 0,8; g = 10).","Uraikan berat: komponen sejajar bidang mg sinθ = 12 N, tegak lurus mg cosθ = 16 N.||Tegak lurus bidang: N = 16 N, gesekan f = μₖN = 8 N.||Sejajar bidang: ΣF = 12 − 8 = 4 N → a = 4/2 = 2 m/s².||Cek cepat dengan rumus: a = g(sinθ − μcosθ) = 10(0,6 − 0,4) = 2 m/s².","a = 2 m/s² menuruni bidang."],
 z:[["Balok meluncur pada bidang miring licin sudut 30°. Percepatannya… (g = 10)",["2,5 m/s²","5 m/s²","8,7 m/s²","10 m/s²"],1,"a = g sinθ = 10 × 0,5 = 5 m/s²."],["Massa balok dua kali lipat pada bidang miring yang sama. Percepatan balok…",["menjadi dua kali","menjadi setengah","tetap","menjadi empat kali"],2,"Massa muncul di kedua sisi persamaan ΣF = ma sehingga saling meniadakan: a = g(sinθ − μcosθ)."]],
 m:["Balok yang lebih berat meluncur lebih cepat di bidang miring.","Gaya penggerak (mg sinθ) bertambah, tetapi massa yang digerakkan juga bertambah dengan perbandingan sama, begitu pula gesekan. Akar kesalahannya: melihat gaya tanpa melihat massa.","Percepatan tidak bergantung massa: a = g(sinθ − μcosθ)."]},
'1.4':{x:["Dua benda dihubungkan tali melewati katrol licin (mesin Atwood): m₁ = 2 kg dan m₂ = 3 kg. Hitung percepatan dan tegangan tali (g = 10).","Anggap sistem sebagai satu benda: gaya penggerak = (m₂ − m₁)g = 10 N, massa total 5 kg.||a = 10/5 = 2 m/s² (m₂ turun, m₁ naik).||Tinjau m₁ saja: T − m₁g = m₁a → T = 20 + 4 = 24 N.||Cek dengan m₂: m₂g − T = m₂a → 30 − 24 = 6 = 3 × 2 ✓.","a = 2 m/s², T = 24 N."],
 z:[["Pada mesin Atwood dengan m₁ = m₂, percepatan sistem…",["g","g/2","0","2g"],2,"Selisih berat nol sehingga tidak ada gaya penggerak: a = 0."],["Balok 2 kg dan 3 kg bersentuhan di lantai licin. Balok 2 kg didorong gaya 10 N. Gaya kontak yang diterima balok 3 kg…",["4 N","6 N","10 N","15 N"],1,"a = 10/5 = 2 m/s². Balok 3 kg dipercepat oleh gaya kontak N = 3 × 2 = 6 N."]],
 m:["Tegangan tali pada mesin Atwood sama dengan berat massa yang lebih berat.","Karena massa berat bergerak turun dipercepat, tali tidak menahan seluruh beratnya. Akar kesalahannya: memakai kondisi seimbang pada sistem yang bergerak.","T selalu terletak di antara m₁g dan m₂g: T = 2m₁m₂g/(m₁ + m₂)."]},
'1.5':{x:["Seseorang bermassa 60 kg berdiri di atas timbangan dalam lift. Berapa bacaan timbangan bila lift (a) dipercepat naik 2 m/s², (b) dipercepat turun 2 m/s²? (g = 10)","Timbangan membaca gaya normal N, bukan massa.||(a) Percepatan ke atas: N − mg = ma → N = m(g + a) = 60 × 12 = 720 N.||(b) Percepatan ke bawah: mg − N = ma → N = m(g − a) = 60 × 8 = 480 N.","(a) 720 N (terasa lebih berat); (b) 480 N (terasa lebih ringan)."],
 z:[["Lift turun dengan kecepatan konstan. Gaya normal pada orang di dalamnya…",["lebih besar dari beratnya","sama dengan beratnya","lebih kecil dari beratnya","nol"],1,"Kecepatan konstan berarti a = 0 sehingga N = mg."],["Lift naik tetapi diperlambat 2 m/s². Bacaan timbangan dibanding berat orang…",["lebih besar","sama","lebih kecil","nol"],2,"Naik diperlambat berarti percepatan ke bawah, jadi N = m(g − a) lebih kecil."]],
 m:["Saat lift bergerak naik, timbangan selalu menunjukkan nilai lebih besar dari berat.","Yang menentukan adalah arah percepatan, bukan arah gerak. Naik dengan kecepatan konstan memberi N = mg, naik diperlambat memberi N < mg. Akar kesalahannya: menyamakan kecepatan dengan percepatan.","Percepatan ke atas → N > mg; ke bawah → N < mg; nol → N = mg."]},
'1.6':{x:["Mobil 1000 kg menikung di jalan datar berjari-jari 50 m dengan koefisien gesek 0,5. Berapa kecepatan maksimum agar tidak selip? (g = 10)","Di tikungan datar, gaya sentripetal berasal dari gesekan statis: μmg = mv²/R.||Massa saling meniadakan: v_maks = √(μgR) = √(0,5 × 10 × 50) = √250.||v_maks ≈ 15,8 m/s ≈ 57 km/jam.","v_maks ≈ 15,8 m/s (±57 km/jam), tidak bergantung massa mobil."],
 z:[["Bola 0,5 kg diputar pada lintasan vertikal berjari-jari 1 m. Di titik terendah lajunya 6 m/s. Tegangan tali…(g = 10)",["5 N","18 N","23 N","13 N"],2,"Di titik terendah T − mg = mv²/R → T = 5 + 0,5 × 36/1 = 23 N."],["Syarat minimum agar benda tetap menempel di puncak lintasan lingkaran vertikal (tali tetap tegang)…",["v = 0","v ≥ √(gR)","v ≥ gR","v ≥ √(2gR)"],1,"Di puncak mg + N = mv²/R; batas N = 0 memberi v = √(gR)."]],
 m:["Gaya sentripetal adalah gaya tambahan yang harus digambar pada diagram benda bebas.","Gaya sentripetal bukan jenis gaya baru, melainkan nama untuk resultan gaya yang mengarah ke pusat. Akar kesalahannya: menghitung dua kali gaya yang sama.","Gambar hanya gaya nyata (berat, normal, tegangan, gesekan), lalu pilih resultan ke arah pusat = mv²/R."]},
'1.7':{x:["Bola 0,2 kg tiba pada dinding dengan kecepatan 10 m/s, lalu memantul dengan 8 m/s berlawanan arah. Waktu kontak 0,01 s. Hitung impuls dan gaya rata-rata pada bola.","Pilih arah menuju dinding sebagai positif: v₁ = +10 m/s, v₂ = −8 m/s.||Impuls = Δp = m(v₂ − v₁) = 0,2 × (−8 − 10) = −3,6 N·s (arah menjauhi dinding).||F = I/Δt = 3,6/0,01 = 360 N.","Impuls 3,6 N·s; gaya rata-rata 360 N."],
 z:[["Airbag mengurangi cedera karena…",["mengurangi perubahan momentum","memperpanjang waktu tumbukan sehingga gaya lebih kecil","menambah massa pengemudi","menambah kecepatan mobil"],1,"Perubahan momentum sama, tetapi F = Δp/Δt: Δt besar → F kecil."],["Gaya 20 N bekerja 0,5 s pada benda 2 kg yang mula-mula diam. Kecepatan akhirnya…",["2,5 m/s","5 m/s","10 m/s","20 m/s"],1,"I = FΔt = 10 N·s = mv → v = 10/2 = 5 m/s."]],
 m:["Bola memantul: Δp = m(v₂ − v₁) = 0,2(8 − 10) = −0,4 N·s.","Pemantulan membalik arah, jadi kecepatan akhir bertanda berlawanan. Akar kesalahannya: mengabaikan tanda vektor.","Tentukan arah positif dahulu: Δp = m(−8 − 10) = −3,6 N·s, besar 3,6."]},
'1.8':{x:["Benda 2 kg bergerak 6 m/s menumbuk benda 4 kg yang diam dan keduanya menyatu. Tentukan kecepatan akhir dan energi kinetik yang hilang.","Momentum kekal: 2 × 6 + 0 = (2 + 4) v′ → v′ = 12/6 = 2 m/s.||Ek awal = ½ × 2 × 36 = 36 J.||Ek akhir = ½ × 6 × 4 = 12 J.||Energi hilang = 36 − 12 = 24 J (menjadi kalor dan deformasi).","v′ = 2 m/s; energi hilang 24 J."],
 z:[["Dua benda bermassa sama bertumbukan lenting sempurna dan salah satunya semula diam. Setelah tumbukan…",["keduanya diam","kecepatan saling bertukar","keduanya menyatu","benda pertama berbalik arah dengan laju sama"],1,"Pada massa sama dengan e = 1, benda yang bergerak berhenti dan benda yang diam bergerak dengan kecepatan semula."],["Bola dijatuhkan dari 1,0 m dan memantul setinggi 0,25 m. Koefisien restitusi…",["0,25","0,5","0,75","1"],1,"e = √(h′/h) = √(0,25) = 0,5."]],
 m:["Pada tumbukan tak lenting momentum tidak kekal karena energi berkurang.","Momentum kekal selama tidak ada gaya luar, apa pun jenis tumbukannya. Yang tidak kekal adalah energi kinetik. Akar kesalahannya: mencampur dua hukum kekekalan yang berbeda.","Momentum selalu kekal; energi kinetik kekal hanya pada tumbukan lenting sempurna (e = 1)."]},
'1.9':{x:["Granat diam meledak menjadi dua bagian: 2 kg dan 6 kg. Bagian 2 kg terlempar 9 m/s ke kiri. Berapa kecepatan bagian 6 kg?","Granat awalnya diam, jadi momentum total awal = 0.||Momentum kekal: 0 = m₁v₁ + m₂v₂ = 2(−9) + 6v₂.||v₂ = 18/6 = 3 m/s ke kanan.","Bagian 6 kg bergerak 3 m/s ke kanan."],
 z:[["Senapan 4 kg menembakkan peluru 20 g dengan kecepatan 400 m/s. Kecepatan rekoil senapan…",["0,5 m/s","2 m/s","8 m/s","20 m/s"],1,"0 = m_p v_p + M v_s → v_s = 0,02 × 400/4 = 2 m/s ke arah berlawanan."],["Setelah ledakan benda diam menjadi dua bagian, bagian yang lebih ringan akan…",["bergerak lebih lambat","bergerak lebih cepat","diam","bergerak sama cepat"],1,"Momentum sama besar: v berbanding terbalik dengan massa, sehingga yang ringan lebih cepat."]],
 m:["Pada ledakan momentum tidak kekal karena benda hancur.","Gaya ledakan adalah gaya dalam yang berpasangan, sehingga momentum total tetap. Akar kesalahannya: mengira kekacauan berarti ketidakkekalan.","Momentum total kekal; energi kinetik total bertambah karena energi kimia atau pegas berubah menjadi gerak."]},
'2.0':{x:["Balok bermassa 4 kg berukuran 20 cm × 10 cm × 5 cm diletakkan di lantai. Hitung tekanan terbesar dan terkecil yang diberikan balok pada lantai (g = 10).","Gaya pada lantai sama dengan berat: F = mg = 40 N.||Tekanan terbesar terjadi pada alas terkecil: 10 cm × 5 cm = 50 cm² = 5×10⁻³ m². P = F/A = 40/(5×10⁻³) = 8000 Pa.||Tekanan terkecil pada alas terbesar: 20 × 10 = 200 cm² = 2×10⁻² m². P = 40/(2×10⁻²) = 2000 Pa.","Tekanan terbesar 8000 Pa, terkecil 2000 Pa (perbandingan 4 : 1)."],
 z:[["Air 200 cm³ (ρ = 1 g/cm³) dicampur dengan 100 cm³ minyak (ρ = 0,8 g/cm³). Massa jenis campuran…",["0,80 g/cm³","0,93 g/cm³","1,00 g/cm³","0,90 g/cm³"],1,"Massa total = 200 + 80 = 280 g; volume total = 300 cm³. ρ = 280/300 ≈ 0,93 g/cm³. Jangan merata-ratakan massa jenis begitu saja."],["Dengan gaya yang sama, luas bidang sentuh dijadikan dua kali. Tekanan menjadi…",["setengah kali","tetap","dua kali","empat kali"],0,"P = F/A, sehingga A dua kali membuat P setengahnya."]],
 m:["Zat yang lebih berat selalu memiliki massa jenis yang lebih besar.","Massa jenis adalah massa per volume, bukan massa saja. Satu balok besar bisa lebih berat tetapi ρ kecil (kayu), sedangkan koin kecil ρ-nya besar. Akar kesalahannya: membandingkan massa tanpa memperhitungkan volume.","ρ = m/V. Bandingkan massa untuk volume yang sama, atau hitung rasionya."]},
'2.1':{x:["Berapa tekanan mutlak pada kedalaman 12 m di danau? (ρ air = 1000 kg/m³, P₀ = 1×10⁵ Pa, g = 10 m/s²)","Tekanan hidrostatis: P_h = ρgh = 1000 × 10 × 12 = 1,2×10⁵ Pa.||Tekanan mutlak = tekanan atmosfer + hidrostatis.||P = 1×10⁵ + 1,2×10⁵ = 2,2×10⁵ Pa.","Tekanan mutlak 2,2×10⁵ Pa (sekitar 2,2 atm)."],
 z:[["Pipa U berisi air (1000 kg/m³) dan minyak. Dari bidang batas, tinggi air 8 cm dan tinggi minyak 10 cm. Massa jenis minyak…",["600 kg/m³","800 kg/m³","1000 kg/m³","1250 kg/m³"],1,"Di bidang batas tekanan sama: ρ_air h_air = ρ_minyak h_minyak → 1000 × 8 = ρ × 10 → ρ = 800 kg/m³."],["Tekanan hidrostatis di suatu titik dalam cairan bergantung pada…",["bentuk wadah","luas dasar wadah","kedalaman dan massa jenis cairan","volume total cairan"],2,"P = ρgh. Bentuk wadah, luas dasar, dan volume total tidak berpengaruh."]],
 m:["Tekanan di dasar wadah yang lebih lebar selalu lebih besar.","P = ρgh hanya bergantung pada kedalaman vertikal. Wadah lebar menampung lebih banyak air dan gaya totalnya lebih besar, tetapi tekanannya sama. Akar kesalahannya: menyamakan gaya total dengan tekanan.","Pada kedalaman dan cairan sama, tekanan sama berapa pun lebar atau bentuk wadahnya."]},
'2.2':{x:["Dongkrak hidrolik memiliki piston kecil berdiameter 4 cm dan piston besar berdiameter 20 cm. Gaya 100 N diberikan pada piston kecil. Berapa gaya pada piston besar, dan berapa jauh piston kecil harus turun agar piston besar naik 1 cm?","Perbandingan luas = (d₂/d₁)² = (20/4)² = 25.||F₂ = F₁ × (A₂/A₁) = 100 × 25 = 2500 N.||Volume cairan kekal: A₁d₁ = A₂d₂ → d₁ = 25 × 1 cm = 25 cm.","F₂ = 2500 N; piston kecil harus turun 25 cm."],
 z:[["Perbandingan luas piston besar dan kecil 16 : 1. Gaya 50 N pada piston kecil menghasilkan gaya pada piston besar…",["50 N","200 N","800 N","8 N"],2,"F₂ = 50 × 16 = 800 N."],["Dibandingkan usaha pada piston kecil, usaha pada piston besar…",["lebih besar","lebih kecil","sama","tidak dapat ditentukan"],2,"Kekekalan energi: F₁d₁ = F₂d₂. Gaya diperbesar, jarak diperkecil."]],
 m:["Dongkrak hidrolik melipatgandakan usaha.","Yang dilipatgandakan adalah gaya, bukan usaha. Piston besar bergerak lebih pendek sehingga F × d sama. Akar kesalahannya: menyamakan gaya dengan energi.","Gaya naik sebanding A₂/A₁, jarak turun dengan faktor yang sama, usaha tetap."]},
'2.3':{x:["Balok kayu bermassa jenis 600 kg/m³ dan volume 0,05 m³ mengapung di air. Tentukan (a) bagian yang tercelup, (b) massa beban maksimum di atasnya agar tidak tenggelam. (g = 10)","(a) Mengapung: fraksi tercelup = ρ_b/ρ_f = 600/1000 = 0,6, jadi 60% atau 0,03 m³ tercelup.||(b) Berat kayu w = ρVg = 600 × 0,05 × 10 = 300 N.||Gaya apung maksimum (tercelup penuh) = 1000 × 10 × 0,05 = 500 N.||Beban maksimum: 500 − 300 = 200 N → massa 20 kg.","(a) 60%; (b) 20 kg."],
 z:[["Batu 5 kg bervolume 2×10⁻³ m³ dicelupkan penuh ke air (g = 10). Berat semu batu…",["50 N","30 N","20 N","70 N"],1,"w = 50 N, F_A = 1000 × 10 × 2×10⁻³ = 20 N, w_semu = 50 − 20 = 30 N."],["Benda bermassa jenis 1000 kg/m³ dimasukkan ke air murni. Benda akan…",["mengapung","melayang","tenggelam","naik lalu tenggelam"],1,"ρ benda = ρ air sehingga w = F_A pada seluruh volume: melayang."]],
 m:["Gaya apung bertambah jika benda dibenamkan lebih dalam.","F_A = ρ g V_tercelup. Setelah tercelup penuh, V_tercelup tidak bertambah sehingga F_A tetap. Akar kesalahannya: menyamakan tekanan yang membesar dengan gaya apung.","Gaya apung hanya bergantung massa jenis fluida dan volume yang tercelup, bukan kedalaman."]},
'2.4':{x:["Pipa kapiler berjari-jari 0,5 mm dimasukkan ke air (γ = 0,072 N/m, θ ≈ 0°, ρ = 1000 kg/m³, g = 10). Berapa tinggi air naik?","Gunakan h = 2γ cosθ/(ρ g r).||Ubah jari-jari: r = 0,5 mm = 5×10⁻⁴ m.||h = 2 × 0,072 × 1/(1000 × 10 × 5×10⁻⁴) = 0,144/5 = 0,0288 m.","h ≈ 2,9 cm."],
 z:[["Jari-jari pipa kapiler diperkecil menjadi setengahnya. Kenaikan air menjadi…",["setengah kali","tetap","dua kali","empat kali"],2,"h ∝ 1/r, sehingga r setengah → h dua kali."],["Raksa dalam pipa kapiler akan…",["naik seperti air","turun","tetap","tidak berpengaruh"],1,"Sudut kontak raksa lebih dari 90° (kohesi lebih kuat dari adhesi), sehingga permukaan raksa justru turun."]],
 m:["Serangga dapat berjalan di atas air karena massa jenisnya lebih kecil dari air.","Massa jenis serangga umumnya lebih besar dari air. Ia ditopang oleh tegangan permukaan yang menahan kakinya. Akar kesalahannya: memakai Archimedes untuk gejala yang disebabkan gaya permukaan.","Tegangan permukaan membuat permukaan air bersifat seperti selaput kenyal yang mampu menahan benda ringan."]},
'2.5':{x:["Air mengalir di pipa berdiameter 8 cm dengan laju 2 m/s, lalu pipa menyempit menjadi 4 cm. Hitung laju di bagian sempit dan debitnya.","Kontinuitas: A₁v₁ = A₂v₂ dan A ∝ d².||v₂ = v₁ × (d₁/d₂)² = 2 × (8/4)² = 2 × 4 = 8 m/s.||Debit Q = A₁v₁ = π(0,04)² × 2 = π × 1,6×10⁻³ × 2 ≈ 1,0×10⁻² m³/s.","v₂ = 8 m/s; Q ≈ 0,01 m³/s (10 L/s)."],
 z:[["Diameter pipa dikecilkan menjadi setengahnya. Laju air di bagian sempit menjadi…",["2 kali","4 kali","8 kali","setengah kali"],1,"v ∝ 1/A ∝ 1/d², sehingga d setengah → v empat kali."],["Bak 600 liter diisi dengan debit 5 L/s. Waktu hingga penuh…",["30 s","120 s","300 s","3000 s"],1,"t = V/Q = 600/5 = 120 s."]],
 m:["Pipa menyempit membuat kecepatan naik, sehingga debit ikut naik.","Debit Q = Av tetap sepanjang pipa: A turun dan v naik saling mengimbangi. Akar kesalahannya: hanya melihat satu faktor dari hasil kali.","Debit tetap (tanpa percabangan); laju berbanding terbalik dengan luas penampang."]},
'2.6':{x:["Tangki tertutup rapat di bagian bawah, tinggi air dari tanah 5 m. Lubang kecil dibuat pada kedalaman 1,25 m dari permukaan air. Hitung laju air keluar dan jarak jatuh mendatarnya. (g = 10)","Torricelli: v = √(2gh) = √(2 × 10 × 1,25) = √25 = 5 m/s.||Tinggi lubang dari tanah H′ = 5 − 1,25 = 3,75 m.||Waktu jatuh: t = √(2H′/g) = √(0,75) ≈ 0,87 s.||Jarak mendatar: x = v·t = 5 × 0,87 ≈ 4,33 m. Cek: x = 2√(h·H′) = 2√(1,25 × 3,75) ≈ 4,33 m ✓.","v = 5 m/s; jarak jatuh ≈ 4,3 m."],
 z:[["Menurut Bernoulli, aliran udara di atas sayap pesawat lebih cepat daripada di bawahnya sehingga…",["tekanan atas lebih tinggi","tekanan atas lebih rendah sehingga muncul gaya angkat","tekanan sama","pesawat turun"],1,"Aliran cepat berarti tekanan rendah; selisih tekanan menghasilkan gaya angkat ke atas."],["Tangki setinggi air 4 m memiliki lubang pada kedalaman 1 m dan 3 m dari permukaan. Perbandingan jarak jatuh horizontal kedua pancaran…",["1 : 3","1 : √3","1 : 1","3 : 1"],2,"x = 2√(h·H′): untuk (1, 3) dan (3, 1) hasil kalinya sama sehingga jaraknya sama."]],
 m:["Fluida yang mengalir lebih cepat memiliki tekanan lebih besar.","Bernoulli: P + ½ρv² + ρgh = konstan; bila v naik, P turun. Akar kesalahannya: mengaitkan gerak cepat dengan tekanan tinggi karena terasa kuat.","Aliran cepat ↔ tekanan rendah (pada ketinggian sama), seperti pada sayap pesawat dan venturimeter."]},
'3.0':{x:["Seutas tali digetarkan hingga terbentuk 3 gelombang sepanjang 1,5 m dalam waktu 0,5 s. Tentukan panjang gelombang, frekuensi, dan cepat rambatnya.","Panjang gelombang: λ = panjang/jumlah gelombang = 1,5/3 = 0,5 m.||Frekuensi: f = jumlah gelombang/waktu = 3/0,5 = 6 Hz.||Cepat rambat: v = λf = 0,5 × 6 = 3 m/s.","λ = 0,5 m, f = 6 Hz, v = 3 m/s."],
 z:[["Ketika gelombang berpindah dari satu medium ke medium lain, besaran yang tidak berubah adalah…",["cepat rambat","panjang gelombang","frekuensi","amplitudo"],2,"Frekuensi ditentukan oleh sumber getar. Cepat rambat dan panjang gelombang berubah menyesuaikan medium."],["Gelombang bunyi di udara termasuk gelombang…",["transversal","longitudinal","elektromagnetik","stasioner saja"],1,"Partikel udara bergetar sejajar arah rambat, membentuk rapatan dan renggangan."]],
 m:["Gelombang membawa partikel medium dari sumber ke penerima.","Yang berpindah hanyalah energi dan bentuk gangguan. Partikel medium hanya bergetar di sekitar kesetimbangannya, seperti gabus di air yang naik-turun saja. Akar kesalahannya: membayangkan gelombang sebagai aliran materi.","Gelombang memindahkan energi tanpa memindahkan materi mediumnya."]},
'3.1':{x:["Gelombang berjalan memenuhi y = 0,04 sin(4πt − 0,5πx) meter. Tentukan amplitudo, frekuensi, panjang gelombang, cepat rambat, dan arah rambatnya.","Bandingkan dengan y = A sin(ωt − kx): A = 0,04 m, ω = 4π rad/s, k = 0,5π rad/m.||Frekuensi: f = ω/2π = 4π/2π = 2 Hz.||Panjang gelombang: λ = 2π/k = 2π/0,5π = 4 m.||Cepat rambat: v = λf = 4 × 2 = 8 m/s (atau ω/k = 8). Tanda minus pada (ωt − kx) berarti merambat ke +x.","A = 4 cm, f = 2 Hz, λ = 4 m, v = 8 m/s ke arah +x."],
 z:[["Persamaan y = A sin(ωt + kx) menggambarkan gelombang yang merambat ke arah…",["+x","−x","+y","tidak merambat"],1,"Tanda plus antara ωt dan kx berarti merambat ke arah −x."],["Dua titik pada gelombang berjarak 1,5λ. Keduanya…",["sefase","berlawanan fase","berbeda fase 90°","tidak dapat ditentukan"],1,"Δφ = Δx/λ = 1,5. Kelipatan setengah (selain bulat) berarti berlawanan fase."]],
 m:["Pada y = 0,04 sin(4πt − 0,5πx), frekuensi gelombangnya 4 Hz.","Koefisien t adalah ω, bukan f. Frekuensi f = ω/2π = 2 Hz. Akar kesalahannya: membaca angka di depan t sebagai frekuensi.","ω = 2πf dan k = 2π/λ. Selalu ubah dulu ke f dan λ."]},
'3.2':{x:["Tali sepanjang 2 m terikat kedua ujungnya dan bergetar membentuk 4 perut. Cepat rambat gelombang di tali 20 m/s. Tentukan panjang gelombang, jarak simpul ke perut terdekat, dan frekuensi.","Setiap perut menempati ½λ, jadi L = 4 × ½λ → λ = 2L/4 = 1 m.||Jarak simpul ke perut terdekat = ¼λ = 25 cm.||Frekuensi: f = v/λ = 20/1 = 20 Hz.","λ = 1 m, jarak simpul–perut 25 cm, f = 20 Hz."],
 z:[["Pada gelombang stasioner dengan ujung terikat, di ujung tali selalu terbentuk…",["perut","simpul","keduanya bergantian","tidak ada"],1,"Ujung terikat memantulkan gelombang dengan fase terbalik sehingga simpangan di ujung selalu nol: simpul."],["Jarak dua perut berurutan 10 cm. Panjang gelombang…",["5 cm","10 cm","20 cm","40 cm"],2,"Jarak perut ke perut berurutan = ½λ, sehingga λ = 20 cm."]],
 m:["Gelombang stasioner merambat sepanjang tali.","Gelombang stasioner tidak merambat: simpul dan perutnya diam di tempat. Ia hasil superposisi gelombang datang dan pantul. Akar kesalahannya: menyamakan setiap pola gelombang dengan gelombang berjalan.","Pada gelombang stasioner tidak ada perpindahan energi bersih; amplitudo bergantung posisi."]},
'3.3':{x:["Cahaya dengan panjang gelombang 600 nm di udara (n = 1) datang pada kaca (n = 1,5) dengan sudut datang 30°. Tentukan sudut bias, laju, panjang gelombang, dan frekuensi cahaya di kaca.","Snell: n₁ sin i = n₂ sin r → sin r = sin30°/1,5 = 0,5/1,5 = 0,33 → r ≈ 19,5° (mendekati normal).||Laju di kaca: v = c/n = 3×10⁸/1,5 = 2×10⁸ m/s.||Panjang gelombang di kaca: λ = λ₀/n = 600/1,5 = 400 nm.||Frekuensi tetap: f = c/λ₀ = 3×10⁸/600×10⁻⁹ = 5×10¹⁴ Hz.","r ≈ 19,5°, v = 2×10⁸ m/s, λ = 400 nm, f = 5×10¹⁴ Hz (tetap)."],
 z:[["Cahaya merambat dari udara ke kaca. Berkas cahaya akan…",["menjauhi garis normal","mendekati garis normal","tidak berbelok","dipantulkan seluruhnya"],1,"Dari medium kurang rapat ke lebih rapat, laju berkurang dan sinar membias mendekati normal."],["Saat gelombang memasuki medium lain, frekuensinya…",["membesar","mengecil","tetap","nol"],2,"Frekuensi hanya ditentukan sumber; yang berubah adalah v dan λ."]],
 m:["Cahaya yang masuk ke air berubah warna karena frekuensinya berubah.","Frekuensi tetap, dan warna ditentukan oleh frekuensi. Yang berubah adalah laju dan panjang gelombang. Akar kesalahannya: mengira warna ditentukan oleh panjang gelombang di medium.","f tetap; v dan λ berubah sebanding (v₁/v₂ = λ₁/λ₂ = n₂/n₁)."]},
'3.4':{x:["Dawai sepanjang 0,5 m bermassa per satuan panjang 0,01 kg/m ditegangkan 100 N. Tentukan cepat rambat gelombang, nada dasar, dan nada atas kedua.","Cepat rambat: v = √(F/μ) = √(100/0,01) = √10 000 = 100 m/s.||Nada dasar: f₀ = v/2L = 100/(2 × 0,5) = 100 Hz.||Dawai menghasilkan semua harmonik: nada atas kedua (n = 2) adalah harmonik ke-3: f₂ = 3f₀ = 300 Hz.","v = 100 m/s, f₀ = 100 Hz, f₂ = 300 Hz."],
 z:[["Pipa organa tertutup menghasilkan nada dasar 100 Hz. Nada atas pertamanya…",["150 Hz","200 Hz","300 Hz","400 Hz"],2,"Pipa tertutup hanya menghasilkan harmonik ganjil: 1 : 3 : 5. Nada atas pertama = 3 × 100 = 300 Hz."],["Pipa organa terbuka sepanjang 0,5 m, cepat rambat bunyi 340 m/s. Nada dasarnya…",["170 Hz","340 Hz","680 Hz","85 Hz"],1,"f₀ = v/2L = 340/(2 × 0,5) = 340 Hz."]],
 m:["Nada atas pertama pipa organa tertutup adalah dua kali nada dasar.","Pipa tertutup hanya menghasilkan harmonik ganjil sehingga nada atas pertama adalah tiga kali nada dasar. Akar kesalahannya: memakai pola pipa terbuka (1 : 2 : 3) untuk pipa tertutup.","Pipa terbuka dan dawai: 1 : 2 : 3. Pipa tertutup: 1 : 3 : 5."]},
'3.5':{x:["Sebuah mesin menghasilkan taraf intensitas 60 dB pada jarak 10 m. Berapa TI jika (a) ada 10 mesin identik pada jarak yang sama, (b) satu mesin diukur pada jarak 100 m?","(a) TI₂ = TI₁ + 10 log(n₂/n₁) = 60 + 10 log 10 = 60 + 10 = 70 dB.||(b) Jarak menjadi 10 kali: TI₂ = TI₁ − 20 log(r₂/r₁) = 60 − 20 log 10 = 60 − 20 = 40 dB.","(a) 70 dB; (b) 40 dB."],
 z:[["Jarak pendengar dari sumber diperbesar menjadi 10 kali semula. Taraf intensitas turun sebesar…",["10 dB","20 dB","30 dB","100 dB"],1,"I ∝ 1/r² sehingga I turun 100 kali, yaitu 10 log 100 = 20 dB."],["Satu sumber bunyi diganti dua sumber identik pada jarak yang sama. TI naik sekitar…",["3 dB","6 dB","10 dB","20 dB"],0,"10 log 2 ≈ 3 dB."]],
 m:["Dua mesin menghasilkan taraf intensitas dua kali lipat.","Desibel adalah skala logaritmik: intensitas dua kali hanya menambah 10 log 2 ≈ 3 dB. Akar kesalahannya: menganggap skala dB linear.","Setiap +10 dB berarti intensitas 10 kali lipat; setiap +3 dB kira-kira dua kali lipat."]},
'3.6':{x:["Ambulans memancarkan sirine 700 Hz dan melaju 20 m/s. Pendengar diam. Berapa frekuensi yang terdengar saat ambulans mendekat dan menjauh? (v bunyi = 340 m/s)","Mendekat: f_p = v/(v − v_s) · f_s = 340/(340 − 20) × 700 = 340/320 × 700 ≈ 744 Hz.||Menjauh: f_p = v/(v + v_s) · f_s = 340/360 × 700 ≈ 661 Hz.||Pendengar mendengar nada turun saat ambulans lewat.","Mendekat ≈ 744 Hz; menjauh ≈ 661 Hz."],
 z:[["Sumber bunyi dan pendengar saling mendekat. Frekuensi yang terdengar dibanding frekuensi sumber…",["lebih rendah","sama","lebih tinggi","nol"],2,"Gerak saling mendekat menaikkan frekuensi yang diterima."],["Dua garpu tala berfrekuensi 440 Hz dan 444 Hz dibunyikan bersama. Frekuensi pelayangan…",["2 Hz","4 Hz","442 Hz","884 Hz"],1,"f_layang = |f₁ − f₂| = 4 Hz."]],
 m:["Saat ambulans mendekat, sirinenya terdengar lebih keras karena frekuensinya naik.","Frekuensi menentukan tinggi nada, sedangkan kerasnya berkaitan dengan intensitas. Keduanya besaran berbeda. Akar kesalahannya: mencampur nada dengan kenyaringan.","Efek Doppler mengubah frekuensi (tinggi nada), bukan intensitas langsung."]},
'3.7':{x:["Stasiun radio FM memancar pada 100 MHz. Tentukan panjang gelombangnya dan energi satu foton (c = 3×10⁸ m/s, h = 6,63×10⁻³⁴ J·s).","Frekuensi f = 100 MHz = 10⁸ Hz.||Panjang gelombang: λ = c/f = 3×10⁸/10⁸ = 3 m.||Energi foton: E = hf = 6,63×10⁻³⁴ × 10⁸ ≈ 6,6×10⁻²⁶ J (sangat kecil).","λ = 3 m; E ≈ 6,6×10⁻²⁶ J."],
 z:[["Gelombang elektromagnetik dengan energi foton terbesar adalah…",["gelombang radio","inframerah","sinar-X","sinar gamma"],3,"E = hf, dan sinar gamma memiliki frekuensi tertinggi di antara pilihan."],["Dalam ruang hampa, cepat rambat sinar-X dibanding gelombang radio…",["lebih besar","lebih kecil","sama","bergantung amplitudo"],2,"Semua gelombang elektromagnetik merambat dengan c di ruang hampa."]],
 m:["Gelombang mikro lebih cepat dari gelombang radio karena frekuensinya lebih tinggi.","Di ruang hampa semua gelombang elektromagnetik berlaju c. Frekuensi lebih tinggi hanya berarti panjang gelombang lebih pendek (c = λf). Akar kesalahannya: mengira frekuensi menentukan laju.","Laju sama, frekuensi dan panjang gelombang berkebalikan."]},
'3.8':{x:["Pada percobaan celah ganda Young, jarak antarcelah 0,2 mm, layar berjarak 2 m, dan panjang gelombang cahaya 600 nm. Tentukan jarak antarpita terang berurutan dan posisi terang ke-3 dari terang pusat.","Jarak pita terang berurutan: ΔP = λL/d = (600×10⁻⁹ × 2)/(0,2×10⁻³) = 6×10⁻³ m = 6 mm.||Terang ke-m berada pada P = mΔP, sehingga terang ke-3: P = 3 × 6 = 18 mm dari terang pusat.","ΔP = 6 mm; terang ke-3 pada 18 mm."],
 z:[["Jarak antarcelah d diperkecil, sedangkan λ dan L tetap. Jarak antarpita terang…",["mengecil","tetap","melebar","hilang"],2,"ΔP = λL/d, sehingga d kecil membuat ΔP besar."],["Cahaya tak terpolarisasi (I₀) melewati dua polarisator dengan sumbu berbeda 60°. Intensitas akhir…",["I₀/2","I₀/4","I₀/8","I₀/16"],2,"Setelah polarisator pertama I₁ = I₀/2. Hukum Malus: I₂ = I₁cos²60° = (I₀/2)(1/4) = I₀/8."]],
 m:["Pada celah ganda, pita gelap terjadi bila beda lintasan = mλ.","Pada celah ganda, beda lintasan mλ menghasilkan terang; gelap pada (m − ½)λ. Aturan gelap mλ milik celah tunggal. Akar kesalahannya: menukar aturan dua jenis celah.","Celah ganda: terang mλ, gelap (m−½)λ. Celah tunggal: gelap mλ."]},
'4.0':{x:["Termometer X menunjukkan 20°X pada titik lebur es dan 220°X pada titik didih air. Berapa suhu dalam °C dan K ketika termometer X menunjuk 60°X?","Samakan perbandingan skala: (X − 20)/(220 − 20) = C/100.||(60 − 20)/200 = C/100 → C = 0,2 × 100 = 20 °C.||Ubah ke kelvin: K = 20 + 273 = 293 K.","20 °C atau 293 K."],
 z:[["Suhu 77 °F sama dengan…",["20 °C","25 °C","30 °C","35 °C"],1,"C = (F − 32) × 5/9 = 45 × 5/9 = 25 °C."],["Kenaikan suhu 10 °C setara dengan kenaikan…",["10 K","283 K","50 K","18 K"],0,"Satu derajat Celsius sama besar dengan satu kelvin, sehingga ΔC = ΔK."]],
 m:["0 °C sama dengan 0 K.","0 K adalah nol mutlak (−273 °C), sedangkan 0 °C adalah titik lebur es, 273 K. Akar kesalahannya: menyamakan titik nol dua skala.","K = °C + 273, sehingga 0 °C = 273 K. Pada rumus gas dan Carnot selalu pakai kelvin."]},
'4.1':{x:["Rel baja sepanjang 20 m (α = 1,2×10⁻⁵ /°C) dipasang pada 20 °C. Berapa pertambahan panjangnya pada 50 °C?","ΔT = 50 − 20 = 30 °C.||ΔL = L₀ α ΔT = 20 × 1,2×10⁻⁵ × 30.||ΔL = 7,2×10⁻³ m = 7,2 mm.","Bertambah 7,2 mm (karena itu rel diberi celah muai)."],
 z:[["Pelat logam berlubang dipanaskan. Diameter lubang akan…",["mengecil","tetap","membesar","hilang"],2,"Lubang ikut memuai seperti bahan di sekelilingnya, seolah lubang diisi logam yang sama."],["Koefisien muai panjang baja 1,2×10⁻⁵ /°C. Koefisien muai volumenya…",["1,2×10⁻⁵ /°C","2,4×10⁻⁵ /°C","3,6×10⁻⁵ /°C","4,8×10⁻⁵ /°C"],2,"γ = 3α = 3,6×10⁻⁵ /°C."]],
 m:["Lubang pada pelat logam mengecil ketika pelat dipanaskan karena logam memuai ke dalam lubang.","Seluruh bagian pelat memuai, termasuk ukuran lubang. Akar kesalahannya: membayangkan lubang sebagai ruang kosong yang tidak ikut muai.","Pemuaian lubang sama dengan pemuaian bahan yang memenuhi lubang tersebut."]},
'4.2':{x:["Berapa kalor yang diperlukan untuk mengubah 200 g es −10 °C menjadi air 20 °C? (c es = 2100 J/kg°C, c air = 4200 J/kg°C, L lebur = 336 000 J/kg)","Tahap 1: es −10 → 0 °C: Q₁ = 0,2 × 2100 × 10 = 4200 J.||Tahap 2: es melebur: Q₂ = 0,2 × 336 000 = 67 200 J.||Tahap 3: air 0 → 20 °C: Q₃ = 0,2 × 4200 × 20 = 16 800 J.||Total = 4200 + 67 200 + 16 800 = 88 200 J.","Q total = 88 200 J (≈ 88,2 kJ)."],
 z:[["Air 2 kg dipanaskan dari 20 °C ke 70 °C (c = 4200 J/kg°C). Kalor yang diperlukan…",["42 kJ","210 kJ","420 kJ","840 kJ"],2,"Q = mcΔT = 2 × 4200 × 50 = 420 000 J."],["Zat dengan kalor jenis besar…",["cepat panas","sulit berubah suhunya","tidak dapat melebur","memiliki massa besar"],1,"Q = mcΔT: c besar berarti butuh kalor banyak untuk perubahan suhu tertentu."]],
 m:["Es yang sedang melebur menyerap kalor sehingga suhunya terus naik.","Selama berubah wujud suhu tetap 0 °C; kalor dipakai memutus ikatan antarmolekul (kalor laten). Akar kesalahannya: mengira kalor selalu menaikkan suhu.","Kalor dapat dipakai untuk mengubah suhu (mcΔT) atau mengubah wujud (mL), tidak keduanya sekaligus."]},
'4.3':{x:["Sebanyak 100 g es −20 °C dipanaskan. Hitung kalor yang dibutuhkan hingga semua es menjadi air 0 °C, dan hingga menjadi air 100 °C. (c es = 2100, L = 336 000 J/kg, c air = 4200)","Tahap miring (es −20 → 0 °C): Q₁ = 0,1 × 2100 × 20 = 4200 J.||Tahap mendatar (melebur): Q₂ = 0,1 × 336 000 = 33 600 J.||Sampai air 0 °C: 4200 + 33 600 = 37 800 J.||Tahap miring (air 0 → 100 °C): Q₃ = 0,1 × 4200 × 100 = 42 000 J. Total = 79 800 J.","37,8 kJ sampai air 0 °C; 79,8 kJ sampai air 100 °C."],
 z:[["Bagian mendatar pada grafik pemanasan suatu zat menunjukkan…",["suhu naik cepat","terjadi perubahan wujud","zat melepas kalor","kalor jenis nol"],1,"Kalor yang diberikan dipakai untuk mengubah wujud, suhu tetap."],["Dua zat bermassa sama menerima kalor sama. Grafik T–Q zat A lebih landai dari zat B. Maka…",["c_A lebih kecil","c_A lebih besar","c_A = c_B","tidak dapat ditentukan"],1,"Kemiringan T–Q = 1/(mc), sehingga lebih landai berarti c lebih besar."]],
 m:["Pada bagian mendatar grafik, tidak ada kalor yang diberikan.","Kalor tetap masuk, tetapi seluruhnya dipakai untuk mengubah wujud (Q = mL). Akar kesalahannya: mengidentikkan 'suhu tetap' dengan 'tidak ada kalor'.","Garis mendatar = kalor laten; panjangnya sebanding mL."]},
'4.4':{x:["Sebanyak 200 g air 80 °C dicampur 300 g air 20 °C dalam wadah berinsulasi. Tentukan suhu campuran.","Zat sejenis (c sama): asas Black Q_lepas = Q_terima → m₁(T₁ − T_c) = m₂(T_c − T₂).||200(80 − T) = 300(T − 20) → 16 000 − 200T = 300T − 6000.||22 000 = 500T → T = 44 °C.","T campuran = 44 °C (lebih dekat ke suhu air yang lebih banyak)."],
 z:[["Dua porsi air bermassa sama, 60 °C dan 20 °C, dicampur. Suhu campuran…",["30 °C","40 °C","45 °C","50 °C"],1,"Massa sama dan zat sama: T = (60 + 20)/2 = 40 °C."],["Es 0,1 kg (0 °C) dimasukkan ke air 0,5 kg bersuhu 20 °C. Suhu akhir… (L = 336 000 J/kg, c = 4200)",["0 °C","3,3 °C","10 °C","20 °C"],1,"Q_lepas maks = 0,5 × 4200 × 20 = 42 000 J > Q_lebur = 33 600 J, jadi semua es melebur. Sisa 8400 J memanaskan 0,6 kg air: ΔT = 8400/(0,6 × 4200) ≈ 3,3 °C."]],
 m:["Suhu campuran selalu rata-rata dari dua suhu awal.","Rata-rata sederhana hanya benar bila m·c kedua zat sama. Suhu campuran adalah rata-rata tertimbang oleh m·c. Akar kesalahannya: mengabaikan massa dan kalor jenis.","T_c = (m₁c₁T₁ + m₂c₂T₂)/(m₁c₁ + m₂c₂)."]},
'4.5':{x:["Batang logam berpenampang 2×10⁻⁴ m² dan panjang 0,5 m memiliki konduktivitas 400 W/m·K. Ujung-ujungnya berbeda suhu 50 K. Berapa laju kalor yang mengalir?","Rumus konduksi: P = kAΔT/L.||P = 400 × 2×10⁻⁴ × 50 / 0,5.||P = 4/0,5 = 8 W.","Laju kalor 8 W."],
 z:[["Perpindahan kalor yang terjadi melalui aliran zat disebut…",["konduksi","konveksi","radiasi","difusi cahaya"],1,"Pada konveksi kalor dibawa oleh gerak fluida yang bergerak."],["Suhu mutlak sebuah benda hitam dinaikkan menjadi dua kali. Daya radiasinya menjadi…",["2 kali","4 kali","8 kali","16 kali"],3,"P ∝ T⁴, sehingga 2⁴ = 16 kali."]],
 m:["Pada sambungan dua logam, suhu sambungan selalu tepat di tengah-tengah suhu kedua ujung.","Laju kalor di kedua logam sama, sehingga beda suhu terbagi berbanding terbalik dengan konduktivitasnya. Akar kesalahannya: mengabaikan perbedaan k.","Sambungan lebih dekat ke suhu ujung logam yang konduktivitasnya lebih besar."]},
'4.6':{x:["Gas ideal 2 mol berada pada 27 °C dalam wadah bervolume 0,05 m³. Berapa tekanan gas? (R = 8,31 J/mol·K)","Ubah suhu ke kelvin: T = 27 + 273 = 300 K.||PV = nRT → P = nRT/V.||P = 2 × 8,31 × 300 / 0,05 = 4986/0,05 ≈ 9,97×10⁴ Pa.","P ≈ 1×10⁵ Pa (sekitar 1 atm)."],
 z:[["Suhu gas dinaikkan dari 27 °C menjadi 327 °C. Laju efektif molekul (v_rms) menjadi…",["√2 kali","2 kali","4 kali","tetap"],0,"v_rms ∝ √T dengan T dalam kelvin: √(600/300) = √2."],["Gas dimampatkan secara isotermal hingga volumenya setengah. Tekanannya menjadi…",["setengah kali","tetap","dua kali","empat kali"],2,"PV konstan pada suhu tetap, sehingga V setengah membuat P dua kali."]],
 m:["Suhu gas dinaikkan dari 27 °C ke 54 °C sehingga energi kinetik molekulnya menjadi dua kali.","Energi kinetik sebanding dengan suhu dalam kelvin: 300 K menjadi 327 K, kenaikan hanya sekitar 9%. Akar kesalahannya: memakai suhu Celsius pada rumus gas.","Untuk rumus gas ideal dan teori kinetik, selalu pakai kelvin."]},
'4.7':{x:["Gas menyerap kalor 600 J dan melakukan usaha 200 J pada lingkungannya. Berapa perubahan energi dalamnya? Bagaimana bila gas dimampatkan dengan usaha 150 J sambil melepas kalor 50 J?","Kasus 1: Q = +600 J, W = +200 J (gas melakukan usaha). ΔU = Q − W = 600 − 200 = +400 J.||Kasus 2: Q = −50 J (melepas), W = −150 J (dikenai usaha).||ΔU = Q − W = −50 − (−150) = +100 J.","Kasus 1: ΔU = +400 J; kasus 2: ΔU = +100 J."],
 z:[["Pada satu siklus penuh sistem termodinamika, perubahan energi dalamnya…",["positif","negatif","nol","bergantung lintasan"],2,"Energi dalam fungsi keadaan; setelah satu siklus kembali ke keadaan awal sehingga ΔU = 0."],["Siklus pada diagram P–V searah jarum jam menghasilkan usaha total…",["positif","negatif","nol","tidak dapat ditentukan"],0,"Luas siklus searah jarum jam adalah usaha positif yang dilakukan gas."]],
 m:["Gas yang melakukan usaha pasti suhunya turun.","Suhu ditentukan ΔU = Q − W: bila kalor masuk lebih besar dari usaha, suhu justru naik. Akar kesalahannya: mengabaikan kalor yang masuk.","Lihat ΔU = Q − W secara lengkap, bukan salah satu sukunya saja."]},
'4.8':{x:["Dua mol gas monoatomik mengalami proses isobarik dan suhunya naik dari 300 K menjadi 400 K. Hitung usaha, perubahan energi dalam, dan kalor yang diserap. (R = 8,31 J/mol·K)","Isobarik: W = P ΔV = nRΔT = 2 × 8,31 × 100 = 1662 J.||Monoatomik: ΔU = (3/2)nRΔT = 1,5 × 1662 = 2493 J.||Hukum I: Q = ΔU + W = 2493 + 1662 = 4155 J.","W = 1662 J, ΔU = 2493 J, Q = 4155 J."],
 z:[["Pada proses isokhorik, usaha yang dilakukan gas…",["positif","negatif","nol","sama dengan Q"],2,"Volume tetap berarti ΔV = 0 sehingga W = 0."],["Gas ideal memuai secara adiabatik. Suhu gas akan…",["naik","turun","tetap","naik lalu turun"],1,"Q = 0 sehingga W = −ΔU: gas melakukan usaha dengan mengorbankan energi dalam, sehingga suhunya turun."]],
 m:["Pada proses isotermal tidak ada kalor yang berpindah.","Pada isotermal ΔU = 0 sehingga Q = W: kalor justru keluar-masuk untuk menjaga suhu tetap. Proses tanpa kalor adalah adiabatik. Akar kesalahannya: tertukar antara isotermal dan adiabatik.","Isotermal: T tetap, Q = W. Adiabatik: Q = 0, W = −ΔU."]},
'4.9':{x:["Mesin Carnot bekerja di antara 600 K dan 300 K dan menyerap 2000 J per siklus. Tentukan efisiensi, usaha, dan kalor yang dibuang. Berapa T₁ baru agar efisiensi menjadi 60% (T₂ tetap)?","Efisiensi: η = 1 − T₂/T₁ = 1 − 300/600 = 0,5 = 50%.||Usaha: W = η Q₁ = 0,5 × 2000 = 1000 J; kalor dibuang Q₂ = Q₁ − W = 1000 J.||Untuk η = 0,6: 1 − 300/T₁′ = 0,6 → 300/T₁′ = 0,4 → T₁′ = 750 K.","η = 50%, W = 1000 J, Q₂ = 1000 J; T₁ baru = 750 K."],
 z:[["Menurut Hukum II Termodinamika, efisiensi mesin kalor…",["bisa 100%","selalu kurang dari 100%","selalu 100%","selalu lebih dari 50%"],1,"Tidak ada mesin yang dapat mengubah seluruh kalor menjadi usaha; selalu ada Q₂ yang dibuang."],["Kulkas Carnot bekerja antara 270 K (dalam) dan 300 K (luar). Koefisien kinerjanya…",["0,1","1","9","10"],2,"COP = T₂/(T₁ − T₂) = 270/30 = 9."]],
 m:["Efisiensi mesin kalor hanya bisa dinaikkan dengan menaikkan suhu reservoir panas.","η = 1 − T₂/T₁ naik bila T₁ dinaikkan atau T₂ diturunkan. Akar kesalahannya: hanya memperhatikan satu suhu.","Selisih suhu yang lebih besar (dari sisi mana pun) menaikkan efisiensi Carnot; pakai kelvin."]},
'5.0':{x:["Dua bola logam identik bermuatan +6 μC dan −2 μC disentuhkan lalu dipisahkan. Berapa muatan masing-masing bola sekarang?","Dua konduktor identik berbagi muatan total secara sama.||Muatan total = (+6) + (−2) = +4 μC.||Muatan tiap bola = 4/2 = +2 μC.","Masing-masing bermuatan +2 μC."],
 z:[["Batang plastik digosok kain wol dan menjadi bermuatan negatif. Artinya plastik…",["kehilangan proton","menerima elektron","kehilangan elektron","menerima proton"],1,"Hanya elektron yang berpindah. Muatan negatif berarti kelebihan elektron."],["Muatan 3,2×10⁻¹⁸ C setara dengan kelebihan berapa elektron? (e = 1,6×10⁻¹⁹ C)",["2","20","200","2000"],1,"n = Q/e = 3,2×10⁻¹⁸ / 1,6×10⁻¹⁹ = 20 elektron."]],
 m:["Benda netral tidak mungkin ditarik oleh benda bermuatan.","Benda netral dapat terpolarisasi: muatan lawan jenis terkumpul di sisi dekat sehingga ada tarikan. Akar kesalahannya: menganggap tarik-menarik pasti antara muatan berlawanan.","Tolak-menolak pasti sejenis; tarik-menarik bisa antara muatan berlawanan atau antara benda bermuatan dan benda netral."]},
'5.1':{x:["Dua muatan Q₁ = +4 μC dan Q₂ = +1 μC terpisah 30 cm. (a) Berapa gaya antar keduanya? (b) Di mana letak titik antara keduanya yang menyebabkan gaya pada muatan uji nol?","(a) F = kQ₁Q₂/r² = 9×10⁹ × 4×10⁻⁶ × 1×10⁻⁶ / (0,3)² = 3,6×10⁻² / 9×10⁻² = 0,4 N (tolak-menolak).||(b) Gaya nol bila kQ₁q/x² = kQ₂q/(d − x)², sehingga x/(d − x) = √(Q₁/Q₂) = 2.||x = 2(30 − x) → 3x = 60 → x = 20 cm dari Q₁ (10 cm dari Q₂).","(a) 0,4 N; (b) 20 cm dari Q₁."],
 z:[["Jarak dua muatan diperbesar menjadi tiga kali semula. Gaya Coulomb menjadi…",["1/3 kali","1/6 kali","1/9 kali","9 kali"],2,"F ∝ 1/r², sehingga r tiga kali membuat F menjadi 1/9."],["Muatan 2 μC dan 3 μC berjarak 10 cm. Besar gaya Coulomb…",["0,54 N","5,4 N","54 N","540 N"],1,"F = 9×10⁹ × 2×10⁻⁶ × 3×10⁻⁶ / (0,1)² = 5,4×10⁻² / 10⁻² = 5,4 N."]],
 m:["Jarak dua muatan dijadikan dua kali sehingga gaya Coulomb menjadi setengah.","Gaya berbanding terbalik dengan kuadrat jarak, jadi menjadi seperempat. Akar kesalahannya: menganggap hubungan jarak dan gaya linear.","F ∝ 1/r²: jarak ×2 → gaya ×¼; jarak ×3 → gaya ×1/9."]},
'5.2':{x:["Muatan titik Q = +4 μC berada di udara. Tentukan kuat medan di titik berjarak 30 cm, lalu gaya pada muatan −2 μC yang diletakkan di titik itu.","E = kQ/r² = 9×10⁹ × 4×10⁻⁶ / (0,3)² = 3,6×10⁴ / 9×10⁻² = 4×10⁵ N/C, arah menjauhi Q.||Gaya: F = |q|E = 2×10⁻⁶ × 4×10⁵ = 0,8 N.||Karena muatan uji negatif, gaya berlawanan arah medan, yaitu menuju Q.","E = 4×10⁵ N/C menjauhi Q; F = 0,8 N menuju Q."],
 z:[["Kuat medan listrik di dalam konduktor berongga yang bermuatan sama dengan…",["sama dengan di permukaan","nol","tak hingga","bergantung massa"],1,"Pada keseimbangan elektrostatik, E di dalam konduktor bernilai nol."],["Dua keping sejajar berbeda potensial 100 V dan berjarak 2 cm. Kuat medan di antaranya…",["50 V/m","200 V/m","2000 V/m","5000 V/m"],3,"E = V/d = 100/0,02 = 5000 V/m."]],
 m:["Gaya pada muatan negatif searah dengan medan listrik.","Medan didefinisikan untuk muatan uji positif. Pada muatan negatif arah gaya berlawanan: F = qE dengan q negatif. Akar kesalahannya: mengabaikan tanda muatan.","Muatan positif dipercepat searah E, muatan negatif berlawanan arah E."]},
'5.3':{x:["Sebuah elektron (m = 9,1×10⁻³¹ kg, e = 1,6×10⁻¹⁹ C) dipercepat dari diam melalui beda potensial 200 V. Berapa laju akhirnya?","Energi kinetik yang diperoleh: E_k = eV = 1,6×10⁻¹⁹ × 200 = 3,2×10⁻¹⁷ J.||½mv² = eV → v = √(2eV/m).||v = √(2 × 3,2×10⁻¹⁷ / 9,1×10⁻³¹) = √(7,0×10¹³) ≈ 8,4×10⁶ m/s.","v ≈ 8,4×10⁶ m/s."],
 z:[["Dua muatan sama besar berlawanan tanda. Potensial di titik tepat di tengah keduanya…",["positif","negatif","nol","tak hingga"],2,"V = kQ/r + k(−Q)/r = 0. Potensial adalah skalar sehingga saling meniadakan, meski medannya tidak nol."],["Muatan 2 μC berada di titik berpotensial 500 V. Energi potensialnya…",["1×10⁻⁴ J","1×10⁻³ J","2,5×10⁻⁴ J","2,5×10⁻³ J"],1,"E_p = qV = 2×10⁻⁶ × 500 = 1×10⁻³ J."]],
 m:["Potensial listrik adalah vektor sehingga harus dijumlahkan dengan memperhatikan arah.","Potensial adalah besaran skalar: dijumlahkan secara aljabar dengan tanda muatan. Medan listriklah yang vektor. Akar kesalahannya: mencampur V dan E.","V total = ΣV (skalar, tanda ikut); E total = Σ vektor E."]},
'5.4':{x:["Kapasitor 4 μF dan 12 μF disusun seri dan dihubungkan ke sumber 16 V. Tentukan kapasitas total, muatan, dan tegangan tiap kapasitor.","Seri: 1/C = 1/4 + 1/12 = 3/12 + 1/12 = 4/12 → C = 3 μF.||Muatan total (sama untuk kapasitor seri): Q = CV = 3 × 16 = 48 μC.||V₁ = Q/C₁ = 48/4 = 12 V dan V₂ = Q/C₂ = 48/12 = 4 V (jumlahnya 16 V ✓).","C = 3 μF, Q = 48 μC, V₁ = 12 V, V₂ = 4 V."],
 z:[["Dua kapasitor 6 μF disusun paralel. Kapasitas totalnya…",["3 μF","6 μF","12 μF","36 μF"],2,"Paralel: C = C₁ + C₂ = 12 μF."],["Kapasitor 10 μF dihubungkan ke baterai 12 V. Energi yang tersimpan…",["0,12 mJ","0,72 mJ","1,2 mJ","7,2 mJ"],1,"W = ½CV² = ½ × 10×10⁻⁶ × 144 = 7,2×10⁻⁴ J = 0,72 mJ."]],
 m:["Kapasitor yang disusun seri memiliki C total = C₁ + C₂.","Penjumlahan langsung berlaku untuk susunan paralel. Seri memakai kebalikan: 1/C = 1/C₁ + 1/C₂. Akar kesalahannya: memakai aturan hambatan seri untuk kapasitor.","Kapasitor kebalikan dari resistor: paralel menjumlahkan, seri memakai kebalikan."]},
'5.5':{x:["Kawat tembaga (ρ = 1,7×10⁻⁸ Ω·m) sepanjang 2 m berpenampang 1 mm². Hitung hambatannya. Berapa hambatannya bila kawat ditarik hingga panjangnya menjadi dua kali (volume tetap)?","A = 1 mm² = 10⁻⁶ m². R = ρL/A = 1,7×10⁻⁸ × 2 / 10⁻⁶ = 0,034 Ω.||Ditarik menjadi 2× panjang, luas penampang menjadi ½ (volume tetap).||R′ = ρ(2L)/(A/2) = 4R = 0,136 Ω.","R = 0,034 Ω; setelah ditarik R′ = 0,136 Ω (4 kali)."],
 z:[["Arus 2 A mengalir selama 10 s. Muatan yang melewati penampang kawat…",["0,2 C","5 C","12 C","20 C"],3,"Q = It = 2 × 10 = 20 C."],["Diameter kawat dijadikan dua kali (panjang dan bahan tetap). Hambatannya menjadi…",["¼ kali","½ kali","2 kali","4 kali"],0,"Luas ∝ d², jadi A empat kali sehingga R menjadi ¼."]],
 m:["Arus listrik adalah aliran proton dari kutub positif ke negatif.","Arus konvensional digambar dari kutub positif ke negatif, tetapi yang sebenarnya bergerak dalam kawat adalah elektron dengan arah berlawanan. Akar kesalahannya: mencampur arah konvensional dengan pembawa muatan.","Arah arus = arah muatan positif; elektron bergerak berlawanan arah arus."]},
'5.6':{x:["Grafik V–I sebuah resistor berupa garis lurus melalui titik (0, 0) dan (0,5 A; 6 V). Berapa hambatannya, dan berapa arus bila tegangannya 9 V?","Kemiringan grafik V–I = V/I = R.||R = 6 V / 0,5 A = 12 Ω.||I = V/R = 9/12 = 0,75 A.","R = 12 Ω; I = 0,75 A."],
 z:[["Grafik I–V sebuah resistor lurus dengan kemiringan 0,2 A/V. Hambatannya…",["0,2 Ω","2 Ω","5 Ω","50 Ω"],2,"Pada grafik I–V kemiringan = 1/R, sehingga R = 1/0,2 = 5 Ω."],["Lampu pijar disebut komponen non-ohmik karena…",["hambatannya tidak pernah berubah","hambatannya berubah terhadap suhu filamen","tidak dilalui arus","hanya bekerja di arus bolak-balik"],1,"Filamen memanas saat arus naik sehingga R bertambah dan grafik V–I melengkung."]],
 m:["Lampu pijar memiliki hambatan yang sama di semua tegangan karena selalu patuh pada hukum Ohm.","Hukum Ohm hanya berlaku bila suhu tetap. Pada lampu, suhu filamen berubah sehingga R berubah. Akar kesalahannya: mengabaikan syarat suhu tetap.","V/I tetap hanya untuk komponen ohmik pada suhu tetap."]},
'5.7':{x:["R₁ = 6 Ω dan R₂ = 3 Ω disusun paralel, lalu diseri dengan R₃ = 4 Ω dan dihubungkan ke baterai ideal 12 V. Tentukan arus total dan arus melalui R₁ dan R₂.","Paralel: R_p = (6 × 3)/(6 + 3) = 2 Ω.||Hambatan total: R = R_p + R₃ = 2 + 4 = 6 Ω → I = 12/6 = 2 A.||Tegangan di bagian paralel: V_p = I × R_p = 2 × 2 = 4 V.||I₁ = 4/6 ≈ 0,67 A dan I₂ = 4/3 ≈ 1,33 A (jumlahnya 2 A ✓).","I total = 2 A; I₁ ≈ 0,67 A; I₂ ≈ 1,33 A."],
 z:[["Tiga resistor 6 Ω disusun paralel. Hambatan penggantinya…",["2 Ω","6 Ω","12 Ω","18 Ω"],0,"R_p = R/n = 6/3 = 2 Ω."],["Dua lampu berbeda hambatan disusun seri pada sumber tetap. Lampu yang lebih terang adalah yang…",["hambatannya lebih besar","hambatannya lebih kecil","dayanya nominal lebih besar","dekat sumber"],0,"Arus sama sehingga P = I²R lebih besar pada R yang lebih besar."]],
 m:["Pada rangkaian seri, arus yang melewati resistor besar lebih kecil.","Pada satu jalur tidak ada percabangan, sehingga arus sama di semua komponen. Yang berbeda adalah tegangan: V = IR. Akar kesalahannya: mengira arus berkurang saat melewati hambatan.","Seri: I sama, V terbagi. Paralel: V sama, I terbagi."]},
'5.8':{x:["Baterai dengan GGL 12 V dan hambatan dalam 1 Ω dihubungkan ke resistor 5 Ω. Tentukan arus, tegangan jepit, dan daya yang hilang di dalam baterai.","I = ε/(R + r) = 12/(5 + 1) = 2 A.||Tegangan jepit: V = ε − Ir = 12 − 2 × 1 = 10 V (sama dengan IR = 2 × 5 = 10 V ✓).||Daya hilang di baterai: P = I²r = 4 × 1 = 4 W.","I = 2 A; V = 10 V; P_dalam = 4 W."],
 z:[["Tiga baterai @1,5 V (r = 0,2 Ω) disusun seri. GGL dan hambatan dalam totalnya…",["1,5 V; 0,07 Ω","4,5 V; 0,6 Ω","4,5 V; 0,07 Ω","1,5 V; 0,6 Ω"],1,"Seri: ε = 3 × 1,5 = 4,5 V dan r = 3 × 0,2 = 0,6 Ω."],["Voltmeter ideal dipasang pada kutub baterai tanpa beban akan membaca…",["nol","GGL baterai","lebih besar dari GGL","tegangan jepit saat hubung singkat"],1,"Tanpa arus, tidak ada kehilangan di hambatan dalam sehingga V = ε."]],
 m:["Tegangan jepit baterai selalu sama dengan GGL-nya.","Saat arus mengalir, sebagian tegangan hilang di hambatan dalam: V = ε − Ir. Akar kesalahannya: mengabaikan hambatan dalam.","V = ε hanya saat I = 0. Saat ada arus, V < ε."]},
'5.9':{x:["Dalam satu loop terdapat baterai ε₁ = 12 V dan ε₂ = 4 V dengan kutub berlawanan (saling melawan). Hambatan total loop 4 Ω. Berapa arus loop? Pada sebuah titik cabang, arus 3 A masuk dan 1 A keluar lewat satu cabang; berapa arus pada cabang lainnya?","Kirchhoff II: ΣE + ΣIR = 0. Beda GGL efektif = 12 − 4 = 8 V.||I = 8/4 = 2 A searah dengan baterai yang lebih besar (ε₁).||Kirchhoff I: arus masuk = arus keluar → 3 = 1 + x → x = 2 A.","I loop = 2 A (searah ε₁); cabang lain 2 A."],
 z:[["Pada titik cabang, arus masuk 5 A, keluar 2 A di satu cabang dan x pada cabang lain. Nilai x…",["2 A","3 A","5 A","7 A"],1,"ΣI masuk = ΣI keluar → 5 = 2 + x → x = 3 A."],["Setelah menyelesaikan persamaan Kirchhoff diperoleh I = −2 A. Artinya…",["arus nol","arah arus sebenarnya berlawanan dengan pemisalan","perhitungan salah","hambatan negatif"],1,"Tanda negatif hanya menunjukkan bahwa arah yang dimisalkan terbalik."]],
 m:["Hukum Kirchhoff II menyatakan jumlah arus dalam satu loop sama dengan nol.","Yang berjumlah nol dalam loop adalah beda potensial (ΣE + ΣIR = 0), sedangkan jumlah arus nol berlaku di titik cabang (Hukum I). Akar kesalahannya: tertukar objek kedua hukum.","Hukum I: arus di titik cabang. Hukum II: tegangan di loop."]},
'5.10':{x:["Lampu bertuliskan 40 W/220 V dipasang pada sumber 110 V. Berapa daya lampu sekarang? Berapa biaya pemakaian 5 lampu 20 W selama 5 jam sehari dalam 30 hari bila tarif Rp1.500/kWh?","Hambatan lampu: R = V²/P = 220²/40 = 1210 Ω (tetap).||Pada 110 V: P′ = V′²/R = 110²/1210 = 10 W (¼ daya semula).||Energi: 5 lampu × 20 W × 5 jam × 30 hari = 15 000 Wh = 15 kWh.||Biaya = 15 × 1500 = Rp22.500.","P′ = 10 W; biaya Rp22.500."],
 z:[["Tegangan pada sebuah lampu diturunkan menjadi setengahnya. Daya lampu menjadi…",["½ kali","¼ kali","2 kali","tetap"],1,"P = V²/R, sehingga V setengah membuat P seperempat."],["1 kWh sama dengan…",["3,6×10³ J","3,6×10⁴ J","3,6×10⁶ J","3,6×10⁹ J"],2,"1 kWh = 1000 W × 3600 s = 3,6×10⁶ J."]],
 m:["Tegangan dibagi dua membuat daya lampu menjadi setengah.","Daya sebanding dengan kuadrat tegangan (P = V²/R) selama R tetap. Akar kesalahannya: menganggap daya linear terhadap tegangan.","V ×½ → P ×¼; V ×2 → P ×4."]},
'5.11':{x:["Galvanometer (R_g = 9 Ω, I_g = 10 mA) akan dijadikan amperemeter berbatas ukur 1 A dan voltmeter berbatas ukur 9 V. Tentukan hambatan shunt dan hambatan multiplier.","Amperemeter: batas ukur naik n = 1 A/10 mA = 100 kali.||R_sh = R_g/(n − 1) = 9/99 ≈ 0,09 Ω, dipasang paralel dengan galvanometer.||Voltmeter: tegangan maksimum galvanometer V_g = I_gR_g = 0,09 V. n = 9/0,09 = 100.||R_m = (n − 1)R_g = 99 × 9 = 891 Ω, dipasang seri dengan galvanometer.","Shunt ≈ 0,09 Ω (paralel); multiplier = 891 Ω (seri)."],
 z:[["Voltmeter dipasang pada rangkaian dengan cara…",["seri dengan komponen","paralel dengan komponen","seri dengan sumber saja","dihubung singkat"],1,"Voltmeter mengukur beda potensial sehingga dipasang paralel dengan komponen."],["Jarum voltmeter menunjuk skala 60 dari skala maksimum 100 pada batas ukur 5 V. Tegangan terukur…",["0,6 V","3 V","6 V","30 V"],1,"V = (60/100) × 5 = 3 V."]],
 m:["Amperemeter dipasang paralel agar langsung mengukur tegangan komponen.","Amperemeter mengukur arus sehingga harus dipasang seri; dipasang paralel hambatannya yang sangat kecil akan menimbulkan korsleting. Akar kesalahannya: tertukar fungsi amperemeter dan voltmeter.","Amperemeter: seri, R kecil. Voltmeter: paralel, R besar."]},
'5.12':{x:["Dalam satu kamar digunakan AC 900 W, TV 100 W, kulkas 150 W, dan setrika 350 W pada 220 V. MCB kamar 6 A. Apakah MCB akan turun?","Peralatan rumah disusun paralel sehingga dayanya dijumlahkan: P = 900 + 100 + 150 + 350 = 1500 W.||Arus total: I = P/V = 1500/220 ≈ 6,8 A.||Karena 6,8 A > 6 A, MCB akan turun.","Ya, MCB turun (arus 6,8 A melebihi 6 A)."],
 z:[["Fungsi sekering atau MCB pada instalasi listrik adalah…",["menaikkan tegangan","memutus rangkaian saat arus berlebih","menambah daya","menurunkan hambatan"],1,"Alat pengaman ini memutus rangkaian bila arus melebihi batas sehingga kabel tidak terlalu panas."],["Korsleting menimbulkan arus sangat besar karena…",["tegangan naik tajam","hambatan rangkaian sangat kecil","daya menurun","frekuensi berubah"],1,"I = V/R, dengan R mendekati nol arus menjadi sangat besar."]],
 m:["Mengganti sekering yang rusak dengan kawat tembaga biasa lebih aman karena tidak mudah putus.","Sekering memang dirancang putus bila arus berlebih. Kawat biasa tidak putus, sehingga kabel dapat memanas hingga terbakar. Akar kesalahannya: menganggap pengaman yang sering putus adalah masalahnya.","Selalu pakai pengaman dengan rating sesuai; cari penyebab arus berlebih."]}

const MIS=[
{e:'🚨',t:'Investigasi Rem Mendadak di Jalan Tol',c:0,b:'Polisi menemukan bekas rem lurus sepanjang 40 m di aspal kering. Dari uji lapangan, perlambatan maksimum mobil di aspal itu 8 m/s². Batas kecepatan jalan 80 km/jam. Apakah pengemudi melanggar?',s:[["Rumus mana yang menghubungkan jarak rem, perlambatan, dan kecepatan awal tanpa waktu?",[["v² = v₀² + 2as dengan v = 0",1,"Tepat: waktu tidak diketahui dan geraknya berakhir diam."],["s = v·t",0,"Itu GLB. Selama mengerem kecepatan berubah."],["v = v₀ + at",0,"Perlu waktu t yang tidak diketahui."]]],["Hitung kecepatan awal (a = −8 m/s², s = 40 m).",[["√640 ≈ 25,3 m/s",1,"0 = v₀² − 2(8)(40) → v₀² = 640."],["16 m/s",0,"Kemungkinan lupa faktor 2 pada 2as."],["640 m/s",0,"Itu v₀², belum diakar."]]],["Ubah ke km/jam dan simpulkan.",[["25,3 × 3,6 ≈ 91 km/jam > 80 → melanggar",1,"1 m/s = 3,6 km/jam."],["25,3 ÷ 3,6 ≈ 7 km/jam → tidak melanggar",0,"Konversi terbalik."]]]],k:'Kecepatan awal ≈ 91 km/jam, melampaui batas 80 km/jam. Jarak henti sebanding dengan v₀², sehingga bekas rem menjadi data forensik.'},
{e:'🚛',t:'Truk Mogok di Tanjakan',c:1,b:'Truk 4000 kg menaiki tanjakan 10° (sin10° ≈ 0,17). Gaya mesin 8000 N dan gesekan total 3000 N. Mampukah truk mempertahankan lajunya? (g = 10)',s:[["Gaya apa saja yang melawan gerak naik sepanjang bidang?",[["Komponen berat mg sinθ dan gesekan",1,"Komponen berat sejajar bidang menarik ke bawah, gesekan menghambat."],["Hanya gesekan",0,"Berat selalu punya komponen sejajar bidang."],["Berat penuh mg",0,"Hanya komponen sejajar bidang (mg sinθ) yang melawan."]]],["Hitung gaya penghambat total.",[["4000·10·0,17 + 3000 = 9800 N",1,"6800 N dari berat + 3000 N gesekan."],["4000·10 + 3000 = 43000 N",0,"Memakai berat penuh, bukan komponennya."],["3000 N",0,"Mengabaikan komponen berat."]]],["Simpulkan percepatan truk.",[["a = (8000 − 9800)/4000 = −0,45 m/s² → melambat",1,"Resultan ke bawah lereng, truk terus melambat."],["a = +0,45 m/s² → mempercepat",0,"Tanda terbalik: penghambat lebih besar dari gaya mesin."]]]],k:'Truk melambat 0,45 m/s². Solusi: turunkan muatan atau pakai gigi rendah (gaya mesin lebih besar).'},
{e:'🚢',t:'Tongkang Kelebihan Muatan',c:2,b:'Tongkang bermassa kosong 20 ton memiliki volume lambung sebesar 60 m³ di bawah garis air aman. Di sungai (air tawar, 1000 kg/m³), berapa muatan maksimum agar tetap aman?',s:[["Syarat tongkang mengapung pada garis air aman?",[["Berat total = gaya apung maksimum",1,"w = F_A saat tercelup sampai garis aman."],["Massa jenis tongkang = 0",0,"Tidak masuk akal."],["Gaya apung tak bergantung volume tercelup",0,"F_A = ρ g V tercelup."]]],["Hitung massa total maksimum.",[["m = ρ·V = 1000 × 60 = 60 ton",1,"F_A/g = massa air yang dipindahkan = 60 ton."],["m = 60 kg",0,"1000 × 60 = 60.000 kg = 60 ton."]]],["Muatan maksimum dan kesimpulan jika memuat 45 ton?",[["Muatan maks 40 ton; 45 ton melewati garis aman",1,"60 − 20 = 40 ton."],["Muatan maks 60 ton; 45 ton aman",0,"Lupa mengurangi berat kosong tongkang."]]]],k:'Muatan maksimum 40 ton. Di air laut (1025 kg/m³) muatan maksimum naik menjadi ±41,5 ton.'},
{e:'🌊',t:'Sonar Penyelamat Nelayan',c:3,b:'Kapal penyelamat memancarkan pulsa sonar ke dasar laut dan menerima gema setelah 0,8 s. Cepat rambat bunyi di air laut 1500 m/s. Berapa kedalaman titik tempat perahu karam?',s:[["Berapa lintasan yang ditempuh bunyi selama 0,8 s?",[["Pergi-pulang: 2 × kedalaman",1,"Pulsa turun lalu memantul naik."],["Sekali jalan: kedalaman",0,"Gema berarti bolak-balik."]]],["Hitung kedalaman.",[["d = v·t/2 = 1500 × 0,8 / 2 = 600 m",1,"Total lintasan 1200 m, dibagi dua."],["d = 1500 × 0,8 = 1200 m",0,"Belum dibagi dua."]]]],k:'Kedalaman 600 m. Rumus sonar d = vt/2 selalu memakai setengah waktu pergi-pulang.'},
{e:'💉',t:'Rantai Dingin Vaksin',c:4,b:'Kotak pendingin menerima kalor dari lingkungan 50 W. Berapa lama 2 kg es 0 °C menjaga suhu vaksin tetap 0 °C? (L = 336 kJ/kg)',s:[["Selama es melebur, apa yang terjadi pada suhu?",[["Tetap 0 °C; kalor dipakai untuk mengubah wujud",1,"Q = mL tanpa perubahan suhu."],["Naik terus",0,"Suhu baru naik setelah es habis."]]],["Hitung kalor yang dibutuhkan untuk melebur semua es.",[["Q = mL = 2 × 336 = 672 kJ",1,"Kalor laten lebur."],["Q = mcΔT = 2 × 2100 × 0",0,"ΔT = 0, bukan mcΔT."]]],["Waktu bertahan = Q/P",[["672.000/50 ≈ 13.440 s ≈ 3,7 jam",1,"Setelah es habis suhu mulai naik."],["672/50 = 13,4 s",0,"Satuan kJ harus diubah ke joule."]]]],k:'Sekitar 3,7 jam. Menambah es memperpanjang waktu secara sebanding.'},
{e:'🔌',t:'MCB Kos-kosan Turun',c:5,b:'Satu kamar kos memakai AC 1000 W, setrika 400 W, kulkas 150 W, dan lampu 100 W sekaligus pada 220 V. MCB kamar 6 A. Mengapa sering turun?',s:[["Bagaimana hubungan alat-alat rumah dan arus totalnya?",[["Paralel: arus total = jumlah arus tiap alat",1,"Tegangan sama, arus dijumlahkan."],["Seri: arus sama",0,"Alat rumah tidak diseri."]]],["Hitung arus total.",[["I = ΣP/V = 1650/220 = 7,5 A",1,"Jumlah daya dibagi tegangan."],["I = 1000/220 ≈ 4,5 A",0,"Hanya menghitung AC."]]],["Simpulkan.",[["7,5 A > 6 A → MCB turun",1,"Solusi: matikan setrika atau naikkan kapasitas dengan kabel yang sesuai."],["7,5 A < 6 A → aman",0,"7,5 lebih besar dari 6."]]]],k:'Beban 1650 W menarik 7,5 A melampaui MCB 6 A. Memperbesar MCB tanpa memeriksa ukuran kabel berbahaya.'}];
const TREE=[
{e:'🌳',t:'Bola dari Tebing',c:0,b:'Bola ditendang mendatar dari tebing setinggi 45 m dengan laju 15 m/s. Berapa jauh dari kaki tebing ia mendarat? (g = 10)',s:[["Jenis gerak apa yang tepat?",[["GLB mendatar + jatuh bebas vertikal",1,"Dua gerak saling bebas."],["GLBB satu dimensi",0,"Lintasannya melengkung, ada dua komponen."],["Gerak melingkar",0,"Tidak ada pusat putaran."]]],["Besaran apa yang menentukan waktu di udara?",[["Tinggi tebing saja",1,"Komponen vertikal tidak bergantung v mendatar."],["Laju mendatar 15 m/s",0,"Kecepatan mendatar tidak mengubah waktu jatuh."]]],["Hitung jarak mendatar.",[["t = √(2·45/10) = 3 s; x = 15·3 = 45 m",1,"Benar."],["x = 15 m",0,"Itu laju, bukan jarak."],["x = 67,5 m",0,"Memakai t = 4,5 s yang keliru."]]]],k:'Jarak mendarat 45 m. Kunci: pisahkan komponen, hubungkan lewat waktu.'},
{e:'🌳',t:'Balok dan Beban Gantung',c:1,b:'Balok 3 kg di meja licin dihubungkan tali melewati katrol ke beban 2 kg yang menggantung. Tentukan percepatan dan tegangan tali. (g = 10)',s:[["Pendekatan tercepat?",[["Tinjau seluruh sistem: gaya penggerak = berat beban",1,"Percepatan sama; massa total 5 kg."],["Pakai massa balok saja",0,"Beban ikut dipercepat."]]],["Hitung a.",[["a = 20/5 = 4 m/s²",1,"m₂g/(m₁+m₂)."],["a = 20/3 ≈ 6,7 m/s²",0,"Mengabaikan massa beban yang ikut bergerak."]]],["Hitung tegangan tali.",[["T = m₁a = 12 N",1,"Tinjau balok: satu-satunya gaya mendatar."],["T = 20 N",0,"Itu berat beban; beban dipercepat sehingga T lebih kecil."]]]],k:'a = 4 m/s², T = 12 N (< 20 N karena beban turun dipercepat).'},
{e:'🌳',t:'Es Melebur di Gelas Penuh',c:2,b:'Es batu mengapung di gelas penuh air. Ketika es melebur seluruhnya, apakah air tumpah?',s:[["Syarat es mengapung?",[["Berat es = gaya apung = berat air yang dipindahkan",1,"Massa es sama dengan massa air yang dipindahkan."],["Berat es lebih kecil dari volumenya",0,"Tidak bermakna."]]],["Air hasil lebur memiliki massa…",[["Sama dengan massa es, sehingga volumenya sama dengan volume air yang dipindahkan es",1,"Mengisi tepat ruang yang tadi dipindahkan."],["Lebih besar dari massa es",0,"Massa kekal."]]],["Kesimpulan?",[["Permukaan tetap, tidak tumpah",1,"Volume total tidak berubah."],["Tumpah",0,"Volume tidak bertambah."],["Turun",0,"Tidak ada ruang kosong baru."]]]],k:'Permukaan tetap. (Jika es mengandung batu atau gelembung, hasilnya bisa berbeda.)'},
{e:'🌳',t:'Pipa Organa Tertutup',c:3,b:'Pipa organa tertutup panjang 0,85 m, v = 340 m/s. Berapa frekuensi nada dasar dan nada atas pertama?',s:[["Bentuk gelombang nada dasar?",[["Simpul di ujung tertutup, perut di ujung terbuka: L = ¼λ",1,"Itu ciri pipa tertutup."],["L = ½λ",0,"Itu pipa terbuka."]]],["Hitung f₀.",[["λ = 4L = 3,4 m → f₀ = 340/3,4 = 100 Hz",1,"v = λf."],["f₀ = 200 Hz",0,"Memakai L = ½λ."]]],["Nada atas pertama?",[["300 Hz (harmonik ke-3, hanya ganjil)",1,"f₁ = 3f₀."],["200 Hz",0,"Itu pipa terbuka."]]]],k:'f₀ = 100 Hz dan f₁ = 300 Hz.'},
{e:'🌳',t:'Gas Memuai Isobarik',c:4,b:'Gas ideal monoatomik memuai isobarik dan menyerap kalor 500 J. Berapa usaha yang dilakukan gas?',s:[["Hukum yang tepat?",[["Q = ΔU + W",1,"Hukum I Termodinamika."],["ΔU = 0",0,"Itu isotermal."]]],["Hubungan ΔU dan W pada isobarik monoatomik?",[["ΔU = (3/2)nRΔT dan W = nRΔT → ΔU = 1,5 W",1,"Perbandingan 3/2 : 1."],["ΔU = W",0,"Tidak sama."]]],["Hitung W.",[["Q = 2,5 W → W = 200 J",1,"500/2,5."],["W = 500 J",0,"Itu seluruh kalor."]]]],k:'W = 200 J (40% dari Q); ΔU = 300 J.'},
{e:'🌳',t:'Dua Lampu Diseri',c:5,b:'Lampu 40 W/220 V dan 100 W/220 V diseri lalu dihubungkan ke 220 V. Mana yang lebih terang?',s:[["Besaran apa yang pertama dihitung?",[["Hambatan R = V²/P tiap lampu",1,"R₄₀ = 1210 Ω, R₁₀₀ = 484 Ω."],["Daya tiap lampu = 40 W dan 100 W",0,"Itu daya nominal pada 220 V, bukan saat diseri."]]],["Pada rangkaian seri, daya sebanding dengan…",[["R, karena arus sama (P = I²R)",1,"Arus sama sehingga R besar → P besar."],["1/R",0,"Itu untuk paralel."]]],["Kesimpulan?",[["Lampu 40 W lebih terang",1,"R lebih besar."],["Lampu 100 W lebih terang",0,"Itu jika paralel."]]]],k:'Lampu 40 W lebih terang saat diseri; saat paralel yang 100 W.'}];

{id:'h1',c:0,t:'Bola dari Balkon',q:'Bola dilempar vertikal ke atas dengan 20 m/s dari balkon setinggi 25 m di atas tanah (g = 10 m/s²). Kapan bola menyentuh tanah?',o:['2 s','4 s','5 s','6 s'],a:2,e:'Ambil arah atas positif: y = 25 + 20t − 5t² = 0 → t² − 4t − 5 = 0 → (t − 5)(t + 1) = 0. Akar negatif dibuang, t = 5 s. Jebakan: menjawab 4 s (naik-turun ke ketinggian balkon) lupa tambahan 25 m.'},
{id:'h2',c:1,t:'Balok Bertumpuk',q:'Balok A (4 kg) berada di atas balok B (6 kg) pada lantai licin. Gaya 20 N mendatar menarik B. Koefisien gesek statis antara A dan B adalah 0,5 (g = 10). Apa yang terjadi pada A?',o:['A selip terhadap B','A ikut bergerak tanpa selip, gesekan 8 N','A ikut bergerak tanpa selip, gesekan 20 N','A diam karena lantai licin'],a:1,e:'Percepatan sistem a = 20/10 = 2 m/s². A hanya dipercepat oleh gesekan dari B: f = m_A·a = 8 N. Gesekan maksimum = μₛ·m_A·g = 0,5 × 40 = 20 N, jadi 8 N < 20 N dan tidak selip.'},
{id:'h3',c:2,t:'Gabus Tertambat',q:'Gabus (ρ = 200 kg/m³, V = 500 cm³) diikat dengan tali pada dasar bejana berisi air dan tercelup seluruhnya. Berapa tegangan tali? (g = 10)',o:['1 N','4 N','5 N','6 N'],a:1,e:'F_A = ρ_air·g·V = 1000 × 10 × 5×10⁻⁴ = 5 N ke atas. Berat gabus w = 200 × 10 × 5×10⁻⁴ = 1 N ke bawah. Kesetimbangan: T + w = F_A → T = 4 N.'},
{id:'h4',c:3,t:'Pabrik Bising',q:'Sebuah mesin menghasilkan 80 dB pada jarak 2 m. Berapa taraf intensitas di jarak 20 m bila terdapat 10 mesin identik di tempat yang sama?',o:['60 dB','70 dB','80 dB','90 dB'],a:1,e:'Jarak 10× lebih jauh: −20 dB. Jumlah mesin 10×: +10 dB. TI = 80 − 20 + 10 = 70 dB.'},
{id:'h5',c:4,t:'Es Masuk Teh',q:'Es 100 g bersuhu −10 °C dimasukkan ke 300 g air 40 °C (c es = 2,1 J/g°C, c air = 4,2 J/g°C, L lebur = 336 J/g). Berapa suhu akhir campuran?',o:['0 °C','8,75 °C','15 °C','20 °C'],a:1,e:'Kalor maksimum dari air sampai 0 °C = 300 × 4,2 × 40 = 50 400 J. Kalor untuk menaikkan es ke 0 °C dan melebur seluruhnya = 100 × 2,1 × 10 + 100 × 336 = 35 700 J < 50 400 J, jadi semua es melebur. Sisa 14 700 J memanaskan 400 g air: ΔT = 14 700/(400 × 4,2) = 8,75 °C.'},
{id:'h6',c:5,t:'Tiga Lampu Identik',q:'Lampu L₁ diseri dengan gabungan paralel L₂ dan L₃, lalu dihubungkan ke baterai ideal. Bila L₃ dicabut, apa yang terjadi pada L₁ dan L₂?',o:['Keduanya lebih terang','L₁ lebih redup, L₂ lebih terang','Keduanya lebih redup','Tidak ada perubahan'],a:1,e:'R total naik dari 1,5R menjadi 2R sehingga arus total turun: L₁ lebih redup. Tegangan di L₁ turun sehingga tegangan cabang paralel naik; kini L₂ menerima seluruh arus (sebelumnya arus terbagi dua), jadi lebih terang.'}];
let HTD={},DYS=[],LAST=null;try{HTD=JSON.parse(localStorage.getItem('tkaHT')||'{}');DYS=JSON.parse(localStorage.getItem('tkaDays')||'[]');LAST=JSON.parse(localStorage.getItem('tkaLast')||'null')}catch(e){}
const tdy=()=>new Date().toISOString().slice(0,10);
