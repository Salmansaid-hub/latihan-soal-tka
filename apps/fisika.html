["1.1 Besaran dalam gerak","<b>Konsep:</b> Bayangkan berlari satu putaran di lintasan: kakimu menempuh <b>jarak</b> 400 m (panjang lintasan, skalar), tetapi karena kembali ke titik awal, <b>perpindahan</b>-mu nol (selisih posisi awal–akhir, vektor). Kelajuan = jarak/waktu; kecepatan = perpindahan/waktu. <b>Jebakan:</b> kecepatan rata-rata satu putaran penuh = 0, sedangkan kelajuan rata-rata tidak nol. Geser slider hingga 100% untuk melihatnya.","v̄ = Δx/Δt ; v̄ = s/t — kelajuan rata-rata (jarak total ÷ waktu total) ; a = Δv/Δt ; perpindahan 2 arah tegak lurus: Δr = √(a²+b²)",["dispjar"]],
["1.2 GLB","<b>Konsep:</b> GLB = kecepatan <i>tetap</i>, percepatan nol. Ciri khasnya: dalam selang waktu yang sama, jarak tempuh selalu sama (lihat titik-titik tiap detik berjarak rata). Grafik x–t berupa garis lurus miring (kemiringan = v), grafik v–t mendatar. <b>Soal khas:</b> dua benda bertemu → samakan posisi x₁ = x₂ pada waktu sama; jika satu berangkat terlambat, waktunya dikurangi selang itu.","x = x₀ + vt ; bertemu: x₁ = x₂ ; t₂ = t₁ − Δt — waktu benda B bila berangkat terlambat Δt",["glb"]],
["1.3 GLBB","<b>Konsep:</b> Percepatan <i>tetap</i> artinya kecepatan bertambah (atau berkurang) sama besar tiap detik, sehingga jarak per detik makin besar (titik makin renggang). Pada grafik v–t, kemiringan = a dan luas = perpindahan. <b>Langkah soal:</b> (1) tulis yang diketahui v₀, a, t, x; (2) pilih rumus yang tidak memuat besaran yang tidak ditanya; (3) a negatif untuk perlambatan. <b>Jebakan:</b> mobil mengerem berhenti, jangan hitung sampai waktu setelah berhenti.","v = v₀ + at ; x = x₀ + v₀t + ½at² ; v² = v₀² + 2aΔx ; jarak detik ke-n: sₙ = v₀ + a(2n−1)/2 ; jarak henti: s = v₀²/2a",["strobe","vt"]],
["1.4 Gerak vertikal","<b>Konsep:</b> Jatuh bebas, lempar ke bawah, dan lempar ke atas adalah GLBB dengan a = g = 10 m/s² <i>selalu ke bawah</i>. Pada lemparan ke atas, kecepatan berkurang 10 m/s tiap detik, nol di puncak, lalu berbalik arah. <b>Jebakan terbesar:</b> di titik tertinggi v = 0 tetapi percepatan tetap g (bukan nol). Waktu naik = waktu turun; kecepatan saat kembali ke titik awal sama besar dengan v₀ (arah berlawanan).","Jatuh bebas: v = gt ; h = ½gt² ; v = √(2gh) ; Ke atas: h_maks = v₀²/2g ; t = v₀/g — waktu naik sampai titik tertinggi ; T = 2v₀/g — waktu total di udara ; v = v₀ − gt ; h = v₀t − ½gt²",["vert"]],
["1.5 Analisis grafik gerak","<b>Konsep:</b> Grafik adalah 'peta' gerak. x–t: kemiringan = kecepatan. v–t: kemiringan = percepatan, <b>luas = perpindahan</b>. a–t: luas = perubahan kecepatan. <b>Jarak vs perpindahan:</b> luas di bawah sumbu t (v negatif) berarti benda berbalik arah. Perpindahan = luas atas − luas bawah, jarak = luas atas + luas bawah. Ubah skenario 1–3 dan geser waktu untuk melihat dua nilai itu berbeda.","v = Δx/Δt — kemiringan grafik x–t ; a = Δv/Δt — kemiringan grafik v–t ; Δx = ∫v dt — luas grafik v–t (bertanda) ; s = ∫|v| dt — jarak: jumlah luas mutlak ; trapesium: L = ½(a+b)t",["graf"]],
["1.6 Gerak relatif & perpaduan dua GLB","<b>Konsep:</b> Kecepatan selalu relatif terhadap pengamat. Perahu yang diarahkan lurus menyeberang tetap terbawa arus: geraknya gabungan dua GLB yang saling bebas. <b>Poin TKA:</b> waktu menyeberang hanya ditentukan komponen kecepatan tegak lurus tepi (t = d/v_perahu); arus hanya menentukan seberapa jauh perahu hanyut. Searah: kurangkan kecepatan; berlawanan arah: jumlahkan.","v_AB = v_A − v_B ; searah: v_rel = v₁ − v₂ ; berlawanan: v_rel = v₁ + v₂ ; tegak lurus: v = √(v₁² + v₂²) ; t = d/v_p — waktu menyeberang (v_p laju perahu tegak lurus tepi) ; x = v_a t — jarak hanyut (v_a laju arus)",["rel"]],
["1.7 Gerak parabola","<b>Konsep:</b> Dua gerak yang saling bebas, berbagi waktu yang sama: horizontal GLB (vₓ tetap) dan vertikal GLBB (a = g ke bawah). Di puncak vᵧ = 0 tetapi vₓ tidak nol. Sudut yang saling berkomplemen (30° dan 60°) memberi jangkauan sama; jangkauan maksimum pada 45°. Untuk gerak mendatar dari ketinggian H, waktu jatuh hanya bergantung H, bukan v₀.","vₓ = v₀cosθ ; vᵧ = v₀sinθ − gt ; x = v₀cosθ·t ; y = v₀sinθ·t − ½gt² ; h_maks = v₀²sin²θ/2g ; T = 2v₀ sinθ / g — waktu total di udara ; R = v₀²sin2θ/g ; mendatar: t = √(2H/g) ; x = v₀√(2H/g)",["proj","hproj"]],
["1.8 Gerak melingkar beraturan","<b>Konsep:</b> Laju tetap, tetapi arah kecepatan terus berubah (menyinggung lingkaran), sehingga ada percepatan <b>sentripetal</b> yang selalu mengarah ke pusat. Kecepatan linear tidak tetap (vektor), kelajuannya tetap. <b>Jebakan:</b> periode besar → frekuensi kecil (kebalikan); pada ω sama, titik yang lebih jauh dari pusat lebih cepat.","T = 1/f ; ω = 2πf = 2π/T ; v = ωR ; a_s = v²/R = ω²R ; 1 rpm = 2π/60 rad/s ; θ = ωt",["gmb"]],
["1.9 Hubungan roda-roda","<b>Konsep:</b> Dua aturan emas: (1) roda <b>sepusat/seporos</b> punya ω sama; (2) roda yang <b>bersinggungan atau dihubung rantai/sabuk</b> punya laju linear tepi sama. Roda yang lebih kecil berputar lebih cepat (ω berbanding terbalik dengan R). Untuk sepeda: gir depan → rantai → gir belakang (v sama) → roda belakang seporos (ω sama). Roda yang bersinggungan berputar berlawanan arah.","Sepusat: ω₁ = ω₂ ; Sabuk/singgung: v₁ = v₂ → ω₁R₁ = ω₂R₂ ; v = ω R — laju roda sepeda (ω gir belakang, R jari-jari roda)",["roda"]]]},
{n:"Dinamika",e:"🧱",c:"#e5484d",z:"",i:"Menjawab mengapa benda bergerak. Selalu mulai dari diagram benda bebas, lalu terapkan ΣF = ma per sumbu.",S:[
["2.1 Gaya & diagram benda bebas","<b>Konsep:</b> Gaya adalah dorongan/tarikan yang bisa mengubah gerak. <b>Diagram benda bebas (DBB)</b> = gambar satu benda saja beserta <i>semua</i> gaya yang bekerja padanya. Langkah wajib: (1) pilih benda, (2) gambar w ke bawah, N tegak lurus bidang, gesek melawan gerak, gaya luar, (3) jumlahkan gaya per sumbu. Gaya total nol → diam atau GLB; tidak nol → ada percepatan. <b>Jebakan:</b> gaya yang dikerjakan benda <i>pada permukaan</i> tidak digambar di DBB benda itu.","ΣFₓ = maₓ ; ΣFᵧ = maᵧ ; seimbang: ΣF = 0 ; resultan segaris: R = F₁ ± F₂ ; tegak lurus: R = √(F₁²+F₂²)",["fbd"]],
["2.2 Hukum-hukum Newton","<b>Konsep:</b> I (kelembaman): tanpa gaya total, benda mempertahankan keadaannya. II: percepatan sebanding gaya total dan berbanding terbalik dengan massa. III: aksi–reaksi sama besar, berlawanan arah, <b>bekerja pada dua benda berbeda</b> (karena itu tidak saling meniadakan). Pada simulasi, dorongan keduanya sama besar, tetapi orang yang lebih ringan mendapat percepatan lebih besar.","ΣF = 0 → a = 0 ; ΣF = ma ; a = ΣF/m ; F₁₂ = −F₂₁ — aksi = −reaksi, bekerja pada dua benda berbeda ; w = mg",["skate"]],
["2.3 Jenis-jenis gaya","<b>Konsep:</b> Gesekan <b>statis</b> menyesuaikan diri: besarnya sama dengan gaya tarik sampai batas maksimum μ_s·N. Setelah benda bergerak, gesekan menjadi <b>kinetis</b> μ_k·N yang konstan dan biasanya lebih kecil. Pegas mengikuti hukum Hooke: gaya pemulih sebanding pertambahan panjang. Berat benda bergantung gravitasi (w = mg), massa tidak. <b>Jebakan:</b> jangan memakai f = μN jika benda masih diam.","w = mg ; f_s ≤ μ_s N ; f_k = μ_k N ; F = kx ; E_p = ½kx² — energi potensial pegas ; F = G m₁m₂/r² ; seri: 1/k = Σ1/k ; paralel: k = Σk",["fgraf","pegas"]],
["2.4 Bidang datar & bidang miring","<b>Konsep:</b> Pada bidang miring, berat diuraikan: komponen sejajar bidang w sinθ (menggerakkan) dan tegak lurus bidang w cosθ (diimbangi N). Karena massa ada di kedua sisi persamaan, percepatannya tidak bergantung massa. Benda tepat akan meluncur ketika tanθ = μ_s. <b>Jebakan:</b> N = mg cosθ, bukan mg.","Licin: a = g sinθ ; Kasar: a = g(sinθ − μ cosθ) ; N = mg cosθ ; tanθ ≤ μ_s — syarat benda tetap diam di bidang miring ; ditarik F searah bidang: a = (F − mg sinθ − μmg cosθ)/m",["inc"]],
["2.5 Sistem benda terhubung: katrol & gaya kontak","<b>Konsep:</b> Benda yang dihubungkan tali (tak melar) bergerak bersama dengan percepatan sama besar. Cara cepat: anggap seluruh sistem satu benda, gaya penggerak dikurangi gaya penghambat, dibagi total massa. Tegangan tali dicari dengan meninjau satu benda saja. Pada Atwood, benda yang lebih berat turun dan tegangannya berada di antara dua berat. <b>Gaya kontak:</b> dua balok didorong F, balok belakang menerima N = m₂F/(m₁+m₂).","Atwood: a = (m₂−m₁)g/(m₁+m₂) ; T = 2m₁m₂g/(m₁+m₂) ; meja + beban gantung: a = (m₂g − μm₁g)/(m₁+m₂) ; T = m₁(a+μg) ; gaya kontak: N = m₂F/(m₁+m₂)",["atwood","meja"]],
["2.6 Gerak di dalam lift","<b>Konsep:</b> Timbangan di lift menunjukkan gaya normal N (berat semu), bukan massa. Lift dipercepat ke atas atau diperlambat saat turun → percepatan ke atas → N lebih besar dari mg (terasa berat). Dipercepat ke bawah atau diperlambat saat naik → N lebih kecil (terasa ringan). Lift GLB memberi N = mg. <b>Kunci:</b> yang menentukan adalah <i>arah percepatan</i>, bukan arah gerak.","ΣF = ma ; percepatan ke atas: N = m(g + a) ; percepatan ke bawah: N = m(g − a) ; GLB: N = mg ; tali putus: a = g, N = 0",["lift"]],
["2.7 Dinamika gerak melingkar","<b>Konsep:</b> Gaya sentripetal bukan gaya baru; ia adalah <i>resultan gaya yang menuju pusat</i>. Di tikungan datar, gesekan menjadi gaya sentripetal sehingga ada laju maksimum. Pada lintasan lingkaran vertikal, di titik atas berat dan N sama-sama menuju pusat: N = mv²/R − mg; benda lepas jika N < 0. <b>Syarat lolos puncak:</b> v ≥ √(gR) di puncak atau v ≥ √(5gR) di dasar.","F_s = mv²/R = mω²R ; tikungan datar: v_maks = √(μgR) ; miring licin: tanθ = v²/gR ; puncak: N = mv²/R − mg ; dasar: N = mg + mv²/R ; v ≥ √(5gR) — laju minimum di dasar agar lolos sampai puncak",["loop","tikung"]],
["2.8 Momentum & impuls","<b>Konsep:</b> Momentum p = mv (vektor). Impuls I = FΔt = perubahan momentum. Untuk perubahan momentum yang sama, memperpanjang waktu kontak memperkecil gaya (itulah fungsi bantalan, airbag, menekuk lutut saat mendarat). Luas di bawah grafik F–t sama dengan impuls. <b>Jebakan:</b> bola memantul → Δp = m(v₂ + v₁) (arah berlawanan dijumlah).","p = mv ; I = FΔt = Δp = mv₂ − mv₁ ; I = ∫F dt — impuls = luas grafik F–t ; jatuh dari h: v = √(2gh) ; memantul: Δp = m(v + v')",["impuls"]],
["2.9 Kekekalan momentum & tumbukan","<b>Konsep:</b> Tanpa gaya luar, momentum total sebelum = sesudah, untuk semua jenis tumbukan. Energi kinetik hanya kekal pada tumbukan lenting sempurna (e = 1). Pada tumbukan tak lenting (e = 0) kedua benda menyatu dan energi terbuang paling banyak. Koefisien restitusi e menggambarkan 'seberapa lenting'. Massa sama + lenting + salah satu diam → kecepatan saling bertukar.","m₁v₁ + m₂v₂ = m₁v₁' + m₂v₂' ; e = −(v₁'−v₂')/(v₁−v₂) ; tak lenting: v' = (m₁v₁+m₂v₂)/(m₁+m₂) ; pantulan: e = √(h'/h) ; ΔEk = ½μ_red(v₁−v₂)²(1−e²)",["tumbuk"]],
["2.10 Ledakan, rekoil senapan, roket","<b>Konsep:</b> Pada ledakan, gaya dalam jauh lebih besar dari gaya luar sehingga momentum total kekal. Awalnya diam (p = 0) → setelah meledak momentum kedua bagian sama besar tetapi berlawanan arah; bagian yang lebih ringan bergerak lebih cepat. Rekoil senapan memakai prinsip yang sama. Roket menyemburkan gas ke belakang sehingga mendapat gaya dorong ke depan (aksi–reaksi).","0 = m₁v₁ + m₂v₂ ; v₂ = −(m₁/m₂)v₁ ; senapan: v_s = −m_p v_p/M ; F = v Δm/Δt — gaya dorong roket (v laju gas buang)",["rekoil"]]]},
{n:"Fluida",e:"🌊",c:"#0ea5e9",z:"",i:"Fluida diam: tekanan hidrostatis dan gaya apung. Fluida mengalir: kontinuitas dan Bernoulli.",S:[
["3.1 Massa jenis & tekanan","<b>Konsep:</b> Massa jenis menyatakan seberapa padat bahan: massa tiap satuan volume. Tekanan menyatakan seberapa terpusat gaya: gaya tiap satuan luas. Itu sebabnya paku runcing menembus papan, sedangkan sepatu salju yang lebar tidak membuatmu tenggelam. <b>Langkah:</b> ubah satuan ke SI dahulu (cm² → 10⁻⁴ m², g/cm³ → ×1000). <b>Jebakan:</b> tekanan bergantung luas bidang sentuh, bukan hanya berat. Untuk campuran, jumlahkan massa dan volume dahulu, jangan merata-ratakan massa jenis.","ρ = m/V — massa jenis (kg/m³) ; P = F/A — tekanan (Pa = N/m²) ; 1 g/cm³ = 1000 kg/m³ — konversi massa jenis ; 1 atm = 76 cmHg = 1,01×10⁵ Pa — tekanan atmosfer ; ρ = (m₁+m₂)/(V₁+V₂) — massa jenis campuran dua zat ; P = ρ g h — bentuk lain tekanan zat padat/cair",["rho","tekan"]],
["3.2 Tekanan hidrostatis & hukum pokok hidrostatika","<b>Konsep:</b> Tekanan dalam cairan berasal dari berat kolom cairan di atasnya, jadi makin dalam makin besar, dan pada kedalaman yang sama tekanannya ke segala arah sama. Bentuk wadah tidak berpengaruh. Hukum pokok: titik pada bidang datar yang sama dalam satu cairan bersambung bertekanan sama. <b>Langkah pipa U:</b> tarik garis datar melalui bidang batas dua cairan, lalu samakan tekanan di kedua kaki. <b>Jebakan:</b> h diukur dari permukaan cairan, bukan dari dasar wadah; tekanan mutlak = hidrostatis + atmosfer.","P_h = ρ g h — tekanan hidrostatis ; P = P₀ + ρgh — tekanan mutlak ; ρ₁h₁ = ρ₂h₂ — pipa U, dua cairan ; ρ₁h₁ = ρ₂h₂ + ρ₃h₃ — pipa U, tiga cairan ; P = (76 − H/100) cmHg — tekanan udara di ketinggian H meter ; P = P₀ + ρgΔh — tekanan gas pada manometer",["hidro","pipaU"]],
["3.3 Hukum Pascal","<b>Konsep:</b> Tekanan pada fluida tertutup diteruskan sama besar ke segala arah. Dongkrak hidrolik memanfaatkannya: gaya kecil pada piston kecil menghasilkan gaya besar pada piston besar. Namun tidak ada yang gratis: piston kecil harus turun jauh agar piston besar naik sedikit, sehingga usahanya sama. <b>Jebakan:</b> perbandingan luas adalah kuadrat perbandingan diameter atau jari-jari, jangan lupa pangkat dua.","P₁ = P₂ — tekanan sama ; F₁/A₁ = F₂/A₂ — hukum Pascal ; F₂ = F₁(A₂/A₁) = F₁(d₂/d₁)² — gaya keluaran ; KM = F₂/F₁ = A₂/A₁ — keuntungan mekanik ; A₁d₁ = A₂d₂ — volume cairan kekal ; W = F₁d₁ = F₂d₂ — usaha masuk = usaha keluar",["pascal"]],
["3.4 Hukum Archimedes","<b>Konsep:</b> Benda dalam fluida didorong ke atas oleh gaya sebesar berat fluida yang dipindahkan. Jika gaya apung maksimum lebih besar dari berat, benda naik dan berhenti ketika hanya sebagian tercelup sehingga F_A = w. Kapal baja yang berongga bisa mengapung karena massa jenis rata-ratanya lebih kecil dari air. <b>Langkah:</b> tulis keseimbangan gaya vertikal w = F_A (+ T bila ada tali). <b>Jebakan:</b> V pada F_A adalah volume yang <i>tercelup</i>, bukan seluruh benda; gaya apung tidak bergantung kedalaman bila sudah tercelup penuh.","F_A = ρ g V — gaya apung (ρ massa jenis fluida, V volume tercelup) ; w = ρ_b g V_b — berat benda ; Mengapung: ρ_b < ρ_f → V_cel/V_b = ρ_b/ρ_f — fraksi tercelup ; Melayang: ρ_b = ρ_f — seluruhnya tercelup ; Tenggelam: ρ_b > ρ_f → w > F_A ; w′ = w − F_A — berat semu (bacaan neraca pegas) ; w/F_A = ρ_b/ρ_f — tenggelam penuh ; w = F_A1 + F_A2 — benda di dua cairan ; w = F_A + T — benda ditahan tali",["arch","neraca"]],
["3.5 Pengayaan: tegangan permukaan, kapilaritas, viskositas","<b>Konsep:</b> Permukaan cairan berperilaku seperti selaput kenyal karena tarik-menarik antarmolekul (tegangan permukaan); itu sebabnya serangga bisa berjalan di air dan tetes air membulat. Kapilaritas: cairan naik di pipa sempit karena adhesi lebih kuat daripada kohesi, makin sempit makin tinggi. Viskositas adalah kekentalan: bola yang jatuh di cairan kental akhirnya mencapai kecepatan terminal. <b>Jebakan:</b> raksa memiliki sudut kontak lebih dari 90° sehingga permukaannya justru turun dalam pipa kapiler.","γ = F/ℓ — tegangan permukaan (N/m) ; h = 2γ cosθ / (ρ g r) — tinggi kenaikan kapiler ; F_s = 6π η r v — gaya Stokes ; v_t = 2r²(ρ_b − ρ_f) g / (9η) — kecepatan terminal ; θ < 90° — air naik, cairan membasahi dinding ; θ > 90° — raksa turun",["kapiler","stokes"]],
["3.6 Fluida dinamis: debit & persamaan kontinuitas","<b>Konsep:</b> Fluida ideal tak dapat dimampatkan, sehingga aliran yang masuk pipa sama dengan yang keluar. Ketika pipa menyempit, fluida harus mengalir lebih cepat, seperti menekan ujung selang agar air menyembur lebih jauh. Debit tetap sepanjang pipa kecuali ada percabangan. Batang di bawah gambar menunjukkan tekanan yang turun di bagian cepat. <b>Jebakan:</b> laju berbanding terbalik dengan luas, bukan diameter: diameter dikecilkan 2 kali → laju naik 4 kali. Waktu mengisi bak = V/Q.","Q = V/t — debit (m³/s) ; Q = A v — debit dari luas × laju ; A₁v₁ = A₂v₂ — persamaan kontinuitas ; A = πr² = ¼πd² — luas penampang ; v₂/v₁ = (d₁/d₂)² — perbandingan laju ; ΣQ_in = ΣQ_out — debit di percabangan ; 1 L = 10⁻³ m³ — konversi volume",["pipe"]],
["3.7 Hukum Bernoulli & penerapannya","<b>Konsep:</b> Bernoulli adalah kekekalan energi untuk fluida mengalir: tekanan + energi kinetik per volume + energi potensial per volume selalu tetap. Akibatnya, di tempat aliran cepat tekanannya rendah. Itulah penjelasan gaya angkat sayap pesawat, semprotan parfum, dan venturimeter. Torricelli: laju air keluar dari lubang sama dengan laju jatuh bebas dari kedalaman h. <b>Jebakan:</b> jarak mendatar x maksimum ketika lubang tepat di tengah; lubang dengan h dan H′ yang ditukar memberi jarak sama. Kedalaman h dihitung dari permukaan, H′ dari lubang ke tanah.","P + ½ρv² + ρgh = C — Bernoulli (C tetap) ; P₁ − P₂ = ½ρ(v₂² − v₁²) — pipa mendatar ; P₁ + ½ρv₁² + ρgh₁ = P₂ + ½ρv₂² + ρgh₂ — beda ketinggian ; v = √(2gh) — Torricelli ; x = 2√(h·H′) — jarak jatuh mendatar ; t = √(2H′/g) — waktu jatuh dari lubang ; F = ½ρ(v₁² − v₂²)A — gaya angkat sayap (v₁ atas, v₂ bawah) ; P = ηρQgh — daya PLTA (η efisiensi) ; v₁ = A₂√(2ΔP / ρ(A₁² − A₂²)) — venturimeter",["torr","sayap"]]]},
{n:"Gelombang",e:"〰️",c:"#8b5cf6",z:"",i:"Gelombang memindahkan energi, bukan materi. Frekuensi ditentukan sumber dan tidak berubah saat berpindah medium.",S:[
["4.1 Konsep dasar gelombang","<b>Konsep:</b> Gelombang adalah getaran yang merambat; yang berpindah adalah energi, bukan partikel mediumnya (partikel hanya bergetar di tempat, seperti gelombang penonton di stadion). Transversal: arah getar tegak lurus rambatan (tali, cahaya). Longitudinal: arah getar sejajar rambatan (bunyi, pegas) dengan rapatan dan renggangan. Gelombang mekanik butuh medium, elektromagnetik tidak. <b>Langkah:</b> λ dari grafik y–x (jarak puncak ke puncak), T dari grafik y–t. <b>Jebakan:</b> satu gelombang = satu bukit + satu lembah. Frekuensi ditentukan sumber dan tidak berubah saat pindah medium.","v = λ f — cepat rambat ; T = 1/f — periode ; f = n/t — frekuensi dari n getaran ; λ = x/n — n gelombang sepanjang x ; v = λ/T ; v = √(F/μ) — gelombang pada tali ; μ = m/L — rapat massa tali",["wave","tl"]],
["4.2 Persamaan gelombang berjalan","<b>Konsep:</b> Simpangan gelombang bergantung pada dua hal sekaligus: waktu t dan posisi x. Tanda minus pada (ωt − kx) berarti merambat ke +x; tanda plus ke −x. Dua titik berjarak Δx berbeda fase Δφ = Δx/λ: sefase jika kelipatan bulat, berlawanan fase jika kelipatan setengah. <b>Langkah:</b> samakan bentuk soal dengan y = A sin(ωt − kx), baca A, ω, k, lalu hitung v = ω/k, f = ω/2π, λ = 2π/k. <b>Jebakan:</b> koefisien t adalah ω (bukan f), koefisien x adalah k (bukan λ).","y = A sin(ωt − kx) — merambat ke +x ; y = A sin(ωt + kx) — merambat ke −x ; ω = 2πf = 2π/T — kecepatan sudut ; k = 2π/λ — bilangan gelombang ; v = ω/k = λf — cepat rambat ; Δφ = Δx/λ = Δt/T — beda fase ; Δθ = 2πΔφ — beda sudut fase ; v_y = Aω cos(ωt − kx) — kecepatan getar partikel",["pers"]],
["4.3 Gelombang stasioner","<b>Konsep:</b> Gelombang stasioner terbentuk dari superposisi gelombang datang dan pantul yang amplitudo dan frekuensinya sama. Ada titik yang selalu diam (simpul) dan titik yang bergetar maksimum (perut) di tempat yang tetap. Ujung terikat memantulkan dengan fase terbalik sehingga di ujungnya terdapat simpul; ujung bebas memantulkan tanpa pembalikan fase sehingga di ujungnya terdapat perut. <b>Langkah:</b> ukur x dari titik pantul. <b>Jebakan:</b> jarak simpul ke simpul berurutan = ½λ, sedangkan simpul ke perut terdekat = ¼λ.","y = 2A sin(kx) cos(ωt) — ujung terikat ; y = 2A cos(kx) sin(ωt) — ujung bebas ; A_s = 2A sin(kx) — amplitudo di titik x (terikat) ; Simpul (terikat): x = nλ/2 — dari titik pantul ; Perut (terikat): x = (2n+1)λ/4 ; x = nλ/2 — letak perut pada ujung bebas ; x = (2n+1)λ/4 — letak simpul pada ujung bebas",["stas"]],
["4.4 Sifat-sifat gelombang","<b>Konsep:</b> Gelombang dapat dipantulkan (sudut datang = sudut pantul), dibiaskan (arah berbelok saat lajunya berubah), mengalami difraksi (melentur di celah atau tepi, jelas jika lebar celah mendekati λ), berinterferensi (superposisi), dan terpolarisasi (hanya gelombang transversal). Saat pindah medium frekuensi tetap, sedangkan v dan λ berubah sebanding. <b>Langkah:</b> medium renggang → rapat: sinar mendekati normal. <b>Jebakan:</b> sudut selalu diukur dari garis normal, bukan dari permukaan. Bunyi tidak dapat terpolarisasi karena longitudinal.","θ_i = θ_r — hukum pemantulan ; n₁ sin θ₁ = n₂ sin θ₂ — hukum Snell ; v₁/v₂ = λ₁/λ₂ = n₂/n₁ — hubungan pembiasan ; f₁ = f₂ — frekuensi tetap ; n = c/v — indeks bias ; a ≈ λ — syarat difraksi jelas",["refraksi","difraksi"]],
["4.5 Gelombang bunyi: cepat rambat, dawai, pipa organa","<b>Konsep:</b> Dawai terikat di kedua ujungnya sehingga ada simpul di ujung; nada dasar hanya satu perut. Pipa organa terbuka punya perut di kedua ujung (semua harmonik muncul). Pipa tertutup punya simpul di ujung tertutup dan perut di ujung terbuka sehingga hanya harmonik ganjil. Bunyi merambat paling cepat di zat padat, lalu cair, lalu gas. <b>Langkah:</b> gambar bentuk gelombang di dalam pipa, lalu hitung panjang pipa sebagai kelipatan ¼λ atau ½λ. <b>Jebakan:</b> nada atas pertama pipa tertutup adalah harmonik ke-3 (bukan ke-2).","v = √(F/μ) — cepat rambat di dawai ; f_n = (n+1) v / 2L — dawai & pipa terbuka (n = 0,1,2,…) ; f_n = (2n+1) v / 4L — pipa tertutup ; f₀ : f₁ : f₂ = 1 : 2 : 3 — dawai & pipa terbuka ; f₀ : f₁ : f₂ = 1 : 3 : 5 — pipa tertutup ; N_s = n + 2 — jumlah simpul dawai nada ke-n ; N_p = n + 1 — jumlah perut ; v ≈ 340 m/s — cepat rambat bunyi di udara",["dawai","pipa"]],
["4.6 Intensitas & taraf intensitas bunyi","<b>Konsep:</b> Intensitas adalah daya yang menembus tiap satuan luas. Makin jauh dari sumber, energi tersebar pada bola yang makin luas sehingga intensitas turun sebanding 1/r². Telinga merasakan bunyi secara logaritmik, maka dipakai taraf intensitas dalam desibel: naik 10 dB berarti intensitas 10 kali lipat. <b>Langkah:</b> hitung perubahan TI dengan selisih dB. <b>Jebakan:</b> menggandakan jumlah sumber hanya menambah 10 log 2 ≈ 3 dB; jarak 10 kali lebih jauh menurunkan 20 dB.","I = P/A = P/(4πr²) — intensitas sumber titik ; I₁/I₂ = (r₂/r₁)² — perbandingan jarak ; TI = 10 log(I/I₀) — taraf intensitas (dB) ; I₀ = 10⁻¹² W/m² — ambang dengar ; TI₂ = TI₁ + 10 log(n₂/n₁) — jumlah sumber berubah ; TI₂ = TI₁ − 20 log(r₂/r₁) — jarak berubah",["tingkat"]],
["4.7 Efek Doppler, pelayangan, aplikasi bunyi","<b>Konsep:</b> Efek Doppler: frekuensi yang terdengar berubah karena gerak relatif sumber atau pendengar. Sumber yang mendekat memampatkan gelombang (λ pendek, f tinggi); yang menjauh merenggangkannya. Pelayangan: dua sumber berfrekuensi hampir sama menghasilkan bunyi keras-lemah berulang. Sonar dan gema memakai waktu pergi-pulang gelombang. <b>Langkah:</b> pola P → S, arah ke kanan positif: v_p positif jika pendengar mendekati sumber, v_s positif jika sumber menjauhi pendengar. <b>Jebakan:</b> angin searah rambatan ditambahkan ke v.","f_p = (v ± v_p)/(v ± v_s) · f_s — Doppler, pola P → S ; sumber mendekat: f_p = v f_s/(v − v_s) ; sumber menjauh: f_p = v f_s/(v + v_s) ; pendengar mendekat: f_p = (v + v_p) f_s/v ; Δf = |f₁ − f₂| — frekuensi pelayangan ; d = v t / 2 — sonar dan gema ; v_p = v_s ⇒ f_p = f_s — bila searah dan sama cepat",["dopp","layang"]],
["4.8 Gelombang elektromagnetik","<b>Konsep:</b> Gelombang elektromagnetik terdiri dari medan listrik dan medan magnet yang saling tegak lurus dan tegak lurus arah rambat (transversal). Tidak memerlukan medium; di ruang hampa lajunya c. Dari frekuensi rendah ke tinggi: radio, mikro, inframerah, tampak, UV, sinar-X, gamma. Frekuensi tinggi berarti λ pendek dan energi foton besar. <b>Jebakan:</b> urutan frekuensi dan panjang gelombang saling berkebalikan; semua GEM memiliki c yang sama di vakum meski λ berbeda. <b>Kunci:</b> Cahaya tampak dari λ besar ke kecil: merah, jingga, kuning, hijau, biru, nila, ungu.","c = λ f = 3×10⁸ m/s — cepat rambat di vakum ; E = h f — energi foton ; h = 6,63×10⁻³⁴ J·s — tetapan Planck ; E = cB — perbandingan medan listrik dan magnet ; n = c/v — indeks bias ; γ > X > UV > VIS > IR > MW > RF — urutan frekuensi turun (gamma, sinar-X, ultraviolet, tampak, inframerah, mikro, radio)",["spektrum"]],
["4.9 Optik gelombang: interferensi, difraksi, polarisasi, dispersi","<b>Konsep:</b> Sebagai gelombang, cahaya menunjukkan interferensi (dua celah menghasilkan pita terang-gelap), difraksi, polarisasi (bukti bahwa cahaya transversal), dan dispersi (cahaya putih terurai karena indeks bias tiap warna berbeda; ungu dibelokkan paling kuat). Terang terjadi bila beda lintasan kelipatan bulat λ. <b>Langkah:</b> tulis d·P/L = mλ untuk terang, lalu pakai ΔP = λL/d untuk jarak antar pita. <b>Jebakan:</b> pada celah ganda gelap = (m − ½)λ, sedangkan pada celah tunggal gelap = mλ. Polarisator ideal menurunkan cahaya tak terpolarisasi menjadi setengahnya.","d sin θ = mλ — terang, celah ganda dan kisi (m = 0,1,2,…) ; d sin θ = (m − ½)λ — gelap, celah ganda ; d P / L = mλ — pendekatan sudut kecil ; ΔP = λL/d — jarak dua terang berurutan ; a sin θ = mλ — gelap, celah tunggal ; d = 1/N — tetapan kisi ; I = I₀ cos²θ — hukum Malus ; I₁ = ½ I₀ — setelah polarisator pertama ; n_v > n_m — indeks bias ungu > merah (dispersi prisma)",["celah","polar","prisma"]]]},
{n:"Kalor & Termo",e:"🔥",c:"#f59e0b",z:"",i:"Kalor adalah energi yang berpindah karena beda suhu. Hukum I = kekekalan energi. Hukum II membatasi efisiensi.",S:[
["5.1 Suhu & skala termometer","<b>Konsep:</b> Suhu mengukur derajat panas. Termometer memakai dua titik tetap (es melebur dan air mendidih) lalu membagi rentangnya: Celsius 100 bagian, Reamur 80, Fahrenheit 180, Kelvin 100. Karena itu perubahan suhu memenuhi ΔC : ΔR : ΔF : ΔK = 5 : 4 : 9 : 5. <b>Langkah:</b> pada termometer sembarang, bandingkan posisi relatif: (X − titik bawah)/(rentang) sama di semua skala. <b>Jebakan:</b> Fahrenheit dimulai dari 32 saat es melebur, jadi kurangi 32 dahulu. Kelvin tidak memakai tanda derajat dan tidak pernah negatif.","C : R : (F − 32) = 5 : 4 : 9 — perbandingan skala ; K = °C + 273 — Kelvin ; F = (9/5)C + 32 — Fahrenheit ; R = (4/5)C — Reamur ; ΔC = ΔK — selisih suhu sama ; (X − X₀)/(X₁ − X₀) = C/100 — termometer sembarang",["termo"]],
["5.2 Pemuaian zat","<b>Konsep:</b> Zat memuai bila dipanaskan karena molekulnya bergetar lebih lebar. Pemuaian panjang ΔL = L₀αΔT; luas β = 2α; volume γ = 3α. Bimetal (dua logam berbeda α direkatkan) melengkung saat suhu berubah: dipanaskan, ia melengkung ke arah logam yang α-nya lebih kecil; didinginkan, ke arah logam yang α-nya lebih besar. Air bersifat anomali: antara 0–4 °C menyusut saat dipanaskan sehingga massa jenis maksimum pada 4 °C. <b>Jebakan:</b> lubang pada pelat ikut memuai seperti bahan sekitarnya. Pada wadah penuh, yang tumpah adalah selisih pemuaian zat cair dan wadah.","ΔL = L₀ α ΔT — pemuaian panjang ; L = L₀(1 + αΔT) — panjang akhir ; ΔA = A₀ β ΔT, β = 2α — pemuaian luas ; ΔV = V₀ γ ΔT, γ = 3α — pemuaian volume ; ΔV = V₀ΔT(γ_c − 3α_w) — volume tumpah (c cairan, w wadah) ; T = 4 °C ⇒ ρ = ρ_maks — anomali air",["muai","bimetal"]],
["5.3 Kalor, kalor jenis, kapasitas kalor, kalor laten","<b>Konsep:</b> Kalor adalah energi yang berpindah karena beda suhu (satuan joule). Kalor jenis c: kalor untuk menaikkan suhu 1 kg zat sebesar 1 K; zat dengan c besar seperti air lambat panas dan lambat dingin. Kapasitas kalor C = mc: kalor untuk menaikkan suhu seluruh benda 1 K. Saat berubah wujud suhu tetap; kalor dipakai memutus ikatan antarmolekul (kalor laten L). <b>Langkah:</b> tentukan tahap: mengubah suhu (mcΔT) atau mengubah wujud (mL). <b>Jebakan:</b> 1 kal = 4,2 J; c air = 1 kal/g°C = 4200 J/kg°C. Es yang melebur menyerap kalor tetapi suhunya tetap 0 °C.","Q = m c ΔT — kalor mengubah suhu ; C = m c — kapasitas kalor (J/K) ; Q = m L — kalor mengubah wujud ; c_air = 4200 J/kg°C — 1 kal/g°C ; c_es = 2100 J/kg°C ; L_F = 336 000 J/kg — kalor lebur es (80 kal/g) ; L_V = 2 260 000 J/kg — kalor penguapan air ; 1 kal = 4,2 J — konversi",["kalor"]],
["5.4 Grafik suhu–kalor pada perubahan wujud","<b>Konsep:</b> Grafik suhu terhadap kalor memiliki dua jenis bagian: garis miring (suhu berubah, Q = mcΔT) dan garis mendatar (wujud berubah, Q = mL). Kemiringan yang lebih landai berarti c lebih besar. Es −20 °C menjadi uap melewati lima tahap, dan kalor terbesar dipakai untuk penguapan. <b>Langkah:</b> jumlahkan kalor semua tahap yang dilewati sampai titik yang ditanyakan. <b>Jebakan:</b> garis mendatar bukan berarti tidak ada kalor yang masuk; kalor sedang dipakai mengubah wujud, bukan menaikkan suhu.","Q₁ = m c_es (0 − T₀) — es naik ke 0 °C ; Q₂ = m L_es — es melebur ; Q₃ = m c_air (100 − 0) — air naik ke 100 °C ; Q₄ = m L_uap — air menguap ; Q = ΣQᵢ — kalor total semua tahap yang dilewati ; ΔT/ΔQ = 1/(mc) — kemiringan grafik T–Q (makin landai, c makin besar)",["grafik"]],
["5.5 Asas Black","<b>Konsep:</b> Asas Black adalah kekekalan energi kalor: pada pencampuran tanpa kehilangan ke lingkungan, kalor yang dilepas benda panas sama dengan kalor yang diserap benda dingin, sehingga suhu campuran berada di antara kedua suhu awal. Pada campuran dengan es, periksa dahulu apakah kalor dari air panas cukup untuk melebur seluruh es; bila tidak, suhu akhir tepat 0 °C dengan sebagian es tersisa. <b>Langkah:</b> bandingkan Q_lepas maksimum (air didinginkan sampai 0 °C) dengan Q_lebur seluruh es. <b>Jebakan:</b> wadah (kalorimeter) ikut menyerap kalor jika kapasitasnya diketahui.","Q_out = Q_in — asas Black (kalor lepas = kalor terima) ; T_c = (m₁c₁T₁ + m₂c₂T₂)/(m₁c₁ + m₂c₂) — dua zat ; T_c = (m₁T₁ + m₂T₂)/(m₁ + m₂) — zat sejenis ; Q_out > Q_F — semua es melebur, T_c > 0 °C (Q_F: kalor lebur seluruh es) ; Q_out < Q_F — sebagian es melebur, T_c = 0 °C ; (C_kal + mc)ΔT — kalorimeter ikut menyerap",["black","esair"]],
["5.6 Perpindahan kalor","<b>Konsep:</b> Konduksi: kalor merambat lewat tumbukan partikel tanpa partikelnya berpindah (logam). Konveksi: kalor dibawa oleh aliran zat (air mendidih, angin laut). Radiasi: kalor merambat sebagai gelombang elektromagnetik tanpa medium (cahaya matahari). Laju konduksi sebanding konduktivitas, luas, dan beda suhu, serta berbanding terbalik dengan tebal. Pada sambungan dua logam, laju kalor di keduanya sama. <b>Jebakan:</b> radiasi sebanding T⁴ dengan T dalam kelvin. Sekat terbaik: konduktivitas kecil dan tebal besar.","P = Q/t = k A ΔT / L — konduksi ; k₁A₁ΔT₁/L₁ = k₂A₂ΔT₂/L₂ — sambungan logam, laju sama ; P = h A ΔT — konveksi ; P = e σ A T⁴ — radiasi (Stefan–Boltzmann) ; σ = 5,67×10⁻⁸ W/m²K⁴ — tetapan ; P₂/P₁ = (T₂/T₁)⁴ — perbandingan radiasi ; e = 1 — benda hitam sempurna",["sambungan","konveksi","radiasi"]],
["5.7 Teori kinetik gas & gas ideal","<b>Konsep:</b> Gas ideal dipandang sebagai banyak partikel kecil yang bergerak acak dan bertumbukan lenting tanpa gaya tarik antarmolekul. Tekanan berasal dari tumbukan molekul dengan dinding; suhu mengukur energi kinetik rata-rata molekul. Suhu naik → molekul lebih cepat → tekanan naik (V tetap). Volume diperkecil → tumbukan lebih sering → tekanan naik (T tetap). <b>Langkah:</b> ubah suhu ke kelvin; n = m/M = N/N_A. <b>Jebakan:</b> energi kinetik rata-rata hanya bergantung suhu, bukan jenis gas; pada suhu sama gas yang lebih ringan lebih cepat (v_rms ∝ 1/√M).","PV = nRT — gas ideal (mol) ; PV = NkT — gas ideal (partikel) ; P₁V₁/T₁ = P₂V₂/T₂ — massa gas tetap ; P = ⅓ ρ v²_rms — tekanan kinetik ; E_k = (3/2) k T — energi kinetik rata-rata per molekul ; U = (3/2) n R T — energi dalam gas monoatomik ; v_rms = √(3RT/M) = √(3kT/m) — laju efektif ; R = 8,31 J/mol·K — tetapan gas ; k = 1,38×10⁻²³ J/K — tetapan Boltzmann ; N_A = 6,02×10²³ /mol — bilangan Avogadro",["gas","maxwell"]],
["5.8 Sistem termodinamika, usaha & Hukum I","<b>Konsep:</b> Sistem adalah gas yang kita amati, lingkungan adalah sisanya. Hukum I = kekekalan energi: kalor yang diterima gas dipakai untuk melakukan usaha dan menaikkan energi dalam. Usaha gas sama dengan luas di bawah kurva P–V: gas memuai berarti W positif, dimampatkan berarti W negatif. <b>Langkah:</b> tentukan tanda dahulu: Q masuk +, Q keluar −; W oleh gas +, W pada gas −; ΔU naik jika T naik. <b>Jebakan:</b> pada siklus searah jarum jam W positif dan ΔU siklus = 0, sehingga Q total = W total.","ΔU = Q − W — Hukum I Termodinamika ; Q = ΔU + W — bentuk lain ; W = P ΔV — tekanan tetap ; W = ∫P dV — luas di bawah kurva P–V ; W = ∮P dV — luas siklus (searah jarum jam: positif) ; ΔU = 0 — pada satu siklus penuh (energi dalam kembali ke nilai awal)",["piston","pvarea"]],
["5.9 Proses-proses termodinamika pada gas ideal","<b>Konsep:</b> Isobarik (P tetap): kalor dipakai untuk usaha dan menaikkan U. Isokhorik (V tetap): W = 0 sehingga semua kalor menjadi ΔU. Isotermal (T tetap): ΔU = 0 sehingga Q = W. Adiabatik (Q = 0): usaha berasal dari energi dalam, jadi ekspansi mendinginkan gas. Pada diagram P–V, adiabatik lebih curam daripada isotermal. <b>Langkah:</b> baca arah proses di diagram untuk menentukan tanda W, ΔU, Q. <b>Jebakan:</b> ΔU hanya bergantung ΔT, bukan jenis prosesnya; pada isotermal ΔU selalu nol walau ada usaha.","W = P ΔV = nR ΔT — isobarik ; Q = n C_p ΔT — isobarik (C_p = 5R/2) ; W = 0, Q = ΔU = n C_v ΔT — isokhorik (C_v = 3R/2) ; ΔU = 0, W = Q = nRT ln(V₂/V₁) — isotermal ; Q = 0, W = −ΔU — adiabatik ; PV^γ = C — adiabatik (C tetap) ; TV^(γ−1) = C — adiabatik ; C_p − C_v = R, γ = C_p/C_v — monoatomik γ = 5/3 ; ΔU = (3/2) n R ΔT — monoatomik, semua proses",["proses"]],
["5.10 Hukum II, mesin kalor & mesin pendingin","<b>Konsep:</b> Hukum II: kalor tidak mengalir spontan dari dingin ke panas, dan tidak ada mesin yang mengubah seluruh kalor menjadi usaha (η < 100%). Mesin kalor menyerap Q₁ dari suhu tinggi, mengubah sebagian menjadi W, dan membuang Q₂ ke suhu rendah. Mesin Carnot adalah mesin ideal dengan efisiensi maksimum yang hanya bergantung T₁ dan T₂. Mesin pendingin bekerja sebaliknya: dengan usaha W ia memindahkan Q₂ dari dalam yang dingin ke luar yang panas. <b>Langkah:</b> untuk menaikkan efisiensi, ubah satu suhu saja lalu hitung suhu barunya dari η′. <b>Jebakan:</b> suhu pada rumus Carnot harus dalam kelvin.","η = W/Q₁ × 100% — efisiensi mesin ; W = Q₁ − Q₂ — usaha per siklus ; η = 1 − T₂/T₁ — efisiensi mesin Carnot (maksimum) ; Q₂/Q₁ = T₂/T₁ — mesin Carnot ; T₁′ = T₂/(1 − η′) — menaikkan T₁ (T₂ tetap) ; T₂′ = (1 − η′)T₁ — menurunkan T₂ (T₁ tetap) ; COP = Q₂/W = T₂/(T₁ − T₂) — pendingin Carnot",["carnot","pendingin","siklus"]]]},
{n:"Kelistrikan",e:"⚡",c:"#10b981",z:"",i:"Seri: arus sama. Paralel: tegangan sama. Selebihnya: hukum Ohm dan kekekalan energi.",S:[
["6.1 Muatan listrik","<b>Konsep:</b> Benda bermuatan negatif kelebihan elektron, positif kekurangan elektron; hanya elektron yang berpindah. Sejenis tolak-menolak, berlawanan tarik-menarik. Muatan dapat dipindah dengan gosokan, sentuhan (konduksi, muatan akhir sejenis), atau induksi (tanpa kontak, muatan akhir berlawanan jenis lalu dibumikan). Muatan terkuantisasi: selalu kelipatan bulat dari e. <b>Langkah:</b> pada induksi, sisi bola yang dekat batang bermuatan lawan jenis. <b>Jebakan:</b> benda netral pun tertarik oleh benda bermuatan (akibat polarisasi). Jadi tarik-menarik belum tentu berlawanan muatan, tetapi tolak-menolak pasti sejenis.","e = 1,6×10⁻¹⁹ C — muatan elementer ; Q = n e — muatan terkuantisasi ; Q′ = (Q₁ + Q₂)/2 — dua konduktor identik disentuhkan ; 1 μC = 10⁻⁶ C — konversi ; 1 nC = 10⁻⁹ C — konversi ; q₁q₂ > 0 — sejenis: tolak-menolak ; q₁q₂ < 0 — berlawanan jenis: tarik-menarik",["muatan"]],
["6.2 Hukum Coulomb","<b>Konsep:</b> Gaya antara dua muatan titik sebanding dengan hasil kali muatan dan berbanding terbalik dengan kuadrat jarak; arahnya sepanjang garis penghubung. Untuk lebih dari dua muatan, jumlahkan gaya sebagai vektor. <b>Langkah:</b> gambar arah tiap gaya (tarik atau tolak) lebih dahulu, hitung besarnya dengan nilai mutlak muatan, baru jumlahkan. <b>Jebakan:</b> jarak dua kali lipat membuat gaya menjadi ¼, bukan ½. Pada dua muatan sejenis, titik di mana gaya pada muatan uji nol terletak lebih dekat ke muatan yang lebih kecil.","F = k Q₁Q₂ / r² — hukum Coulomb ; k = 9×10⁹ N·m²/C² = 1/(4πε₀) — tetapan ; ε₀ = 8,85×10⁻¹² C²/N·m² — permitivitas ruang hampa ; F₂/F₁ = (r₁/r₂)² — perubahan jarak ; F = √(F₁² + F₂² + 2F₁F₂ cosθ) — resultan dua gaya ; x = d√Q₁ / (√Q₁ + √Q₂) — titik gaya nol, dari Q₁",["coulomb","seimbang"]],
["6.3 Medan listrik","<b>Konsep:</b> Medan listrik adalah daerah pengaruh muatan, diukur sebagai gaya per satuan muatan uji positif. Garis medan keluar dari muatan positif dan masuk ke muatan negatif; makin rapat makin kuat dan tidak pernah berpotongan. Di dalam konduktor E = 0. Antara dua keping sejajar medan seragam, sehingga muatan di dalamnya mengalami gaya tetap dan bergerak dengan percepatan tetap. <b>Langkah:</b> E total dijumlahkan sebagai vektor; di antara dua muatan sejenis medannya saling melawan. <b>Jebakan:</b> pada muatan negatif, arah gaya berlawanan dengan arah E.","E = F/q — definisi medan ; E = k Q / r² — muatan titik ; E = V/d — keping sejajar (seragam) ; F = q E — gaya pada muatan ; a = q E / m — percepatan muatan ; E = σ/ε₀ — rapat muatan keping ; E_in = 0 — medan di dalam konduktor (keseimbangan elektrostatik)",["medan","keping"]],
["6.4 Potensial listrik & energi potensial","<b>Konsep:</b> Potensial listrik adalah energi potensial per satuan muatan dan merupakan <i>skalar</i>. Muatan positif membuat V positif yang menurun menuju nol di tempat jauh; muatan negatif membuat V negatif. Usaha memindahkan muatan hanya bergantung beda potensial, bukan lintasan. Muatan yang dipercepat dari diam melalui beda potensial V memperoleh energi kinetik qV. <b>Langkah:</b> jumlahkan potensial dengan tanda secara aljabar, bukan vektor. <b>Jebakan:</b> di titik tengah dua muatan sama besar berlawanan tanda, V = 0 tetapi E tidak nol.","V = k Q / r — potensial muatan titik ; E_p = q V = k Q q / r — energi potensial ; W = q ΔV = q (V₂ − V₁) — usaha pindah muatan ; V = ΣVᵢ — potensial total (skalar, tanda ikut) ; ½ m v² = q V — muatan dipercepat dari diam ; V = E d — medan seragam",["pot"]],
["6.5 Kapasitor","<b>Konsep:</b> Kapasitor menyimpan muatan dan energi di antara dua keping. Kapasitasnya makin besar bila luas keping besar, jarak kecil, atau diisi dielektrik. Tetap terhubung baterai: V tetap, sisipan dielektrik menaikkan Q dan W. Dilepas dari baterai: Q tetap, sisipan dielektrik menurunkan V dan W. Seri: muatan sama, tegangan terbagi. Paralel: tegangan sama. <b>Langkah:</b> tentukan dahulu besaran mana yang tetap (V atau Q). <b>Jebakan:</b> kapasitor disusun seri dijumlahkan dengan kebalikan (seperti hambatan paralel), disusun paralel dijumlahkan langsung.","C = Q/V — kapasitas ; C = κ ε₀ A / d — keping sejajar ; W = ½ C V² = ½ Q V = Q²/2C — energi tersimpan ; 1/C_s = 1/C₁ + 1/C₂ — seri (Q sama) ; C_p = C₁ + C₂ — paralel (V sama) ; terhubung baterai: Q′ = κQ, W′ = κW — V tetap ; dilepas: V′ = V/κ, W′ = W/κ — Q tetap",["kapasitor","kapseri"]],
["6.6 Arus listrik & hambatan kawat","<b>Konsep:</b> Arus adalah muatan yang mengalir tiap detik. Arah arus konvensional dari kutub positif ke negatif, berlawanan dengan arah gerak elektron. Hambatan kawat naik dengan panjang, turun dengan luas penampang, dan bergantung bahan (hambat jenis). Pada logam, suhu naik membuat hambatan naik. <b>Langkah:</b> jika kawat ditarik hingga n kali lebih panjang (volume tetap), luasnya menjadi 1/n, sehingga R naik n². <b>Jebakan:</b> diameter dua kali lipat berarti luas empat kali lipat, sehingga R turun menjadi ¼.","I = Q/t — kuat arus (A = C/s) ; Q = n e — jumlah elektron yang lewat ; R = ρ L / A — hambatan kawat ; A = ¼ π d² — luas penampang ; R′ = n² R — kawat ditarik n kali lebih panjang ; R_T = R₀ (1 + αΔT) — pengaruh suhu",["kawat"]],
["6.7 Hukum Ohm & grafik V–I","<b>Konsep:</b> Hukum Ohm: pada suhu tetap, tegangan sebanding dengan arus; konstantanya adalah hambatan. Grafik V–I berupa garis lurus (komponen ohmik) dan kemiringannya sama dengan R. Lampu pijar tidak ohmik: hambatannya naik saat filamen memanas sehingga grafiknya melengkung. <b>Langkah:</b> pada kurva non-ohmik, R = V/I di titik tertentu, bukan kemiringan garis singgungnya. <b>Jebakan:</b> pada grafik I–V (arus di sumbu tegak), kemiringan adalah 1/R, bukan R.","V = I R — hukum Ohm ; R = ΔV/ΔI — kemiringan grafik V–I (komponen ohmik) ; ΔI/ΔV = 1/R — kemiringan grafik I–V (sumbu dibalik) ; V/I = R — ohmik: R tetap, grafik V–I garis lurus ; V/I = R(I) — non-ohmik: R berubah, grafik melengkung",["ohm"]],
["6.8 Rangkaian seri, paralel & jembatan Wheatstone","<b>Konsep:</b> Seri: satu jalur, arus sama, tegangan terbagi sebanding R. Paralel: bercabang, tegangan sama, arus terbagi berbanding terbalik dengan R. Hambatan paralel selalu lebih kecil dari yang terkecil. Pada rangkaian campuran, sederhanakan dari bagian terdalam. Jembatan Wheatstone seimbang bila R₁R₄ = R₂R₃, saat itu tidak ada arus di galvanometer. <b>Jebakan:</b> lampu seri: R terbesar paling terang (P = I²R). Lampu paralel: R terkecil paling terang (P = V²/R).","R_s = R₁ + R₂ + … — seri ; 1/R_p = 1/R₁ + 1/R₂ + … — paralel ; R_p = R₁R₂ / (R₁ + R₂) — dua resistor paralel ; R_p = R/n — n resistor sama, paralel ; R₁ R₄ = R₂ R₃ — Wheatstone seimbang ; V₁ = V R₁/(R₁ + R₂) — pembagi tegangan (seri) ; I₁ = I R₂/(R₁ + R₂) — pembagi arus (paralel)",["ckt","jembatan"]],
["6.9 GGL & hambatan dalam","<b>Konsep:</b> Sumber memiliki GGL ε (energi per muatan) dan hambatan dalam r. Saat arus mengalir, sebagian tegangan hilang di dalam sumber sehingga tegangan jepit V = ε − Ir lebih kecil dari ε. Tanpa arus, V = ε. Bila terhubung singkat, arus maksimum = ε/r. Baterai seri: ε dan r dijumlahkan; baterai identik paralel: ε tetap dan r dibagi n. <b>Langkah:</b> hitung I = ε/(R + r) lebih dahulu. <b>Jebakan:</b> voltmeter pada baterai tanpa beban membaca ε, bukan tegangan jepit.","I = ε / (R + r) — arus rangkaian ; V = ε − I r = I R — tegangan jepit ; ε = I (R + r) — GGL ; n baterai seri: ε_tot = nε, r_tot = nr — seri ; n baterai paralel: ε_tot = ε, r_tot = r/n — paralel ; I_maks = ε / r — hubung singkat ; P_r = I²r — daya hilang di hambatan dalam",["ggl"]],
["6.10 Hukum Kirchhoff","<b>Konsep:</b> Hukum I (titik cabang): arus masuk sama dengan arus keluar (kekekalan muatan). Hukum II (loop): jumlah beda potensial sepanjang loop tertutup nol (kekekalan energi). <b>Langkah:</b> (1) tentukan arah arus tiap cabang sembarang, (2) pilih arah loop, (3) ε bernilai positif bila loop melewatinya dari kutub − ke +, dan IR bernilai negatif bila loop searah arus, (4) selesaikan persamaan. Hasil arus negatif berarti arah sebenarnya berlawanan. <b>Jebakan:</b> tanda harus konsisten di seluruh loop.","ΣI_in = ΣI_out — Kirchhoff I (titik cabang) ; ΣE + ΣI R = 0 — Kirchhoff II (loop) ; I₃ = I₁ + I₂ — dua baterai, satu titik cabang ; V_N = (ε₁/R₁ + ε₂/R₂)/(1/R₁ + 1/R₂ + 1/R₃) — tegangan titik cabang (cara cepat) ; I < 0 — arah sebenarnya terbalik dari pemisalan",["kirchhoff"]],
["6.11 Energi & daya listrik","<b>Konsep:</b> Energi listrik W = VIt, daya adalah laju energinya. Lampu bertuliskan 60 W/220 V mengonsumsi 60 W hanya pada 220 V; hambatannya tetap R = V²/P. Pada tegangan lain, daya berubah sebanding kuadrat tegangan. Tagihan listrik dihitung dalam kWh. <b>Langkah:</b> cari R dari spesifikasi lebih dahulu, lalu hitung daya baru. <b>Jebakan:</b> 1 kWh = 3,6×10⁶ J. Tegangan turun menjadi setengahnya membuat daya lampu turun menjadi ¼, bukan ½.","W = V I t = I² R t = (V²/R) t — energi ; P = V I = I² R = V²/R — daya ; R = V² / P — hambatan dari spesifikasi ; P′ = (V′/V)² P — tegangan berbeda ; 1 kWh = 3,6×10⁶ J — satuan tagihan ; B = W·τ — biaya listrik (W dalam kWh, τ tarif per kWh) ; Q = I² R t — kalor di hambatan ; η = P_out/P_in — efisiensi (daya berguna ÷ daya total)",["lampu"]],
["6.12 Alat ukur listrik","<b>Konsep:</b> Amperemeter dipasang seri dan harus berhambatan sangat kecil; voltmeter dipasang paralel dan harus berhambatan sangat besar. Untuk memperbesar batas ukur, amperemeter diberi hambatan shunt paralel, voltmeter diberi hambatan multiplier seri. Nilai yang terbaca = (skala terbaca / skala maksimum) × batas ukur. <b>Langkah:</b> pilih batas ukur, baca jarum, lalu kalikan. <b>Jebakan:</b> amperemeter yang dipasang paralel dengan sumber menyebabkan korsleting.","R_sh = R_a/(n − 1) = R_a I_a/(I − I_a) — shunt (batas × n) ; R_m = (n − 1) R_v — multiplier (batas × n) ; X = (n/n_m) × X_b — nilai terbaca (n skala, n_m skala maksimum, X_b batas ukur) ; R_A ≈ 0 — amperemeter dipasang seri (hambatan sangat kecil) ; R_V → ∞ — voltmeter dipasang paralel (hambatan sangat besar)",["alat"]],
["6.13 Keselamatan listrik","<b>Konsep:</b> Arus berlebih menimbulkan kalor Q = I²Rt yang bisa memicu kebakaran. Sekering atau MCB memutus rangkaian bila arus melewati batasnya. Korsleting membuat hambatan sangat kecil sehingga arus sangat besar. Kabel arde mengalirkan arus bocor ke bumi. Peralatan rumah dipasang paralel, jadi arus totalnya adalah jumlah arus tiap alat. <b>Langkah:</b> I_total = ΣP / V, lalu bandingkan dengan kapasitas MCB. <b>Jebakan:</b> jangan mengganti sekering dengan kawat biasa atau yang lebih besar; kabel terlalu kecil menjadi panas.","I = P_t / V — arus total (P_t daya total beban) ; P_t = ΣPᵢ — daya total alat-alat paralel ; I ≤ I_MCB — syarat aman ; Q = I² R t — kalor pada kabel ; I = V / R, R ≈ 0 — arus saat korsleting sangat besar",["aman"]]]}];
