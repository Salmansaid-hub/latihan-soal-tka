["1.1 Hakikat, Pembagian & Prinsip Ilmu Ekonomi","<b>Konsep:</b> Kata ekonomi berasal dari bahasa Yunani <i>oikonomia</i> (<i>oikos</i> = rumah tangga, <i>nomos</i> = aturan). Menurut Richard G. Lipsey dan Paul A. Samuelson, ilmu ekonomi mempelajari bagaimana masyarakat mengalokasikan <b>sumber daya yang terbatas</b> (langka) untuk memenuhi <b>kebutuhan yang tidak terbatas</b> secara rasional. Alfred W. Stonier & Douglas C. Hague membagi ilmu ekonomi menjadi tiga: (1) <b>Ekonomi Deskriptif</b> (mengumpulkan fakta/data apa adanya, misalnya data BPS angka inflasi 2025), (2) <b>Teori Ekonomi</b> yang terbagi atas <i>Ekonomi Mikro</i> (perilaku individu, rumah tangga, perusahaan, harga satu komoditas) dan <i>Ekonomi Makro</i> (agregat nasional: PDB, inflasi, pengangguran, kurs), serta (3) <b>Ekonomi Terapan</b> (penerapan teori untuk kebijakan praktis, seperti ekonomi moneter atau ekonomi syariah). <b>Poin TKA:</b> Bedakan pernyataan <b>ekonomi positif</b> (fakta objektif sebab-akibat yang dapat diuji benar/salahnya, menggunakan kata 'adalah/akan menyebabkan') dengan <b>ekonomi normatif</b> (pertimbangan nilai/etika tentang apa yang <i>seharusnya</i> terjadi). Selain itu, <b>prinsip ekonomi</b> adalah panduan bertindak efisien: mencapai hasil tertentu dengan pengorbanan sekecil-kecilnya, atau dengan pengorbanan tertentu meraih hasil sebesar-besarnya. <b>Jebakan:</b> Jangan menyamakan 'prinsip ekonomi' dengan 'motif ekonomi' (alasan pendorong seseorang bertindak, baik motif intrinsik maupun ekstrinsik seperti mencari laba, kekuasaan, penghargaan, atau sosial).","Rasio Efisiensi = Hasil (Output) / Pengorbanan (Input) ≥ 1 ; Ekonomi Positif = fakta objektif & sebab-akibat ('apa yang terjadi') ; Ekonomi Normatif = nilai subjektif & rekomendasi ('apa yang seharusnya') ; Mikro = harga pasar, elastisitas, perilaku konsumen & produsen ; Makro = pendapatan nasional, inflasi, pengangguran, neraca pembayaran",["cabang"]],
["1.2 Kelangkaan (Scarcity), Kebutuhan & Skala Prioritas","<b>Konsep:</b> Inti masalah ekonomi adalah <b>kelangkaan (scarcity)</b>: kondisi ketika jumlah alat pemuas kebutuhan lebih sedikit dibandingkan kebutuhan manusia yang terus berkembang. Kelangkaan disebabkan oleh: (1) keterbatasan sumber daya alam dan faktor produksi, (2) pertumbuhan penduduk yang lebih cepat (deret ukur menurut Malthus) dibanding produksi pangan (deret hitung), (3) keterbatasan kemampuan produksi dan penguasaan teknologi, (4) kerusakan lingkungan/bencana alam, serta (5) sifat manusia yang tidak pernah puas. <b>Langkah:</b> Untuk mengatasi kelangkaan, konsumen menyusun <b>skala prioritas</b> berdasarkan tingkat urgensi dan kepentingan: Kuadran I (<i>penting & mendesak</i>: kebutuhan pokok/darurat), Kuadran II (<i>penting & kurang mendesak</i>: tabungan pendidikan, investasi), Kuadran III (<i>kurang penting tapi mendesak</i>: ajakan mendadak), dan Kuadran IV (<i>tidak penting & tidak mendesak</i>: hiburan mewah). <b>Poin TKA:</b> Kenali klasifikasi barang menurut cara memperolehnya (<b>barang ekonomi</b> memerlukan pengorbanan, <b>barang bebas</b> melimpah tanpa harga, <b>barang illith</b> merugikan jika berlebihan seperti air saat banjir), menurut hubungannya (<b>substitusi</b> saling menggantikan vs <b>komplementer</b> saling melengkapi), dan menurut prosesnya (barang mentah, setengah jadi, barang jadi). <b>Jebakan:</b> Sesuatu disebut 'langka' dalam ilmu ekonomi bukan semata karena jumlah fisiknya sedikit, melainkan karena <i>tidak cukup dibanding jumlah yang diinginkan pada harga nol</i>.","Kelangkaan: Kebutuhan (Tak Terbatas) > Sumber Daya (Terbatas) ; Barang Ekonomi: jumlah terbatas & butuh pengorbanan (P > 0) ; Barang Substitusi: P_A naik → Q_B naik (saling mengganti) ; Barang Komplementer: P_A naik → Q_B turun (saling melengkapi) ; Aturan Anggaran 50/30/20: 50% Kebutuhan Pokok, 30% Keinginan, 20% Tabungan/Investasi",["prioritas"]],
["1.3 Biaya Peluang (Opportunity Cost) & Kurva PPF","<b>Konsep:</b> Karena sumber daya langka, setiap pilihan selalu mengorbankan alternatif lain. <b>Biaya peluang (opportunity cost)</b> adalah nilai dari <i>satu alternatif terbaik yang dikorbankan</i> ketika seseorang atau perusahaan mengambil suatu keputusan. Dalam dunia usaha, dibedakan antara <b>biaya eksplisit</b> (pengeluaran uang nyata untuk bahan baku, gaji, sewa) dan <b>biaya implisit</b> (nilai peluang yang hilang, seperti gaji yang dilepas pemilik karena mengelola bisnisnya sendiri). <b>Langkah:</b> (1) Jika memilih satu dari banyak alternatif kerja, biaya peluangnya adalah <b>satu</b> alternatif dengan nilai tertinggi yang tidak dipilih (bukan jumlah semua alternatif). (2) Jika beralih usaha, hitung: Laba Akuntansi = Pendapatan − Biaya Eksplisit; sedangkan Laba Ekonomi = Pendapatan − (Biaya Eksplisit + Biaya Implisit). <b>Poin TKA:</b> Pada <b>Kurva Kemungkinan Produksi (PPF / Production Possibility Frontier)</b>, titik <i>pada kurva</i> menunjukkan penggunaan sumber daya secara efisien penuh (full employment); titik <i>di dalam kurva</i> tidak efisien (ada pengangguran sumber daya); titik <i>di luar kurva</i> belum terjangkau dengan sumber daya saat ini. Bentuk PPF cekung ke titik asal karena <b>hukum biaya peluang yang meningkat (law of increasing opportunity cost)</b>. <b>Jebakan:</b> Jangan menjumlahkan seluruh gaji dari semua tawaran pekerjaan yang ditolak—hanya ambil satu nilai tertinggi yang dikorbankan!","Biaya Peluang = Nilai 1 alternatif terbaik yang dikorbankan ; Biaya Ekonomi = Biaya Eksplisit + Biaya Implisit ; Laba Akuntansi = TR − Biaya Eksplisit ; Laba Ekonomi = TR − (Biaya Eksplisit + Biaya Implisit) ; Kemiringan PPF = |ΔY / ΔX| — biaya peluang memproduksi 1 unit X tambahan dalam satuan Y",["ppf"]],
["1.4 Masalah Pokok Ekonomi & Sistem Ekonomi","<b>Konsep:</b> Keterbatasan sumber daya melahirkan masalah pokok ekonomi. Aliran <b>Klasik</b> (Adam Smith, David Ricardo, J.B. Say) merumuskannya menjadi tiga: <b>Produksi</b> (bagaimana menghasilkan barang), <b>Distribusi</b> (bagaimana menyalurkan ke konsumen), dan <b>Konsumsi</b> (apakah barang terserap masyarakat). Aliran <b>Modern</b> (Paul A. Samuelson) mempertajamnya menjadi tiga pertanyaan fundamental: (1) <b>What</b> (barang dan jasa apa yang akan diproduksi dan berapa jumlahnya?), (2) <b>How</b> (bagaimana cara memproduksinya: padat karya atau padat modal, dengan teknologi apa?), dan (3) <b>For Whom</b> (untuk siapa barang diproduksi atau bagaimana mendistribusikan hasilnya?). <b>Poin TKA:</b> Cara suatu negara menjawab <i>What, How, For Whom</i> ditentukan oleh <b>Sistem Ekonomi</b> yang dianut: (a) <b>Tradisional</b> (kebiasaan turun-temurun, barter), (b) <b>Komando/Terpusat/Sosialis</b> (pemerintah pusat menguasai seluruh alat produksi, distribusi merata tetapi mematikan kreativitas individu), (c) <b>Pasar/Liberal/Kapitalis</b> (mekanisme harga bebas oleh swasta, inovasi tinggi tetapi rawan monopoli dan ketimpangan), serta (d) <b>Campuran</b> dan <b>Demokrasi Ekonomi Pancasila</b> di Indonesia (Pasal 33 UUD 1945: berasaskan kekeluargaan, cabang produksi penting dikuasai negara, swasta dan koperasi tumbuh berdampingan). <b>Jebakan:</b> Pertanyaan 'menggunakan mesin otomatis atau tenaga manusia' adalah masalah <i>How</i>, bukan <i>What</i> atau <i>For Whom</i>.","Klasik: Produksi → Distribusi → Konsumsi ; Modern: What (apa & berapa) · How (teknik produksi) · For Whom (sasaran & distribusi) ; Komando: Negara dominan, hak milik pribadi dibatasi ; Pasar Bebas: Mekanisme harga (invisible hand), hak milik swasta penuh ; Demokrasi Ekonomi (Pasal 33 UUD 1945): Koperasi, BUMN, dan BUMS bersinergi",["sistem"]],
["1.5 Kegiatan & Pelaku Ekonomi (Circular Flow Diagram)","<b>Konsep:</b> Kegiatan ekonomi berputar antara empat pelaku utama: (1) <b>Rumah Tangga Konsumen (RTK)</b> sebagai pemilik faktor produksi (alam/tanah, tenaga kerja, modal, keahlian/skill) sekaligus konsumen barang/jasa; (2) <b>Rumah Tangga Produsen (RTP/Perusahaan)</b> yang mengolah faktor produksi di <i>pasar input</i> dan menjual barang/jasa di <i>pasar output</i>; (3) <b>Rumah Tangga Negara (Pemerintah)</b> sebagai pengatur, konsumen, dan produsen barang publik yang memungut pajak serta memberi subsidi/fasilitas; serta (4) <b>Masyarakat Luar Negeri (MLN)</b> melalui ekspor dan impor. <b>Langkah membaca Circular Flow:</b> Perhatikan arah panah dan pasar yang dilewati! Di <b>Pasar Faktor Produksi (Input)</b>, RTK menyerahkan tanah, tenaga kerja, modal, dan kewirausahaan kepada RTP; sebagai timbal baliknya, RTP membayar balas jasa berupa <b>sewa (rent)</b> untuk tanah, <b>upah (wage)</b> untuk tenaga kerja, <b>bunga (interest)</b> untuk modal, dan <b>laba (profit)</b> untuk kewirausahaan. Di <b>Pasar Barang/Jasa (Output)</b>, RTP menyerahkan barang/jasa ke RTK, dan RTK membayar uang pembelian ke RTP. <b>Jebakan:</b> Jangan tertukar antara pemilik faktor produksi (RTK) dan pengguna faktor produksi (RTP). Pajak mengalir dari RTK & RTP ke Pemerintah, sedangkan subsidi dan layanan publik mengalir dari Pemerintah ke RTK & RTP.","2 Sektor: RTK ↔ RTP (tanpa campur tangan pemerintah & luar negeri) ; 3 Sektor: RTK ↔ RTP ↔ Pemerintah (ada pajak T dan belanja G / subsidi) ; 4 Sektor (Terbuka): + Masyarakat Luar Negeri (Ekspor X & Impor M) ; Balas Jasa Input: Tanah → Sewa (r) · Tenaga Kerja → Upah (w) · Modal → Bunga (i) · Skill → Laba (π)",["circular"]],
["1.6 Perilaku Konsumen (Utilitas) & Perilaku Produsen (Biaya & Laba)","<b>Konsep:</b> Konsumen bertujuan memaksimumkan kepuasan (<i>utility</i>). Pendekatan <b>Kardinal</b> menganggap kepuasan dapat diukur dengan angka (<i>util</i>): <b>Hukum Gossen I</b> (<i>Law of Diminishing Marginal Utility</i>) menyatakan bahwa jika konsumsi suatu barang terus ditambah secara terus-menerus, tambahan kepuasan (<b>Marginal Utility / MU</b>) akan makin menurun hingga mencapai nol (titik jenuh/<i>Titik Satiety</i> saat Total Utility / TU maksimum) lalu menjadi negatif. <b>Hukum Gossen II</b> menyatakan konsumen mencapai kepuasan maksimum saat mengonsumsi berbagai barang sedemikian rupa sehingga rasio MU terhadap harga tiap barang sama besar. Pendekatan <b>Ordinal</b> menggunakan <i>Kurva Indiferensi</i> (kombinasi dua barang yang memberi kepuasan sama) dan <i>Garis Anggaran (Budget Line)</i>. <b>Langkah Produksi & Biaya:</b> Pada jangka pendek, produsen menghadapi <b>Law of Diminishing Returns</b> (David Ricardo): penambahan tenaga kerja mula-mula menaikkan <i>Marginal Product (MP)</i>, tetapi setelah titik tertentu MP menurun. Dalam biaya produksi, bedakan <b>Biaya Tetap (FC)</b> yang tidak bergantung jumlah output dan <b>Biaya Variabel (VC)</b> yang berubah mengikuti output. <b>Jebakan:</b> Laba maksimum tercapai saat <b>MR = MC</b> (Marginal Revenue = Marginal Cost), <i>bukan</i> saat TR maksimum atau AC minimum!","MU = ΔTU / ΔQ — tambahan kepuasan per unit ; Syarat Kepuasan Maksimum (Gossen II): MU_x/P_x = MU_y/P_y ; MP = ΔTP / ΔL — tambahan output per tenaga kerja ; TC = FC + VC — biaya total ; AC = TC/Q = AFC + AVC — biaya rata-rata ; MC = ΔTC / ΔQ — biaya marjinal ; TR = P × Q — penerimaan total ; π = TR − TC — laba maksimum saat MR = MC",["gossen"]]]},

{n:"Ekonomi Mikro & Pasar",e:"📈",c:"#e5484d",z:"",i:"Menganalisis permintaan, penawaran, keseimbangan pasar, efek pajak & subsidi, elastisitas, hingga struktur pasar.",S:[
["2.1 Permintaan (Demand): Hukum, Fungsi & Pergeseran Kurva","<b>Konsep:</b> <b>Permintaan (demand)</b> adalah jumlah barang atau jasa yang ingin dan mampu dibeli konsumen pada berbagai tingkat harga dalam periode tertentu (<i>permintaan efektif</i> didukung daya beli, berbeda dengan <i>permintaan absolut</i> yang hanya berupa keinginan). <b>Hukum Permintaan:</b> Dengan asumsi <i>ceteris paribus</i> (faktor-faktor selain harga barang itu sendiri dianggap tetap), jika harga naik maka jumlah barang yang diminta turun (P↑ → Qd↓), dan sebaliknya. Itulah sebabnya kurva permintaan berslope <b>negatif</b> (turun dari kiri atas ke kanan bawah) karena efek substitusi dan efek pendapatan. <b>Langkah:</b> Gunakan rumus persamaan garis lurus untuk menyusun fungsi permintaan dari dua titik (P₁, Q₁) dan (P₂, Q₂). <b>Poin TKA:</b> Bedakan secara tegas antara <b>pergerakan sepanjang kurva (movement along the curve)</b> yang semata-mata disebabkan oleh perubahan harga barang itu sendiri, dengan <b>pergeseran kurva (shift of the curve)</b> ke kanan (permintaan naik) atau ke kiri (permintaan turun) akibat perubahan faktor non-harga: pendapatan konsumen, harga barang substitusi/komplementer, selera, jumlah penduduk, dan ekspektasi harga masa depan. <b>Jebakan:</b> Untuk <b>barang inferior</b> (seperti gaplek atau pakaian bekas), kenaikan pendapatan justru menggeser kurva permintaan ke kiri!","Fungsi Permintaan: Q_d = a − bP atau P_d = a − bQ (gradien negatif) ; Menyusun Fungsi: (P − P₁)/(P₂ − P₁) = (Q − Q₁)/(Q₂ − Q₁) ; Gradien: b = ΔQ / ΔP ; Barang Normal: Pendapatan ↑ → Kurva D geser ke kanan ; Barang Inferior: Pendapatan ↑ → Kurva D geser ke kiri ; Pengecualian Hukum Permintaan: Barang Giffen (spekulasi/pokok inferior) & Barang Veblen (prestise/gengsi)",["demand"]],
["2.2 Penawaran (Supply): Hukum, Fungsi & Pergeseran Kurva","<b>Konsep:</b> <b>Penawaran (supply)</b> adalah keseluruhan jumlah barang atau jasa yang bersedia ditawarkan oleh produsen pada berbagai tingkat harga dalam periode tertentu. <b>Hukum Penawaran:</b> Dengan asumsi <i>ceteris paribus</i>, jika harga barang naik maka jumlah barang yang ditawarkan akan naik (P↑ → Qs↑), dan jika harga turun maka jumlah yang ditawarkan turun. Karena hubungan harga dan kuantitas searah (positif), kurva penawaran berslope <b>positif</b> (naik dari kiri bawah ke kanan atas). <b>Langkah:</b> Dalam fungsi penawaran Qs = a + bP atau Ps = a + bQ, koefisien b di depan P selalu bertanda <b>positif</b>. Saat Q = 0, nilai P adalah harga terendah di mana produsen mulai bersedia menawarkan barang. <b>Poin TKA:</b> Pergerakan di sepanjang kurva penawaran terjadi bila harga barang itu sendiri berubah. Sebaliknya, kurva penawaran <b>bergeser ke kanan</b> (penawaran bertambah pada setiap harga) bila: biaya produksi/harga bahan baku turun, teknologi produksi makin canggih, pemerintah memberikan subsidi, pajak diturunkan, atau jumlah produsen bertambah. Kurva <b>bergeser ke kiri</b> bila biaya input naik atau pajak dinaikkan. <b>Jebakan:</b> Jangan tertukar antara 'jumlah yang ditawarkan naik' (gerakan titik sepanjang kurva S karena P naik) dengan 'penawaran naik' (kurva S bergeser ke kanan karena faktor non-harga).","Fungsi Penawaran: Q_s = a + bP atau P_s = a + bQ (koefisien b > 0) ; Menyusun Fungsi: (P − P₁)/(P₂ − P₁) = (Q − Q₁)/(Q₂ − Q₁) ; Biaya Bahan Baku ↓ / Teknologi ↑ / Subsidi ↑ → Kurva S geser ke kanan ; Biaya Bahan Baku ↑ / Pajak ↑ → Kurva S geser ke kiri",["supply"]],
["2.3 Keseimbangan Pasar, Surplus & Kebijakan Harga Pemerintah","<b>Konsep:</b> <b>Keseimbangan pasar (market equilibrium)</b> tercapai saat jumlah barang yang diminta sama dengan jumlah yang ditawarkan pada tingkat harga tertentu (Qd = Qs dan Pd = Ps). Pada titik E(Qe, Pe) ini, tidak ada kecenderungan harga untuk berubah. Jika harga pasar berada di atas Pe, terjadi <b>kelebihan penawaran (excess supply / surplus barang)</b> yang mendorong harga turun kembali ke Pe. Jika harga di bawah Pe, terjadi <b>kelebihan permintaan (excess demand / shortage / kelangkaan)</b> yang mendorong harga naik. <b>Langkah Intervensi Harga:</b> Pemerintah kadang menetapkan: (1) <b>Harga Eceran Tertinggi (HET / Ceiling Price)</b> di <i>bawah</i> harga keseimbangan (P_c < Pe) untuk melindungi konsumen (misalnya beras, BBM, obat); dampaknya muncul <i>excess demand</i> sehingga pemerintah harus menggelar operasi pasar/impor agar tidak muncul pasar gelap. (2) <b>Harga Dasar (Floor Price)</b> di <i>atas</i> harga keseimbangan (P_f > Pe) untuk melindungi produsen/petani saat panen raya (misalnya gabah) atau pekerja (upah minimum); dampaknya muncul <i>excess supply</i> yang harus dibeli pemerintah (Bulog). <b>Jebakan:</b> Ceiling price ('atap') efektif justru terletak di <i>bawah</i> titik keseimbangan, sedangkan floor price ('lantai') efektif terletak di <i>atas</i> titik keseimbangan!","Syarat Keseimbangan: Q_d = Q_s atau P_d = P_s → Titik E(Q_e, P_e) ; Excess Supply (Surplus): P > P_e ⇒ Q_s > Q_d ; Excess Demand (Shortage): P < P_e ⇒ Q_d > Q_s ; Surplus Konsumen: CS = ½ × (P_maks − P_e) × Q_e ; Surplus Produsen: PS = ½ × (P_e − P_min) × Q_e ; Ceiling Price efektif: P_c < P_e · Floor Price efektif: P_f > P_e",["eq"]],
["2.4 Pengaruh Pajak & Subsidi terhadap Keseimbangan Pasar","<b>Konsep:</b> Kebijakan pajak dan subsidi mengubah biaya penjualan produsen, sehingga yang bergeser adalah <b>kurva penawaran (S)</b>, sedangkan kurva permintaan (D) tetap. (1) <b>Pajak spesifik sebesar t per unit</b> menambah harga penawaran produsen: kurva S bergeser ke atas/kiri menjadi Ps' = Ps + t (atau jika dalam bentuk Qs = f(P), ganti P menjadi P − t sehingga Qs' = a + b(P − t)). Akibatnya, harga keseimbangan naik (Pe' > Pe) dan kuantitas keseimbangan turun (Qe' < Qe). (2) <b>Subsidi sebesar s per unit</b> menurunkan harga penawaran produsen: kurva S bergeser ke bawah/kanan menjadi Ps' = Ps − s (atau Qs' = a + b(P + s)). Akibatnya, harga keseimbangan turun (Pe' < Pe) dan kuantitas keseimbangan naik (Qe' > Qe). <b>Langkah Menghitung Beban Pajak:</b> Meskipun pajak dipungut dari produsen, sebagian bebannya dialihkan ke konsumen lewat kenaikan harga. Beban pajak per unit yang ditanggung konsumen adalah tk = Pe' − Pe, sedangkan sisanya ditanggung produsen: tp = t − tk. <b>Jebakan:</b> Saat memasukkan pajak ke fungsi Qs = a + bP, jangan menulis Qs' = a + bP + t! Karena P yang diterima produsen berkurang sebesar t, substitusi yang benar adalah <b>Qs' = a + b(P − t)</b>.","Pajak per unit (t): P_s' = P_s + t atau Q_s' = a + b(P − t) ; Subsidi per unit (s): P_s' = P_s − s atau Q_s' = a + b(P + s) ; Pajak Konsumen per unit: t_k = P_e' − P_e · Total T_k = t_k × Q_e' ; Pajak Produsen per unit: t_p = t − t_k · Total T_p = t_p × Q_e' ; Penerimaan Pajak Pemerintah: T_gov = t × Q_e' ; Dinikmati Konsumen (Subsidi): s_k = P_e − P_e' · Produsen: s_p = s − s_k",["pajaksub"]],
["2.5 Elastisitas Permintaan & Penawaran","<b>Konsep:</b> <b>Elastisitas</b> mengukur derajat kepekaan perubahan jumlah barang yang diminta atau ditawarkan akibat perubahan harga (atau pendapatan/harga barang lain) sebesar 1%. Nilai koefisien elastisitas harga permintaan (Ed) selalu diambil nilai mutlaknya (tanda negatif diabaikan karena hanya menunjukkan arah hukum permintaan). Terdapat 5 kategori: (1) <b>Elastis (E > 1)</b>: %ΔQ > %ΔP (barang mewah/banyak substitusi), (2) <b>Inelastis (E < 1)</b>: %ΔQ < %ΔP (kebutuhan pokok seperti beras/garam), (3) <b>Elastis Uniter (E = 1)</b>: %ΔQ = %ΔP, (4) <b>Elastis Sempurna (E = ∞)</b>: kurva mendatar (horizontal), dan (5) <b>Inelastis Sempurna (E = 0)</b>: kurva tegak lurus (vertikal, seperti tanah atau obat penyelamat nyawa). <b>Langkah Strategi Harga & Total Revenue (TR):</b> Ini soal favorit TKA! Jika permintaan <b>elastis (Ed > 1)</b>, konsumen sangat peka harga: untuk menaikkan TR, produsen harus <b>menurunkan harga</b> (diskon/promo meningkatkan volume pembelian secara drastis). Sebaliknya, jika permintaan <b>inelastis (Ed < 1)</b>, menaikkan harga justru menaikkan TR. <b>Jebakan:</b> Rumus Ed = (ΔQ/ΔP) × (P₁/Q₁) menggunakan P₁ dan Q₁ <i>awal</i>, bukan P₂ dan Q₂ akhir! Jika fungsi diketahui, gunakan turunan Q' terhadap P: Ed = |Q'| × (P/Q).","Elastisitas Harga: E = |(%ΔQ) / (%ΔP)| = |(ΔQ / ΔP) × (P₁ / Q₁)| ; Dari Fungsi Q = a − bP: E_d = |−b × (P / Q)| ; E > 1 (Elastis): P turun → TR naik · P naik → TR turun ; E < 1 (Inelastis): P turun → TR turun · P naik → TR naik ; Elastisitas Silang (E_xy): E_xy > 0 (Substitusi) · E_xy < 0 (Komplementer) ; Elastisitas Pendapatan (E_y): E_y > 0 (Normal/Mewah) · E_y < 0 (Inferior)",["elastis"]],
["2.6 Struktur Pasar Output & Pasar Input (Faktor Produksi)","<b>Konsep:</b> Pasar output (barang/jasa) dikelompokkan berdasarkan jumlah penjual, sifat produk, dan hambatan masuk: (1) <b>Pasar Persaingan Sempurna (PPS)</b>: banyak penjual & pembeli, barang <i>homogen</i> (identik, misal beras/gandum), penjual berstatus <i>price taker</i> (pengambil harga pasar sehingga kurva permintaan perusahaan horizontal P = D = AR = MR), bebas keluar-masuk pasar, informasi sempurna. (2) <b>Pasar Monopoli</b>: satu penjual menguasai pasar, tidak ada substitusi dekat, hambatan masuk sangat tinggi (undang-undang, hak paten, penguasaan bahan baku, skala ekonomis), penjual adalah <i>price maker</i>. (3) <b>Pasar Persaingan Monopolistik</b>: banyak penjual dengan produk <i>terdiferensiasi</i> (beda merek, kemasan, rasa: sabun, kopi kekinian, pasta gigi), persaingan iklan sangat kuat. (4) <b>Pasar Oligopoli</b>: hanya beberapa produsen raksasa (semen, operator seluler, otomotif), saling ketergantungan harga tinggi hingga membentuk <i>kurva permintaan patah (kinked demand curve)</i>. <b>Pasar Input:</b> Tempat transaksi faktor produksi: tanah (balas jasa sewa/teori kesuburan David Ricardo & lokasi Von Thunen), tenaga kerja (upah), modal (bunga), dan kewirausahaan (laba). <b>Jebakan:</b> Dalam jangka panjang, perusahaan di Pasar Persaingan Sempurna dan Monopolistik hanya memperoleh <b>laba normal</b> (TR = TC ekonomi) karena bebasnya perusahaan baru masuk pasar.","Syarat Laba Maksimum Semua Pasar: MR = MC ; Pasar Persaingan Sempurna: P = AR = MR (kurva D perusahaan horizontal) ; Pasar Tidak Sempurna (Monopoli/Monopolistik/Oligopoli): P = AR > MR ; Indeks Konsentrasi / Kekuasaan Monopoli (Lerner): L = (P − MC) / P = 1 / |E_d|",["pasar"]]]},

{n:"Makro: PDB & Tenaga Kerja",e:"🏛️",c:"#0ea5e9",z:"",i:"Mengukur kinerja ekonomi nasional dari PDB hingga pendapatan disposabel, pertumbuhan, ketimpangan, serta dinamika ketenagakerjaan.",S:[
["3.1 Konsep Pendapatan Nasional (GDP hingga DI)","<b>Konsep:</b> Pendapatan nasional adalah nilai total barang dan jasa akhir yang dihasilkan suatu negara dalam satu tahun. Enam konsep utamanya berurutan bagai anak tangga: (1) <b>GDP (Gross Domestic Product / PDB)</b>: nilai produksi di <i>dalam batas wilayah domestik</i> suatu negara (WNI + WNA di dalam negeri), menganut asas kewilayahan. (2) <b>GNP (Gross National Product / PNB)</b>: nilai produksi oleh <i>warga negara</i> suatu negara (WNI di dalam negeri + WNI di luar negeri − WNA di dalam negeri), menganut asas kebangsaan. Selisihnya disebut <b>Pendapatan Neto terhadap Luar Negeri (PNLN)</b>. (3) <b>NNP (Net National Product)</b>: GNP dikurangi penyusutan/depresiasi barang modal. (4) <b>NNI (Net National Income)</b>: NNP dikurangi pajak tidak langsung (PPN, cukai) ditambah subsidi. (5) <b>PI (Personal Income)</b>: pendapatan yang secara hak diterima rumah tangga; NNI ditambah <i>transfer payment</i> (pensiun, bansos), dikurangi laba ditahan, pajak perseroan, dan iuran jaminan sosial/asuransi. (6) <b>DI (Disposable Income)</b>: PI dikurangi pajak langsung (PPh); uang siap belanjakan untuk konsumsi (C) atau tabungan (S). <b>Jebakan:</b> Bagi negara berkembang seperti Indonesia, investasi asing di dalam negeri biasanya lebih besar daripada pendapatan warga kita di luar negeri, sehingga <b>GDP > GNP</b>!","GNP = GDP + (Pendapatan WNI di LN − Pendapatan WNA di DN) ; NNP = GNP − Penyusutan (Depresiasi) ; NNI = NNP − Pajak Tidak Langsung + Subsidi ; PI = NNI + Transfer Payment − (Laba Ditahan + Pajak Perseroan + Iuran Sosial) ; DI = PI − Pajak Langsung (PPh) ; Penggunaan DI: DI = Konsumsi (C) + Tabungan (S)",["konsepy"]],
["3.2 Tiga Metode Perhitungan, Fungsi Konsumsi & Multiplier","<b>Konsep:</b> Pendapatan nasional dihitung melalui tiga pendekatan yang secara teoretis menghasilkan nilai setara: (1) <b>Pendekatan Produksi (Nilai Tambah / Value Added)</b>: menjumlahkan <i>nilai tambah</i> (nilai output dikurangi biaya bahan baku/input antara) dari setiap tahap produksi (pertanian, industri, perdagangan, jasa) agar tidak terjadi <b>perhitungan ganda (double counting)</b>. (2) <b>Pendekatan Pendapatan</b>: menjumlahkan seluruh balas jasa pemilik faktor produksi dalam setahun: sewa tanah (r), upah/gaji (w), bunga modal (i), dan laba pengusaha (π). (3) <b>Pendekatan Pengeluaran</b>: menjumlahkan pengeluaran seluruh pelaku ekonomi: Konsumsi rumah tangga (C), Investasi perusahaan (I), Pengeluaran pemerintah (G), dan Ekspor Neto (X − M). <b>Langkah Fungsi Konsumsi & Tabungan:</b> Menurut Keynes, konsumsi merupakan fungsi dari pendapatan: C = a + bY, di mana <i>a</i> adalah konsumsi otonom (konsumsi saat Y = 0) dan <i>b</i> adalah <b>MPC (Marginal Propensity to Consume = ΔC/ΔY)</b>. Karena Y = C + S, maka fungsi tabungan adalah S = −a + (1 − b)Y dengan <b>MPS = 1 − b</b>. <b>Jebakan:</b> Pendapatan impas (<b>Break-Even Income / BEP</b>) terjadi saat seluruh pendapatan habis dikonsumsi (<b>Y = C</b> atau <b>S = 0</b>), yaitu pada Y = a / (1 − b).","Pendekatan Produksi: Y = Σ Nilai Tambah = Σ(Nilai Output − Nilai Input Antara) ; Pendekatan Pendapatan: Y = r + w + i + π ; Pendekatan Pengeluaran: Y = C + I + G + (X − M) ; Fungsi Konsumsi & Tabungan: C = a + bY ⇔ S = −a + (1 − b)Y ; MPC + MPS = 1 · APC + APS = 1 ; Pendapatan Impas (S = 0): Y_BEP = a / (1 − b) = a / MPS ; Angka Pengganda (Multiplier): k_I = 1 / MPS = 1 / (1 − MPC)",["konsumsi"]],
["3.3 Pendapatan Per Kapita & Distribusi Pendapatan (Gini & Lorenz)","<b>Konsep:</b> Kemakmuran rata-rata penduduk diukur dengan <b>Pendapatan Per Kapita (IPC)</b>, yaitu PDB atau PNB dibagi jumlah penduduk pertengahan tahun. Namun IPC tinggi belum menjamin kesejahteraan merata jika <b>distribusi pendapatan</b> timpang. Ketimpangan diukur dengan dua alat utama: (1) <b>Kurva Lorenz</b>, yang memetakan persentase kumulatif penduduk (dari termiskin ke terkaya pada sumbu mendatar) terhadap persentase kumulatif pendapatan yang mereka terima (sumbu tegak). Garis diagonal 45° adalah <i>garis kemerataan sempurna</i>. Makin jauh lengkungan Kurva Lorenz dari garis diagonal, makin timpang distribusi pendapatannya. (2) <b>Koefisien Gini (Indeks Gini)</b>, yaitu rasio luas daerah antara garis diagonal dan Kurva Lorenz dibanding luas segitiga di bawah diagonal, bernilai antara 0 (merata sempurna) hingga 1 (timpang sempurna). <b>Poin TKA:</b> Hafalkan kriteria <b>Bank Dunia</b> yang melihat porsi pendapatan yang diterima oleh <b>40% penduduk termiskin</b>: jika menerima < 12% tergolong ketimpangan <i>tinggi</i>, 12%–17% ketimpangan <i>sedang</i>, dan > 17% ketimpangan <i>rendah</i>. <b>Jebakan:</b> Negara dengan PDB total lebih besar belum tentu memiliki pendapatan per kapita lebih tinggi jika jumlah penduduknya jauh lebih banyak!","Pendapatan Per Kapita (IPC) = PDB (atau PNB) / Jumlah Penduduk ; Indeks Gini (G) = Luas A / (Luas A + Luas B), 0 ≤ G ≤ 1 ; Kriteria Gini: G < 0,3 (Rendah) · 0,3–0,5 (Sedang) · G > 0,5 (Tinggi) ; Kriteria Bank Dunia (porsi 40% termiskin): < 12% Tinggi · 12%–17% Sedang · > 17% Rendah",["lorenz"]],
["3.4 Pertumbuhan Ekonomi vs Pembangunan Ekonomi","<b>Konsep:</b> Jangan samakan <b>pertumbuhan ekonomi (economic growth)</b> dengan <b>pembangunan ekonomi (economic development)</b>! Pertumbuhan ekonomi adalah kenaikan kapasitas produksi barang/jasa secara <i>kuantitatif</i> (kenaikan PDB riil dari tahun ke tahun) tanpa memandang apakah struktur masyarakat atau pemerataan membaik. Sebaliknya, pembangunan ekonomi adalah proses kenaikan pendapatan per kapita jangka panjang yang disertai <i>perubahan kualitatif</i>: peningkatan kualitas hidup (IPM/HDI: kesehatan, pendidikan, daya beli), pemerataan pendapatan, pengentasan kemiskinan, dan transformasi struktur ekonomi dari agraris ke industri/jasa. <b>Langkah Perhitungan:</b> Laju pertumbuhan ekonomi tahun t dihitung dari perubahan <b>PDB Riil (atas dasar harga konstan)</b> terhadap tahun sebelumnya agar tidak terdistorsi oleh inflasi. <b>Poin TKA:</b> Kenali tokoh teori pertumbuhan: (a) <b>Klasik</b> (Adam Smith: pembagian kerja & akumulasi modal; David Ricardo: <i>the law of diminishing returns</i>), (b) <b>Neoklasik</b> (Solow-Swan: modal, tenaga kerja, dan teknologi; Joseph Schumpeter: inovasi <i>entrepreneur</i>; Harrod-Domar: investasi & rasio modal-output COR), (c) <b>Historis</b> (W.W. Rostow dengan 5 tahap: tradisional → prakondisi lepas landas → lepas landas/<i>take-off</i> → menuju kedewasaan → konsumsi massa tinggi). <b>Jebakan:</b> Selalu gunakan PDB tahun sebelumnya ($PDB_{t-1}$) sebagai pembagi, bukan PDB tahun berjalan!","Laju Pertumbuhan Ekonomi: g_t = ((PDB_t − PDB_(t−1)) / PDB_(t−1)) × 100% ; PDB Riil = (PDB Nominal / Deflator PDB) × 100 ; Teori Harrod-Domar: g = s / k (s = rasio tabungan MPS, k = ICOR/COR) ; 3 Dimensi IPM (HDI): Umur panjang & sehat · Pengetahuan (pendidikan) · Standar hidup layak",["growth"]],
["3.5 Ketenagakerjaan, Angkatan Kerja & Pengangguran","<b>Konsep:</b> Penduduk dibagi menjadi <b>Penduduk Usia Kerja</b> (di Indonesia usia ≥ 15 tahun) dan Bukan Usia Kerja (< 15 tahun). Penduduk usia kerja terbagi lagi menjadi: (1) <b>Angkatan Kerja (Labor Force)</b>, yaitu mereka yang <i>bekerja</i> maupun yang <i>menganggur tetapi sedang aktif mencari kerja</i>; dan (2) <b>Bukan Angkatan Kerja</b>, yaitu mereka yang berusia ≥ 15 tahun tetapi masih sekolah/kuliah, mengurus rumah tangga, atau penerima pendapatan/pensiunan. <b>Langkah Analisis Pengangguran:</b> Berdasarkan penyebabnya, pengangguran dibagi menjadi: (a) <b>Friksional</b> (peralihan sementara karena pindah kerja/mencari pekerjaan yang lebih cocok—solusi: bursa informasi kerja), (b) <b>Struktural</b> (perubahan struktur ekonomi atau ketidaksesuaian keahlian dengan kebutuhan industri, misal petani beralih ke industri—solusi: pelatihan vokasi/<i>reskilling</i> & relokasi), (c) <b>Siklis/Konjungtural</b> (akibat resesi/lesunya permintaan agregat—solusi: stimulus fiskal & moneter, padat karya), (d) <b>Musiman</b> (tergantung musim panen/cuaca—solusi: keterampilan sampingan), dan (e) <b>Teknologi</b> (tenaga manusia digantikan mesin/AI). <b>Jebakan:</b> Mahasiswa, pelajar SMA berusia 17 tahun, dan ibu rumah tangga <i>bukan</i> pengangguran karena mereka termasuk Bukan Angkatan Kerja! Dalam menghitung TPT, pembaginya adalah <b>Angkatan Kerja</b>, bukan total penduduk.","Angkatan Kerja (AK) = Bekerja + Pengangguran Terbuka ; TPAK = (Angkatan Kerja / Penduduk Usia Kerja) × 100% ; Tingkat Pengangguran Terbuka (TPT) = (Jumlah Pengangguran / Angkatan Kerja) × 100% ; Dependency Ratio (Rasio Ketergantungan) = (Penduduk Non-Produktif / Penduduk Produktif) × 100% ; Setengah Menganggur (Underemployed): jam kerja < 35 jam per minggu",["kerja"]],
["3.6 Sistem Upah & Pasar Tenaga Kerja","<b>Konsep:</b> Di pasar tenaga kerja, <b>permintaan tenaga kerja</b> datang dari <b>perusahaan (RTP)</b> dan merupakan <i>permintaan turunan (derived demand)</i> dari permintaan barang/jasa yang diproduksi (berslope negatif terhadap tingkat upah), sedangkan <b>penawaran tenaga kerja</b> datang dari <b>rumah tangga (RTK/pekerja)</b> (berslope positif terhadap upah). Keseimbangan pasar tenaga kerja menentukan upah keseimbangan dan jumlah pekerja yang terserap. <b>Poin TKA:</b> Bedakan <b>Upah Nominal</b> (jumlah uang yang diterima pekerja secara tertulis, misalnya Rp5.000.000/bulan) dengan <b>Upah Riil</b> (daya beli nyata upah tersebut terhadap barang/jasa setelah memperhitungkan inflasi/indeks harga). Jika upah nominal naik 5% sementara inflasi 8%, maka upah riil pekerja sebenarnya <i>turun</i>! Sistem pemberian upah meliputi: upah menurut waktu (per jam/hari/bulan), upah satuan hasil/potongan (per unit output), upah borongan (per proyek selesai), upah bonus, dan upah mitra usaha (saham/bagi hasil). <b>Jebakan:</b> Penetapan <b>Upah Minimum (UMP/UMK)</b> adalah kebijakan <i>floor price</i> di atas upah keseimbangan: bagi pekerja yang tetap bekerja kesejahteraannya naik, tetapi jika kenaikannya melampaui produktivitas, perusahaan mengurangi rekrutmen sehingga menimbulkan <i>excess supply of labor</i> (pengangguran).","Upah Riil = (Upah Nominal / Indeks Harga Konsumen) × 100 ; Permintaan Tenaga Kerja (oleh Perusahaan): W naik → L_d turun (sebanding nilai produk marjinal VMPL = P × MP_L) ; Penawaran Tenaga Kerja (oleh Pekerja): W naik → L_s naik ; Dampak UMP di atas W_e: L_s > L_d → Surplus Tenaga Kerja (Pengangguran)",["upah"]]]},

{n:"Inflasi, Moneter & Fiskal",e:"🏦",c:"#f59e0b",z:"",i:"Mengevaluasi indeks harga dan inflasi, menganalisis instrumen kebijakan moneter Bank Sentral, serta kebijakan fiskal dan perpajakan.",S:[
["4.1 Indeks Harga (Agregatif, Laspeyres, Paasche & NTP)","<b>Konsep:</b> <b>Indeks harga</b> adalah ukuran statistik yang menunjukkan perubahan rata-rata harga sekelompok barang dan jasa dari satu periode ke periode lain dibandingkan tahun dasar (tahun dasar diberi indeks = 100). Jenisnya meliputi: (1) <b>Indeks Harga Konsumen (IHK)</b> untuk mengukur biaya hidup rumah tangga dan menghitung inflasi, (2) <b>Indeks Harga Produsen (IHP / Perdagangan Besar)</b> sebagai indikator dini harga tingkat grosir, (3) <b>Indeks Harga Implisit (Deflator PDB)</b>, serta (4) <b>Nilai Tukar Petani (NTP)</b>, yaitu rasio Indeks Harga yang Diterima Petani (IT) terhadap Indeks Harga yang Dibayar Petani (IB). <b>Langkah Perhitungan:</b> (a) <b>Metode Agregatif Sederhana (Tak Tertimbang)</b> hanya menjumlahkan harga tahun berjalan dibagi jumlah harga tahun dasar. (b) <b>Metode Laspeyres (IL)</b> menggunakan penimbang kuantitas tahun dasar (Q₀)—cenderung <i>overestimate</i> karena mengabaikan peralihan konsumen ke barang lebih murah saat harga naik. (c) <b>Metode Paasche (IP)</b> menggunakan penimbang kuantitas tahun berjalan (Qₙ). <b>Jebakan:</b> Ingat jembatan keledai: <b>L</b>aspeyres = <b>L</b>ama (pakai Q₀ tahun dasar); <b>P</b>aasche = <b>P</b>aling baru (pakai Qₙ tahun berjalan). Untuk NTP, jika NTP > 100 berarti petani mengalami <i>surplus</i> (kesejahteraan meningkat).","Agregatif Sederhana: I_A = (ΣP_n / ΣP_0) × 100 ; Indeks Laspeyres (tertimbang Q_0): I_L = (Σ(P_n · Q_0) / Σ(P_0 · Q_0)) × 100 ; Indeks Paasche (tertimbang Q_n): I_P = (Σ(P_n · Q_n) / Σ(P_0 · Q_n)) × 100 ; Indeks Drobisch: I_D = (I_L + I_P) / 2 · Fisher: I_F = √(I_L × I_P) ; Nilai Tukar Petani: NTP = (IT / IB) × 100 (NTP > 100: petani surplus)",["indeks"]],
["4.2 Inflasi: Konsep, Penyebab, Perhitungan & Dampak","<b>Konsep:</b> <b>Inflasi</b> adalah kecenderungan naiknya harga barang dan jasa secara <i>umum dan terus-menerus</i> dalam suatu periode (kenaikan satu barang saja atau kenaikan sesaat menjelang hari raya belum disebut inflasi berkelanjutan). Berdasarkan penyebabnya, dibedakan menjadi: (1) <b>Demand-Pull Inflation</b> (tarikan permintaan: permintaan agregat AD melonjak melebihi kapasitas ekonomi, kurva AD bergeser ke kanan), (2) <b>Cost-Push Inflation</b> (dorongan biaya: naiknya harga BBM, bahan baku, atau upah yang menggeser kurva penawaran agregat AS ke kiri, berisiko memicu <i>stagflasi</i> yaitu inflasi tinggi disertai pengangguran), dan (3) <b>Imported Inflation</b> (penularan harga impor akibat depresiasi mata uang atau lonjakan harga komoditas global). <b>Langkah Teori Kuantitas Uang:</b> Irving Fisher merumuskan <b>M × V = P × T</b> (Jumlah uang beredar × Kecepatan peredaran uang = Tingkat harga × Volume transaksi barang). Jika V dan T tetap sementara jumlah uang beredar (M) digandakan, maka tingkat harga (P) akan ikut naik sebanding. <b>Poin TKA:</b> Saat terjadi inflasi tak terduga, pihak yang <b>diuntungkan</b> adalah <i>debitur (peminjam uang dengan bunga tetap)</i> dan pengusaha yang memiliki stok barang; sedangkan yang <b>dirugikan</b> adalah <i>kreditor (pemberi pinjaman)</i>, pekerja berpenghasilan tetap, dan penabung. <b>Jebakan:</b> Jika IHK naik dari 110 (tahun 2023) menjadi 121 (tahun 2024), laju inflasi 2024 adalah (121−110)/110 × 100% = <b>10%</b>, bukan 11%!","Laju Inflasi: π_t = ((IHK_t − IHK_(t−1)) / IHK_(t−1)) × 100% ; Keparahan: < 10%/thn (Ringan) · 10%–30% (Sedang) · 30%–100% (Berat) · > 100% (Hiperinflasi) ; Teori Kuantitas Uang (Irving Fisher): M · V = P · T ⇒ P = (M · V) / T ; Dampak Inflasi: Debitur & Spekulan Barang (Untung) vs Kreditor & Gaji Tetap (Rugi)",["inflasi"]],
["4.3 Bank Sentral, Sistem Pembayaran & Uang","<b>Konsep:</b> <b>Uang</b> adalah alat tukar yang diterima secara umum. Syarat uang: diterima umum (<i>acceptability</i>), nilainya stabil (<i>stability of value</i>), mudah dibawa (<i>portability</i>), tahan lama (<i>durability</i>), tidak mudah dipalsukan, dan mudah dibagi tanpa mengurangi nilai (<i>divisibility</i>). Fungsi asli uang adalah sebagai <b>alat tukar</b> dan <b>satuan hitung</b>; fungsi turunannya sebagai alat pembayaran sah, penyimpan nilai (<i>store of value</i>), dan pemindah kekayaan. Menurut lembaga penerbitnya, <b>uang kartal</b> (kertas & logam) diterbitkan oleh Bank Sentral, sedangkan <b>uang giral</b> (cek, bilyet giro, saldo rekening koran) diciptakan oleh Bank Umum. <b>Poin TKA:</b> Sesuai UU, tujuan tunggal <b>Bank Indonesia (BI)</b> sebagai bank sentral adalah <b>mencapai dan memelihara kestabilan nilai rupiah</b>, baik terhadap barang dan jasa (tercermin pada laju inflasi yang rendah dan terkendali) maupun terhadap mata uang negara lain (tercermin pada stabilitas nilai tukar/kurs). Untuk mencapai tujuan itu, BI memiliki <b>3 pilar tugas utama</b>: (1) menetapkan dan melaksanakan kebijakan moneter, (2) mengatur dan menjaga kelancaran sistem pembayaran (tunai maupun nontunai seperti BI-RTGS untuk transaksi nilai besar/mendesak, SKNBI, BI-FAST, dan standar QRIS), serta (3) menjaga stabilitas sistem keuangan (makroprudensial). <b>Jebakan:</b> Pengawasan mikroprudensial terhadap kesehatan individu bank dan lembaga keuangan saat ini dilakukan oleh <b>Otoritas Jasa Keuangan (OJK)</b>, bukan lagi Bank Indonesia!","Uang Beredar Sempit: M₁ = Uang Kartal di Masyarakat (C) + Uang Giral (D) ; Uang Beredar Luas: M₂ = M₁ + Uang Kuasi (Tabungan & Deposito Berjangka) ; 3 Pilar Bank Indonesia: Kebijakan Moneter · Sistem Pembayaran · Stabilitas Sistem Keuangan ; Nilai Intrinsik = nilai bahan pembuat uang · Nilai Nominal = nilai yang tertulis pada uang",["uang"]],
["4.4 Kebijakan Moneter (Ekspansif vs Kontraktif)","<b>Konsep:</b> <b>Kebijakan moneter</b> adalah langkah Bank Sentral mengendalikan <b>Jumlah Uang Beredar (JUB)</b> dan suku bunga untuk menjaga stabilitas harga serta pertumbuhan ekonomi. Terdapat dua arah kebijakan: (1) <b>Kebijakan Moneter Kontraktif (Tight Money Policy / Kebijakan Uang Ketat)</b>, diterapkan saat ekonomi mengalami <b>inflasi tinggi (overheating)</b> atau nilai tukar melemah tajam, dengan tujuan <i>mengurangi JUB</i>; dan (2) <b>Kebijakan Moneter Ekspansif (Easy Money Policy / Kebijakan Uang Longgar)</b>, diterapkan saat terjadi <b>resesi, deflasi, atau kelesuan ekonomi/pengangguran tinggi</b>, dengan tujuan <i>menambah JUB</i> agar kredit dan investasi bergerak. <b>Langkah 4 Instrumen Utama:</b> Saat terjadi <b>inflasi</b>, Bank Sentral melakukan: (a) <b>Operasi Pasar Terbuka (OPT)</b> dengan <i>menjual</i> surat berharga (SBN/SRBI) kepada bank/masyarakat sehingga uang ditarik masuk ke bank sentral; (b) <b>Politik Diskonto (BI-Rate)</b> dengan <i>menaikkan</i> suku bunga acuan agar masyarakat menabung dan menahan pinjaman konsumtif; (c) <b>Giro Wajib Minimum (GWM / Cash Ratio)</b> dengan <i>menaikkan</i> persentase cadangan wajib bank umum sehingga kemampuan bank menyalurkan kredit turun; serta (d) <b>Kredit Selektif (ketat) & Imbauan Moral</b>. Saat resesi/deflasi, lakukan kebalikannya! <b>Jebakan:</b> Jangan terbalik pada OPT: <b>Menjual</b> surat berharga berarti bank sentral menyerahkan kertas surat berharga dan <i>menarik uang</i> dari masyarakat (mengatasi inflasi)!","Atasi Inflasi (Kontraktif / JUB ↓): Jual SBN (OPT) · Naikkan BI-Rate · Naikkan GWM · Perketat Kredit ; Atasi Resesi/Deflasi (Ekspansif / JUB ↑): Beli SBN (OPT) · Turunkan BI-Rate · Turunkan GWM · Longgarkan Kredit ; Angka Pengganda Uang (Money Multiplier): m = 1 / GWM ; Total Penciptaan Uang Giral Maksimum = Cadangan Awal / GWM",["moneter"]],
["4.5 APBN, APBD & Kebijakan Fiskal","<b>Konsep:</b> <b>Kebijakan fiskal</b> adalah kebijakan ekonomi yang dilakukan oleh <b>Pemerintah (melalui Kementerian Keuangan)</b> dengan mengatur penerimaan negara (terutama <b>pajak, T</b>) dan pengeluaran/belanja pemerintah (<b>G</b>) di dalam <b>APBN</b> untuk memengaruhi permintaan agregat dan mengarahkan perekonomian. APBN mengemban 6 fungsi: <b>Otorisasi</b> (dasar hukum pelaksanaan pendapatan & belanja tahunan), <b>Perencanaan</b>, <b>Pengawasan</b>, <b>Alokasi</b> (mengalokasikan anggaran untuk barang publik/infrastruktur dan mengurangi pengangguran), <b>Distribusi</b> (keadilan & pemerataan lewat subsidi, bansos, dana desa), dan <b>Stabilisasi</b> (menjaga keseimbangan ekonomi makro). <b>Langkah Analisis Fiskal:</b> Saat terjadi <b>resesi/kelesuan ekonomi</b>, pemerintah menerapkan <b>Kebijakan Fiskal Ekspansif (Defisit)</b>: menaikkan belanja negara (G↑, misalnya proyek infrastruktur padat karya) dan/atau menurunkan tarif pajak (T↓ / insentif pajak) agar daya beli dan investasi tumbuh. Saat terjadi <b>inflasi tinggi</b>, pemerintah menerapkan <b>Kebijakan Fiskal Kontraktif (Surplus)</b>: menahan belanja (G↓) dan/atau menaikkan pajak (T↑) untuk mengerem permintaan agregat. <b>Jebakan:</b> Bedakan pelaku dan instrumennya: Suku bunga, GWM, dan jual-beli SBN di pasar terbuka oleh Bank Sentral adalah <b>kebijakan moneter</b>; sedangkan tarif pajak, subsidi, dan belanja infrastruktur oleh Pemerintah adalah <b>kebijakan fiskal</b>!","Saldo APBN = Pendapatan Negara (Pajak + PNBP + Hibah) − Belanja Negara (Pusat + TKD) ; Fiskal Ekspansif (Atasi Resesi/Pengangguran): Belanja G ↑ dan/atau Pajak T ↓ (Anggaran Defisit) ; Fiskal Kontraktif (Atasi Inflasi): Belanja G ↓ dan/atau Pajak T ↑ (Anggaran Surplus) ; Multiplier Belanja Pemerintah: k_G = 1 / (1 − MPC) · Multiplier Pajak: k_T = −MPC / (1 − MPC)",["apbn"]],
["4.6 Perpajakan di Indonesia (Fungsi, Tarif & Perhitungan PPh)","<b>Konsep:</b> <b>Pajak</b> adalah kontribusi wajib kepada negara yang terutang oleh orang pribadi atau badan yang bersifat memaksa berdasarkan undang-undang, dengan <b>tidak mendapatkan imbalan secara langsung (kontraprestasi langsung)</b> dan digunakan untuk keperluan negara bagi sebesar-besarnya kemakmuran rakyat (berbeda dengan <i>retribusi</i> yang memberikan imbalan langsung seperti parkir atau tol). Fungsi pajak utama ada empat: <b>Budgetair (Anggaran)</b> sebagai sumber pembiayaan negara terbesar, <b>Regulerend (Mengatur)</b> untuk mengatur kegiatan ekonomi (misal cukai rokok tinggi untuk membatasi konsumsi, pajak ekspor 0% untuk memacu ekspor), <b>Distribusi/Pemerataan</b>, dan <b>Stabilisasi</b>. <b>Langkah Menghitung PPh Pasal 21 (Orang Pribadi):</b> (1) Hitung Penghasilan Neto setahun. (2) Kurangi dengan <b>PTKP (Penghasilan Tidak Kena Pajak)</b>: Wajib Pajak pribadi Rp54.000.000/tahun; tambahan menikah Rp4.500.000; tambahan per tanggungan Rp4.500.000 (maksimal 3 orang). (3) Hasilnya adalah <b>PKP (Penghasilan Kena Pajak)</b>. (4) Kalikan PKP secara <i>berlapis (progresif)</i> sesuai tarif UU HPP: lapis I (0–Rp60 juta) = 5%, lapis II (>Rp60–Rp250 juta) = 15%, lapis III (>Rp250–Rp500 juta) = 25%, lapis IV (>Rp500 juta–Rp5 miliar) = 30%, lapis V (>Rp5 miliar) = 35%. <b>Jebakan:</b> Jika PKP seseorang Rp100 juta, pajaknya <i>bukan</i> 15% × Rp100 juta, melainkan dipotong per lapisan: (5% × Rp60 juta) + (15% × Rp40 juta)!","PTKP Setahun: WP Sendiri (TK/0) = Rp54 juta · Kawin (+Rp4,5 juta) · Tanggungan (+Rp4,5 juta/orang, maks 3) ; PKP (Penghasilan Kena Pajak) = Penghasilan Neto Setahun − PTKP ; Lapis Tarif PPh OP (UU HPP): 0–60 jt (5%) · >60–250 jt (15%) · >250–500 jt (25%) · >500 jt–5 M (30%) · >5 M (35%) ; PPN = Tarif PPN (11%) × Dasar Pengenaan Pajak",["pph"]]]},

{n:"Badan Usaha & Internasional",e:"🌐",c:"#8b5cf6",z:"",i:"Mendeskripsikan manajemen badan usaha (BUMN, BUMD, BUMS, Koperasi) serta menganalisis kerja sama dan perdagangan internasional.",S:[
["5.1 Konsep Manajemen: Fungsi POAC, Tingkatan & Bidang","<b>Konsep:</b> <b>Manajemen</b> adalah seni dan ilmu merencanakan, mengorganisasikan, mengarahkan, serta mengendalikan sumber daya (<b>Unsur 6M</b>: <i>Man, Money, Materials, Machines, Methods, Market</i>) untuk mencapai tujuan organisasi secara efektif (tepat sasaran) dan efisien (hemat sumber daya). Menurut George R. Terry, empat fungsi utama manajemen adalah <b>POAC</b>: (1) <b>Planning (Perencanaan)</b>: menetapkan visi, target, strategi, jadwal, dan anggaran (menjawab 5W+1H); (2) <b>Organizing (Pengorganisasian)</b>: membagi tugas, membentuk struktur organisasi, dan mendelegasikan wewenang (<i>the right man on the right place</i>); (3) <b>Actuating (Penggerakan/Pengarahan)</b>: memotivasi, memimpin, dan membimbing karyawan agar bekerja sesuai rencana; serta (4) <b>Controlling (Pengawasan)</b>: mengevaluasi kinerja aktual terhadap standar rencana dan melakukan tindakan korektif. <b>Poin TKA:</b> Terdapat 3 tingkatan manajemen: <b>Top Management</b> (Direksi/CEO: dominan keterampilan <i>konseptual</i> & strategi jangka panjang), <b>Middle Management</b> (Manajer Divisi/Cabang: jembatan strategi ke taktis), dan <b>First-Line / Lower Management</b> (Supervisor/Mandor: dominan keterampilan <i>teknis</i> operasional harian). Lima bidang manajemen meliputi: Produksi, Pemasaran (bauran 4P: <i>Product, Price, Place, Promotion</i>), Keuangan, SDM/Personalia, dan Administrasi/Perkantoran. <b>Jebakan:</b> Menyusun jadwal produksi dan target penjualan tahun depan adalah <i>Planning</i>, sedangkan membagi karyawan ke dalam divisi dengan garis komando adalah <i>Organizing</i>!","Fungsi Manajemen (G.R. Terry): Planning → Organizing → Actuating → Controlling (POAC) ; Unsur Manajemen (6M): Man, Money, Materials, Machines, Methods, Market ; Tingkatan Manajemen: Top (Konseptual) · Middle (Manajerial) · First-Line (Teknis) ; Bauran Pemasaran (Marketing Mix 4P): Product, Price, Place, Promotion",["poac"]],
["5.2 Badan Usaha dalam Perekonomian: BUMN, BUMD & BUMS","<b>Konsep:</b> Bedakan <b>Badan Usaha</b> (kesatuan yuridis-ekonomis yang bertujuan mencari laba atau memberi layanan, seperti PT, CV, Koperasi) dengan <b>Perusahaan</b> (kesatuan teknis produksi yang menghasilkan barang/jasa, seperti pabrik atau bengkel). Di Indonesia terdapat tiga pilar pelaku usaha: (1) <b>BUMN (Badan Usaha Milik Negara)</b> yang seluruh atau sebagian besar modalnya (minimal 51%) dimiliki negara; terbagi menjadi <b>Persero</b> (berbentuk PT, modal terbagi atas saham, tujuan utama mencari laba dan menyediakan barang/jasa bermutu, contoh: PT Pertamina, PT BRI Tbk, PTPN) dan <b>Perum</b> (modal 100% milik negara tidak terbagi atas saham, fokus pelayanan umum strategis sekaligus mandiri finansial, contoh: Perum Bulog, Perum Peruri, Perum Damri). (2) <b>BUMD</b> yang dimiliki Pemerintah Daerah (contoh: Bank Pembangunan Daerah, PDAM) untuk mendorong pembangunan daerah dan PAD. (3) <b>BUMS (Swasta)</b> yang meliputi: <b>Perusahaan Perseorangan</b>, <b>Firma (Fa)</b> (tanggung jawab renteng tak terbatas), <b>CV (Persekutuan Komanditer)</b> yang memiliki dua jenis sekutu: <i>Sekutu Aktif/Komplementer</i> (mengelola usaha & tanggung jawab tak terbatas sampai harta pribadi) dan <i>Sekutu Pasif/Komanditer</i> (hanya menyetor modal & tanggung jawab sebatas modal yang disetor), serta <b>PT (Perseroan Terbatas)</b> yang modalnya berupa saham dan tanggung jawab pemegang saham terbatas pada nilai sahamnya. <b>Jebakan:</b> Dalam CV, sekutu pasif <i>tidak boleh</i> ikut mengelola perusahaan; jika ikut mengelola, tanggung jawabnya berubah menjadi tidak terbatas!","BUMN Persero: Modal saham (Negara ≥ 51%), fokus laba & daya saing ; BUMN Perum: Modal 100% Negara (bukan saham), fokus kemanfaatan umum ; CV: Sekutu Aktif (kelola + tanggung jawab tak terbatas) vs Sekutu Pasif (setor modal + tanggung jawab terbatas) ; Kekuasaan Tertinggi PT: RUPS (Rapat Umum Pemegang Saham) · Pengurus: Direksi · Pengawas: Dewan Komisaris",["badan"]],
["5.3 Koperasi & Perhitungan Sisa Hasil Usaha (SHU)","<b>Konsep:</b> Menurut UU No. 25 Tahun 1992, <b>Koperasi</b> adalah badan usaha yang beranggotakan orang-seorang atau badan hukum koperasi dengan melandaskan kegiatannya berdasarkan prinsip koperasi sekaligus sebagai gerakan ekonomi rakyat yang berdasar atas <b>asas kekeluargaan</b>. Prinsip koperasi meliputi: keanggotaan sukarela dan terbuka, pengelolaan demokratis, pembagian <b>Sisa Hasil Usaha (SHU)</b> dilakukan secara adil sebanding dengan besarnya jasa usaha masing-masing anggota (bukan semata besarnya modal!), pemberian balas jasa terbatas terhadap modal, serta kemandirian. Perangkat organisasi koperasi terdiri atas <b>Rapat Anggota</b> (pemegang kekuasaan tertinggi), <b>Pengurus</b>, dan <b>Pengawas</b>. <b>Langkah Menghitung SHU Anggota:</b> SHU yang diterima seorang anggota berasal dari dua kontribusi: (1) <b>Jasa Modal (JM)</b> atas simpanan wajib dan simpanan pokok anggota dibanding total simpanan seluruh anggota; ditambah (2) <b>Jasa Usaha Anggota (JUA)</b> atas transaksi pembelian (di koperasi konsumsi) atau pembayaran pinjaman (di koperasi simpan pinjam) anggota tersebut dibanding total transaksi seluruh anggota. <b>Jebakan:</b> <b>Simpanan Sukarela</b> <i>tidak</i> ikut dihitung dalam penentuan Jasa Modal SHU karena sifatnya seperti tabungan biasa yang dapat diambil sewaktu-waktu! Hanya jumlah <b>Simpanan Pokok + Simpanan Wajib</b> anggota yang dihitung sebagai modal anggota untuk pembagian JM.","Modal Sendiri Koperasi = Simpanan Pokok + Simpanan Wajib + Dana Cadangan + Hibah ; SHU Anggota = Jasa Modal (JM) + Jasa Usaha Anggota (JUA) ; Jasa Modal (JM) = (Simpanan Anggota / Total Simpanan Koperasi) × (% JM × Total SHU) ; Jasa Usaha (JUA) = (Transaksi Anggota / Total Transaksi Koperasi) × (% JUA × Total SHU)",["shu"]],
["5.4 Kerja Sama Ekonomi Internasional","<b>Konsep:</b> Tidak ada negara yang dapat memenuhi seluruh kebutuhannya sendiri (autarki) karena perbedaan sumber daya alam, iklim, penguasaan IPTEK, dan struktur demografi. <b>Kerja sama ekonomi internasional</b> adalah hubungan saling menguntungkan antarnegara di bidang perdagangan, investasi, keuangan, dan ketenagakerjaan untuk mempercepat pertumbuhan ekonomi, memperluas pasar ekspor, menarik investasi/transfer teknologi, serta menjaga stabilitas kawasan. <b>Poin TKA:</b> Bedakan empat bentuk kerja sama berdasarkan jumlah dan letak geografis anggotanya: (1) <b>Bilateral</b>: antara <i>dua negara</i> saja (contoh: Indonesia–Jepang melalui IJEPA, Indonesia–Australia IA-CEPA); (2) <b>Regional</b>: antara beberapa negara dalam <i>satu kawasan geografis</i> yang sama (contoh: <b>ASEAN</b>, <b>AFTA / MEA</b> di Asia Tenggara, <b>Uni Eropa / MEE</b> di Eropa, <b>APEC</b> di Asia Pasifik); (3) <b>Antarregional</b>: antara satu blok regional dengan blok regional lain (contoh: ASEAN–Uni Eropa, ASEM / Asia-Europe Meeting); serta (4) <b>Multilateral / Internasional</b>: melibatkan banyak negara dari berbagai belahan dunia tanpa batas kawasan (contoh: <b>WTO</b> untuk aturan perdagangan bebas dunia, <b>IMF</b> untuk stabilitas moneter & neraca pembayaran, <b>World Bank / Bank Dunia</b> untuk pinjaman pembangunan, <b>OPEC</b> organisasi negara pengekspor minyak, <b>ILO</b> ketenagakerjaan). <b>Jebakan:</b> <b>OPEC</b> dan <b>WTO</b> adalah kerja sama <i>multilateral</i> (bukan regional) karena anggotanya tersebar lintas benua, sedangkan <b>APEC</b> dan <b>AFTA</b> adalah kerja sama <i>regional</i>!","Bilateral = 2 Negara (contoh: IJEPA Indonesia–Jepang) ; Regional = Satu Kawasan (contoh: ASEAN, AFTA, MEA, APEC, Uni Eropa) ; Antarregional = Kawasan dengan Kawasan (contoh: ASEAN–EU, ASEM) ; Multilateral = Lintas Kawasan Dunia (contoh: WTO, IMF, World Bank, OPEC, ILO, UNDP)",["kerjasama"]],
["5.5 Perdagangan Internasional: Teori & Kebijakan Proteksi","<b>Konsep:</b> Mengapa dua negara berdagang? (1) <b>Teori Keunggulan Mutlak (Absolute Advantage — Adam Smith)</b>: suatu negara berspesialisasi dan mengekspor barang yang dapat diproduksinya dengan biaya lebih rendah (atau output per pekerja <i>lebih banyak secara mutlak</i>) dibanding negara mitra, dan mengimpor barang yang produksinya kurang efisien. (2) <b>Teori Keunggulan Komparatif (Comparative Advantage — David Ricardo)</b>: sekalipun satu negara lebih unggul di <i>kedua</i> jenis barang secara mutlak, perdagangan tetap saling menguntungkan apabila masing-masing negara berspesialisasi pada barang yang memiliki <b>biaya peluang (opportunity cost / Dasar Tukar Dalam Negeri) paling kecil</b>! <b>Langkah Menghitung Keunggulan Komparatif:</b> Bagi output barang lawan dengan output barang itu sendiri untuk mencari biaya peluang 1 unit barang; negara dengan pengorbanan terkecil memiliki keunggulan komparatif pada barang tersebut. <b>Poin TKA:</b> Untuk melindungi industri dalam negeri dari gempuran impor, pemerintah menerapkan <b>kebijakan proteksi</b>: (a) <b>Tarif / Bea Masuk</b> (pajak atas barang impor sehingga harganya di dalam negeri naik), (b) <b>Kuota Impor</b> (pembatasan jumlah fisik maksimum barang yang boleh diimpor), (c) <b>Subsidi Ekspor</b> (bantuan biaya bagi eksportir domestik), (d) <b>Larangan Impor/Ekspor</b>, serta (e) <b>Politik Dumping</b> (menjual barang di luar negeri lebih murah daripada di dalam negeri untuk menguasai pasar ekspor). <b>Jebakan:</b> Kesepakatan perdagangan bebas (<i>free trade agreement</i>) bukanlah hambatan perdagangan, melainkan penghapusan hambatan tarif dan non-tarif!","Biaya Peluang (DTDN) 1 unit X = Output Y / Output X (pilih pengorbanan terkecil!) ; Keuntungan Perdagangan = Selisih antara Dasar Tukar Internasional (DTI) dan DTDN ; Tarif Impor: Harga Impor Naik → Q_d turun, Q_s domestik naik, Impor berkurang ; Kuota Impor: Pembatasan kuantitas maksimum barang masuk ; Dumping: Harga Jual Ekspor (LN) < Harga Jual Domestik (DN)",["komparatif"]],
["5.6 Kurs Valuta Asing, Devisa & Neraca Pembayaran","<b>Konsep:</b> Transaksi antarnegara membutuhkan pertukaran mata uang di pasar valuta asing (valas). <b>Kurs (nilai tukar)</b> adalah harga satu unit mata uang asing yang dinyatakan dalam mata uang dalam negeri (misalnya US$1 = Rp16.000). <b>Aturan Emas Kurs Jual & Kurs Beli:</b> Selalu gunakan <b>sudut pandang Bank atau Money Changer</b>! Saat kamu <i>menukar Rupiah menjadi Dolar</i> (misalnya hendak pergi ke luar negeri atau membayar impor), bank sedang <i>menjual</i> valas kepadamu, maka gunakan <b>Kurs Jual</b> (nilainya selalu lebih tinggi). Saat kamu <i>menukar Dolar kembali menjadi Rupiah</i> (misalnya pulang dari luar negeri atau menerima hasil ekspor), bank sedang <i>membeli</i> valas darimu, maka gunakan <b>Kurs Beli</b> (nilainya lebih rendah). <b>Poin TKA:</b> Jika nilai Rupiah menguat akibat mekanisme pasar disebut <b>Apresiasi</b> (jika karena kebijakan pemerintah disebut <b>Revaluasi</b>); jika Rupiah melemah karena pasar disebut <b>Depresiasi</b> (jika karena kebijakan pemerintah disebut <b>Devaluasi</b>). Depresiasi Rupiah membuat harga barang Indonesia tampak lebih murah bagi pembeli asing sehingga <b>mendorong ekspor dan menekan impor</b>, tetapi memperberat beban utang luar negeri dan bahan baku impor. Seluruh aliran devisa masuk (kredit/+) dan keluar (debit/−) dicatat dalam <b>Neraca Pembayaran (Balance of Payments)</b> yang mencakup Neraca Transaksi Berjalan (neraca perdagangan barang, jasa, pendapatan primer/sekunder), Neraca Modal, dan Neraca Finansial. <b>Jebakan:</b> Kenaikan angka kurs dari Rp15.000/US$ menjadi Rp16.500/US$ berarti Rupiah mengalami <b>depresiasi (melemah)</b>, bukan menguat!","Tukar Rupiah → Valas (Beli Valas dari Bank): Valas = Rupiah / Kurs Jual ; Tukar Valas → Rupiah (Jual Valas ke Bank): Rupiah = Valas × Kurs Beli ; Kurs Tengah = (Kurs Jual + Kurs Beli) / 2 ; Neraca Perdagangan = Nilai Ekspor (X) − Nilai Impor (M) (X > M: Surplus · X < M: Defisit) ; Depresiasi Rupiah: Ekspor ↑, Impor ↓, Biaya Impor Bahan Baku & Utang Valas ↑",["kurs"]]]},

{n:"Akuntansi Keuangan Dasar",e:"📒",c:"#10b981",z:"",i:"Menerapkan persamaan dasar akuntansi, mekanisme debit-kredit, siklus akuntansi perusahaan jasa, hingga penyusunan laporan keuangan.",S:[
["6.1 Konsep Dasar Akuntansi, Pemakai Informasi & Klasifikasi Akun","<b>Konsep:</b> <b>Akuntansi</b> adalah proses mengidentifikasi, mengukur, mencatat, mengikhtisarkan, dan melaporkan informasi ekonomi perusahaan untuk pengambilan keputusan. Pemakai informasi akuntansi terbagi dua: (1) <b>Pihak Internal</b>, yaitu <i>manajemen/pimpinan perusahaan</i> yang menggunakan laporan untuk merencanakan anggaran, mengendalikan biaya, dan mengevaluasi operasional; serta (2) <b>Pihak Eksternal</b>, meliputi <b>Investor/Pemilik</b> (menilai profitabilitas & prospek dividen), <b>Kreditor/Bank</b> (menilai kemampuan perusahaan melunasi pokok dan bunga utang), <b>Pemerintah/Pajak</b> (menghitung kewajiban pajak), <b>Karyawan/Serikat Pekerja</b> (menilai stabilitas perusahaan & kesejahteraan), dan <b>Pemasok/Pelanggan</b>. <b>Langkah Klasifikasi Akun:</b> Seluruh akun dibagi menjadi <b>Akun Riil (Neraca)</b> yang saldonya terbawa ke periode berikutnya dan <b>Akun Nominal (Laba Rugi)</b> yang ditutup pada akhir periode. Akun Riil mencakup: (1) <b>Aset/Harta (kode 1)</b>: <i>Aset Lancar</i> (Kas, Piutang Usaha, Wesel Tagih, Perlengkapan/bahan habis pakai, Beban Dibayar di Muka), <i>Investasi Jangka Panjang</i>, <i>Aset Tetap Berwujud</i> (Peralatan, Kendaraan, Gedung, Tanah), dan <i>Aset Tak Berwujud</i> (Hak Paten, Hak Cipta, Goodwill, Franchise); (2) <b>Liabilitas/Utang (kode 2)</b>: Jangka Pendek (Utang Usaha, Utang Gaji, Pendapatan Diterima di Muka) & Jangka Panjang (Utang Bank, Utang Hipotek, Obligasi); serta (3) <b>Ekuitas/Modal (kode 3)</b>. Akun Nominal mencakup <b>Pendapatan (kode 4)</b> dan <b>Beban (kode 5)</b>. <b>Jebakan:</b> Bedakan <b>Perlengkapan (Supplies)</b> yaitu barang habis pakai kurang dari 1 tahun (kertas, tinta, sabun laundry → Aset Lancar) dengan <b>Peralatan (Equipment)</b> yaitu barang tahan lama lebih dari 1 tahun yang mengalami penyusutan (mesin cuci, komputer, AC → Aset Tetap)!","Akun Riil (Neraca): Aset (1) · Liabilitas/Utang (2) · Ekuitas/Modal (3) ; Akun Nominal (Laba Rugi): Pendapatan (4) · Beban (5) ; Urutan Likuiditas Aset Lancar: Kas → Piutang → Perlengkapan → Beban Dibayar di Muka ; Aset Kontra (Pengurang Aset Tetap): Akumulasi Penyusutan · Kontra Ekuitas: Prive",["klasakun"]],
["6.2 Persamaan Dasar Akuntansi (PDA) & Analisis Transaksi","<b>Konsep:</b> Pondasi seluruh pencatatan akuntansi adalah <b>Persamaan Dasar Akuntansi (PDA)</b>: seluruh harta yang dimiliki perusahaan (<b>Aset</b>) pasti berasal dari dua sumber pendanaan, yaitu klaim pihak ketiga/kreditor (<b>Liabilitas/Utang</b>) dan hak pemilik (<b>Ekuitas/Modal</b>). Karena itu, <b>Aset = Liabilitas + Ekuitas</b> harus selalu seimbang setelah transaksi apa pun! Setiap transaksi keuangan minimal memengaruhi <b>dua akun</b> (prinsip berpasangan / <i>double entry</i>), baik di sisi Aset saja (pertukaran sesama aset) maupun di kedua sisi persamaan secara bersamaan. <b>Langkah Analisis 4 Transaksi Pengubah Ekuitas:</b> Ekuitas (Modal) hanya berubah apabila terjadi 4 hal: (1) <b>Setoran Modal/Investasi pemilik</b> (+Ekuitas), (2) <b>Pendapatan jasa</b> (+Ekuitas, baik diterima tunai menambah Kas maupun difakturkan menambah Piutang), (3) <b>Beban operasional</b> (−Ekuitas, seperti beban gaji, beban listrik, beban sewa periode berjalan, pemakaian perlengkapan), dan (4) <b>Prive / pengambilan pribadi pemilik</b> (−Ekuitas). <b>Poin TKA (Jebakan Klasik Pusmendik):</b> (a) Membeli perlengkapan/peralatan secara <i>tunai</i> atau membayar sewa di muka secara tunai (pendekatan harta) <b>hanya mengubah sesama Aset</b> (Kas berkurang, Perlengkapan/Sewa Dibayar di Muka bertambah)—total Aset dan Ekuitas <i>tetap</i>! (b) Membeli peralatan secara <i>kredit</i> menambah Aset (Peralatan) dan menambah Liabilitas (Utang), tetapi <b>tidak mengubah Ekuitas</b>. (c) Melunasi utang mengurangi Kas (−Aset) dan mengurangi Utang (−Liabilitas), tanpa mengubah Ekuitas!","Persamaan Dasar Akuntansi: Aset (Harta) = Liabilitas (Utang) + Ekuitas (Modal) ; PDA Diperluas: Aset = Liabilitas + (Modal Awal + Pendapatan − Beban − Prive) ; Transaksi Pengubah Ekuitas: Setoran Modal (+) · Pendapatan (+) · Beban (−) · Prive (−) ; Pertukaran Sesama Aset (Ekuitas Tetap): Beli Aset Tunai · Terima Pelunasan Piutang · Sewa Dibayar di Muka (Harta)",["pda"]],
["6.3 Mekanisme Debit–Kredit, Saldo Normal & Jurnal Umum","<b>Konsep:</b> Dalam siklus akuntansi, bukti transaksi (kuitansi untuk penerimaan kas, nota kontan untuk pembelian tunai, <b>faktur</b> untuk transaksi kredit, bukti memorial untuk penyesuaian internal) dianalisis lalu dicatat secara kronologis ke dalam <b>Jurnal Umum</b> menggunakan aturan <b>Debit (D)</b> dan <b>Kredit (K)</b>. <b>Jembatan Keledai 6 Kelompok Akun:</b> Hafalkan kelompok <b>H–B–P (Harta, Beban, Prive)</b>! Ketiga akun ini memiliki <b>Saldo Normal di DEBIT</b>: artinya jika bertambah dicatat di <b>Debit</b>, dan jika berkurang dicatat di <b>Kredit</b>. Sebaliknya, tiga akun lainnya yaitu <b>U–M–P (Utang/Liabilitas, Modal/Ekuitas, Pendapatan)</b> memiliki <b>Saldo Normal di KREDIT</b>: artinya jika bertambah dicatat di <b>Kredit</b>, dan jika berkurang dicatat di <b>Debit</b>! <b>Langkah Menyusun Jurnal Umum:</b> (1) Tentukan akun apa saja yang terpengaruh oleh transaksi (minimal 2 akun). (2) Tentukan kelompok masing-masing akun (H, U, M, P, B, atau Prive). (3) Tentukan apakah akun tersebut bertambah (+) atau berkurang (−). (4) Tempatkan di Debit atau Kredit sesuai tabel aturan dan pastikan jumlah rupiah Debit = Kredit. <b>Jebakan:</b> Ketika perusahaan <i>menyelesaikan pekerjaan jasa senilai Rp5.000.000 tetapi baru dibayar Rp2.000.000 dan sisanya bulan depan</i>, maka Kas (D) Rp2.000.000, Piutang Usaha (D) Rp3.000.000, dan Pendapatan Jasa (K) Rp5.000.000!","Kelompok H–B–P (Harta, Beban, Prive): Bertambah di DEBIT · Berkurang di KREDIT · Saldo Normal DEBIT ; Kelompok U–M–P (Utang, Modal, Pendapatan): Bertambah di KREDIT · Berkurang di DEBIT · Saldo Normal KREDIT ; Akumulasi Penyusutan (Kontra Aset): Bertambah di KREDIT · Saldo Normal KREDIT ; Syarat Keseimbangan Jurnal Umum: Σ Nilai Debit = Σ Nilai Kredit",["debkred"]],
["6.4 Buku Besar, Neraca Saldo & Jurnal Penyesuaian (AJP)","<b>Konsep:</b> Setelah Jurnal Umum, transaksi dipindahbukukan (<b>posting</b>) ke <b>Buku Besar (General Ledger)</b> untuk mengelompokkan perubahan per akun, lalu saldo akhir tiap akun diringkas dalam <b>Neraca Saldo (Trial Balance)</b>. Namun angka di Neraca Saldo belum sepenuhnya mencerminkan kondisi riil pada akhir periode, sehingga diperlukan <b>Ayat Jurnal Penyesuaian (AJP)</b>. <b>Langkah 5 AJP Terpenting di TKA:</b> (1) <b>Pemakaian Perlengkapan</b>: yang dicatat pada AJP adalah nilai perlengkapan yang <i>sudah terpakai</i> (Saldo Awal − Sisa Akhir): <i>Beban Perlengkapan (D), Perlengkapan (K)</i>. (2) <b>Penyusutan Aset Tetap</b>: sebesar nilai penyusutan periode ini: <i>Beban Penyusutan (D), Akumulasi Penyusutan (K)</i>. (3) <b>Beban yang Masih Harus Dibayar (Utang Beban)</b>: gaji/listrik yang sudah digunakan tapi belum dibayar: <i>Beban Gaji (D), Utang Gaji (K)</i>. (4) <b>Pendapatan yang Masih Harus Diterima (Piutang Pendapatan)</b>: <i>Piutang Usaha (D), Pendapatan Jasa (K)</i>. (5) <b>Beban Dibayar di Muka (misal Sewa Dibayar di Muka)</b>: perhatikan bagaimana dicatat saat awal di Neraca Saldo! Jika di Neraca Saldo tercatat sebagai <b>Harta (Sewa Dibayar di Muka)</b>, maka AJP mencatat bagian yang <i>sudah terpakai/jatuh tempo</i>: <i>Beban Sewa (D), Sewa Dibayar di Muka (K)</i>. Jika di Neraca Saldo tercatat sebagai <b>Beban (Beban Sewa)</b>, maka AJP mencatat bagian yang <i>belum terpakai (masih tersisa)</i>: <i>Sewa Dibayar di Muka (D), Beban Sewa (K)</i>! <b>Jebakan:</b> Jangan terbalik menghitung porsi waktu pada Sewa Dibayar di Muka: selalu cek apakah awal pencatatannya Harta (pakai bulan yang <i>sudah lewat</i>) atau Beban (pakai bulan yang <i>belum lewat</i>)!","AJP Perlengkapan (sebesar yang TERPAKAI = Awal − Sisa): Beban Perlengkapan (D) / Perlengkapan (K) ; AJP Penyusutan: Beban Penyusutan ... (D) / Akumulasi Penyusutan ... (K) ; AJP Sewa (Pendekatan Harta → catat yang SUDAH lewat): Beban Sewa (D) / Sewa Dibayar di Muka (K) ; AJP Sewa (Pendekatan Beban → catat yang BELUM lewat): Sewa Dibayar di Muka (D) / Beban Sewa (K) ; AJP Beban Terutang: Beban ... (D) / Utang ... (K)",["ajp"]],
["6.5 Kertas Kerja (Worksheet) & Laporan Keuangan","<b>Konsep:</b> Setelah AJP disusun, akuntan menggunakan <b>Kertas Kerja (Neraca Lajur / Worksheet) 10 kolom</b> sebagai alat bantu mengelompokkan akun ke kolom <i>Laba Rugi</i> (hanya akun Nominal: Pendapatan & Beban) dan kolom <i>Neraca</i> (hanya akun Riil: Aset, Liabilitas, Modal Awal, Prive). Dari kertas kerja tersebut, disusun <b>Laporan Keuangan</b> secara berurutan karena output laporan pertama menjadi input laporan berikutnya! <b>Langkah 3 Laporan Keuangan Utama:</b> (1) <b>Laporan Laba Rugi (Income Statement)</b>: membandingkan seluruh <i>Pendapatan</i> dan <i>Beban</i> selama satu periode. Jika Pendapatan > Beban diperoleh <b>Laba Bersih</b>; jika Pendapatan < Beban terjadi <b>Rugi Bersih</b>. (2) <b>Laporan Perubahan Ekuitas / Modal (Statement of Changes in Equity)</b>: menghitung <b>Modal Akhir</b> pemilik dengan rumus: Modal Akhir = Modal Awal + Laba Bersih (atau − Rugi Bersih) − Prive (pengambilan pribadi). Selisih antara Laba Bersih dan Prive disebut <i>Penambahan Modal</i>. (3) <b>Neraca / Laporan Posisi Keuangan (Balance Sheet)</b>: menyajikan posisi <b>Aset</b>, <b>Liabilitas</b>, dan <b>Modal Akhir</b> pada tanggal akhir periode, di mana Total Aset wajib sama dengan Total Liabilitas + Modal Akhir. <b>Jebakan:</b> Dalam menyusun Neraca akhir periode, angka ekuitas yang dimasukkan adalah <b>Modal Akhir</b> (hasil dari Laporan Perubahan Ekuitas), <i>bukan</i> Modal Awal! Dan akun Prive tidak masuk ke Laporan Laba Rugi, melainkan langsung mengurangi Modal di Laporan Perubahan Ekuitas.","1. Laporan Laba Rugi: Laba (Rugi) Bersih = Total Pendapatan − Total Beban ; 2. Laporan Perubahan Ekuitas: Modal Akhir = Modal Awal + Setoran Tambahan + Laba Bersih − Prive ; Tambahan Modal = Laba Bersih − Prive (atau Modal Akhir − Modal Awal) ; 3. Laporan Posisi Keuangan (Neraca): Total Aset (Lancar + Tetap − Akum. Penyusutan) = Total Liabilitas + Modal Akhir",["lapkeu"]],
["6.6 Jurnal Penutup, Neraca Saldo Setelah Penutupan & Akuntansi Dagang Dasar","<b>Konsep:</b> Pada akhir periode akuntansi, seluruh <b>Akun Nominal (Pendapatan, Beban) dan Prive</b> harus dinolkan saldonya agar tidak bercampur dengan perhitungan laba periode berikutnya. Proses ini dilakukan melalui <b>4 Jurnal Penutup (Closing Entries)</b>: (1) Menutup seluruh Pendapatan (saldo normal Kredit → didebit): <i>Pendapatan (D), Ikhtisar Laba Rugi (K)</i>; (2) Menutup seluruh Beban (saldo normal Debit → dikredit): <i>Ikhtisar Laba Rugi (D), Beban-beban (K)</i>; (3) Menutup saldo Ikhtisar Laba Rugi ke Modal: jika <b>Laba</b>, maka Modal bertambah di Kredit: <i>Ikhtisar Laba Rugi (D), Modal (K)</i> (sebaliknya jika Rugi); dan (4) Menutup Prive (mengurangi Modal): <i>Modal (D), Prive (K)</i>. Setelah diposting, tersusunlah <b>Neraca Saldo Setelah Penutupan (NSSP)</b> yang <b>hanya berisi Akun Riil</b> (Aset, Liabilitas, dan Modal Akhir). <b>Pengantar Perusahaan Dagang (Poin TKA):</b> Berbeda dengan perusahaan jasa, perusahaan dagang membeli barang untuk dijual kembali tanpa mengubah bentuk, sehingga memiliki akun <b>Persediaan Barang Dagang, Pembelian, Potongan/Retur Pembelian, Beban Angkut Pembelian</b>, serta menghitung <b>Harga Pokok Penjualan (HPP / Cost of Goods Sold)</b>. <b>Jebakan:</b> Beban Angkut Pembelian menambah Pembelian Bersih (masuk komponen HPP), sedangkan Beban Angkut Penjualan adalah beban operasional pemasaran (tidak masuk rumus HPP)!","Jurnal Penutup: (1) Pendapatan (D) / Ikhtisar L/R (K) · (2) Ikhtisar L/R (D) / Beban (K) ; (3) Saat Laba: Ikhtisar L/R (D) / Modal (K) · (4) Menutup Prive: Modal (D) / Prive (K) ; Pembelian Bersih = Pembelian + Beban Angkut Pembelian − (Retur Pembelian + Potongan Pembelian) ; Penjualan Bersih = Penjualan − (Retur Penjualan + Potongan Penjualan) ; HPP = Persediaan Awal + Pembelian Bersih − Persediaan Akhir ; Laba Kotor = Penjualan Bersih − HPP · Laba Bersih = Laba Kotor − Beban Operasional",["hpp"]]]}];

lapkeu:{t:'Alur Berantai 3 Laporan Keuangan Perusahaan Jasa',sl:[['rev','Total Pendapatan Jasa (juta Rp)',30,120,80,5],['exp','Total Beban Operasional (juta Rp)',20,90,45,5],['m0','Modal Awal (juta Rp)',50,150,100,10],['prv','Prive Pemilik (juta Rp)',0,25,10,5]],
 info:P=>{const laba=P.rev-P.exp,dm=laba-P.prv,ma=P.m0+dm;return `1. Laba Rugi: Laba Bersih = ${P.rev} − ${P.exp} = Rp${laba} jt · 2. Perubahan Ekuitas: Tambahan Modal = ${laba} − ${P.prv} = Rp${dm} jt → Modal Akhir = ${P.m0} + (${dm}) = Rp${ma} jt · 3. Neraca: Aset = Utang (Rp30 jt) + Modal Akhir (Rp${ma} jt) = Rp${30+ma} juta`},
 dr(x,w,h,t,P){const laba=P.rev-P.exp,ma=P.m0+laba-P.prv,bw=(w-68)/3;
 BX(x,20,30,bw,215,12,'#10b98122','#10b981');TX(x,'1. LABA RUGI',32,54,'#10b981','800 12.5px system-ui');
 TX(x,`Pendapatan: +${P.rev}`,32,88);TX(x,`Beban:      −${P.exp}`,32,114);TX(x,`${laba>=0?'Laba':'Rugi'} Bersih:`,32,155,'#10b981','700 12px system-ui');TX(x,`Rp${laba} juta`,32,178,'#10b981','800 15px system-ui');
 AR(x,20+bw,165,28+bw,165,'#f59e0b');
 BX(x,28+bw,30,bw,215,12,'#5b5bf022','#5b5bf0');TX(x,'2. PERUBAHAN MODAL',38+bw,54,'#5b5bf0','800 12px system-ui');
 TX(x,`Modal Awal: ${P.m0}`,38+bw,88);TX(x,`Laba Bersih: +${laba}`,38+bw,114);TX(x,`Prive:       −${P.prv}`,38+bw,140);TX(x,'Modal Akhir:',38+bw,175,'#5b5bf0','700 12px system-ui');TX(x,`Rp${ma} juta`,38+bw,198,'#5b5bf0','800 15px system-ui');
 AR(x,28+2*bw,185,36+2*bw,185,'#f59e0b');
 BX(x,36+2*bw,30,bw,215,12,'#8b5cf622','#8b5cf6');TX(x,'3. NERACA AKHIR',48+2*bw,54,'#8b5cf6','800 12.5px system-ui');
 TX(x,`Liabilitas: 30 jt`,48+2*bw,88);TX(x,`Modal Akhir: ${ma} jt`,48+2*bw,114);TX(x,'Total Aset = Pasiva:',48+2*bw,160,'#8b5cf6','700 11.5px system-ui');TX(x,`Rp${30+ma} juta`,48+2*bw,185,'#8b5cf6','800 15px system-ui')}},

hpp:{t:'Perhitungan HPP, Laba Kotor & Jurnal Penutup Dagang',sl:[['pa','Persediaan Awal (juta Rp)',10,60,30,5],['pb','Pembelian Bersih (Pembelian+Angkut−Retur−Potongan)',40,150,90,10],['pk','Persediaan Akhir (juta Rp)',10,60,25,5],['pj','Penjualan Bersih (juta Rp)',80,220,140,10]],
 info:P=>{const btud=P.pa+P.pb,hpp=btud-P.pk,lk=P.pj-hpp;return `Barang Tersedia Dijual (BTUD) = ${P.pa} + ${P.pb} = Rp${btud} jt · HPP = BTUD − Persediaan Akhir = ${btud} − ${P.pk} = Rp${hpp} juta · Laba Kotor = Penjualan Bersih (${P.pj}) − HPP (${hpp}) = Rp${lk} juta`},
 dr(x,w,h,t,P){const btud=P.pa+P.pb,hpp=btud-P.pk,lk=P.pj-hpp,gx=28,gw=w-56;
 const rows=[['Persediaan Barang Dagang Awal',P.pa,'#0ea5e9'],['(+) Pembelian Bersih (Beli + Angkut − Retur/Pot)',P.pb,'#3b82f6'],['(=) Barang Tersedia untuk Dijual (BTUD)',btud,'#8b5cf6'],['(−) Persediaan Barang Dagang Akhir',-P.pk,'#f59e0b'],['(=) HARGA POKOK PENJUALAN (HPP)',hpp,'#e5484d'],['LABA KOTOR (Penjualan Bersih Rp'+P.pj+' jt − HPP)',lk,lk>=0?'#10b981':'#e5484d']];
 rows.forEach((r,i)=>{const y=20+i*42;BX(x,gx,y,gw,36,8,r[2]+'22',r[2]);TX(x,r[0],gx+12,y+23,FG,i>=4?'800 12.5px system-ui':'600 12px system-ui');TX(x,`Rp${r[1]} juta`,gx+gw-110,y+23,r[2],'800 13px system-ui')})}}
};
const EX={
'0.0':{
 x:["Perhatikan empat pernyataan berikut: (1) BPS mencatat laju inflasi Indonesia tahun 2025 sebesar 2,61%. (2) Kenaikan harga cabai menyebabkan jumlah permintaan cabai di pasar tradisional turun. (3) Pemerintah sebaiknya menaikkan subsidi pupuk agar petani kecil lebih sejahtera. (4) Bank Indonesia menaikkan BI-Rate untuk meredam pelemahan kurs Rupiah. Klasifikasikan pernyataan tersebut ke dalam Ekonomi Deskriptif, Teori Ekonomi (Mikro/Makro), Ekonomi Terapan, serta Ekonomi Positif vs Normatif!","Pernyataan (1) memaparkan data kenyataan ekonomi apa adanya tanpa analisis sebab-akibat → termasuk Ekonomi Deskriptif dan Ekonomi Positif.||Pernyataan (2) menjelaskan hubungan sebab-akibat harga satu komoditas terhadap jumlah yang diminta → termasuk Teori Ekonomi Mikro dan Ekonomi Positif.||Pernyataan (3) memuat kata 'sebaiknya' yang merupakan rekomendasi kebijakan berbasis nilai/etika → termasuk Ekonomi Normatif.||Pernyataan (4) merupakan pemanfaatan teori moneter untuk menyelesaikan masalah praktis stabilitas nilai tukar secara agregat → termasuk Ekonomi Terapan (lingkup Makro).","(1) Deskriptif & Positif; (2) Teori Mikro & Positif; (3) Normatif; (4) Terapan (Makro)."],

  ["Pernyataan 'Pemerintah seharusnya membebaskan pajak penghasilan bagi pekerja berupah minimum agar daya beli meningkat' termasuk pernyataan…",["ekonomi positif","ekonomi deskriptif","ekonomi normatif","ekonomi mikro murni"],2,"Kata 'seharusnya' menunjukkan pertimbangan nilai subjektif tentang apa yang sebaiknya dilakukan (ekonomi normatif)."],

},
'0.1':{
 x:["Di sebuah kota industri terjadi kemarau panjang selama 5 bulan: pasokan air bersih turun 25%, sedangkan konsumsi air naik 10% akibat pertambahan penduduk dan pabrik baru. Pemerintah mempertimbangkan: (A) menaikkan tarif air progresif bagi pemakai besar, (B) edukasi penghematan dan daur ulang air, (C) menghentikan seluruh kegiatan pabrik. Analisis penyebab kelangkaan tersebut dan pilih solusi rasional!","Identifikasi penyebab kelangkaan: keterbatasan pasokan alam (kemarau menurunkan debit 25%) bertemu dengan lonjakan permintaan (+10% akibat pertumbuhan penduduk dan industri).||Evaluasi opsi (A): menaikkan tarif secara progresif mengendalikan permintaan secara langsung sesuai hukum permintaan (solusi jangka pendek yang efektif).||Evaluasi opsi (B): edukasi konservasi dan teknologi daur ulang mengubah perilaku konsumsi jangka menengah-panjang.||Evaluasi opsi (C): menghentikan seluruh pabrik tidak rasional karena mematikan kegiatan ekonomi dan memicu pengangguran masif.","Penyebab: turunnya pasokan alam & naiknya permintaan; solusi tepat adalah kombinasi (A) dan (B) disertai evaluasi berkala."],

  ["Inti masalah ekonomi yang dihadapi manusia sepanjang masa adalah…",["ketidakstabilan kurs mata uang","kelangkaan sumber daya dibanding kebutuhan yang tak terbatas","tingginya tarif pajak penghasilan","kurangnya jumlah uang yang beredar di masyarakat"],1,"Inti masalah ilmu ekonomi (scarcity) adalah kesenjangan antara kebutuhan manusia yang tidak terbatas dengan alat pemuas kebutuhan yang terbatas."],

  ["Bagi seorang pelajar SMA yang memiliki uang saku terbatas, pengeluaran yang harus ditempatkan pada Kuadran I (Penting dan Mendesak) adalah…",["membeli tiket konser musik bulan depan","membayar uang buku cetak ujian dan makan siang hari ini","menabung untuk membeli sepeda motor tahun depan","membeli jaket bermerek yang sedang diskon"],1,"Buku ujian dan makan harian bersifat vital bagi kelangsungan belajar dan harus dipenuhi segera (penting & mendesak)."]

},
'0.2':{
 x:["Rani baru lulus kuliah dan menerima tiga tawaran kerja: di Perusahaan A (gaji Rp6.000.000/bulan), Perusahaan B (gaji Rp7.500.000/bulan), atau Perusahaan C (gaji Rp8.200.000/bulan). Namun Rani memilih membuka usaha kafe sendiri dengan pendapatan kotor Rp25.000.000/bulan dan biaya bahan baku, sewa tempat, serta gaji barista total Rp18.000.000/bulan. Hitunglah: (a) biaya peluang Rani per bulan, (b) laba akuntansi, dan (c) laba ekonomi!","(a) Dari tiga peluang kerja yang dikorbankan (Rp6 juta, Rp7,5 juta, Rp8,2 juta), pilih SATU alternatif terbaik yang dilepas, yaitu bekerja di Perusahaan C = Rp8.200.000/bulan (biaya implisit).||(b) Laba Akuntansi = Total Pendapatan (TR) − Biaya Eksplisit = Rp25.000.000 − Rp18.000.000 = Rp7.000.000/bulan.||(c) Laba Ekonomi = TR − (Biaya Eksplisit + Biaya Implisit) = Rp25.000.000 − (Rp18.000.000 + Rp8.200.000) = −Rp1.200.000/bulan (rugi secara ekonomi karena pendapatannya sebagai pengusaha lebih kecil Rp1,2 juta dibanding bekerja di Perusahaan C).","(a) Biaya peluang Rp8.200.000; (b) Laba akuntansi Rp7.000.000; (c) Laba ekonomi −Rp1.200.000."],

  ["Budi ditawari bekerja di Bank dengan gaji Rp5.000.000, di Asuransi Rp4.500.000, atau di Retail Rp4.000.000. Jika Budi memilih bekerja di Bank, berapa biaya peluangnya?",["Rp8.500.000","Rp5.000.000","Rp4.500.000","Rp4.000.000"],2,"Biaya peluang adalah satu alternatif terbaik yang dikorbankan, yaitu tawaran tertinggi di luar pilihan yang diambil: Rp4.500.000."],
  ["Pada Kurva Kemungkinan Produksi (PPF), titik yang berada di sebelah dalam (di bawah) garis kurva menunjukkan kondisi…",["efisiensi produksi maksimum","ketidakefisienan / adanya sumber daya yang menganggur","kombinasi yang belum dapat dicapai teknologi saat ini","pertumbuhan ekonomi jangka panjang"],1,"Titik di dalam kurva PPF menandakan belum semua faktor produksi terpakai (terjadi pengangguran/pemborosan)."],
  ["Mengapa bentuk kurva PPF umumnya melengkung cekung terhadap titik asal (origin)?",["Karena biaya peluang bersifat konstan","Karena berlakunya hukum biaya peluang yang semakin meningkat (increasing opportunity cost)","Karena sumber daya dapat dipindahkan antarindustri dengan kecocokan yang sama persis","Karena harga barang selalu turun"],1,"Sumber daya bersifat spesifik; memindahkan sumber daya yang makin tidak cocok ke produksi barang lain menuntut pengorbanan yang makin besar."]

 m:["Biaya peluang dari memilih satu pekerjaan adalah jumlah total gaji dari seluruh pekerjaan lain yang ditolak.","Seseorang tidak mungkin bekerja di dua tempat penuh waktu secara bersamaan. Karena hanya satu alternatif terbaik yang sebenarnya bisa dijalani jika pilihan utama batal, maka biaya peluang hanya menghitung satu nilai tertinggi yang dikorbankan.","Biaya peluang = nilai 1 alternatif terbaik yang dilepas, bukan penjumlahan semua alternatif."]
},
'0.3':{
 x:["Sebuah pabrik garmen di Jawa Tengah memutuskan beralih dari penggunaan mesin jahit manual ke mesin potong laser otomatis berbasis komputer untuk menekan limbah kain sebesar 30% dan mempercepat produksi pakaian ekspor bagi pasar dewasa kelas menengah. Identifikasi rincian masalah pokok ekonomi modern (What, How, For Whom) pada kasus tersebut!","What (barang apa yang diproduksi): pakaian kualitas ekspor.||How (bagaimana cara memproduksinya): beralih dari teknik padat karya (mesin manual) ke teknik padat modal/teknologi tinggi (mesin potong laser otomatis) untuk efisiensi bahan baku.||For Whom (untuk siapa barang diproduksi): konsumen dewasa kelas menengah di pasar ekspor.","What = pakaian ekspor; How = mesin potong laser otomatis; For Whom = konsumen dewasa kelas menengah pasar ekspor."],
 z:[
  ["Pertanyaan mengenai apakah proyek jalan desa akan dikerjakan secara padat karya (menyerap warga lokal) atau menggunakan alat berat berkaitan dengan masalah pokok ekonomi…",["What","How","For Whom","When"],1,"How menyangkut metode, teknik produksi, dan kombinasi faktor produksi (padat karya vs padat modal)."],
  ["Ciri utama Sistem Ekonomi Komando (Terpusat) adalah…",["kebebasan penuh individu memiliki alat produksi","persaingan bebas antarpelaku usaha swasta","seluruh faktor produksi dikuasai negara dan harga ditentukan pemerintah pusat","peran pemerintah hanya sebagai pengawas regulasi"],2,"Dalam sistem komando, negara menguasai seluruh faktor produksi dan merencanakan What, How, For Whom secara terpusat."],
  ["Karakteristik Sistem Demokrasi Ekonomi di Indonesia berdasarkan Pasal 33 UUD 1945 adalah…",["perekonomian disusun sebagai usaha bersama berdasar atas asas kekeluargaan","negara menyerahkan cabang produksi vital sepenuhnya kepada mekanisme pasar","hak milik perorangan dihapuskan seluruhnya","persaingan bebas tanpa intervensi negara"],0,"Pasal 33 ayat (1) UUD 1945 menegaskan perekonomian disusun sebagai usaha bersama berdasar atas asas kekeluargaan."]
