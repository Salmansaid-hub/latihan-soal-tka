 m:["Menentukan target pembeli (anak muda atau orang tua) adalah masalah 'What' dalam ekonomi modern.","Masalah 'What' hanya menjawab jenis dan jumlah barang yang diproduksi. Penentuan kelompok sasaran konsumen dan distribusi hasil produksi adalah ranah 'For Whom'.","What = jenis & jumlah barang; How = teknik & kombinasi input; For Whom = sasaran konsumen & distribusi."]
},
'0.4':{
 x:["Dalam perekonomian 4 sektor, jelaskan aliran yang terjadi antara Rumah Tangga Konsumen (RTK) dan Rumah Tangga Produsen (RTP) melalui Pasar Input dan Pasar Output, serta peran Pemerintah dan Masyarakat Luar Negeri!","Di Pasar Input (Faktor Produksi): RTK menyerahkan tanah, tenaga kerja, modal, dan keahlian kepada RTP; sebagai balas jasanya, RTP mengalirkan uang berupa sewa (rent), upah (wage), bunga (interest), dan laba (profit) kepada RTK.||Di Pasar Output (Barang/Jasa): RTP menjual barang dan jasa hasil produksi kepada RTK; RTK mengalirkan uang belanja konsumsi kepada RTP.||Peran Pemerintah (RTN): memungut pajak (individu & badan) dari RTK dan RTP, lalu mengembalikannya dalam bentuk belanja pegawai, subsidi, dan fasilitas publik.||Masyarakat Luar Negeri (MLN): menerima ekspor dari dalam negeri (menghasilkan aliran devisa masuk) dan mengirim barang impor ke dalam negeri (aliran pembayaran devisa keluar).","RTK = pemilik faktor produksi (terima r, w, i, π); RTP = penghasil barang/jasa; RTN = pajak & subsidi; MLN = ekspor & impor."],
 z:[
  ["Dalam diagram arus lingkar (Circular Flow), arus uang yang mengalir dari Rumah Tangga Produsen (RTP) ke Rumah Tangga Konsumen (RTK) melalui pasar input merupakan…",["pembayaran pajak penghasilan","pembelian barang dan jasa konsumsi","pembayaran sewa, upah, bunga, dan laba atas penggunaan faktor produksi","pemberian subsidi pemerintah"],2,"RTP menggunakan faktor produksi milik RTK sehingga membayar balas jasa berupa sewa, upah, bunga, dan laba."],
  ["Siapakah pemilik faktor produksi (tanah, tenaga kerja, modal, kewirausahaan) dalam kegiatan ekonomi?",["Rumah Tangga Produsen (RTP)","Rumah Tangga Konsumen (RTK)","Bank Sentral","Masyarakat Luar Negeri"],1,"Rumah Tangga Konsumen (RTK) adalah pemilik faktor produksi yang menawarkan inputnya kepada perusahaan (RTP)."],
  ["Manakah yang merupakan peran Rumah Tangga Pemerintah (RTN) sebagai pengatur sekaligus konsumen dalam perekonomian?",["Menetapkan kebijakan pajak dan membeli alat tulis kantor untuk kementerian","Mengekspor bahan mentah ke luar negeri","Menciptakan uang giral melalui penyaluran kredit","Menentukan selera konsumen secara paksa"],0,"Menetapkan pajak adalah peran regulator/pengatur, sedangkan membeli perlengkapan kantor kementerian adalah peran konsumen."]
