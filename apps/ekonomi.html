'5.5':{
 x:["UD Berkah Jaya memiliki data akhir tahun: Persediaan Barang Dagang Awal Rp30.000.000; Pembelian Rp85.000.000; Beban Angkut Pembelian Rp5.000.000; Retur Pembelian Rp6.000.000; Potongan Pembelian Rp4.000.000; Persediaan Barang Dagang Akhir Rp25.000.000; Penjualan Bersih Rp135.000.000; Beban Angkut Penjualan Rp3.000.000; dan Beban Gaji Toko Rp12.000.000. Hitunglah: (a) Pembelian Bersih, (b) Harga Pokok Penjualan (HPP), (c) Laba Kotor, dan (d) Laba Bersih Operasional!","(a) Pembelian Bersih = Pembelian + Beban Angkut Pembelian − (Retur + Potongan Pembelian) = 85.000.000 + 5.000.000 − (6.000.000 + 4.000.000) = Rp80.000.000.||(b) Barang Tersedia untuk Dijual (BTUD) = Persediaan Awal + Pembelian Bersih = 30.000.000 + 80.000.000 = Rp110.000.000.||HPP = BTUD − Persediaan Akhir = 110.000.000 − 25.000.000 = Rp85.000.000.||(c) Laba Kotor = Penjualan Bersih − HPP = 135.000.000 − 85.000.000 = Rp50.000.000. (d) Laba Bersih = Laba Kotor − Beban Operasional (Beban Angkut Penjualan + Beban Gaji) = 50.000.000 − (3.000.000 + 12.000.000) = Rp35.000.000.","(a) Pembelian Bersih Rp80 jt; (b) HPP Rp85 jt; (c) Laba Kotor Rp50 jt; (d) Laba Bersih Rp35 jt."],

{e:'☕',t:'Evaluasi Promo Kafe Milenial & Elastisitas Harga',c:1,b:'Kafe Milenial menggelar promo bulan Juni dengan menurunkan harga Es Kopi Susu dari Rp20.000 menjadi Rp15.000 per cup (−25%). Ternyata jumlah penjualan harian melonjak dari 200 cup menjadi 320 cup (+60%). Manajer ingin tahu apakah promo ini menguntungkan secara finansial.',s:[
 ["Hitung koefisien elastisitas harga permintaan (Ed) kopi tersebut!",[["%ΔQ / %ΔP = 60% / 25% = 2,4 (Elastis, Ed > 1)",1,"Karena persentase kenaikan jumlah yang diminta (60%) jauh melebihi persentase penurunan harga (25%), permintaan bersifat elastis."],["Ed = 25% / 60% = 0,42 (Inelastis)",0,"Rumus terbalik: seharusnya %ΔQ dibagi %ΔP."],["Ed = 1 (Uniter)",0,"Persentase perubahan Q dan P tidak sama."]]],
 ["Bandingkan Total Revenue (TR = P × Q) sebelum dan sesudah promo!",[["TR awal = Rp4.000.000/hari; TR promo = Rp4.800.000/hari (TR naik Rp800.000)",1,"20.000 × 200 = Rp4 juta; 15.000 × 320 = Rp4,8 juta. Penurunan harga pada barang elastis berhasil menaikkan total penerimaan!"],["TR turun karena harga per cup lebih murah Rp5.000",0,"Lonjakan volume penjualan (+120 cup) lebih dari cukup untuk menutup penurunan harga per unit."]]],
 ["Apa kesimpulan strategis bagi Kafe Milenial?",[["Promo diskon efektif menaikkan omzet (TR) dan loyalitas pelanggan karena permintaan kopi bersifat elastis",1,"Tepat sesuai soal TKA Pusmendik: pada permintaan elastis, penurunan harga menaikkan TR dan volume penjualan."],["Harga harus dinaikkan ke Rp30.000 agar omzet makin besar",0,"Pada permintaan elastis, menaikkan harga justru membuat konsumen lari ke kafe pesaing dan menurunkan TR."]]]
],k:'Untuk produk dengan permintaan elastis (Ed = 2,4 > 1), strategi promo penurunan harga meningkatkan volume penjualan secara signifikan dan mendongkrak Total Revenue dari Rp4 juta menjadi Rp4,8 juta/hari.'},

{e:'👷',t:'Dilema Pengangguran Struktural & Investasi Daerah',c:2,b:'Data BPS menunjukkan tingkat pengangguran terbuka (TPT) di Provinsi X mencapai 6,75%. Kajian menemukan penyebab utamanya adalah kesenjangan keterampilan lulusan sekolah dengan kebutuhan industri modern serta minimnya akses pembiayaan UMKM lokal.',s:[
 ["Termasuk jenis pengangguran apakah ketidakcocokan keterampilan pencari kerja dengan kebutuhan industri tersebut?",[["Pengangguran Struktural",1,"Ketidaksesuaian keahlian tenaga kerja akibat perubahan struktur dan teknologi industri adalah ciri khas pengangguran struktural."],["Pengangguran Musiman",0,"Pengangguran musiman hanya terjadi karena pergantian musim (seperti petani saat kemarau)."],["Pengangguran Sukarela",0,"Para pencari kerja ini aktif ingin bekerja namun terhalang kualifikasi keahlian."]]],
 ["Mengapa sekadar menaikkan upah minimum secara drastis BUKAN solusi tepat untuk menurunkan angka pengangguran tersebut?",[["Upah minimum yang terlalu tinggi menaikkan beban biaya perusahaan sehingga industri justru menahan rekrutmen tenaga kerja baru",1,"Dalam pasar tenaga kerja, upah di atas keseimbangan memperlebar selisih antara pencari kerja dan lowongan yang tersedia."],["Karena kenaikan upah membuat pekerja berhenti mencari uang",0,"Bukan itu alasannya; masalahnya ada pada daya serap permintaan tenaga kerja oleh perusahaan."]]],
 ["Solusi kebijakan apa yang paling efektif bagi pemerintah daerah?",[["Mendorong investasi lewat insentif pajak/kemudahan izin serta menyediakan pelatihan vokasi dan akses pembiayaan UMKM",1,"Sesuai kunci TKA Pusmendik: insentif investasi memperluas lapangan kerja, sedangkan pelatihan & pembiayaan UMKM meningkatkan kecocokan skill dan wirausaha."],["Mengurangi jam sekolah menjadi 2 hari seminggu",0,"Tidak menyelesaikan kesenjangan keterampilan."]]]
],k:'Pengangguran struktural dan keterbatasan lapangan kerja diselesaikan melalui penyelarasan pelatihan vokasi (link and match), kemudahan investasi daerah, dan pendampingan pembiayaan UMKM.'},

{e:'🏦',t:'Overheating Inflasi 7,5% & Bauran Kebijakan Bank Sentral',c:3,b:'Pada triwulan II, inflasi melonjak ke 7,5% (jauh di atas target 3%) akibat depresiasi Rupiah 12%, lonjakan harga energi global, dan tingginya ekspektasi inflasi. Bank Indonesia harus segera mengambil langkah kebijakan moneter.',s:[
 ["Fungsi utama apa yang sedang dijalankan Bank Indonesia ketika merespons lonjakan inflasi dan pelemahan Rupiah?",[["Pelaksana kebijakan moneter untuk menjaga kestabilan nilai Rupiah (terhadap barang/jasa dan valas)",1,"Kestabilan nilai rupiah mencakup kestabilan harga (inflasi) dan kestabilan nilai tukar (kurs)."],["Lembaga pemungut pajak penghasilan",0,"Pemungutan pajak adalah wewenang Direktorat Jenderal Pajak (Kemenkeu)."],["Penyalur kredit KPR bagi masyarakat",0,"Penyaluran kredit ritel dilakukan oleh Bank Umum, bukan Bank Sentral."]]],
 ["Instrumen Operasi Pasar Terbuka (OPT) dan suku bunga apa yang harus diambil BI?",[["Menaikkan BI-Rate dan MENJUAL Surat Berharga Negara (SBN) di pasar terbuka",1,"Menaikkan BI-Rate mengerem konsumsi/kredit, sedangkan menjual SBN menyerap uang beredar kembali ke Bank Sentral."],["Menurunkan BI-Rate dan MEMBELI SBN",0,"Itu kebijakan ekspansif yang justru menambah jumlah uang beredar dan memperparah inflasi."]]],
 ["Langkah tambahan apa yang diperlukan untuk meredam depresiasi Rupiah sebesar 12%?",[["Melakukan intervensi stabilisasi di pasar valuta asing",1,"Intervensi valas oleh BI menjaga pasokan valas dan meredam gejolak depresiasi nilai tukar yang memicu imported inflation."],["Menurunkan Giro Wajib Minimum (GWM) perbankan",0,"Menurunkan GWM memperbesar uang beredar dan menekan nilai tukar."]]]
],k:'Menghadapi inflasi tinggi dan depresiasi kurs, Bank Indonesia menerapkan kebijakan moneter kontraktif: menaikkan BI-Rate, menjual SBN di pasar terbuka, dan melakukan intervensi stabilisasi di pasar valas.'},

{e:'🚢',t:'Defisit Neraca Perdagangan & Strategi Hilirisasi',c:4,b:'Selama triwulan I, nilai ekspor Indonesia turun 15% akibat melemahnya harga batu bara dan CPO mentah dunia, sementara impor barang konsumsi naik 10%. Akibatnya neraca perdagangan mengalami defisit US$1,2 miliar.',s:[
 ["Mengapa ketergantungan pada ekspor komoditas mentah membuat neraca perdagangan rentan defisit?",[["Harga komoditas mentah sangat fluktuatif mengikuti siklus permintaan global dan nilai tambahnya rendah",1,"Saat ekonomi global melambat, harga bahan mentah anjlok sehingga penerimaan devisa ekspor merosot tajam."],["Karena komoditas mentah tidak bisa diangkut dengan kapal laut",0,"Batu bara dan CPO diangkut dengan kapal, namun nilainya belum diolah."]]],
 ["Mengapa menghentikan seluruh impor barang modal dan bahan baku justru berbahaya bagi industri dalam negeri?",[["Industri manufaktur domestik membutuhkan mesin dan bahan baku penolong untuk berproduksi dan mengekspor",1,"Melarang impor barang modal justru melumpuhkan kapasitas pabrik di dalam negeri."],["Karena barang modal hanya dipakai untuk hiburan",0,"Barang modal adalah mesin dan peralatan produksi."]]],
 ["Kebijakan strategis apa yang paling tepat untuk memperbaiki neraca perdagangan secara berkelanjutan?",[["Meningkatkan hilirisasi dan ekspor produk manufaktur bernilai tambah tinggi serta mengendalikan impor barang konsumsi",1,"Produk manufaktur hasil hilirisasi memiliki harga jual lebih stabil, nilai tambah devisa jauh lebih tinggi, dan menyerap tenaga kerja domestik."],["Menurunkan suku bunga agar masyarakat makin banyak mengimpor barang konsumsi",0,"Meningkatkan impor konsumsi justru memperlebar defisit neraca perdagangan."]]]
],k:'Defisit neraca perdagangan diatasi secara struktural dengan hilirisasi komoditas mentah menjadi produk manufaktur berdaya saing ekspor serta pengendalian impor barang konsumsi non-esensial.'},

{e:'📒',t:'Audit Transaksi & Laporan Keuangan Toko Berkah',c:5,b:'Bapak Rahmat memeriksa catatan transaksi minggu pertama Februari dan laporan tahunan usahanya: (1) Setoran modal awal Rp75 juta, (2) Beli persediaan kredit Rp30 juta, (3) Bayar sewa toko Februari Rp5 juta, (4) Jual barang tunai Rp15 juta (HPP Rp9 juta), (5) Bayar utang usaha Rp10 juta.',s:[
 ["Dari 5 transaksi di atas, transaksi mana saja yang secara langsung mengubah nilai EKUITAS (Modal)?",[["Transaksi (1) setoran modal, (3) beban sewa, dan (4) laba penjualan barang",1,"Setoran modal (+75 jt), beban sewa (−5 jt), dan laba penjualan (+6 jt dari 15 jt − 9 jt) langsung mengubah Ekuitas."],["Transaksi (2) beli kredit dan (5) bayar utang usaha",0,"Beli kredit (+Aset, +Utang) dan bayar utang (−Kas, −Utang) sama sekali tidak mengubah Ekuitas."]]],
 ["Berapa perubahan bersih Ekuitas Bapak Rahmat dari kelima transaksi minggu pertama tersebut?",[["+Rp75 juta − Rp5 juta + (Rp15 juta − Rp9 juta) = +Rp76.000.000",1,"Setoran modal +75 juta, dikurangi beban sewa 5 juta, ditambah laba kotor penjualan 6 juta = Rp76 juta."],["+Rp75 juta + Rp30 juta − Rp10 juta = Rp95.000.000",0,"pembelian kredit dan pelunasan utang bukan komponen pengubah ekuitas."]]],
 ["Jika pada akhir tahun total Pendapatan Rp120 juta, total Beban Rp55 juta, dan Prive Rp15 juta, berapa Laba Bersih dan Tambahan Modalnya?",[["Laba Bersih = Rp65.000.000 dan Tambahan Modal = Rp50.000.000",1,"Laba Bersih = 120 − 55 = Rp65 juta (Prive tidak masuk Laba Rugi). Tambahan Modal = Laba (65 jt) − Prive (15 jt) = Rp50 juta."],["Laba Bersih = Rp50.000.000 karena dikurangi Prive",0,"Prive bukan beban operasional, sehingga tidak mengurangi Laba Bersih di Laporan Laba Rugi."]]]
],k:'Hanya setoran modal, pendapatan/laba penjualan, beban, dan prive yang mengubah Ekuitas. Pembelian kredit dan pelunasan utang hanya mengubah Aset dan Liabilitas.'}

{e:'🌳',t:'Menghitung Biaya Peluang & Laba Ekonomi',c:0,b:'Andi meninggalkan pekerjaannya sebagai analis data bergaji Rp10.000.000/bulan (ia juga sempat ditawari posisi di tempat lain bergaji Rp8.500.000/bulan) demi membuka studio foto. Pendapatan studio Rp30.000.000/bulan dengan biaya sewa, listrik, dan asisten Rp19.000.000/bulan.',s:[
 ["Langkah 1: Berapa biaya peluang (biaya implisit) Andi per bulan?",[["Rp10.000.000 (satu penghasilan terbaik yang dilepas)",1,"Jangan jumlahkan dengan Rp8,5 juta karena Andi hanya bisa menjalani satu pekerjaan penuh waktu."],["Rp18.500.000 (jumlah kedua gaji)",0,"Menjumlahkan semua alternatif adalah kesalahan konsep biaya peluang."]]],
 ["Langkah 2: Hitung Laba Akuntansi studio foto Andi!",[["TR − Biaya Eksplisit = Rp30.000.000 − Rp19.000.000 = Rp11.000.000",1,"Laba akuntansi hanya mengurangi pendapatan dengan pengeluaran uang nyata (biaya eksplisit)."],["Rp30.000.000 − Rp10.000.000 = Rp20.000.000",0,"Itu mengabaikan biaya operasional nyata Rp19 juta."]]],
 ["Langkah 3: Hitung Laba Ekonomi dan simpulkan apakah keputusan Andi menguntungkan!",[["Laba Akuntansi (Rp11 jt) − Biaya Peluang (Rp10 jt) = +Rp1.000.000 → Menguntungkan secara ekonomi!",1,"Karena laba akuntansi (Rp11 juta) lebih besar dari gaji yang dilepas (Rp10 juta), Andi memperoleh laba ekonomi positif Rp1 juta."],["Rugi karena biaya total Rp29 juta",0,"Pendapatan Rp30 juta > Biaya Ekonomi Rp29 juta, jadi tetap untung +Rp1 juta."]]]
],k:'Biaya Peluang = Rp10 juta; Laba Akuntansi = Rp11 juta; Laba Ekonomi = +Rp1 juta (keputusan membuka studio foto rasional dan menguntungkan).'},

{e:'🌳',t:'Menentukan Keseimbangan Pasar Setelah Pajak',c:1,b:'Diketahui fungsi permintaan Qd = 30 − P dan fungsi penawaran Qs = −6 + 2P. Pemerintah mengenakan pajak spesifik sebesar t = Rp3 per unit barang.',s:[
 ["Langkah 1: Bagaimana cara memasukkan pajak t = 3 ke dalam fungsi penawaran Qs = −6 + 2P?",[["Ganti P pada fungsi penawaran dengan (P − 3) sehingga Qs' = −6 + 2(P − 3) = −12 + 2P",1,"Karena pajak mengurangi harga bersih yang diterima produsen, substitusi yang benar pada bentuk Qs adalah (P − t)."],["Tambahkan +3 langsung menjadi Qs' = −6 + 2P + 3",0,"Menambah +t pada Qs berarti penawaran bertambah (itu rumus subsidi atau salah tanda!)."]]],
 ["Langkah 2: Samakan Qd = Qs' untuk mencari harga keseimbangan baru (Pe')!",[["30 − P = −12 + 2P → 42 = 3P → Pe' = 14 dan Qe' = 16",1,"Sebelum pajak: 30 − P = −6 + 2P → Pe = 12, Qe = 18. Setelah pajak: Pe' naik jadi 14 dan Qe' turun jadi 16."],["Pe' = 11 dan Qe' = 19",0,"Pajak selalu membuat harga keseimbangan naik dan kuantitas turun, bukan sebaliknya."]]],
 ["Langkah 3: Berapa beban pajak per unit yang ditanggung konsumen (tk) dan produsen (tp)?",[["tk = Pe' − Pe = 14 − 12 = Rp2/unit; tp = t − tk = 3 − 2 = Rp1/unit",1,"Konsumen menanggung kenaikan harga Rp2/unit, sedangkan produsen menanggung sisanya Rp1/unit."],["Konsumen menanggung seluruhnya Rp3/unit",0,"Harga hanya naik dari 12 ke 14 (+Rp2), bukan ke 15."]]]
],k:'Keseimbangan awal E(18, 12) bergeser menjadi E\'(16, 14); beban pajak konsumen Rp2/unit, produsen Rp1/unit, dan penerimaan pajak pemerintah 3 × 16 = Rp48.'},

{e:'🌳',t:'Menelusuri NNI menuju Disposable Income (DI)',c:2,b:'Diketahui Net National Income (NNI) = Rp900 triliun, Laba ditahan = Rp30 triliun, Pajak perseroan = Rp20 triliun, Iuran jaminan sosial = Rp10 triliun, Transfer payment = Rp40 triliun, dan Pajak langsung (PPh) = Rp35 triliun.',s:[
 ["Langkah 1: Komponen mana yang MENAMBAH dan mana yang MENGURANGI NNI untuk mendapatkan Personal Income (PI)?",[["Tambah Transfer Payment (+40); kurangi Laba Ditahan, Pajak Perseroan, dan Iuran Sosial (−60)",1,"Transfer payment adalah hak yang diterima rumah tangga, sedangkan laba ditahan, pajak perseroan, dan iuran sosial tidak sampai ke tangan rumah tangga."],["Kurangi Transfer Payment dan tambah Laba Ditahan",0,"Terbalik: laba ditahan disimpan perusahaan, sedangkan transfer payment dibagikan ke warga."]]],
 ["Langkah 2: Hitung nilai Personal Income (PI)!",[["PI = 900 + 40 − (30 + 20 + 10) = Rp880 triliun",1,"940 − 60 = Rp880 triliun."],["PI = Rp960 triliun",0,"Lupa mengurangkan laba ditahan, pajak perseroan, dan iuran sosial."]]],
 ["Langkah 3: Hitung Disposable Income (DI) yang siap dibelanjakan rumah tangga!",[["DI = PI − Pajak Langsung = 880 − 35 = Rp845 triliun",1,"Setelah dikurangi PPh Rp35 triliun, diperoleh pendapatan siap pakai (DI) sebesar Rp845 triliun."],["DI = 880 + 35 = Rp915 triliun",0,"Pajak langsung mengurangi pendapatan yang bisa dibelanjakan rumah tangga."]]]
],k:'PI = Rp880 triliun dan Disposable Income (DI) = Rp845 triliun.'},

{e:'🌳',t:'Mengevaluasi Laju Inflasi Tahunan dari Data IHK',c:3,b:'Data BPS menunjukkan IHK suatu kota tercatat 112 pada tahun 2022, naik menjadi 118 pada tahun 2023, dan naik lagi menjadi 125 pada tahun 2024.',s:[
 ["Langkah 1: Rumus apa yang digunakan untuk menghitung laju inflasi tahun 2023 dan 2024?",[["π_t = ((IHK_t − IHK_{t−1}) / IHK_{t−1}) × 100%",1,"Selalu bagi perubahan IHK dengan IHK tahun sebelumnya (t−1), bukan sekadar mengurangkan angkanya."],["π_t = IHK_t − IHK_{t−1}",0,"Selisih indeks bukan persentase inflasi kecuali jika indeks tahun sebelumnya tepat 100."]]],
 ["Langkah 2: Hitung laju inflasi tahun 2023 dan tahun 2024!",[["Inflasi 2023 = (6/112)×100% = 5,36%; Inflasi 2024 = (7/118)×100% = 5,93%",1,"6 dibagi 112 menghasilkan 5,36%, sedangkan 7 dibagi 118 menghasilkan 5,93%."],["Inflasi 2023 = 6% dan Inflasi 2024 = 7%",0,"Itu hanya selisih indeks, belum dibagi dengan IHK tahun dasar pembandingnya."]]],
 ["Langkah 3: Tarik kesimpulan perbandingan yang tepat!",[["Laju inflasi tahun 2024 (5,93%) lebih tinggi dibandingkan tahun 2023 (5,36%)",1,"Sesuai kunci soal resmi TKA Pusmendik: inflasi meningkat dari 5,36% menjadi 5,93%."],["Inflasi menunjukkan tren penurunan",0,"5,93% lebih tinggi daripada 5,36%."]]]
],k:'Inflasi 2023 sebesar 5,36% dan inflasi 2024 sebesar 5,93% — laju inflasi tahun 2024 lebih tinggi dibanding tahun 2023.'},

{e:'🌳',t:'Memilih Kurs Jual vs Kurs Beli Valuta Asing',c:4,b:'Seorang importir mesin harus membayar tagihan ke Jepang sebesar ¥1.000.000, sementara di hari yang sama seorang TKI yang baru pulang dari Jepang menukarkan gajinya sebesar ¥500.000 ke Rupiah. Papan kurs bank menunjukkan: Kurs Beli ¥1 = Rp104 dan Kurs Jual ¥1 = Rp108.',s:[
 ["Langkah 1: Dari sudut pandang siapa istilah Kurs Jual dan Kurs Beli ditetapkan?",[["Dari sudut pandang Bank / Money Changer (Kurs Jual selalu lebih mahal dari Kurs Beli)",1,"Bank membeli valas dengan harga murah (Kurs Beli) dan menjualnya dengan harga lebih tinggi (Kurs Jual)."],["Dari sudut pandang nasabah",0,"Jika dilihat dari sisi nasabah pasti akan terbalik."]]],
 ["Langkah 2: Kurs mana yang dipakai untuk Importir (Rp → Yen) dan TKI (Yen → Rp)?",[["Importir membeli Yen dari bank → pakai Kurs Jual (Rp108); TKI menjual Yen ke bank → pakai Kurs Beli (Rp104)",1,"Saat nasabah butuh Yen, bank menjual Yen (Kurs Jual). Saat nasabah menyerahkan Yen, bank membeli Yen (Kurs Beli)."],["Keduanya memakai rata-rata Rp106",0,"Transaksi pertukaran nyata di bank menggunakan kurs jual atau kurs beli, bukan kurs tengah."]]],
 ["Langkah 3: Hitung Rupiah yang harus dibayar Importir dan yang diterima TKI!",[["Importir membayar Rp108.000.000; TKI menerima Rp52.000.000",1,"1.000.000 × 108 = Rp108 juta; 500.000 × 104 = Rp52 juta."],["Importir membayar Rp104.000.000; TKI menerima Rp54.000.000",0,"Tertukar antara Kurs Jual dan Kurs Beli."]]]
],k:'Importir menggunakan Kurs Jual (membayar Rp108 juta) dan TKI menggunakan Kurs Beli (menerima Rp52 juta).'},

{e:'🌳',t:'Menyusun Laporan Keuangan dari Persamaan Akuntansi',c:5,b:'Salon Cantika memiliki Modal Awal Rp60.000.000. Selama tahun berjalan memperoleh Pendapatan Jasa Rp85.000.000, membayar Beban Gaji Rp20.000.000, Beban Sewa Rp10.000.000, pemakaian perlengkapan Rp5.000.000, serta pemilik mengambil uang pribadi (Prive) Rp8.000.000. Utang akhir tahun tercatat Rp18.000.000.',s:[
 ["Langkah 1: Hitung Laba Bersih pada Laporan Laba Rugi!",[["Pendapatan (Rp85 jt) − Total Beban (Rp20 jt + Rp10 jt + Rp5 jt) = Rp50.000.000",1,"Ingat: Prive Rp8 juta dan Modal Awal Rp60 juta TIDAK masuk ke Laporan Laba Rugi!"],["Rp85 jt − Rp35 jt − Rp8 jt (Prive) = Rp42.000.000",0,"Prive bukan beban operasional sehingga tidak boleh dikurangkan pada Laporan Laba Rugi."]]],
 ["Langkah 2: Hitung Modal Akhir pada Laporan Perubahan Ekuitas!",[["Modal Awal (Rp60 jt) + Laba Bersih (Rp50 jt) − Prive (Rp8 jt) = Rp102.000.000",1,"Tambahan modal bersih adalah Rp50 juta − Rp8 juta = Rp42 juta, sehingga Modal Akhir menjadi Rp102 juta."],["Rp60 jt + Rp50 jt = Rp110.000.000",0,"Lupa mengurangkan Prive Rp8 juta pada Laporan Perubahan Ekuitas."]]],
 ["Langkah 3: Hitung Total Aset pada Neraca (Laporan Posisi Keuangan) akhir tahun!",[["Total Aset = Liabilitas (Rp18 jt) + Modal Akhir (Rp102 jt) = Rp120.000.000",1,"Persamaan Neraca menggunakan Modal Akhir (Rp102 juta), bukan Modal Awal."],["Total Aset = Rp18 jt + Rp60 jt (Modal Awal) = Rp78.000.000",0,"Menggunakan Modal Awal di Neraca akhir periode akan membuat Neraca tidak seimbang."]]]
],k:'Laba Bersih = Rp50 juta → Modal Akhir = Rp102 juta → Total Aset di Neraca = Rp120 juta.'}
];

const HT=[
{id:'h1',c:0,t:'Ekspansi Industri & Biaya Sosial (Model Pusmendik #1)',q:'Sebuah kota kecil berkembang pesat akibat tumbuhnya industri manufaktur: penyerapan tenaga kerja dan daya beli perdagangan meningkat, namun kemacetan, polusi, serta harga tanah/hunian ikut melonjak. Kesimpulan analitis manakah yang paling tepat?',o:['Kegiatan industri harus dihentikan seluruhnya karena memicu kemacetan dan kenaikan harga tanah','Perkembangan ekonomi selalu meningkatkan kesejahteraan tanpa menimbulkan biaya sosial','Peningkatan aktivitas ekonomi menciptakan lapangan kerja sekaligus tantangan eksternalitas yang harus dikelola lewat kebijakan tata ruang dan lingkungan','Daya beli masyarakat pasti turun drastis karena tumbuhnya sektor perdagangan'],a:2,e:'Sesuai soal resmi TKA Pusmendik: pertumbuhan industri membawa dampak positif (lapangan kerja & daya beli) sekaligus eksternalitas negatif (polusi & harga hunian) yang harus dikelola dengan kebijakan publik yang tepat, bukan dihentikan.'},
{id:'h2',c:0,t:'Keputusan Bisnis & Laba Ekonomi',q:'Dokter Dina yang semula bekerja di rumah sakit dengan gaji Rp15.000.000/bulan memutuskan resign untuk membuka klinik sendiri di ruko miliknya (yang jika disewakan ke orang lain laku Rp5.000.000/bulan). Pendapatan klinik Rp45.000.000/bulan dengan biaya obat, listrik, dan gaji perawat Rp22.000.000/bulan. Berapa Laba Ekonomi klinik Dokter Dina?',o:['Rp23.000.000/bulan','Rp8.000.000/bulan','Rp3.000.000/bulan','−Rp2.000.000/bulan'],a:2,e:'Laba Akuntansi = 45 juta − 22 juta (biaya eksplisit) = Rp23 juta. Biaya implisit (biaya peluang) mencakup gaji dokter yang dilepas (Rp15 juta) + sewa ruko milik sendiri yang dikorbankan (Rp5 juta) = Rp20 juta. Maka Laba Ekonomi = 23 juta − 20 juta = Rp3.000.000/bulan.'},
{id:'h3',c:1,t:'Keseimbangan Pasar Tomat (Model Pusmendik #3)',q:'Daftar harga tomat di Pasar Kota B: saat harga Rp9.000/kg, jumlah permintaan 800 kg dan penawaran 1.000 kg. Saat harga naik menjadi Rp10.000/kg, permintaan turun menjadi 600 kg dan penawaran naik menjadi 1.200 kg. Titik keseimbangan pasar (Qe ; Pe) adalah…',o:['600 kg ; Rp10.000','800 kg ; Rp9.000','900 kg ; Rp8.500','1.000 kg ; Rp8.000'],a:2,e:'Setiap penurunan harga Rp1.000 menaikkan Qd sebesar 200 kg (Qd = 2.600 − 0,2P) dan menurunkan Qs sebesar 200 kg (Qs = −800 + 0,2P). Saat Qd = Qs: 2.600 − 0,2P = −800 + 0,2P → 3.400 = 0,4P → Pe = Rp8.500 dan Qe = 900 kg.'},
{id:'h4',c:1,t:'Pergeseran Ganda Permintaan & Penawaran',q:'Menjelang tahun ajaran baru, permintaan buku tulis meningkat tajam sementara pada saat yang sama harga bubur kertas (bahan baku buku) dunia turun drastis berkat teknologi daur ulang baru. Apa yang pasti terjadi pada keseimbangan pasar buku tulis?',o:['Harga keseimbangan pasti naik, kuantitas belum tentu','Kuantitas keseimbangan (Qe) pasti meningkat, sedangkan perubahan harga (Pe) bergantung pada besaran pergeseran D dan S','Kuantitas keseimbangan pasti turun drastis','Baik harga maupun kuantitas keseimbangan tidak berubah'],a:1,e:'Permintaan naik (kurva D geser ke kanan: Q↑, P↑) dan penawaran naik karena biaya bahan baku turun (kurva S geser ke kanan: Q↑, P↓). Kedua pergeseran sama-sama mendorong kuantitas (Qe) NAIK, sedangkan harga (Pe) tergantung mana yang bergeser lebih besar.'},
{id:'h5',c:2,t:'Perbandingan Pendapatan Per Kapita (Model Pusmendik #4)',q:'Tahun 2023: Negara Astina memiliki Pendapatan Nasional Rp283.300 miliar (penduduk 51 juta); Negara Alengka Rp326.600 miliar (penduduk 31 juta); Negara Amarta Rp917.700 miliar (penduduk 255,5 juta). Kesimpulan yang tepat adalah…',o:['Negara Amarta memiliki pendapatan per kapita tertinggi karena pendapatan nasionalnya paling besar','Negara Alengka memiliki pendapatan per kapita tertinggi (≈Rp10,54 juta), disusul Negara Astina (≈Rp5,55 juta), dan Negara Amarta (≈Rp3,59 juta)','Urutan pendapatan per kapita tertinggi adalah Astina, Alengka, lalu Amarta','Pendapatan per kapita ketiga negara sama besar'],a:1,e:'IPC Alengka = 326.600/31 ≈ Rp10,54 juta; IPC Astina = 283.300/51 ≈ Rp5,55 juta; IPC Amarta = 917.700/255,5 ≈ Rp3,59 juta. Meskipun PDB total Amarta terbesar, penduduknya sangat banyak sehingga IPC-nya terendah.'},
{id:'h6',c:2,t:'Efek Angka Pengganda (Multiplier) Investasi',q:'Dalam suatu perekonomian diketahui fungsi tabungan S = −100 + 0,2Y (dalam triliun rupiah) dan investasi awal I = Rp60 triliun. Jika investasi swasta meningkat menjadi Rp100 triliun, maka pendapatan nasional keseimbangan akan berubah dari…',o:['Rp800 triliun menjadi Rp1.000 triliun (naik Rp200 triliun)','Rp500 triliun menjadi Rp540 triliun (naik Rp40 triliun)','Rp600 triliun menjadi Rp800 triliun','Rp1.000 triliun menjadi Rp1.200 triliun'],a:0,e:'Keseimbangan awal (S = I): −100 + 0,2Y = 60 → 0,2Y = 160 → Y₁ = Rp800 triliun. Angka pengganda k = 1/MPS = 1/0,2 = 5. Tambahan investasi ΔI = 100 − 60 = Rp40 triliun menghasilkan ΔY = 5 × 40 = Rp200 triliun, sehingga Y₂ = Rp1.000 triliun.'},
{id:'h7',c:3,t:'Analisis Tren Laju Inflasi IHK (Model Pusmendik #17)',q:'BPS mencatat IHK suatu wilayah sebesar 112 pada tahun 2022, meningkat menjadi 118 pada tahun 2023, dan menjadi 125 pada tahun 2024. Pernyataan yang tepat mengenai perkembangan laju inflasi wilayah tersebut adalah…',o:['Laju inflasi tahun 2023 (5,36%) lebih tinggi daripada tahun 2024 (5,00%)','Laju inflasi tahun 2024 (5,93%) lebih tinggi dibandingkan tahun 2023 (5,36%)','Inflasi tahun 2023 dan 2024 menunjukkan tren penurunan','Laju inflasi tahun 2023 mencapai tepat 6,00% dan tahun 2024 tepat 7,00%'],a:1,e:'Inflasi 2023 = ((118 − 112)/112) × 100% = 5,36%. Inflasi 2024 = ((125 − 118)/118) × 100% = 5,93%. Jadi inflasi tahun 2024 lebih tinggi dibandingkan tahun 2023.'},
{id:'h8',c:3,t:'Sinkronisasi Kebijakan Moneter & Fiskal',q:'Ketika suatu negara menghadapi stagflasi ringan yang didominasi lonjakan inflasi permintaan serta pelemahan kurs mata uang, kombinasi kebijakan moneter dan fiskal kontraktif yang selaras untuk meredam gejolak harga adalah…',o:['BI menurunkan BI-Rate dan Pemerintah menaikkan belanja infrastruktur','BI menaikkan BI-Rate & menjual SBN di pasar terbuka, sedangkan Pemerintah mengefisienkan belanja & mengoptimalkan penerimaan pajak','BI menurunkan GWM dan Pemerintah memberikan pemotongan pajak konsumsi','BI membeli SBN dan Pemerintah mencetak uang baru'],a:1,e:'Moneter kontraktif (naikkan BI-Rate, jual SBN, naikkan GWM) dan fiskal kontraktif (tahan belanja non-prioritas, optimalkan pajak) bekerja searah mengerem kelebihan permintaan agregat dan menjaga stabilitas nilai tukar.'},
{id:'h9',c:4,t:'SHU Koperasi & Perdagangan Internasional',q:'Koperasi Mandiri membukukan SHU Rp60.000.000 (alokasi Jasa Modal 20% dan Jasa Usaha 30%). Total simpanan pokok+wajib koperasi Rp80.000.000 dan total penjualan koperasi Rp150.000.000. Pak Budi memiliki simpanan pokok+wajib Rp4.000.000, simpanan sukarela Rp6.000.000, dan belanja di koperasi Rp15.000.000. Berapa SHU yang diterima Pak Budi?',o:['Rp2.400.000','Rp3.300.000','Rp1.800.000','Rp600.000'],a:0,e:'Abaikan simpanan sukarela! Jasa Modal = (4 juta / 80 juta) × (20% × 60 juta) = 0,05 × 12 juta = Rp600.000. Jasa Usaha = (15 juta / 150 juta) × (30% × 60 juta) = 0,10 × 18 juta = Rp1.800.000. Total SHU Pak Budi = Rp600.000 + Rp1.800.000 = Rp2.400.000.'},
{id:'h10',c:5,t:'Laporan Keuangan & Persamaan Akuntansi (Model Pusmendik #15)',q:'PT Sejahtera Makmur per 31 Desember memiliki data: Modal Awal Rp120.000.000, Pendapatan Jasa Rp95.000.000, Pendapatan Bunga Rp3.000.000, Beban Gaji Rp18.000.000, Beban Sewa Rp9.000.000, Beban Perlengkapan Rp6.000.000, dan Prive Rp7.000.000. Berapakah Laba Bersih dan Modal Akhir perusahaan?',o:['Laba Bersih Rp58.000.000 dan Modal Akhir Rp178.000.000','Laba Bersih Rp65.000.000 dan Modal Akhir Rp178.000.000','Laba Bersih Rp65.000.000 dan Modal Akhir Rp185.000.000','Laba Bersih Rp72.000.000 dan Modal Akhir Rp192.000.000'],a:1,e:'Total Pendapatan = 95 + 3 = Rp98 juta. Total Beban = 18 + 9 + 6 = Rp33 juta (Prive tidak masuk Laba Rugi!). Laba Bersih = 98 − 33 = Rp65.000.000. Modal Akhir = Modal Awal (120 jt) + Laba Bersih (65 jt) − Prive (7 jt) = Rp178.000.000.'}
];

function post(){const t=$('fx').value.trim(),nm=($('fn').value||'').trim()||'Pelajar TKA';if(!t)return;FD.unshift({id:'d'+Date.now(),sk:$('ft').value,kind:$('fk').value,text:t,uid:nm,ts:Date.now(),likes:[]});svFD();$('fx').value='';$('fm').textContent='Catatan berhasil ditambahkan ✓';drawF()}
function reply(id){const el=$('r_'+id),t=el.value.trim(),p=FD.find(x=>x.id==id);if(!t||!p)return;FD.push({id:'r'+Date.now(),sk:p.sk,kind:'↩️ Balasan',text:t,uid:'Pelajar TKA',ts:Date.now(),parent:id,likes:[]});svFD();el.value='';drawF()}
function like(id){const p=FD.find(x=>x.id==id);if(!p)return;p.likes=p.likes||[];if(p.likes.includes('me'))p.likes=p.likes.filter(u=>u!='me');else p.likes.push('me');svFD();drawF()}
function drawF(){if(!$('fl'))return;const lab=k=>{const [i,j]=k.split('.');return CH[i]&&CH[i].S[j]?num(CH[i].S[j])+' '+ttl(CH[i].S[j]):'Umum'},th=FD.filter(p=>!p.parent&&(ftopic=='all'||p.sk==ftopic));
 $('fl').innerHTML=th.length?th.map(p=>{const rs=FD.filter(r=>r.parent==p.id).sort((a,b)=>a.ts-b.ts);return `<div class="card"><small class="mu">${esc(p.kind)} · <b>${esc(lab(p.sk))}</b> · oleh ${esc(p.uid||'Pelajar')}</small><p style="white-space:pre-wrap;margin:8px 0">${esc(p.text)}</p>${rs.map(r=>`<div class="rp"><small>${esc(r.uid||'Pelajar')}</small><div style="white-space:pre-wrap">${esc(r.text)}</div></div>`).join('')}<div class="frm"><input id="r_${p.id}" placeholder="Tulis balasan atau tanggapan…" maxlength="500"><button onclick="reply('${p.id}')">Balas</button><button onclick="like('${p.id}')">👍 ${(p.likes||[]).length}</button><button onclick="go(${p.sk.split('.')[0]},${p.sk.split('.')[1]})">📘 Buka Materi</button></div></div>`}).join(''):'<div class="card mu">Belum ada diskusi untuk topik ini. Jadilah yang pertama membagikan alur berpikirmu!</div>'}

function tog(i,j,b){const k=i+'.'+j;DN[k]=!DN[k];sv();b.classList.toggle('y',!!DN[k]);b.textContent=DN[k]?'✅ Sudah paham sub-bab ini':'⬜ Tandai sudah paham';side();const sn=document.querySelectorAll('.sn')[j];if(sn){const e=sn.querySelector('em');if(e)e.remove();if(DN[k])sn.insertAdjacentHTML('beforeend','<em>✓</em>')}}
$('q').oninput=e=>{const v=e.target.value.toLowerCase().trim().replace(/[<>&]/g,'');if(!v){view=='ch'?go(cur,sub):home();return}
 const r=CH.flatMap((c,i)=>c.S.map((s,j)=>[c,i,s,j])).filter(r=>(r[2][0]+r[2][1]+r[2][2]).toLowerCase().includes(v));
 $('m').innerHTML=`<h2 class="st">🔎 Hasil Pencarian untuk “${esc(v)}” (${r.length} Sub-Bab ditemukan)</h2>`+(r.length?`<div class="rg">${r.map(r=>`<button class="rc2" style="--c:${r[0].c}" onclick="go(${r[1]},${r[3]})"><small>${r[0].e} Bab ${r[1]+1} · ${r[0].n}</small><b>${r[2][0]}</b><span>${r[2][2].split(' ; ').slice(0,2).map(f=>f.split(' — ')[0]).join('  ·  ')}</span></button>`).join('')}</div>`:'<p>Tidak ditemukan. Coba kata kunci lain seperti “kelangkaan”, “elastisitas”, “pajak”, “inflasi”, “BI-Rate”, “SHU”, “kurs”, atau “persamaan akuntansi”.</p>')};

const THS=[['auto','🌓','Otomatis'],['terang','☀️','Terang'],['gelap','🌙','Gelap'],['laut','🌊','Laut'],['hutan','🌿','Hutan'],['senja','🌅','Senja'],['neon','🔮','Neon']];
function setTh(n){TH=n;n=='auto'?document.documentElement.removeAttribute('data-skin'):document.documentElement.setAttribute('data-skin',n);try{localStorage.setItem('ekoTh',n)}catch(e){}$('thp').innerHTML=THS.map(t=>`<button class="${t[0]==n?'on':''}" onclick="setTh('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('')+layoutHTML();setTimeout(()=>{document.querySelectorAll('.vzh').forEach(e=>e.dataset.m='');mountAll()},60)}
$('thb').onclick=()=>$('thp').classList.toggle('open');document.addEventListener('click',e=>{if(!e.target.closest('.thw'))$('thp').classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeMenu();if(!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)&&e.key=='m')openMenu();if(view!='ch')return;if(/INPUT|TEXTAREA/.test(e.target.tagName)&&e.target.type!='range')return;if(e.key=='ArrowRight'&&sub<CH[cur].S.length-1)go(cur,sub+1);if(e.key=='ArrowLeft'&&sub>0)go(cur,sub-1)});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{document.querySelectorAll('.vzh').forEach(e=>e.dataset.m='');mountAll()},300)});
document.body.classList.toggle('fokus',LY=='fokus');document.body.style.fontSize=17*FS+'px';$('menu').onclick=e=>{if(e.target.id=='menu')closeMenu()};__tkaBalance('ekoHT');setTh(TH);home();
