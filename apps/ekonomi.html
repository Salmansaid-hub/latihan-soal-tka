 m:["Perusahaan (RTP) adalah pemilik faktor produksi karena perusahaanlah yang memiliki pabrik dan mempekerjakan karyawan.","Dalam teori ekonomi mikro-makro, seluruh faktor produksi pada hakikatnya dimiliki oleh individu/rumah tangga (RTK) yang menyewakan tanah, menjual jasa tenaga kerja, dan menanamkan modalnya ke perusahaan.","RTK = pemilik/penjual faktor produksi di pasar input; RTP = pembeli/pengguna faktor produksi."]
},
'0.5':{
 x:["Seorang konsumen mengonsumsi bakso. Kepuasan total (TU) dari mangkuk ke-1 hingga ke-4 berturut-turut adalah: 20 util, 35 util, 43 util, dan 43 util; pada mangkuk ke-5 TU turun menjadi 38 util. Hitung Marginal Utility (MU) tiap mangkuk, tentukan pada mangkuk ke berapa tercapai titik jenuh, serta hitung laba maksimum produsen jika diketahui fungsi biaya TC = 100 + 20Q + Q² dan harga jual bakso tetap P = Rp60 (dalam ribuan)!","Hitung MU = ΔTU/ΔQ: mangkuk ke-1 MU₁ = 20; ke-2 MU₂ = 35 − 20 = 15; ke-3 MU₃ = 43 − 35 = 8; ke-4 MU₄ = 43 − 43 = 0; ke-5 MU₅ = 38 − 43 = −5.||Titik jenuh (satiation point) tercapai saat MU = 0 dan TU maksimum (43 util), yaitu pada mangkuk ke-4.||Untuk produsen: TR = P × Q = 60Q sehingga MR = TR' = 60. Biaya marjinal MC = TC' = 20 + 2Q.||Syarat laba maksimum MR = MC → 60 = 20 + 2Q → 2Q = 40 → Q* = 20 unit. Laba maksimum π = TR − TC = 60(20) − (100 + 400 + 400) = 1.200 − 900 = Rp300 ribu.","MU = 20, 15, 8, 0, −5; titik jenuh pada mangkuk ke-4; laba maksimum produsen Rp300 ribu pada Q = 20."],
 z:[
  ["Bunyi Hukum Gossen I adalah…",["manusia berusaha memenuhi beragam kebutuhannya sampai tingkat intensitas yang sama","jika konsumsi suatu barang dilakukan terus-menerus, tambahan kepuasan (MU) akan makin menurun hingga akhirnya nol","jika harga naik maka permintaan turun","tambahan input variabel akhirnya menurunkan produk marjinal"],1,"Hukum Gossen I (Law of Diminishing Marginal Utility) menyatakan tambahan kepuasan (MU) terus menurun seiring bertambahnya unit yang dikonsumsi."],
  ["Konsumen mengonsumsi barang X (Px = Rp2.000) dan barang Y (Py = Rp4.000). Jika MUx saat ini = 30 util, maka keseimbangan konsumen (kepuasan maksimum) tercapai saat MUy sebesar…",["15 util","30 util","60 util","120 util"],2,"Syarat kepuasan maksimum (Gossen II): MUx/Px = MUy/Py → 30/2.000 = MUy/4.000 → MUy = 60 util."],
  ["Perusahaan memperoleh laba maksimum apabila berproduksi pada tingkat output di mana…",["TR = TC","MR = MC","AC = MC","FC = VC"],1,"Laba maksimum (atau rugi minimum) selalu dicapai pada saat penerimaan marjinal sama dengan biaya marjinal (MR = MC)."]
 ],
 m:["Laba maksimum perusahaan selalu tercapai ketika jumlah penjualan (TR) paling besar.","TR maksimum hanya berarti omzet tertinggi (saat MR = 0), tetapi belum memperhitungkan biaya produksi (TC) yang ikut membengkak. Jika tambahan biaya (MC) lebih besar dari tambahan omzet (MR), laba justru tergerus.","Laba maksimum (π = TR − TC) tercapai tepat saat MR = MC."]
},

'1.0':{
 x:["Daftar harga tomat di pasar tradisional Kota B: saat harga Rp9.000/kg jumlah permintaan 800 kg, sedangkan saat harga naik menjadi Rp10.000/kg jumlah permintaan turun menjadi 600 kg. Susunlah fungsi permintaannya dalam bentuk Qd = f(P) dan Pd = f(Q), lalu tentukan jumlah permintaan jika harga Rp8.500/kg!","Diketahui: P₁ = 9.000, Q₁ = 800; P₂ = 10.000, Q₂ = 600. Jadi ΔP = +1.000 dan ΔQ = −200.||Kemiringan b = ΔQ/ΔP = −200 / 1.000 = −0,2.||Substitusi ke Q − Q₁ = b(P − P₁): Q − 800 = −0,2(P − 9.000) → Q − 800 = −0,2P + 1.800 → Qd = 2.600 − 0,2P.||Dalam bentuk Pd: 0,2P = 2.600 − Q → Pd = 13.000 − 5Q. Saat P = 8.500 → Qd = 2.600 − 0,2(8.500) = 2.600 − 1.700 = 900 kg.","Qd = 2.600 − 0,2P (atau Pd = 13.000 − 5Q); pada P = Rp8.500 permintaan 900 kg."],
 z:[
  ["Faktor apakah yang menyebabkan terjadinya pergerakan di sepanjang kurva permintaan (movement along the demand curve) tanpa menggeser kurva?",["Kenaikan pendapatan masyarakat","Perubahan harga barang itu sendiri","Perubahan harga barang substitusi","Pertambahan jumlah penduduk"],1,"Perubahan harga barang itu sendiri hanya menggerakkan titik di sepanjang kurva permintaan yang sama; faktor selain harga menggeser kurva."],
  ["Apabila harga bahan bakar minyak (BBM) naik signifikan, bagaimana dampaknya terhadap kurva permintaan sepeda motor berbahan bakar bensin?",["Bergeser ke kanan","Bergeser ke kiri","Bergerak sepanjang kurva ke atas","Tetap tidak berubah"],1,"BBM dan motor bensin adalah barang komplementer. Kenaikan harga BBM menurunkan permintaan motor bensin pada setiap tingkat harga (kurva D bergeser ke kiri)."],
  ["Saat harga jeruk Rp15.000/kg permintaan 100 kg; saat harga Rp20.000/kg permintaan 80 kg. Fungsi permintaannya adalah…",["Qd = 160 − 0,004P","Qd = 160 + 0,004P","Qd = 100 − 0,004P","Qd = 200 − 0,005P"],0,"ΔQ/ΔP = −20/5.000 = −0,004. Q − 100 = −0,004(P − 15.000) → Qd = 160 − 0,004P."]
 ],
 m:["Ketika harga kopi turun sehingga pembeli kopi bertambah, maka kurva permintaan kopi bergeser ke kanan.","Penurunan harga kopi hanya mengubah jumlah yang diminta (quantity demanded), yang digambarkan sebagai pergerakan titik ke kanan bawah di sepanjang kurva permintaan yang sama.","Perubahan harga barang itu sendiri = gerakan sepanjang kurva; perubahan faktor non-harga (pendapatan, selera, harga barang terkait) = pergeseran kurva."]
},
'1.1':{
 x:["Pada saat harga sepatu Rp100.000/pasang, produsen bersedia menawarkan 200 pasang. Ketika harga naik menjadi Rp150.000/pasang, penawaran meningkat menjadi 400 pasang. Tentukan fungsi penawarannya dan hitung harga terendah di mana produsen tidak lagi menawarkan sepatu (Qs = 0)!","Diketahui: P₁ = 100.000, Q₁ = 200; P₂ = 150.000, Q₂ = 400. Maka ΔP = 50.000 dan ΔQ = 200.||Gradien b = ΔQ/ΔP = 200 / 50.000 = 0,004 (bertanda positif sesuai hukum penawaran).||Q − 200 = 0,004(P − 100.000) → Q − 200 = 0,004P − 400 → Qs = −200 + 0,004P.||Saat Qs = 0: 0 = −200 + 0,004P → P = 200 / 0,004 = Rp50.000.","Qs = −200 + 0,004P (atau Ps = 50.000 + 250Q); harga minimum saat Qs = 0 adalah Rp50.000."],
 z:[
  ["Manakah di antara fungsi berikut yang merupakan fungsi penawaran yang benar?",["Qs = 500 − 2P","Ps = 10.000 − 4Q","Qs = −100 + 0,5P","Q + 3P = 600"],2,"Fungsi penawaran memiliki hubungan positif antara P dan Q (koefisien P terhadap Q bertanda positif)."],
  ["Kemajuan teknologi mesin pertanian yang memangkas biaya panen padi sebesar 40% akan berdampak pada…",["pergeseran kurva penawaran beras ke kanan","pergeseran kurva penawaran beras ke kiri","pergeseran kurva permintaan beras ke kiri","kenaikan harga keseimbangan beras"],0,"Efisiensi teknologi dan penurunan biaya produksi meningkatkan penawaran pada setiap tingkat harga sehingga kurva S bergeser ke kanan."],
  ["Jika pemerintah mencabut subsidi pupuk bagi petani cabai, maka yang terjadi pada pasar cabai adalah…",["kurva penawaran cabai bergeser ke kanan","kurva penawaran cabai bergeser ke kiri sehingga harga keseimbangan naik","kurva permintaan cabai bergeser ke kanan","harga keseimbangan cabai turun"],1,"Pencabutan subsidi menaikkan biaya produksi petani sehingga kurva penawaran S bergeser ke kiri dan harga pasar naik."]
 ],
 m:["Fungsi Qs = −100 + 2P salah karena memiliki tanda minus di depan angka 100.","Yang menentukan apakah suatu fungsi adalah permintaan atau penawaran bukanlah tanda konstanta a, melainkan tanda gradien b (koefisien variabel P). Konstanta −100 pada Qs hanya berarti produsen baru mulai menawarkan barang setelah harga melewati P = 50.","Cek tanda koefisien P dan Q: jika searah (Q = a + bP dengan b > 0) pasti fungsi penawaran."]
},
'1.2':{
 x:["Diketahui fungsi permintaan beras di suatu daerah Qd = 1.600 − 0,1P dan fungsi penawarannya Qs = −200 + 0,1P. (a) Tentukan harga dan kuantitas keseimbangan pasar! (b) Jika pemerintah menetapkan Harga Eceran Tertinggi (HET) sebesar Rp8.000/kg, apa yang terjadi dan berapa selisihnya?","(a) Syarat keseimbangan Qd = Qs: 1.600 − 0,1P = −200 + 0,1P → 1.800 = 0,2P → Pe = Rp9.000/kg.||Substitusi Pe = 9.000: Qe = 1.600 − 0,1(9.000) = 1.600 − 900 = 700 kg.||(b) Saat HET ditetapkan P = Rp8.000 (di bawah Pe): Qd = 1.600 − 0,1(8.000) = 800 kg, sedangkan Qs = −200 + 0,1(8.000) = 600 kg.||Terjadi kelebihan permintaan (excess demand / shortage) sebesar 800 − 600 = 200 kg yang harus ditutup lewat operasi pasar Bulog.","(a) E(700 kg, Rp9.000); (b) Excess demand (kekurangan pasokan) sebesar 200 kg."],
 z:[
  ["Kebijakan Harga Eceran Tertinggi (Ceiling Price) yang efektif ditetapkan pemerintah pada tingkat harga…",["di atas harga keseimbangan untuk melindungi produsen","di bawah harga keseimbangan untuk melindungi daya beli konsumen","sama persis dengan harga keseimbangan","setinggi-tingginya agar pajak meningkat"],1,"Ceiling price (HET) ditetapkan di bawah harga pasar (Pe) agar harga tetap terjangkau oleh konsumen."],
  ["Dampak langsung dari penetapan Harga Dasar (Floor Price) gabah di atas harga keseimbangan pasar adalah…",["terjadinya kelebihan permintaan (shortage)","terjadinya kelebihan penawaran (surplus gabah) yang perlu diserap pemerintah","petani berhenti menanam padi","harga pasar otomatis turun di bawah harga dasar"],1,"Pada harga di atas Pe, jumlah yang ditawarkan petani (Qs) melebihi jumlah yang diminta pembeli (Qd), menciptakan excess supply."],
  ["Jika fungsi permintaan Pd = 50 − 2Q dan harga pasar terbentuk pada P = 30 (Qe = 10), berapakah besarnya Surplus Konsumen (CS)?",["50","100","150","200"],1,"CS = ½ × (P_maks − Pe) × Qe = ½ × (50 − 30) × 10 = 100."]
 ],
 m:["Ceiling price berarti harga langit-langit, jadi nilainya ditetapkan di atas harga keseimbangan.","Istilah 'langit-langit' (ceiling) berarti batas atas yang tidak boleh ditembus oleh harga yang sedang melambung. Agar mengikat dan menurunkan harga pasar, batas langit-langit itu harus dipasang di bawah harga keseimbangan saat ini.","Ceiling price efektif < Pe (melindungi konsumen); Floor price efektif > Pe (melindungi produsen/pekerja)."]
},
'1.3':{
 x:["Fungsi permintaan suatu barang adalah Pd = 30 − Q dan fungsi penawarannya Ps = 6 + 0,5Q (P dalam ribuan rupiah). Pemerintah mengenakan pajak spesifik sebesar t = Rp3 ribu per unit. Hitunglah: (a) keseimbangan sebelum pajak, (b) keseimbangan setelah pajak, serta (c) beban pajak per unit yang ditanggung konsumen, produsen, dan total pajak yang diterima pemerintah!","(a) Sebelum pajak (Pd = Ps): 30 − Q = 6 + 0,5Q → 24 = 1,5Q → Qe = 16 unit, dan Pe = 30 − 16 = Rp14 ribu.||(b) Setelah pajak t = 3: fungsi penawaran bergeser menjadi Ps' = Ps + t = (6 + 0,5Q) + 3 = 9 + 0,5Q.||Keseimbangan baru (Pd = Ps'): 30 − Q = 9 + 0,5Q → 21 = 1,5Q → Qe' = 14 unit, dan Pe' = 30 − 14 = Rp16 ribu.||(c) Beban pajak konsumen per unit tk = Pe' − Pe = 16 − 14 = Rp2 ribu/unit; beban produsen tp = t − tk = 3 − 2 = Rp1 ribu/unit; total penerimaan pajak pemerintah T = t × Qe' = 3 × 14 = Rp42 ribu.","E awal (16, Rp14rb); E' setelah pajak (14, Rp16rb); tk = Rp2rb, tp = Rp1rb, total pajak pemerintah Rp42rb."],
 z:[
  ["Diketahui fungsi penawaran Qs = −10 + 2P. Jika pemerintah mengenakan pajak Rp3 per unit, maka fungsi penawaran setelah pajak adalah…",["Qs' = −10 + 2P + 3","Qs' = −10 + 2(P + 3)","Qs' = −16 + 2P","Qs' = −4 + 2P"],2,"Substitusikan P dengan (P − t): Qs' = −10 + 2(P − 3) = −10 + 2P − 6 = −16 + 2P."],
  ["Pemberian subsidi pemerintah sebesar s per unit atas suatu komoditas akan menyebabkan…",["harga keseimbangan naik dan jumlah keseimbangan turun","harga keseimbangan turun dan jumlah keseimbangan naik","kurva permintaan bergeser ke kiri","beban pajak konsumen meningkat"],1,"Subsidi menurunkan biaya penawaran (Ps' = Ps − s), menggeser kurva S ke kanan bawah sehingga Pe turun dan Qe naik."],
  ["Harga keseimbangan sebelum pajak Rp10.000 dan setelah pajak Rp4.000/unit harga keseimbangan menjadi Rp12.500. Beban pajak per unit yang ditanggung produsen adalah…",["Rp1.500","Rp2.500","Rp4.000","Rp6.500"],0,"tk = 12.500 − 10.000 = Rp2.500. Maka beban produsen tp = t − tk = 4.000 − 2.500 = Rp1.500."]
 ],
 m:["Saat pajak t dikenakan pada fungsi Qs = a + bP, fungsi barunya adalah Qs' = a + bP + t.","Pajak menambah harga (Ps' = Ps + t), tetapi mengurangi jumlah yang ditawarkan pada tingkat harga yang sama! Dalam bentuk Qs = f(P), harga bersih yang diterima produsen adalah (P − t), sehingga Qs' = a + b(P − t).","Dalam bentuk P: Ps' = Ps + t (pajak) dan Ps' = Ps − s (subsidi). Dalam bentuk Q: Qs' = a + b(P − t) dan Qs' = a + b(P + s)."]
},
'1.4':{
 x:["Kafe Milenial menurunkan harga es kopi susu dari Rp20.000 menjadi Rp16.000 per cup saat promo bulanan. Akibatnya, penjualan melonjak dari 100 cup menjadi 150 cup per hari. (a) Hitung koefisien elastisitas harga permintaannya (Ed) dan tentukan jenisnya! (b) Buktikan dampak promo tersebut terhadap Total Revenue (TR) kafe!","(a) Diketahui P₁ = 20.000, Q₁ = 100; P₂ = 16.000, Q₂ = 150. Maka ΔP = −4.000 (turun 20%) dan ΔQ = +50 (naik 50%).||Ed = |(ΔQ/ΔP) × (P₁/Q₁)| = |(50 / −4.000) × (20.000 / 100)| = |−0,0125 × 200| = 2,5. Karena Ed = 2,5 > 1, permintaan bersifat ELASTIS.||(b) TR sebelum promo = 20.000 × 100 = Rp2.000.000/hari. TR setelah promo = 16.000 × 150 = Rp2.400.000/hari.||Karena permintaan elastis (Ed > 1), penurunan harga 20% memicu kenaikan kuantitas 50% sehingga TR meningkat sebesar Rp400.000/hari!","Ed = 2,5 (Elastis); TR naik dari Rp2.000.000 menjadi Rp2.400.000."],
 z:[
  ["Suatu barang memiliki koefisien elastisitas harga permintaan Ed = 0,4. Strategi yang tepat bagi produsen untuk meningkatkan penerimaan total (TR) adalah…",["menurunkan harga jual","menaikkan harga jual","memberikan diskon besar-besaran","menghentikan produksi"],1,"Ed = 0,4 < 1 (Inelastis): konsumen tidak peka terhadap kenaikan harga (%ΔQ < %ΔP), sehingga menaikkan harga akan meningkatkan TR."],
  ["Kebutuhan pokok seperti beras dan garam umumnya memiliki permintaan yang bersifat…",["elastis (E > 1)","inelastis (E < 1)","elastis sempurna (E = ∞)","elastis uniter (E = 1)"],1,"Barang kebutuhan pokok tidak mudah ditunda atau digantikan, sehingga meskipun harga naik, konsumsi hanya turun sedikit (inelastis)."],
  ["Jika elastisitas silang antara barang X dan barang Y bernilai negatif (Exy < 0), maka hubungan kedua barang tersebut adalah…",["saling menggantikan (substitusi)","saling melengkapi (komplementer)","barang mewah","barang tidak berhubungan"],1,"Exy < 0 berarti kenaikan harga barang Y menurunkan permintaan barang X (contoh: bensin dan mobil → komplementer)."]
 ],
 m:["Menurunkan harga jual (memberi diskon) pasti selalu meningkatkan total pendapatan (omzet) penjual.","Itu hanya berlaku jika permintaan barang bersifat elastis (Ed > 1). Untuk barang inelastis (Ed < 1) seperti garam atau beras, menurunkan harga 20% hanya menambah jumlah pembelian sedikit sekali (misal 5%), sehingga total omzet penjual justru anjlok!","Permintaan Elastis (Ed > 1): turunkan P agar TR naik. Permintaan Inelastis (Ed < 1): naikkan P agar TR naik."]
},
'1.5':{
 x:["Bandingkan struktur Pasar Persaingan Sempurna, Pasar Persaingan Monopolistik, Pasar Oligopoli, dan Pasar Monopoli dari segi: jumlah penjual, sifat produk, kekuatan menentukan harga, dan contoh nyatanya di Indonesia!","Pasar Persaingan Sempurna: penjual sangat banyak, produk homogen (identik), penjual berstatus price taker (P = MR = AR), contoh: pasar beras/sayur di pasar induk.||Pasar Persaingan Monopolistik: penjual banyak, produk terdiferensiasi (beda merek, rasa, kemasan), punya sedikit kuasa harga lewat loyalitas merek & iklan, contoh: sabun mandi, air mineral kemasan, kedai kopi.||Pasar Oligopoli: hanya beberapa produsen besar (3–10 perusahaan), produk bisa homogen (semen, baja) atau terdiferensiasi (mobil, operator seluler), saling ketergantungan tinggi (kurva permintaan patah).||Pasar Monopoli: satu penjual tunggal tanpa substitusi dekat, hambatan masuk sangat tinggi, berstatus price maker, contoh: PT PLN (transmisi listrik), PT KAI (kereta api antarkota).","PPS = homogen & price taker; Monopolistik = diferensiasi merek; Oligopoli = beberapa raksasa; Monopoli = penjual tunggal."],
 z:[
  ["Pasar di mana terdapat banyak produsen yang menjual produk serupa tetapi memiliki perbedaan merek, kemasan, dan gencar beriklan (seperti industri sampo dan pasta gigi) disebut pasar…",["persaingan sempurna","monopoli","oligopoli","persaingan monopolistik"],3,"Diferensiasi produk (merek, kualitas, kemasan) dengan banyak penjual adalah ciri khas pasar persaingan monopolistik."],
  ["Mengapa kurva permintaan yang dihadapi satu perusahaan pada Pasar Persaingan Sempurna berbentuk garis lurus horizontal?",["Karena perusahaan dapat menaikkan harga sesuka hati","Karena perusahaan adalah price taker yang dapat menjual berapa pun output pada tingkat harga pasar yang berlaku","Karena barang tidak memiliki substitusi","Karena konsumen tidak mengetahui informasi harga"],1,"Sebagai price taker, satu penjual kecil tidak bisa memengaruhi harga pasar: P = AR = MR konstan (horizontal)."],
  ["Teori sewa tanah yang menyatakan bahwa tinggi rendahnya sewa tanah ditentukan oleh perbedaan tingkat kesuburan tanah dikemukakan oleh…",["Adam Smith","David Ricardo","Von Thunen","John Maynard Keynes"],1,"David Ricardo mengemukakan teori sewa tanah diferensial berdasarkan kesuburan tanah; sedangkan Von Thunen berdasarkan jarak/lokasi ke pasar."]
 ],
 m:["Sabun mandi dan mi instan termasuk Pasar Persaingan Sempurna karena mudah ditemui di setiap warung.","Di Pasar Persaingan Sempurna, produk harus benar-benar homogen (tidak bermerek/identik sehingga pembeli tidak peduli siapa produsennya). Sabun dan mi instan memiliki merek, citra iklan, dan diferensiasi rasa yang kuat, sehingga termasuk Pasar Persaingan Monopolistik.","Produk bermerek dengan banyak pesaing dan promosi iklan = Pasar Persaingan Monopolistik."]
},

'2.0':{
 x:["Data makroekonomi Negara Nusantara tahun 2025 (dalam triliun rupiah): PDB (GDP) = 1.500; Pendapatan WNA di dalam negeri = 120; Pendapatan WNI di luar negeri = 70; Penyusutan barang modal = 80; Pajak tidak langsung = 90; Subsidi = 30; Laba ditahan = 40; Pajak perseroan = 35; Iuran asuransi/jaminan sosial = 25; Transfer payment (bansos & pensiun) = 60; Pajak langsung (PPh) = 50. Hitunglah secara berurutan: GNP, NNP, NNI, PI, dan DI!","GNP = GDP + (Pendapatan WNI di LN − Pendapatan WNA di DN) = 1.500 + (70 − 120) = 1.450 triliun.||NNP = GNP − Penyusutan = 1.450 − 80 = 1.370 triliun.||NNI = NNP − Pajak Tidak Langsung + Subsidi = 1.370 − 90 + 30 = 1.310 triliun.||PI = NNI + Transfer Payment − (Laba Ditahan + Pajak Perseroan + Iuran Sosial) = 1.310 + 60 − (40 + 35 + 25) = 1.370 − 100 = 1.270 triliun.||DI (Disposable Income) = PI − Pajak Langsung = 1.270 − 50 = 1.220 triliun.","GNP = 1.450; NNP = 1.370; NNI = 1.310; PI = 1.270; DI = Rp1.220 triliun."],
 z:[
  ["Jika di suatu negara nilai Produk Domestik Bruto (GDP) lebih besar daripada Produk Nasional Bruto (GNP), hal ini menunjukkan bahwa…",["pendapatan warga negara tersebut di luar negeri lebih besar daripada pendapatan warga asing di dalam negeri","nilai investasi/pendapatan faktor produksi asing di dalam negeri lebih besar daripada pendapatan warga negara tersebut di luar negeri","ekspor negara tersebut lebih besar daripada impornya","penyusutan barang modal bernilai nol"],1,"GNP = GDP + (WNI di LN − WNA di DN). Jika GDP > GNP, berarti pendapatan WNA di dalam negeri lebih besar daripada pendapatan WNI di luar negeri."],
  ["Komponen yang MENAMBAH nilai saat menghitung Personal Income (PI) dari Net National Income (NNI) adalah…",["laba ditahan","iuran jaminan sosial","transfer payment (pembayaran pindahan seperti dana pensiun dan bansos)","pajak perseroan"],2,"Transfer payment diterima oleh rumah tangga meskipun bukan balas jasa produksi tahun berjalan, sehingga menambah PI."],
  ["Pendapatan yang benar-benar siap dibelanjakan oleh rumah tangga untuk konsumsi atau ditabung setelah dikurangi pajak penghasilan pribadi disebut…",["Net National Income (NNI)","Personal Income (PI)","Disposable Income (DI)","Gross National Product (GNP)"],2,"Disposable Income (DI = PI − Pajak Langsung) adalah pendapatan siap pakai untuk konsumsi (C) dan tabungan (S)."]
 ],
 m:["Transfer payment seperti bantuan sosial dan tunjangan pensiun dihitung dalam NNI karena merupakan pendapatan warga.","NNI hanya menghitung balas jasa atas faktor produksi yang menghasilkan output pada tahun berjalan. Transfer payment adalah pemindahan pendapatan dari pemerintah ke warga tanpa imbalan output baru tahun ini, sehingga baru ditambahkan saat menghitung Personal Income (PI).","Transfer payment tidak masuk GDP/NNI, tetapi menambah Personal Income (PI)."]
},
'2.1':{
 x:["Diketahui fungsi konsumsi masyarakat suatu negara adalah C = 120 + 0,75Y (dalam triliun rupiah). (a) Tentukan fungsi tabungannya! (b) Pada tingkat pendapatan nasional berapa terjadi titik impas (Break-Even Income)? (c) Jika pemerintah dan swasta menambah investasi sebesar ΔI = Rp50 triliun, berapa pertambahan pendapatan nasional (ΔY)?","(a) Karena Y = C + S, maka S = −a + (1 − b)Y = −120 + (1 − 0,75)Y → S = −120 + 0,25Y (MPS = 0,25).||(b) Titik impas terjadi saat Y = C (atau S = 0): 0 = −120 + 0,25Y → Y_BEP = 120 / 0,25 = Rp480 triliun.||(c) Angka pengganda investasi k = 1 / MPS = 1 / 0,25 = 4. Maka pertambahan pendapatan nasional ΔY = k × ΔI = 4 × 50 = Rp200 triliun.","(a) S = −120 + 0,25Y; (b) Y_BEP = Rp480 triliun; (c) ΔY = Rp200 triliun."],
 z:[
  ["Dalam perhitungan pendapatan nasional dengan pendekatan produksi, mengapa yang dijumlahkan hanya 'nilai tambah' (value added) tiap tahap produksi?",["Untuk memperkecil beban pajak perusahaan","Untuk menghindari perhitungan ganda (double counting) atas bahan baku yang sama","Karena harga barang jadi selalu lebih murah dari bahan mentah","Karena pendekatan produksi tidak menghitung sektor jasa"],1,"Jika nilai barang jadi dan nilai bahan mentah dijumlahkan seluruhnya, nilai kapas/benang akan terhitung berkali-kali (double counting)."],
  ["Komponen terbesar dalam perhitungan Produk Domestik Bruto (PDB) Indonesia melalui pendekatan pengeluaran (Y = C + I + G + X − M) adalah…",["Pengeluaran Pemerintah (G)","Konsumsi Rumah Tangga (C)","Ekspor Bersih (X − M)","Subsidi Sosial"],1,"Konsumsi rumah tangga (C) menyumbang lebih dari separuh (>50%) total PDB Indonesia."],
  ["Saat pendapatan keluarga naik dari Rp4.000.000 menjadi Rp6.000.000, pengeluaran konsumsinya naik dari Rp3.500.000 menjadi Rp5.000.000. Besarnya MPS (Marginal Propensity to Save) adalah…",["0,75","0,50","0,25","0,20"],2,"MPC = ΔC/ΔY = 1.500.000 / 2.000.000 = 0,75. Karena MPC + MPS = 1, maka MPS = 1 − 0,75 = 0,25."]
 ],
 m:["Menjumlahkan harga gabah petani, harga beras penggilingan, dan harga nasi di restoran adalah cara menghitung PDB pendekatan produksi.","Menjumlahkan nilai jual kotor di setiap rantai pasok menyebabkan perhitungan ganda (gabah dihitung tiga kali!). Yang benar adalah menjumlahkan selisih nilai tambah di setiap tahap, atau menghitung nilai barang akhir saja.","Pendekatan produksi = Σ Nilai Tambah = Nilai Output Akhir."]
},
'2.2':{
 x:["Tabel data tiga negara tahun 2024: Negara Astina (PDB Rp283.300 miliar, penduduk 51 juta); Negara Alengka (PDB Rp326.600 miliar, penduduk 31 juta); Negara Amarta (PDB Rp917.700 miliar, penduduk 255,5 juta). Hitunglah pendapatan per kapita masing-masing negara dan urutkan dari yang paling makmur secara rata-rata!","Gunakan rumus IPC = PDB / Jumlah Penduduk:||Negara Astina: Rp283.300.000 juta / 51 juta jiwa ≈ Rp5.554.902 per kapita.||Negara Alengka: Rp326.600.000 juta / 31 juta jiwa ≈ Rp10.535.484 per kapita.||Negara Amarta: Rp917.700.000 juta / 255,5 juta jiwa ≈ Rp3.591.781 per kapita.||Urutan pendapatan per kapita dari tertinggi ke terendah: Negara Alengka → Negara Astina → Negara Amarta.","Urutan tertinggi: Alengka (Rp10,54 juta), Astina (Rp5,55 juta), Amarta (Rp3,59 juta)."],
 z:[
  ["Apabila Kurva Lorenz suatu negara semakin menjauhi garis diagonal pemerataan (45°), maka hal tersebut mengindikasikan…",["distribusi pendapatan masyarakat semakin merata","koefisien Gini mendekati angka 0","ketimpangan distribusi pendapatan semakin tinggi (koefisien Gini mendekati 1)","pendapatan per kapita pasti menurun"],2,"Semakin lengkung/jauh Kurva Lorenz dari garis diagonal, semakin besar luas daerah ketimpangan dan semakin mendekati 1 nilai Indeks Gini."],
  ["Menurut kriteria Bank Dunia, suatu negara dikategorikan memiliki tingkat ketimpangan distribusi pendapatan yang RENDAH apabila 40% penduduk termiskin menerima porsi pendapatan nasional…",["kurang dari 12%","antara 12% sampai 17%","lebih dari 17%","tepat 10%"],2,"Kriteria Bank Dunia untuk 40% penduduk termiskin: <12% (ketimpangan tinggi), 12%–17% (sedang), dan >17% (ketimpangan rendah)."],
  ["Koefisien Gini sebesar 0,25 menunjukkan bahwa distribusi pendapatan di wilayah tersebut berada pada kategori…",["ketimpangan rendah (merata)","ketimpangan sedang","ketimpangan tinggi","ketimpangan mutlak"],0,"Indeks Gini < 0,30 dikategorikan ketimpangan rendah; 0,30–0,50 sedang; > 0,50 ketimpangan tinggi."]
 ],
 m:["Negara dengan PDB total terbesar pasti merupakan negara yang rakyatnya paling makmur.","PDB besar jika dibagi jumlah penduduk yang sangat padat dapat menghasilkan pendapatan per kapita yang rendah (seperti Negara Amarta pada contoh soal). Selain itu, rata-rata per kapita juga belum mencerminkan pemerataan (Indeks Gini).","Kemakmuran rata-rata dilihat dari PDB per kapita Riil, dan keadilannya dilihat dari Indeks Gini / Kurva Lorenz."]
},
'2.3':{
 x:["Data PDB Riil (atas dasar harga konstan) Negara Nusa Harapan: tahun 2021 = Rp7.500 triliun; 2022 = Rp7.600 triliun; 2023 = Rp7.800 triliun; 2024 = Rp8.000 triliun. Hitunglah laju pertumbuhan ekonomi Negara Nusa Harapan pada periode 2023–2024 dan jelaskan bedanya dengan pembangunan ekonomi!","Identifikasi data: PDB₂₀₂₃ (tahun t−1) = Rp7.800 triliun; PDB₂₀₂₄ (tahun t) = Rp8.000 triliun.||Selisih kenaikan ΔPDB = 8.000 − 7.800 = Rp200 triliun.||Laju pertumbuhan g₂₀₂₄ = (200 / 7.800) × 100% = 2,564% ≈ 2,56%.||Angka 2,56% ini adalah ukuran kuantitatif pertumbuhan ekonomi; agar disebut pembangunan ekonomi, kenaikan ini harus disertai peningkatan IPM (pendidikan, kesehatan), pemerataan, dan perbaikan struktur ekonomi.","Laju pertumbuhan ekonomi 2023–2024 adalah 2,56%."],
 z:[
  ["Perbedaan mendasar antara pertumbuhan ekonomi dan pembangunan ekonomi adalah…",["pertumbuhan ekonomi bersifat kualitatif, sedangkan pembangunan bersifat kuantitatif","pertumbuhan ekonomi hanya mengukur kenaikan kuantitatif output (PDB), sedangkan pembangunan mencakup peningkatan kualitas hidup (IPM) dan perubahan struktur sosial","pertumbuhan ekonomi selalu memperhatikan distribusi pendapatan","pembangunan ekonomi tidak memerlukan pertumbuhan output"],1,"Pertumbuhan ekonomi = kenaikan kuantitatif PDB riil; pembangunan ekonomi = kenaikan output + kualitas SDM (IPM), pemerataan, dan transformasi struktural."],
  ["Tokoh ekonomi yang menyatakan bahwa pertumbuhan ekonomi digerakkan oleh inovasi dan keberanian wirausahawan (entrepreneur) melakukan terobosan baru adalah…",["Adam Smith","David Ricardo","Joseph Schumpeter","Thomas Robert Malthus"],2,"Joseph Schumpeter menekankan peran sentral inovasi oleh entrepreneur (creative destruction) sebagai motor pertumbuhan ekonomi."],
  ["Tiga dimensi utama pembentuk Indeks Pembangunan Manusia (IPM / Human Development Index) adalah…",["inflasi, nilai tukar, dan suku bunga","umur panjang & hidup sehat, pengetahuan (pendidikan), serta standar hidup layak","jumlah penduduk, luas wilayah, dan cadangan devisa","sektor pertanian, industri, dan jasa"],1,"UNDP dan BPS menghitung IPM dari tiga dimensi: kesehatan (angka harapan hidup), pendidikan (HLS & RLS), dan ekonomi (pengeluaran per kapita riil)."]
 ],
 m:["Menghitung laju pertumbuhan ekonomi tahun 2024 dilakukan dengan membagi selisih PDB terhadap PDB tahun 2024: (8.000 − 7.800)/8.000 = 2,50%.","Laju perubahan selalu dihitung dari nilai awal (tahun sebelumnya, t−1) sebagai pembanding dasar, bukan nilai akhir (tahun t). Membagi dengan 8.000 adalah jebakan opsi jawaban ujian yang sangat sering muncul!","Rumus wajib: g_t = ((PDB_t − PDB_{t−1}) / PDB_{t−1}) × 100%."]
},
'2.4':{
 x:["Di Provinsi X terdapat penduduk usia kerja (≥15 tahun) sebanyak 10 juta jiwa. Dari jumlah tersebut, 2,5 juta jiwa merupakan pelajar/mahasiswa, ibu rumah tangga, dan pensiunan. Dari angkatan kerja yang ada, tercatat 6,9 juta jiwa telah bekerja dan sisanya sedang aktif mencari kerja. Hitunglah: (a) jumlah Angkatan Kerja, (b) TPAK, dan (c) Tingkat Pengangguran Terbuka (TPT)!","(a) Bukan Angkatan Kerja = 2,5 juta jiwa. Maka Angkatan Kerja (AK) = Penduduk Usia Kerja − Bukan AK = 10 − 2,5 = 7,5 juta jiwa.||(b) TPAK = (Angkatan Kerja / Penduduk Usia Kerja) × 100% = (7,5 / 10) × 100% = 75%.||(c) Jumlah Pengangguran = AK − Bekerja = 7,5 − 6,9 = 0,6 juta jiwa (600 ribu orang).||TPT = (Jumlah Pengangguran / Angkatan Kerja) × 100% = (0,6 / 7,5) × 100% = 8%.","(a) Angkatan Kerja 7,5 juta; (b) TPAK = 75%; (c) TPT = 8%."],
 z:[
  ["Seorang lulusan SMK jurusan otomotif belum mendapatkan pekerjaan karena pabrik di daerahnya beralih memproduksi komponen semikonduktor yang menuntut keahlian pemrograman. Jenis pengangguran ini beserta solusi tepatnya adalah…",["Pengangguran friksional — solusi: menaikkan upah minimum","Pengangguran struktural — solusi: pelatihan vokasi ulang (reskilling/upskilling) sesuai kebutuhan industri","Pengangguran musiman — solusi: memberi bantuan tunai seumur hidup","Pengangguran sukarela — solusi: menurunkan pajak ekspor"],1,"Ketidaksesuaian keterampilan tenaga kerja dengan perubahan struktur industri adalah pengangguran struktural; diatasi dengan pelatihan keterampilan baru."],
  ["Siswa SMA berusia 17 tahun dan ibu rumah tangga yang fokus mengurus keluarga dalam statistik ketenagakerjaan dikelompokkan sebagai…",["pengangguran terbuka","setengah menganggur","bukan angkatan kerja","angkatan kerja produktif"],2,"Penduduk usia ≥15 tahun yang bersekolah, kuliah, atau mengurus rumah tangga termasuk Bukan Angkatan Kerja, sehingga tidak dihitung sebagai pengangguran."],
  ["Pekerja yang hanya bekerja 20 jam per minggu dan masih berusaha mencari tambahan pekerjaan dikategorikan sebagai…",["pengangguran terbuka","setengah menganggur (underemployed)","bukan angkatan kerja","pengangguran friksional"],1,"Jam kerja normal BPS adalah ≥35 jam/minggu; bekerja <35 jam/minggu dan masih mencari kerja tambahan disebut setengah menganggur."]
 ],
 m:["Menaikkan upah minimum setinggi-tingginya adalah solusi terbaik untuk mengurangi tingkat pengangguran terbuka.","Kenaikan upah minimum yang terlalu tinggi melampaui produktivitas justru meningkatkan biaya tenaga kerja bagi perusahaan/UMKM, sehingga perusahaan menahan rekrutmen atau melakukan PHK. Solusi pengangguran adalah investasi, pelatihan vokasi (link and match), dan akses pembiayaan UMKM.","Upah minimum meningkatkan kesejahteraan pekerja yang sudah bekerja, tetapi bukan instrumen penurun angka pengangguran."]
},
'2.5':{
 x:["Pada tahun 2024 rata-rata upah nominal buruh tekstil Rp4.400.000/bulan dengan Indeks Harga Konsumen (IHK) sebesar 110. Pada tahun 2025 upah nominalnya dinaikkan menjadi Rp4.800.000/bulan, namun IHK melonjak menjadi 125. Analisis apakah kesejahteraan (upah riil) buruh tersebut meningkat atau menurun!","Hitung Upah Riil 2024 = (Upah Nominal₂₀₂₄ / IHK₂₀₂₄) × 100 = (4.400.000 / 110) × 100 = Rp4.000.000.||Hitung Upah Riil 2025 = (Upah Nominal₂₀₂₅ / IHK₂₀₂₅) × 100 = (4.800.000 / 125) × 100 = Rp3.840.000.||Bandingkan persentase kenaikan: upah nominal naik (400/4.400) = 9,09%, tetapi harga barang (IHK) naik (15/110) = 13,64%.||Karena laju inflasi lebih tinggi daripada kenaikan gaji nominal, daya beli nyata (upah riil) buruh justru TURUN dari Rp4.000.000 menjadi Rp3.840.000!","Upah riil menurun dari Rp4.000.000 menjadi Rp3.840.000 (daya beli turun Rp160.000)."],
 z:[
  ["Di pasar faktor produksi tenaga kerja, pihak yang bertindak sebagai PENAWAR (supply) tenaga kerja adalah…",["perusahaan manufaktur","rumah tangga konsumen (pekerja/pencari kerja)","pemerintah daerah","bank umum"],1,"Rumah tangga (RTK/pekerja) menawarkan jasa tenaga kerjanya, sedangkan perusahaan (RTP) adalah pihak yang meminta/membutuhkan tenaga kerja."],
  ["Permintaan perusahaan terhadap tenaga kerja disebut sebagai 'permintaan turunan' (derived demand) karena…",["bergantung pada besarnya permintaan masyarakat terhadap barang dan jasa yang diproduksi perusahaan tersebut","diturunkan dari peraturan menteri ketenagakerjaan","hanya berlaku bagi pekerja turun-temurun","upah selalu turun setiap tahun"],0,"Perusahaan merekrut pekerja karena ada permintaan konsumen atas produk yang dibuat pekerja tersebut."],
  ["Sistem pengupahan pada tukang jahit konveksi yang dibayar Rp15.000 untuk setiap potong kemeja yang berhasil diselesaikan disebut…",["upah menurut waktu","upah satuan hasil (potongan)","upah borongan proyek","upah mitra saham"],1,"Pembayaran berdasarkan jumlah unit fisik output yang dihasilkan disebut sistem upah satuan hasil/potongan."]
 ],
 m:["Jika gaji bulanan seseorang naik dari Rp5 juta menjadi Rp5,5 juta, maka daya belinya pasti meningkat 10%.","Gaji yang tertulis di slip gaji adalah upah nominal. Jika pada tahun yang sama harga-harga kebutuhan pokok (inflasi) naik 15%, maka jumlah barang yang bisa dibeli dari gaji Rp5,5 juta justru lebih sedikit daripada Rp5 juta tahun lalu.","Selalu bagi Upah Nominal dengan IHK untuk menilai daya beli nyata (Upah Riil)."]
},

'3.0':{
 x:["Perhatikan data harga dan kuantitas dua komoditas pokok (Beras dan Gula) pada tahun dasar 2023 (0) dan tahun 2024 (n): Beras: P₀ = Rp10.000, Pₙ = Rp12.000, Q₀ = 50 kg, Qₙ = 45 kg. Gula: P₀ = Rp15.000, Pₙ = Rp18.000, Q₀ = 20 kg, Qₙ = 25 kg. Hitunglah Indeks Harga Laspeyres (IL) dan Indeks Harga Paasche (IP)!","Hitung komponen Laspeyres (tertimbang kuantitas tahun dasar Q₀):||Σ(Pₙ·Q₀) = (12.000 × 50) + (18.000 × 20) = 600.000 + 360.000 = Rp960.000.||Σ(P₀·Q₀) = (10.000 × 50) + (15.000 × 20) = 500.000 + 300.000 = Rp800.000. Maka IL = (960.000 / 800.000) × 100 = 120.||Hitung komponen Paasche (tertimbang kuantitas tahun berjalan Qₙ): Σ(Pₙ·Qₙ) = (12.000 × 45) + (18.000 × 25) = 540.000 + 450.000 = Rp990.000; Σ(P₀·Qₙ) = (10.000 × 45) + (15.000 × 25) = 450.000 + 375.000 = Rp825.000. Maka IP = (990.000 / 825.000) × 100 = 120.","Indeks Laspeyres (IL) = 120 dan Indeks Paasche (IP) = 120 (rata-rata harga naik 20%)."],
 z:[
  ["Perbedaan rumus Indeks Harga Laspeyres dan Indeks Harga Paasche terletak pada…",["Laspeyres menggunakan penimbang kuantitas tahun dasar (Q₀), sedangkan Paasche menggunakan kuantitas tahun berjalan (Qₙ)","Laspeyres menggunakan harga tahun dasar di pembilang, Paasche di penyebut","Laspeyres tidak dikalikan 100","Paasche hanya menghitung satu jenis barang"],0,"Laspeyres = tertimbang kuantitas tahun dasar (Q₀); Paasche = tertimbang kuantitas tahun berjalan (Qₙ)."],
  ["Di Provinsi Jawa Timur tercatat Indeks Harga yang Diterima Petani (IT) sebesar 118 dan Indeks Harga yang Dibayar Petani (IB) sebesar 112. Kesimpulan yang tepat adalah…",["NTP < 100, kesejahteraan petani menurun","NTP = 105,36 > 100, petani mengalami surplus (daya beli petani meningkat)","Petani mengalami kebangkrutan karena IB > 100","Tidak terjadi inflasi di pedesaan"],1,"NTP = (118 / 112) × 100 = 105,36 (>100), artinya kenaikan harga hasil panen petani lebih besar daripada kenaikan biaya produksi & konsumsi petani."],
  ["Jika Indeks Laspeyres = 124 dan Indeks Paasche = 126, maka Indeks Drobisch adalah…",["120","124,5","125","250"],2,"Indeks Drobisch adalah rata-rata hitung IL dan IP: (124 + 126) / 2 = 125."]
 ],
 m:["Dalam rumus Laspeyres dan Paasche, yang berubah-ubah antara pembilang dan penyebut adalah kuantitasnya (Q).","Baik pada Laspeyres maupun Paasche, yang dibandingkan antara pembilang dan penyebut selalu harga tahun berjalan (Pₙ) terhadap harga tahun dasar (P₀). Kuantitas (Q₀ pada Laspeyres, Qₙ pada Paasche) berfungsi sebagai bobot penimbang yang sama di atas dan di bawah!","Pembilang selalu Pₙ dan penyebut selalu P₀; Laspeyres mengunci bobot Q₀, Paasche mengunci bobot Qₙ."]
},
'3.1':{
 x:["BPS mencatat Indeks Harga Konsumen (IHK) suatu wilayah sebesar 112 pada tahun 2022, meningkat menjadi 118 pada tahun 2023, dan menjadi 125 pada tahun 2024. Hitunglah laju inflasi tahun 2023 dan tahun 2024, lalu evaluasi pernyataan: 'Laju inflasi tahun 2024 lebih tinggi dibandingkan tahun 2023'!","Laju inflasi 2023: π₂₀₂₃ = ((IHK₂₀₂₃ − IHK₂₀₂₂) / IHK₂₀₂₂) × 100% = ((118 − 112) / 112) × 100% = (6 / 112) × 100% = 5,36%.||Laju inflasi 2024: π₂₀₂₄ = ((IHK₂₀₂₄ − IHK₂₀₂₃) / IHK₂₀₂₃) × 100% = ((125 − 118) / 118) × 100% = (7 / 118) × 100% = 5,93%.||Bandingkan keduanya: 5,93% > 5,36%, dan keduanya termasuk kategori inflasi ringan (<10% per tahun).||Kesimpulan: Pernyataan bahwa inflasi tahun 2024 lebih tinggi dibandingkan tahun 2023 adalah BENAR.","Inflasi 2023 = 5,36% dan Inflasi 2024 = 5,93% (inflasi 2024 lebih tinggi, kategori ringan)."],
 z:[
  ["Kenaikan harga barang secara umum yang dipicu oleh lonjakan tarif listrik industri, upah buruh, dan harga bahan baku impor disebut…",["demand-pull inflation","cost-push inflation","deflasi","apresiasi"],1,"Kenaikan biaya produksi yang menggeser kurva penawaran agregat (AS) ke kiri disebut cost-push inflation."],
  ["Menurut teori kuantitas uang Irving Fisher (M × V = P × T), apabila kecepatan peredaran uang (V) dan jumlah barang yang diperdagangkan (T) tetap, sedangkan jumlah uang beredar (M) meningkat 20%, maka…",["tingkat harga umum (P) akan turun 20%","tingkat harga umum (P) akan naik 20%","tidak terjadi perubahan harga","nilai uang menguat 20%"],1,"P = (M × V) / T. Jika V dan T konstan, tingkat harga P berbanding lurus dengan jumlah uang beredar M."],
  ["Siapakah pihak yang DIUNTUNGKAN ketika terjadi inflasi yang tidak terduga?",["Pensiunan dengan uang pensiun tetap setiap bulan","Kreditor yang meminjamkan uang dengan bunga tetap","Debitur (peminjam uang) dengan suku bunga pinjaman tetap","Penabung uang tunai di celengan"],2,"Saat inflasi, nilai riil uang turun sehingga beban cicilan tetap yang dibayar debitur menjadi terasa lebih ringan secara riil."]
 ],
 m:["Jika IHK tahun 2023 adalah 118 dan tahun 2024 adalah 125, maka laju inflasi tahun 2024 adalah 125 − 118 = 7%.","Selisih 7 poin indeks hanya sama dengan 7% apabila IHK tahun sebelumnya bernilai tepat 100! Karena IHK 2023 sudah 118, selisih 7 harus dibagi dengan 118: (7/118)×100% = 5,93%.","Jangan langsung mengurangkan IHK! Selalu bagi selisih IHK dengan IHK periode sebelumnya."]
},
'3.2':{
 x:["Dalam perekonomian suatu negara diketahui uang kertas dan logam yang dipegang masyarakat umum Rp350 triliun, uang kas di brankas bank umum Rp40 triliun, saldo rekening giro masyarakat di bank umum Rp550 triliun, serta tabungan dan deposito berjangka masyarakat Rp1.200 triliun. Hitunglah besarnya uang beredar dalam arti sempit (M1) dan uang beredar dalam arti luas (M2)!","Uang kartal yang dihitung dalam M1 hanyalah uang kartal yang beredar di tangan masyarakat umum (di luar bank umum dan kas negara), yaitu C = Rp350 triliun (kas di brankas bank Rp40 triliun tidak dihitung agar tidak ganda).||Uang giral masyarakat D = Rp550 triliun.||Maka M1 = C + D = 350 + 550 = Rp900 triliun.||Uang kuasi (tabungan & deposito berjangka) = Rp1.200 triliun. Maka M2 = M1 + Uang Kuasi = 900 + 1.200 = Rp2.100 triliun.","M1 = Rp900 triliun dan M2 = Rp2.100 triliun."],
 z:[
  ["Tujuan tunggal Bank Indonesia sebagai bank sentral Republik Indonesia adalah…",["menyalurkan kredit usaha rakyat secara langsung kepada UMKM","mencapai dan memelihara kestabilan nilai rupiah (terhadap barang/jasa dan mata uang asing)","mengumpulkan pajak penghasilan untuk membiayai APBN","mengawasi kegiatan operasional harian setiap perusahaan asuransi"],1,"Sesuai UU Bank Indonesia, tujuan tunggal BI adalah mencapai dan memelihara kestabilan nilai rupiah (kestabilan inflasi dan kurs)."],
  ["Seorang pengusaha mentransfer dana pembayaran gedung senilai Rp2,5 miliar secara instan (real-time settlement) antarbank untuk transaksi bernilai besar dan bersifat mendesak. Sistem pembayaran Bank Indonesia yang digunakan adalah…",["QRIS","BI-RTGS (Real Time Gross Settlement)","Uang Kartal","Cek Perjalanan"],1,"BI-RTGS digunakan untuk penyelesaian transaksi dana bernilai besar (di atas Rp100 juta) dan bersifat segera/mendesak."],
  ["Nilai Rp100.000 yang tertulis pada selembar uang kertas pecahan seratus ribu rupiah disebut sebagai…",["nilai intrinsik","nilai nominal","nilai riil","nilai kurs"],1,"Nilai nominal adalah nilai yang tercantum/tertulis pada uang; nilai intrinsik adalah nilai bahan pembuat uang tersebut."]
 ],
 m:["Saldo tabungan di buku tabungan dan deposito berjangka termasuk uang beredar dalam arti sempit (M1).","M1 hanya mencakup alat pembayaran yang paling likuid (bisa langsung dipakai transaksi saat itu juga tanpa penalti), yaitu uang kartal di masyarakat dan uang giral (rekening giro). Tabungan dan deposito berjangka tergolong 'uang kuasi' yang masuk ke dalam M2.","M1 = Kartal + Giro; M2 = M1 + Uang Kuasi (Tabungan & Deposito)."]
},
'3.3':{
 x:["Pada triwulan II, inflasi nasional melonjak ke 7,5% (melampaui target 3%±1%) akibat lonjakan harga energi dan depresiasi Rupiah sebesar 12%. Tentukan kombinasi kebijakan moneter Bank Indonesia yang tepat dari segi: (a) Suku bunga acuan (BI-Rate), (b) Operasi Pasar Terbuka (OPT), (c) Giro Wajib Minimum (GWM), dan (d) Intervensi valas!","Kondisi inflasi tinggi (7,5%) dan pelemahan nilai tukar menuntut Kebijakan Moneter Kontraktif (Tight Money Policy) untuk mengurangi jumlah uang beredar dan menstabilkan Rupiah.||(a) Politik Diskonto: MENAIKKAN suku bunga acuan (BI-Rate) untuk mengerem kredit konsumtif dan menarik modal masuk.||(b) Operasi Pasar Terbuka: MENJUAL Surat Berharga Negara (SBN/SRBI) di pasar terbuka untuk menyerap likuiditas uang dari perbankan/masyarakat.||(c) GWM & Valas: MENAIKKAN rasio Giro Wajib Minimum perbankan serta melakukan intervensi di pasar valas untuk menstabilkan kurs Rupiah.","Kebijakan Moneter Kontraktif: naikkan BI-Rate, jual SBN di pasar terbuka, naikkan GWM, dan stabilisasi pasar valas."],
 z:[
  ["Langkah Bank Sentral MENJUAL sertifikat surat berharga di pasar terbuka bertujuan untuk…",["menambah jumlah uang yang beredar di masyarakat","mengurangi jumlah uang yang beredar untuk mengatasi inflasi","menurunkan suku bunga pinjaman bank umum","memperbesar kapasitas kredit perbankan"],1,"Saat Bank Sentral menjual surat berharga, pembeli membayar dengan uang kepada Bank Sentral sehingga uang yang beredar di masyarakat berkurang (mengatasi inflasi)."],
  ["Jika Bank Sentral menetapkan Giro Wajib Minimum (GWM) sebesar 8%, maka angka pengganda uang (money multiplier) maksimum adalah…",["8 kali","10 kali","12,5 kali","80 kali"],2,"m = 1 / GWM = 1 / 0,08 = 12,5 kali."],
  ["Ketika perekonomian mengalami kelesuan (resesi) dan daya beli masyarakat turun drastis, kebijakan moneter yang tepat diambil Bank Sentral adalah…",["menaikkan BI-Rate dan menjual SBN","menurunkan BI-Rate, menurunkan GWM, dan membeli SBN (Easy Money Policy)","menaikkan GWM dan memperketat syarat kredit","menaikkan tarif Pajak Pertambahan Nilai (PPN)"],1,"Saat resesi dibutuhkan kebijakan moneter ekspansif (uang longgar): turunkan suku bunga, turunkan GWM, dan beli SBN agar likuiditas mengalir ke masyarakat."]
 ],
 m:["Untuk mengatasi inflasi, Bank Sentral harus membeli surat berharga agar surat berharga tidak beredar.","Yang memicu inflasi adalah berlebihnya UANG yang beredar, bukan surat berharga! Jika Bank Sentral membeli surat berharga dari masyarakat, Bank Sentral justru membayar dengan uang tunai ke masyarakat sehingga jumlah uang beredar makin membengkak dan inflasi makin parah.","Atasi inflasi = JUAL surat berharga (tarik uang masuk ke Bank Sentral); Atasi resesi/deflasi = BELI surat berharga (suntikkan uang ke pasar)."]
},
'3.4':{
 x:["Pemerintah menyusun APBN dengan target Pendapatan Negara Rp2.800 triliun dan rencana Belanja Negara Rp3.100 triliun untuk mempercepat pembangunan 13 waduk irigasi baru dan bantuan modal UMKM di tengah perlambatan ekonomi global. Analisis: (a) posisi saldo APBN, (b) jenis kebijakan fiskal yang diterapkan, serta (c) fungsi APBN yang tampak pada pembangunan waduk dan bantuan UMKM!","(a) Saldo APBN = Pendapatan − Belanja = 2.800 − 3.100 = −Rp300 triliun (Anggaran Defisit).||(b) Karena belanja pemerintah (G) diperbesar melampaui pendapatan untuk memacu pertumbuhan saat ekonomi melambat, pemerintah menerapkan Kebijakan Fiskal Ekspansif.||(c) Pembangunan 13 waduk irigasi untuk barang publik dan ketahanan pangan mencerminkan Fungsi Alokasi APBN; sedangkan bantuan UMKM dan subsidi mencerminkan Fungsi Distribusi dan Stabilisasi.","(a) Defisit Rp300 triliun; (b) Kebijakan Fiskal Ekspansif; (c) Fungsi Alokasi, Distribusi, dan Stabilisasi."],
 z:[
  ["Kebijakan pemerintah melalui Kementerian Keuangan dalam mengatur penerimaan pajak dan belanja negara di dalam APBN untuk memengaruhi perekonomian disebut…",["kebijakan moneter","kebijakan fiskal","kebijakan pasar terbuka","kebijakan diskonto"],1,"Pengaturan pajak (T) dan belanja pemerintah (G) dalam APBN adalah kebijakan fiskal."],
  ["Pembangunan jalan tol, jembatan, dan bendungan irigasi oleh pemerintah melalui dana APBN merupakan perwujudan fungsi APBN, yaitu…",["fungsi alokasi","fungsi distribusi","fungsi otorisasi semata","fungsi moneter"],0,"Fungsi alokasi mengarahkan sumber daya anggaran untuk menyediakan barang publik/infrastruktur guna mendorong kegiatan ekonomi."],
  ["Jika perekonomian sedang mengalami inflasi yang sangat tinggi (overheating), kebijakan fiskal yang tepat ditempuh pemerintah adalah…",["menaikkan belanja negara dan menurunkan tarif pajak","mengurangi/menunda belanja pemerintah dan menaikkan tarif pajak (Fiskal Kontraktif)","menurunkan suku bunga BI-Rate","menurunkan Giro Wajib Minimum perbankan"],1,"Untuk meredam permintaan agregat melalui jalur fiskal, pemerintah menahan belanja (G↓) dan/atau menaikkan pajak (T↑)."]
 ],
 m:["APBN yang defisit selalu menandakan kegagalan pemerintah dalam mengelola keuangan negara.","Anggaran defisit (Fiskal Ekspansif) sering kali dirancang secara sengaja dan terukur (di Indonesia dibatasi maksimal 3% dari PDB) sebagai instrumen stimulus untuk membangun infrastruktur produktif dan menciptakan lapangan kerja saat ekonomi sedang melambat.","Defisit APBN yang terukur dan produktif adalah instrumen Kebijakan Fiskal Ekspansif."]
},
'3.5':{
 x:["Pak Arman memiliki penghasilan neto setahun sebesar Rp168.000.000. Ia sudah menikah dan memiliki 2 orang anak yang menjadi tanggungan (status K/2). Dengan PTKP Wajib Pajak Rp54.000.000 dan tambahan kawin serta tiap tanggungan masing-masing Rp4.500.000, hitunglah Pajak Penghasilan (PPh Pasal 21) terutang Pak Arman selama setahun dan sebulan sesuai lapisan tarif UU HPP!","Hitung PTKP (status K/2): Wajib Pajak pribadi Rp54.000.000 + status kawin Rp4.500.000 + 2 anak tanggungan (2 × Rp4.500.000 = Rp9.000.000) = Rp67.500.000/tahun.||Hitung Penghasilan Kena Pajak (PKP) = Penghasilan Neto − PTKP = Rp168.000.000 − Rp67.500.000 = Rp100.500.000.||Terapkan tarif progresif berlapis UU HPP: Lapis I (0 s.d. Rp60.000.000) = 5% × Rp60.000.000 = Rp3.000.000.||Sisa PKP masuk Lapis II (>Rp60 juta s.d. Rp250 juta): 15% × (Rp100.500.000 − Rp60.000.000) = 15% × Rp40.500.000 = Rp6.075.000. Total PPh setahun = Rp3.000.000 + Rp6.075.000 = Rp9.075.000 (atau Rp756.250/bulan).","PTKP = Rp67,5 juta; PKP = Rp100,5 juta; PPh setahun = Rp9.075.000 (Rp756.250/bulan)."],
 z:[
  ["Pengenaan cukai yang tinggi terhadap rokok dan minuman berpemanis dengan tujuan menekan konsumsi masyarakat demi kesehatan merupakan perwujudan fungsi pajak…",["fungsi budgetair (anggaran)","fungsi regulerend (mengatur)","fungsi demokrasi","fungsi moneter"],1,"Fungsi regulerend menggunakan pajak/cukai sebagai alat untuk mengatur dan mengarahkan perilaku ekonomi maupun sosial masyarakat."],
  ["Perbedaan utama antara pajak dan retribusi adalah…",["pajak dipungut oleh swasta, retribusi oleh negara","pembayar pajak tidak menerima imbalan (kontraprestasi) langsung, sedangkan pembayar retribusi menerima imbalan langsung (seperti parkir atau pelayanan kesehatan)","pajak bersifat sukarela, retribusi bersifat memaksa","retribusi diatur undang-undang, pajak tidak"],1,"Pajak tidak memberikan kontraprestasi langsung kepada individu pembayarnya, sedangkan retribusi memberikan layanan/fasilitas langsung."],
  ["Sistem tarif pajak di mana persentase tarif pajaknya semakin meningkat seiring dengan semakin besarnya dasar pengenaan pajak (seperti PPh Orang Pribadi) disebut tarif…",["proporsional (sebanding)","progresif","degresif","tetap (regresif)"],1,"Tarif progresif mengenakan persentase yang makin tinggi untuk lapisan penghasilan yang lebih tinggi demi keadilan vertikal."]
 ],
 m:["Jika Penghasilan Kena Pajak (PKP) seseorang Rp100 juta, maka PPh terutangnya langsung dihitung 15% × Rp100 juta = Rp15 juta.","Tarif PPh Pasal 21 bersifat progresif berlapis (bracket system): Rp60 juta pertama wajib dikenai tarif lapis pertama 5% terlebih dahulu (Rp3 juta), dan hanya kelebihannya (Rp100 juta − Rp60 juta = Rp40 juta) yang dikenai tarif lapis kedua 15% (Rp6 juta), sehingga totalnya Rp9 juta!","Selalu pecah PKP ke dalam tiap lapisan tarif (60 juta pertama × 5%, sisanya baru × 15%, dst.)."]
},

'4.0':{
 x:["PT Mentari memproduksi keripik buah lokal. Untuk meningkatkan mutu dan ketepatan pengiriman, manajemen perusahaan: (1) menetapkan target ekspor 50.000 kemasan per kuartal, (2) membentuk divisi pengadaan bahan baku dan divisi kontrol kualitas, (3) memberikan bonus dan pelatihan motivasi kepada operator mesin, serta (4) melakukan inspeksi harian terhadap tingkat kerenyahan keripik dibanding standar mutu. Pasangkan keempat kegiatan tersebut dengan fungsi manajemen POAC dan bidang manajemennya!","Kegiatan (1) menetapkan target ekspor kuartalan → fungsi Planning (Perencanaan).||Kegiatan (2) membentuk divisi dan membagi wewenang kerja → fungsi Organizing (Pengorganisasian).||Kegiatan (3) memotivasi dan membimbing operator → fungsi Actuating (Penggerakan) di bidang Manajemen SDM.||Kegiatan (4) memeriksa mutu hasil produksi terhadap standar → fungsi Controlling (Pengawasan) di bidang Manajemen Produksi.","(1) Planning; (2) Organizing; (3) Actuating (SDM); (4) Controlling (Produksi)."],
 z:[
  ["Tindakan seorang manajer pabrik mengevaluasi laporan hasil produksi bulanan, membandingkannya dengan target rencana awal, dan memperbaiki penyebab keterlambatan merupakan pelaksanaan fungsi manajemen…",["Planning (Perencanaan)","Organizing (Pengorganisasian)","Actuating (Penggerakan)","Controlling (Pengawasan)"],3,"Controlling mencakup penetapan standar, pengukuran kinerja aktual, pembandingan dengan rencana, dan tindakan koreksi."],
  ["Keterampilan manajerial yang paling dominan dibutuhkan oleh jajaran Direksi (Top Management) dalam merumuskan visi strategis perusahaan adalah…",["keterampilan teknis (technical skills)","keterampilan konseptual (conceptual skills)","keterampilan mengoperasikan mesin produksi","keterampilan mengetik laporan harian"],1,"Top management membutuhkan keterampilan konseptual tertinggi untuk melihat organisasi secara menyeluruh dan merancang strategi jangka panjang."],
  ["Penentuan desain kemasan produk, penetapan harga jual, pemilihan saluran distribusi, dan kampanye iklan di media sosial (4P) merupakan ruang lingkup bidang…",["Manajemen Produksi","Manajemen Pemasaran","Manajemen Keuangan","Manajemen Administrasi"],1,"Bauran pemasaran (Marketing Mix 4P: Product, Price, Place, Promotion) adalah inti dari Manajemen Pemasaran."]
 ],
 m:["Membagi karyawan ke dalam departemen produksi, pemasaran, dan keuangan adalah bagian dari fungsi Planning.","Planning menetapkan tujuan dan strategi apa yang hendak dicapai. Adapun menyusun struktur organisasi, mengelompokkan tugas ke dalam departemen, dan membagi wewenang adalah fungsi Organizing.","Planning = merencanakan tujuan & jadwal; Organizing = membagi tugas & struktur; Actuating = menggerakkan/memotivasi; Controlling = mengawasi/mengevaluasi."]
},
'4.1':{
 x:["PT Perkebunan Nusantara (BUMN Persero) membuka kebun dan pabrik pengolahan sawit baru di daerah tertinggal, bermitra dengan petani lokal, serta mengekspor minyak sawit olahan. Di sisi lain, Ali dan Budi mendirikan CV Maju Jaya di mana Ali mengelola usaha sehari-hari sedangkan Budi hanya menyetorkan modal Rp200 juta tanpa ikut mengelola. Analisis: (a) dampak ekonomi peran BUMN tersebut, dan (b) tanggung jawab hukum Ali dan Budi jika CV mengalami kerugian Rp500 juta!","(a) Ekspansi BUMN di daerah tertinggal memberikan dampak positif: membuka lapangan kerja baru di daerah tertinggal, mendorong pemerataan pembangunan antarwilayah, meningkatkan pendapatan petani lewat kemitraan, dan menambah devisa negara dari ekspor.||(b) Dalam CV Maju Jaya, Ali adalah Sekutu Aktif (Komplementer) yang bertanggung jawab penuh secara tidak terbatas hingga harta pribadinya.||Budi adalah Sekutu Pasif (Komanditer) yang hanya bertanggung jawab sebatas modal yang disetorkan (maksimal Rp200 juta).||Maka saat CV rugi/berutang Rp500 juta, Budi hanya kehilangan modal Rp200 juta, sedangkan sisa kekurangan Rp300 juta wajib ditanggung Ali sampai harta pribadinya.","(a) Lapangan kerja, pemerataan wilayah, dan devisa ekspor; (b) Budi rugi maksimal Rp200 juta (terbatas), Ali menanggung sisanya hingga harta pribadi."],
 z:[
  ["Perbedaan utama antara BUMN berbentuk Persero dan BUMN berbentuk Perum adalah…",["Persero modalnya terbagi atas saham (negara minimal 51%) dan mengejar laba, sedangkan Perum modalnya 100% milik negara (tidak terbagi atas saham) dan mengutamakan pelayanan umum","Persero dimiliki swasta penuh, Perum dimiliki daerah","Perum dipimpin oleh RUPS, Persero dipimpin oleh Menteri","Persero tidak boleh mencari keuntungan"],0,"Persero berbentuk PT dengan modal saham (minimal 51% milik negara) berorientasi laba & daya saing; Perum modalnya 100% negara untuk kemanfaatan umum."],
  ["Dalam Persekutuan Komanditer (CV), sekutu yang hanya menyetorkan modal, tidak ikut memimpin perusahaan, dan tanggung jawabnya terbatas pada modal yang disetor disebut…",["sekutu aktif / komplementer","sekutu pasif / komanditer","dewan komisaris","direktur utama"],1,"Sekutu pasif (sleeping partner / komanditer) hanya menyetor modal dan tanggung jawabnya terbatas sebesar modal yang disetor."],
  ["Kekuasaan tertinggi dalam Perseroan Terbatas (PT) yang berwenang mengangkat direksi dan memutuskan pembagian dividen berada pada…",["Dewan Komisaris","Direktur Utama","Rapat Umum Pemegang Saham (RUPS)","Kementerian Perdagangan"],2,"RUPS adalah organ PT yang memegang kekuasaan tertinggi."]
 ],
 m:["Semua BUMN bertujuan semata-mata memberikan subsidi dan pelayanan gratis tanpa boleh mencari laba.","BUMN Persero (seperti PT Mandiri, PT BRI, PT Telkom, PT Pertamina) justru dituntut beroperasi secara profesional menghasilkan laba (dividen bagi APBN) sekaligus menyediakan barang/jasa strategis berkualitas.","BUMN Persero berorientasi laba & kontribusi dividen APBN; BUMN Perum berorientasi pelayanan umum."]
},
'4.2':{
 x:["Koperasi Simpan Pinjam & Konsumsi 'Sejahtera' pada akhir tahun membukukan Sisa Hasil Usaha (SHU) sebesar Rp40.000.000. Sesuai AD/ART, SHU dialokasikan untuk Jasa Modal 25% dan Jasa Usaha Anggota (transaksi belanja) 30%. Total simpanan pokok dan simpanan wajib seluruh anggota Rp50.000.000, sedangkan total penjualan kepada anggota Rp200.000.000. Jika Bu Sari memiliki simpanan pokok Rp500.000, simpanan wajib Rp2.000.000, simpanan sukarela Rp3.000.000, dan berbelanja di koperasi senilai Rp10.000.000, berapakah SHU yang diterima Bu Sari?","Hitung modal Bu Sari yang berhak atas Jasa Modal: hanya Simpanan Pokok + Simpanan Wajib = Rp500.000 + Rp2.000.000 = Rp2.500.000 (Simpanan Sukarela Rp3.000.000 TIDAK dihitung!).||Alokasi total Jasa Modal koperasi = 25% × Rp40.000.000 = Rp10.000.000; Alokasi Jasa Usaha = 30% × Rp40.000.000 = Rp12.000.000.||Jasa Modal (JM) Bu Sari = (2.500.000 / 50.000.000) × Rp10.000.000 = 0,05 × Rp10.000.000 = Rp500.000.||Jasa Usaha (JUA) Bu Sari = (10.000.000 / 200.000.000) × Rp12.000.000 = 0,05 × Rp12.000.000 = Rp600.000. Total SHU Bu Sari = Rp500.000 + Rp600.000 = Rp1.100.000.","JM = Rp500.000 + JUA = Rp600.000 → Total SHU Bu Sari = Rp1.100.000."],
 z:[
  ["Pemegang kekuasaan tertinggi dalam struktur organisasi koperasi di Indonesia adalah…",["Ketua Pengurus Koperasi","Badan Pengawas Koperasi","Rapat Anggota","Anggota dengan simpanan terbesar"],2,"Menurut UU No. 25 Tahun 1992, Rapat Anggota merupakan pemegang kekuasaan tertinggi dalam koperasi (satu anggota satu suara)."],
  ["Simpanan anggota koperasi yang dibayarkan satu kali saat pertama kali masuk menjadi anggota dengan jumlah yang sama untuk setiap anggota disebut…",["simpanan wajib","simpanan pokok","simpanan sukarela","dana cadangan"],1,"Simpanan pokok dibayar sekali saat mendaftar sebagai anggota; simpanan wajib dibayar rutin setiap periode (misal bulanan)."],
  ["Mengapa Simpanan Sukarela tidak diikutsertakan dalam perhitungan Jasa Modal saat pembagian SHU koperasi?",["Karena simpanan sukarela adalah milik pemerintah","Karena simpanan sukarela bersifat seperti tabungan biasa yang dapat ditarik sewaktu-waktu dan bukan modal tetap koperasi","Karena nilainya selalu lebih kecil dari simpanan pokok","Karena dilarang oleh undang-undang"],1,"Simpanan sukarela bukan modal sendiri koperasi karena bisa diambil kapan saja; yang dihitung untuk Jasa Modal hanyalah Simpanan Pokok + Simpanan Wajib."]
 ],
 m:["Dalam menghitung Jasa Modal SHU anggota, seluruh simpanan pokok, wajib, dan sukarela dijumlahkan semuanya.","Ini jebakan nomor satu pada soal hitungan Koperasi! Soal hampir selalu mencantumkan angka Simpanan Sukarela sebagai pengecoh. Simpanan Sukarela tidak masuk modal tetap anggota sehingga harus diabaikan saat menghitung Jasa Modal.","Modal Anggota untuk SHU = Simpanan Pokok + Simpanan Wajib (abaikan Simpanan Sukarela)."]
},
'4.3':{
 x:["Klasifikasikan bentuk kerja sama ekonomi internasional berikut beserta fungsinya: (1) Indonesia–Japan Economic Partnership Agreement (IJEPA), (2) ASEAN Free Trade Area (AFTA) dan APEC, (3) ASEM (Asia–Europe Meeting), serta (4) WTO, IMF, dan OPEC!","(1) IJEPA hanya melibatkan dua negara (Indonesia dan Jepang) → Kerja Sama Bilateral.||(2) AFTA (Asia Tenggara) dan APEC (Asia Pasifik) beranggotakan negara-negara dalam satu kawasan geografis → Kerja Sama Regional.||(3) ASEM mempertemukan negara-negara kawasan Asia dengan kawasan Eropa → Kerja Sama Antarregional.||(4) WTO (perdagangan dunia), IMF (keuangan/moneter internasional), dan OPEC (negara pengekspor minyak lintas benua: Timur Tengah, Afrika, Amerika Selatan) → Kerja Sama Multilateral.","(1) Bilateral; (2) Regional; (3) Antarregional; (4) Multilateral."],
 z:[
  ["Organisasi kerja sama ekonomi internasional yang bertujuan mengatur perdagangan bebas dunia dan menyelesaikan sengketa dagang antarnegara adalah…",["IMF (International Monetary Fund)","WTO (World Trade Organization)","ILO (International Labour Organization)","IBRD / World Bank"],1,"WTO adalah organisasi multilateral yang mengatur regulasi perdagangan internasional dan penyelesaian sengketa tarif/non-tarif."],
  ["Mengapa OPEC (Organization of the Petroleum Exporting Countries) dikategorikan sebagai kerja sama multilateral, bukan regional?",["Karena anggotanya hanya dua negara","Karena anggotanya terdiri atas negara-negara penghasil minyak dari berbagai benua/kawasan berbeda (Timur Tengah, Afrika, Amerika Selatan)","Karena dipimpin oleh Bank Dunia","Karena hanya mengurus perdagangan beras di Asia"],1,"Kerja sama regional dibatasi oleh satu kawasan geografis, sedangkan anggota OPEC tersebar lintas benua dengan kesamaan komoditas minyak bumi."],
  ["Kemitraan Ekonomi Komprehensif antara Indonesia dan Australia (IA-CEPA) merupakan contoh kerja sama ekonomi…",["bilateral","regional","multilateral","antarregional"],0,"Kerja sama yang melibatkan tepat dua negara (Indonesia dan Australia) disebut kerja sama bilateral."]
 ],
 m:["APEC dan OPEC sama-sama kerja sama regional karena namanya mirip.","APEC (Asia-Pacific Economic Cooperation) memang kerja sama regional kawasan Asia Pasifik. Namun OPEC adalah organisasi negara pengekspor minyak dari berbagai kawasan dunia (multilateral/internasional berdasarkan kesamaan komoditas).","APEC & AFTA = Regional (satu kawasan); OPEC & WTO = Multilateral (lintas kawasan)."]
},
'4.4':{
 x:["Produksi per hari seorang pekerja di Indonesia dan Korea Selatan: Indonesia menghasilkan 40 m tekstil atau 20 unit televisi; Korea Selatan menghasilkan 60 m tekstil atau 120 unit televisi. Analisis dengan teori David Ricardo: negara mana yang memiliki keunggulan mutlak dan keunggulan komparatif pada masing-masing barang?","Secara mutlak, Korea Selatan unggul di kedua barang (60 > 40 tekstil dan 120 > 20 TV). Namun menurut David Ricardo, perdagangan tetap menguntungkan melalui Keunggulan Komparatif (biaya peluang terkecil).||Hitung DTDN (biaya peluang) 1 m tekstil: di Indonesia mengorbankan 20/40 = 0,5 TV; di Korea Selatan mengorbankan 120/60 = 2 TV. Karena 0,5 TV < 2 TV, Indonesia memiliki biaya peluang lebih rendah (keunggulan komparatif) pada TEKSTIL!||Hitung DTDN 1 unit TV: di Indonesia mengorbankan 40/20 = 2 m tekstil; di Korea Selatan mengorbankan 60/120 = 0,5 m tekstil. Karena 0,5 < 2, Korea Selatan memiliki keunggulan komparatif pada TELEVISI!||Maka Indonesia berspesialisasi mengekspor tekstil dan Korea Selatan mengekspor televisi.","Korea Selatan unggul mutlak di kedua barang; secara komparatif Indonesia unggul di Tekstil (DTDN 0,5 TV) dan Korea Selatan unggul di TV (DTDN 0,5 tekstil)."],
 z:[
  ["Kebijakan suatu negara menjual barang di pasar luar negeri dengan harga jauh lebih murah dibandingkan harga jual di dalam negerinya sendiri untuk menguasai pasar disebut…",["kuota impor","politik dumping","tarif bea masuk","embargo ekonomi"],1,"Politik dumping adalah diskriminasi harga internasional dengan menjual lebih murah di luar negeri daripada di pasar domestik."],
  ["Selama triwulan I, ekspor komoditas mentah Indonesia turun 15% sementara impor barang konsumsi naik 10% sehingga neraca perdagangan defisit US$1,2 miliar. Strategi struktural paling tepat adalah…",["menghentikan seluruh impor barang modal dan bahan baku pabrik","meningkatkan hilirisasi dan ekspor produk manufaktur bernilai tambah tinggi serta mengurangi ketergantungan ekspor komoditas mentah","menurunkan suku bunga agar masyarakat makin konsumtif membeli barang impor","menaikkan pajak bagi eksportir"],1,"Hilirisasi dan ekspor produk manufaktur meningkatkan nilai tambah devisa dan daya tahan terhadap fluktuasi harga komoditas mentah."],
  ["Manakah di antara berikut ini yang BUKAN merupakan hambatan perdagangan internasional?",["Proteksi tarif bea masuk yang tinggi oleh negara mitra","Pembatasan kuota impor","Kesepakatan kawasan perdagangan bebas (Free Trade Agreement)","Rendahnya standar mutu produk lokal dibanding standar internasional"],2,"Kesepakatan perdagangan bebas (FTA) justru menghapus hambatan tarif dan non-tarif untuk memperlancar arus perdagangan."]
 ],
 m:["Jika suatu negara lebih efisien secara mutlak di semua jenis barang dibanding negara lain, maka perdagangan internasional tidak akan menguntungkan.","Itulah kelemahan teori Adam Smith yang disempurnakan oleh Teori Keunggulan Komparatif David Ricardo: selama rasio biaya peluang (DTDN) kedua negara berbeda, spesialisasi pada barang dengan biaya peluang terkecil tetap meningkatkan total output dan konsumsi kedua negara!","Keunggulan komparatif melihat biaya peluang (rasio pengorbanan) terkecil, bukan jumlah output mutlak."]
},
'4.5':{
 x:["Pak Andi hendak berangkat dinas ke Amerika Serikat dengan membawa uang Rp32.000.000. Di bank tercatat Kurs Beli US$1 = Rp15.800 dan Kurs Jual US$1 = Rp16.000. Selama di Amerika Serikat, Pak Andi membelanjakan US$1.500. Sekembalinya ke Indonesia, ia menukarkan sisa dolarnya kembali ke Rupiah (kurs tidak berubah). Berapa Rupiah yang diterima Pak Andi?","Saat berangkat (menukar Rupiah menjadi US$), bank MENJUAL dolar kepada Pak Andi → gunakan KURS JUAL (Rp16.000).||Jumlah dolar yang diperoleh = Rp32.000.000 / Rp16.000 = US$2.000.||Selama di AS dibelanjakan US$1.500, sehingga sisa dolar Pak Andi = US$2.000 − US$1.500 = US$500.||Saat pulang (menukar sisa US$500 ke Rupiah), bank MEMBELI dolar dari Pak Andi → gunakan KURS BELI (Rp15.800): US$500 × Rp15.800 = Rp7.900.000.","Pak Andi memperoleh US$2.000 saat berangkat, menyisakan US$500, dan menerima Rp7.900.000 saat kembali."],
 z:[
  ["Seorang eksportir mebel di Jepara menerima pembayaran dari pembeli di Eropa sebesar US$10.000. Ketika ia menukarkan dolar tersebut menjadi Rupiah di bank dalam negeri (Kurs Beli Rp15.700; Kurs Tengah Rp15.800; Kurs Jual Rp15.900), jumlah Rupiah yang diterimanya adalah…",["Rp157.000.000","Rp158.000.000","Rp159.000.000","Rp160.000.000"],0,"Eksportir menjual dolar kepada bank, artinya bank MEMBELI valas tersebut → gunakan Kurs Beli: 10.000 × Rp15.700 = Rp157.000.000."],
  ["Apabila nilai tukar bergerak dari US$1 = Rp15.500 menjadi US$1 = Rp16.400 karena mekanisme pasar, maka dampak langsungnya terhadap perdagangan luar negeri Indonesia adalah…",["Rupiah mengalami apresiasi sehingga barang impor menjadi lebih murah","Rupiah mengalami depresiasi sehingga harga barang ekspor Indonesia menjadi lebih kompetitif (murah) bagi pembeli asing","neraca perdagangan otomatis langsung defisit","impor barang mewah melonjak tajam"],1,"Butuh lebih banyak Rupiah per US$1 berarti Rupiah terdepresiasi (melemah); hal ini membuat barang Indonesia relatif lebih murah dalam dolar sehingga mendorong ekspor."],
  ["Jika nilai ekspor barang suatu negara lebih besar daripada nilai impor barangnya (X > M), maka neraca perdagangannya mengalami…",["defisit","surplus","ekuilibrium nol","devaluasi"],1,"Neraca perdagangan = Ekspor barang − Impor barang. Jika X > M maka neraca perdagangan surplus."]
 ],
 m:["Saat kita menjual dolar ke bank, kita memakai Kurs Jual.","Kata 'Jual' dan 'Beli' pada papan kurs adalah dari sudut pandang BANK, bukan nasabah! Saat nasabah menjual dolar ke bank, pihak bank sedang MEMBELI dolar tersebut sehingga memakai Kurs Beli (angka yang lebih rendah).","Nasabah butuh valas (Rp → Valas) = pakai Kurs Jual Bank; Nasabah tukar valas ke Rp (Valas → Rp) = pakai Kurs Beli Bank."]
},

'5.0':{
 x:["Klasifikasikan akun-akun berikut ke dalam kelompok Aset Lancar, Aset Tetap, Liabilitas Jangka Pendek, Ekuitas, Pendapatan, atau Beban, serta tentukan apakah termasuk Akun Riil (Neraca) atau Akun Nominal (Laba Rugi): (1) Perlengkapan Kantor, (2) Peralatan Salon, (3) Pendapatan Diterima di Muka, (4) Sewa Dibayar di Muka, (5) Prive, (6) Beban Penyusutan Peralatan!","(1) Perlengkapan Kantor (bahan habis pakai) → Aset Lancar (Akun Riil/Neraca).||(2) Peralatan Salon (umur ekonomis > 1 tahun) → Aset Tetap (Akun Riil/Neraca).||(3) Pendapatan Diterima di Muka (uang sudah diterima tapi jasa belum dikerjakan, sehingga perusahaan berutang jasa) → Liabilitas Jangka Pendek (Akun Riil/Neraca).||(4) Sewa Dibayar di Muka → Aset Lancar (Akun Riil/Neraca). (5) Prive → Kontra Ekuitas (Akun Riil). (6) Beban Penyusutan → Beban (Akun Nominal/Laba Rugi).","(1) & (4) Aset Lancar; (2) Aset Tetap; (3) Liabilitas Jk. Pendek; (5) Kontra Ekuitas; (6) Beban (Nominal)."],
 z:[
  ["Pihak eksternal yang membutuhkan laporan keuangan perusahaan terutama untuk menilai kemampuan perusahaan dalam membayar pokok pinjaman dan bunganya tepat waktu adalah…",["manajer pemasaran","kreditor / pihak perbankan","serikat pekerja","pelanggan eceran"],1,"Kreditor (bank/pemberi pinjaman) menganalisis likuiditas dan solvabilitas perusahaan untuk memastikan pinjaman dapat dilunasi."],
  ["Manakah pasangan akun berikut yang keduanya termasuk ke dalam kelompok Aset Lancar (Current Assets)?",["Kas dan Peralatan Kantor","Piutang Usaha dan Perlengkapan","Sewa Dibayar di Muka dan Utang Usaha","Kendaraan dan Gedung"],1,"Piutang Usaha dan Perlengkapan sama-sama merupakan Aset Lancar; Peralatan, Kendaraan, dan Gedung adalah Aset Tetap."],
  ["Akun 'Pendapatan Jasa Diterima di Muka' dalam laporan posisi keuangan (neraca) dikelompokkan sebagai…",["Aset Lancar","Pendapatan Operasional","Liabilitas Jangka Pendek (Utang Jasa)","Ekuitas Pemilik"],2,"Karena uang sudah diterima tetapi jasa belum diberikan kepada pelanggan, perusahaan memiliki kewajiban (utang) untuk menyelesaikan jasa tersebut."]
 ],
 m:["Perlengkapan dan Peralatan adalah istilah yang sama dalam akuntansi.","Dalam akuntansi, Perlengkapan (Supplies) adalah bahan habis pakai kurang dari 1 tahun (kertas, tinta, sampo salon) yang masuk Aset Lancar dan tidak disusutkan; sedangkan Peralatan (Equipment) adalah aset tahan lama lebih dari 1 tahun (mesin, komputer, kursi salon) yang masuk Aset Tetap dan mengalami penyusutan.","Perlengkapan = habis pakai (Aset Lancar); Peralatan = tahan lama & disusutkan (Aset Tetap)."]
},
'5.1':{
 x:["Perusahaan jasa 'Langit Biru' milik Pak Anton melakukan tiga transaksi pada bulan Maret 2025: (A) Pak Anton menyetorkan uang tunai Rp60.000.000 sebagai modal awal; (B) Perusahaan menyewa kantor untuk 6 bulan ke depan dengan membayar lunas tunai Rp12.000.000 (dicatat sebagai aset); (C) Perusahaan menerima pendapatan jasa secara tunai Rp7.000.000. Analisis pengaruh tiap transaksi terhadap Persamaan Dasar Akuntansi (Aset = Liabilitas + Ekuitas)!","Transaksi (A): Kas bertambah Rp60.000.000 (+Aset) dan Modal Pak Anton bertambah Rp60.000.000 (+Ekuitas). Pernyataan bahwa (A) menambah aset dan ekuitas adalah BENAR.||Transaksi (B): Membayar sewa 6 bulan di muka secara tunai mengurangi Kas Rp12.000.000 (−Aset) dan menambah Sewa Dibayar di Muka Rp12.000.000 (+Aset). Ini hanyalah pertukaran sesama Aset; Liabilitas (Utang) sama sekali TIDAK berubah!||Transaksi (C): Menerima pendapatan jasa tunai menambah Kas Rp7.000.000 (+Aset) dan menambah Modal/Ekuitas Rp7.000.000 (+Ekuitas).||Posisi akhir: Total Aset = (60 − 12 + 12 + 7) = Rp67.000.000; Liabilitas = Rp0; Ekuitas = Rp67.000.000 (Seimbang!).","(A) +Aset, +Ekuitas; (B) −Kas, +Sewa Dibayar di Muka (sesama Aset, Liabilitas & Ekuitas tetap); (C) +Aset, +Ekuitas."],
 z:[
  ["Manakah di antara transaksi berikut yang secara langsung MEMENGARUHI komponen Ekuitas (Modal) dalam Persamaan Dasar Akuntansi?",["Membeli peralatan kantor secara kredit senilai Rp15.000.000","Membayar beban listrik dan telepon bulan berjalan sebesar Rp2.000.000","Menerima pelunasan piutang dari pelanggan sebesar Rp5.000.000","Melunasi utang usaha kepada pemasok sebesar Rp8.000.000"],1,"Ekuitas hanya dipengaruhi oleh 4 hal: setoran modal, pendapatan, beban, dan prive. Membayar beban listrik mengurangi Kas (−Aset) dan mengurangi Ekuitas."],
  ["Jika perusahaan membeli kendaraan operasional seharga Rp150.000.000 dengan membayar uang muka tunai Rp50.000.000 dan sisanya secara kredit, maka pengaruhnya pada persamaan dasar akuntansi adalah…",["Aset bertambah Rp150 juta dan Ekuitas bertambah Rp150 juta","Aset bersih bertambah Rp100 juta (Kendaraan +150 juta, Kas −50 juta) dan Liabilitas (Utang) bertambah Rp100 juta","Aset berkurang Rp50 juta dan Liabilitas bertambah Rp100 juta","Ekuitas berkurang Rp50 juta"],1,"Kendaraan (+150 jt) dan Kas (−50 jt) menghasilkan kenaikan bersih Aset +Rp100 juta, diimbangi kenaikan Utang (+Liabilitas) Rp100 juta."],
  ["Diketahui total Aset perusahaan Rp240.000.000 dan total Liabilitasnya Rp90.000.000. Berapakah besarnya Ekuitas pemilik?",["Rp330.000.000","Rp240.000.000","Rp150.000.000","Rp90.000.000"],2,"Aset = Liabilitas + Ekuitas → Ekuitas = Rp240.000.000 − Rp90.000.000 = Rp150.000.000."]
 ],
 m:["Membeli perlengkapan secara tunai atau menerima pelunasan piutang usaha akan menambah Ekuitas (Modal) perusahaan.","Membeli perlengkapan tunai hanya menukar Kas dengan Perlengkapan (sesama Aset). Demikian pula menerima pelunasan piutang hanya menukar Piutang Usaha menjadi Kas (pendapatannya sudah diakui saat piutang timbul). Keduanya tidak mengubah total Aset maupun Ekuitas!","Pertukaran sesama Aset (Kas ↔ Perlengkapan/Peralatan/Piutang) dan pelunasan Utang (Kas↓, Utang↓) TIDAK mengubah Ekuitas."]
},
'5.2':{
 x:["Bengkel Mobil 'Prima' menyelesaikan jasa perbaikan mobil pelanggan senilai Rp8.000.000, namun pelanggan baru membayar tunai Rp3.000.000 dan sisanya Rp5.000.000 akan dibayar bulan depan. Dua hari kemudian, bengkel membayar utang pembelian peralatan sebesar Rp4.000.000. Buatlah pencatatan Jurnal Umum untuk kedua transaksi tersebut!","Analisis Transaksi 1: Kas bertambah Rp3.000.000 (Harta + → Debit), Piutang Usaha bertambah Rp5.000.000 (Harta + → Debit), dan Pendapatan Jasa bertambah Rp8.000.000 (Pendapatan + → Kredit).||Jurnal 1: (D) Kas Rp3.000.000, (D) Piutang Usaha Rp5.000.000, pada (K) Pendapatan Jasa Rp8.000.000.||Analisis Transaksi 2: Melunasi utang membuat Utang Usaha berkurang Rp4.000.000 (Utang − → Debit) dan Kas berkurang Rp4.000.000 (Harta − → Kredit).||Jurnal 2: (D) Utang Usaha Rp4.000.000, pada (K) Kas Rp4.000.000.","Jurnal 1: Kas (D) 3 jt, Piutang (D) 5 jt / Pendapatan Jasa (K) 8 jt. Jurnal 2: Utang Usaha (D) 4 jt / Kas (K) 4 jt."],
 z:[
  ["Kelompok akun yang memiliki saldo normal di sisi DEBIT dan bertambah di sisi DEBIT adalah…",["Harta, Utang, dan Modal","Harta, Beban, dan Prive","Utang, Modal, dan Pendapatan","Pendapatan, Beban, dan Prive"],1,"Ingat jembatan keledai H–B–P (Harta, Beban, Prive): ketiganya bersaldo normal Debit dan bertambah di Debit."],
  ["Pemilik mengambil uang tunai perusahaan sebesar Rp1.500.000 untuk keperluan pribadi (Prive). Jurnal umum yang tepat adalah…",["(D) Kas Rp1.500.000 / (K) Prive Rp1.500.000","(D) Prive Rp1.500.000 / (K) Kas Rp1.500.000","(D) Beban Gaji Rp1.500.000 / (K) Kas Rp1.500.000","(D) Modal Rp1.500.000 / (K) Prive Rp1.500.000"],1,"Prive bertambah di Debit (Rp1.500.000) dan Kas berkurang di Kredit (Rp1.500.000)."],
  ["Bukti transaksi pembelian atau penjualan barang/jasa yang dilakukan secara KREDIT disebut…",["kuitansi","nota kontan","faktur (invoice)","cek"],2,"Faktur adalah bukti transaksi kredit; nota kontan adalah bukti pembelian/penjualan tunai; kuitansi adalah bukti penerimaan uang."]
 ],
 m:["Saat perusahaan menyelesaikan jasa Rp8 juta tetapi baru menerima uang Rp3 juta, Pendapatan Jasa yang dicatat di Kredit hanya Rp3 juta.","Dalam akuntansi berbasis akrual (accrual basis), pendapatan diakui penuh sebesar nilai jasa yang telah diselesaikan (Rp8 juta di Kredit), terlepas dari berapa yang sudah dibayar tunai. Selisih yang belum diterima dicatat sebagai Piutang Usaha di Debit.","Pendapatan diakui penuh saat jasa selesai: Kas (D) + Piutang Usaha (D) = Pendapatan Jasa (K)."]
},
'5.3':{
 x:["Di Neraca Saldo per 31 Desember 2025 tercatat: (1) Perlengkapan Rp4.500.000, sedangkan hasil perhitungan fisik di gudang pada 31 Desember menunjukkan sisa perlengkapan Rp1.500.000; (2) Sewa Dibayar di Muka Rp12.000.000 yang dibayar pada 1 September 2025 untuk masa 1 tahun (12 bulan). Susunlah Ayat Jurnal Penyesuaian (AJP) per 31 Desember 2025 untuk kedua data tersebut!","(1) Perlengkapan: Saldo awal Rp4.500.000, sisa akhir Rp1.500.000. Maka perlengkapan yang SUDAH TERPAKAI selama periode berjalan = 4.500.000 − 1.500.000 = Rp3.000.000.||AJP (1): (D) Beban Perlengkapan Rp3.000.000 / (K) Perlengkapan Rp3.000.000.||(2) Karena di Neraca Saldo tercatat sebagai 'Sewa Dibayar di Muka' (Pendekatan Harta), maka AJP mencatat bagian sewa yang SUDAH TERLEWATI dari 1 September s.d. 31 Desember = 4 bulan.||Nilai terpakai = (4/12) × Rp12.000.000 = Rp4.000.000. AJP (2): (D) Beban Sewa Rp4.000.000 / (K) Sewa Dibayar di Muka Rp4.000.000.","AJP 1: Beban Perlengkapan (D) / Perlengkapan (K) Rp3 juta; AJP 2: Beban Sewa (D) / Sewa Dibayar di Muka (K) Rp4 juta."],
 z:[
  ["Di Neraca Saldo tercatat akun Perlengkapan Rp6.000.000. Pada akhir periode, perlengkapan yang masih tersisa sebesar Rp2.000.000. Jurnal penyesuaian yang benar adalah…",["(D) Beban Perlengkapan Rp2.000.000 / (K) Perlengkapan Rp2.000.000","(D) Beban Perlengkapan Rp4.000.000 / (K) Perlengkapan Rp4.000.000","(D) Perlengkapan Rp4.000.000 / (K) Beban Perlengkapan Rp4.000.000","(D) Beban Perlengkapan Rp6.000.000 / (K) Kas Rp6.000.000"],1,"AJP perlengkapan mencatat jumlah yang TERPAKAI: Rp6.000.000 − Rp2.000.000 = Rp4.000.000."],
  ["Jika pada saat membayar sewa 1 tahun (1 Oktober 2025 sebesar Rp24.000.000) perusahaan mencatatnya di Neraca Saldo sebagai 'Beban Sewa' (Pendekatan Beban), maka AJP pada 31 Desember 2025 adalah…",["(D) Beban Sewa Rp6.000.000 / (K) Sewa Dibayar di Muka Rp6.000.000","(D) Sewa Dibayar di Muka Rp18.000.000 / (K) Beban Sewa Rp18.000.000","(D) Sewa Dibayar di Muka Rp6.000.000 / (K) Beban Sewa Rp6.000.000","(D) Beban Sewa Rp18.000.000 / (K) Kas Rp18.000.000"],1,"Pendekatan Beban mencatat bagian yang BELUM terpakai (9 bulan tahun depan: 9/12 × Rp24 juta = Rp18 juta) dengan mendebit Sewa Dibayar di Muka dan mengkredit Beban Sewa."],
  ["Jurnal penyesuaian untuk mencatat penyusutan peralatan kantor sebesar Rp2.500.000 adalah…",["(D) Beban Penyusutan Peralatan Rp2.500.000 / (K) Peralatan Rp2.500.000","(D) Beban Penyusutan Peralatan Rp2.500.000 / (K) Akumulasi Penyusutan Peralatan Rp2.500.000","(D) Akumulasi Penyusutan Peralatan Rp2.500.000 / (K) Beban Penyusutan Rp2.500.000","(D) Beban Peralatan Rp2.500.000 / (K) Kas Rp2.500.000"],1,"Penyusutan aset tetap selalu mengkredit akun kontra 'Akumulasi Penyusutan', bukan langsung mengurangi akun Peralatan."]
 ],
 m:["Saat diketahui sisa perlengkapan di gudang Rp1.500.000, maka angka Rp1.500.000 itulah yang ditulis dalam Ayat Jurnal Penyesuaian.","Angka Rp1.500.000 adalah saldo akhir yang harus tampil di Neraca. Agar saldo Perlengkapan di Neraca Saldo (Rp4.500.000) turun menjadi Rp1.500.000, kita harus mengkredit Perlengkapan dan mendebit Beban Perlengkapan sebesar selisih yang TERPAKAI (Rp3.000.000)!","AJP Perlengkapan selalu menggunakan nilai yang TERPAKAI (Saldo Awal − Sisa Akhir)."]
},
'5.4':{
 x:["Data keuangan Biro Desain 'Kreatifa' per 31 Desember 2025: Modal Awal (1 Januari) Rp80.000.000; Pendapatan Jasa Rp95.000.000; Pendapatan Sewa Rp5.000.000; Beban Gaji Rp22.000.000; Beban Sewa Kantor Rp8.000.000; Beban Perlengkapan Rp3.000.000; Beban Listrik & Internet Rp2.000.000; Prive Pemilik Rp10.000.000; serta Total Liabilitas (Utang) Rp25.000.000. Hitunglah: (a) Laba Bersih, (b) Modal Akhir, dan (c) Total Aset di Neraca!","(a) Laporan Laba Rugi: Total Pendapatan = 95.000.000 + 5.000.000 = Rp100.000.000. Total Beban = 22.000.000 + 8.000.000 + 3.000.000 + 2.000.000 = Rp35.000.000 (Prive TIDAK masuk beban!).||Maka Laba Bersih = Rp100.000.000 − Rp35.000.000 = Rp65.000.000.||(b) Laporan Perubahan Ekuitas: Tambahan Modal = Laba Bersih − Prive = 65.000.000 − 10.000.000 = Rp55.000.000. Maka Modal Akhir = Modal Awal + Tambahan Modal = 80.000.000 + 55.000.000 = Rp135.000.000.||(c) Neraca (Laporan Posisi Keuangan): Total Aset = Total Liabilitas + Modal Akhir = Rp25.000.000 + Rp135.000.000 = Rp160.000.000.","(a) Laba Bersih Rp65 juta; (b) Modal Akhir Rp135 juta; (c) Total Aset Rp160 juta."],
 z:[
  ["Jika diketahui Modal Awal Rp50.000.000, Modal Akhir Rp72.000.000, Prive Rp8.000.000, dan Total Beban Rp15.000.000, berapakah Total Pendapatan perusahaan pada periode tersebut?",["Rp30.000.000","Rp37.000.000","Rp45.000.000","Rp53.000.000"],2,"Modal Akhir = Modal Awal + Laba − Prive → 72 = 50 + Laba − 8 → Laba Bersih = Rp30 juta. Karena Laba = Pendapatan − Beban, maka Pendapatan = 30 + 15 = Rp45.000.000."],
  ["Dalam Kertas Kerja (Worksheet) 10 kolom, akun-akun yang dipindahkan ke kolom Laba Rugi hanyalah…",["Kas, Piutang, dan Utang","Pendapatan dan Beban (Akun Nominal)","Modal, Prive, dan Laba Bersih","Seluruh akun Aset dan Liabilitas"],1,"Kolom Laba Rugi pada Kertas Kerja hanya menampung akun nominal (Pendapatan di Kredit, Beban di Debit)."],
